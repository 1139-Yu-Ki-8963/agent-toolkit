<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202B;--sub:#5B6672;--tint:#F1F3F5;--red:#B3261E}
body{margin:0}
.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}
.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}
.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}

.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}
.bx{position:absolute;box-sizing:border-box;width:600px;min-height:140px;border-radius:20px;background:var(--tint);padding:20px 32px;text-align:center}
.nm{font-size:40px;font-weight:700;line-height:1.3}
.sb{font-size:32px;line-height:1.4}
.al{position:absolute;text-align:center;font-size:32px;font-weight:700;color:var(--ink)}
.zl{position:absolute;top:0;font-size:28px;font-weight:700;color:var(--sub)}

</helmet>

<div class="bd">

<div class="zl" style="left: 1160px">確かめる工程</div>

<g fill="none" stroke="#16202B" stroke-width="3" marker-end="url(#ah)">
<path d="M608 126H1152"/>

<div class="al" style="left: 608px; width: 552px; top: 72px">要件定義書</div>
<div class="al" style="left: 668px; width: 432px; top: 240px">基本設計書</div>

<div class="bx" style="left: 0; top: 56px"><div class="nm">要件定義</div><div class="sb">業務で何ができればよいかを決める</div></div>

<div class="bx" style="left: 120px; top: 392px"><div class="nm">詳細設計</div><div class="sb">1 画面・1 処理の中の作り方を決める</div></div>
<div class="bx" style="left: 1160px; top: 56px"><div class="nm">総合テスト</div><div class="sb">業務を通して動かす</div></div>
<div class="bx" style="left: 1100px; top: 224px"><div class="nm">結合テスト</div><div class="sb">画面と画面・機能と機能をつなぐ</div></div>
<div class="bx" style="left: 1040px; top: 392px"><div class="nm">単体テスト</div><div class="sb">1 画面・1 処理を動かす</div></div>
<div class="bx" style="left: 700px; top: 576px; width: 360px; min-height: 92px; padding: 20px 32px"><div class="nm">製造</div></div>
</div>
