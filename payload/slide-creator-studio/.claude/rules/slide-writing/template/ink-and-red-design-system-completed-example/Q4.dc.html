<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>進め方</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202B;--sub:#5B6672;--tint:#F1F3F5;--red:#B3261E}
body{margin:0}
.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}
.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}
.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}
.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}
.bd{margin-top:36px;flex:1;min-height:0;display:flex;flex-direction:column}
.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}
.pn{box-sizing:border-box;border-radius:20px;background:var(--tint);padding:32px;display:flex;flex-direction:column}
.cp{align-self:flex-start;background:var(--ink);color:#FFFFFF;font-size:28px;font-weight:700;padding:6px 24px;border-radius:999px}
.st{margin-top:20px;font-size:48px;font-weight:700}
.in{margin-top:12px;background:#FFFFFF;border-radius:12px;padding:20px 24px}
.el{font-size:28px;font-weight:700;color:var(--sub)}
.ex{margin-top:4px;font-size:36px}
.cn{display:flex;align-items:center;justify-content:center}
.cr{flex:0 0 44px;width:44px;height:44px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="s">
<div class="hd">業務システム刷新の提案</div>
<h1 class="tt">進め方</h1>
<p class="cc">設計の前提の文書化からレビューまでを 3 つの手順で進める</p>
<div class="bd">
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr) 48px minmax(0, 1fr)">
<div class="pn">
<div class="cp">手順 1</div>
<div class="st">設計の前提を、<br>文書にまとめる。</div>
<div class="in" style="margin-top: auto"><div class="el">出来上がるもの</div><div class="ex">文書ができる。</div></div>
<div class="in"><div class="el">担当</div><div class="ex">設計者が行う。</div></div>
</div>
<div class="cn"><div class="cr"><svg width="32" height="24" viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12H28M19 4L28 12L19 20" fill="none" stroke="#FFFFFF" stroke-width="3"/></svg></div></div>
<div class="pn">
<div class="cp">手順 2</div>
<div class="st">文書を、レビューの<br>前に共有する。</div>
<div class="in" style="margin-top: auto"><div class="el">出来上がるもの</div><div class="ex">文書が共有される。</div></div>
<div class="in"><div class="el">担当</div><div class="ex">設計者が行う。</div></div>
</div>
<div class="cn"><div class="cr"><svg width="32" height="24" viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12H28M19 4L28 12L19 20" fill="none" stroke="#FFFFFF" stroke-width="3"/></svg></div></div>
<div class="pn">
<div class="cp">手順 3</div>
<div class="st">共有した文書を<br>もとにレビューする。</div>
<div class="in" style="margin-top: auto"><div class="el">出来上がるもの</div><div class="ex">レビューの結果が出る。</div></div>
<div class="in"><div class="el">担当</div><div class="ex">レビュー担当者が行う。</div></div>
</div>
</div>
</div>
<div class="ft"><span>※ 「出来上がるもの」と「担当」は、サンプルのための架空の内容である。付録 1 と付録 2 は、一般的な開発工程の例である。</span><span>4</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>

return {};
}
}
</script>
</body>
</html>
