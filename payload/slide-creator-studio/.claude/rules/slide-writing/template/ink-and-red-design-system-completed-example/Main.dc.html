<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>手戻りの内訳</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--red:#B3261E}
body{margin:0}
.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}
.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}
.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}
.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}
.bd{margin-top:36px;border-top:3px solid var(--ink);padding-top:40px;flex:1;min-height:0;display:flex;flex-direction:column}
.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}
.lb{font-size:28px;font-weight:700;color:var(--sub)}
.ex{margin-top:8px;font-size:36px}
</style>
</helmet>
<div class="s">
<div class="hd">業務システム刷新の提案</div>
<h1 class="tt">手戻りの内訳</h1>
<p class="cc">手戻り全 120 件中 96 件<span style="white-space: nowrap">(8 割)</span>は、レビュー後の仕様変更で起きている</p>
<div class="bd">
<div style="flex: 1; display: grid; grid-template-columns: 600px minmax(0, 1fr); column-gap: 80px; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: center; padding-bottom: 94px">
<div style="display: flex; align-items: baseline; gap: 12px; color: var(--red); font-weight: 700"><span style="font-size: 280px; line-height: 1.3; font-variant-numeric: tabular-nums">96</span><span style="font-size: 80px">件</span></div>
<div style="font-size: 36px">手戻り全 120 件の 8 割を占める。</div>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 88px">
<div>
<div style="display: flex; font-size: 28px; font-weight: 700"><div style="flex: 0 0 80%">レビュー後の仕様変更 96 件</div><div style="flex: 0 0 20%; color: var(--sub)">ほか 24 件</div></div>
<div style="display: flex; height: 96px; margin-top: 12px"><div style="flex: 0 0 80%; background: var(--red)"></div><div style="flex: 0 0 20%; background: var(--line)"></div></div>
<div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 24px; color: var(--sub)"><span>0 件</span><span>120 件</span></div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); column-gap: 48px">
<div style="border-top: 2px solid var(--line); padding-top: 20px"><div class="lb">レビュー後の仕様変更の例</div><div class="ex">入力欄の桁数を、レビュー後に直した。</div><div class="ex">帳票の並び順を、レビュー後に直した。</div></div>
<div style="border-top: 2px solid var(--line); padding-top: 20px"><div class="lb">ほかの手戻りの例</div><div class="ex">誤字を直した。</div><div class="ex">テストをやり直した。</div></div>
</div>
</div>
</div>
</div>
<div class="ft"><span>※ 数値と例は、サンプルのための架空の内容である。数値は、2026 年 10 月末時点のものである。</span><span>1</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
