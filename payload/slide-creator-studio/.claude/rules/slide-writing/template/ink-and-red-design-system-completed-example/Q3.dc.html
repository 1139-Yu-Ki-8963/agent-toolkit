<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>変更の内容</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202B;--sub:#5B6672;--tint:#F1F3F5;--red:#B3261E}
body{margin:0}
.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}
.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}
.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}
.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}
.bd{margin-top:36px;flex:1;min-height:0;display:flex;flex-direction:column}
.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}
.pn{box-sizing:border-box;border-radius:20px;background:var(--tint);padding:32px;display:flex;flex-direction:column;gap:12px}
.cp{align-self:flex-start;background:var(--ink);color:#FFFFFF;font-size:28px;font-weight:700;padding:6px 24px;border-radius:999px;margin-bottom:8px}
.in{flex:1;background:#FFFFFF;border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;justify-content:center}
.el{font-size:28px;font-weight:700;color:var(--sub)}
.ex{margin-top:4px;font-size:40px;font-weight:500}
.cn{display:flex;align-items:center;justify-content:center}
.cr{flex:0 0 44px;width:44px;height:44px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="s">
<div class="hd">業務システム刷新の提案</div>
<h1 class="tt">変更の内容</h1>
<p class="cc">設計の前提を、レビューの前に文書で共有する</p>
<div class="bd">
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr)">
<div class="pn">
<div class="cp">変える前</div>
<div class="in"><div class="el">設計の前提の記録</div><div class="ex">文書化されていない。</div></div>
<div class="in"><div class="el">設計の前提の共有</div><div class="ex">レビューで初めて共有される。</div></div>
<div class="in"><div class="el">レビューで使う時間</div><div class="ex">設計の前提の説明に、時間を使う。</div></div>
</div>
<div class="cn"><div class="cr"><svg width="32" height="24" viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12H28M19 4L28 12L19 20" fill="none" stroke="#FFFFFF" stroke-width="3"/></svg></div></div>
<div class="pn" style="background: #FFFFFF; border: 3px solid var(--red); padding: 29px">
<div class="cp">変えた後</div>
<div class="in" style="background: var(--tint)"><div class="el">設計の前提の記録</div><div class="ex">文書にまとめる。</div></div>
<div class="in" style="background: var(--tint)"><div class="el">設計の前提の共有</div><div class="ex">レビューの前に共有する。</div></div>
<div class="in" style="background: var(--tint)"><div class="el">レビューで使う時間</div><div class="ex">設計の中身の確認に、時間を使う。</div></div>
</div>
</div>
</div>
<div class="ft"><span>※ 3 行目は、サンプルのための架空の内容である。</span><span>3</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
