<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIエージェントの誤りを止める仕組みスライド</title>
<style>
html,body{margin:0;height:100%;background:#E4E7EB;font-family:'Zen Kaku Gothic New',sans-serif;color:#16202B;overflow:hidden}
#wrap{position:absolute;left:0;top:0;right:0;bottom:56px;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;box-shadow:0 0 0 1px #C9CFD6}
#stage iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:#FFFFFF}
#stage iframe[hidden]{display:none}
#bar{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:16px}
#bar button{font:inherit;font-weight:700;width:44px;height:36px;border:2px solid #16202B;border-radius:8px;background:#FFFFFF;color:#16202B;cursor:pointer}
#bar button:active{transform:scale(.97)}
#no{min-width:80px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="prev" type="button" aria-label="前のスライド">←</button><span id="no"></span><button id="next" type="button" aria-label="次のスライド">→</button></div>
<script>
var slides = [{"title":"良い例：上で止める逆三角形","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px;letter-spacing:-0.015em}\n.bd{margin-top:36px;flex:1;min-height:0;display:flex;flex-direction:column}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.fg{width:1760px;height:680px;display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-feature-settings:'palt'}\n.nm{font-size:40px;font-weight:700}\n.ds{font-size:32px;font-weight:400}\n.lb{font-size:28px;font-weight:700}\n<\/style>\n<style>html,body{margin:0;overflow:hidden;background:#FFFFFF}<\/style><\/head><body>\n<div class=\"s\">\n<div class=\"hd\">AIエージェントの誤りを止める仕組み<\/div>\n<h1 class=\"tt\">良い例：上で止める逆三角形<\/h1>\n<p class=\"cc\">設計・型・lint・テストで先に仕組みを作れば、エージェントの誤りの多くは機械が止める<\/p>\n<div class=\"bd\">\n<svg class=\"fg\" viewBox=\"0 0 1760 680\" aria-hidden=\"true\">\n<text class=\"lb\" x=\"0\" y=\"74\" dominant-baseline=\"central\" fill=\"#5B6672\">変更 1 件<\/text>\n<text class=\"lb\" x=\"0\" y=\"110\" dominant-baseline=\"central\" fill=\"#5B6672\">ごとの<\/text>\n<text class=\"lb\" x=\"0\" y=\"146\" dominant-baseline=\"central\" fill=\"#5B6672\">確認の手間 少<\/text>\n<path d=\"M56 176V626\" stroke=\"#16202B\" stroke-width=\"3\" fill=\"none\"/>\n<path d=\"M47 614L56 632L65 614\" stroke=\"#16202B\" stroke-width=\"3\" fill=\"none\"/>\n<text class=\"lb\" x=\"0\" y=\"660\" dominant-baseline=\"central\" fill=\"#16202B\">確認の手間 多<\/text>\n<path d=\"M262 24H898M262 12V36M898 12V36\" stroke=\"#16202B\" stroke-width=\"3\" fill=\"none\"/>\n<text class=\"lb\" x=\"920\" y=\"24\" dominant-baseline=\"central\" fill=\"#16202B\">幅＝その層にかかる手間の量<\/text>\n<polygon points=\"260,58 900,58 866.7,180 293.3,180\" fill=\"#16202B\"/>\n<polygon points=\"294.2,183 865.8,183 832.5,305 327.5,305\" fill=\"#16202B\"/>\n<polygon points=\"328.3,308 831.7,308 798.3,430 361.7,430\" fill=\"#FFFFFF\" stroke=\"#16202B\" stroke-width=\"3\" stroke-dasharray=\"12 8\"/>\n<polygon points=\"362.5,433 797.5,433 764.2,555 395.8,555\" fill=\"#F1F3F5\"/>\n<polygon points=\"396.7,558 763.3,558 730,680 430,680\" fill=\"#F1F3F5\"/>\n<text class=\"nm\" x=\"317\" y=\"119\" dominant-baseline=\"central\" fill=\"#FFFFFF\">コードベース<\/text>\n<text class=\"nm\" x=\"351\" y=\"244\" dominant-baseline=\"central\" fill=\"#FFFFFF\">静的解析・制約<\/text>\n<text class=\"nm\" x=\"385\" y=\"369\" dominant-baseline=\"central\" fill=\"#16202B\">検証<\/text>\n<text class=\"nm\" x=\"419\" y=\"494\" dominant-baseline=\"central\" fill=\"#16202B\">文章<tspan>(prose)<\/tspan><\/text>\n<text class=\"nm\" x=\"450\" y=\"619\" dominant-baseline=\"central\" fill=\"#16202B\">人間のレビュー<\/text>\n<path d=\"M891 119H960M857 244H960M823 369H960M789 494H960M755 619H960\" stroke=\"#C9CFD6\" stroke-width=\"2\" fill=\"none\"/>\n<text class=\"nm\" x=\"980\" y=\"80\" dominant-baseline=\"central\" fill=\"#16202B\" textLength=\"776\" lengthAdjust=\"spacing\">API設計・アーキテクチャ・リファクタリング<\/text>\n<text class=\"ds\" x=\"980\" y=\"126\" dominant-baseline=\"central\" fill=\"#16202B\">エージェントへの最大の入力、<\/text>\n<text class=\"ds\" x=\"980\" y=\"168\" dominant-baseline=\"central\" fill=\"#16202B\">OpenAPI・スキーマ定義で手本を整える<\/text>\n<text class=\"nm\" x=\"980\" y=\"220\" dominant-baseline=\"central\" fill=\"#16202B\">lint・型・テスト・CI・DB制約<\/text>\n<text class=\"ds\" x=\"980\" y=\"270\" dominant-baseline=\"central\" fill=\"#16202B\">制約をかけ、既定で正しい実装をさせる<\/text>\n<text class=\"nm\" x=\"980\" y=\"345\" dominant-baseline=\"central\" fill=\"#16202B\">ランタイム検証<tspan>(決済など重要箇所)<\/tspan><\/text>\n<text class=\"ds\" x=\"980\" y=\"395\" dominant-baseline=\"central\" fill=\"#16202B\">形式検証は通常不要、観点漏れを拾う<\/text>\n<text class=\"nm\" x=\"980\" y=\"470\" dominant-baseline=\"central\" fill=\"#16202B\">rules・skills・AGENTS.md<\/text>\n<text class=\"ds\" x=\"980\" y=\"520\" dominant-baseline=\"central\" fill=\"#16202B\">規約・手順は設計書と同等の重さ<\/text>\n<text class=\"nm\" x=\"980\" y=\"595\" dominant-baseline=\"central\" fill=\"#16202B\">最後に残る層<tspan>(意図・UI/UX・規約遵守)<\/tspan><\/text>\n<text class=\"ds\" x=\"980\" y=\"645\" dominant-baseline=\"central\" fill=\"#16202B\">強制できない分、確認が重い<\/text>\n<\/svg>\n<\/div>\n<div class=\"ft\"><span>※ 濃い塗りはコードで強制する層、点線は必要な箇所だけに入れる層である。<\/span><span>1<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"失敗例：下にたまる砂時計","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;display:flex;flex-direction:column}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.fg{width:1760px;height:680px;display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-feature-settings:'palt'}\n.nm{font-size:40px;font-weight:700}\n.ds{font-size:32px;font-weight:400}\n.lb{font-size:28px;font-weight:700}\n<\/style>\n<style>html,body{margin:0;overflow:hidden;background:#FFFFFF}<\/style><\/head><body>\n<div class=\"s\">\n<div class=\"hd\">AIエージェントの誤りを止める仕組み<\/div>\n<h1 class=\"tt\">失敗例：下にたまる砂時計<\/h1>\n<p class=\"cc\">仕組みがない現場では、エージェントの誤りを毎回すべて人間が探す<\/p>\n<div class=\"bd\">\n<svg class=\"fg\" viewBox=\"0 0 1760 680\" aria-hidden=\"true\">\n<text class=\"lb\" x=\"0\" y=\"74\" dominant-baseline=\"central\" fill=\"#5B6672\">変更 1 件<\/text>\n<text class=\"lb\" x=\"0\" y=\"110\" dominant-baseline=\"central\" fill=\"#5B6672\">ごとの<\/text>\n<text class=\"lb\" x=\"0\" y=\"146\" dominant-baseline=\"central\" fill=\"#5B6672\">確認の手間 少<\/text>\n<path d=\"M56 176V626\" stroke=\"#16202B\" stroke-width=\"3\" fill=\"none\"/>\n<path d=\"M47 614L56 632L65 614\" stroke=\"#16202B\" stroke-width=\"3\" fill=\"none\"/>\n<text class=\"lb\" x=\"0\" y=\"660\" dominant-baseline=\"central\" fill=\"#16202B\">確認の手間 多<\/text>\n<path d=\"M362 24H798M362 12V36M798 12V36\" stroke=\"#16202B\" stroke-width=\"3\" fill=\"none\"/>\n<text class=\"lb\" x=\"920\" y=\"24\" dominant-baseline=\"central\" fill=\"#16202B\">幅＝その層にかかる手間の量<\/text>\n<polygon points=\"360,58 800,58 680,144 603,165 557,165 480,144\" fill=\"#16202B\"/>\n<polygon points=\"557,165 603,165 589,173 571,173\" fill=\"#C9CFD6\"/>\n<polygon points=\"571,173 589,173 900,680 260,680\" fill=\"#B3261E\"/>\n<text class=\"nm\" x=\"460\" y=\"94\" dominant-baseline=\"central\" fill=\"#FFFFFF\">コードベース<\/text>\n<text class=\"nm\" x=\"370\" y=\"560\" dominant-baseline=\"central\" fill=\"#FFFFFF\">人間のレビュー<\/text>\n<text class=\"ds\" x=\"370\" y=\"612\" dominant-baseline=\"central\" fill=\"#FFFFFF\">全部ここで見る<\/text>\n<path d=\"M757 94L960 90M868 615H960\" stroke=\"#C9CFD6\" stroke-width=\"2\" fill=\"none\"/>\n<path d=\"M650 154L980 230M610 165L980 336M603 169L980 442\" stroke=\"#16202B\" stroke-width=\"2\" stroke-dasharray=\"8 6\" fill=\"none\"/>\n<text class=\"nm\" x=\"980\" y=\"80\" dominant-baseline=\"central\" fill=\"#16202B\">設計・リファクタリング不足<\/text>\n<text class=\"ds\" x=\"980\" y=\"128\" dominant-baseline=\"central\" fill=\"#16202B\">手本が乱れ、悪い書き方を真似される<\/text>\n<rect x=\"981.5\" y=\"159.5\" width=\"777\" height=\"357\" rx=\"20\" fill=\"#FFFFFF\" stroke=\"#B3261E\" stroke-width=\"3\"/>\n<text class=\"nm\" x=\"1012\" y=\"202\" dominant-baseline=\"central\" fill=\"#16202B\">× lint：なし／テスト：わずか<\/text>\n<text class=\"ds\" x=\"1012\" y=\"246\" dominant-baseline=\"central\" fill=\"#16202B\">誤りが止まらずそのまま通る<\/text>\n<text class=\"nm\" x=\"1012\" y=\"308\" dominant-baseline=\"central\" fill=\"#16202B\">× 検証：なし<\/text>\n<text class=\"ds\" x=\"1012\" y=\"352\" dominant-baseline=\"central\" fill=\"#16202B\">観点漏れに誰も気づけない<\/text>\n<text class=\"nm\" x=\"1012\" y=\"414\" dominant-baseline=\"central\" fill=\"#16202B\">× rules・skills：ほぼゼロ<\/text>\n<text class=\"ds\" x=\"1012\" y=\"458\" dominant-baseline=\"central\" fill=\"#16202B\">規約・手順が伝わらず毎回ブレる<\/text>\n<text class=\"nm\" x=\"980\" y=\"600\" dominant-baseline=\"central\" fill=\"#16202B\">人間のレビュー：肥大化<\/text>\n<text class=\"ds\" x=\"980\" y=\"650\" dominant-baseline=\"central\" fill=\"#16202B\">疲弊して見落とし、属人化する<\/text>\n<\/svg>\n<\/div>\n<div class=\"ft\"><span>※ 濃い塗りはコードで強制する層、赤い枠は欠けている層、赤い塗りは負担が集中する層である。<\/span><span>2<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"}];
var stage = document.getElementById('stage');
var frames = slides.map(function (s, i) {
  var f = document.createElement('iframe');
  f.title = (i + 1) + ' ' + s.title;
  f.hidden = true;
  f.srcdoc = s.html;
  stage.appendChild(f);
  return f;
});
var cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(frames.length - 1, i));
  frames.forEach(function (f, k) { f.hidden = k !== cur; });
  document.getElementById('no').textContent = (cur + 1) + ' / ' + frames.length;
  if (location.hash !== '#' + (cur + 1)) { history.replaceState(null, '', '#' + (cur + 1)); }
}
function fit() {
  var w = window.innerWidth, h = window.innerHeight - 56;
  stage.style.transform = 'scale(' + Math.min(w / 1920, h / 1080) + ')';
}
function key(k) {
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { show(cur + 1); }
  if (k === 'ArrowLeft' || k === 'PageUp') { show(cur - 1); }
  if (k === 'Home') { show(0); }
  if (k === 'End') { show(frames.length - 1); }
}
document.addEventListener('keydown', function (e) { key(e.key); });
window.addEventListener('message', function (e) { if (e.data && e.data.slideKey) { key(e.data.slideKey); } });
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
window.addEventListener('resize', fit);
fit();
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>

</html>
