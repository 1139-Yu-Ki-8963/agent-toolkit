var slides = [{"title":"1 AI は、渡された情報だけで作る","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;width:1760px;height:720px;display:flex;flex-direction:column;gap:36px}\n.nw{white-space:nowrap}\n.cd{box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#FFFFFF}\n.cdh{background:var(--ink);color:#FFFFFF;font-size:44px;font-weight:700;padding:18px 36px}\n.cdb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 40px}\n.cdm{font-size:44px;font-weight:700;padding-bottom:28px;border-bottom:2px solid var(--line)}\n.lb{margin-top:24px;font-size:24px;font-weight:700;color:var(--sub)}\n.ex{margin-top:6px;font-size:32px}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 1 / 13<\/div>\n<h1 class=\"tt\">AI は、渡された情報だけで作る<\/h1>\n<p class=\"cc\">だから、渡す情報が出来上がりを左右する<\/p>\n<div class=\"bd\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 40px; height: 530px\">\n<div class=\"cd\">\n<div class=\"cdh\">渡した情報<\/div>\n<div class=\"cdb\">\n<div class=\"cdm\">AI はそれを読んで、そのとおりに作る<\/div>\n<div class=\"lb\">例<\/div>\n<div class=\"ex\">「登録ボタンの幅は <span class=\"nw\">200px<\/span>」と渡せば、幅 <span class=\"nw\">200px<\/span> で作る<\/div>\n<\/div>\n<\/div>\n<div class=\"cd\">\n<div class=\"cdh\">渡していない情報<\/div>\n<div class=\"cdb\">\n<div class=\"cdm\">AI は知らないので、推測で作る<\/div>\n<div class=\"lb\">例<\/div>\n<div class=\"ex\">幅を渡していなければ、AI が選んだ幅で作る。<br>意図どおりになるとは限らない<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div style=\"box-sizing: border-box; height: 150px; border: 3px solid var(--ink); border-radius: 12px; display: flex; align-items: center; padding: 0 48px; font-size: 40px; font-weight: 700\">この、AI に渡す情報を<span style=\"font-size: 72px; margin: 0 8px\">「コンテキスト」<\/span>と呼ぶ<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"2 AI 駆動開発に要るのは、コンテキストと仕組みの 2 つ","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.zd{position:absolute;box-sizing:border-box;border:3px dashed var(--sub);border-radius:12px}\n.zs{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px}\n.zl{position:absolute;font-size:26px;font-weight:700;background:#FFFFFF;padding:0 12px;line-height:1.2;white-space:nowrap}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 24px}\n.bt{font-size:34px;font-weight:700;line-height:1.3}\n.bs{margin-top:6px;font-size:24px;color:var(--sub)}\n.cd{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#FFFFFF}\n.cdh{background:var(--ink);color:#FFFFFF;font-size:38px;font-weight:700;padding:14px 30px}\n.cdb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 34px}\n.cdm{font-size:34px;font-weight:700;padding-bottom:20px;border-bottom:2px solid var(--line)}\n.lb{margin-top:16px;font-size:22px;font-weight:700;color:var(--sub)}\n.ex{margin-top:4px;font-size:26px}\n.al{position:absolute;font-size:26px;font-weight:700;line-height:1.4}\n.rd{color:var(--red)}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 2 / 13<\/div>\n<h1 class=\"tt\">AI 駆動開発に要るのは、コンテキストと仕組みの 2 つ<\/h1>\n<p class=\"cc\">内側はこの 2 つで閉じる。人は外側で、コンテキストを確認して決める<\/p>\n<div class=\"bd\">\n<div class=\"zd\" style=\"left: 0; top: 0; width: 1760px; height: 720px\"><\/div>\n<div class=\"zs\" style=\"left: 60px; top: 270px; width: 1640px; height: 420px\"><\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M420 146V302\"/>\n<path d=\"M1340 304V150\"/>\n<path d=\"M742 490H1016\"/>\n<\/g>\n<\/svg>\n<div class=\"zl\" style=\"left: 18px; top: 18px; background: transparent\">外側: 人<\/div>\n<div class=\"zl\" style=\"left: 640px; top: 254px\">内側: AI 駆動開発(人は入らない)<\/div>\n<div class=\"bx\" style=\"left: 270px; top: 24px; width: 1220px; height: 120px\"><div class=\"bt\">人は、コンテキストを確認し、無いもの・食い違うものを決めて書く<\/div><div class=\"bs\">何を作るか。資料どうしが食い違ったときに、どれを正とするか<\/div><\/div>\n<div class=\"al\" style=\"left: 440px; top: 166px\">確認して決め、<br>コンテキストに書く<\/div>\n<div class=\"al rd\" style=\"left: 1360px; top: 166px\">無い・食い違うなら、<br>止めて、外に出す<\/div>\n<div class=\"al\" style=\"left: 806px; top: 438px; width: 150px; text-align: center\">基準にする<\/div>\n<div class=\"cd\" style=\"left: 120px; top: 306px; width: 620px; height: 368px\">\n<div class=\"cdh\">コンテキスト<\/div>\n<div class=\"cdb\">\n<div class=\"cdm\">AI に渡して読ませる情報<\/div>\n<div class=\"lb\">無いと<\/div>\n<div class=\"ex\">渡していないことを、AI は知らない。<br>知らないことは作れない<\/div>\n<\/div>\n<\/div>\n<div class=\"cd\" style=\"left: 1020px; top: 306px; width: 620px; height: 368px\">\n<div class=\"cdh\">仕組み<\/div>\n<div class=\"cdb\">\n<div class=\"cdm\">AI の判断に頼らず、決まったとおりに動くもの<\/div>\n<div class=\"lb\">無いと<\/div>\n<div class=\"ex\">渡していても、AI の読み落としや<br>思い込みを止められない<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"3 回るほど、人の出番が減る","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.zd{position:absolute;box-sizing:border-box;border:3px dashed var(--sub);border-radius:12px}\n.zs{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px}\n.zl{position:absolute;font-size:26px;font-weight:700;background:#FFFFFF;padding:0 12px;line-height:1.2;white-space:nowrap}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 20px;transition:border-color 300ms ease}\n.bx.tn{background:var(--tint)}\n.bx.st{border-color:var(--red)}\n.bt{font-size:38px;font-weight:700;line-height:1.3;transition:color 300ms ease}\n.bs{margin-top:6px;font-size:24px;color:var(--sub);line-height:1.45}\n.bx.pass{border-color:var(--red)}\n.bx.pass .bt,.bx.st .bt{color:var(--red)}\n.al{position:absolute;font-size:24px;font-weight:700;line-height:1.4}\n.rd{color:var(--red)}\n.blks{position:absolute;display:flex;gap:8px}\n.blk{width:36px;height:36px;border-radius:4px;background:var(--ink)}\n.blk.n{opacity:0;transform:scale(.6);transition:opacity 400ms ease-out,transform 400ms cubic-bezier(.23,1,.32,1)}\n.blk.n.on{opacity:1;transform:scale(1)}\n.lg{position:absolute;display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;line-height:1.4;white-space:nowrap}\n.lg i{display:inline-block;width:22px;height:22px;border-radius:3px;background:var(--ink)}\n.lg i.r{background:var(--red)}\n.pk{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:3px;background:var(--ink);opacity:0;offset-anchor:center;offset-rotate:0deg;pointer-events:none}\n.pk.red{background:var(--red)}\n.pk.stop{offset-path:path('M380 260H1270');animation:pk-run 1270ms linear both}\n.pk.pass{offset-path:path('M380 260H1670');animation:pk-run 1840ms linear both}\n.pk.ret{offset-path:path('M380 260H1270V540H200V260');animation:pk-run 3600ms linear both}\n.pk.d0{animation-delay:0ms}.pk.d1{animation-delay:150ms}.pk.d2{animation-delay:300ms}.pk.d3{animation-delay:450ms}.pk.d4{animation-delay:600ms}.pk.d5{animation-delay:750ms}.pk.d6{animation-delay:900ms}\n@keyframes pk-run{0%{offset-distance:0%;opacity:0}1%{opacity:1}100%{offset-distance:100%;opacity:1}}\n.lap{position:absolute;top:652px;width:580px;height:64px;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;background:#FFFFFF;font-family:inherit;font-size:28px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:12px;padding:0 18px;cursor:pointer;text-align:left;transition:transform 120ms ease-out}\n.lap:active{transform:scale(.98)}\n.lap.cur{border:3px solid var(--ink)}\n.lap span{white-space:nowrap;flex-shrink:0}\n.mk{color:var(--red);font-size:22px;letter-spacing:2px}\n.nt{font-size:20px;font-weight:500;color:var(--sub)}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 3 / 13<\/div>\n<h1 class=\"tt\">回るほど、人の出番が減る<\/h1>\n<p class=\"cc\">人の確認を作業の中に増やさない。止まったものは、コンテキストに足す<\/p>\n<div class=\"bd\">\n<div class=\"zd\" style=\"left: 0; top: 16px; width: 400px; height: 620px\"><\/div>\n<div class=\"zs\" style=\"left: 520px; top: 16px; width: 1020px; height: 620px\"><\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M380 260H556\"/>\n<path d=\"M962 260H1036\"/>\n<path d=\"M1502 260H1576\"/>\n<path d=\"M1270 352V466\"/>\n<path d=\"M1040 540H200V354\"/>\n<\/g>\n<\/svg>\n<span class=\"{{k0}}\"><\/span><span class=\"{{k1}}\"><\/span><span class=\"{{k2}}\"><\/span><span class=\"{{k3}}\"><\/span><span class=\"{{k4}}\"><\/span><span class=\"{{k5}}\"><\/span><span class=\"{{k6}}\"><\/span>\n<span class=\"{{r0}}\"><\/span><span class=\"{{r1}}\"><\/span><span class=\"{{r2}}\"><\/span>\n<div class=\"zl\" style=\"left: 20px; top: 0\">外側: 人<\/div>\n<div class=\"zl\" style=\"left: 540px; top: 0\">内側: AI 駆動開発(人は入らない)<\/div>\n<div class=\"al\" style=\"left: 560px; top: 46px; font-size: 26px\">コンテキスト<\/div>\n<div class=\"blks\" style=\"left: 560px; top: 92px\">\n<span class=\"blk\"><\/span><span class=\"blk\"><\/span><span class=\"blk\"><\/span>\n<span class=\"{{b0}}\"><\/span><span class=\"{{b1}}\"><\/span><span class=\"{{b2}}\"><\/span><span class=\"{{b3}}\"><\/span>\n<\/div>\n<div class=\"lg\" style=\"left: 780px; top: 48px\"><i><\/i>足りているコンテキスト<i class=\"r\" style=\"margin-left: 24px\"><\/i>不足しているコンテキスト<\/div>\n<div class=\"bx tn\" style=\"left: 20px; top: 170px; width: 360px; height: 180px\"><div class=\"bt\">人が決めて、書く<\/div><div class=\"bs\">何を作るか・どれを正とするかを<br>コンテキストに書く<\/div><\/div>\n<div class=\"al\" style=\"left: 410px; top: 216px\">作業の前<\/div>\n<div class=\"bx\" style=\"left: 560px; top: 170px; width: 400px; height: 180px\"><div class=\"bt\">AI が作る<\/div><div class=\"bs\">コンテキストを読んで作る<\/div><\/div>\n<div class=\"bx\" style=\"left: 1040px; top: 170px; width: 460px; height: 180px\"><div class=\"bt\">仕組みが確かめる<\/div><div class=\"bs\">コンテキストを基準に止める。<br>人の目では見ない<\/div><\/div>\n<div class=\"{{passCls}}\" style=\"left: 1580px; top: 170px; width: 180px; height: 180px\"><div class=\"bt\">通った<\/div><div class=\"bs\">次の工程へ<\/div><\/div>\n<div class=\"bx st\" style=\"left: 1040px; top: 470px; width: 460px; height: 140px\"><div class=\"bt\">止まった<\/div><div class=\"bs\">無い・食い違うコンテキストを、<br>外に出す<\/div><\/div>\n<div class=\"al rd\" style=\"left: 545px; top: 552px; font-size: 22px\">人が、足りないコンテキストを決めて足す。<br>次の周から使われる<\/div>\n<button type=\"button\" class=\"{{l1.cls}}\" style=\"left: 0\" onClick=\"{{l1.pick}}\"><span>▸ 1 周目<\/span><span class=\"mk\">{{l1.marks}}<\/span><span class=\"nt\">{{l1.note}}<\/span><\/button>\n<button type=\"button\" class=\"{{l2.cls}}\" style=\"left: 590px\" onClick=\"{{l2.pick}}\"><span>▸ 2 周目<\/span><span class=\"mk\">{{l2.marks}}<\/span><span class=\"nt\">{{l2.note}}<\/span><\/button>\n<button type=\"button\" class=\"{{l3.cls}}\" style=\"left: 1180px\" onClick=\"{{l3.pick}}\"><span>▸ 3 周目<\/span><span class=\"mk\">{{l3.marks}}<\/span><span class=\"nt\">{{l3.note}}<\/span><\/button>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"4 コンテキストになっていないことは、AI に反映されない","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.zs{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px}\n.zl{position:absolute;font-size:28px;font-weight:700;background:#FFFFFF;padding:0 12px;line-height:1.3;white-space:nowrap;display:flex;align-items:center;gap:12px}\n.tg{background:var(--ink);color:#FFFFFF;border-radius:6px;padding:0 14px}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 24px}\n.bx.tn{background:var(--tint)}\n.bx.rb{border-color:var(--red)}\n.bx.dz{border:3px dashed var(--sub)}\n.bt{font-size:40px;font-weight:700;line-height:1.3}\n.bs{margin-top:8px;font-size:24px;color:var(--sub);line-height:1.5}\n.rd{color:var(--red)}\n.ul{margin:10px 0 0;padding:0;list-style:none;text-align:left;font-size:20px;white-space:nowrap;line-height:1.5;color:var(--sub)}\n.al{position:absolute;font-size:26px;font-weight:700;line-height:1.4}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 4 / 13<\/div>\n<h1 class=\"tt\">コンテキストになっていないことは、AI に反映されない<\/h1>\n<p class=\"cc\">会話しただけの内容も、ベテランの暗黙知も、ファイルに書かれていなければ AI は読めない。だから、決めたことはファイルに書く<\/p>\n<div class=\"bd\">\n<div class=\"zs\" style=\"left: 0; top: 18px; width: 1760px; height: 326px\"><\/div>\n<div class=\"zs\" style=\"left: 0; top: 386px; width: 1760px; height: 330px; border-color: var(--red)\"><\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs>\n<marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker>\n<marker id=\"ar\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#B3261E\"/><\/marker>\n<\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M462 190H556\"/>\n<path d=\"M1242 190H1326\"/>\n<\/g>\n<g fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\">\n<path d=\"M462 560H556\" marker-end=\"url(#ar)\"/>\n<path d=\"M494 540L522 580M522 540L494 580\" stroke-width=\"5\"/>\n<path d=\"M1242 560H1326\" stroke-dasharray=\"10 8\" marker-end=\"url(#ar)\"/>\n<\/g>\n<\/svg>\n<div class=\"zl\" style=\"left: 24px; top: 0\"><span class=\"tg\">良い例<\/span><span>決めたことを、ファイルに書いた<\/span><\/div>\n<div class=\"zl rd\" style=\"left: 24px; top: 368px\"><span class=\"tg\" style=\"background: var(--red)\">悪い例<\/span><span>決めたことが、ファイルに無い<\/span><\/div>\n<div class=\"bx tn\" style=\"left: 40px; top: 60px; width: 420px; height: 260px\"><div class=\"bt\">人が決めたこと<\/div><div class=\"bs\">ファイルに書いた<\/div><\/div>\n<div class=\"al\" style=\"left: 486px; top: 140px\">書く<\/div>\n<div class=\"bx tn\" style=\"left: 560px; top: 60px; width: 680px; height: 260px\"><div class=\"bt\">ファイルにある<\/div><div class=\"bs\">AI が読むファイルか、<br>仕組みが基準にするファイルにある<\/div><\/div>\n<div class=\"bx\" style=\"left: 1330px; top: 80px; width: 400px; height: 220px\"><div class=\"bt\">AI に反映される<\/div><div class=\"bs\">AI が読んで作る。<br>仕組みが基準にして止める。<br>次の周にも残る<\/div><\/div>\n<div class=\"bx tn rb\" style=\"left: 40px; top: 420px; width: 420px; height: 270px; align-items: flex-start; text-align: left\"><div class=\"bt rd\" style=\"align-self: center\">人が決めたこと<\/div><ul class=\"ul\"><li>・会話しただけの内容<\/li><li>・ベテランエンジニアが<br>　「こうあるべき」と思っている暗黙知<\/li><li>・過去に出た NG と、その直し方<\/li><li>・レビューで口頭で伝えた指摘<\/li><\/ul><\/div>\n<div class=\"bx dz\" style=\"left: 560px; top: 420px; width: 680px; height: 270px\"><div class=\"bt rd\">ファイルに無い<\/div><div class=\"bs\">AI が読むファイルにも、仕組みが基準にするファイルにも無い<\/div><\/div>\n<div class=\"bx rb\" style=\"left: 1330px; top: 440px; width: 400px; height: 230px\"><div class=\"bt rd\">AI に反映されない<\/div><div class=\"bs\">AI は読めない。<br>仕組みの基準にもならない<\/div><\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"5 決めたことは、このファイルに書く","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.rw{position:absolute;left:0;width:1760px;height:64px;display:flex;align-items:center}\n.nm{position:absolute;display:flex;align-items:center;gap:16px;font-size:36px;font-weight:700;white-space:nowrap}\n.mo{font-family:'Roboto Mono',monospace;font-weight:500}\n.ds{position:absolute;left:820px;font-size:30px}\n.pl{position:absolute;left:1500px;box-sizing:border-box;width:240px;height:52px;border:3px solid var(--ink);border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}\n.pl.fl{background:var(--ink);color:#FFFFFF}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 5 / 13<\/div>\n<h1 class=\"tt\">決めたことは、このファイルに書く<\/h1>\n<p class=\"cc\">AI に読ませることはコンテキストのファイルに、決まったとおりに動かすことは仕組みのファイルに書く<\/p>\n<div class=\"bd\">\n<div style=\"position: absolute; left: 76px; top: 238px; width: 1684px; height: 304px; background: var(--tint); border-radius: 10px\"><\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\">\n<path d=\"M36 52V670\"/>\n<path d=\"M36 110H86M36 190H86M36 270H86M36 590H86M36 670H86\"/>\n<path d=\"M156 300V510\"/>\n<path d=\"M156 350H206M156 430H206M156 510H206\"/>\n<\/g>\n<\/svg>\n<div class=\"nm\" style=\"left: 12px; top: 6px; font-size: 38px\"><svg width=\"40\" height=\"34\" viewBox=\"0 0 40 34\" aria-hidden=\"true\"><path d=\"M3 6h12l4 5h18v20H3z\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg>プロジェクト/<\/div>\n<div class=\"nm\" style=\"left: 96px; top: 88px\"><svg width=\"30\" height=\"38\" viewBox=\"0 0 30 38\" aria-hidden=\"true\"><path d=\"M3 3h16l8 8v24H3z M19 3v8h8\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg><span class=\"mo\">CLAUDE.md<\/span><\/div>\n<div class=\"ds\" style=\"top: 88px\">AI が毎回最初に読む<\/div>\n<div class=\"pl\" style=\"top: 84px\">コンテキスト<\/div>\n<div class=\"nm\" style=\"left: 96px; top: 168px\"><svg width=\"40\" height=\"34\" viewBox=\"0 0 40 34\" aria-hidden=\"true\"><path d=\"M3 6h12l4 5h18v20H3z\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg><span class=\"mo\">docs/<\/span><\/div>\n<div class=\"ds\" style=\"top: 168px\">要件定義書・基本設計書・開発側の設計書<\/div>\n<div class=\"pl\" style=\"top: 164px\">コンテキスト<\/div>\n<div class=\"nm\" style=\"left: 96px; top: 248px\"><svg width=\"40\" height=\"34\" viewBox=\"0 0 40 34\" aria-hidden=\"true\"><path d=\"M3 6h12l4 5h18v20H3z\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg><span class=\"mo\">.claude/<\/span><\/div>\n<div class=\"nm\" style=\"left: 216px; top: 328px\"><svg width=\"40\" height=\"34\" viewBox=\"0 0 40 34\" aria-hidden=\"true\"><path d=\"M3 6h12l4 5h18v20H3z\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg><span class=\"mo\">rules/<\/span><\/div>\n<div class=\"ds\" style=\"top: 328px\">書き方の決まりと、確かめる観点<\/div>\n<div class=\"pl\" style=\"top: 324px\">コンテキスト<\/div>\n<div class=\"nm\" style=\"left: 216px; top: 408px\"><svg width=\"40\" height=\"34\" viewBox=\"0 0 40 34\" aria-hidden=\"true\"><path d=\"M3 6h12l4 5h18v20H3z\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg><span class=\"mo\">skills/<\/span><\/div>\n<div class=\"ds\" style=\"top: 408px\">作業ごとの手順書<\/div>\n<div class=\"pl\" style=\"top: 404px\">コンテキスト<\/div>\n<div class=\"nm\" style=\"left: 216px; top: 488px\"><svg width=\"30\" height=\"38\" viewBox=\"0 0 30 38\" aria-hidden=\"true\"><path d=\"M3 3h16l8 8v24H3z M19 3v8h8\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg><span class=\"mo\">settings.json<\/span><\/div>\n<div class=\"ds\" style=\"top: 488px\">hooks。決まった時点で自動で動く<\/div>\n<div class=\"pl fl\" style=\"top: 484px\">仕組み<\/div>\n<div class=\"nm\" style=\"left: 96px; top: 568px\"><svg width=\"30\" height=\"38\" viewBox=\"0 0 30 38\" aria-hidden=\"true\"><path d=\"M3 3h16l8 8v24H3z M19 3v8h8\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg>CI と linter の設定<\/div>\n<div class=\"ds\" style=\"top: 568px\">マージ前に流す検査と、人が確認する領域の一覧<\/div>\n<div class=\"pl fl\" style=\"top: 564px\">仕組み<\/div>\n<div class=\"nm\" style=\"left: 96px; top: 648px\"><svg width=\"30\" height=\"38\" viewBox=\"0 0 30 38\" aria-hidden=\"true\"><path d=\"M3 3h16l8 8v24H3z M19 3v8h8\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" stroke-linejoin=\"round\"/><\/svg>作業記録・レビュー記録<\/div>\n<div class=\"ds\" style=\"top: 648px\">何を読み、何と比べたかを残す<\/div>\n<div class=\"pl fl\" style=\"top: 644px\">仕組み<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"6 AI 駆動開発は、4 つの原則で進める","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.bx{position:absolute;top:130px;height:200px;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:#FFFFFF;display:flex;align-items:center;gap:20px;padding:0 24px;font-size:34px;font-weight:700;line-height:1.35}\n.bx span{white-space:nowrap}\n.no{flex:0 0 60px;width:60px;height:60px;border-radius:999px;background:var(--ink);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:34px}\n.cl{position:absolute;top:400px;width:400px;border-top:3px solid var(--ink);padding-top:22px}\n.lb{font-size:24px;font-weight:700}\n.ng{margin-top:8px;font-size:36px;font-weight:700;line-height:1.4}\n.src{margin-top:22px;font-size:26px}\n.al{position:absolute;font-size:26px;font-weight:700}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 6 / 13<\/div>\n<h1 class=\"tt\">AI 駆動開発は、4 つの原則で進める<\/h1>\n<p class=\"cc\">決める → 小さく作る → 別の基準で確かめる → 直して回す。どの進め方でも、この 4 つは変わらない<\/p>\n<div class=\"bd\">\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M402 230H446\"/>\n<path d=\"M852 230H896\"/>\n<path d=\"M1302 230H1346\"/>\n<path d=\"M1555 128V56H650V126\"/>\n<\/g>\n<\/svg>\n<div class=\"al\" style=\"left: 900px; top: 10px\">通るまで、小さく作るところへ戻る<\/div>\n<div class=\"bx\" style=\"left: 0; width: 400px\"><span class=\"no\">1<\/span><span>作る前に決める<\/span><\/div>\n<div class=\"bx\" style=\"left: 450px; width: 400px\"><span class=\"no\">2<\/span><span>小さく区切る<\/span><\/div>\n<div class=\"bx\" style=\"left: 900px; width: 400px\"><span class=\"no\">3<\/span><span>基準を、作った<br>ものと別にする<\/span><\/div>\n<div class=\"bx\" style=\"left: 1350px; width: 410px\"><span class=\"no\">4<\/span><span>確かめて<br>直す反復を回す<\/span><\/div>\n<div class=\"cl\" style=\"left: 0\"><div class=\"lb\" style=\"color: var(--red)\">守らないと<\/div><div class=\"ng\">AI は、違う問題を解いたものを作る<\/div><div class=\"lb\" style=\"margin-top: 22px; color: var(--sub)\">根拠<\/div><div class=\"src\" style=\"margin-top: 4px\">Anthropic の公式ドキュメント<\/div><\/div>\n<div class=\"cl\" style=\"left: 450px\"><div class=\"lb\" style=\"color: var(--red)\">守らないと<\/div><div class=\"ng\">入力が長くなり、AI の出力が不安定になる<\/div><div class=\"lb\" style=\"margin-top: 22px; color: var(--sub)\">根拠<\/div><div class=\"src\" style=\"margin-top: 4px\">Chroma 2025、DORA 2025<\/div><\/div>\n<div class=\"cl\" style=\"left: 900px\"><div class=\"lb\" style=\"color: var(--red)\">守らないと<\/div><div class=\"ng\">作ったものの間違いを、確かめる側も引き継ぐ<\/div><div class=\"lb\" style=\"margin-top: 22px; color: var(--sub)\">根拠<\/div><div class=\"src\" style=\"margin-top: 4px\">Mathews &amp; Nagappan 2024 ほか<\/div><\/div>\n<div class=\"cl\" style=\"left: 1350px; width: 410px\"><div class=\"lb\" style=\"color: var(--red)\">守らないと<\/div><div class=\"ng\">一方通行になり、間違いが最後まで残る<\/div><div class=\"lb\" style=\"margin-top: 22px; color: var(--sub)\">根拠<\/div><div class=\"src\" style=\"margin-top: 4px\">SOEN-101、MetaGPT 上の比較実験<\/div><\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"7 受託開発では、外側は工程で区切って承認、内側は短い反復","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.zd{position:absolute;box-sizing:border-box;border:3px dashed var(--sub);border-radius:12px}\n.zs{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px}\n.zl{position:absolute;font-size:24px;font-weight:700;background:#FFFFFF;padding:0 12px;line-height:1.3;white-space:nowrap;display:flex;align-items:center;gap:12px}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 20px}\n.bx.wh{background:#FFFFFF}\n.bk{position:absolute;box-sizing:border-box;border-radius:12px;background:var(--ink);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 16px}\n.bt{font-size:34px;font-weight:700;line-height:1.3}\n.bs{margin-top:6px;font-size:22px;color:var(--sub);line-height:1.45}\n.tg{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 14px;font-size:19px;font-weight:700;line-height:28px;background:#FFFFFF;color:var(--ink);margin-bottom:8px;white-space:nowrap}\n.al{position:absolute;font-size:24px;font-weight:700;line-height:1.4}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 7 / 13<\/div>\n<h1 class=\"tt\">受託開発では、外側は工程で区切って承認、内側は短い反復<\/h1>\n<p class=\"cc\">顧客が出すのは要望。開発側の人が仕様に落とし、承認されたふるまいをテストにして、内側の基準にする<\/p>\n<div class=\"bd\">\n<div class=\"zd\" style=\"left: 0; top: 16px; width: 800px; height: 640px\"><\/div>\n<div class=\"zs\" style=\"left: 960px; top: 16px; width: 800px; height: 704px\"><\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M340 222V266\"/>\n<path d=\"M340 422V466\"/>\n<path d=\"M642 490H690V345H646\"/>\n<path d=\"M642 580H716\"/>\n<path d=\"M1102 580H1116\"/>\n<path d=\"M1260 282V496\"/>\n<path d=\"M1560 498V286\"/>\n<path d=\"M1410 652V690H340V626\"/>\n<\/g>\n<\/svg>\n<div class=\"zl\" style=\"left: 20px; top: 0\">外側: 顧客と開発側の人<\/div>\n<div class=\"zl\" style=\"left: 980px; top: 0\">内側: AI と仕組み(人は入らない)<\/div>\n<div class=\"bx\" style=\"left: 40px; top: 50px; width: 600px; height: 170px\"><span class=\"tg\">原則 1 作る前に決める<\/span><div class=\"bt\">顧客の要望を、仕様に落とす<\/div><div class=\"bs\">顧客が出すのは、やりたいこと。<br>知識のある開発側の人が、仕様にする<\/div><\/div>\n<div class=\"bx\" style=\"left: 40px; top: 270px; width: 600px; height: 150px\"><div class=\"bt\">PoC を作って、動きを見せる<\/div><div class=\"bs\">AI が TDD で作る。<br>文書ではなく、動くもので確かめてもらう<\/div><\/div>\n<div class=\"bx\" style=\"left: 40px; top: 470px; width: 600px; height: 150px\"><div class=\"bt\">顧客がふるまいを承認する<\/div><div class=\"bs\">1 つずつ承認をもらう。<br>承認が工程の区切りになる<\/div><\/div>\n<div class=\"al\" style=\"left: 702px; top: 360px; font-size: 22px\">違えば<br>直して、<br>見せ直す<\/div>\n<div class=\"bk\" style=\"left: 720px; top: 506px; width: 380px; height: 148px\"><span class=\"tg\" style=\"font-size: 17px\">原則 3 基準を、作ったものと別にする<\/span><div class=\"bt\" style=\"font-size: 30px\">承認されたふるまいを<br>テストにする<\/div><\/div>\n<div class=\"zl\" style=\"left: 1000px; top: 46px; background: transparent; padding: 0\"><span class=\"tg\" style=\"margin: 0\">原則 4 確かめて直す反復を回す<\/span><span>スクラム型の短い反復<\/span><\/div>\n<div class=\"bx wh\" style=\"left: 1120px; top: 112px; width: 580px; height: 168px\"><span class=\"tg\">原則 2 小さく区切る<\/span><div class=\"bt\">AI が小さく作る<\/div><div class=\"bs\">テストを通すように作る<\/div><\/div>\n<div class=\"al\" style=\"left: 1580px; top: 340px\">通らなければ、<br>直してまた作る<\/div>\n<div class=\"bx wh\" style=\"left: 1120px; top: 500px; width: 580px; height: 150px\"><div class=\"bt\">仕組みが確かめる<\/div><div class=\"bs\">承認されたふるまいのテストで止める<\/div><\/div>\n<div class=\"al\" style=\"left: 820px; top: 664px; font-size: 22px; background: #FFFFFF; padding: 0 8px\">通ったものを、区切りごとに顧客に見せる<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"8 工程に当てはめると、左で人が承認したものが、右のテストの基準になる","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.zd{position:absolute;box-sizing:border-box;border:3px dashed var(--sub);border-radius:12px}\n.zs{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px}\n.zl{position:absolute;font-size:24px;font-weight:700;background:#FFFFFF;padding:0 12px;line-height:1.3;white-space:nowrap}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 16px}\n.bx.tn{background:var(--tint)}\n.bx.tb .bt{font-size:30px}.bx.tb .bs{font-size:20px}\n.bk{position:absolute;box-sizing:border-box;border-radius:12px;background:var(--ink);color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 20px;font-size:26px;font-weight:700;line-height:1.4}\n.bt{font-size:34px;font-weight:700;line-height:1.3}\n.bs{margin-top:4px;font-size:22px;color:var(--sub);line-height:1.45}\n.fb{position:absolute;box-sizing:border-box;height:64px;border:2px solid var(--ink);border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;white-space:nowrap}\n.lp{position:absolute;font-size:18px;font-weight:700;color:var(--sub);white-space:nowrap}\n.al{position:absolute;font-size:24px;font-weight:700;line-height:1.4;white-space:nowrap}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 8 / 13<\/div>\n<h1 class=\"tt\">工程に当てはめると、左で人が承認したものが、右のテストの基準になる<\/h1>\n<p class=\"cc\">ウォーターフォールとの違いは 3 つ。PoC で承認をもらう。詳細設計書は作らず、テストの設計を人がチェックする。内側は短い反復で回す<\/p>\n<div class=\"bd\">\n<div class=\"zd\" style=\"left: 0; top: 16px; width: 960px; height: 500px\"><\/div>\n<div class=\"zs\" style=\"left: 540px; top: 534px; width: 1220px; height: 186px\"><\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M332 94H376\"/><path d=\"M582 94H616\"/><path d=\"M932 110H986\"/><path d=\"M1352 110H1396\"/>\n<path d=\"M332 239H376\"/><path d=\"M582 239H616\"/><path d=\"M932 255H986\"/><path d=\"M1352 255H1396\"/>\n<path d=\"M332 384H376\"/><path d=\"M582 384H616\"/><path d=\"M932 400H986\"/><path d=\"M1352 400H1396\"/>\n<path d=\"M50 420H26V275H46\"/>\n<path d=\"M1202 610H1520V466\"/>\n<path d=\"M1640 462V680H1206\"/>\n<\/g>\n<g fill=\"none\" stroke=\"#5B6672\" stroke-width=\"2\" marker-end=\"url(#ah)\">\n<path d=\"M775 128V140H480V130\"/>\n<path d=\"M775 273V285H480V275\"/>\n<path d=\"M775 418V430H480V420\"/>\n<\/g>\n<\/svg>\n<div class=\"zl\" style=\"left: 20px; top: 0\">外側: 人が承認する区切り<\/div>\n<div class=\"zl\" style=\"left: 560px; top: 518px\">内側: AI と仕組みが、短い反復で回す<\/div>\n<div class=\"bx tn\" style=\"left: 50px; top: 50px; width: 280px; height: 120px\"><div class=\"bt\">要件定義<\/div><div class=\"bs\">業務の流れ<\/div><\/div>\n<div class=\"fb\" style=\"left: 380px; top: 62px; width: 200px\">PoC を見せる<\/div>\n<div class=\"fb\" style=\"left: 620px; top: 62px; width: 310px\">顧客が承認する<\/div>\n<div class=\"lp\" style=\"left: 530px; top: 142px\">違えば直して、見せ直す<\/div>\n<div class=\"bx tn\" style=\"left: 50px; top: 195px; width: 280px; height: 120px\"><div class=\"bt\">基本設計<\/div><div class=\"bs\">画面と機能のつながり<\/div><\/div>\n<div class=\"fb\" style=\"left: 380px; top: 207px; width: 200px\">PoC を見せる<\/div>\n<div class=\"fb\" style=\"left: 620px; top: 207px; width: 310px\">顧客が承認する<\/div>\n<div class=\"lp\" style=\"left: 530px; top: 287px\">違えば直して、見せ直す<\/div>\n<div class=\"bx tn\" style=\"left: 50px; top: 340px; width: 280px; height: 120px\"><div class=\"bt\">テストの設計<\/div><div class=\"bs\">条件と期待結果<\/div><\/div>\n<div class=\"fb\" style=\"left: 380px; top: 352px; width: 200px\">AI が書く<\/div>\n<div class=\"fb\" style=\"left: 620px; top: 352px; width: 310px\">開発側の人がチェックする<\/div>\n<div class=\"lp\" style=\"left: 560px; top: 432px\">違えば、書き直す<\/div>\n<div class=\"al\" style=\"left: 40px; top: 470px; font-size: 22px; color: var(--sub)\">決められなければ、基本設計へ戻る<\/div>\n<div class=\"bk\" style=\"left: 990px; top: 50px; width: 360px; height: 120px\">承認されたふるまいを、<br>総合テストの基準にする<\/div>\n<div class=\"bk\" style=\"left: 990px; top: 195px; width: 360px; height: 120px\">承認されたふるまいを、<br>結合テストの基準にする<\/div>\n<div class=\"bk\" style=\"left: 990px; top: 340px; width: 360px; height: 120px; font-size: 23px; padding: 8px 12px\">チェックしたテストの設計を、<br>単体テストの基準にする<\/div>\n<div class=\"bx tb\" style=\"left: 1400px; top: 50px; width: 360px; height: 120px\"><div class=\"bt\">総合テスト<\/div><div class=\"bs\">業務の流れを通して確かめ、<br>通ったら顧客に見せる<\/div><\/div>\n<div class=\"bx tb\" style=\"left: 1400px; top: 195px; width: 360px; height: 120px\"><div class=\"bt\">結合テスト<\/div><div class=\"bs\">画面と機能のつながりを確かめ、<br>通ったら顧客に見せる<\/div><\/div>\n<div class=\"bx tb\" style=\"left: 1400px; top: 340px; width: 360px; height: 120px\"><div class=\"bt\">単体テスト<\/div><div class=\"bs\">チェックしたテストで確かめる<\/div><\/div>\n<div class=\"bx\" style=\"left: 600px; top: 570px; width: 600px; height: 120px\"><div class=\"bt\">製造<\/div><div class=\"bs\">AI が、テストを通すように小さく作る<\/div><\/div>\n<div class=\"al\" style=\"left: 1250px; top: 630px\">通らなければ、直してまた作る<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"9 ふるまいは、基本設計で決めきる。詳細設計へ先送りしない","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.ch{position:absolute;top:0;font-size:26px;font-weight:700;color:var(--sub);border-bottom:3px solid var(--line);padding-bottom:6px;box-sizing:border-box}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;justify-content:center;padding:10px 28px}\n.bx.tn{background:var(--tint)}\n.bx.dz{border:3px dashed var(--sub)}\n.bx.rb{border-color:var(--red)}\n.bt{font-size:36px;font-weight:700;line-height:1.3}\n.bs{margin-top:6px;font-size:24px;color:var(--sub);line-height:1.45}\n.rd{color:var(--red)}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 9 / 13<\/div>\n<h1 class=\"tt\">ふるまいは、基本設計で決めきる。詳細設計へ先送りしない<\/h1>\n<p class=\"cc\">先送りした所は、AI が推測で埋める。合格の基準は、設計書と規約だけを読んで、推測なしにテストの条件と期待結果を書けること<\/p>\n<div class=\"bd\">\n<div class=\"ch\" style=\"left: 0; width: 560px\">詳細設計で扱ってきたこと<\/div>\n<div class=\"ch\" style=\"left: 680px; width: 1080px\">これからの置き場<\/div>\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs>\n<marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker>\n<marker id=\"ar\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#B3261E\"/><\/marker>\n<\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M1162 135H1206\"/>\n<path d=\"M562 287H676\"/>\n<path d=\"M562 429H676\"/>\n<path d=\"M562 556H676\"/>\n<path d=\"M562 668H676\"/>\n<\/g>\n<path d=\"M562 135H676\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\" marker-end=\"url(#ar)\"/>\n<\/svg>\n<div class=\"bx dz\" style=\"left: 0; top: 60px; width: 560px; height: 150px\"><div class=\"bt\">ふるまい<\/div><div class=\"bs\">表示と活性の条件、入力チェック、押した後の状態、メッセージ、分岐の条件と計算式<\/div><\/div>\n<div class=\"bx tn rb\" style=\"left: 680px; top: 60px; width: 480px; height: 150px\"><div class=\"bt rd\">基本設計書で決めきる<\/div><div class=\"bs\">顧客が承認する。項目定義表、<br>条件の表、状態遷移表で書く<\/div><\/div>\n<div class=\"bx tn\" style=\"left: 1210px; top: 60px; width: 550px; height: 150px\"><div class=\"bt\">テストの設計にする<\/div><div class=\"bs\">表の 1 行、1 マスを 1 件にして、<br>開発側の人がチェックする<\/div><\/div>\n<div class=\"bx\" style=\"left: 0; top: 222px; width: 560px; height: 130px\"><div class=\"bt\">構成とデータの構造<\/div><div class=\"bs\">構成と部品の分け方、API、データベース、処理の順番、状態遷移<\/div><\/div>\n<div class=\"bx tn\" style=\"left: 680px; top: 222px; width: 1080px; height: 130px\"><div class=\"bt\">開発側の設計書に書く<\/div><div class=\"bs\">後から変えにくいので、開発側の人が作る前に決め、開発側でレビューする。OpenAPI、マイグレーション、Mermaid の図で書く<\/div><\/div>\n<div class=\"bx\" style=\"left: 0; top: 364px; width: 560px; height: 130px\"><div class=\"bt\">作り方<\/div><div class=\"bs\">共通部品の使い方、データの読み書き、例外の戻し方、ログとトランザクション<\/div><\/div>\n<div class=\"bx tn\" style=\"left: 680px; top: 364px; width: 1080px; height: 130px\"><div class=\"bt\">作り方の決まり(rules)に書く<\/div><div class=\"bs\">全画面に共通で 1 回だけ書く。レビューと lint で確かめる<\/div><\/div>\n<div class=\"bx\" style=\"left: 0; top: 506px; width: 560px; height: 100px\"><div class=\"bt\">処理の手順<\/div><div class=\"bs\">1 コードごとの、手順の解説<\/div><\/div>\n<div class=\"bx dz\" style=\"left: 680px; top: 506px; width: 1080px; height: 100px\"><div class=\"bt\">残さない<\/div><div class=\"bs\">AI が、作るときに決める<\/div><\/div>\n<div class=\"bx\" style=\"left: 0; top: 618px; width: 560px; height: 100px\"><div class=\"bt\">なぜそうしたかの説明<\/div><div class=\"bs\">判断の理由と、後から読む人への解説<\/div><\/div>\n<div class=\"bx tn\" style=\"left: 680px; top: 618px; width: 1080px; height: 100px\"><div class=\"bt\">決めた資料の中に残す<\/div><div class=\"bs\">理由は、決めたときにその資料の中に書く。解説は、要るときだけ AI が書く<\/div><\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"10 詳細設計書は作らず、詳細設計はこれらのファイルで行う","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;width:1760px;height:720px;display:flex;flex-direction:column;gap:8px}\n.g{display:grid;grid-template-columns:560px 620px 540px;column-gap:20px}\n.ch{font-size:26px;font-weight:700;color:var(--sub);border-bottom:3px solid var(--line);padding-bottom:6px}\n.c{box-sizing:border-box;height:64px;border-radius:8px;background:var(--tint);padding:0 20px;display:flex;flex-direction:column;justify-content:center}\n.c b{font-size:24px;line-height:1.3}\n.c span{font-size:18px;line-height:1.35;color:var(--sub)}\n.c.o{font-size:24px;font-weight:700}\n.m{font-family:'Roboto Mono',monospace;font-weight:500}\n.rd .c{background:#FFFFFF;border:3px solid var(--red)}\n.rd .c b,.rd .c.o{color:var(--red)}\n.why{margin-top:8px;box-sizing:border-box;height:84px;border:3px solid var(--ink);border-radius:12px;padding:0 28px;display:flex;align-items:center;font-size:26px;font-weight:700;line-height:1.4}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 10 / 13<\/div>\n<h1 class=\"tt\">詳細設計書は作らず、詳細設計はこれらのファイルで行う<\/h1>\n<p class=\"cc\">コードと 1 対 1 になるのは、単体テストのコード。テストの設計は、基本設計書の表の 1 行、1 マスと 1 対 1<\/p>\n<div class=\"bd\">\n<div class=\"g\"><div class=\"ch\">詳細設計で決めること<\/div><div class=\"ch\">設計するファイル<\/div><div class=\"ch\">何と対応するか<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>ふるまい<\/b><span>表示の条件、入力チェック、メッセージ、計算式<\/span><\/div><div class=\"c\"><b>基本設計書<\/b><span>項目定義表、条件の表、状態遷移表<\/span><\/div><div class=\"c o\">画面ごと。顧客が承認する<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>条件と期待結果<\/b><span>ふるまいを確かめる 1 件ずつ<\/span><\/div><div class=\"c\"><b>テストの設計<\/b><span>開発側の人がチェックする<\/span><\/div><div class=\"c o\">基本設計書の表の 1 行、1 マスと 1 対 1<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>API<\/b><span>外とのやり取り<\/span><\/div><div class=\"c\"><b>OpenAPI の定義(API の設計書)<\/b><span>読むページは、Swagger UI などで自動で作る<\/span><\/div><div class=\"c o\">API ごと。型とモックを作れる<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>データベース<\/b><span>テーブル、項目、制約<\/span><\/div><div class=\"c\"><b>マイグレーションのファイル<\/b><span>テーブル定義書と ER 図は、自動で描く<\/span><\/div><div class=\"c o\">テーブルごと<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>構成と処理の流れ<\/b><span>部品の分け方、部品をまたぐ処理の順番、部品の中の状態遷移<\/span><\/div><div class=\"c\"><b>開発側の設計書<\/b><span>Markdown に Mermaid の図で書く<\/span><\/div><div class=\"c o\">システム全体<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>作り方<\/b><span>共通部品、データの読み書き、例外、ログとトランザクション<\/span><\/div><div class=\"c\"><b><span class=\"m\" style=\"font-size:22px;color:inherit\">rules/coding.md<\/span> と linter の設定<\/b><span>機械で守らせられる決まりは、linter に書く<\/span><\/div><div class=\"c o\">全画面に共通<\/div><\/div>\n<div class=\"g rd\"><div class=\"c\"><b>部品の中の処理<\/b><span>処理の手順は、文書に残さない<\/span><\/div><div class=\"c\"><b>単体テストのコード<\/b><span>TDD で、コードと一緒に書く<\/span><\/div><div class=\"c o\">コードの部品と 1 対 1<\/div><\/div>\n<div class=\"g\"><div class=\"c\"><b>判断の理由<\/b><span>なぜそう決めたか<\/span><\/div><div class=\"c\"><b>それぞれのファイルの中<\/b><span>OpenAPI の description、コメント、設計書の本文<\/span><\/div><div class=\"c o\">決めたファイルごと<\/div><\/div>\n<div class=\"why\">単体テストは、コードと 1 対 1 で、コードを直すたびに通すので、コードとずれない。テストの設計を通して、基本設計書のふるまいにつながる<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"11 合格は、設計書だけを別の AI に読ませ、推測の数で確かめる","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.ch{position:absolute;top:0;font-size:26px;font-weight:700;color:var(--sub);border-bottom:3px solid var(--line);padding-bottom:6px;box-sizing:border-box}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;justify-content:center;padding:10px 28px}\n.bx.tn{background:var(--tint)}\n.bx.dz{border:3px dashed var(--sub)}\n.bx.rb{border-color:var(--red)}\n.bt{font-size:36px;font-weight:700;line-height:1.3}\n.bs{margin-top:6px;font-size:24px;color:var(--sub);line-height:1.45}\n.rd{color:var(--red)}\n.ax{position:absolute;height:0;border-top:3px solid var(--ink)}\n.bar{position:absolute;border-radius:8px 8px 0 0}\n.num{position:absolute;text-align:center;font-size:72px;font-weight:700;line-height:1.2}\n.num span{font-size:30px;margin-left:4px}\n.lb{position:absolute;text-align:center;font-size:23px;color:var(--sub);line-height:1.4}\n.lb b{display:block;font-size:28px;color:var(--ink)}\n.tc{position:absolute;text-align:center;font-size:23px;font-weight:700;color:var(--ink);border-top:2px solid var(--line);padding-top:8px;box-sizing:border-box}\n.aw{position:absolute}\n.fx{position:absolute;text-align:center;font-size:26px;font-weight:700;line-height:1.25}\n.fy{position:absolute;text-align:center;font-size:22px;color:var(--sub);line-height:1.35}\n.fy b{display:block;font-size:26px;color:var(--ink)}\n.fz{position:absolute;text-align:center;font-size:25px;font-weight:700;line-height:1.35}\n.fz span{font-size:21px;font-weight:400;color:var(--sub)}\n.nt{position:absolute;font-size:22px;color:var(--sub);line-height:1.45}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 11 / 13<\/div>\n<h1 class=\"tt\">合格は、設計書だけを別の AI に読ませ、推測の数で確かめる<\/h1>\n<p class=\"cc\">画面 1 つで試すと、推測は 32 個から 5 個に減った。表の形、資料の分け方、共通の規約の順に足した<\/p>\n<div class=\"bd\">\n<div class=\"ch\" style=\"left: 0; width: 1180px\">推測が要る箇所の数（設計書の書き方を、左から順に足した）<\/div>\n<div class=\"ch\" style=\"left: 1260px; width: 500px\">推測が出たときの直し方<\/div>\n<div class=\"ax\" style=\"left:0;top:470px;width:1180px\"><\/div>\n<div class=\"bar\" style=\"left:20px;top:118px;width:250px;height:352px;background:#16202B\"><\/div><div class=\"num\" style=\"left:20px;top:26px;width:250px\">32<span>個<\/span><\/div><div class=\"lb\" style=\"left:10px;top:486px;width:270px\"><b>文章で書く<\/b>番号ごとに 1 行<\/div><div class=\"tc\" style=\"left:10px;top:620px;width:270px\">書けたテスト 約 74 件<\/div><svg class=\"aw\" style=\"left:272px;top:420px\" width=\"36\" height=\"24\" viewBox=\"0 0 40 24\" aria-hidden=\"true\"><path d=\"M2 12H36M26 3L36 12L26 21\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\"/><\/svg><div class=\"bar\" style=\"left:310px;top:261px;width:250px;height:209px;background:#5B6672\"><\/div><div class=\"num\" style=\"left:310px;top:169px;width:250px\">19<span>個<\/span><\/div><div class=\"lb\" style=\"left:300px;top:486px;width:270px\"><b>表の形を使い分ける<\/b>項目定義表、条件の表、状態遷移表<\/div><div class=\"tc\" style=\"left:300px;top:620px;width:270px\">書けたテスト 約 140 件<\/div><svg class=\"aw\" style=\"left:562px;top:420px\" width=\"36\" height=\"24\" viewBox=\"0 0 40 24\" aria-hidden=\"true\"><path d=\"M2 12H36M26 3L36 12L26 21\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\"/><\/svg><div class=\"bar\" style=\"left:600px;top:404px;width:250px;height:66px;background:#5B6672\"><\/div><div class=\"num\" style=\"left:600px;top:312px;width:250px\">6<span>個<\/span><\/div><div class=\"lb\" style=\"left:590px;top:486px;width:270px\"><b>資料を分ける<\/b>サーバーの話は API の設計書へ<\/div><div class=\"tc\" style=\"left:590px;top:620px;width:270px\">書けたテスト 約 150 件<\/div><svg class=\"aw\" style=\"left:852px;top:420px\" width=\"36\" height=\"24\" viewBox=\"0 0 40 24\" aria-hidden=\"true\"><path d=\"M2 12H36M26 3L36 12L26 21\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\"/><\/svg><div class=\"bar\" style=\"left:890px;top:415px;width:250px;height:55px;background:#B3261E\"><\/div><div class=\"num rd\" style=\"left:890px;top:323px;width:250px\">5<span>個<\/span><\/div><div class=\"lb\" style=\"left:880px;top:486px;width:270px\"><b>共通の規約を足す<\/b>数や日付の読み方、テストの作り方<\/div><div class=\"tc\" style=\"left:880px;top:620px;width:270px\">書けたテスト 約 195 件<\/div>\n<svg width=\"500\" height=\"640\" viewBox=\"0 0 500 640\" style=\"position:absolute;left:1260px;top:60px\" aria-hidden=\"true\">\n<defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker><\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M250 96V136\"/>\n<path d=\"M250 264V290H120V326\"/>\n<path d=\"M250 264V290H380V326\"/>\n<path d=\"M120 452V506\"/>\n<path d=\"M380 452V506\"/>\n<\/g>\n<circle cx=\"250\" cy=\"52\" r=\"44\" fill=\"#FFFFFF\" stroke=\"#B3261E\" stroke-width=\"4\"/>\n<path d=\"M250 138L390 200L250 262L110 200Z\" fill=\"#F1F3F5\" stroke=\"#16202B\" stroke-width=\"3\"/>\n<path d=\"M60 506H180V610H60Z M72 530H168 M72 552H168 M72 574H140\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\"/>\n<path d=\"M320 506H440V610H320Z M332 530H428 M332 552H428 M332 574H400\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\"/>\n<\/svg>\n<div class=\"fx rd\" style=\"left:1466px;top:88px;width:88px\">推測<\/div>\n<div class=\"fx\" style=\"left:1410px;top:243px;width:200px\">どの画面にも?<\/div>\n<div class=\"fy\" style=\"left:1280px;top:392px;width:200px\"><b>はい<\/b>どの画面にも<br>当てはまる<\/div>\n<div class=\"fy\" style=\"left:1540px;top:392px;width:200px\"><b>いいえ<\/b>その画面<br>だけのこと<\/div>\n<div class=\"fz\" style=\"left:1270px;top:676px;width:220px\">共通の規約を直す<br><span>直すのは 1 回で済む<\/span><\/div>\n<div class=\"fz\" style=\"left:1530px;top:676px;width:220px\">画面の設計書を直す<\/div>\n<div class=\"nt\" style=\"left:0;top:684px;width:1180px\">会議室を予約する画面 1 つで試した。コードを見せない別の AI に読ませたのは各 1 回で、数は目安。0 個にはならないので、出るたびに右の流れで直す<\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"12 どの工程にも、決まり・手順・確かめる基準・止める仕組みを置く","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:46px;font-weight:700;line-height:1.3}\n.bd{margin-top:28px;position:relative;width:1760px;height:830px}\n.gl{position:absolute;top:0;height:34px;box-sizing:border-box;font-size:20px;font-weight:700;text-align:center;border-bottom:3px solid var(--ink)}\n.gl.dz{border-bottom:3px dashed var(--sub)}\n.sg{position:absolute;top:44px;width:215px;height:60px;background:var(--ink);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%)}\n.rl{position:absolute;left:0;width:190px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding-right:8px}\n.rl b{font-size:22px;line-height:1.3}\n.rl span{margin-top:2px;font-size:15px;color:var(--sub);line-height:1.35}\n.c{position:absolute;box-sizing:border-box;border-radius:8px;background:var(--tint);padding:8px 12px;font-size:19px;line-height:1.4;display:flex;flex-direction:column;justify-content:center}\n.c.w{background:#FFFFFF;border:3px solid var(--ink)}\n.c.k{background:var(--ink);color:#FFFFFF;font-weight:700}\n.m{font-family:'Roboto Mono',monospace;font-weight:500;font-size:16px;line-height:1.45;white-space:nowrap}\n.why{position:absolute;left:0;top:736px;width:1753px;height:86px;box-sizing:border-box;border:2px solid var(--line);border-radius:8px;padding:4px 16px;font-size:18px;line-height:1.45;display:flex;align-items:center;gap:20px}\n.why b{white-space:nowrap;font-size:20px}\n.lg{position:absolute;left:0;top:826px;font-size:16px;color:var(--sub);display:flex;align-items:center;gap:10px;white-space:nowrap}\n.sw{display:inline-block;width:28px;height:18px;border-radius:4px;box-sizing:border-box}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 12 / 13<\/div>\n<h1 class=\"tt\">どの工程にも、決まり・手順・確かめる基準・止める仕組みを置く(フロー例)<\/h1>\n<div class=\"bd\">\n<div class=\"gl dz\" style=\"left: 200px; width: 661px\">外側: 人が承認する区切り<\/div>\n<div class=\"gl\" style=\"left: 869px; width: 438px\">内側: AI と仕組みが、短い反復で回す<\/div>\n<div class=\"gl\" style=\"left: 1315px; width: 438px\">通ったら、顧客に見せる<\/div>\n<div class=\"sg\" style=\"left: 200px\">要件定義<\/div>\n<div class=\"sg\" style=\"left: 423px\">基本設計<\/div>\n<div class=\"sg\" style=\"left: 646px\">テストの設計<\/div>\n<div class=\"sg\" style=\"left: 869px\">製造<\/div>\n<div class=\"sg\" style=\"left: 1092px\">単体テスト<\/div>\n<div class=\"sg\" style=\"left: 1315px\">結合テスト<\/div>\n<div class=\"sg\" style=\"left: 1538px\">総合テスト<\/div>\n\n<div class=\"rl\" style=\"top: 120px; height: 130px\"><b>人がすること<\/b><span>顧客と開発側の人<\/span><\/div>\n<div class=\"c\" style=\"left: 200px; top: 120px; width: 215px; height: 130px\">要望を仕様に落とす。PoC で業務の流れを見せ、承認をもらう<\/div>\n<div class=\"c\" style=\"left: 423px; top: 120px; width: 215px; height: 130px\">PoC で画面と機能のつながりの承認を得る。構成とデータは開発側が決める<\/div>\n<div class=\"c\" style=\"left: 646px; top: 120px; width: 215px; height: 130px\">開発側の人が、条件と期待結果をチェックする<\/div>\n<div class=\"c\" style=\"left: 869px; top: 120px; width: 438px; height: 130px\">入らない。止まって戻ってきたときだけ、決めて rules に足す<\/div>\n<div class=\"c\" style=\"left: 1315px; top: 120px; width: 438px; height: 130px\">決めた領域に触れた変更は、マージの前に確認する。通ったものを、顧客が見る<\/div>\n\n<div class=\"rl\" style=\"top: 260px; height: 112px\"><b>決まり<\/b><span>rules。AI が読む<\/span><\/div>\n<div class=\"c\" style=\"left: 200px; top: 260px; width: 215px; height: 112px\"><span class=\"m\">rules/req.md<\/span>書き方と、確かめる観点<\/div>\n<div class=\"c\" style=\"left: 423px; top: 260px; width: 215px; height: 112px\"><span class=\"m\">rules/basic.md<\/span>表の形と、出来事のひな形<\/div>\n<div class=\"c\" style=\"left: 646px; top: 260px; width: 215px; height: 112px\"><span class=\"m\">rules/test-design.md<\/span>表の 1 行、1 マスを 1 件に<\/div>\n<div class=\"c\" style=\"left: 869px; top: 260px; width: 215px; height: 112px\"><span class=\"m\">rules/coding.md<\/span>作り方と、画面の決まり<\/div>\n<div class=\"c\" style=\"left: 1092px; top: 260px; width: 661px; height: 112px\"><span class=\"m\">rules/test.md<\/span>テストの書き方と、確かめる観点<\/div>\n\n<div class=\"rl\" style=\"top: 382px; height: 124px\"><b>手順<\/b><span>skills。AI が作る<\/span><\/div>\n<div class=\"c\" style=\"left: 200px; top: 382px; width: 215px; height: 124px\"><span class=\"m\">skills/write-req<\/span><span class=\"m\">skills/poc<\/span>要望から、仕様と PoC を作る<\/div>\n<div class=\"c\" style=\"left: 423px; top: 382px; width: 215px; height: 124px\"><span class=\"m\">skills/write-basic<\/span><span class=\"m\">skills/poc<\/span>要件定義から、仕様と PoC を作る<\/div>\n<div class=\"c\" style=\"left: 646px; top: 382px; width: 215px; height: 124px\"><span class=\"m\">skills/test-design<\/span>基本設計から、条件と期待結果を書く<\/div>\n<div class=\"c\" style=\"left: 869px; top: 382px; width: 215px; height: 124px\"><span class=\"m\">skills/implement<\/span>テストを通すように作る<\/div>\n<div class=\"c\" style=\"left: 1092px; top: 382px; width: 215px; height: 124px\"><span class=\"m\">skills/unit-test<\/span>テストの設計から作る<\/div>\n<div class=\"c\" style=\"left: 1315px; top: 382px; width: 438px; height: 124px\"><span class=\"m\">skills/e2e<\/span>承認されたふるまいから、テストを作る<\/div>\n\n<div class=\"rl\" style=\"top: 514px; height: 80px\"><b>確かめる基準<\/b><span>AI が、これと照らしてレビューする<\/span><\/div>\n<div class=\"c\" style=\"left: 200px; top: 514px; width: 215px; height: 80px\">顧客の承認<\/div>\n<div class=\"c\" style=\"left: 423px; top: 514px; width: 215px; height: 80px\">顧客の承認と、開発側のレビュー<\/div>\n<div class=\"c\" style=\"left: 646px; top: 514px; width: 215px; height: 80px\">開発側の人のチェック<\/div>\n<div class=\"c\" style=\"left: 869px; top: 514px; width: 215px; height: 80px\">単体テストと、作り方の決まり<\/div>\n<div class=\"c k\" style=\"left: 1092px; top: 514px; width: 215px; height: 80px\">チェックしたテストの設計<\/div>\n<div class=\"c k\" style=\"left: 1315px; top: 514px; width: 215px; height: 80px\">基本設計で承認されたふるまい<\/div>\n<div class=\"c k\" style=\"left: 1538px; top: 514px; width: 215px; height: 80px\">要件定義で承認されたふるまい<\/div>\n\n<div class=\"rl\" style=\"top: 604px; height: 124px\"><b>止める<\/b><span>hooks・CI<\/span><\/div>\n<div class=\"c w\" style=\"left: 200px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">Stop hook<\/span>書いていない欄・レビューの NG があれば終わらせない<\/div>\n<div class=\"c w\" style=\"left: 423px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">Stop hook<\/span>空のマス・レビューの NG があれば終わらせない<\/div>\n<div class=\"c w\" style=\"left: 646px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">Stop hook<\/span>基本設計との対応に抜けがあれば終わらせない<\/div>\n<div class=\"c w\" style=\"left: 869px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">編集のたび lint<\/span><span class=\"m\">コミット前<\/span>レビューが通らなければ止める<\/div>\n<div class=\"c w\" style=\"left: 1092px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">コミット前<\/span>単体テストとレビューが通らなければ止める<\/div>\n<div class=\"c w\" style=\"left: 1315px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">マージ前<\/span>CI が NG なら止める。通れば、bot が振り分ける<\/div>\n<div class=\"c w\" style=\"left: 1538px; top: 604px; width: 215px; height: 124px\"><span class=\"m\">リリース前<\/span>CI の E2E とレビューが NG なら止める<\/div>\n\n<div class=\"why\"><b>このしくみが動く理由<\/b><span>人がするのは、外側と、決めた領域の変更の確認だけ。要望を仕様に落として PoC で承認をもらい、構成とデータを決め、テストの設計をチェックし、戻ってきたものを rules に足す。詳細設計書は作らず、変えにくい構成とデータだけを開発側の設計書に書く。人が承認したものがテストになり、内側の基準になる。内側は、AI が rules を読んで作り、基準と照らしてレビューし、hook・CI が止める<\/span><\/div>\n<div class=\"lg\"><span class=\"sw\" style=\"border: 3px solid var(--ink)\"><\/span>機械が止める所<span class=\"sw\" style=\"background: var(--ink); margin-left: 16px\"><\/span>人が承認したもの<span style=\"margin-left: 16px\">rules・skills は読ませるだけで、守らせる力はない。守らせるのはレビューと hook・CI。ファイル名は例。一般論として描いたもので、特定の案件の仕組みではない<\/span><\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"13 マージの可否の振り分け","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:56px 80px 48px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt'}\n.hd{font-size:22px;line-height:30px;color:var(--sub)}\n.tt{margin:12px 0 0;font-size:52px;font-weight:700;line-height:1.3}\n.cc{margin:6px 0 0;font-size:32px;font-weight:700;line-height:1.4;color:var(--red)}\n.bd{margin-top:28px;position:relative;width:1760px;height:720px}\n.bx{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 24px}\n.bx.rb{border-color:var(--red);background:#FFFFFF}\n.bk{position:absolute;box-sizing:border-box;border-radius:12px;background:var(--ink);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 16px}\n.bt{font-size:34px;font-weight:700;line-height:1.3;white-space:nowrap}\n.bs{margin-top:6px;font-size:24px;color:var(--sub);line-height:1.45;white-space:nowrap}\n.bk .bs{color:#FFFFFF}\n.rd{color:var(--red)}\n.lb{margin-top:20px;font-size:22px;font-weight:700;color:var(--sub)}\n.ex{margin-top:4px;font-size:30px;line-height:1.5;white-space:nowrap}\n.al{position:absolute;font-size:26px;font-weight:700;line-height:1.4;white-space:nowrap}\n<\/style>\n<\/head><body>\n\n<div class=\"s\">\n<div class=\"hd\">理想の AI駆動開発フロー(一般論) ・ 13 / 13<\/div>\n<h1 class=\"tt\">マージの可否の振り分け<\/h1>\n<p class=\"cc\">人が確認するのは、先に決めた領域に触れた変更だけ<\/p>\n<div class=\"bd\">\n<svg width=\"1760\" height=\"720\" viewBox=\"0 0 1760 720\" style=\"position: absolute; left: 0; top: 0\" aria-hidden=\"true\">\n<defs>\n<marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#16202B\"/><\/marker>\n<marker id=\"ar\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12Z\" fill=\"#B3261E\"/><\/marker>\n<\/defs>\n<g fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\" marker-end=\"url(#ah)\">\n<path d=\"M302 318H536\"/>\n<path d=\"M982 318H1110V130H1236\"/>\n<\/g>\n<path d=\"M1110 318V505H1236\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\" marker-end=\"url(#ar)\"/>\n<\/svg>\n<div class=\"bk\" style=\"left: 0; top: 248px; width: 300px; height: 140px\"><div class=\"bt\">CI の bot<\/div><div class=\"bs\">マージの前に動く<\/div><\/div>\n<div class=\"al\" style=\"left: 300px; top: 270px; width: 240px; text-align: center\">検査を通った変更<\/div>\n<div class=\"bx\" style=\"left: 540px; top: 238px; width: 440px; height: 160px\"><div class=\"bt\">決めた領域に触れるか<\/div><div class=\"bs\">領域の一覧は、人が先に決めて書く<br>(CODEOWNERS など)<\/div><\/div>\n<div class=\"al\" style=\"left: 1122px; top: 86px\">触れない<\/div>\n<div class=\"bx\" style=\"left: 1240px; top: 40px; width: 520px; height: 180px\"><div class=\"bt\">自動でマージする<\/div><div class=\"bs\">人は見ない<\/div><\/div>\n<div class=\"al rd\" style=\"left: 1122px; top: 461px\">触れる<\/div>\n<div class=\"bx rb\" style=\"left: 1240px; top: 330px; width: 520px; height: 350px\"><div class=\"bt rd\">人が確認してからマージする<\/div><div class=\"lb\">決めた領域の例<\/div><div class=\"ex\">認証・権限(Auth)<br>課金・決済(Billing)<br>データベース(DB)<\/div><\/div>\n<\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"}];
var stage = document.getElementById('stage');
var frames = slides.map(function (s) {
  var f = document.createElement('iframe');
  f.title = s.title;
  f.hidden = true;
  f.srcdoc = s.html;
  stage.appendChild(f);
  return f;
});
var cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(frames.length - 1, i));
  frames.forEach(function (f, k) { f.hidden = k !== cur; });
  document.getElementById('no').textContent = (cur + 1) + ' / ' + frames.length;
  if (location.hash !== '#' + (cur + 1)) { history.replaceState(null, '', '#' + (cur + 1)); }
}
function fit() {
  var w = window.innerWidth, h = window.innerHeight - 56;
  stage.style.transform = 'scale(' + Math.min(w / 1920, h / 1080) + ')';
}
function key(k) {
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { show(cur + 1); }
  if (k === 'ArrowLeft' || k === 'PageUp') { show(cur - 1); }
  if (k === 'Home') { show(0); }
  if (k === 'End') { show(frames.length - 1); }
}
document.addEventListener('keydown', function (e) { key(e.key); });
window.addEventListener('message', function (e) { if (e.data && e.data.slideKey) { key(e.data.slideKey); } });
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
window.addEventListener('resize', fit);
fit();
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
