vg><\/div><\/div><div class=\"g sb\" style=\"left: 1240px; top: 392px; width: 520px\">PR の承認を合意とし、タグで版を表示する。<\/div><div class=\"g lb\" style=\"left: 1240px; top: 496px\">くわしくは 17 ページ<\/div><div class=\"g\" style=\"box-sizing: border-box; left: 28px; top: 136px; width: 120px; height: 216px; border: 3px solid var(--ink); border-radius: 16px\"><\/div><div class=\"g\" style=\"left: 42px; top: 160px; width: 92px; height: 32px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 42px; top: 208px; width: 92px; height: 32px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 42px; top: 256px; width: 92px; height: 32px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"box-sizing: border-box; left: 42px; top: 304px; width: 92px; height: 32px; border-radius: 6px; border: 3px solid var(--ink)\"><\/div><div class=\"mk\" style=\"left: 36px; top: 154px; width: 104px; height: 44px; border-radius: 8px\"><\/div><div class=\"mk\" style=\"left: 36px; top: 298px; width: 104px; height: 44px; border-radius: 8px\"><\/div><div class=\"nb\" style=\"left: 172px; top: 156px\">1<\/div><div class=\"ui\" style=\"left: 224px; top: 160px\">注文日で判定する。<\/div><div class=\"nb\" style=\"left: 172px; top: 300px\">2<\/div><div class=\"ui\" style=\"left: 224px; top: 304px\"><span class=\"nw\">1 つ<\/span>の注文に入れる。<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 648px; top: 144px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#B3261E\"/><path d=\"M12 12L28 28M28 12L12 28\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 704px; top: 148px; font-weight: 700; color: var(--red)\">ブラウザのテスト：失敗<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 648px; top: 208px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 704px; top: 212px\">md の検査：成功<\/div><div class=\"g\" style=\"left: 648px; top: 280px; width: 300px; height: 64px; border-radius: 12px; background: var(--line); font-size: 24px; font-weight: 700; line-height: 64px; text-align: center\">マージできません<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 1268px; top: 144px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 1324px; top: 148px\">PR の承認<\/div><div class=\"ui\" style=\"left: 1268px; top: 220px; color: var(--sub)\">設計書のページに出る版<\/div><div class=\"g nw\" style=\"box-sizing: border-box; left: 1268px; top: 264px; height: 52px; padding: 0 24px; border-radius: 26px; border: 3px solid var(--ink); font-size: 24px; font-weight: 700; line-height: 46px\">design/v1.0<\/div><div class=\"ac\" style=\"left: 548px; top: 200px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"ac\" style=\"left: 1168px; top: 200px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><defs><marker id=\"ah\" markerWidth=\"14\" markerHeight=\"14\" refX=\"11\" refY=\"7\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M2 2L12 7L2 12\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"3\"/><\/marker><\/def zing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">要件定義の粒度の図<\/h1>\n<p class=\"cc\">要件定義の図は、業務フローに関わる所だけに番号を付けて説明する<\/p>\n<div class=\"bd\">\n<div class=\"g lb\" style=\"left: 0; top: 0\">書くもの：要件定義書の md<\/div><div class=\"g md\" style=\"left: 0; top: 60px; width: 620px\"><div class=\"nw\">:::figure[注文の編集]<\/div><div class=\"nw\">{name=\"edit-order\" devices=\"phone\"}<\/div><div style=\"margin-top: 16px\">1. 日付のキャンペーンは、注文日で判定する。<\/div><div style=\"margin-top: 16px\">2. 同じショップの商品は、<span class=\"nw\">1 つ<\/span>の注文に入れる。<\/div><div style=\"margin-top: 16px\">:::<\/div><\/div><div class=\"g lb\" style=\"left: 0; top: 400px\">描く画面：PoC の部品<\/div><div class=\"g sb\" style=\"left: 0; top: 452px; width: 600px\">name の edit-order が、PoC の注文の編集の画面を指す。<\/div><div class=\"ac\" style=\"left: 648px; top: 300px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g lb\" style=\"left: 720px; top: 0\">表示されるもの：要件定義書のページ<\/div><div class=\"win\" style=\"left: 720px; top: 52px; width: 1040px; height: 628px\"><div class=\"bar\"><svg width=\"120\" height=\"44\" viewBox=\"0 0 120 44\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"22\" r=\"8\" fill=\"#C9CF Message({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"基本設計書の構成","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">基本設計書の構成<\/h1>\n<p class=\"cc\">基本設計書は、PoC を触っても分からないことと、承認した時点の記録を残す<\/p>\n<div class=\"bd\">\n<div class=\"g lb\" style=\"left: 30px; top: 0\">画面の地図（図は <span class=\"nw\">1 画面<\/span>に <span class=\"nw\">1 つ<\/span>）<\/div><div class=\"ph\" style=\"left: 30px; top: 62px; width: 360px; height: 528px\"><\/div><div class=\"ui\" style=\"left: 54px; top: 82px; font-weight: 700\">注文を編集<\/div><div class=\"fd\" style=\"left: 54px; top: 130px; width: 312px; height: 60px\"><span>注文日<\/span><span class=\"nw\">2026/10/25<\/span><\/div><div class=\"mk\" style=\"left: 48px; top: 124px; width: 324px; height: 72px\"><\/div><div class=\"nb\" style=\"left: 4px; top: 140px\">1<\/div><div class=\"fd\" style=\"left: 54px; top: 204px; width: 312px; height: 60px\"><span>数量<\/span><span class=\"nw\">1<\/span><\/div><div class=\"mk\" style=\"left: 48px; top: 198px; width: 324px; height: 72px\"><\/div><div class=\"nb\" style=\"left: 4px; top: 214px\">2<\/div><div class=\"fd\" style=\"left: 54px; top: 278px; width: 312px; height: 60px\"><span>クーポン<\/span><span class=\"nw\">0 円<\/span><\/div><div class=\"mk\" style=\"left: 48px; top: 272px; width: 324px; height: 72px\"><\/div><div class=\"nb\" style=\"left: 4px; top: 288px\">3<\/div><div class=\"fd\" style=\"left: 54px; top: 352px; width: 312px; height: 60px\"><span>保留<\/span><span class=\"nw\">オフ<\/span><\/div><div class=\"mk\" style=\"left: 48px; top: 346px; width: 324px; height: 72px\"><\/div><div class=\"nb\" style=\"left: 4px; top: 362px\">4<\/div><div class=\"g\" style=\"box-sizing: border-box; left: 54px; top: 426px; width: 312px; height: 60px; border: 3px solid var(--ink); border-radius: 10px; font-size: 24px; font-weight: 700; line-height: 54px; text-align: center\">同じショップの商品を追加<\/div><div class=\"mk\" style=\"left: 48px; top: 420px; width: 324px; height: 72px\"><\/div><div class=\"nb\" style=\"left: 4px; top: 436px\">5<\/div><div class=\"g\" style=\"left: 54px; top: 500px; width: 312px; height: 60px; border-radius: 10px; background: var(--ink); color: #FFFFFF; font-size: 24px; font-weight: 700; line-height: 60px; text-align: center\">保存<\/div><div class=\"mk\" style=\"left: 48px; top: 494px; width: 324px; height: 72px\"><\/div><div class=\"nb\" style=\"left: 4px; top: 510px\">6<\/div><div class=\"g lb\" style=\"left: 480px; top: 0\">設計書に残すこと<\/div><div class=\"g md nw\" style=\"left: 480px; top: 52px; font-weight: 700\">画面の地図<\/div><div class=\"ui\" style=\"left: 480px; top: 96px; width: 600px\">番号で、どの部品の話かを示す<\/div><div class=\"g md nw\" style=\"left: 1130px; top: 52px; font-weight: 700\">項目定義表<\/div><div class=\"ui\" style=\"left: 1130px; top: 96px; width: 600px\">項目ごとの初期値、必須、形式、範囲（4 ページ）<\/div><div class=\"g md nw\" style=\"left: 480px; top: 148px; font-weight: 700\">条件と期待結果の表<\/div><div class=\"ui\" style=\"left: 480px; top: 192px; width: 600px\">入力チェックと分岐。境界の値まで（5 ページ）<\/div><div class=\"g md nw\" style=\"left: 1130px; top: 148px; font-weight: 700\">状態遷移表<\/div><div class=\"ui\" style=\"left: 1130px; top: 192px; width: 600px\">状態と出来事ごとの、することと次の状態<\/div><div class=\"g md nw\" style=\"left: 480px; top: 244px; font-weight: 700\">1 行に 1 つのふるまい<\/div><div class=\"ui\" style=\"left: 480px; top: 288px; width: 600px\">どの状態でも同じに動く出来事<\/div><div class=\"g md nw\" style=\"left: 1130px; top: 244px; font-weight: 700\">保存する中身<\/div><div class=\"ui\" style=\"left: 1130px; top: 288px; width: 600px\">サーバーへ送る項目と値<\/div><div class=\"g md nw\" style=\"left: 480px; top: 340px; font-weight: 700\">PoC と本番の違い<\/div><div class=\"ui\" style=\"left: 480px; top: 384px; width: 600px\">PoC で仮にしている所と、PoC にない決めごと<\/div><div class=\"g md nw\" style=\"left: 1130px; top: 340px; font-weight: 700\">決めた理由と、承認の記録<\/div><div class=\"ui\" style=\"left: 1130px; top: 384px; width: 600px\">選ばなかった案。版、承認した人、日付<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M480 440H1760\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"g lb\" style=\"left: 480px; top: 460px\">設計書に書かないこと<\/div><div class=\"g md\" style=\"left: 480px; top: 506px; width: 1280px\">見た目の説明、操作の手順、状態ごとの図。PoC を触れば分かる。<\/div><div class=\"g md\" style=\"left: 480px; top: 558px; width: 1280px\">サーバーとのやりとり。API の設計書に書く（6 ページ）。<\/div><div class=\"g md\" style=\"left: 480px; top: 610px; width: 1280px\">どの画面にも共通の決まり。共通規約に <span class=\"nw\">1 回<\/span>だけ書く（6 ページ）。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ 合格の基準は、設計書と共通規約だけを読んで、推測なしにテストの条件と期待結果を書けること（8 ページ）。<\/span><span>3<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"ふるまいを書く 3 つの表","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">ふるまいを書く 3 つの表<\/h1>\n<p class=\"cc\">ふるまいは種類ごとに表の形を変え、決めていない所を空のマスとして見せる<\/p>\n<div class=\"bd\">\n<div class=\"g nm\" style=\"left: 0px; top: 0\">項目定義表<\/div><div class=\"g lb\" style=\"left: 0px; top: 58px; width: 540px; font-size: 24px\">項目ごとの決まり。<span class=\"nw\">1 項目<\/span> <span class=\"nw\">1 行<\/span>で、列は固定<\/div><div class=\"g lb nw\" style=\"left: 0px; top: 150px; font-size: 22px\">項目<\/div><div class=\"g lb nw\" style=\"left: 96px; top: 150px; font-size: 22px\">初期値<\/div><div class=\"g lb nw\" style=\"left: 186px; top: 150px; font-size: 22px\">範囲<\/div><div class=\"g lb nw\" style=\"left: 366px; top: 150px; font-size: 22px\">入れさせない値<\/div><div class=\"ui nw\" style=\"left: 0px; top: 194px; font-size: 22px; font-weight: 700;\">日付<\/div><div class=\"ui nw\" style=\"left: 96px; top: 194px; font-size: 22px;\">今日<\/div><div class=\"ui nw\" style=\"left: 186px; top: 194px; font-size: 22px;\">今日〜90 日後<\/div><div class=\"ui nw\" style=\"left: 366px; top: 194px; font-size: 22px;\">対象外<\/div><div class=\"ui nw\" style=\"left: 0px; top: 244px; font-size: 22px; font-weight: 700;\">人数<\/div><div class=\"ui nw\" style=\"left: 96px; top: 244px; font-size: 22px;\">空<\/div><div class=\"ui nw\" style=\"left: 186px; top: 244px; font-size: 22px;\">1〜定員<\/div><div class=\"ui nw\" style=\"left: 366px; top: 244px; font-size: 22px;\">4 文字目から<\/div><div class=\"ui nw\" style=\"left: 0px; top: 294px; font-size: 22px; font-weight: 700;\">備考<\/div><div class=\"ui nw\" style=\"left: 96px; top: 294px; font-size: 22px;\">空<\/div><div class=\"ui nw\" style=\"left: 186px; top: 294px; font-size: 22px;\">対象外<\/div><div class=\"ui nw\" style=\"left: 366px; top: 294px; font-size: 22px;\">201 文字目から<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M0 188H540\" stroke=\"#16202B\" stroke-width=\"3\"/><path d=\"M0 238H540\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><path d=\"M0 288H540\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><path d=\"M0 338H540\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"mk\" style=\"left: 176px; top: 290px; width: 176px; height: 46px; border-radius: 8px\"><\/div><div class=\"ui\" style=\"left: 0px; top: 356px; width: 540px; color: var(--red); font-weight: 700\">当てはまらないマスも、空にせず「対象外」と書く<\/div><div class=\"g lb\" style=\"left: 0px; top: 432px; font-size: 24px\">この形にして見つかった穴<\/div><div class=\"ui\" style=\"left: 0px; top: 472px; width: 540px\">きざみ外の時刻、全角の数字、文字数の上限<\/div><div class=\"g nm\" style=\"left: 610px; top: 0\">条件と期待結果の表<\/div><div class=\"g lb\" style=\"left: 610px; top: 58px; width: 540px; font-size: 24px\">条件の組み合わせで結果が変わる判定<\/div><div class=\"g lb nw\" style=\"left: 610px; top: 150px; font-size: 22px\">条件<\/div><div class=\"g lb nw\" style=\"left: 900px; top: 150px; font-size: 22px\">期待結果<\/div><div class=\"ui nw\" style=\"left: 610px; top: 194px; font-size: 22px; font-weight: 700;\">人数が、定員と同じ<\/div><div class=\"ui nw\" style=\"left: 900px; top: 194px; font-size: 22px;\">エラーなし<\/div><div class=\"ui nw\" style=\"left: 610px; top: 244px; font-size: 22px; font-weight: 700;\">人数が、定員より多い<\/div><div class=\"ui nw\" style=\"left: 900px; top: 244px; font-size: 22px;\">定員の文言<\/div><div class=\"ui nw\" style=\"left: 610px; top: 294px; font-size: 22px; font-weight: 700;\">開始時刻が 10:07<\/div><div class=\"ui nw\" style=\"left: 900px; top: 294px; font-size: 22px;\">きざみの文言<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M610 188H1150\" stroke=\"#16202B\" stroke-width=\"3\"/><path d=\"M610 238H1150\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><path d=\"M610 288H1150\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><path d=\"M610 338H1150\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"mk\" style=\"left: 890px; top: 190px; width: 246px; height: 46px; border-radius: 8px\"><\/div><div class=\"ui\" style=\"left: 610px; top: 356px; width: 540px; color: var(--red); font-weight: 700\">「エラーなし」になる境界の値も、行にする<\/div><div class=\"g lb\" style=\"left: 610px; top: 432px; font-size: 24px\">この形にして見つかった穴<\/div><div class=\"ui\" style=\"left: 610px; top: 472px; width: 540px\">境界のどちら側か、エラーが重なったときの順<\/div><div class=\"g nm\" style=\"left: 1220px; top: 0\">状態遷移表<\/div><div class=\"g lb\" style=\"left: 1220px; top: 58px; width: 540px; font-size: 24px\">状態によって動きが変わる出来事<\/div><div class=\"g lb nw\" style=\"left: 1220px; top: 150px; font-size: 22px\"><\/div><div class=\"g lb nw\" style=\"left: 1330px; top: 150px; font-size: 22px\">予約するを押す<\/div><div class=\"g lb nw\" style=\"left: 1550px; top: 150px; font-size: 22px\">保存が成功する<\/div><div class=\"ui nw\" style=\"left: 1220px; top: 194px; font-size: 22px; font-weight: 700;\">入力中<\/div><div class=\"ui nw\" style=\"left: 1330px; top: 194px; font-size: 22px;\">送信中へ<\/div><div class=\"ui nw\" style=\"left: 1550px; top: 194px; font-size: 22px;\">起きない<\/div><div class=\"ui nw\" style=\"left: 1220px; top: 244px; font-size: 22px; font-weight: 700;\">送信中<\/div><div class=\"ui nw\" style=\"left: 1330px; top: 244px; font-size: 22px;\">できない<\/div><div class=\"ui nw\" style=\"left: 1550px; top: 244px; font-size: 22px;\">完了へ<\/div><div class=\"ui nw\" style=\"left: 1220px; top: 294px; font-size: 22px; font-weight: 700;\">完了<\/div><div class=\"ui nw\" style=\"left: 1330px; top: 294px; font-size: 22px;\">できない<\/div><div class=\"ui nw\" style=\"left: 1550px; top: 294px; font-size: 22px;\">起きない<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M1220 188H1760\" stroke=\"#16202B\" stroke-width=\"3\"/><path d=\"M1220 238H1760\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><path d=\"M1220 288H1760\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><path d=\"M1220 338H1760\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"mk\" style=\"left: 1320px; top: 240px; width: 216px; height: 46px; border-radius: 8px\"><\/div><div class=\"ui\" style=\"left: 1220px; top: 356px; width: 540px; color: var(--red); font-weight: 700\">「起きない」「できない」も、マスに書く<\/div><div class=\"g lb\" style=\"left: 1220px; top: 432px; font-size: 24px\">この形にして見つかった穴<\/div><div class=\"ui\" style=\"left: 1220px; top: 472px; width: 540px\">送信中のキャンセル、完了した後の動き<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M575 0V540M1185 0V540\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"g md\" style=\"left: 0; top: 584px; width: 1760px\"><b>どれにも当てはまらない動き<\/b>（押すと一覧が開く、など）は、<span class=\"nw\">1 行<\/span>に <span class=\"nw\">1 つ<\/span>、きっかけ・条件・結果で書く。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ 文章で書くと、書いた人が思いついた行しか並ばない。例は、サンプルの「会議室の予約」のもの。<\/span><span>4<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"条件と期待結果の表","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">条件と期待結果の表<\/h1>\n<p class=\"cc\">条件と期待結果はデータに 1 回だけ書き、設計書の表と単体テストの両方がそこから出る<\/p>\n<div class=\"bd\">\n<div class=\"g nm\" style=\"left: 0; top: 0\">データ<\/div><div class=\"g lb\" style=\"left: 0; top: 60px\">AI が、<span class=\"nw\">1 回<\/span>だけ書く<\/div><div class=\"g md\" style=\"left: 0; top: 136px\"><div class=\"nw\">condition: \"人数が、定員と同じ\"<\/div><div class=\"nw\">change: { people: \"6\" }<\/div><div class=\"nw\">expected: エラーなし<\/div><\/div><div class=\"g md\" style=\"left: 0; top: 300px\"><div class=\"nw\">condition: \"人数が、定員より多い\"<\/div><div class=\"nw\">change: { people: \"7\" }<\/div><div class=\"nw\">expected: \"会議室 A の定員は 6 人です\"<\/div><\/div><div class=\"ac\" style=\"left: 640px; top: 130px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"ac\" style=\"left: 640px; top: 330px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g nm\" style=\"left: 740px; top: 0\">設計書の表<\/div><div class=\"g lb\" style=\"left: 740px; top: 60px\">md には ::table と書く。行は、データから出る<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M740 148H1760\" stroke=\"#16202B\" stroke-width=\"3\"/><g stroke=\"#C9CFD6\" stroke-width=\"2\"><path d=\"M740 200H1760\"/><path d=\"M740 252H1760\"/><\/g><\/svg><div class=\"g lb\" style=\"left: 740px; top: 108px\">条件<\/div><div class=\"g lb\" style=\"left: 1140px; top: 108px\">入力の例<\/div><div class=\"g lb\" style=\"left: 1340px; top: 108px\">期待結果<\/div><div class=\"ui nw\" style=\"left: 740px; top: 158px\">人数が、定員と同じ<\/div><div class=\"ui nw\" style=\"left: 1140px; top: 158px\">人数: 6<\/div><div class=\"ui nw\" style=\"left: 1340px; top: 158px\">エラーなし<\/div><div class=\"ui nw\" style=\"left: 740px; top: 210px\">人数が、定員より多い<\/div><div class=\"ui nw\" style=\"left: 1140px; top: 210px\">人数: 7<\/div><div class=\"ui nw\" style=\"left: 1340px; top: 210px\">会議室 A の定員は 6 人です<\/div><div class=\"g nm\" style=\"left: 740px; top: 290px\">単体テスト<\/div><div class=\"g lb\" style=\"left: 740px; top: 350px\">同じデータを、<span class=\"nw\">1 行<\/span>ずつ回す<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 740px; top: 400px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 796px; top: 404px\">人数が、定員と同じ（人数: 6）<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 740px; top: 452px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 796px; top: 456px\">人数が、定員より多い（人数: 7）<\/div><div class=\"g md\" style=\"left: 0; top: 548px; width: 1760px\"><b>実際に見つけたずれ<\/b>：表は「会議室 A の定員は…」、コードは「会議室 Aの定員は…」。空白の違いで、テストが落ちた。<\/div><div class=\"g md\" style=\"left: 0; top: 596px; width: 1760px\"><b>まだ人が書く所<\/b>：状態遷移表の「すること」の文。書き間違えても、止まらない。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ 項目定義表と状態遷移表も、同じ仕組みでデータから出す。例は、サンプルの「会議室の予約」のもの。<\/span><span>5<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"設計書と規約の分け方","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">設計書と規約の分け方<\/h1>\n<p class=\"cc\">画面の設計書には画面の中だけを書き、サーバーと共通の決まりは別の資料に書く<\/p>\n<div class=\"bd\">\n<svg width=\"120\" height=\"150\" viewBox=\"0 0 120 150\" style=\"position: absolute; left: 0px; top: 0px\" aria-hidden=\"true\"><path d=\"M4 4H84L116 36V146H4Z\" fill=\"#F1F3F5\" stroke=\"#16202B\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M84 4V36H116\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M24 66H96M24 90H96M24 114H72\" stroke=\"#16202B\" stroke-width=\"4\"/><\/svg><div class=\"g nm\" style=\"left: 150px; top: 20px\">共通規約<\/div><div class=\"g lb\" style=\"left: 150px; top: 80px\">全画面で <span class=\"nw\">1 回<\/span>だけ書く<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 0px; top: 200px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 28px; top: 190px; width: 500px\">設計書の書き方（表の形、出来事のひな形、読み方）<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 0px; top: 284px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 28px; top: 274px; width: 500px\">入力欄の決まり（+4 や 4.0 は、整数と認めない）<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 0px; top: 368px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 28px; top: 358px; width: 500px\">画面を開くまでの表示<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 0px; top: 452px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 28px; top: 442px; width: 500px\">テストの作り方（<span class=\"nw\">1 行<\/span>、<span class=\"nw\">1 マス<\/span>が <span class=\"nw\">1 件<\/span>）<\/div><svg width=\"120\" height=\"150\" viewBox=\"0 0 120 150\" style=\"position: absolute; left: 610px; top: 0px\" aria-hidden=\"true\"><path d=\"M4 4H84L116 36V146H4Z\" fill=\"#FFFFFF\" stroke=\"#B3261E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M84 4V36H116\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M24 66H96M24 90H96M24 114H72\" stroke=\"#B3261E\" stroke-width=\"4\"/><\/svg><div class=\"g nm\" style=\"left: 760px; top: 20px; color: var(--red)\">画面の設計書<\/div><div class=\"g lb\" style=\"left: 760px; top: 80px\">画面ごとに書く<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 610px; top: 200px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#B3261E\"/><\/svg><div class=\"ui\" style=\"left: 638px; top: 190px; width: 500px\">画面の地図と、<span class=\"nw\">3 つ<\/span>の表<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 610px; top: 284px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#B3261E\"/><\/svg><div class=\"ui\" style=\"left: 638px; top: 274px; width: 500px\">この画面が受け取る応答の名前（成功する、断られる、失敗する）<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 610px; top: 368px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#B3261E\"/><\/svg><div class=\"ui\" style=\"left: 638px; top: 358px; width: 500px\">この画面で書かないことと、書く場所<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 610px; top: 452px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#B3261E\"/><\/svg><div class=\"ui\" style=\"left: 638px; top: 442px; width: 500px\">PoC と本番の違い、決めた理由<\/div><svg width=\"120\" height=\"150\" viewBox=\"0 0 120 150\" style=\"position: absolute; left: 1220px; top: 0px\" aria-hidden=\"true\"><path d=\"M4 4H84L116 36V146H4Z\" fill=\"#FFFFFF\" stroke=\"#16202B\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M84 4V36H116\" fill=\"none\" stroke=\"#16202B\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M24 66H96M24 90H96M24 114H72\" stroke=\"#16202B\" stroke-width=\"4\"/><\/svg><div class=\"g nm\" style=\"left: 1370px; top: 20px\">API の設計書<\/div><div class=\"g lb\" style=\"left: 1370px; top: 80px\">API ごとに書く<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 1220px; top: 200px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 1248px; top: 190px; width: 500px\">宛先、項目の名前と型<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 1220px; top: 284px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 1248px; top: 274px; width: 500px\">応答の形と、成功・断られる・失敗の見分け方<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 1220px; top: 368px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 1248px; top: 358px; width: 500px\">応答を待つ秒数<\/div><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" style=\"position: absolute; left: 1220px; top: 452px\" aria-hidden=\"true\"><rect width=\"12\" height=\"12\" fill=\"#16202B\"/><\/svg><div class=\"ui\" style=\"left: 1248px; top: 442px; width: 500px\">「今日」の決め方、一覧の並び順<\/div><div class=\"ac\" style=\"left: 548px; top: 52px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"ac\" style=\"left: 1158px; top: 52px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g lb nw\" style=\"left: 380px; top: 124px; width: 215px; text-align: right; font-size: 22px\">書き方に従う<\/div><div class=\"g lb nw\" style=\"left: 880px; top: 124px; width: 325px; text-align: right; font-size: 22px\">出来事の名前で受け取る<\/div><div class=\"g md\" style=\"left: 0; top: 560px; width: 1760px\"><b>分けた結果<\/b>：サーバーの話を画面の設計書から外すと、推測は 19 個から 6 個に減った（8 ページ）。<\/div><div class=\"g md\" style=\"left: 0; top: 608px; width: 1760px\"><b>代わりに要るもの<\/b>：API の設計書。結合テストは、画面の設計書だけでは書けない。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ 出来事のひな形や合格の基準は、書き方の決まりなので、画面の設計書ではなく共通規約に書く。<\/span><span>6<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"規約からテストを作る流れ","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">規約からテストを作る流れ<\/h1>\n<p class=\"cc\">テストは、共通規約の作り方に従い、表の 1 行、1 マスから 1 件ずつ作る<\/p>\n<div class=\"bd\">\n<div class=\"g nm\" style=\"left: 0px; top: 0\">条件と期待結果の表<\/div><div class=\"g lb\" style=\"left: 0px; top: 58px; width: 540px; font-size: 24px\"><span class=\"nw\">1 行<\/span>につき <span class=\"nw\">1 件<\/span>。表の順のまま回す<\/div><div class=\"g lb\" style=\"left: 0px; top: 136px; font-size: 22px\">設計書の表<\/div><div class=\"fd\" style=\"left: 0px; top: 176px; width: 540px; height: 54px; font-size: 22px\"><span class=\"nw\">人数が、定員と同じ → エラーなし<\/span><\/div><div class=\"fd\" style=\"left: 0px; top: 240px; width: 540px; height: 54px; font-size: 22px\"><span class=\"nw\">人数が、定員より多い → 定員の文言<\/span><\/div><div class=\"ac\" style=\"left: 248px; top: 312px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M22 9V35M14 27L22 35L30 27\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g lb\" style=\"left: 0px; top: 366px; font-size: 22px\">テスト<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 0px; top: 406px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 56px; top: 410px\">人数が、定員と同じ<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 0px; top: 458px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 56px; top: 462px\">人数が、定員より多い<\/div><div class=\"g md nw\" style=\"left: 0px; top: 516px; font-weight: 700; color: var(--red)\">34 行 → 34 件<\/div><div class=\"g nm\" style=\"left: 610px; top: 0\">状態遷移表<\/div><div class=\"g lb\" style=\"left: 610px; top: 58px; width: 540px; font-size: 24px\"><span class=\"nw\">1 マス<\/span>につき <span class=\"nw\">1 件<\/span>。「起きない」は作らない<\/div><div class=\"g lb\" style=\"left: 610px; top: 136px; font-size: 22px\">設計書の表<\/div><div class=\"fd\" style=\"left: 610px; top: 176px; width: 540px; height: 54px; font-size: 22px\"><span class=\"nw\">送信中 × キャンセルを押す → できない<\/span><\/div><div class=\"fd\" style=\"left: 610px; top: 240px; width: 540px; height: 54px; font-size: 22px\"><span class=\"nw\">送信中 × 保存が成功する → 完了へ<\/span><\/div><div class=\"ac\" style=\"left: 858px; top: 312px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M22 9V35M14 27L22 35L30 27\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g lb\" style=\"left: 610px; top: 366px; font-size: 22px\">テスト<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 610px; top: 406px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 666px; top: 410px\">送信中は、キャンセルを押せない<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 610px; top: 458px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 666px; top: 462px\">成功すると「予約しました」が出る<\/div><div class=\"g md nw\" style=\"left: 610px; top: 516px; font-weight: 700; color: var(--red)\">21 マス → 15 件<\/div><div class=\"g nm\" style=\"left: 1220px; top: 0\">項目定義表<\/div><div class=\"g lb\" style=\"left: 1220px; top: 58px; width: 540px; font-size: 24px\">範囲は、両端の内側と外側を <span class=\"nw\">1 件<\/span>ずつ<\/div><div class=\"g lb\" style=\"left: 1220px; top: 136px; font-size: 22px\">設計書の表<\/div><div class=\"fd\" style=\"left: 1220px; top: 176px; width: 540px; height: 54px; font-size: 22px\"><span class=\"nw\">日付の範囲：今日〜90 日後<\/span><\/div><div class=\"fd\" style=\"left: 1220px; top: 240px; width: 540px; height: 54px; font-size: 22px\"><span class=\"nw\">人数の範囲：1〜定員<\/span><\/div><div class=\"ac\" style=\"left: 1468px; top: 312px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M22 9V35M14 27L22 35L30 27\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g lb\" style=\"left: 1220px; top: 366px; font-size: 22px\">テスト<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 1220px; top: 406px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 1276px; top: 410px\">90 日後は通り、91 日後はエラー<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 1220px; top: 458px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui nw\" style=\"left: 1276px; top: 462px\">定員と同じは通り、1 人多いとエラー<\/div><div class=\"g md nw\" style=\"left: 1220px; top: 516px; font-weight: 700; color: var(--red)\">1 行の 1 列 → 1 件以上<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M575 0V560M1185 0V560\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"g md\" style=\"left: 0; top: 592px; width: 1760px\"><b>読み方の決まり<\/b>：書いていない動きは「何もしない」と読む。迷ったら推測で作らず、設計書の穴として挙げる。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ 数は、サンプルの「会議室の予約」のもの。サーバーは代役に置きかえ、出来事の名前で応答を起こす。<\/span><span>7<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"合格の確かめ方","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">合格の確かめ方<\/h1>\n<p class=\"cc\">別の AI に設計書だけを読ませて推測を数えると、32 個が 5 個まで減った<\/p>\n<div class=\"bd\">\n<div class=\"g lb\" style=\"left: 0; top: 0\">推測が要る箇所の数（設計書の書き方を、左から順に足した）<\/div><div class=\"g\" style=\"left: 10px; top: 128px; width: 230px; height: 272px; background: #16202B; border-radius: 8px 8px 0 0\"><\/div><div class=\"g nw\" style=\"left: 10px; top: 50px; width: 230px; text-align: center; font-size: 60px; font-weight: 700; line-height: 72px\">32<span style=\"font-size: 28px\"> 個<\/span><\/div><div class=\"g md nw\" style=\"left: -10px; top: 414px; width: 270px; text-align: center; font-weight: 700\">文章で書く<\/div><div class=\"ui\" style=\"left: -10px; top: 458px; width: 270px; text-align: center; color: var(--sub); font-size: 22px\">番号ごとに <span class=\"nw\">1 行<\/span><\/div><div class=\"ui nw\" style=\"left: -10px; top: 532px; width: 270px; text-align: center; font-weight: 700; font-size: 22px\">書けたテスト 約 74 件<\/div><div class=\"ac\" style=\"left: 243px; top: 348px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g\" style=\"left: 290px; top: 239px; width: 230px; height: 161px; background: #5B6672; border-radius: 8px 8px 0 0\"><\/div><div class=\"g nw\" style=\"left: 290px; top: 161px; width: 230px; text-align: center; font-size: 60px; font-weight: 700; line-height: 72px\">19<span style=\"font-size: 28px\"> 個<\/span><\/div><div class=\"g md nw\" style=\"left: 270px; top: 414px; width: 270px; text-align: center; font-weight: 700\">表の形を使い分ける<\/div><div class=\"ui\" style=\"left: 270px; top: 458px; width: 270px; text-align: center; color: var(--sub); font-size: 22px\">3 つの表（4 ページ）<\/div><div class=\"ui nw\" style=\"left: 270px; top: 532px; width: 270px; text-align: center; font-weight: 700; font-size: 22px\">書けたテスト 約 140 件<\/div><div class=\"ac\" style=\"left: 523px; top: 348px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g\" style=\"left: 570px; top: 349px; width: 230px; height: 51px; background: #5B6672; border-radius: 8px 8px 0 0\"><\/div><div class=\"g nw\" style=\"left: 570px; top: 271px; width: 230px; text-align: center; font-size: 60px; font-weight: 700; line-height: 72px\">6<span style=\"font-size: 28px\"> 個<\/span><\/div><div class=\"g md nw\" style=\"left: 550px; top: 414px; width: 270px; text-align: center; font-weight: 700\">資料を分ける<\/div><div class=\"ui\" style=\"left: 550px; top: 458px; width: 270px; text-align: center; color: var(--sub); font-size: 22px\">サーバーの話は API の設計書へ<\/div><div class=\"ui nw\" style=\"left: 550px; top: 532px; width: 270px; text-align: center; font-weight: 700; font-size: 22px\">書けたテスト 約 150 件<\/div><div class=\"ac\" style=\"left: 803px; top: 348px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g\" style=\"left: 850px; top: 358px; width: 230px; height: 42px; background: #B3261E; border-radius: 8px 8px 0 0\"><\/div><div class=\"g nw\" style=\"left: 850px; top: 280px; width: 230px; text-align: center; font-size: 60px; font-weight: 700; line-height: 72px; color: var(--red)\">5<span style=\"font-size: 28px\"> 個<\/span><\/div><div class=\"g md nw\" style=\"left: 830px; top: 414px; width: 270px; text-align: center; font-weight: 700\">共通規約を足す<\/div><div class=\"ui\" style=\"left: 830px; top: 458px; width: 270px; text-align: center; color: var(--sub); font-size: 22px\">入力欄の決まり、テストの作り方<\/div><div class=\"ui nw\" style=\"left: 830px; top: 532px; width: 270px; text-align: center; font-weight: 700; font-size: 22px\">書けたテスト 約 195 件<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M0 400H1110\" stroke=\"#16202B\" stroke-width=\"3\"/><path d=\"M1180 0V560\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"g lb\" style=\"left: 1230px; top: 0\">確かめ方<\/div><div class=\"nb\" style=\"left: 1230px; top: 52px; background: var(--ink)\">1<\/div><div class=\"ui\" style=\"left: 1286px; top: 48px; width: 474px\">コードと PoC を見せない別の AI に、設計書と共通規約だけを渡す<\/div><div class=\"nb\" style=\"left: 1230px; top: 144px; background: var(--ink)\">2<\/div><div class=\"ui\" style=\"left: 1286px; top: 140px; width: 474px\">テストの条件と期待結果を書かせる<\/div><div class=\"nb\" style=\"left: 1230px; top: 236px; background: var(--ink)\">3<\/div><div class=\"ui\" style=\"left: 1286px; top: 232px; width: 474px\">期待結果を決められなかった所を、推測として数えさせる<\/div><div class=\"g lb\" style=\"left: 1230px; top: 340px\">推測が出たときの直し方<\/div><div class=\"ui\" style=\"left: 1230px; top: 388px; width: 530px\"><b>どの画面にも当てはまる<\/b><br>共通規約を直す。直すのは <span class=\"nw\">1 回<\/span>で済む<\/div><div class=\"ui\" style=\"left: 1230px; top: 472px; width: 530px\"><b>その画面だけのこと<\/b><br>画面の設計書を直す<\/div><div class=\"g md\" style=\"left: 0; top: 596px; width: 1760px\"><b>限り<\/b>：読ませたのは各 <span class=\"nw\">1 回<\/span>で、数は目安。読むたびに数個は新しく出るので、0 個にはならない。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ サンプルの「会議室の予約」の画面 1 つで試した結果。推測は、期待結果を設計書から決められなかった所。<\/span><span>8<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"枠と枠の定義","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0. p: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M1260 0V670\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg><div class=\"g nm\" style=\"left: 1300px; top: 0\">2 つの違い<\/div><div class=\"g lb\" style=\"left: 1300px; top: 174px\">枠の定義<\/div><div class=\"g sb\" style=\"left: 1300px; top: 218px; width: 460px\">ファイルに保存される。AI が書く。<\/div><div class=\"g lb\" style=\"left: 1300px; top: 450px\">枠<\/div><div class=\"g sb\" style=\"left: 1300px; top: 494px; width: 460px\">保存されない。ページを開くたびに、定義から描く。<\/div>\n<\/div>\n<div class=\"ft\"><span>※ selector は部品を探す CSS の書き方、text はその部品が持つ文言。aria-label を使った selector は、説明のための例である。<\/span><span>9<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"スマホと PC の図","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-siz ft: 0; top: 226px\">2. 同じショップの商品は…<\/div><div class=\"g lb\" style=\"left: 430px; top: 136px\">枠の定義<\/div><div class=\"ui nw\" style=\"left: 430px; top: 182px\"><span class=\"nw\">1 番目<\/span>：注文日の欄<\/div><div class=\"ui nw\" style=\"left: 430px; top: 226px\"><span class=\"nw\">2 番目<\/span>：追加のボタン<\/div><div class=\"g nm nw\" style=\"left: 0; top: 296px\">説明 2 つ<\/div><div class=\"g nm\" style=\"left: 340px; top: 296px\">＝<\/div><div class=\"g nm nw\" style=\"left: 430px; top: 296px\">定義 2 つ<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 0px; top: 410px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 56px; top: 414px\">数が同じ：成功<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 0px; top: 466px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#5B6672\"/><path d=\"M12 12L28 28M28 12L12 28\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 56px; top: 470px\">説明 <span class=\"nw\">2 つ<\/span>と定義 <span class=\"nw\">1 つ<\/span>のように、数が違う：失敗<\/div><div class=\"g sb\" style=\"left: 0; top: 560px; width: 740px\">番号は、どちらも上からの並び順で対応する。<\/div><div class=\"g nm\" style=\"left: 860px; top: 0\">照合 2　ブラウザのテスト<\/div><div class=\"g lb\" style=\"left: 860px; top: 60px\">定義が、幅ごとの画面で、部品を <span class=\"nw\">1 つ<\/span>だけ見つけるか<\/div><div class=\"nb\" style=\"left: 860px; top: 134px\">2<\/div><div class=\"g lb\" style=\"left: 912px; top: 136px\"><span class=\"nw\">2 番目<\/span>の定義<\/div><div class=\"ui nw\" style=\"left: 860px; top: 190px\">selector: \"[aria-label=商品を追加]\"<\/div><div class=\"ui nw\" style=\"left: 860px; top: 230px\">text: \"同じショップの商品を追加\"<\/div><div class=\"g nm nw\" style=\"left: 860px; top: 296px\">見つかった部品 1 個<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 860px; top: 410px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#16202B\"/><path d=\"M11 20L18 27L29 13\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 916px; top: 414px\"><span class=\"nw\">1 個<\/span>で、文言も合う：成功<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 860px; top: 466px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#5B6672\"/><path d=\"M12 12L28 28M28 12L12 28\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 916px; top: 470px\"><span class=\"nw\">0 個<\/span>か、<span class=\"nw\">2 個以上<\/span>：失敗<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 860px; top: 522px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#5B6672\"/><path d=\"M12 12L28 28M28 12L12 28\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 916px; top: 526px\">部品の文言が、text と違う：失敗<\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 860px; top: 578px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#5B6672\"/><path d=\"M12 12L28 28M28 12L12 28\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><div class=\"ui\" style=\"left: 916px; top: 582px\">出ないはずの幅に、出ている：失敗<\/div><div class=\"ph\" style=\"left: 1400px; top: 100px; width: 360px; height: 480px\"><\/div><div class=\"ui\" style=\"left: 1424px; top: 120px; font-weight: 700\">注文を編集<\/div><div class=\"ui\" style=\"left: 1424px; top: 164px; color: var(--sub)\">条件<\/div><div class=\"fd\" style=\"left: 1424px; top: 208px; width: 312px; height: 60px\"><span>注文日<\/span><span>2026/10/25<\/span><\/div><div class=\"fd\" style=\"left: 1424px; top: 284px; width: 312px; height: 60px\"><span>数量<\/span><span>1<\/span><\/div><div class=\"fd\" style=\"left: 1424px; top: 360px; width: 312px; height: 60px\"><span>クーポン<\/span><span>なし<\/span><\/div><div class=\"g\" style=\"box-sizing: border-box; left: 1424px; top: 484px; width: 312px; height: 60px; border: 3px solid var(--ink); border-radius: 10px; font-size: 24px; font-weight: 700; line-height: 54px; text-align: center\">同じショップの商品を追加<\/div><div class=\"mk\" style=\"left: 1416px; top: 476px; width: 328px; height: 76px\"><\/div><div class=\"nb\" style=\"left: 1374px; top: 456px\">2<\/div>\n<\/div>\n<div class=\"ft\"><span>※ どちらかが失敗すると、PR はマージできない。aria-label を使った selector は、説明のための例である。<\/span><span>13<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"画面と設計書のずれの検出","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">画面と設計書のずれの検出<\/h1>\n<p class=\"cc\">画面と設計書がずれると CI が落ち、古い設計書のままマージされない<\/p>\n<div class=\"bd\">\n<div class=\"g nm\" style=\"left: 0; top: 0\">1 PR で画面を変える<\/div><div class=\"ph\" style=\"left: 0px; top: 76px; width: 360px; height: 480px\"><\/div><div class=\"ui\" style=\"left: 24px; top: 96px; font-weight: 700\">注文を編集<\/div><div class=\"ui\" style=\"left: 24px; top: 140px; color: var(--sub)\">条件<\/div><div class=\"fd\" style=\"left: 24px; top: 184px; width: 312px; height: 60px\"><span>注文日<\/span><span>2026/10/25<\/span><\/div><div class=\"fd\" style=\"left: 24px; top: 260px; width: 312px; height: 60px\"><span>数量<\/span><span>1<\/span><\/div><div class=\"fd\" style=\"left: 24px; top: 336px; width: 312px; height: 60px\"><span>クーポン<\/span><span>なし<\/span><\/div><div class=\"g\" style=\"box-sizing: border-box; left: 24px; top: 460px; width: 312px; height: 60px; border: 3px dashed var(--line); border-radius: 10px; font-size: 24px; line-height: 54px; text-align: center; color: var(--sub)\">ボタンを削除した<\/div><div class=\"ac\" style=\"left: 448px; top: 290px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g nm\" style=\"left: 560px; top: 0\">2 設計書の md は古いまま<\/div><div class=\"g md\" style=\"left: 560px; top: 92px; width: 520px\">1. 日付のキャンペーンは、注文日で判定する。<\/div><div class=\"mk\" style=\"left: 544px; top: 196px; width: 552px; height: 110px\"><\/div><div class=\"g md\" style=\"left: 560px; top: 212px; width: 520px; font-weight: 700\">2. 同じショップの商品は、<span class=\"nw\">1 つ<\/span>の注文に入れる。<\/div><div class=\"g sb\" style=\"left: 560px; top: 336px; width: 520px\">番号 2 が指すボタンは、もう画面にない。<\/div><div class=\"ac\" style=\"left: 1118px; top: 290px\"><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><path d=\"M9 22H35M27 14L35 22L27 30\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\"/><\/svg><\/div><div class=\"g nm\" style=\"left: 1200px; top: 0\">3 PR の CI が落ちる<\/div><div class=\"win\" style=\"left: 1200px; top: 76px; width: 560px; height: 480px\"><div class=\"bar\"><svg width=\"120\" height=\"44\" viewBox=\"0 0 120 44\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"56\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"82\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><\/svg><\/div><\/div><svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" style=\"position: absolute; left: 1228px; top: 148px\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"20\" fill=\"#B3261E\"/><path d=\"M12 12L28 28M28 12L12 28\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"4 dius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">設計書のページに出る版<\/h1>\n<p class=\"cc\">PR の承認でタグを付けるので、設計書のページで合意した版か作業中かが分かる<\/p>\n<div class=\"bd\">\n<div class=\"g nm\" style=\"left: 0px; top: 0\">合意した版<\/div><div class=\"win\" style=\"left: 0px; top: 76px; width: 520px; height: 400px\"><div class=\"bar\"><svg width=\"120\" height=\"44\" viewBox=\"0 0 120 44\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"56\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"82\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><\/svg><\/div><\/div><div class=\"g nw\" style=\"box-sizing: border-box; left: 28px; top: 144px; height: 52px; padding: 0 24px; border-radius: 26px; border: 3px solid var(--red); color: var(--red); font-size: 24px; font-weight: 700; line-height: 46px\">design/v1.0<\/div><div class=\"ui\" style=\"left: 28px; top: 220px; font-weight: 700\">注文の編集<\/div><div class=\"g\" style=\"box-sizing: border-box; left: 28px; top: 268px; width: 110px; height: 180px; border: 3px solid var(--line); border-radius: 16px\"><\/div><div class=\"g\" style=\"left: 42px; top: 292px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 42px; top: 328px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 42px; top: 364px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"box-sizing: border-box; left: 42px; top: 404px; width: 82px; height: 28px; border-radius: 6px; border: 3px solid var(--ink)\"><\/div><div class=\"ui\" style=\"left: 164px; top: 280px; width: 330px\">1. 注文日で判定する。<\/div><div class=\"ui\" style=\"left: 164px; top: 340px; width: 330px\">2. <span class=\"nw\">1 つ<\/span>の注文に入れる。<\/div><div class=\"g sb\" style=\"left: 0px; top: 500px; width: 520px\">PR の承認でマージし、タグを付けた版<\/div><div class=\"g nm\" style=\"left: 620px; top: 0\">作業中の版<\/div><div class=\"win\" style=\"left: 620px; top: 76px; width: 520px; height: 400px\"><div class=\"bar\"><svg width=\"120\" height=\"44\" viewBox=\"0 0 120 44\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"56\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"82\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><\/svg><\/div><\/div><div class=\"g nw\" style=\"box-sizing: border-box; left: 648px; top: 144px; height: 52px; padding: 0 24px; border-radius: 26px; border: 3px solid var(--ink); color: var(--ink); font-size: 24px; font-weight: 400; line-height: 46px\">design/v1.0-3-gabc1234<\/div><div class=\"ui\" style=\"left: 648px; top: 220px; font-weight: 700\">注文の編集<\/div><div class=\"g\" style=\"box-sizing: border-box; left: 648px; top: 268px; width: 110px; height: 180px; border: 3px solid var(--line); border-radius: 16px\"><\/div><div class=\"g\" style=\"left: 662px; top: 292px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 662px; top: 328px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 662px; top: 364px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"box-sizing: border-box; left: 662px; top: 404px; width: 82px; height: 28px; border-radius: 6px; border: 3px solid var(--ink)\"><\/div><div class=\"ui\" style=\"left: 784px; top: 280px; width: 330px\">1. 注文日で判定する。<\/div><div class=\"ui\" style=\"left: 784px; top: 340px; width: 330px\">2. <span class=\"nw\">1 つ<\/span>の注文に入れる。<\/div><div class=\"g sb\" style=\"left: 620px; top: 500px; width: 520px\">合意から <span class=\"nw\">3 コミット<\/span>進んだ版<\/div><div class=\"g nm\" style=\"left: 1240px; top: 0\">手元で変更中の版<\/div><div class=\"win\" style=\"left: 1240px; top: 76px; width: 520px; height: 400px\"><div class=\"bar\"><svg width=\"120\" height=\"44\" viewBox=\"0 0 120 44\" aria-hidden=\"true\"><circle cx=\"30\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"56\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><circle cx=\"82\" cy=\"22\" r=\"8\" fill=\"#C9CFD6\"/><\/svg><\/div><\/div><div class=\"g nw\" style=\"box-sizing: border-box; left: 1268px; top: 144px; height: 52px; padding: 0 24px; border-radius: 26px; border: 3px solid var(--ink); color: var(--ink); font-size: 24px; font-weight: 400; line-height: 46px\">design/v1.0-3-gabc1234-dirty<\/div><div class=\"ui\" style=\"left: 1268px; top: 220px; font-weight: 700\">注文の編集<\/div><div class=\"g\" style=\"box-sizing: border-box; left: 1268px; top: 268px; width: 110px; height: 180px; border: 3px solid var(--line); border-radius: 16px\"><\/div><div class=\"g\" style=\"left: 1282px; top: 292px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 1282px; top: 328px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"left: 1282px; top: 364px; width: 82px; height: 24px; border-radius: 6px; background: var(--tint)\"><\/div><div class=\"g\" style=\"box-sizing: border-box; left: 1282px; top: 404px; width: 82px; height: 28px; border-radius: 6px; border: 3px solid var(--ink)\"><\/div><div class=\"ui\" style=\"left: 1404px; top: 280px; width: 330px\">1. 注文日で判定する。<\/div><div class=\"ui\" style=\"left: 1404px; top: 340px; width: 330px\">2. <span class=\"nw\">1 つ<\/span>の注文に入れる。<\/div><div class=\"g sb\" style=\"left: 1240px; top: 500px; width: 520px\">コミットしていない変更がある<\/div>\n<\/div>\n<div class=\"ft\"><span>※ 版は、ビルドのときに git describe --tags --match \"design/*\" --dirty で求め、ページの上に表示する。<\/span><span>17<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"},{"title":"用意するもの","html":"<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--ink:#16202B;--sub:#5B6672;--line:#C9CFD6;--tint:#F1F3F5;--red:#B3261E}\nbody{margin:0}\n.s{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;background:#FFFFFF;color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.4;word-break:auto-phrase;font-feature-settings:'palt';word-spacing:-0.12em}\n.hd{height:32px;font-size:24px;line-height:32px;color:var(--sub)}\n.tt{margin:16px 0 0;height:78px;font-size:56px;font-weight:700;line-height:78px}\n.cc{margin:4px 0 0;height:62px;font-size:44px;font-weight:700;line-height:62px}\n.bd{margin-top:36px;flex:1;min-height:0;position:relative}\n.ft{height:32px;margin-top:16px;display:flex;justify-content:space-between;font-size:24px;line-height:32px;color:var(--sub)}\n.g{position:absolute}\n.nm{font-size:40px;font-weight:700;line-height:1.3}\n.sb{font-size:32px;line-height:1.4}\n.lb{font-size:28px;font-weight:700;color:var(--sub)}\n.md{font-size:28px;line-height:1.4}\n.ui{position:absolute;font-size:24px;line-height:32px}\n.win{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:20px;background:#FFFFFF}\n.bar{position:absolute;left:0;right:0;top:0;height:44px;border-bottom:3px solid var(--ink)}\n.ph{position:absolute;box-sizing:border-box;border:3px solid var(--ink);border-radius:32px;background:#FFFFFF}\n.fd{position:absolute;box-sizing:border-box;border-radius:10px;background:var(--tint);padding:0 16px;font-size:24px;line-height:32px;display:flex;justify-content:space-between;align-items:center}\n.mk{position:absolute;box-sizing:border-box;border:3px solid var(--red);border-radius:12px}\n.nb{position:absolute;width:40px;height:40px;border-radius:20px;background:var(--red);color:#FFFFFF;font-size:24px;font-weight:700;line-height:40px;text-align:center}\n.ac{position:absolute;width:44px;height:44px;border-radius:22px;background:var(--ink)}\n.nw{white-space:nowrap}\n<\/style>\n<\/head><body>\n<div class=\"s\">\n<div class=\"hd\">PoCを前提にした基本設計書の管理<\/div>\n<h1 class=\"tt\">用意するもの<\/h1>\n<p class=\"cc\">仕組みのコードは最初に 1 回だけ作り、画面ごとに AI が書くのは 5 つのファイルである<\/p>\n<div class=\"bd\">\n<div class=\"g nm\" style=\"left: 0px; top: 0\">1 仕組みのコード<\/div><div class=\"g lb\" style=\"left: 0px; top: 60px\">最初に <span class=\"nw\">1 回<\/span>だけ作る<\/div><div class=\"g md nw\" style=\"left: 0px; top: 136px; font-weight: 700\">md を読むコード<\/div><div class=\"ui\" style=\"left: 0px; top: 178px; width: 540px\">:::figure と ::table を読み、数と名前を確かめる<\/div><div class=\"g md nw\" style=\"left: 0px; top: 244px; font-weight: 700\">図と表を出すコード<\/div><div class=\"ui\" style=\"left: 0px; top: 286px; width: 540px\">部品を描いて枠を重ね、データから表を出す<\/div><div class=\"g md nw\" style=\"left: 0px; top: 352px; font-weight: 700\">見本データを渡すコード<\/div><div class=\"ui\" style=\"left: 0px; top: 394px; width: 540px\">見本データを、部品に渡す<\/div><div class=\"g md nw\" style=\"left: 0px; top: 460px; font-weight: 700\">照合のテスト<\/div><div class=\"ui\" style=\"left: 0px; top: 502px; width: 540px\">枠が、幅ごとに部品を <span class=\"nw\">1 つ<\/span>だけ見つけるか<\/div><div class=\"g md nw\" style=\"left: 0px; top: 568px; font-weight: 700\">共通規約と、AI への規約<\/div><div class=\"ui\" style=\"left: 0px; top: 610px; width: 540px\">書き方、入力欄の決まり、テストの作り方<\/div><div class=\"g nm\" style=\"left: 600px; top: 0\">2 画面ごとに書くもの<\/div><div class=\"g lb\" style=\"left: 600px; top: 60px\">画面を <span class=\"nw\">1 つ<\/span>足すたびに、AI が書く<\/div><div class=\"g md nw\" style=\"left: 600px; top: 136px; font-weight: 700\">設計書の md<\/div><div class=\"ui\" style=\"left: 600px; top: 178px; width: 540px\">:::figure と、番号付きリストの説明<\/div><div class=\"g md nw\" style=\"left: 600px; top: 244px; font-weight: 700\">枠の定義（figure-marks.ts）<\/div><div class=\"ui\" style=\"left: 600px; top: 286px; width: 540px\">部品の探し方と、出る幅を、説明と同じ順に<\/div><div class=\"g md nw\" style=\"left: 600px; top: 352px; font-weight: 700\">図の一覧（figures.tsx）<\/div><div class=\"ui\" style=\"left: 600px; top: 394px; width: 540px\">どの部品を、どの見本データで描くか<\/div><div class=\"g md nw\" style=\"left: 600px; top: 460px; font-weight: 700\">見本データ（sample-data.ts）<\/div><div class=\"ui\" style=\"left: 600px; top: 502px; width: 540px\">図に出す、注文や日付などの値<\/div><div class=\"g md nw\" style=\"left: 600px; top: 568px; font-weight: 700\"><span class=\"nw\">3 つ<\/span>の表のデータ<\/div><div class=\"ui\" style=\"left: 600px; top: 610px; width: 540px\">項目定義、条件、状態遷移。テストも回す<\/div><div class=\"g nm\" style=\"left: 1200px; top: 0\">3 設計書として使うコード<\/div><div class=\"g lb\" style=\"left: 1200px; top: 60px\">これも、最初に <span class=\"nw\">1 回<\/span>だけ作る<\/div><div class=\"g md nw\" style=\"left: 1200px; top: 136px; font-weight: 700\">設計書のページ<\/div><div class=\"ui\" style=\"left: 1200px; top: 178px; width: 540px\">md を表示する、開発用のページ<\/div><div class=\"g md nw\" style=\"left: 1200px; top: 244px; font-weight: 700\">本番から外す設定<\/div><div class=\"ui\" style=\"left: 1200px; top: 286px; width: 540px\">本番のビルドに、設計書のページを入れない<\/div><div class=\"g md nw\" style=\"left: 1200px; top: 352px; font-weight: 700\">版の表示<\/div><div class=\"ui\" style=\"left: 1200px; top: 394px; width: 540px\">Git のタグを、ページの上に出す<\/div><div class=\"g md nw\" style=\"left: 1200px; top: 460px; font-weight: 700\">幅ごとの図<\/div><div class=\"ui\" style=\"left: 1200px; top: 502px; width: 540px\">スマホと PC の幅の枠に、同じ部品を描く<\/div><div class=\"g md nw\" style=\"left: 1200px; top: 568px; font-weight: 700\">CI の追加<\/div><div class=\"ui\" style=\"left: 1200px; top: 610px; width: 540px\">本番のビルドの検査と、タグの取得<\/div><svg width=\"1760\" height=\"680\" viewBox=\"0 0 1760 680\" style=\"position: absolute; left: 0; top: 0; pointer-events: none\" aria-hidden=\"true\"><path d=\"M570 0V670M1170 0V670\" stroke=\"#C9CFD6\" stroke-width=\"2\"/><\/svg>\n<\/div>\n<div class=\"ft\"><span>※ 番号と、枠や丸の見た目は、図と表を出すコードが作る。図ごとには書かない。人は、PR の承認で確かめる。<\/span><span>18<\/span><\/div>\n<\/div>\n<script>document.addEventListener(\"keydown\",function(e){parent.postMessage({slideKey:e.key},\"*\")});<\/script><\/body><\/html>"}];
var stage = document.getElementById('stage');
var frames = slides.map(function (s, i) {
  var f = document.createElement('iframe');
  f.title = (i + 1) + ' ' + s.title;
  f.hidden = true;
  f.srcdoc = s.html;
  stage.appendChild(f);
  return f;
});
var cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(frames.length - 1, i));
  frames.forEach(function (f, k) { f.hidden = k !== cur; });
  document.getElementById('no').textContent = (cur + 1) + ' / ' + frames.length;
  if (location.hash !== '#' + (cur + 1)) { history.replaceState(null, '', '#' + (cur + 1)); }
}
function fit() {
  var w = window.innerWidth, h = window.innerHeight - 56;
  stage.style.transform = 'scale(' + Math.min(w / 1920, h / 1080) + ')';
}
function key(k) {
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { show(cur + 1); }
  if (k === 'ArrowLeft' || k === 'PageUp') { show(cur - 1); }
  if (k === 'Home') { show(0); }
  if (k === 'End') { show(frames.length - 1); }
}
document.addEventListener('keydown', function (e) { key(e.key); });
window.addEventListener('message', function (e) { if (e.data && e.data.slideKey) { key(e.data.slideKey); } });
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
window.addEventListener('resize', fit);
fit();
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
