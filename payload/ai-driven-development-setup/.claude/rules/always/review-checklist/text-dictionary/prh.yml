version: 1
rules:
  # 推奨: 支援ツール / 機能 / スクリプト（文脈で具体の語を選ぶ）
  # 誤検知注意: 「道具箱」のような比喩ではなく、このリポジトリの機能・スクリプト・配布物を指す用法が対象
  - expected: 支援ツール
    patterns:
      - /道具/
  # 推奨: 対象プロジェクトのフォルダに含めない出力の置き場 / 検証の出力先
  - expected: 対象プロジェクトのフォルダに含めない出力の置き場
    patterns:
      - /作業領域/
  # 推奨: 調査と検出条件の定義書（旧称「道標」の言い換え）
  - expected: 調査と検出条件の定義書
    patterns:
      - /道標/
  # 推奨: 読み取り結果の項目（旧称「事実の項目」の言い換え）
  - expected: 読み取り結果の項目
    patterns:
      - /事実の項目/
  # 推奨: 読み取り結果の形（旧称「事実の形」の言い換え）
  - expected: 読み取り結果の形
    patterns:
      - /事実の形/
  # 推奨: 単位のコードの読み取り結果（旧称「単位の事実」の言い換え）
  - expected: 単位のコードの読み取り結果
    patterns:
      - /単位の事実/
  # 推奨: コードの読み取り結果を取り出す（旧称「事実を取り出す」の言い換え）
  # 誤検知注意: 「事実」単独は一般の意味（実際にあったこと）を持つため対象にしない。
  # 「〜の事実」「事実を〜」のような、コードから取り出した値を指す用法だけを個別に登録する
  - expected: コードの読み取り結果を取り出す
    patterns:
      - /事実を取り出す/
