var open={};
function key(p){return p.join('.');}
function build(node,path,depth){
var row=document.createElement('div');row.className='row';
var b=document.createElement('div');b.className='n '+(depth==0?'l0':node[2]==X||node[2]==X2||node[0][0]=='具'?'x':path[1]===F&&depth==2?'f':depth==1?'s1':'d');
var kids=node[3];
var c=document.createElement('span');c.className='c';
if(kids.length){b.className+=' has';c.textContent=open[key(path)]?'▾':'▸';}
b.appendChild(c);
b.appendChild(document.createTextNode(node[0]));
if(node[1]){var s=document.createElement('span');s.className='s';s.textContent=node[1];b.appendChild(s);}
if(node[2]){var e=document.createElement('span');e.className='e';e.textContent='根拠: '+node[2];b.appendChild(e);}
row.appendChild(b);
if(kids.length){
b.addEventListener('click',function(ev){ev.stopPropagation();open[key(path)]=!open[key(path)];draw();});
if(open[key(path)]){
var k=document.createElement('div');k.className='kids';
kids.forEach(function(ch,i){k.appendChild(build(ch,path.concat(i),depth+1));});
row.appendChild(k);
}
}
return row;
}
function draw(){var m=document.getElementById('map');m.textContent='';m.appendChild(build(D,[0],0));}
function walk(node,path,f){f(path,node);node[3].forEach(function(ch,i){walk(ch,path.concat(i),f);});}
function reset(){open={};open['0']=true;}
document.getElementById('ex').addEventListener('click',function(){walk(D,[0],function(p,n){if(n[3].length)open[key(p)]=true;});draw();});
document.getElementById('co').addEventListener('click',function(){reset();draw();});
var w=document.getElementById('wrap'),dr=null;
w.addEventListener('mousedown',function(e){if(e.target.closest('.n'))return;dr={x:e.clientX,y:e.clientY,l:w.scrollLeft,t:w.scrollTop};w.classList.add('drag');});
window.addEventListener('mousemove',function(e){if(!dr)return;w.scrollLeft=dr.l-(e.clientX-dr.x);w.scrollTop=dr.t-(e.clientY-dr.y);});
window.addEventListener('mouseup',function(){dr=null;w.classList.remove('drag');});
reset();draw();
