<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スキル作成の確認と承認</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="デザイントークン.css">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--color-background);color:var(--color-text);font-family:'Noto Sans JP',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-8) var(--space-16);padding:var(--space-12) var(--space-24);background:var(--color-surface);border-bottom:1px solid var(--color-border)}
header .brand{font-weight:700;font-size:var(--font-size-title-small)}
header .meta{font-size:var(--font-size-body);color:var(--color-text-muted)}
header .meta:empty{display:none}
.runwrap{position:relative}
.running{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-4) var(--space-12);border:0;border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary);font-size:var(--font-size-body);font-weight:500}
.running .sub{font-weight:400;color:var(--color-primary-strong)}
.spin{flex:0 0 auto;width:10px;height:10px;border:2px solid var(--color-primary);border-right-color:transparent;border-radius:var(--radius-circle);animation:spin .8s linear infinite}
#stack{position:absolute;left:0;top:36px;z-index:3;width:560px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;padding:var(--space-16);background:var(--color-surface);border:1px solid var(--color-border-control);border-radius:var(--radius-card);box-shadow:var(--shadow-popover)}
#stack .h{font-size:var(--font-size-body-large);font-weight:700;margin-bottom:var(--space-8)}
#stack .sec{font-size:var(--font-size-small);font-weight:700;color:var(--color-text-muted);margin:var(--space-8) 0 var(--space-2)}
#stack .sk{display:grid;grid-template-columns:1fr auto;gap:var(--space-2) var(--space-12);padding:var(--space-8) 0;border-top:1px solid var(--color-surface-muted)}
#stack .sk .n{font-size:var(--font-size-body);font-weight:700}
#stack .sk .st{font-size:var(--font-size-small);text-align:right;color:var(--color-text-muted)}
#stack .sk .st.now{color:var(--color-primary);font-weight:700}
#stack .sk .st.done{color:var(--color-success)}
#stack .sk .p{grid-column:1 / 3;font-size:var(--font-size-small);color:var(--color-text-muted)}
#stack .rl{display:flex;gap:var(--space-12);padding:var(--space-6) 0;border-top:1px solid var(--color-surface-muted);font-size:var(--font-size-small)}
#stack .rl b{font-weight:700}
#stack .rl span{margin-left:auto;color:var(--color-text-muted);text-align:right}
@keyframes spin{to{transform:rotate(360deg)}}
.conn{margin-left:auto;display:flex;align-items:center;gap:var(--space-6);font-size:var(--font-size-small);color:var(--color-text-muted)}
.conn::before{content:'';width:8px;height:8px;border-radius:var(--radius-circle);background:var(--color-success)}
.conn.ng{color:var(--color-danger)}
.conn.ng::before{background:var(--color-danger)}
#banner{padding:var(--space-8) var(--space-24);background:var(--color-danger-surface);color:var(--color-danger-text);font-size:var(--font-size-body)}
nav.stages{display:flex;flex-wrap:wrap;gap:var(--space-8);padding:var(--space-10) var(--space-24);background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.pill{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-6) var(--space-12);border-radius:var(--radius-pill);background:var(--color-surface-muted);color:var(--color-text-muted);font-size:var(--font-size-body)}
.pill .num{display:inline-flex;flex:0 0 20px;width:20px;height:20px;border-radius:var(--radius-pill);background:var(--color-surface);border:1px solid var(--color-border-control);align-items:center;justify-content:center;font-size:var(--font-size-small)}
.pill .name{display:flex;flex-direction:column;line-height:var(--line-height-tight)}
.pill .status{font-size:var(--font-size-caption);font-weight:400}
.pill.done{background:var(--color-primary-soft);color:var(--color-primary)}
.pill.done .num{background:var(--color-primary);color:var(--color-surface);border:0}
.pill.now{background:var(--color-primary);color:var(--color-surface);font-weight:500}
.pill.now .num{background:var(--color-surface);color:var(--color-primary);border:0;font-weight:700}
.pill.back{border:1px dashed var(--color-primary)}
main{display:flex;flex-wrap:wrap;flex:1 1 auto;gap:var(--space-16);padding:var(--space-16) var(--space-24) var(--space-24);min-height:0}
.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#chat{flex:1 1 360px;max-width:420px;max-height:100%}
#messages{flex:1 1 auto;display:flex;flex-direction:column;gap:var(--space-12);padding:var(--space-16);overflow:auto}
.msg{max-width:90%;padding:var(--space-10) var(--space-14);font-size:var(--font-size-body-large);line-height:var(--line-height-loose);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:85%;border-radius:var(--radius-bubble) var(--radius-bubble) var(--radius-tiny) var(--radius-bubble);background:var(--color-primary);color:var(--color-surface)}
.msg.ai{align-self:flex-start;border-radius:var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) var(--radius-tiny);background:var(--color-surface-muted)}
.msg.md{white-space:normal}
.msg.md p,.msg.md ul,.msg.md ol{margin:var(--space-4) 0}
.msg.md ul,.msg.md ol{padding-left:var(--space-18)}
.msg.md pre{white-space:pre-wrap;background:var(--color-surface);padding:var(--space-6);border-radius:var(--radius-small)}
.msg.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:var(--font-size-small)}
.msg.md th,.msg.md td{border:1px solid var(--color-border);padding:var(--space-2) var(--space-6)}
.typing{align-self:flex-start;display:flex;gap:var(--space-6);padding:var(--space-14) var(--space-16);border-radius:var(--radius-bubble) var(--radius-bubble) var(--radius-bubble) var(--radius-tiny);background:var(--color-surface-muted)}
.typing span{width:8px;height:8px;border-radius:var(--radius-circle);background:var(--color-text-faint);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.decision{align-self:stretch;display:flex;flex-direction:column;gap:var(--space-8);padding:var(--space-12);border:1px solid var(--color-border-control);border-radius:var(--radius-card)}
.decision.off{border-color:var(--color-border-light);color:var(--color-text-faint)}
.decision .q{font-size:var(--font-size-body);font-weight:700}
.decision .hint{font-size:var(--font-size-small);color:var(--color-text-muted)}
.decision .choices{display:flex;flex-wrap:wrap;gap:var(--space-8)}
.choice{height:var(--height-control);padding:0 var(--space-16);border:1px solid var(--color-border-control);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-text);font-size:var(--font-size-body)}
.choice.main{border:0;background:var(--color-primary);color:var(--color-surface);font-weight:500}
.decision.off .choice{border-color:var(--color-border-light);color:var(--color-text-faint)}
.decision.off .choice.main{background:var(--color-disabled);color:var(--color-surface)}
.decision.off .choice.picked{background:var(--color-primary);color:var(--color-surface);border:0}
#err{padding:var(--space-8) var(--space-16) 0;font-size:var(--font-size-small);color:var(--color-danger)}
form{display:flex;align-items:flex-end;gap:var(--space-8);padding:var(--space-12) var(--space-16);border-top:1px solid var(--color-border-light)}
form textarea{flex:1 1 auto;min-width:0;padding:var(--space-10) var(--space-12);border:1px solid var(--color-border-control);border-radius:var(--radius-control);font-size:var(--font-size-body-large);line-height:var(--line-height-body);font-family:inherit;resize:none}
form textarea.ng{border-color:var(--color-danger)}
.primary{height:var(--height-control-touch);padding:0 var(--space-16);border:0;border-radius:var(--radius-control);background:var(--color-primary);color:var(--color-surface);font-size:var(--font-size-body-large);font-weight:500}
#preview{flex:999 1 560px;max-height:100%}
.bar{position:relative;display:flex;align-items:center;gap:var(--space-8);padding:var(--space-8) var(--space-16);border-bottom:1px solid var(--color-border-light)}
#docpath{font-size:var(--font-size-small);color:var(--color-text-muted);overflow-wrap:anywhere}
.dl{margin-left:auto;height:var(--height-control-small);padding:0 var(--space-12);border:1px solid var(--color-border-control);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-text);font-size:var(--font-size-small);display:flex;align-items:center;gap:var(--space-6)}
#dlmenu{position:absolute;right:16px;top:44px;z-index:2;display:flex;flex-direction:column;gap:var(--space-4);min-width:280px;max-width:480px;padding:var(--space-6);border:1px solid var(--color-border-control);border-radius:var(--radius-control);background:var(--color-surface);box-shadow:var(--shadow-menu)}
#dlmenu a{padding:var(--space-8) var(--space-10);border-radius:var(--radius-small);font-size:var(--font-size-small);color:var(--color-primary);text-decoration:none;overflow-wrap:anywhere}
#dlmenu a:hover{background:var(--color-surface-muted)}
#dlmenu a span{display:block;color:var(--color-text-muted)}
#figbox{border-bottom:1px solid var(--color-border-light);background:var(--color-surface-faint)}
.fighead{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);padding:var(--space-12) var(--space-20)}
.fighead .title{font-size:var(--font-size-body);font-weight:700;margin-right:var(--space-8)}
.tab{height:var(--height-tab);padding:0 var(--space-10);border:0;border-radius:var(--radius-small);background:transparent;color:var(--color-text-muted);font-size:var(--font-size-small)}
.tab.on{background:var(--color-surface-muted);color:var(--color-text);font-weight:700}
.fold{margin-left:auto;height:var(--height-tab);padding:0 var(--space-10);border:0;background:transparent;color:var(--color-text-muted);font-size:var(--font-size-small)}
#figure{padding:0 var(--space-20) var(--space-16);overflow:auto;max-height:45vh}
#figure svg{max-width:100%;height:auto}
#doc{flex:1 1 auto;padding:var(--space-16) var(--space-24);overflow:auto;font-size:var(--font-size-body);line-height:var(--line-height-document)}
#doc h1{margin:0 0 var(--space-12);font-size:var(--font-size-heading)}
#doc h2{margin:var(--space-12) 0 var(--space-6);font-size:var(--font-size-body-large);border-bottom:1px solid var(--color-border-light);padding-bottom:var(--space-4)}
#doc h3{font-size:var(--font-size-body)}
#doc table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
#doc th{text-align:left;padding:var(--space-6) var(--space-8);border-bottom:1px solid var(--color-border-control)}
#doc td{padding:var(--space-6) var(--space-8);border-bottom:1px solid var(--color-border-light);vertical-align:top}
#doc ul{margin:0;padding-left:var(--space-20)}
#doc pre{background:var(--color-surface-muted);padding:var(--space-8);overflow:auto}
.empty{color:var(--color-text-muted);font-size:var(--font-size-body)}
.making{display:flex;align-items:center;gap:var(--space-8);font-size:var(--font-size-body);font-weight:700;color:var(--color-primary)}
.making-sub{font-size:var(--font-size-small);color:var(--color-text-muted);margin:var(--space-6) 0 var(--space-10)}
.skel{display:flex;flex-direction:column;gap:var(--space-8)}
.skel div{height:10px;border-radius:var(--radius-tiny);background:var(--color-surface-muted)}
.rewriting{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-6) var(--space-10);margin-bottom:var(--space-10);border-radius:var(--radius-small);background:var(--color-primary-soft);color:var(--color-primary-strong);font-size:var(--font-size-small)}
.dim{opacity:.55}
.none-h{font-size:var(--font-size-body);font-weight:700}
.none-s{font-size:var(--font-size-small);color:var(--color-text-muted);margin-top:var(--space-4)}
.chips{align-self:flex-start;display:flex;flex-wrap:wrap;gap:var(--space-8)}
.chip{height:var(--height-control-small);padding:0 var(--space-12);border:1px solid var(--color-border-control);border-radius:var(--radius-pill);background:var(--color-surface);color:var(--color-text);font-size:var(--font-size-body)}
.chip.on{border-color:var(--color-primary);background:var(--color-primary-soft);color:var(--color-primary)}
#qform{flex:1 1 auto;overflow:auto;padding:var(--space-20);background:var(--color-surface-faint)}
.qbox{max-width:720px;padding:var(--space-16);border:1px solid var(--color-border);border-radius:var(--radius-control);background:var(--color-surface)}
.qnote{margin-bottom:var(--space-8);padding:var(--space-8) var(--space-10);border-radius:var(--radius-small);background:var(--color-note-surface);font-size:var(--font-size-small)}
.qhead{display:flex;align-items:baseline;gap:var(--space-8);margin-bottom:var(--space-4)}
.qhead .t{font-size:var(--font-size-body-large);font-weight:700}
.qhead .c{font-size:var(--font-size-small);color:var(--color-text-muted)}
.qi{display:flex;flex-direction:column;gap:var(--space-8);padding:var(--space-12) 0;border-top:1px solid var(--color-surface-muted)}
.qi .l{display:flex;gap:var(--space-8);align-items:baseline}
.qi .no{font-size:var(--font-size-small);font-weight:700;color:var(--color-primary)}
.qi .no.ok{color:var(--color-success)}
.qi .tx{font-size:var(--font-size-body);font-weight:700}
.qi textarea{min-height:var(--height-control-compact);padding:var(--space-8) var(--space-10);border:1px solid var(--color-border-control);border-radius:var(--radius-control);font-size:var(--font-size-body);font-family:inherit;resize:vertical}
.qfoot{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-8);padding-top:var(--space-12);border-top:1px solid var(--color-surface-muted)}
.qfoot span{font-size:var(--font-size-small);color:var(--color-text-muted)}
.qfoot button{height:var(--height-control);padding:0 var(--space-16);border:0;border-radius:var(--radius-control);background:var(--color-primary);color:var(--color-surface);font-size:var(--font-size-body);font-weight:500}
.qfoot button:disabled{background:var(--color-disabled)}
/* 開いた直後の画面: 右の欄を出さず、会話の欄を中央に置く */
body.start main{justify-content:center}
body.start #chat{border:0;background:transparent}
body.start #messages{flex:0 1 auto}
body.start form textarea{border:0;outline:none}
/* 聞き取りの画面(試作の案「見出しで分ける」)。state.json のキー screen があるときだけ使う */
body.hearing main{flex-wrap:nowrap;padding:var(--space-12) var(--space-20) var(--space-16)}
#hear{flex:1 1 auto;border-radius:var(--radius-panel);font-size:var(--font-size-body);line-height:var(--line-height-loose)}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-20)}
.z3b{background:var(--color-background);align-items:center}
.zw{width:100%;max-width:var(--width-card);display:flex;flex-direction:column;gap:var(--space-16);margin:auto 0}
.zhd{display:flex;flex-direction:column;gap:var(--space-2)}
.zt1{margin:0;font-size:var(--font-size-title-small);font-weight:700;line-height:var(--line-height-body);overflow-wrap:anywhere}
.zhd .zt1{font-size:var(--font-size-heading);line-height:var(--line-height-heading);letter-spacing:-.01em}
.zln{margin:var(--space-4) 0 0;font-size:var(--font-size-body-large);line-height:var(--line-height-loose);color:var(--color-text-muted);white-space:pre-line;overflow-wrap:anywhere}
.zbar{display:flex;gap:var(--space-3);height:6px;margin-top:var(--space-10)}
.zbar i{display:block;border-radius:var(--radius-mark);min-width:4px}
.zbar .zd{background:var(--color-primary)}.zbar .zdc{background:var(--color-primary-mid)}.zbar .zr2{background:var(--color-border)}
.zl{margin:0;background:var(--color-surface);border:1px solid var(--color-border-light);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.zli{display:flex;gap:var(--space-12);align-items:flex-start;padding:var(--space-10) var(--space-16);min-width:0}
.zli+.zli{border-top:1px solid var(--color-surface-muted)}
.zli.zc{padding:var(--space-7) var(--space-16);gap:var(--space-10)}
.zlb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--space-1)}
.zlb dt{font-size:var(--font-size-small);line-height:var(--line-height-body);color:var(--color-text-muted);overflow-wrap:anywhere}
.zlb dd{margin:0;font-size:var(--font-size-lead);font-weight:600;line-height:var(--line-height-title);color:var(--color-text);overflow-wrap:anywhere;white-space:pre-line}
.zli.zc .zlb dd{font-size:var(--font-size-body-large)}
.ze textarea,.zsumc textarea,.zmb textarea{width:100%;box-sizing:border-box;padding:var(--space-4) var(--space-8);font:inherit;font-size:var(--font-size-body-large);font-weight:600;line-height:var(--line-height-title);border:1px solid var(--color-border-control);border-radius:var(--radius-small);resize:vertical}
.ze textarea:focus,.zsumc textarea:focus,.zmb textarea:focus{outline:none;border-color:var(--color-primary)}
.ok{flex:0 0 18px;width:18px;height:18px;margin-top:var(--space-3);border-radius:var(--radius-circle);background:var(--color-primary);color:var(--color-surface);display:inline-flex;align-items:center;justify-content:center}
.zsumc{padding:var(--space-18) var(--space-20)}
.zsum{margin:0;font-size:var(--font-size-summary);font-weight:700;line-height:var(--line-height-document);overflow-wrap:anywhere}
.zsumc textarea{padding:var(--space-8) var(--space-10);font-size:var(--font-size-lead);line-height:var(--line-height-loose)}
.zsec{display:flex;flex-direction:column;gap:var(--space-6);min-width:0}
.zsh{margin:0;font-size:var(--font-size-body);font-weight:700;color:var(--color-text)}
.zshb{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8)}
.zsrc{display:block;margin-top:var(--space-1);font-size:var(--font-size-caption);line-height:var(--line-height-body);color:var(--color-text-subtle);overflow-wrap:anywhere}
.zmk{display:inline-block;margin-left:var(--space-8);padding:0 var(--space-6);border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary-strong);font-size:var(--font-size-caption);font-weight:700;line-height:var(--line-height-badge-small)}
.zmk.zad0{background:var(--color-primary);color:var(--color-surface)}
.znote .ok{margin-top:var(--space-1);background:var(--color-success)}
.znote{display:flex;align-items:center;gap:var(--space-8);min-height:var(--height-control);padding:var(--space-6) var(--space-12);border-radius:var(--radius-panel);background:var(--color-surface);border:1px solid var(--color-border-light);font-size:var(--font-size-body);font-weight:600;overflow-wrap:anywhere}
.zspin{flex:0 0 12px;width:12px;height:12px;border:2px solid var(--color-primary);border-right-color:transparent;border-radius:var(--radius-circle);animation:spin .8s linear infinite}
.zskel{display:flex;flex-direction:column;gap:var(--space-8)}
.zskel i{display:block;height:10px;border-radius:var(--radius-tiny);background:var(--color-surface-muted)}
.zpad{padding:0 0 var(--space-4)}
.zpad2{padding:var(--space-12) var(--space-16);display:flex;flex-direction:column;gap:var(--space-10)}
.zrw .zl{opacity:.55}
.zql{padding:0}
.zqs{position:relative;margin:0;border:0;padding:var(--space-7) var(--space-16);min-width:0}
.zqs+.zqs{border-top:1px solid var(--color-surface-muted)}
.zqh{float:left;width:100%;box-sizing:border-box;padding:0 76px 0 0;margin:0 0 var(--space-2);font-size:var(--font-size-lead);font-weight:700;line-height:var(--line-height-title);overflow-wrap:anywhere}
.zqs.zsplit .zqh{padding-right:0}
.zops{clear:both;display:flex;flex-direction:column}
.zop{display:flex;gap:var(--space-8);align-items:flex-start;min-height:var(--height-option);padding:var(--space-1) 0;cursor:pointer;min-width:0}
.zop input{flex:0 0 auto;margin:var(--space-3) 0 0;accent-color:var(--color-primary);width:15px;height:15px}
.zfield{clear:both;margin:var(--space-8) 0 var(--space-2);padding:var(--space-8) var(--space-10);border:1px solid var(--color-border-light);border-radius:var(--radius-control);min-width:0}
.zfh{margin:0 0 var(--space-4);font-size:var(--font-size-small);font-weight:700}
.zfr{display:flex;gap:var(--space-8);align-items:flex-start;padding:var(--space-4) 0;cursor:pointer;min-width:0}
.zfr input{margin:var(--space-3) 0 0}
.zfr:has(input:focus-visible){outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-bar)}
.zfb{min-width:0;overflow-wrap:anywhere}
.zft{display:block;font-size:var(--font-size-body);font-weight:500}

body.hearing #messages{flex:1 1 auto;min-height:0}

body.hearing header,body.start header{min-height:var(--height-control-touch);padding:0 var(--space-20);gap:var(--space-10)}

/* 画面 1 */

#welcome{padding:0 0 var(--space-16)}

.lrow{display:flex;gap:var(--space-8);align-items:stretch;margin-top:var(--space-8)}

#lockline{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-6) var(--space-16);background:var(--color-surface-muted);border-bottom:1px solid var(--color-border-light);font-size:var(--font-size-small);color:var(--color-text-muted)}

/* 済んだ段階は、いまの段階(青の薄い背景)と区別して、完了の色で塗る(画面のイメージの .pill.done) */

<body class="start">
<header>
  <div class="brand">skill-factory</div>
  <div class="meta" id="work"></div>
  <div class="meta" id="skill"></div>
  <div class="runwrap" id="runwrap" hidden><button type="button" class="running" id="running" aria-expanded="false"></button><div id="stack" hidden></div></div>
  <div class="conn" id="conn" role="status">接続中</div>
</header>
<div id="banner" hidden></div>
<nav class="stages" id="stages" aria-label="段階"></nav>
<main>
  <section class="panel" id="chat" aria-label="AI との会話">
    <div id="welcome"></div>
    <div id="messages"></div>
    <div id="err" role="alert" hidden></div>
    <form id="form">
      <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">メッセージ</label>
      <textarea id="input" rows="2" placeholder="例: 議事録を要約するスキルを作って"></textarea>
      <button class="primary" type="submit">送る</button>
    </form>
    <details id="works" hidden></details>
  </section>
  <section class="panel" id="preview" aria-label="文書と図" hidden>
    <div class="bar">
      <div id="docpath"></div>
      <button type="button" class="dl" id="dl" aria-expanded="false"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"></path></svg>ダウンロード</button>
      <div id="dlmenu" hidden></div>
    </div>
    <div id="figbox" hidden>
      <div class="fighead">
        <div class="title" id="figtitle"></div>
        <span id="tabs"></span>
        <button type="button" class="fold" id="fold">図を畳む</button>
      </div>
      <div id="figure"></div>
    </div>
    <article id="doc"></article>
    <div id="qform" hidden></div>
  </section>
  <section class="panel" id="hear" aria-label="聞き取りの欄" hidden>
    <div class="pbody z3b" id="hearscroll"><div class="zw" id="hearbody"></div></div>
    <div class="zcb" id="bar">
      <div class="zcrec" id="record" hidden><div class="zchd"><span>会話の記録</span><button type="button" class="ghost zcx" id="recordclose">閉じる</button></div></div>
      <div class="zcst" id="strip" role="status" hidden></div>
      <div class="zrep" id="replies" hidden></div>
      <div id="lockline" role="status" hidden><span class="zspin" aria-hidden="true"></span><span>AI が返事を書いている間は送れません。書いた文は残ります。</span></div>
      <div class="zcf" id="zcf"><button type="button" class="ghost zcrb" id="recordopen">会話の記録</button></div>
    </div>
    <div class="pfoot" id="hearfoot"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
// state は、1 回目の読み込みで必ず描くように、読んだ値(なしは null)と違う undefined で始める
const last = {state: undefined, conv: undefined, svg: null, doc: null, figs: null};
let state = null;
// 読んだままの state.json の値。インターフェース設計書の章 2 の表との照合は、補う前の値で行う
let rawState = null;
let items = [];
let busy = false;
// 画面が中継サーバーに送っている間(答えを受けるまで)。要件定義書の章 3.2 のとおり、中継サーバーの答えと 2 秒ごとの読み直しを待たずに、待っている表示を出す
let sending = false;
let tab = null;
let folded = false;
// 押した選択肢と、そのときの決めてもらうこと。state.json の決めてもらうことが変わるまで、ボタンを押せない形にする
let picked = null;
// 中継サーバーが返す、スキルの呼び出しの一覧とサブエージェントの数
let status = {skillCalls: [], subagents: 0, agentCalls: [], workDir: null, sessionLost: false};
// 中継サーバーにつながらないか、claude のコマンドがないとき(E1)
let connNg = false;
// いま見ている作業のフォルダ。中継サーバーを起動し直しても忘れず、送信に添える
let seenWorkDir = null;
// 段階ごとに使うスキルと規約の表(ui/段階ごとのスキルと規約.json)
let stagesTable = null;
let stackOpen = false;
// 質問の一覧で、いま選んだか書いた答え(番号から答えへ)と、送ったときの質問の一覧
let qAnswers = {};
let qSent = null;
// 返答の候補で押した候補と、送ったときの決めてもらうこと
let replyOn = null;
let replySent = null;

// md の表示のライブラリが読めないときは、文のまま出す
const mdToHtml = text => {
  if (window.marked) return marked.parse(text);
  const pre = document.createElement('pre');
  pre.textContent = text;
  return pre.outerHTML;
};

// state.json の値が欠けていても画面を止めないように、配列と文字列のキーを補う
function normalizeState(s) {
  const list = v => (Array.isArray(v) ? v : []);
  const decision = s.decision && typeof s.decision === 'object' ? {...s.decision, choices: list(s.decision.choices), replies: list(s.decision.replies)} : null;
  const questions = s.questions && typeof s.questions === 'object' && Array.isArray(s.questions.items) ? s.questions : null;
  // 聞き取りの画面のキー: 形が違う値は、ないものとして扱う
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : null);
  const rows = v => list(v).filter(obj);
  const summary = obj(s.summary) && {lines: list(s.summary.lines), readings: list(s.summary.readings)};
  const research = obj(s.research) && {rows: rows(s.research.rows)};
  const factCheck = obj(s.factCheck) && {...s.factCheck, facts: rows(s.factCheck.facts), items: rows(s.factCheck.items)};
  const draftReview = obj(s.draftReview) && {checkFirst: rows(s.draftReview.checkFirst).map(x => ({...x, choices: list(x.choices)})), checks: rows(s.draftReview.checks).map(x => ({...x, candidates: list(x.candidates)})), sections: rows(s.draftReview.sections).map(x => ({...x, items: rows(x.items)}))};
  // 回の一覧(インターフェース設計書の章 2 の rounds)。1 つ以上の回を持つときだけ使い、ないときと形が違うときは null(古い形)とする
  const rounds = Array.isArray(s.rounds) && s.rounds.length && s.rounds.every(r => obj(r) && typeof r.kind === 'string' && Array.isArray(r.items)) ? s.rounds.map(r => ({kind: r.kind, items: rows(r.items)})) : null;
  return {...s, stage: s.stage ?? 1, artifacts: list(s.artifacts), figures: list(s.figures), downloads: list(s.downloads), documentPath: typeof s.documentPath === 'string' ? s.documentPath : '', decision, questions, screen: typeof s.screen === 'string' ? s.screen : null, summary, research, factCheck, draftReview, rounds};
}

const fileUrl = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');

// 中継サーバーにつながらないときは null を返す
async function getText(p) {
  try {
    const r = await fetch(fileUrl(p), {cache: 'no-store'});
    return r.ok ? r.text() : null;
  } catch { return null; }
}

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  Object.assign(e, attrs || {});
  if (text !== undefined) e.textContent = text;
  return e;
}

// F1: 画面の状態を読む
async function load() {
  const b = await fetch('/api/status', {cache: 'no-store'}).then(r => r.json()).catch(() => null);
  renderConn(b);
  if (!b) return;
  if (!stagesTable) {
    stagesTable = await fetch('/api/stages', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
    if (stagesTable) renderStages();
  }
  const s = await getText('ui/state.json');
  const c = await getText('ui/conversation.md');
  let changed = false;
  // 文が空か JSON として読めない state.json は、書いている途中とみなし、前の状態を保つ
  let parsed = null;
  if (s) { try { parsed = JSON.parse(s); } catch { parsed = undefined; } }
  if (parsed !== undefined && parsed !== null && typeof parsed !== 'object') parsed = undefined;
  // 最初から読めない state.json のときも、開いた直後の画面を出す
  if (parsed === undefined && !state && last.state === undefined) { last.state = null; renderState(); changed = true; }
  // いったん作業の状態を読んだあとは、state.json が空か読めないときも前の状態を保つ(AI が書き直す途中で画面を初期表示に戻さないため)
  if (state && !parsed) parsed = undefined;
  if (s !== last.state && parsed !== undefined) {
    last.state = s;
    const before = state;
    state = parsed && normalizeState(parsed);
    rawState = parsed;
    // state.json が書き直されたら、同じ問いでも AI がもう一度聞いたものとして、また答えられるようにする
    picked = null;
    qSent = null;
    replySent = null;
    replyOn = null;
    hearOnState(before);
    renderState();
    changed = true;
  }
  if (c !== last.conv) {
    last.conv = c;
    items = parseConversation(c || '');
    changed = true;
  }
  if (b.busy !== busy) { busy = b.busy; changed = true; }
  const st = JSON.stringify([b.skillCalls, b.subagents, b.agentCalls, b.workDir, !!b.sessionLost]);
  if (st !== JSON.stringify([status.skillCalls, status.subagents, status.agentCalls, status.workDir, status.sessionLost])) changed = true;
  // 前の会話を続けられなかった答えは AI に届いていないので、state.json が書き直されたら、同じ質問の一覧も再び出す
  if (status.sessionLost && !b.sessionLost) { qSent = null; picked = null; replySent = null; }
  status = {skillCalls: b.skillCalls || [], subagents: b.subagents || 0, agentCalls: Array.isArray(b.agentCalls) ? b.agentCalls : [], workDir: b.workDir || null, sessionLost: !!b.sessionLost};
  if (b.workDir) seenWorkDir = b.workDir;
  // 「あとで続ける」か「やめる」を AI が受け終わり、中継サーバーが作業を離れたら、画面 1 へ戻る
  if (leaving && !b.busy && !b.workDir) { location.reload(); return; }
  // 送った文の返事が state.json を変えずに終わったときは、ボタンをまた押せるようにする
  if (hear.sent && hear.sent.posted && !b.busy) { hear.sent = null; }
  hearDoc = hearNow() === '画面 6' && state.documentPath ? await getText(state.documentPath) : null;
  if (changed) { renderChat(); renderRunning(); renderQuestions(); }
  renderHear();
  renderConn(b);
  if (state && !frameNow()) {
    await renderFigure();
    await renderDoc();
  }
}

// 段階の表の行。state.json の段階がないときは段階 1 とする
function stageRow() {
  const n = state ? state.stage : 1;
  return stagesTable && stagesTable.find(r => r.stage === n);
}

// 最後に呼んだ段階のスキル(段階の表で種類が「段階」のもの)と、そのあとに呼んだ補助のスキル
function runningSkills() {
  // 段階が進んでも前の段階のスキルを補助と取り違えないように、すべての段階の表で見る
  const kind = name => ((stagesTable || []).some(r => r.skills.some(x => x.name === name && x.kind === '段階')) ? '段階' : '補助');
  const calls = status.skillCalls;
  let main = null, helper = null;
  for (let i = calls.length - 1; i >= 0; i--) {
    if (kind(calls[i]) === '段階') { main = calls[i]; break; }
    if (!helper) helper = calls[i];
  }
  // 段階のスキルをまだ呼んでいないときは、最後に呼んだスキルを出す
  if (!main && helper) { main = helper; helper = null; }
  return {main, helper};
}

// 実行中のスキル: 名前は、中継サーバーが Claude Code の Skill のツールの呼び出しから受け取ったものをそのまま出す
function arrowIcon() {
  const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  arrow.setAttribute('width', '12'); arrow.setAttribute('height', '12'); arrow.setAttribute('viewBox', '0 0 12 12');
  arrow.setAttribute('fill', 'none'); arrow.setAttribute('stroke', 'currentColor'); arrow.setAttribute('stroke-width', '1.6'); arrow.setAttribute('aria-hidden', 'true');
  arrow.innerHTML = '<path d="M3 4.5 6 7.5 9 4.5"/>';
  return arrow;
}

function renderRunning() {
  const later = laterNow();
  if (later) { renderRunningLater(later); return; }
  const {main, helper} = runningSkills();
  const hearing = !!hearNow();
  // 画面 6 で AI が待っている間は、スキルの呼び出しがなくても、書き終えたことを回る印なしで出す
  const written = hearNow() === '画面 6' && !busy;
  $('runwrap').hidden = !main && !(hearing && (busy || sending)) && !written;
  if ($('runwrap').hidden) { stackOpen = false; $('stack').hidden = true; return; }
  const btn = $('running');
  btn.className = 'running';
  btn.replaceChildren();
  if (busy) btn.append(el('span', {className: 'spin', ariaHidden: 'true'}));
  btn.append(document.createTextNode(written ? '要件定義書を書き終えました' : hearing ? '要件定義書を作っています' : busy ? `${main} を実行中` : main));
  if (busy && status.subagents > 0) btn.append(el('span', {className: 'sub'}, `サブエージェント ${status.subagents} 体`));
  else if (helper && !hearing) btn.append(el('span', {className: 'sub'}, `+ ${helper}`));
  btn.append(arrowIcon());
  btn.setAttribute('aria-expanded', String(stackOpen));
  renderStack(main);
}

// 段階 2 から 8 の実行中の表示: 「<スキル> を実行中」。中止(K6)は赤、8 段階がすべて終わった(8-8)は緑
function renderRunningLater(sc) {
  const {main} = runningSkills();
  const start = state.report && state.report.start;
  const text = sc === '中止' ? `${(state.abort && state.abort.skill) || main || ''} を中止`
    : laterAllDone(sc) ? '8 段階がすべて終わった'
    : main ? (busy ? `${main} を実行中` : main)
    : start && start.skill ? `${start.skill} を始める` : '';
  $('runwrap').hidden = !text;
  if (!text) { stackOpen = false; $('stack').hidden = true; return; }
  const btn = $('running');
  btn.className = 'running' + (sc === '中止' ? ' stop' : laterAllDone(sc) ? ' fin' : '');
  btn.replaceChildren();
  if (busy && sc !== '中止' && !laterAllDone(sc)) btn.append(el('span', {className: 'spin', ariaHidden: 'true'}));
  btn.append(document.createTextNode(text));
  if (busy && status.subagents > 0) btn.append(el('span', {className: 'sub'}, `サブエージェント ${status.subagents} 体`));
  btn.append(arrowIcon());
  btn.setAttribute('aria-expanded', String(stackOpen));
  renderStack(main);
}

// 段階で使うスキルと規約の一覧。スキルの状態は、この会話で Skill のツールで呼んだ順から決める
function renderStack(main) {
  const box = $('stack');
  box.hidden = !stackOpen;
  const row = stageRow();
  if (!row) { box.replaceChildren(el('div', {className: 'empty'}, '段階の表を読めません。')); return; }
  const order = [...new Set(status.skillCalls)];
  const nodes = [el('div', {className: 'h'}, `段階 ${row.stage}(${row.name})で使うスキルと規約`), el('div', {className: 'sec'}, 'スキル')];
  for (const k of row.skills) {
    const i = order.indexOf(k.name);
    const now = busy && k.name === main;
    const r = el('div', {className: 'sk'});
    r.append(el('div', {className: 'n'}, k.name),
      el('div', {className: 'st' + (now ? ' now' : i >= 0 ? ' done' : '')}, now ? '実行中' : i >= 0 ? `呼んだ(${i + 1} 番目)` : 'まだ呼んでいない'),
      el('div', {className: 'p'}, k.purpose));
    nodes.push(r);
  }
  nodes.push(el('div', {className: 'sec'}, '規約'));
  for (const r of row.rules) {
    const d = el('div', {className: 'rl'});
    d.append(el('b', {}, r.name), el('span', {}, r.when));
    nodes.push(d);
  }
  box.replaceChildren(...nodes);
}
$('running').onclick = e => { e.stopPropagation(); stackOpen = !stackOpen; renderRunning(); };
document.addEventListener('click', e => { if (stackOpen && !$('runwrap').contains(e.target)) { stackOpen = false; renderRunning(); } });

// F10: 接続の状態を出す。中継サーバーにつながらないときと、claude のコマンドがないときは、ヘッダーの下に直し方を出す
function renderConn(b) {
  const ng = !b ? '中継サーバーにつながりません' : (b.hasClaude ? '' : 'claude のコマンドがありません');
  connNg = !!ng;

  $('conn').className = 'conn' + (ng ? ' ng' : '');
  // E1: 段階 2 から 8 の画面は、つながるまで本文とボタンを押せない形にする
  $('hear').classList.toggle('ldim', connNg && !!laterNow());
  $('banner').hidden = !ng;

    ? 'skill-factory で <code>node ui/server.mjs</code> を起動し、この画面を読み直してください。'
    : 'Claude Code を入れてから、中継サーバーを起動し直してください。';
}

// F2: 段階の帯を出す。段階の名前は段階の表(/api/stages)から出し、表が読めていない間は帯を出さない。成果物の状態を、未着手でない段階の名前の下に出す
function renderStages() {
  $('stages').hidden = !stagesTable;
  if (!stagesTable) return;
  const later = laterNow();
  $('stages').replaceChildren(...stagesTable.map(row => {
    const n = row.stage;
    if (later) return laterPill(later, n, row);
    const hearing = hearNow();
    // 画面 1 と聞き取りの画面は、帯に画面の言葉.md の語を出し、いまの段階の名前の後ろに画面の状態の語を添える
    const name = hearing || !state ? FRAME_STAGES[n - 1] || row.name : row.name;
    const a = state && state.artifacts.find(x => x.stage === n);
    const status = hearing ? (n === 1 ? HEAR_LABEL[hearing] : '未着手') : a ? a.status : '未着手';
    const now = hearing ? n === 1 : state && n === state.stage;
    const cls = now ? 'now' : status === '済み' ? 'done' : status !== '未着手' ? 'back' : '';
    const p = el('div', {className: 'pill ' + cls});
    const label = el('span', {className: 'name'}, name);
    if (status !== '未着手') label.append(el('span', {className: 'status'}, status));
    p.append(el('span', {className: 'num'}, status === '済み' ? '✓' : String(n)), label);
    return p;
  }));
}

function renderState() {
  // 開いた直後の画面: 作業のフォルダが決まる前は、右の欄を出さず、ui/はじめに.md を会話の欄の上に出す
  document.body.classList.toggle('start', !state);
  $('preview').hidden = !state;
  renderStages();
  if (!state) {
    $('work').textContent = '';
    $('skill').textContent = '';
    fetch('/api/start', {cache: 'no-store'}).then(r => r.ok ? r.text() : '').then(md => { $('welcome').innerHTML = mdToHtml(md); }).catch(() => {});
    renderWorks();
    return;
  }
  $('work').textContent = state.workName;
  const sk = state.currentSkill;
  // 段階 2 から 8 の画面は、スキルの名前と作る順を見出しの上の 1 行に出すので、ヘッダーには出さない
  $('skill').textContent = sk && sk.total > 1 && !laterNow() ? `${sk.order} / ${sk.total} ${sk.name}` : '';
  renderDownloads();
}

// 途中の作業の一覧: output/ の下に ui/state.json がある作業を、開いた直後の画面の入力欄の下に出す。0 件なら出さない
function fmtSaved(iso) {
  const d = new Date(iso);
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (d.toDateString() === new Date().toDateString()) return hm;
  return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${hm}`;
}

function workRow(w) {
  const r = el('div', {className: 'wk'});
  const info = el('div');
  const desc = w.done ? '完了(8 段階が済み)' : `段階 ${w.stage}${w.artifact ? ` ${w.artifact.name} ${w.artifact.status}` : ''}`;
  info.append(el('div', {className: 'n'}, w.workName), el('div', {className: 'd'}, `${desc}${w.done ? '' : ` ・ ${w.state}`} ・ 最後の保存 ${fmtSaved(w.savedAt)} ・ ${w.dir}/`));
  const b = el('button', {type: 'button'}, '続きから');
  b.onclick = async () => {
    b.disabled = true;
    let error = null;
    try {
      const res = await fetch('/api/resume', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dir: w.dir})});
      if (!res.ok) error = await res.text();
    } catch { error = '中継サーバーにつながりません。'; }
    if (error) { $('err').hidden = false; $('err').textContent = '続けられませんでした。' + error; b.disabled = false; return; }
    location.reload();
  };
  r.append(info, b);
  return r;
}

async function renderWorks() {
  const works = await fetch('/api/works', {cache: 'no-store'}).then(r => r.ok ? r.json() : []).catch(() => []);

  if (state || !works.length) { box.hidden = true; return; }
  const rest = works.filter(w => !w.done);
  const done = works.filter(w => w.done);
  // 試作の画面 1: 「途中の作業 N 件」は閉じて出し、押すと開く
  const nodes = [el('summary', {}, `途中の作業 ${rest.length} 件`), ...rest.map(workRow)];
  if (done.length) {
    const dt = el('details');
    dt.append(el('summary', {}, `終わった作業 ${done.length} 件`), ...done.map(workRow));
    nodes.push(dt);
  }

}

// F3: 会話を出す。conversation.md の 1 件は、「ユーザー:」か「Claude Code:」で始まる行から、次の同じ形の行の前まで
function parseConversation(text) {
  const list = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^(ユーザー|Claude Code): ?(.*)$/);
    if (m) list.push({user: m[1] === 'ユーザー', lines: [m[2].replace(/^\\(ユーザー|Claude Code):/, '$1:')]});
    else if (list.length) list[list.length - 1].lines.push(line.replace(/^\\(ユーザー|Claude Code):/, '$1:'));
  }
  return list;
}

// 会話の欄: 吹き出し、返事を書いている間の点の吹き出し、決めてもらうことの塊の順に出す
function renderChat() {
  $('welcome').hidden = !!state || items.length > 0;
  if ($('welcome').hidden) $('works').hidden = true;
  const nodes = items.map(it => {
    const text = it.lines.join('\n').trim();
    if (it.user) return el('div', {className: 'msg user'}, text);
    // Claude Code の返事は md なので、見出し、表、箇条書きの形で出す
    const m = el('div', {className: 'msg ai md'});
    m.innerHTML = mdToHtml(text);
    return m;
  });
  if (busy || sending) {
    const t = el('div', {className: 'typing', role: 'status'});
    t.setAttribute('aria-label', 'Claude Code が返事を書いています');
    t.append(el('span'), el('span'), el('span'));
    nodes.push(t);
  }
  const d = state && !frameNow() && !status.sessionLost && state.decision;
  // 選択肢がなく返答の候補がある問いは、問いの吹き出しと候補のボタンで出す。送ったあとと、AI が返事を書いている間は候補を出さない
  if (d && !d.choices.length && d.replies && d.replies.length) {
    const m = el('div', {className: 'msg ai'}, d.question);
    nodes.push(m);
    if (!busy && replySent !== JSON.stringify(d)) {
      const cs = el('div', {className: 'chips'});
      for (const r of d.replies) {
        const b = el('button', {type: 'button', className: 'chip' + (replyOn === r ? ' on' : '')}, r);
        b.onclick = () => { replyOn = r; $('input').value = r; $('input').focus(); renderChat(); };
        cs.append(b);
      }
      nodes.push(cs);
    }
  } else if (d) nodes.push(renderDecision(d));
  const box = $('messages');
  box.replaceChildren(...nodes);
  box.scrollTop = box.scrollHeight;
}

// F7: 承認の選択を送る。最初の選択肢を推奨として青で塗る
function renderDecision(d) {
  const off = busy || !!picked;
  const wrap = el('div', {className: 'decision' + (off ? ' off' : '')});
  wrap.append(el('div', {className: 'q'}, d.question));
  if (!d.choices.length) {
    wrap.append(el('div', {className: 'hint'}, '答えを入力欄に書いて送ってください。'));
    return wrap;
  }
  const row = el('div', {className: 'choices'});
  d.choices.forEach((raw, i) => {
    // 要素がオブジェクトのときは label を表示し、label をそのまま送る
    const c = raw && typeof raw === 'object' ? String(raw.label ?? '') : String(raw);
    const isPicked = picked && picked.text === c;
    const b = el('button', {type: 'button', className: 'choice' + (i === 0 ? ' main' : '') + (isPicked ? ' picked' : ''), disabled: off}, (isPicked ? '✓ ' : '') + c);
    b.onclick = () => {
      picked = {text: c, decision: JSON.stringify(d)};
      renderChat();
      send(c, true);
    };
    row.append(b);
  });
  wrap.append(row);
  return wrap;
}

// F8: ファイルをダウンロードする。ボタンを押すと、ダウンロードできるファイルの一覧の全件を、パスとともに出す

function toggleMenu(open) {

}
$('dl').onclick = e => { e.stopPropagation(); toggleMenu($('dlmenu').hidden); };

// F4: 図を出す(SVG をそのまま埋め込む)。図が 0 件のときは、図の欄を出さない。新しい図ができたら、図の欄を開く
async function renderFigure() {
  const figs = JSON.stringify(state.figures);
  if (figs !== last.figs) {
    last.figs = figs;
    folded = false;
    if (!state.figures.some(f => f.tab === tab)) tab = state.figures.length ? state.figures[state.figures.length - 1].tab : null;
    renderTabs();
  }
  $('figbox').hidden = !state.figures.length || questionsOpen();
  const f = state.figures.find(x => x.tab === tab);
  $('figtitle').textContent = f ? '図: ' + f.tab : '';
  $('figure').hidden = folded;
  $('fold').textContent = folded ? '図を開く' : '図を畳む';
  const svg = f ? await getText(f.path) : null;
  const key = (f ? f.path : '') + '\n' + svg;
  if (key === last.svg) return;
  last.svg = key;
  $('figure').innerHTML = svg || '';
}

function renderTabs() {
  // 図が 1 つのときは、図の名前だけを出し、タブを出さない
  $('tabs').replaceChildren(...(state.figures.length > 1 ? state.figures : []).map(f => {
    const b = el('button', {type: 'button', className: 'tab' + (f.tab === tab ? ' on' : '')}, f.tab);
    b.onclick = () => { tab = f.tab; folded = false; renderTabs(); renderFigure(); };
    return b;
  }));
}
$('fold').onclick = () => { folded = !folded; renderFigure(); };

// F5: 文書を出す。状態は、文書のパスにファイルがあるかと、AI が返事を書いているかの 2 つで決める
async function renderDoc() {
  if (!state.documentPath) { $('doc').replaceChildren(); last.doc = null; return; }
  const md = await getText(state.documentPath);
  const {main} = runningSkills();
  const key = [state.documentPath, md, busy, main].join('\n');
  if (key === last.doc) return;
  last.doc = key;
  const name = state.documentPath.split('/').pop().replace(/\.md$/, '');
  const doc = $('doc');
  doc.replaceChildren();
  if (md === null && busy) {
    // 作っている
    const h = el('div', {className: 'making'});
    h.append(el('span', {className: 'spin', ariaHidden: 'true'}), document.createTextNode(`${name}を書いています`));
    const skel = el('div', {className: 'skel'});
    for (const w of [40, 90, 75, 85]) skel.append(el('div', {style: `width:${w}%`}));
    doc.append(h, el('div', {className: 'making-sub'}, `${main ? main + ' が' : 'AI が'}書いています。書き終わると、ここに出ます。`), skel);
  } else if (md === null) {
    // まだない
    doc.append(el('div', {className: 'none-h'}, `${name}はまだありません`), el('div', {className: 'none-s'}, '会話の最後の返事を確かめてください。'));
  } else if (busy) {
    // 書き直している
    const bar = el('div', {className: 'rewriting', role: 'status'});
    bar.append(el('span', {className: 'spin', ariaHidden: 'true'}), document.createTextNode('書き直しています。書き終わると、新しい中身に替わります。'));
    const body = el('div', {className: 'dim'});
    body.innerHTML = mdToHtml(md);
    doc.append(bar, body);
  } else {
    // 出している
    doc.innerHTML = mdToHtml(md);
  }
}

// 質問の一覧: state.json の questions に、まだ答えていない問いがあり、AI が返事を書いていないときに、右の欄に出す
function questionsOpen() {
  if (frameNow()) return false;
  const q = state && state.questions;
  return !!(q && q.items.some(i => i.answer == null) && !busy && !status.sessionLost && qSent !== JSON.stringify(q));
}

function renderQuestions() {
  const open = questionsOpen();
  $('qform').hidden = !open;
  // 隠した質問の一覧は、次に開くときに作り直す。送った答えを欄に残さないため
  if (!open) { $('qform').dataset.sig = ''; $('qform').replaceChildren(); }
  $('doc').hidden = open;
  if (open) $('figbox').hidden = true;
  if (state) $('dl').hidden = open || !state.downloads.length;
  if (!state) return;
  // 文書のパスは、作業のフォルダ(skill-factory からの相対パス)の下のパスとして出す。作業のフォルダの外(`../`)のパスは、そのまま出す
  const dp = state.documentPath;
  $('docpath').textContent = open ? state.questions.title : (status.workDir && !dp.startsWith('../') ? status.workDir + '/' : '') + dp;
  if (!open) return;
  const q = state.questions;
  const rest = q.items.filter(i => i.answer == null);
  const answered = q.items.length - rest.length + rest.filter(i => (qAnswers[i.number] || '').trim()).length;
  const box = el('div', {className: 'qbox'});
  if (q.added > 0 || q.removed > 0) box.append(el('div', {className: 'qnote'}, `前の答えで、質問が ${q.added} 問増え、${q.removed} 問減りました。`));
  const head = el('div', {className: 'qhead'});
  head.append(el('div', {className: 't'}, q.title), el('div', {className: 'c'}, `全 ${q.items.length} 問(回答済み ${answered} 問、残り ${q.items.length - answered} 問)`));
  box.append(head);
  for (const it of rest) {
    const v = qAnswers[it.number] || '';
    const row = el('div', {className: 'qi'});
    const l = el('div', {className: 'l'});
    l.append(el('span', {className: 'no' + (v.trim() ? ' ok' : '')}, (v.trim() ? '✓ ' : '') + `質問 ${it.number}`), el('span', {className: 'tx'}, it.text));
    row.append(l);
    if (it.choices && it.choices.length) {
      const cs = el('div', {className: 'chips'});
      for (const c of it.choices) {
        const b = el('button', {type: 'button', className: 'chip' + (v === c ? ' on' : '')}, c);
        b.onclick = () => { qAnswers[it.number] = v === c ? '' : c; renderQuestions(); };
        cs.append(b);
      }
      row.append(cs);
    } else {
      const t = el('textarea', {placeholder: '答えを書く', value: v, rows: 1});
      t.setAttribute('aria-label', `質問 ${it.number} の答え`);
      t.oninput = () => { qAnswers[it.number] = t.value; updateQCount(); };
      row.append(t);
    }
    box.append(row);
  }
  const foot = el('div', {className: 'qfoot'});
  const go = el('button', {type: 'button', disabled: answered === q.items.length - rest.length}, '回答を送る');
  go.onclick = () => {
    const lines = rest.filter(i => (qAnswers[i.number] || '').trim()).map(i => `${i.number}: ${qAnswers[i.number].trim()}`);
    if (!lines.length) return;
    qSent = JSON.stringify(q);
    qAnswers = {};
    renderQuestions();
    send(lines.join('\n'), false);
  };
  foot.append(el('span', {}, '答えた問いだけを送る'), go);
  box.append(foot);
  // 書いている途中の入力欄を作り直さないように、問いの組み立てが同じときは数と送るボタンだけを直す
  const sig = JSON.stringify([q, rest.map(i => i.choices && i.choices.length ? qAnswers[i.number] || '' : '')]);
  if ($('qform').dataset.sig === sig && $('qform').firstChild) { updateQCount(); return; }
  $('qform').dataset.sig = sig;
  $('qform').replaceChildren(box);
}

function updateQCount() {
  const q = state.questions;
  const rest = q.items.filter(i => i.answer == null);
  const done = q.items.length - rest.length;
  const answered = done + rest.filter(i => (qAnswers[i.number] || '').trim()).length;
  const c = $('qform').querySelector('.qhead .c');
  if (c) c.textContent = `全 ${q.items.length} 問(回答済み ${answered} 問、残り ${q.items.length - answered} 問)`;
  for (const i of rest) {
    const row = [...$('qform').querySelectorAll('.qi')][rest.indexOf(i)];
    const v = (qAnswers[i.number] || '').trim();
    const no = row && row.querySelector('.no');
    if (no) { no.className = 'no' + (v ? ' ok' : ''); no.textContent = (v ? '✓ ' : '') + `質問 ${i.number}`; }
  }
  const go = $('qform').querySelector('.qfoot button');
  if (go) go.disabled = answered === done;
}

// F6: プロンプトを送る。送れなかったときは、入力欄の上に理由を出し、書いた文を入力欄に戻す
async function send(text, fromChoice, leave) {
  // 要件定義書の章 3.2: 中継サーバーの答えと 2 秒ごとの読み直しを待たずに、待っている表示を出す
  sending = true;
  renderChat();
  renderHear();
  // 画面遷移設計書の章 11 の T27: 聞き取りの画面から AI を呼ぶどの送信にも、たまった直した答えを「直した答え <記録の番号>: <答え>」の行で添える
  const edits = hearNow() ? pendingEdits() : [];
  const body = edits.length ? [text, ...edits.map(x => '直した答え ' + x.label + ': ' + x.answer)].join('\n') : text;
  let error = null;
  try {
    const r = await fetch('/api/prompt', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: body, workDir: state ? seenWorkDir : null, leave})});
    // 409(AI が返事を書いている間)は、段階 2 から 8 の画面では決まった文で出す
    if (!r.ok) error = r.status === 409 && laterNow() ? LOCK_TEXT : await r.text();
  } catch { error = '中継サーバーにつながりません。'; }
  if (!error && edits.length) markEditsSent(edits);
  // 送れたときは、読み直しで busy が届くまで送っている間の表示を保つ。送れなかったときは、ここで送る前の画面に戻す
  // (中継サーバーにつながらないときは load が画面を描き直さない)
  if (error) { sending = false; renderHear(); }
  $('err').hidden = !error;
  $('err').textContent = error ? (error === LOCK_TEXT ? error : '送れませんでした。' + error) : '';
  $('input').classList.toggle('ng', !!error);
  // 前の会話を続けられないときは、そのまま送ると新しい会話に届くので、書いた文を入力欄に戻さない
  await load();
  if (sending) { sending = false; renderHear(); }
  // 送っている間の点の吹き出しを、読み直しの結果に替える
  renderChat();
  if (error) {
    if (fromChoice) { picked = null; renderChat(); }
    else if (!status.sessionLost) { $('input').value = text; replySent = null; renderChat(); }
  }
  return error;
}

// Enter で送り、Shift+Enter で改行する。日本語の変換中の Enter は送らない
$('input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
};

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  // 修正の途中で下の 1 行に書いたときは、修正の入力を残して、先に修正を送るように案内する
  if (hearNow() && hear.editing) {

// インターフェース設計書の章 2: 画面 4 の questions.items の要素は category を持つ。2 つ以上のカテゴリーを持つ一覧(2 段目)は、カテゴリーごとに 1 画面に出す。

// インターフェース設計書(docs/スキル作成の確認と承認の画面/画面の状態のファイルのインターフェース設計書.md)の章 2 の表と、章 3 の聞き返しの decision の形。
// ui/tests/lib/state-contract.mjs と同じ表と判定を持つ。語: req は「必須」、reqItems は「必須(items は 1 件以上)」、null は「null」、nullOrReq は「null か必須」、askBack は「聞き返し」、choice は「選択肢」
const CONTRACT_KEYS = ['summary', 'research', 'factCheck', 'questions', 'draftReview', 'decision'];
const contractRow = (...rules) => Object.fromEntries(CONTRACT_KEYS.map((k, i) => [k, rules[i]]));
const CONTRACT_TABLE = {
  'AI が読む': contractRow('null', 'null', 'null', 'null', 'null', 'null'),
  '画面 2': contractRow('req', 'null', 'null', 'null', 'null', 'choice'),
  '調べるための問い': contractRow('null', 'null', 'null', 'reqItems', 'null', 'askBack'),
  '調査': contractRow('null', 'req', 'null', 'null', 'null', 'null'),
  '画面 3': contractRow('null', 'null', 'req', 'null', 'null', 'choice'),
  '画面 4': contractRow('null', 'null', 'null', 'reqItems', 'null', 'askBack'),

  '画面 5': contractRow('null', 'null', 'null', 'null', 'nullOrReq', 'choice'),

const allChoices = v => Array.isArray(v) && v.every(x => typeof x === 'string' || (isPlainObj(x) && typeof x.label === 'string'));

function decisionFits(d, asking) {
  if (!isPlainObj(d) || typeof d.question !== 'string' || !d.question.trim() || !allChoices(d.choices) || !allStrings(d.replies)) return false;
  if (asking) return d.askBack === true && d.choices.length <= 4;

const stopped = () => h('p', 'zln', 'AI は止まっています。下の「会話の記録」で、最後の返事を確かめてください。');

function screenRead() {
  return {body: [waitNote('AI があなたの文章を読んでいます'), h('p', 'zln', '読み終わると、AI がまとめた内容を見せます。'), !busy && !sending && stopped()], foot: [leftFoot()]};
}

function screenSummary() {
  const s = state.summary || {lines: [], readings: []};
  if (!s.lines.length && !s.readings.length) {
    return {body: [zhead('AI は、あなたの文章だけでは、スキルをまとめられませんでした。', '何を渡すと、何をして、何を出してほしいかを書き足してください。'), sentNote()],
      foot: [leftFoot(), button('あなたの文章に書き足す', {pri: true, off: locked(), on: focusInput})]};
  }
  if (s.readings.length) return screenReadings(s);
  const text = s.lines.join('\n');
  const key = 'summary';
  const list = [{key, name: 'まとめた文', value: text}];
  if (hear.editing) {
    return {body: [h('h2', 'zt1', '違うところを、その場で直してください。'), h('div', 'zl zsumc', area(key, 'まとめた文', text, 3)), h('p', 'zln', '直した文だけを AI が読み直します。あなたの文章は、そのまま残ります。')],
      foot: editFoot('直すのをやめる', 'この文に直す', list, choiceText('違う'), 'まとめ')};
  }
  const sum = h('p', 'zsum', '「');
  s.lines.forEach((l, i) => { if (i) sum.append(h('br')); sum.append(l); });
  sum.append('」');
  return {body: [h('h2', 'zt1', 'あなたの作成したいスキルは'), sentNote(), h('div', 'zl zsumc', sum), h('h2', 'zt1', 'というスキルですね？')],
    foot: [leftFoot(), button(hear.edited ? 'もう一度直す' : '違うところを直す', {off: locked(), on: startEdit}), button('はい', {pri: true, off: locked(), on: () => hearSend(choiceText('はい'))})]};
}

// 2 通り以上に読める短い依頼: 読みの候補を選んでもらう
function screenReadings(s) {
  const first = items.find(i => i.user);
  const asked = first ? first.lines.join('\n').trim() : s.lines.join('');
  const go = button('これで合っています', {pri: true, off: locked() || !hear.answers.reading, on: () => {
    if (hear.answers.reading === 'その他') {
      const t = $('input').value.trim();
      if (!t) { focusInput(); return; }
      $('input').value = '';
      hearSend(t);
    } else hearSend(hear.answers.reading);
  }});
  go.dataset.need = 'reading';
  const legend = '「' + (s.lines.join('') || asked) + '」は、次のどれですか。';
  const opts = h('div', 'zops zshowr');
  for (const [t, r] of [...s.readings.map(x => [x, 'これを選ぶと、AI は、この読みでまとめ直します。']), ['その他', '下の 1 行に書いてください。']]) {
    opts.append(option('reading', t, t, r, hear.answers.reading === t, () => { hear.answers.reading = t; hearGates(); }));
  }
  return {body: [zhead('あなたの作成したいスキルは、次のどれですか？', '「' + asked + '」は、2 通りに読めました。'), sentNote(),
    h('div', 'zl zql', h('fieldset', 'zqs zsplit', h('legend', 'zqh', legend), opts))],
    foot: [leftFoot(), go]};
}

function option(group, raw, label, result, checked, on, tag, many) {
  const input = h('input');
  input.type = many ? 'checkbox' : 'radio';
  input.name = group;
  input.checked = checked;
  input.disabled = locked();
  input.onchange = on;
  return h('label', 'zop', input, h('span', 'zopb', h('span', 'zopt', label, tag && mark(tag, true)), result ? h('small', 'zopr', result) : null));
}

// 選択肢の文の後ろの「(推奨)」と「(AI の推測)」は、文から分けてラベルにする
function parseChoice(c) {
  const m = String(c).match(/^(.*?)[((](推奨|AI の推測)[))]$/);
  return m ? {raw: c, label: m[1], tag: m[2]} : {raw: c, label: c, tag: null};
}

// 項目 7-1、7-10 の欄: 「1 つのファイルにまとめる」で必ず入れる部分を、分ける選択肢で要るファイルを出す。選択肢にどちらもない問いは、必ず入れる部分だけを出す
const SPLIT_WORD = '分けて';
const ONE_FILE = '1 つのファイルにまとめる';
const fieldKind = it => {
  const label = parseChoice(hear.answers[qkey(it)] || '').label;
  const files = Array.isArray(it.files) ? it.files : [];
  const parts = Array.isArray(it.parts) ? it.parts : [];
  if (label.startsWith(SPLIT_WORD) && files.length) return 'files';
  const asksSplit = (it.choices || []).some(c => parseChoice(c).label === ONE_FILE);
  return parts.length && (!asksSplit || label === ONE_FILE) ? 'parts' : null;
};
const fieldState = (it, kind) => {
  const k = qkey(it);
  const all = hear.fields[k] = hear.fields[k] || {};
  return all[kind] = all[kind] || {on: (it[kind] || []).filter(x => x && x.selected !== false).map(x => x.name), other: ''};
};
const otherNames = text => String(text).split(/[、,\n]/).map(x => x.trim()).filter(Boolean);
// 分ける選択肢で要るファイルが 1 件以下のときは、問いに答えていないものとする(選び直すか、まとめる選択肢に替える)
const filesShort = it => {
  if (fieldKind(it) !== 'files') return false;
  const s = fieldState(it, 'files');
  return s.on.length + otherNames(s.other).length <= 1;
};
const FIELD_WORD = {parts: '必ず入れる部分', files: '要るファイル'};
const FIELD_HEAD = {parts: '必ず入れる部分を選んでください。', files: '要るファイルを選んでください。'};
const fieldText = it => {
  const kind = fieldKind(it);
  if (!kind) return '';
  const s = fieldState(it, kind);
  return '(' + FIELD_WORD[kind] + ': ' + ([...s.on, ...otherNames(s.other)].join('、') || 'なし') + ')';
};

const answerOf = it => {
  const v = hear.answers[qkey(it)];
  const note = (hear.notes[qkey(it)] || '').trim();
  if (!v && !note) return '';
  if (filesShort(it)) return '';
  const base = v ? v + fieldText(it) : '';
  if (base && note) return base + '(補足: ' + note + ')';
  return base || note;
};

// 欄の 1 つ: 候補ごとのチェックと、ほかの候補の入力欄
function fieldBlock(it, kind) {
  const number = it.number;
  const s = fieldState(it, kind);
  const box = h('div', 'zfield', h('p', 'zfh', FIELD_HEAD[kind]));
  box.dataset.field = kind;
  for (const x of it[kind].filter(y => y && typeof y === 'object')) {
    const input = h('input');
    input.type = 'checkbox';
    input.checked = s.on.includes(x.name);
    input.disabled = locked();
    input.onchange = () => { s.on = input.checked ? [...s.on, x.name] : s.on.filter(n => n !== x.name); fieldSync(); storeItem(it); hearGates(); };
    // 出典と主な部分は、名前の下の 1 行に並べる
    const note = [x.source, x.mainParts ? '主な部分: ' + x.mainParts : ''].filter(Boolean).join('。');
    box.append(h('label', 'zfr', input, h('span', 'zfb', h('span', 'zft', x.name), note ? h('small', 'zsrc', note) : null)));
  }
  const other = h('textarea');
  other.rows = 1;
  other.placeholder = kind === 'files' ? 'ほかに要るファイルがあれば、名前と中身を書く' : 'ほかに必ず入れる部分があれば、名前を書く';
  other.setAttribute('aria-label', '質問 ' + number + ' のほかの' + FIELD_WORD[kind]);
  other.value = s.other;
  other.disabled = locked();
  other.oninput = () => { s.other = other.value; fieldSync(); storeItem(it); hearGates(); };
  box.append(other);
  return box;
}

// 画面遷移設計書の章 11 の T11 と T13: 「前へ」か「この質問に戻る」で戻した問い(previousAnswer が null でない問い)は、前の回答を答えの欄に入れて出す。
// 前の回答の文を、answerOf が作る形「選択肢の文(必ず入れる部分: …)(補足: …)」に分け、選択肢と欄と補足に入れる。
// 入れた答えから answerOf が作る文が前の回答と同じにならないときは、選択肢を選ばず、前の回答の文をそのまま「理由と補足」の欄に入れる
// 回の一覧があるときは、送った答え(answer)も、同じ形で答えの欄に入れる(prevText)
function fillPrevious(it, choices, many, prevText = it.previousAnswer) {
  const number = qkey(it);
  const prev = String(prevText);
  const fallback = () => {
    hear.answers[number] = '';
    hear.picked[number] = [];
    hear.notes[number] = prev;
    delete hear.fields[number];
  };
  let rest = prev;
  let note = '';
  const noteMatch = rest.match(/^([\s\S]*?)\(補足: ([\s\S]*)\)$/);
  if (noteMatch && noteMatch[1]) { rest = noteMatch[1]; note = noteMatch[2]; }
  let field = null;
  const fieldMatch = rest.match(/^([\s\S]*?)\((必ず入れる部分|要るファイル): ([^()]*)\)$/);
  if (fieldMatch && fieldMatch[1]) { rest = fieldMatch[1]; field = {kind: fieldMatch[2] === '要るファイル' ? 'files' : 'parts', names: fieldMatch[3] === 'なし' ? [] : otherNames(fieldMatch[3])}; }
  if (!choices.length) { fallback(); return; }
  if (many) {
    // 複数を選べる問いの答えは、選んだ選択肢の文を読点で連ねた文。前の回答の文の中の位置の順に並べる
    const picked = choices.filter(c => rest.includes(c.raw)).sort((a, b) => rest.indexOf(a.raw) - rest.indexOf(b.raw)).map(c => c.raw);
    hear.picked[number] = picked;
    hear.answers[number] = picked.join('、');
  } else {
    const c = choices.find(x => x.raw === rest);
    if (!c) { fallback(); return; }
    hear.answers[number] = c.raw;
  }
  if (note) hear.notes[number] = note;
  if (field) {
    const known = (Array.isArray(it[field.kind]) ? it[field.kind] : []).filter(x => x && typeof x === 'object').map(x => x.name);
    hear.fields[number] = {[field.kind]: {on: field.names.filter(n => known.includes(n)), other: field.names.filter(n => !known.includes(n)).join('、')}};
  }
  if (answerOf(it) !== prev) fallback();
}

// 問いの塊: 調べるための問いでは結果の文をすべて出し、画面 4 では選んだ選択肢にだけ出す
function questionBlock(it, showAll) {
  const number = it.number;
  const key = qkey(it);
  const choices = (Array.isArray(it.choices) ? it.choices : []).map(parseChoice);
  const results = Array.isArray(it.results) ? it.results : [];
  const many = it.multiple === true;
  // 送る前の答えと直した答え(回の一覧があるとき)と、前の state.json で答えた、まだ送っていない 2 段目の答え(古い形のとき)は、送った答えと前の回答と「(推奨)」より先に入れる
  if (!restoreStored(it)) restoreKept(it);
  if (it.answer != null && hear.answers[key] === undefined && hear.notes[key] === undefined) {
    if (roundsNow()) fillPrevious(it, choices, many, it.answer);
    else hear.answers[key] = String(it.answer);
  }
  if (it.answer == null && it.previousAnswer != null && hear.answers[key] === undefined && hear.notes[key] === undefined) fillPrevious(it, choices, many);
  const pre = choices.find(c => c.tag);
  if (pre && hear.answers[key] === undefined) hear.answers[key] = pre.raw;
  const f = h('fieldset', 'zqs', h('legend', 'zqh', it.text));
  const found = typeof it.reason === 'string' && it.reason.startsWith('AI が調べて');
  // 違いを比べて選ぶ問い(調べて見つけたことを添えた問い、項目 7-1 と 7-10 の欄を持つ問い、AI が推測した選択肢を持つ問い、「それぞれを選ぶと」と書いた問い)は、すべての選択肢に結果の文を出す
  const compare = found || choices.some(c => c.tag === 'AI の推測') || (Array.isArray(it.parts) && it.parts.length > 0) || (Array.isArray(it.files) && it.files.length > 0) || (typeof it.reason === 'string' && it.reason.includes('それぞれを選ぶと'));
  const every = showAll || compare;
  if (found) f.append(h('p', 'zfound', it.reason));
  else if (every && it.reason) f.append(h('p', 'zln zpad', it.reason));
  const fieldBoxes = {parts: Array.isArray(it.parts) && it.parts.length ? fieldBlock(it, 'parts') : null, files: Array.isArray(it.files) && it.files.length ? fieldBlock(it, 'files') : null};
  const hasOne = choices.some(c => c.label === ONE_FILE);
  const warn = h('p', 'zfw', '要るファイルが 1 つ以下です。' + (hasOne ? '「' + ONE_FILE + '」に替えるか、ファイルを 2 つ以上選び直してください。' : 'ファイルを 2 つ以上選び直すか、「理由と補足」に 1 つにまとめると書いてください。'));
  warn.setAttribute('role', 'status');
  if (fieldBoxes.files) fieldBoxes.files.append(warn);
  // 答えを選ぶか書くたびに、送る前の答えか直した答えとして持つ
  const changed = () => { storeItem(it); hearGates(); };
  const sync = () => {
    const kind = fieldKind(it);
    for (const k of ['parts', 'files']) if (fieldBoxes[k]) fieldBoxes[k].hidden = k !== kind;
    warn.hidden = !filesShort(it);
  };
  fieldSyncs.push(sync);
  if (choices.length) {
    const ops = h('div', 'zops' + (every ? ' zshowr' : ''));
    // 複数を選べる問いの答えは、選んだ選択肢の文を読点で連ねる。「ない」「確かめない」は、選ぶとほかを選べない
    const lone = c => c.label === 'ない' || c.label === '確かめない';
    if (many && !hear.picked[key]) hear.picked[key] = choices.filter(c => String(hear.answers[key] || '').includes(c.raw)).map(c => c.raw);
    const picks = () => hear.picked[key] || [];
    const inputs = [];
    choices.forEach((c, i) => {
      const checked = many ? picks().includes(c.raw) : hear.answers[key] === c.raw;
      const on = () => {
        if (!many) hear.answers[key] = c.raw;
        else {
          const now = inputs[i].checked;
          const others = now && lone(c) ? [] : picks().filter(p => p !== c.raw && !(now && choices.some(x => x.raw === p && lone(x))));
          hear.picked[key] = now ? [...others, c.raw] : others;
          hear.answers[key] = hear.picked[key].join('、');
          choices.forEach((x, j) => { inputs[j].checked = picks().includes(x.raw); });
        }
        sync();
        changed();
      };
      const node = option('q' + key, c.raw, c.label, results[i], checked, on, c.tag, many);
      inputs.push(node.querySelector('input'));
      ops.append(node);
    });
    f.append(ops);
  }
  if (fieldBoxes.parts) f.append(fieldBoxes.parts);
  if (fieldBoxes.files) f.append(fieldBoxes.files);
  sync();
  const more = h('details', 'zmore');
  more.append(h('summary', null, choices.length ? '理由と補足' : '答えを書く'));
  const t = h('textarea');
  t.rows = 1;
  t.placeholder = choices.length ? '選択肢にない答えか、補足の文' : '答えを書く';
  t.setAttribute('aria-label', '質問 ' + number + ' の答え');
  t.value = hear.notes[key] || '';
  t.oninput = () => { hear.notes[key] = t.value; changed(); };
  const why = !found && !every && it.reason ? it.reason + (it.example ? ' 例: 「' + it.example + '」' : '') : (it.example && !showAll ? '例: 「' + it.example + '」' : null);
  more.append(h('div', 'zmb', why ? h('p', 'zp', why) : null, t, ghost('分からない', () => { hear.notes[key] = '分からない'; t.value = '分からない'; changed(); }, locked(), 'zf')));
  if (!choices.length || (hear.notes[key] || '').trim()) more.open = true;
  f.append(more);
  return f;
}

function questionsSend(rest) {
  for (const i of rest) delete kept[i.text];
  const list = rest.map(i => ({text: i.text, answer: answerOf(i)}));
  hearSend(rest.map(i => i.number + ': ' + answerOf(i)).join('\n'), {answers: list});
}

// 「次へ」は、needs のすべての問いに答えると押せる。on を渡さないときは、needs の答えを送る。allowEmpty は、needs が 0 件でも押せるときに true
function nextButton(needs, on, allowEmpty) {
  const go = button('次へ', {pri: true, off: locked() || (!allowEmpty && !needs.length) || !needs.every(answerOf), on: on || (() => questionsSend(needs))});
  go.dataset.need = 'questions';
  go.needItems = needs;
  go.allowEmpty = !!allowEmpty;
  return go;
}

// 2 段目のカテゴリーの切り替え(画面遷移設計書の章 11 の T10-2、T11、T13)。AI に送らず、画面の中で出すカテゴリーを替える
function switchCat(i) {
  hear.cat = i;
  hear.view = null;
  hear.sig = null;
  renderHear();
  $('hearscroll').scrollTop = 0;
}

// 次の問いを書いている間: 受け取った答えを出す
function answersWait(head) {
  const box = h('div', 'zl zql zpad2', ...hear.sent.answers.map(a => h('div', 'zlb', h('dt', null, '受け取った答え'), h('dd', null, a.answer))), skeleton());
  return {body: [...head, waitNote('次の質問を書いています'), box], foot: [leftFoot()]};
}

function noticeLine(q) {
  const added = q.added > 0 ? '質問が ' + q.added + ' 問増えました。' : '';
  const removed = q.removed > 0 ? '質問が ' + q.removed + ' 問減りました。' : '';
  const text = q.notice || (added || removed ? '前の答えで、' + added + removed : '');
  if (!text) return null;
  return text.includes('調べ直しています') && busy ? waitNote(text) : okNote(text);
}

function screenPreQuestions() {
  if (roundsNow()) return screenRounds();
  const q = state.questions;
  if (!q || !q.items.length) return {body: [zhead('調べる前に聞くことはありません。', 'あなたの文章から決まりました。'), sentNote()], foot: [leftFoot()]};
  const rest = q.items.filter(i => i.answer == null);
  const head = [zhead(String(q.title || 'このスキルを作るために、調べる前に教えてください').replace(/。$/, ''), '次の ' + q.items.length + ' 問です。答えで、AI が調べる場所が決まります。')];
  if (hear.sent && hear.sent.answers) return answersWait(head);
  return {body: [...head, noticeLine(q), !hear.sent && busy && waitNote('AI があなたの文を読んでいます'), h('div', 'zl zql', ...q.items.map(i => questionBlock(i, true)))], foot: [leftFoot(), nextButton(rest)]};
}

function screenResearch() {
  const rows = state.research ? state.research.rows : [];
  const line = r => {
    const done = r.status === '調べました';
    const skip = r.status === '調べられませんでした';
    return h('div', 'zli zrs', h('span', 'zrsi', done ? okIcon() : skip ? h('span', 'zskip') : busy ? h('span', 'zspin') : h('span', 'zskip')),
      h('div', 'zlb', h('dd', null, done || skip ? r.name : 'AI が調べています: ' + r.name), r.result ? h('dt', null, r.result) : null));
  };
  return {body: [zhead('AI が調べています', 'あなたの文章を、実際のファイルと環境に照らしています。終わると、自動で次へ進みます。'),
    rows.length ? h('div', 'zl', ...rows.map(line)) : null, !busy && stopped()], foot: [leftFoot()]};
}

function screenFacts() {
  const fc = state.factCheck || {heading: '', note: '', facts: [], items: []};
  ledgerNoteTotal(fc.note);
  const list = fc.items.map((it, i) => ({key: 'f' + i, name: it.name, value: it.value, label: it.label}));
  const facts = fc.facts.length ? h('section', 'zsec', h('h3', 'zsh', 'AI が調べて分かったこと'), h('p', 'zln', '違っていれば、「内容を修正する」で直してください。'),
    h('dl', 'zl', ...fc.facts.map(x => h('div', 'zli', h('div', 'zlb', h('dd', null, x.text), h('small', 'zsrc', '出どころ: ' + x.source)))))) : null;
  const rows = list.length ? h('dl', 'zl', ...list.map(x => h('div', 'zli', okIcon(), h('div', 'zlb', h('dt', null, x.name, x.label && mark(x.label, x.label === '追加')), hear.editing ? h('dd', 'ze', area(x.key, x.name, x.value)) : h('dd', null, x.value))))) : null;
  const headText = hear.editing ? zhead('違うところを、その場で直してください。', '直した内容だけを AI が読み直します。ほかの内容は、そのまま残ります。') : zhead(fc.heading, fc.note);
  if (hear.editing) return {body: [headText, facts, rows], foot: editFoot('修正をやめる', 'この内容に直す', list, choiceText('内容を修正する'))};
  const choices = plainDecision() ? plainDecision().choices.map(c => normChoice(c).label).filter(c => !c.startsWith('内容を修正する')) : [];
  const mainText = choices[0] || (list.length ? '合っています。質問へ進む' : '質問へ進む');
  const foot = [leftFoot()];
  // 文章と調べた結果から決まった内容が 0 個のときは、書き足す道を出す
  if (list.length) foot.push(button(hear.edited ? 'もう一度修正する' : '内容を修正する', {off: locked(), on: startEdit}));
  else foot.push(button('あなたの文章に書き足す', {off: locked(), on: focusInput}));
  foot.push(button(mainText.replace(/[((]推奨[))]$/, ''), {pri: true, off: locked(), on: () => hearSend(mainText)}));
  return {body: [headText, sentNote(), facts, rows], foot};
}

function screenQuestions() {
  if (roundsNow()) return screenRounds();
  const q = state.questions;
  if (hear.view === 'answers') return screenAnswers();
  if (!q || !q.items.length) return {body: [zhead('質問はありません。', 'このあと、要件定義書の下書きで決めます。'), sentNote()], foot: [leftFoot()]};
  // 2 段目(2 つ以上のカテゴリー)は、いまのカテゴリーの問いだけを出し、数もいまのカテゴリーの問いで数える
  const groups = questionGroups(q);
  const multi = groups.length > 1;
  const ci = multi ? Math.min(hear.cat, groups.length - 1) : 0;
  const group = groups[ci];
  const lastCat = ci === groups.length - 1;
  const allRest = q.items.filter(i => i.answer == null);
  const rest = group.items.filter(i => i.answer == null);
  // 前のカテゴリーの未回答の問いは、画面の中で答えた問い(まだ送っていない)として数える
  const earlier = groups.slice(0, ci).flatMap(g => g.items).filter(i => i.answer == null).length;
  const l = ledger();
  const done = l.items.length + earlier;
  const firstNo = done + 1;
  const lastNo = done + rest.length;
  const left = l.total === null ? null : Math.max(0, l.base + l.total + (q.added || 0) - (q.removed || 0) - done - rest.length);
  const line = '質問 ' + firstNo + (rest.length > 1 ? ' から ' + lastNo : '') + '。' + (left === null ? '' : left ? '残り約 ' + left + ' 問です。' : 'これで最後です。');
  const bar = h('div', 'zbar');
  bar.setAttribute('aria-hidden', 'true');
  const seg = (cls, n) => { if (n > 0) { const i = h('i', cls); i.style.flex = String(n); bar.append(i); } };
  seg('zd', done); seg('zdc', rest.length || 1); seg('zr2', left || 0);
  const head = [zhead(group.name || q.title, line, bar)];
  if (hear.sent && hear.sent.answers) return answersWait(head);
  // 2 段目のカテゴリーの間は AI に送らないので、知らせの行は 1 つ目のカテゴリーにだけ出す(画面遷移設計書の章 5)
  const notice = multi && ci > 0 ? null : noticeLine(q);
  // 最後でないカテゴリーの「次へ」は、AI に送らず次のカテゴリーを出す。最後のカテゴリーの「次へ」は、すべてのカテゴリーの未回答の問いの答えをまとめて送る(T10-2、T10)
  const go = !multi ? nextButton(rest) : lastCat ? nextButton(allRest) : nextButton(rest, () => switchCat(ci + 1), true);
  // 2 段目の 2 つ目からのカテゴリーの「前へ」は、AI に送らず前のカテゴリーを出す(T11)。古い形の state.json は送った問いを持たないので、送った問いへ戻る「前へ」を出さない
  const back = multi && ci > 0 ? button('前へ', {off: locked(), on: () => switchCat(ci - 1)}) : null;
  return {body: [...head, notice, !hear.sent && busy && waitNote('AI があなたの文を読んでいます'), hear.sent ? sentNote() : null, h('div', 'zl zql', ...group.items.map(i => questionBlock(i, false)))],
    foot: [leftFoot(ghost('これまでの答えの一覧', () => { hear.view = 'answers'; hear.sig = null; renderHear(); }, false)), back, go].filter(Boolean)};
}

// 回の一覧(rounds)があるときの、調べるための問いと画面 4(承認された設計の 1 から 5)。
// ページは、回ごとに、カテゴリーが同じ問いを 1 ページにまとめたもの。「置き換えた」問いは出さない
function roundPages() {
  const rounds = roundsNow() || [];
  const pages = [];
  rounds.forEach((r, ri) => {
    const items = r.items.filter(i => i.replaced !== true);
    if (!items.length) return;
    for (const g of questionGroups({items})) if (g.items.length) pages.push({ri, kind: r.kind, name: g.name, items: g.items, last: ri === rounds.length - 1});
  });
  return pages;
}
// いまの場所: 開き直したときと「続きから」のときは、最後の回の、送る前の答えでも埋まっていない最初のカテゴリーを出す。すべて埋まっているときは最後のカテゴリー
function pageNow(pages) {
  if (hearPage !== null && hearPage < pages.length) return hearPage;
  const all = storeRead();
  const done = it => it.answer != null || !!(all[qkey(it)] && all[qkey(it)].text === it.text && all[qkey(it)].answer);
  const lastRound = pages[pages.length - 1].ri;
  const i = pages.findIndex(p => p.ri === lastRound && !p.items.every(done));
  hearPage = i >= 0 ? i : pages.length - 1;
  return hearPage;
}
function switchPage(i) {
  hearPage = i;
  hear.view = null;
  hear.sig = null;
  renderHear();
  $('hearscroll').scrollTop = 0;
}
// ページを切り替えるボタン(主でないボタン)。AI を待つ間も押せる。「次へ」は、ページの問いのすべてに答えると押せる
function pageButton(label, needs, on) {
  const b = button(label, {off: !needs.every(answerOf), on});
  b.dataset.need = 'questions';
  b.dataset.nav = 'true';
  b.needItems = needs;
  b.allowEmpty = true;
  return b;
}
const SENT_NOTE = 'この画面で直した答えは、次に AI に送るときに一緒に送ります。';
const SEND_NOTE = 'AI は、回答を読んで、次の画面を作ります。';
const PRE_KINDS = ['調べるための問い', '既にあるものとの関係の問い'];
function screenRounds() {
  if (hear.view === 'answers') return screenRoundAnswers();
  const q = state.questions;
  const pages = roundPages();
  if (!pages.length) return state.screen === '調べるための問い' ? {body: [zhead('調べる前に聞くことはありません。', 'あなたの文章から決まりました。'), sentNote()], foot: [leftFoot()]}
    : {body: [zhead('質問はありません。', 'このあと、要件定義書の下書きで決めます。'), sentNote()], foot: [leftFoot()]};
  // 出していないページの問いも、送る前の答えで「回答を送る」を押せるかを決めるので、持っている答えを先に入れる
  for (const p of pages) p.items.forEach(restoreStored);
  const pi = pageNow(pages);
  const page = pages[pi];
  const lastRound = pages[pages.length - 1].ri;
  const isLast = pi === pages.length - 1;
  const roundRest = pages.filter(p => p.ri === lastRound).flatMap(p => p.items).filter(i => i.answer == null);
  const before = pages.slice(0, pi).reduce((n, p) => n + p.items.length, 0);
  const pre = page.kind === '調べるための問い';
  let headNode;
  if (pre) headNode = zhead(String((page.last && q && q.title) || 'このスキルを作るために、調べる前に教えてください').replace(/。$/, ''), '次の ' + page.items.length + ' 問です。答えで、AI が調べる場所が決まります。');
  else {
    // 問いの番号は、前のページの問いの数の続きから数える。残りの問数は、画面 3 の文「質問 N 問」から、調査の前と直後の回の問いを除いて数える
    const l = ledger();
    const upto = pages.slice(0, pi + 1).filter(p => !PRE_KINDS.includes(p.kind)).reduce((n, p) => n + p.items.length, 0);
    const left = l.total === null ? null : Math.max(0, l.total + ((q && q.added) || 0) - ((q && q.removed) || 0) - upto);
    const line = '質問 ' + (before + 1) + (page.items.length > 1 ? ' から ' + (before + page.items.length) : '') + '。' + (left === null ? '' : left ? '残り約 ' + left + ' 問です。' : 'これで最後です。');
    const bar = h('div', 'zbar');
    bar.setAttribute('aria-hidden', 'true');
    const seg = (cls, n) => { if (n > 0) { const i = h('i', cls); i.style.flex = String(n); bar.append(i); } };
    seg('zd', before); seg('zdc', page.items.length); seg('zr2', left || 0);
    headNode = zhead(page.name || (page.last && q && q.title) || page.kind, line, bar);
  }
  // T11 と T10-2: 「前へ」「次へ」は、回をまたいでも AI に送らずにページを切り替える
  const back = pi > 0 ? pageButton('前へ', [], () => switchPage(pi - 1)) : null;
  const listButton = ghost('これまでの答えの一覧', () => { hear.view = 'answers'; hear.sig = null; renderHear(); }, false);
  // 承認された設計の 5: 送った直後は待っている表示を出す。待っている間も「前へ」で前のページを読める
  if (isLast && hear.sent && hear.sent.answers) {
    const w = answersWait([headNode]);
    return {body: w.body, foot: [leftFoot(), back].filter(Boolean)};
  }
  // 知らせの行は、いまの回の最初のページにだけ出す(画面遷移設計書の章 5 の表の下の段落)
  const notice = page.last && pages.findIndex(p => p.ri === lastRound) === pi && q ? noticeLine(q) : null;
  const sentPage = page.items.some(i => i.answer != null);
  let go;
  if (isLast) {
    // T6 と T10: 回の最後のページだけ、主なボタン「回答を送る」と、その横の文を出す
    const send = button('回答を送る', {pri: true, off: locked() || !roundRest.length || !roundRest.every(answerOf), on: () => questionsSend(roundRest)});
    send.dataset.need = 'questions';
    send.needItems = roundRest;
    go = h('span', 'zgw', h('span', 'fq', SEND_NOTE), send);
  } else go = pageButton('次へ', page.items, () => switchPage(pi + 1));
  return {body: [headNode, sentPage ? h('p', 'zln', SENT_NOTE) : null, notice, !hear.sent && busy && waitNote('AI があなたの文を読んでいます'), hear.sent ? sentNote() : null, h('div', 'zl zql', ...page.items.map(i => questionBlock(i, pre)))],
    foot: [leftFoot(listButton), back, go].filter(Boolean)};
}

// 回の一覧があるときの、これまでの答えの一覧。送った答えと、送る前の答えと直した答えを出す。「この質問に戻る」は、AI に送らずに、その問いのページを出す(T13)
function screenRoundAnswers() {
  const pages = roundPages();
  const rows = [];
  let no = 0;
  pages.forEach((p, pi) => p.items.forEach(it => {
    no++;
    restoreStored(it);
    const shown = hear.answers[qkey(it)] !== undefined || hear.notes[qkey(it)] !== undefined ? answerOf(it) : it.answer != null ? String(it.answer) : '';
    if (!shown) return;
    rows.push(h('div', 'zli zans', h('div', 'zlb', h('dt', null, '質問 ' + no + ' ・ ' + it.text), h('dd', null, shown)), button('この質問に戻る', {cls: 'zb2', on: () => switchPage(pi)})));
  }));
  const backTo = () => { hear.view = null; hear.sig = null; renderHear(); };
  return {body: [zhead('これまでの答え', '直す質問を選んでください。ほかの答えは、そのまま残ります。'), rows.length ? h('div', 'zl', ...rows) : h('p', 'zln', 'まだ答えた質問はありません。')],
    foot: [leftFoot(), button('質問に戻る', {pri: true, on: backTo})]};
}

function screenAnswers() {
  const l = ledger();
  // 2 段目のまだ送っていないカテゴリーの答えも出す。その問いの「この質問に戻る」は、AI に送らずそのカテゴリーを出す(T13)
  const q = state.questions;
  const groups = q && q.items.length ? questionGroups(q) : [];
  const unsent = groups.length > 1 ? q.items.filter(i => i.answer == null) : [];
  unsent.forEach(restoreKept);
  const catIndex = it => groups.findIndex(g => g.items.includes(it));
  const local = unsent.filter(it => answerOf(it));
  // 古い形の state.json は送った問いを持たないので、送った問いの行には「この質問に戻る」を出さない
  const row = (no, text, answer, on) => h('div', 'zli zans', h('div', 'zlb', h('dt', null, '質問 ' + no + ' ・ ' + text), h('dd', null, answer)), on ? button('この質問に戻る', {cls: 'zb2', off: locked(), on}) : null);
  const rows = l.items.map((a, i) => {
    const it = local.find(x => x.text === a.text);
    return it ? row(i + 1, a.text, answerOf(it), () => switchCat(catIndex(it))) : row(i + 1, a.text, a.answer, null);
  });
  local.filter(it => !l.items.some(a => a.text === it.text)).forEach((it, j) => rows.push(row(l.items.length + j + 1, it.text, answerOf(it), () => switchCat(catIndex(it)))));
  const backTo = () => { hear.view = null; hear.sig = null; renderHear(); };
  return {body: [zhead('これまでの答え', '直す質問を選んでください。ほかの答えは、そのまま残ります。'), rows.length ? h('div', 'zl', ...rows) : h('p', 'zln', 'まだ答えた質問はありません。')],
    foot: [leftFoot(), button('質問に戻る', {pri: true, on: backTo})]};
}

function screenLeave() {
  const place = (status.workDir || seenWorkDir || '<作業のフォルダ>') + '/聞き取りの記録.md';
