// 画面 5 の、これまでの答えの一覧(承認された設計の 3)。送った回の問いの塊を並べ、答えをその場で直せる。直した答えは localStorage にためる。
// 「直した答えを送る」で、選択肢「直す」の文とたまった直した答えを送る
const openAnswers = () => { hear.view = 'answers'; hear.sig = null; renderHear(); $('hearscroll').scrollTop = 0; };
const answersGhost = () => (roundsNow() ? ghost('これまでの答えの一覧', openAnswers, false) : null);
function screenReviewAnswers() {
  const answered = roundPages().flatMap(p => p.items).filter(i => i.answer != null);
  const backTo = () => { hear.view = null; hear.sig = null; renderHear(); };
  const go = button('直した答えを送る', {pri: true, off: locked() || !pendingEdits().length, on: () => hearSend(choiceText('直す'))});
  go.dataset.need = 'edits';

// AI の最後の文から「**確かめる点: <語>(<項目>)**」と「- 読みの候補: <候補>」の組を取り出す。候補の文は読点を持つので、分けずに出す
function checksFromChat() {
  const last = [...items].reverse().find(i => !i.user && i.lines.join('\n').includes('確かめる点:'));
  const found = last ? [...last.lines.join('\n').matchAll(/\*\*(確かめる点: [^*\n]+)\*\*\s*\n\s*- 読みの候補: (.+)/g)] : [];
  if (!found.length) return [{key: 'c0', text: '確かめる点', candidates: '読みの候補は、下の「会話の記録」にあります。', options: [], results: []}];
  return found.map((m, i) => ({key: 'c' + i, text: m[1], candidates: '読みの候補: ' + m[2], options: [], results: []}));
}

function screenDraft() {
  const dr = state.draftReview;
  if (dr && hear.view === 'answers' && roundsNow()) return screenReviewAnswers();
  if (!dr) {
    if (busy) return {body: [waitNote('要件定義書を書いています'), h('div', 'zl zpad2', h('p', 'zln', 'defining-skill-requirements が書いています。書き終わると、ここに出ます。'), skeleton())], foot: [leftFoot()]};
    return {body: [zhead('要件定義書はまだありません', '下の「会話の記録」で、最後の返事を確かめてください。')], foot: [leftFoot()]};
  }
  const count = t => { const x = dr.sections.find(y => y.title === t); return x ? x.items.length : 0; };
  const nums = [['あなたの文章から決まった内容', 'あなたの文章から '], ['質問で答えた内容', '質問の答えで '], ['AI が調べた内容', 'AI の調査で ']].filter(([t]) => count(t)).map(([t, w]) => w + count(t) + ' 個').join('、');
  // 確かめる点は、問いの一覧か draftReview.checks で届く
  const first = dr.checkFirst;
  const asks = state.questions ? state.questions.items.filter(i => i.answer == null) : [];
  const checkBlocks = [...asks.map(i => ({key: 'q' + i.number, number: i.number, text: i.text, options: (i.choices || []).map(c => parseChoice(c).raw), results: i.results || []})),
    ...dr.checks.map((x, i) => ({key: 'k' + i, number: 'k' + i, text: x.name, options: x.candidates, results: []}))];
    // AI が選択肢を「読みを選んで続ける」にしたのに、state.json に確かめる点の行がないときは、AI の最後の文の確かめる点を出し、読みを書いてもらう
  const pd = plainDecision();
  const pdLabels = pd ? pd.choices.map(c => normChoice(c).label) : [];
  const wantsPick = pd && pdLabels.some(c => c.startsWith('読みを選んで続ける')) && !pdLabels.some(c => c.startsWith('承認する'));
  if (wantsPick && !checkBlocks.length) checkBlocks.push(...checksFromChat());
  const hasChecks = checkBlocks.length > 0;
  const list = [];
  const secNode = sec => {
    const editable = hear.editing && sec.title !== 'AI が調べた内容';
    const rows = sec.items.map((x, i) => {
      const key = 'd' + dr.sections.indexOf(sec) + '-' + i;
      if (editable) list.push({key, name: x.name, value: x.value});
      return h('div', 'zli zc', okIcon(), h('div', 'zlb', h('dt', null, x.name), editable ? h('dd', 'ze', area(key, x.name, x.value)) : h('dd', null, x.value)));
    });
    // T20: 見出し「質問で答えた内容」は、回の一覧があるときは AI に送らず、画面の中で「これまでの答えの一覧」を出す。ほかの見出しは、見出しを添えて AI に送る
    const inScreen = sec.title === '質問で答えた内容' && roundsNow();
    // ボタン「この項目の画面へ」は、見出し「あなたの文章から決まった内容」と「質問で答えた内容」にだけ出す
    const back = ['AI が調べた内容', 'AI の案で決まった内容'].includes(sec.title) ? null : ghost('この項目の画面へ', inScreen ? openAnswers : () => hearSend(choiceText('直す') + '\n「' + sec.title + '」の画面へ戻る'), locked(), 'zf');
    return h('section', 'zsec', h('h3', 'zsh zshb', sec.title, back), h('dl', 'zl', ...rows));
  };
  const secs = dr.sections.map(secNode);
  const headNode = hear.editing ? zhead('違うところを、その場で直してください。', '直した内容だけを AI が読み直します。ほかの内容は、そのまま残ります。')
    : zhead('この内容で要件定義書を書いてよいですか？', nums ? nums + 'です。' : null);
  const checkNode = hasChecks ? h('section', 'zsec', h('h3', 'zsh', '確かめる点'), h('div', 'zl zql', ...checkBlocks.map(c => {
    const found = h('p', 'zfound', 'AI とは別の照合者が、読む人によって 2 通りに読めると指摘しました。');
    if (c.candidates !== undefined) {
      const t = h('textarea');
      t.rows = 2;
      t.placeholder = '選ぶ読みを書く';
      t.setAttribute('aria-label', c.text + ' の読み');
      t.value = hear.answers[c.key] || '';
      t.oninput = () => { hear.answers[c.key] = t.value.trim(); hearGates(); };
      return h('fieldset', 'zqs zsplit', h('legend', 'zqh', c.text), found, h('p', 'zln zpad', c.candidates), h('div', 'zmb', t));
    }
    const ops = h('div', 'zops zshowr');
    c.options.forEach((t, i) => ops.append(option('chk' + c.key, t, parseChoice(t).label, c.results[i], hear.answers[c.key] === t, () => { hear.answers[c.key] = t; hearGates(); })));
    return h('fieldset', 'zqs zsplit', h('legend', 'zqh', c.text), found, ops);
  }))) : null;
  // 先に確かめる行は、下書きの承認の直しで「変更」か「追加」のラベルを付けた行(0 件以上)。0 件のときは塊を出さない。
  // 「追加」の行が問い(question と choices)を持つときは、その行に選択肢を出し、選んだ値を承認の文に「<行の名前>: <選んだ値>」の行で添える
  const firstAsks = first.map((x, i) => ({...x, key: 'f' + i})).filter(x => typeof x.question === 'string' && x.question.trim());
  const firstAsk = x => {
    if (!x.choices.length) {
      const t = h('textarea');
      t.rows = 2;
      t.placeholder = '答えを書く';
      t.setAttribute('aria-label', x.question + ' の答え');
      t.value = hear.answers[x.key] || '';
      t.oninput = () => { hear.answers[x.key] = t.value.trim(); hearGates(); };
      return h('fieldset', 'zqs zsplit', h('legend', 'zqh', x.question), h('div', 'zmb', t));
    }
    const ops = h('div', 'zops zshowr');
    x.choices.forEach(t => ops.append(option('chk' + x.key, t, parseChoice(t).label, null, hear.answers[x.key] === t, () => { hear.answers[x.key] = t; hearGates(); }, parseChoice(t).tag)));
    return h('fieldset', 'zqs zsplit', h('legend', 'zqh', x.question), ops);
  };
  const firstNode = first.length ? h('section', 'zsec', h('h3', 'zsh', '先に確かめる行'), h('dl', 'zl', ...first.map((x, i) => {
    const ask = firstAsks.find(a => a.key === 'f' + i);
    return h('div', 'zli zc', okIcon(), h('div', 'zlb', h('dt', null, x.name), h('dd', null, x.value), ask ? firstAsk(ask) : null));
  }))) : null;
  // 送る文の行の名前は、ラベル「(変更)」「(追加)」を除いた名前。値は、選んだ選択肢の文のまま
  const rowName = n => n.replace(/[((](変更|追加)[))]$/, '');
  const firstLines = () => firstAsks.map(x => rowName(x.name) + ': ' + hear.answers[x.key]);
  const dls = state.downloads.length ? h('section', 'zl', h('div', 'zchd', h('b', null, 'ダウンロードできるファイル')), ...state.downloads.map(p => {
    const a = h('a', 'btn', '保存');
    a.href = fileUrl(p) + '?download=1';
    a.download = p.split('/').pop();
    return h('div', 'zli zans', h('div', 'zlb', h('dd', null, p.split('/').pop()), h('dt', null, p)), a);
  })) : null;
  const wrap = busy && !hear.edited ? waitNote('書き直しています。書き終わると、新しい中身に替わります。') : null;
  if (hear.editing) return {body: [headNode, ...secs], foot: editFoot('修正をやめる', 'この内容に直す', list, choiceText('直す'))};
  const pickedAll = () => checkBlocks.every(c => hear.answers[c.key]) && firstAsks.every(x => hear.answers[x.key]);
  const go = hasChecks
    ? button('読みを選んで続ける', {pri: true, off: locked() || !pickedAll(), on: () => hearSend([choiceText('読みを選んで続ける'), ...checkBlocks.map(c => c.text + ': ' + hear.answers[c.key]), ...firstLines()].join('\n'))})
    : button('承認する', {pri: true, off: locked() || !pickedAll(), on: () => hearSend([choiceText('承認する'), ...firstLines()].join('\n'))});
  if (hasChecks || firstAsks.length) { go.dataset.need = 'checks'; hear.checkDone = pickedAll; }
  const footNote = hasChecks ? (firstAsks.length ? '確かめる点の読みと、先に確かめる行の問いの答えを選んでください。' : '確かめる点の読みを選んでください。')
    : firstAsks.length ? '先に確かめる行の問いに答えてから、承認してください。\n全文はその下に続きます。'
    : first.length ? '先に確かめる行を見て、承認してください。\n全文はその下に続きます。' : '下書きの全文を見て、承認してください。';
  return {cls: wrap ? 'zrw' : '', body: [headNode, wrap || sentNote(), dls, checkNode, firstNode, ...secs],
    foot: [leftFoot(answersGhost()), button(hear.edited ? 'もう一度修正する' : '内容を修正する', {off: locked(), on: startEdit}), h('span', 'zgw', h('span', 'fq', footNote), go)]};
}

function screenWritten() {
  const path = (status.workDir ? status.workDir + '/' : '') + state.documentPath;
  if (hearDoc === null) return {body: [busy ? waitNote('AI が要件定義書を書いて、読み直しています') : zhead('要件定義書はまだありません', '下の「会話の記録」で、最後の返事を確かめてください。')], foot: []};
  const doc = h('article', 'zl zdoc');
  doc.innerHTML = mdToHtml(hearDoc);
  // state.json の downloads のすべてをボタンに出す。2 件以上のときは、どのファイルかをボタンの文で分ける
  const files = state.downloads.length ? state.downloads : [state.documentPath];
  const dls = files.map(file => {
    const name = file.split('/').pop();

    foot: [pth, ...dls, button('次の作業へ進む(分割設計書)', {pri: true, off: locked(), on: () => hearSend('次の作業へ進む(分割設計書)')})]};
}

// AI の問いの塊(部品「決めてもらうことの塊」): 選択肢が 1 件以上なら選択肢のボタン、0 件なら入力欄と「送る」を出す。選択肢を押すと、その文を送る
function askBlock(d) {
  const off = locked();
  const wrap = h('div', 'decision' + (off ? ' off' : ''), h('div', 'q', d.question));
  wrap.dataset.ask = 'true';
  if (d.choices.length) {
    const row = h('div', 'choices');
    d.choices.forEach((raw, i) => {
      const c = normChoice(raw).label;
      const b = h('button', 'choice' + (i === 0 ? ' main' : ''), c);
      b.type = 'button';
      b.disabled = off;
      b.onclick = () => hearSend(c);
      row.append(b);
    });
    wrap.append(row);
    return wrap;
  }
  const t = h('textarea');
  t.rows = 2;
  t.placeholder = '答えを書く';
  t.setAttribute('aria-label', 'AI の問いの答え');
  t.value = hear.drafts.ask || '';
  t.disabled = off;
  t.oninput = () => { hear.drafts.ask = t.value; };
  // 返答の候補は聞き返しの文の下に出し(画面遷移設計書の章 12)、押すと入力欄に入れる
  const chips = d.replies.length ? h('div', 'zchips', ...d.replies.map(r => {
    const b = h('button', 'zchip', r);
    b.type = 'button';
    b.disabled = off;
    b.onclick = () => { t.value = r; hear.drafts.ask = r; t.focus(); };
    return b;
  })) : null;
  const go = button('送る', {pri: true, off, on: () => { const v = t.value.trim(); if (!v) { t.focus(); return; } hearSend(v); }});
  wrap.append(...[chips, h('div', 'zmb', t), h('div', 'choices', go)].filter(Boolean));
  return wrap;
}

// 画面遷移設計書の章 12 の行「インターフェース設計書の章 2 の表に合わない組を受けたとき」: 1 文と、decision があればその問いと、下の段の「あとで続ける」と「やめる」だけを出す
function screenMismatch() {
  const d = state.decision;
  return {body: [zhead('画面の状態が設計と合いません'), d && typeof d.question === 'string' && d.question.trim() ? askBlock(d) : null], foot: [leftFoot()]};
}

// 聞き返しの間は、いまの画面の本文と下の段の入力とボタンを押せない形にする。「あとで続ける」と「やめる」は押せるまま残す。リンクは行き先を外す
function lockBelowAsk() {
  const rest = [...$('hearbody').children].filter(n => !n.dataset.ask);
  for (const n of [...rest, $('hearfoot')]) {
    for (const x of n.querySelectorAll('input, textarea, button, select')) if (!x.dataset.leave) x.disabled = true;
    for (const a of n.querySelectorAll('a[href]')) { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); }
  }
}

const screenLost = () => ({body: [zhead('前の会話を続けられないので、新しい会話で始めます。', '成果物のパス(要件定義書、分割設計書、構成の案、テスト計画書、判定の記録のどれか)を、下の 1 行で送ってください。')], foot: [leftFoot()]});

const SCREENS = {'AI が読む': screenRead, '画面 2': screenSummary, '調べるための問い': screenPreQuestions, '調査': screenResearch, '画面 3': screenFacts, '画面 4': screenQuestions, '画面 5': screenDraft, '画面 6': screenWritten};

// 開くレイアウトに、会話と入力欄を移す。state.json と同じく、入力欄の文は移しても残る
function placeParts(on) {
  if (placed === on) return;
  placed = on;
  if (on) {
    $('record').append($('messages'));
    $('bar').insertBefore($('err'), $('zcf'));
    $('zcf').prepend($('form'));
  } else {
    $('chat').insertBefore($('messages'), $('works'));
    $('chat').insertBefore($('err'), $('works'));
    $('chat').insertBefore($('form'), $('works'));
  }
}

function renderHear() {
  const later = laterNow();
  const screen = hearNow() || later;
  document.body.classList.toggle('hearing', !!screen);
  document.body.classList.toggle('later', !!later);
  document.body.classList.toggle('start', !state && !screen);
  placeParts(!!screen);
  $('hear').hidden = !screen;
  $('chat').hidden = !!screen;
  $('preview').hidden = !state || !!screen;
  $('input').rows = screen ? 1 : state ? 2 : 5;
  if (later) { renderLaterFrame(later); return; }
  // 段階 2 から 8 の画面が下の段に移した入力欄と「会話の記録」を、下の 1 行(#zcf)に戻す
  if ($('form').parentElement === $('hearfoot')) $('zcf').prepend($('form'));
  if ($('recordopen').parentElement !== $('zcf')) $('zcf').append($('recordopen'));
  $('lockline').hidden = true;
  $('form').querySelector('.primary').disabled = false;
  $('hear').classList.remove('ldim');
  $('input').placeholder = screen ? CHAT_PLACEHOLDER : '例: 議事録を要約するスキルを作って';
  const bandSig = JSON.stringify([screen, !state, state && state.stage, state && state.artifacts]);
  if (bandSig !== stageSig) { stageSig = bandSig; renderStages(); renderRunning(); }
  if (!screen) return;
  renderReplies();
  renderStrip();
  const sig = JSON.stringify([state, busy, hear.view, hear.editing, !!hear.sent, hear.edited, hearDoc, status.sessionLost, items.some(i => i.user), hear.cat, hearPage]);
  if (sig === hear.sig) { hearGates(); return; }
  const sameScreen = $('hearbody').dataset.screen === screen;
  const top = $('hearscroll').scrollTop;
  hear.sig = sig;
  fieldSyncs = [];
  // 画面遷移設計書の章 12: 章 2 の表に合わない組は 1 文と問いだけを出し、聞き返しはいまの画面の本文の先頭に出す
  // 「あとで続ける」か「やめる」を押したあとの「ここで質問を止めますか？」(T22)は、聞き返しと合わない組より先に出す
  const leave = !status.sessionLost && hear.view === 'leave';
  const mismatch = !status.sessionLost && !leave && stateMismatch();
  const asking = !status.sessionLost && !leave && !mismatch && askingBack();
  const view = status.sessionLost ? screenLost() : leave ? screenLeave() : mismatch ? screenMismatch() : SCREENS[screen]();
  const body = [asking ? askBlock(state.decision) : null, ...view.body].filter(Boolean);
  // 聞き返しの間は、下に残すいまの画面のカードを薄くする
  const cls = asking ? 'zrw' : view.cls;
  $('hearbody').className = 'zw' + (cls ? ' ' + cls : '');
  $('hearbody').dataset.screen = screen;
  $('hearbody').replaceChildren(...body);
  // 送ったあとの「AI が読んでいます」は、本文の先頭だけでなく、スクロールの位置に関わらず見える下の段にも出す(2026-11-11 のユーザーの指摘: 案を下まで読んで送ると、ローディングが上にあって見えない)
  const footWait = hear.sent && view.foot.length ? waitNote('AI があなたの答えを読んでいます') : null;
  if (footWait) footWait.dataset.footWait = 'true';
  $('hearfoot').replaceChildren(...[...view.foot, footWait].filter(Boolean));
  $('hearfoot').hidden = !view.foot.length;
  hear.gateOn = !!view.gate;
  $('hearscroll').scrollTop = sameScreen ? top : 0;
  hearGates();
  if (asking) lockBelowAsk();
}

// 案を最後まで見たか、選択肢を選んだかで、主なボタンを押せるようにする。入力を消さないように、画面を作り直さない
function hearGates() {
  if (hear.gateOn && !hear.gate) {
    const sc = $('hearscroll');
    if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 8) hear.gate = true;
  }
  for (const b of $('hearfoot').querySelectorAll('[data-need]')) {
    const need = b.dataset.need;
    const q = state && state.questions ? state.questions.items.filter(i => i.answer == null) : [];
    // 「次へ」は、ボタンが持つ問い(2 段目の最後でないカテゴリーでは、そのカテゴリーの問い)のすべてに答えると押せる
    const needs = b.needItems || q;
    const ok = need === 'gate' ? hear.gate : need === 'reading' ? !!hear.answers.reading : need === 'questions' ? (b.allowEmpty || needs.length > 0) && needs.every(answerOf) : need === 'checks' ? !!(hear.checkDone && hear.checkDone()) : need === 'edits' ? pendingEdits().length > 0 : true;
    // 聞き返しの間は、いまの画面の主なボタンを押せない。ページを切り替えるボタン(data-nav)は、AI を待つ間も押せる
    b.disabled = (b.dataset.nav ? false : locked()) || !ok || askingBack();
  }
  for (const n of $('hearfoot').querySelectorAll('[data-hint="gate"]')) n.hidden = hear.gate;
}
$('hearscroll').addEventListener('scroll', () => { if (hear.gateOn) hearGates(); });

// 選択肢のない問いと返答の候補は、下の 1 行の上に出す。候補を押すと、入力欄に入れる
function renderReplies() {
  const d = state && !status.sessionLost && state.decision;
  // 聞き返しと章 2 の表に合わない組の問いは本文に出すので、ここには出さない
  // 段階 2 から 8 の画面は、返答の候補を本文の問いの塊に出す
  const show = d && !laterNow() && !d.choices.length && !askingBack() && !stateMismatch() && !busy && !hear.sent && replySent !== JSON.stringify(d);
  const sig = JSON.stringify([show, d, replyOn]);
  if (sig === repliesSig) return;
  repliesSig = sig;
  const box = $('replies');
  box.hidden = !show;
  if (!show) { box.replaceChildren(); return; }
  const nodes = [h('span', 'zrq', h('b', null, 'AI からの質問: '), d.question)];
  if (d.replies.length) {
    const chips = h('span', 'zchips');
    for (const r of d.replies) {
      const b = h('button', 'zchip' + (replyOn === r ? ' on' : ''), r);
      b.type = 'button';
      b.onclick = () => { replyOn = r; $('input').value = r; focusInput(); renderReplies(); };
      chips.append(b);
    }
    nodes.push(chips);
  }
  box.replaceChildren(...nodes);
}

// 下の 1 行の文への返事と、送れなかったときの「もう一度送る」を、下の 1 行の上に出す
function renderStrip() {
  const last = [...items].reverse().find(i => !i.user);
  const reply = stripOn && !busy && last ? last.lines.join(' ').replace(/[#*|\`]/g, '').replace(/\s+/g, ' ').trim().slice(0, 200) : '';
  const sig = JSON.stringify([hear.failed && hear.failed.text, reply]);
  if (sig === stripSig) return;
  stripSig = sig;
  const box = $('strip');
  box.hidden = !hear.failed && !reply;
  if (hear.failed) {
    const {text, opts} = hear.failed;
    box.replaceChildren(h('span', null, '読み直せませんでした'), button('もう一度送る', {on: () => { hear.editing = false; hearSend(text, opts); }}));
  } else if (reply) box.replaceChildren(okIcon(), h('span', null, reply));
  else box.replaceChildren();
}

$('recordclose').onclick = () => { $('record').hidden = true; };

    body.push(h('h2', 'lh', `AI は、書いた文書を規約に照らし合わせ、${dc.changed ?? 0} か所を直しました。${meaningCount ? `中身が変わる直しが ${meaningCount} 件あります。` : ''}`),
      sec('照合した文書と結果'), tiles([{v: dc.files ?? 0, l: '照合した .md'}, {v: dc.findings ?? 0, l: `指摘(言い回し ${dc.wording ?? 0})`, cls: (dc.findings || 0) > 0 ? 'lng' : 'lok'}, {v: meaningCount, l: '中身が変わる直し', cls: meaningCount ? 'lat' : ''}]),
      ...meaning.map(c => h('div', 'lbox', h('div', 'lt', h('span', 'lfile', `${c.file}:${c.line}`), h('span', 'ltag lchg', '中身が変わる')), h('div', 'lm', `規則「${c.rule}」。前: ${c.before} 後: ${c.after}`))),
      h('div', 'lcnt', '規約 skill-making-flow の規則 1 のとおり、この直しにはユーザーの承認を求めず、中身が変わる直しだけを本文に出します。'),
      tabsBlock(sc), note('知らせ', dc.next));
    foot.push(say('AI は、続けてスキルができたことを知らせます。'));
  } else if (sc === 'スキルができた') {
    const ins = state.install || {};
    body.push(h('h2', 'lh', `${cs.name || ''} ができました`), sec('スキルのフォルダ'), h('div', 'lfile', ins.folder || ''),
      kvOf([{name: '中身', value: ins.contents}, {name: 'テストの結果', value: ins.tests}, {name: '通しの実行', value: ins.run}, {name: '残したもの', value: ins.left || 'なし'}]));
    if (Array.isArray(ins.commands) && ins.commands.length) {
      body.push(sec('使うためのコマンド'));
      for (const c of ins.commands) {
        const copy = h('button', null, 'コピー');
        copy.type = 'button';
        copy.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(c.command).then(() => { copy.textContent = 'コピーしました'; setTimeout(() => { copy.textContent = 'コピー'; }, 1800); }).catch(() => {}); };
        body.push(h('div', 'lcnt', c.when), h('div', 'lcmd', h('code', null, c.command), copy));
      }
    }
    body.push(tabsBlock(sc), note('完了', ins.next, 'ok'));
    // 最後のスキルのときだけ、文章を整える誘いの行を出す(画面遷移設計書の 8-8。規約 skill-making-flow の規則 5。2026-11-12)
    if (laterAllDone(sc)) body.push(note('知らせ', '希望なら、文章の日本語を整えます。下の 1 行から「文章を整えて」と送ってください。'));
    if (state.downloads.length) foot.push(button('スキルのフォルダをダウンロード', {on: () => { lt.menu = true; lt.sig = null; renderHear(); const t = $('hearbody').querySelector('[data-tabs]'); if (t) t.scrollIntoView({block: 'nearest'}); }}));
    chatPh = '次の依頼を書く…';
  }
  return {body, foot, chatPh};
}

function renderLater(sc) {
  if (status.sessionLost) return laterE2(sc);
  const type = typeOf(sc);
  // AI を呼ぶボタンを押してから decision か screen が変わるまでは K1。結果と待つの画面は、AI が返事を書いていてもそのまま出す
  if (locked() && type !== '結果' && type !== '待つ') return laterK1(sc, true);
  if (sc === K1) return laterK1(sc, false);
  if (sc === 'テストの実行') return laterTestRun(sc);
  if (type === '承認') return laterApprove(sc);
  if (type === '確認') return laterConfirm(sc);
  if (type === '答える') return laterAnswer(sc);
  return laterResult(sc);
}

function renderLaterFrame(sc) {
  $('skill').textContent = '';
  const bandSig = JSON.stringify(['later', sc, state.stage, state.artifacts, state.currentSkill, busy, !!state.install]);
  if (bandSig !== stageSig) { stageSig = bandSig; renderStages(); }
  renderRunning();
  renderReplies();
  renderStrip();
  // F9: 開いている図か文書と、まだないファイルは、読み直しのたびに取り直す(state.json が変わらずにファイルだけが変わったときも出す)
  const panelsNow = laterPanels();
  const openNow = openPanelId(sc, panelsNow);
  for (const p of panelsNow) if (p.path && (panelId(p) === openNow || ltFiles[p.path] == null)) fetchPanel(p.path);
  const lockedNow = locked();
  $('lockline').hidden = !lockedNow;
  $('form').querySelector('.primary').disabled = lockedNow;
  $('hear').classList.toggle('ldim', connNg);
  const sig = JSON.stringify([state, busy, sending, !!hear.sent, hear.failed && hear.failed.text, status.agentCalls, status.subagents, status.skillCalls, status.sessionLost, lt.mode, lt.why, lt.log, lt.pick, lt.menu, lt.choice && lt.choice.label, panelsSig(sc), connNg]);
  if (sig === lt.sig) { laterGates(); return; }
  const key = 'later:' + sc + ':' + lt.mode;
  const same = $('hearbody').dataset.screen === key;
  const top = $('hearscroll').scrollTop;
  lt.sig = sig;
  const view = renderLater(sc);
  $('input').placeholder = view.chatPh || '書き足す…';
  // 段階 3 の承認の画面は図のタブを開いている間だけ、段階 6 と 7 の承認の画面と段階 8 の画面はどのタブでも開いている間(表の列が多いため)、カードを広げる(3-1b、6-1、7-1、8-2。図を幅 900px で描くため)。広げるかは段階ごとの決まりで、state.json の panels の欄では決めない
  const openPanel = panelsNow.find(p => panelId(p) === openNow) || null;
  const wide = !!openPanel && (state.stage === 8 || (sc === '成果物の承認' && (state.stage === 3 ? openPanel.kind === '図' : state.stage === 6 || state.stage === 7)));
  $('hearbody').className = 'zw' + (wide ? ' wide' : '');
  $('hearbody').dataset.screen = key;
  const card = h('div', 'lcard', ...view.body.filter(Boolean));
  $('hearbody').replaceChildren(card);
  // 下の段は 1 段: 左から「やめる」(.pleave)、書き足す入力欄(#form)、「会話の記録」(#recordopen)、隙間、右に 1 文と主なボタン
  const foot = $('hearfoot');
  // 入力欄と「会話の記録」は、前の描画で下の段の中にあるので、入れ替える前に取っておく(入れ替えたあとは id で引けない)
  const form = $('form'), rec = $('recordopen');
  foot.replaceChildren(...view.foot.filter(Boolean));
  const left = foot.querySelector('.pleave');
  const spacer = h('span', 'lsp');
  if (left) left.after(form, rec, spacer); else foot.prepend(form, rec, spacer);
  foot.hidden = false;
  hear.gateOn = false;
  $('hearscroll').scrollTop = same ? top : 0;
  if (!same && (lt.mode === 'quit' || lt.mode === 'input')) { const d = card.querySelector('.ldlg, .linp'); if (d) d.scrollIntoView({block: 'nearest'}); }
  laterGates();
}

// F9: 画面の更新を受ける(2 秒ごとに読み直す)
load();
setInterval(load, 2000);
</script>
</body>
</html>
