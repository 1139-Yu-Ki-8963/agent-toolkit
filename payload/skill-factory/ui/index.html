<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スキル作成の確認と承認</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#1f2328;--muted:#57606a;--faint:#8c959f;--line:#d9dde3;--line2:#e6e9ee;--box:#c7ced6;--blue:#1d5fbf;--blue2:#dfe9f8;--gray:#eef1f5;--green:#1a7f37;--red:#cf222e;--redbg:#ffebe9;--redfg:#82071e}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
header .brand{font-weight:700;font-size:16px}
header .meta{font-size:13px;color:var(--muted)}
header .meta:empty{display:none}
.runwrap{position:relative}
.running{display:flex;align-items:center;gap:8px;padding:4px 12px;border:0;border-radius:999px;background:var(--blue2);color:var(--blue);font-size:13px;font-weight:500}
.running .sub{font-weight:400;color:#15488f}
.spin{flex:0 0 auto;width:10px;height:10px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
#stack{position:absolute;left:0;top:36px;z-index:3;width:560px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;padding:16px;background:#fff;border:1px solid var(--box);border-radius:12px;box-shadow:0 8px 24px rgba(31,35,40,.12)}
#stack .h{font-size:14px;font-weight:700;margin-bottom:8px}
#stack .sec{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 2px}
#stack .sk{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--gray)}
#stack .sk .n{font-size:13px;font-weight:700}
#stack .sk .st{font-size:12px;text-align:right;color:var(--muted)}
#stack .sk .st.now{color:var(--blue);font-weight:700}
#stack .sk .st.done{color:var(--green)}
#stack .sk .p{grid-column:1 / 3;font-size:12px;color:var(--muted)}
#stack .rl{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--gray);font-size:12px}
#stack .rl b{font-weight:700}
#stack .rl span{margin-left:auto;color:var(--muted);text-align:right}
@keyframes spin{to{transform:rotate(360deg)}}
.conn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.conn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green)}
.conn.ng{color:var(--red)}
.conn.ng::before{background:var(--red)}
#banner{padding:8px 24px;background:var(--redbg);color:var(--redfg);font-size:13px}
nav.stages{display:flex;flex-wrap:wrap;gap:8px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--gray);color:var(--muted);font-size:13px}
.pill .num{display:inline-flex;flex:0 0 20px;width:20px;height:20px;border-radius:999px;background:#fff;border:1px solid var(--box);align-items:center;justify-content:center;font-size:12px}
.pill .name{display:flex;flex-direction:column;line-height:1.2}
.pill .status{font-size:11px;font-weight:400}
.pill.done{background:var(--blue2);color:var(--blue)}
.pill.done .num{background:var(--blue);color:#fff;border:0}
.pill.now{background:var(--blue);color:#fff;font-weight:500}
.pill.now .num{background:#fff;color:var(--blue);border:0;font-weight:700}
.pill.back{border:1px dashed var(--blue)}
main{display:flex;flex-wrap:wrap;flex:1 1 auto;gap:16px;padding:16px 24px 24px;min-height:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
#chat{flex:1 1 360px;max-width:420px;max-height:100%}
#messages{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;padding:16px;overflow:auto}
.msg{max-width:90%;padding:10px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:85%;border-radius:14px 14px 4px 14px;background:var(--blue);color:#fff}
.msg.ai{align-self:flex-start;border-radius:14px 14px 14px 4px;background:var(--gray)}
.msg.md{white-space:normal}
.msg.md p,.msg.md ul,.msg.md ol{margin:4px 0}
.msg.md ul,.msg.md ol{padding-left:18px}
.msg.md pre{white-space:pre-wrap;background:#fff;padding:6px;border-radius:6px}
.msg.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:12px}
.msg.md th,.msg.md td{border:1px solid var(--line);padding:2px 6px}
.typing{align-self:flex-start;display:flex;gap:6px;padding:14px 16px;border-radius:14px 14px 14px 4px;background:var(--gray)}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.decision{align-self:stretch;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--box);border-radius:12px}
.decision.off{border-color:var(--line2);color:var(--faint)}
.decision .q{font-size:13px;font-weight:700}
.decision .hint{font-size:12px;color:var(--muted)}
.decision .choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{height:40px;padding:0 16px;border:1px solid var(--box);border-radius:8px;background:#fff;color:var(--fg);font-size:13px}
.choice.main{border:0;background:var(--blue);color:#fff;font-weight:500}
.decision.off .choice{border-color:var(--line2);color:var(--faint)}
.decision.off .choice.main{background:#d0d7de;color:#fff}
.decision.off .choice.picked{background:var(--blue);color:#fff;border:0}
#err{padding:8px 16px 0;font-size:12px;color:var(--red)}
form{display:flex;align-items:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
form textarea{flex:1 1 auto;min-width:0;padding:10px 12px;border:1px solid var(--box);border-radius:8px;font-size:14px;line-height:1.5;font-family:inherit;resize:none}
form textarea.ng{border-color:var(--red)}
.primary{height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:500}
#preview{flex:999 1 560px;max-height:100%}
.bar{position:relative;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line2)}
#docpath{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.dl{margin-left:auto;height:32px;padding:0 12px;border:1px solid var(--box);border-radius:8px;background:#fff;color:var(--fg);font-size:12px;display:flex;align-items:center;gap:6px}
#dlmenu{position:absolute;right:16px;top:44px;z-index:2;display:flex;flex-direction:column;gap:4px;min-width:280px;max-width:480px;padding:6px;border:1px solid var(--box);border-radius:8px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08)}
#dlmenu a{padding:8px 10px;border-radius:6px;font-size:12px;color:var(--blue);text-decoration:none;overflow-wrap:anywhere}
#dlmenu a:hover{background:var(--gray)}
#dlmenu a span{display:block;color:var(--muted)}
#figbox{border-bottom:1px solid var(--line2);background:#fbfcfd}
.fighead{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:12px 20px}
.fighead .title{font-size:13px;font-weight:700;margin-right:8px}
.tab{height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px}
.tab.on{background:var(--gray);color:var(--fg);font-weight:700}
.fold{margin-left:auto;height:28px;padding:0 10px;border:0;background:transparent;color:var(--muted);font-size:12px}
#figure{padding:0 20px 16px;overflow:auto;max-height:45vh}
#figure svg{max-width:100%;height:auto}
#doc{flex:1 1 auto;padding:16px 24px;overflow:auto;font-size:13px;line-height:1.7}
#doc h1{margin:0 0 12px;font-size:18px}
#doc h2{margin:12px 0 6px;font-size:14px;border-bottom:1px solid var(--line2);padding-bottom:4px}
#doc h3{font-size:13px}
#doc table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
#doc th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--box)}
#doc td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
#doc ul{margin:0;padding-left:20px}
#doc pre{background:var(--gray);padding:8px;overflow:auto}
.empty{color:var(--muted);font-size:13px}
.making{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue)}
.making-sub{font-size:12px;color:var(--muted);margin:6px 0 10px}
.skel{display:flex;flex-direction:column;gap:8px}
.skel div{height:10px;border-radius:4px;background:var(--gray)}
.rewriting{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:10px;border-radius:6px;background:var(--blue2);color:#15488f;font-size:12px}
.dim{opacity:.55}
.none-h{font-size:13px;font-weight:700}
.none-s{font-size:12px;color:var(--muted);margin-top:4px}
.chips{align-self:flex-start;display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 12px;border:1px solid var(--box);border-radius:999px;background:#fff;color:var(--fg);font-size:13px}
.chip.on{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
#qform{flex:1 1 auto;overflow:auto;padding:20px;background:#fbfcfd}
.qbox{max-width:720px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff}
.qnote{margin-bottom:8px;padding:8px 10px;border-radius:6px;background:#fff8e1;font-size:12px}
.qhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.qhead .t{font-size:14px;font-weight:700}
.qhead .c{font-size:12px;color:var(--muted)}
.qi{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--gray)}
.qi .l{display:flex;gap:8px;align-items:baseline}
.qi .no{font-size:12px;font-weight:700;color:var(--blue)}
.qi .no.ok{color:var(--green)}
.qi .tx{font-size:13px;font-weight:700}
.qi textarea{min-height:36px;padding:8px 10px;border:1px solid var(--box);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical}
.qfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--gray)}
.qfoot span{font-size:12px;color:var(--muted)}
.qfoot button{height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:13px;font-weight:500}
.qfoot button:disabled{background:#d0d7de}
/* 開いた直後の画面: 右の欄を出さず、会話の欄を中央に置く */
body.start main{justify-content:center}
body.start #chat{flex:0 1 720px;max-width:720px;border:0;background:transparent;justify-content:center}
body.start #messages{flex:0 1 auto}
body.start form{border:1px solid var(--box);border-radius:12px;background:#fff;padding:12px}
body.start form textarea{border:0;font-size:15px;outline:none}
#welcome{padding:0 16px 24px}
#welcome h1{margin:0 0 12px;font-size:24px}
#welcome p{margin:0;font-size:15px;line-height:1.8}
#works{margin:16px 16px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px}
#works .wh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
#works .wh .t{font-size:14px;font-weight:700}
#works .wh .s{font-size:12px;color:var(--muted)}
#works .wk{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--gray)}
#works .wk .n{font-size:14px;font-weight:700}
#works .wk .d{font-size:12px;color:var(--muted)}
#works .wk button{height:32px;padding:0 14px;border:1px solid var(--blue);border-radius:8px;background:#fff;color:var(--blue);font-size:13px}
#works details{padding-top:8px;border-top:1px solid var(--gray);font-size:12px;color:var(--muted)}
</style>
</head>
<body class="start">
<header>
  <div class="brand">skill-factory</div>
  <div class="meta" id="work"></div>
  <div class="meta" id="skill"></div>
  <div class="runwrap" id="runwrap" hidden><button type="button" class="running" id="running" aria-expanded="false"></button><div id="stack" hidden></div></div>
  <div class="conn" id="conn" role="status">接続中</div>
</header>
<div id="banner" hidden></div>
<nav class="stages" id="stages" aria-label="段階"></nav>
<main>
  <section class="panel" id="chat" aria-label="AI との会話">
    <div id="welcome"></div>
    <div id="messages"></div>
    <div id="err" role="alert" hidden></div>
    <form id="form">
      <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">メッセージ</label>
      <textarea id="input" rows="2" placeholder="例: 議事録を要約するスキルを作って"></textarea>
      <button class="primary" type="submit">送る</button>
    </form>
    <div id="works" hidden></div>
  </section>
  <section class="panel" id="preview" aria-label="文書と図" hidden>
    <div class="bar">
      <div id="docpath"></div>
      <button type="button" class="dl" id="dl" aria-expanded="false"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"></path></svg>ダウンロード</button>
      <div id="dlmenu" hidden></div>
    </div>
    <div id="figbox" hidden>
      <div class="fighead">
        <div class="title" id="figtitle"></div>
        <span id="tabs"></span>
        <button type="button" class="fold" id="fold">図を畳む</button>
      </div>
      <div id="figure"></div>
    </div>
    <article id="doc"></article>
    <div id="qform" hidden></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
// state は、1 回目の読み込みで必ず描くように、読んだ値(なしは null)と違う undefined で始める
const last = {state: undefined, conv: undefined, svg: null, doc: null, figs: null};
let state = null;
let items = [];
let busy = false;
let tab = null;
let folded = false;
// 押した選択肢と、そのときの決めてもらうこと。state.json の決めてもらうことが変わるまで、ボタンを押せない形にする
let picked = null;
// 中継サーバーが返す、スキルの呼び出しの一覧とサブエージェントの数
let status = {skillCalls: [], subagents: 0, workDir: null};
// 段階ごとに使うスキルと規約の表(ui/段階ごとのスキルと規約.json)
let stagesTable = null;
let stackOpen = false;
// 質問の一覧で、いま選んだか書いた答え(番号から答えへ)と、送ったときの質問の一覧
let qAnswers = {};
let qSent = null;
// 返答の候補で押した候補と、送ったときの決めてもらうこと
let replyOn = null;
let replySent = null;

const fileUrl = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');

// 中継サーバーにつながらないときは null を返す
async function getText(p) {
  try {
    const r = await fetch(fileUrl(p), {cache: 'no-store'});
    return r.ok ? r.text() : null;
  } catch { return null; }
}

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  Object.assign(e, attrs || {});
  if (text !== undefined) e.textContent = text;
  return e;
}

// F1: 画面の状態を読む
async function load() {
  const b = await fetch('/api/status', {cache: 'no-store'}).then(r => r.json()).catch(() => null);
  renderConn(b);
  if (!b) return;
  if (!stagesTable) {
    stagesTable = await fetch('/api/stages', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
    if (stagesTable) renderStages();
  }
  const s = await getText('ui/state.json');
  const c = await getText('ui/conversation.md');
  let changed = false;
  // 文が空か JSON として読めない state.json は、書いている途中とみなし、前の状態を保つ
  let parsed = null;
  if (s) { try { parsed = JSON.parse(s); } catch { parsed = undefined; } }
  if (s !== last.state && parsed !== undefined) {
    last.state = s;
    state = parsed;
    if (!state || !picked || JSON.stringify(state.decision) !== picked.decision) picked = null;
    if (!state || JSON.stringify(state.questions) !== qSent) qSent = null;
    if (!state || JSON.stringify(state.decision) !== replySent) { replySent = null; replyOn = null; }
    renderState();
    changed = true;
  }
  if (c !== last.conv) {
    last.conv = c;
    items = parseConversation(c || '');
    changed = true;
  }
  if (b.busy !== busy) { busy = b.busy; changed = true; }
  const st = JSON.stringify([b.skillCalls, b.subagents, b.workDir]);
  if (st !== JSON.stringify([status.skillCalls, status.subagents, status.workDir])) changed = true;
  status = {skillCalls: b.skillCalls || [], subagents: b.subagents || 0, workDir: b.workDir || null};
  if (changed) { renderChat(); renderRunning(); renderQuestions(); }
  if (state) {
    await renderFigure();
    await renderDoc();
  }
}

// 段階の表の行。state.json の段階がないときは段階 1 とする
function stageRow() {
  const n = state ? state.stage : 1;
  return stagesTable && stagesTable.find(r => r.stage === n);
}

// 最後に呼んだ段階のスキル(段階の表で種類が「段階」のもの)と、そのあとに呼んだ補助のスキル
function runningSkills() {
  const row = stageRow();
  const kind = name => { const k = row && row.skills.find(x => x.name === name); return k ? k.kind : '補助'; };
  const calls = status.skillCalls;
  let main = null, helper = null;
  for (let i = calls.length - 1; i >= 0; i--) {
    if (kind(calls[i]) === '段階') { main = calls[i]; break; }
    if (!helper) helper = calls[i];
  }
  // 段階のスキルをまだ呼んでいないときは、最後に呼んだスキルを出す
  if (!main && helper) { main = helper; helper = null; }
  return {main, helper};
}

// 実行中のスキル: 名前は、中継サーバーが Claude Code の Skill のツールの呼び出しから受け取ったものをそのまま出す
function renderRunning() {
  const {main, helper} = runningSkills();
  $('runwrap').hidden = !main;
  if (!main) { stackOpen = false; $('stack').hidden = true; return; }
  const btn = $('running');
  btn.replaceChildren();
  if (busy) btn.append(el('span', {className: 'spin', ariaHidden: 'true'}));
  btn.append(document.createTextNode(`${main} を実行中`));
  if (busy && status.subagents > 0) btn.append(el('span', {className: 'sub'}, `サブエージェント ${status.subagents} 体`));
  else if (helper) btn.append(el('span', {className: 'sub'}, `+ ${helper}`));
  const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  arrow.setAttribute('width', '12'); arrow.setAttribute('height', '12'); arrow.setAttribute('viewBox', '0 0 12 12');
  arrow.setAttribute('fill', 'none'); arrow.setAttribute('stroke', 'currentColor'); arrow.setAttribute('stroke-width', '1.6'); arrow.setAttribute('aria-hidden', 'true');
  arrow.innerHTML = '<path d="M3 4.5 6 7.5 9 4.5"/>';
  btn.append(arrow);
  btn.setAttribute('aria-expanded', String(stackOpen));
  renderStack(main);
}

// 段階で使うスキルと規約の一覧。スキルの状態は、この会話で Skill のツールで呼んだ順から決める
function renderStack(main) {
  const box = $('stack');
  box.hidden = !stackOpen;
  const row = stageRow();
  if (!row) { box.replaceChildren(el('div', {className: 'empty'}, '段階の表を読めません。')); return; }
  const order = [...new Set(status.skillCalls)];
  const nodes = [el('div', {className: 'h'}, `段階 ${row.stage}(${row.name})で使うスキルと規約`), el('div', {className: 'sec'}, 'スキル')];
  for (const k of row.skills) {
    const i = order.indexOf(k.name);
    const now = k.name === main;
    const r = el('div', {className: 'sk'});
    r.append(el('div', {className: 'n'}, k.name),
      el('div', {className: 'st' + (now ? ' now' : i >= 0 ? ' done' : '')}, now ? '実行中' : i >= 0 ? `呼んだ(${i + 1} 番目)` : 'まだ呼んでいない'),
      el('div', {className: 'p'}, k.purpose));
    nodes.push(r);
  }
  nodes.push(el('div', {className: 'sec'}, '規約'));
  for (const r of row.rules) {
    const d = el('div', {className: 'rl'});
    d.append(el('b', {}, r.name), el('span', {}, r.when));
    nodes.push(d);
  }
  box.replaceChildren(...nodes);
}
$('running').onclick = e => { e.stopPropagation(); stackOpen = !stackOpen; renderRunning(); };
document.addEventListener('click', e => { if (stackOpen && !$('runwrap').contains(e.target)) { stackOpen = false; renderRunning(); } });

// F10: 接続の状態を出す。中継サーバーにつながらないときと、claude のコマンドがないときは、ヘッダーの下に直し方を出す
function renderConn(b) {
  const ng = !b ? '中継サーバーにつながりません' : (b.hasClaude ? '' : 'claude のコマンドがありません');
  $('conn').textContent = ng || '接続中';
  $('conn').className = 'conn' + (ng ? ' ng' : '');
  $('banner').hidden = !ng;
  $('banner').innerHTML = !b
    ? 'skill-factory で <code>node ui/server.mjs</code> を起動し、この画面を読み直してください。'
    : 'Claude Code を入れてから、中継サーバーを起動し直してください。';
}

// F2: 段階の帯を出す。段階の名前は段階の表(/api/stages)から出し、表が読めていない間は帯を出さない。成果物の状態を、未着手でない段階の名前の下に出す
function renderStages() {
  $('stages').hidden = !stagesTable;
  if (!stagesTable) return;
  $('stages').replaceChildren(...stagesTable.map(row => {
    const n = row.stage;
    const name = row.name;
    const a = state && state.artifacts.find(x => x.stage === n);
    const status = a ? a.status : '未着手';
    const now = state && n === state.stage;
    const cls = now ? 'now' : status === '済み' ? 'done' : status !== '未着手' ? 'back' : '';
    const p = el('div', {className: 'pill ' + cls});
    const label = el('span', {className: 'name'}, name);
    if (status !== '未着手') label.append(el('span', {className: 'status'}, status));
    p.append(el('span', {className: 'num'}, cls === 'done' ? '✓' : String(n)), label);
    return p;
  }));
}

function renderState() {
  // 開いた直後の画面: 作業のフォルダが決まる前は、右の欄を出さず、ui/はじめに.md を会話の欄の上に出す
  document.body.classList.toggle('start', !state);
  $('preview').hidden = !state;
  renderStages();
  if (!state) {
    $('work').textContent = '';
    $('skill').textContent = '';
    fetch('/api/start', {cache: 'no-store'}).then(r => r.ok ? r.text() : '').then(md => { $('welcome').innerHTML = marked.parse(md); }).catch(() => {});
    renderWorks();
    return;
  }
  $('work').textContent = state.workName;
  const sk = state.currentSkill;
  $('skill').textContent = sk && sk.total > 1 ? `${sk.order} / ${sk.total} ${sk.name}` : '';
  renderDownloads();
}

// 途中の作業の一覧: output/ の下に ui/state.json がある作業を、開いた直後の画面の入力欄の下に出す。0 件なら出さない
function fmtSaved(iso) {
  const d = new Date(iso);
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  if (d.toDateString() === new Date().toDateString()) return hm;
  return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${hm}`;
}

function workRow(w) {
  const r = el('div', {className: 'wk'});
  const info = el('div');
  const desc = w.done ? '完了(8 段階が済み)' : `段階 ${w.stage}${w.artifact ? ` ${w.artifact.name} ${w.artifact.status}` : ''}`;
  info.append(el('div', {className: 'n'}, w.workName), el('div', {className: 'd'}, `${desc} ・ 最後の保存 ${fmtSaved(w.savedAt)} ・ ${w.dir}/`));
  const b = el('button', {type: 'button'}, '続きから');
  b.onclick = async () => {
    b.disabled = true;
    let error = null;
    try {
      const res = await fetch('/api/resume', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dir: w.dir})});
      if (!res.ok) error = await res.text();
    } catch { error = '中継サーバーにつながりません。'; }
    if (error) { $('err').hidden = false; $('err').textContent = '続けられませんでした。' + error; b.disabled = false; return; }
    location.reload();
  };
  r.append(info, b);
  return r;
}

async function renderWorks() {
  const works = await fetch('/api/works', {cache: 'no-store'}).then(r => r.ok ? r.json() : []).catch(() => []);
  const box = $('works');
  if (state || !works.length) { box.hidden = true; return; }
  const rest = works.filter(w => !w.done);
  const done = works.filter(w => w.done);
  const head = el('div', {className: 'wh'});
  head.append(el('div', {className: 't'}, '途中の作業'), el('div', {className: 's'}, 'output/ の下に ui/state.json がある作業。新しい作業は、上の入力欄から始める'));
  const nodes = [head, ...rest.map(workRow)];
  if (done.length) {
    const dt = el('details');
    dt.append(el('summary', {}, `終わった作業 ${done.length} 件`), ...done.map(workRow));
    nodes.push(dt);
  }
  box.replaceChildren(...nodes);
  box.hidden = $('welcome').hidden;
}

// F3: 会話を出す。conversation.md の 1 件は、「ユーザー:」か「Claude Code:」で始まる行から、次の同じ形の行の前まで
function parseConversation(text) {
  const list = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^(ユーザー|Claude Code): ?(.*)$/);
    if (m) list.push({user: m[1] === 'ユーザー', lines: [m[2]]});
    else if (list.length) list[list.length - 1].lines.push(line);
  }
  return list;
}

// 会話の欄: 吹き出し、返事を書いている間の点の吹き出し、決めてもらうことの塊の順に出す
function renderChat() {
  $('welcome').hidden = !!state || items.length > 0;
  if ($('welcome').hidden) $('works').hidden = true;
  const nodes = items.map(it => {
    const text = it.lines.join('\n').trim();
    if (it.user) return el('div', {className: 'msg user'}, text);
    // Claude Code の返事は md なので、見出し、表、箇条書きの形で出す
    const m = el('div', {className: 'msg ai md'});
    m.innerHTML = marked.parse(text);
    return m;
  });
  if (busy) {
    const t = el('div', {className: 'typing', role: 'status'});
    t.setAttribute('aria-label', 'Claude Code が返事を書いています');
    t.append(el('span'), el('span'), el('span'));
    nodes.push(t);
  }
  const d = state && state.decision;
  // 選択肢がなく返答の候補がある問いは、問いの吹き出しと候補のボタンで出す。送ったあとと、AI が返事を書いている間は候補を出さない
  if (d && !d.choices.length && d.replies && d.replies.length) {
    const m = el('div', {className: 'msg ai'}, d.question);
    nodes.push(m);
    if (!busy && replySent !== JSON.stringify(d)) {
      const cs = el('div', {className: 'chips'});
      for (const r of d.replies) {
        const b = el('button', {type: 'button', className: 'chip' + (replyOn === r ? ' on' : '')}, r);
        b.onclick = () => { replyOn = r; $('input').value = r; $('input').focus(); renderChat(); };
        cs.append(b);
      }
      nodes.push(cs);
    }
  } else if (d) nodes.push(renderDecision(d));
  const box = $('messages');
  box.replaceChildren(...nodes);
  box.scrollTop = box.scrollHeight;
}

// F7: 承認の選択を送る。最初の選択肢を推奨として青で塗る
function renderDecision(d) {
  const off = busy || !!picked;
  const wrap = el('div', {className: 'decision' + (off ? ' off' : '')});
  wrap.append(el('div', {className: 'q'}, d.question));
  if (!d.choices.length) {
    wrap.append(el('div', {className: 'hint'}, '答えを入力欄に書いて送ってください。'));
    return wrap;
  }
  const row = el('div', {className: 'choices'});
  d.choices.forEach((c, i) => {
    const isPicked = picked && picked.text === c;
    const b = el('button', {type: 'button', className: 'choice' + (i === 0 ? ' main' : '') + (isPicked ? ' picked' : ''), disabled: off}, (isPicked ? '✓ ' : '') + c);
    b.onclick = () => {
      picked = {text: c, decision: JSON.stringify(d)};
      renderChat();
      send(c, true);
    };
    row.append(b);
  });
  wrap.append(row);
  return wrap;
}

// F8: ファイルをダウンロードする。ボタンを押すと、ダウンロードできるファイルの一覧の全件を、パスとともに出す
function renderDownloads() {
  $('dl').hidden = !state.downloads.length;
  $('dlmenu').replaceChildren(...state.downloads.map(p => {
    const a = el('a', {href: fileUrl(p) + '?download=1', download: p.split('/').pop()}, p.split('/').pop());
    a.append(el('span', {}, p));
    return a;
  }));
  if (!state.downloads.length) toggleMenu(false);
}

function toggleMenu(open) {
  $('dlmenu').hidden = !open;
  $('dl').setAttribute('aria-expanded', String(open));
}
$('dl').onclick = e => { e.stopPropagation(); toggleMenu($('dlmenu').hidden); };
document.addEventListener('click', e => { if (!$('dlmenu').contains(e.target)) toggleMenu(false); });

// F4: 図を出す(SVG をそのまま埋め込む)。図が 0 件のときは、図の欄を出さない。新しい図ができたら、図の欄を開く
async function renderFigure() {
  const figs = JSON.stringify(state.figures);
  if (figs !== last.figs) {
    last.figs = figs;
    folded = false;
    if (!state.figures.some(f => f.tab === tab)) tab = state.figures.length ? state.figures[state.figures.length - 1].tab : null;
    renderTabs();
  }
  $('figbox').hidden = !state.figures.length || questionsOpen();
  const f = state.figures.find(x => x.tab === tab);
  $('figtitle').textContent = f ? '図: ' + f.tab : '';
  $('figure').hidden = folded;
  $('fold').textContent = folded ? '図を開く' : '図を畳む';
  const svg = f ? await getText(f.path) : null;
  const key = (f ? f.path : '') + '\n' + svg;
  if (key === last.svg) return;
  last.svg = key;
  $('figure').innerHTML = svg || '';
}

function renderTabs() {
  // 図が 1 つのときは、図の名前だけを出し、タブを出さない
  $('tabs').replaceChildren(...(state.figures.length > 1 ? state.figures : []).map(f => {
    const b = el('button', {type: 'button', className: 'tab' + (f.tab === tab ? ' on' : '')}, f.tab);
    b.onclick = () => { tab = f.tab; folded = false; renderTabs(); renderFigure(); };
    return b;
  }));
}
$('fold').onclick = () => { folded = !folded; renderFigure(); };

// F5: 文書を出す。状態は、文書のパスにファイルがあるかと、AI が返事を書いているかの 2 つで決める
async function renderDoc() {
  const md = await getText(state.documentPath);
  const {main} = runningSkills();
  const key = [state.documentPath, md, busy, main].join('\n');
  if (key === last.doc) return;
  last.doc = key;
  const name = state.documentPath.split('/').pop().replace(/\.md$/, '');
  const doc = $('doc');
  doc.replaceChildren();
  if (md === null && busy) {
    // 作っている
    const h = el('div', {className: 'making'});
    h.append(el('span', {className: 'spin', ariaHidden: 'true'}), document.createTextNode(`${name}を書いています`));
    const skel = el('div', {className: 'skel'});
    for (const w of [40, 90, 75, 85]) skel.append(el('div', {style: `width:${w}%`}));
    doc.append(h, el('div', {className: 'making-sub'}, `${main ? main + ' が' : 'AI が'}書いています。書き終わると、ここに出ます。`), skel);
  } else if (md === null) {
    // まだない
    doc.append(el('div', {className: 'none-h'}, `${name}はまだありません`), el('div', {className: 'none-s'}, '会話の最後の返事を確かめてください。'));
  } else if (busy) {
    // 書き直している
    const bar = el('div', {className: 'rewriting', role: 'status'});
    bar.append(el('span', {className: 'spin', ariaHidden: 'true'}), document.createTextNode('書き直しています。書き終わると、新しい中身に替わります。'));
    const body = el('div', {className: 'dim'});
    body.innerHTML = marked.parse(md);
    doc.append(bar, body);
  } else {
    // 出している
    doc.innerHTML = marked.parse(md);
  }
}

// 質問の一覧: state.json の questions に、まだ答えていない問いがあり、AI が返事を書いていないときに、右の欄に出す
function questionsOpen() {
  const q = state && state.questions;
  return !!(q && q.items.some(i => i.answer == null) && !busy && qSent !== JSON.stringify(q));
}

function renderQuestions() {
  const open = questionsOpen();
  $('qform').hidden = !open;
  $('doc').hidden = open;
  if (open) $('figbox').hidden = true;
  if (state) $('dl').hidden = open || !state.downloads.length;
  if (!state) return;
  // 文書のパスは、作業のフォルダ(skill-factory からの相対パス)の下のパスとして出す。作業のフォルダの外(`../`)のパスは、そのまま出す
  const dp = state.documentPath;
  $('docpath').textContent = open ? state.questions.title : (status.workDir && !dp.startsWith('../') ? status.workDir + '/' : '') + dp;
  if (!open) return;
  const q = state.questions;
  const rest = q.items.filter(i => i.answer == null);
  const answered = q.items.length - rest.length + rest.filter(i => (qAnswers[i.number] || '').trim()).length;
  const box = el('div', {className: 'qbox'});
  if (q.added > 0 || q.removed > 0) box.append(el('div', {className: 'qnote'}, `前の答えで、質問が ${q.added} 問増え、${q.removed} 問減りました。`));
  const head = el('div', {className: 'qhead'});
  head.append(el('div', {className: 't'}, q.title), el('div', {className: 'c'}, `全 ${q.items.length} 問(回答済み ${answered} 問、残り ${q.items.length - answered} 問)`));
  box.append(head);
  for (const it of rest) {
    const v = qAnswers[it.number] || '';
    const row = el('div', {className: 'qi'});
    const l = el('div', {className: 'l'});
    l.append(el('span', {className: 'no' + (v.trim() ? ' ok' : '')}, (v.trim() ? '✓ ' : '') + `質問 ${it.number}`), el('span', {className: 'tx'}, it.text));
    row.append(l);
    if (it.choices && it.choices.length) {
      const cs = el('div', {className: 'chips'});
      for (const c of it.choices) {
        const b = el('button', {type: 'button', className: 'chip' + (v === c ? ' on' : '')}, c);
        b.onclick = () => { qAnswers[it.number] = v === c ? '' : c; renderQuestions(); };
        cs.append(b);
      }
      row.append(cs);
    } else {
      const t = el('textarea', {placeholder: '答えを書く', value: v, rows: 1});
      t.setAttribute('aria-label', `質問 ${it.number} の答え`);
      t.oninput = () => { qAnswers[it.number] = t.value; updateQCount(); };
      row.append(t);
    }
    box.append(row);
  }
  const foot = el('div', {className: 'qfoot'});
  const go = el('button', {type: 'button', disabled: answered === q.items.length - rest.length}, '回答を送る');
  go.onclick = () => {
    const lines = rest.filter(i => (qAnswers[i.number] || '').trim()).map(i => `${i.number}: ${qAnswers[i.number].trim()}`);
    if (!lines.length) return;
    qSent = JSON.stringify(q);
    qAnswers = {};
    renderQuestions();
    send(lines.join('\n'), false);
  };
  foot.append(el('span', {}, '答えた問いだけを送る'), go);
  box.append(foot);
  // 書いている途中の入力欄を作り直さないように、問いの組み立てが同じときは数と送るボタンだけを直す
  const sig = JSON.stringify([q, rest.map(i => i.choices && i.choices.length ? qAnswers[i.number] || '' : '')]);
  if ($('qform').dataset.sig === sig && $('qform').firstChild) { updateQCount(); return; }
  $('qform').dataset.sig = sig;
  $('qform').replaceChildren(box);
}

function updateQCount() {
  const q = state.questions;
  const rest = q.items.filter(i => i.answer == null);
  const done = q.items.length - rest.length;
  const answered = done + rest.filter(i => (qAnswers[i.number] || '').trim()).length;
  const c = $('qform').querySelector('.qhead .c');
  if (c) c.textContent = `全 ${q.items.length} 問(回答済み ${answered} 問、残り ${q.items.length - answered} 問)`;
  for (const i of rest) {
    const row = [...$('qform').querySelectorAll('.qi')][rest.indexOf(i)];
    const v = (qAnswers[i.number] || '').trim();
    const no = row && row.querySelector('.no');
    if (no) { no.className = 'no' + (v ? ' ok' : ''); no.textContent = (v ? '✓ ' : '') + `質問 ${i.number}`; }
  }
  const go = $('qform').querySelector('.qfoot button');
  if (go) go.disabled = answered === done;
}

// F6: プロンプトを送る。送れなかったときは、入力欄の上に理由を出し、書いた文を入力欄に戻す
async function send(text, fromChoice) {
  let error = null;
  try {
    const r = await fetch('/api/prompt', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
    if (!r.ok) error = await r.text();
  } catch { error = '中継サーバーにつながりません。'; }
  $('err').hidden = !error;
  $('err').textContent = error ? '送れませんでした。' + error : '';
  $('input').classList.toggle('ng', !!error);
  if (error) {
    if (fromChoice) { picked = null; renderChat(); }
    else $('input').value = text;
  }
  load();
}

// Enter で送り、Shift+Enter で改行する。日本語の変換中の Enter は送らない
$('input').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
};

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  if (state && state.decision) replySent = JSON.stringify(state.decision);
  replyOn = null;
  send(text, false);
};

// F9: 画面の更新を受ける(2 秒ごとに読み直す)
load();
setInterval(load, 2000);
</script>
</body>
