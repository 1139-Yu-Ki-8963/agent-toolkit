<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1684" viewBox="0 0 900 1684" font-family="'Noto Sans JP', system-ui, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fbf"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><rect x="0" y="0" width="900" height="460" rx="10" fill="#f6f7f9"/><text x="12" y="28" font-size="12" font-weight="700" fill="#57606a">phase 1</text><text x="12" y="44" font-size="11" fill="#57606a">全スキル共通の決ま<tspan x="12" dy="14">りの読み込みと前提</tspan><tspan x="12" dy="14">ツールの準備</tspan></text><rect x="0" y="468" width="900" height="172" rx="10" fill="#f6f7f9"/><text x="12" y="496" font-size="12" font-weight="700" fill="#57606a">phase 2</text><text x="12" y="512" font-size="11" fill="#57606a">入力の確定</text><rect x="0" y="648" width="900" height="172" rx="10" fill="#f6f7f9"/><text x="12" y="676" font-size="12" font-weight="700" fill="#57606a">phase 3</text><text x="12" y="692" font-size="11" fill="#57606a">コミットの読み取り</text><rect x="0" y="828" width="900" height="172" rx="10" fill="#f6f7f9"/><text x="12" y="856" font-size="12" font-weight="700" fill="#57606a">phase 4</text><text x="12" y="872" font-size="11" fill="#57606a">変更のまとめ</text><rect x="0" y="1008" width="900" height="76" rx="10" fill="#f6f7f9"/><text x="12" y="1036" font-size="12" font-weight="700" fill="#57606a">phase 5</text><text x="12" y="1052" font-size="11" fill="#57606a">メッセージを書く</text><rect x="0" y="1092" width="900" height="364" rx="10" fill="#f6f7f9"/><text x="12" y="1120" font-size="12" font-weight="700" fill="#57606a">phase 6</text><text x="12" y="1136" font-size="11" fill="#57606a">コミットを作る</text><rect x="0" y="1464" width="900" height="172" rx="10" fill="#dfe9f8"/><text x="12" y="1492" font-size="12" font-weight="700" fill="#57606a">phase 7</text><text x="12" y="1508" font-size="11" fill="#57606a">最終出力の確認とユ<tspan x="12" dy="14">ーザーへの完了の報</tspan><tspan x="12" dy="14">告</tspan></text><rect x="150" y="8" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="26" font-size="12">1-1 全スキル共通の決まりを読む</text><rect x="150" y="104" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="122" font-size="12">1-2 前提ツールがあるかを探す</text><polygon points="160,200 440,200 450,230 440,260 160,260 150,230" fill="#ffffff" stroke="#57606a"/><text x="160" y="218" font-size="12">1-3 不足している前提ツールがあるかを見る [分岐<tspan x="160" dy="16">]</tspan></text><rect x="150" y="296" width="300" height="60" rx="8" fill="#fff6d6" stroke="#c99700" stroke-width="2"/><text x="160" y="314" font-size="12">1-4 不足している前提ツールをインストールするか<tspan x="160" dy="16">をユーザーに聞く [ユーザー確認]</tspan></text><rect x="150" y="392" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="410" font-size="12">1-5 不足している前提ツールをインストールする</text><rect x="150" y="476" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="494" font-size="12">2-1 依頼を読み取る</text><rect x="150" y="572" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="590" font-size="12">2-2 依頼から読み取れなかった開始時の入力をユー<tspan x="160" dy="16">ザーに聞く</tspan></text><rect x="150" y="656" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="674" font-size="12">3-1 リポジトリとコミットの数を確かめる</text><rect x="150" y="752" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="770" font-size="12">3-2 直近の N 件のコミットを読む</text><rect x="150" y="836" width="300" height="60" rx="8" fill="#fff6d6" stroke="#c99700" stroke-width="2"/><text x="160" y="854" font-size="12">4-1 履歴の書き換えをユーザーに確かめる [ユーザ<tspan x="160" dy="16">ー確認]</tspan></text><rect x="150" y="932" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="950" font-size="12">4-2 変更を 1 つにまとめる</text><rect x="150" y="1016" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="1034" font-size="12">5-1 新しいコミットのメッセージを書く</text><rect x="150" y="1100" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="1118" font-size="12">6-1 コミットを作る</text><rect x="150" y="1196" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="1214" font-size="12">6-2 まとめたあとのコミットの数を数える</text><rect x="150" y="1292" width="300" height="60" rx="8" fill="#fff6d6" stroke="#c99700" stroke-width="2"/><text x="160" y="1310" font-size="12">6-3 まとめの結果を見せて確かめる [ユーザー確認<tspan x="160" dy="16">]</tspan></text><rect x="150" y="1388" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="1406" font-size="12">6-4 まとめる前の履歴に戻す</text><rect x="150" y="1472" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="1490" font-size="12">7-1 最終出力が最終出力の表と合うかを確かめる</text><rect x="150" y="1568" width="300" height="60" rx="8" fill="#ffffff" stroke="#c7ced6"/><text x="160" y="1586" font-size="12">7-2 ユーザーに完了を報告する</text><text x="0" y="1656" font-size="11" fill="#57606a">白の箱: 直列。六角の箱: 分岐。点線の箱: 委任。黄色の箱: ユーザー確認。青の帯: 最終出力を出す phase。<tspan x="0" dy="16">灰の線: 次へ進む、先へ飛ぶ。青の線: 前の step へ戻る。赤の線: 中止(点線は条件で起きる中止)。</tspan></text><line x1="300" y1="68" x2="300" y2="103" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="56" x2="510" y2="56" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="60" font-size="11" fill="#b42318">中止: `references/全スキル共通の決まり.md` を読めないとき</text><line x1="300" y1="164" x2="300" y2="199" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="300" y1="260" x2="300" y2="295" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="282" font-size="11" fill="#57606a">1 件以上</text><path d="M450,230 H540 V506 H451" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="456" y="224" font-size="11" fill="#57606a">0 件 → 2-1</text><line x1="300" y1="356" x2="300" y2="391" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="378" font-size="11" fill="#57606a">インストールする</text><line x1="450" y1="326" x2="510" y2="326" stroke="#b42318" stroke-width="1.5" marker-end="url(#arrow-red)"/><text x="516" y="330" font-size="11" fill="#b42318">やめる → 中止</text><line x1="300" y1="452" x2="300" y2="475" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="440" x2="510" y2="440" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="444" font-size="11" fill="#b42318">中止: OS を見分けられないとき、インストール後の確かめるコ…</text><line x1="300" y1="536" x2="300" y2="571" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="300" y1="632" x2="300" y2="655" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="300" y1="716" x2="300" y2="751" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="704" x2="510" y2="704" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="708" font-size="11" fill="#b42318">中止: git のリポジトリでないとき、コミットが N 件より多く…</text><line x1="300" y1="812" x2="300" y2="835" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="800" x2="510" y2="800" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="804" font-size="11" fill="#b42318">中止: コマンドの終了コードが 0 でないとき</text><line x1="300" y1="896" x2="300" y2="931" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="918" font-size="11" fill="#57606a">書き換える</text><line x1="450" y1="866" x2="510" y2="866" stroke="#b42318" stroke-width="1.5" marker-end="url(#arrow-red)"/><text x="516" y="870" font-size="11" fill="#b42318">やめる → 中止</text><line x1="300" y1="992" x2="300" y2="1015" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="980" x2="510" y2="980" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="984" font-size="11" fill="#b42318">中止: コマンドの終了コードが 0 でないとき</text><line x1="300" y1="1076" x2="300" y2="1099" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="300" y1="1160" x2="300" y2="1195" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="1148" x2="510" y2="1148" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="1152" font-size="11" fill="#b42318">中止: コマンドの終了コードが 0 でないとき</text><line x1="300" y1="1256" x2="300" y2="1291" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="1244" x2="510" y2="1244" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="1248" font-size="11" fill="#b42318">中止: 数が 1 でないとき</text><line x1="300" y1="1352" x2="300" y2="1387" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="1374" font-size="11" fill="#57606a">元に戻す</text><path d="M450,1322 H558 V1502 H451" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="456" y="1316" font-size="11" fill="#57606a">承認する → 7-1</text><path d="M150,1322 H126 V1046 H149" fill="none" stroke="#1d5fbf" stroke-width="1.5" marker-end="url(#arrow-blue)"/><text x="122" y="1314" text-anchor="end" font-size="11" fill="#1d5fbf">直す(戻る)</text><line x1="450" y1="1340" x2="510" y2="1340" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="1344" font-size="11" fill="#b42318">中止: 「元に戻す」が選ばれたとき</text><line x1="450" y1="1436" x2="510" y2="1436" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="1440" font-size="11" fill="#b42318">中止: コマンドの終了コードが 0 でないとき、または戻し終え…</text><line x1="300" y1="1532" x2="300" y2="1567" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" y1="1520" x2="510" y2="1520" stroke="#b42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/><text x="516" y="1524" font-size="11" fill="#b42318">中止: 見分け方のコマンドの終了コードが 0 でないとき</text><line x1="300" y1="1448" x2="300" y2="1471" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/></svg>