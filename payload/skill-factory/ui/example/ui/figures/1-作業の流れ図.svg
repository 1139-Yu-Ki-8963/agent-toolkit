<text x="344" y="60" font-size="11" fill="#57606a">段階 4</text>
<text x="344" y="82" font-size="11" font-weight="700" fill="#1f2328">SKILL.md<tspan x="344" dy="14">の下書き</tspan></text>
<line x1="436" y1="76" x2="447" y2="76" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
