<rect x="672" y="40" width="100" height="72" rx="10" fill="#ffffff" stroke="#c7ced6"/>
<text x="680" y="60" font-size="11" fill="#57606a">段階 7</text>
<text x="680" y="82" font-size="11" font-weight="700" fill="#1f2328">シナリオ</text>
<line x1="772" y1="76" x2="783" y2="76" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="784" y="40" width="100" height="72" rx="10" fill="#ffffff" stroke="#c7ced6"/>
<text x="792" y="60" font-size="11" fill="#57606a">段階 8</text>
<text x="792" y="82" font-size="11" font-weight="700" fill="#1f2328">テストの実行</text>
<path d="M224 34V24H884V34" fill="none" stroke="#c99700" stroke-width="2"/>
<text x="554" y="16" font-size="11" fill="#6b5400" text-anchor="middle">段階 3 から 8 を、スキルの本数だけ繰り返す</text>
<path d="M500 112V128H456V114" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="470" y="144" font-size="11" fill="#15488f" text-anchor="middle">照合と修正を 3 回まで</text>
<path d="M834 112V176H542V114" fill="none" stroke="#b42318" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="688" y="194" font-size="11" fill="#b42318" text-anchor="middle">不合格があれば、段階 5 に戻ってもう一度段階 7 と 8 を通る</text>
<text x="0" y="226" font-size="11" fill="#57606a">青の箱: いまの段階。黄色の線: 繰り返し。青の線: 照合と修正の輪。赤の線: テストの不合格からの戻り。</text>
