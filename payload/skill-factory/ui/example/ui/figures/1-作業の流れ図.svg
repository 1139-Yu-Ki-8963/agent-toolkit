<rect x="560" y="40" width="100" height="72" rx="10" fill="#ffffff" stroke="#c7ced6"/>
<text x="568" y="60" font-size="11" fill="#57606a">段階 6</text>
<text x="568" y="82" font-size="11" font-weight="700" fill="#1f2328">テスト計画書</text>
