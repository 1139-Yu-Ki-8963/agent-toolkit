<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Noto Sans JP', system-ui, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d5fbf"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs>
<rect x="0" y="40" width="100" height="72" rx="10" fill="#1d5fbf" stroke="#1d5fbf"/>
<text x="8" y="60" font-size="11" fill="#ffffff">段階 1</text>
<text x="8" y="82" font-size="11" font-weight="700" fill="#ffffff">要件定義書</text>
<line x1="100" y1="76" x2="111" y2="76" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
