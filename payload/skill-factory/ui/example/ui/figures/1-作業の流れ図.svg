<text x="120" y="82" font-size="11" font-weight="700" fill="#1f2328">分割設計書</text>
<line x1="212" y1="76" x2="223" y2="76" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="224" y="40" width="100" height="72" rx="10" fill="#ffffff" stroke="#c7ced6"/>
<text x="232" y="60" font-size="11" fill="#57606a">段階 3</text>
<text x="232" y="82" font-size="11" font-weight="700" fill="#1f2328">構成の案</text>
<line x1="324" y1="76" x2="335" y2="76" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
