\n- 既存 `check-doc-cross-reference.sh` への機能追加: あちらは文書間の節番号の相互参照が実在するかを見る。ハッシュのgit上の祖先判定とは対象・判定式が異なる\n- 履歴の再作成より前かを都度 `git log -L` 等で動的に判定する方式: 履歴自体が単一の初回コミットへ潰されているため、行の追加時期を機械的に遡ることができない（初回コミットの時点で全内容が一度に追加されたと記録される）。固定の一覧を実測して持つ方式のみが実行可能だった\n- 一覧を自動更新する仕組み（判定不能の理由が「履歴再作成より前」であることを都度推定して一覧へ追記する等）: 推定の基準を機械的に確定できず、新しく切れたハッシュまで誤って判定不能に分類してしまう危険がある。一覧は実測した1回分で固定し、以後の切れは無条件で不合格として検出する設計を優先した\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。判定表・記録のハッシュの書き方（判定表のコミット欄・`**状態**: 完了（コミット: ...）`の括弧内）を変える場合は、本スクリプトの `extract_hashes` と本節を同時に更新する。統合先の枝名（既定 `main`）を変える場合は `check_hash` の `merge-base --is-ancestor` 呼び出しを同時に更新する。`docs/references/pre-rewrite-hashes.json` は2026-08-26の実測時点で固定した一覧であり、以後の新しい切れをここへ追記しない。新しい切れは判定表・記録側を修正して解消する。\n\n**廃棄条件**: 判定表・記録にコミットハッシュを書く運用自体を廃止した時、またはハッシュが枝の取り込みで失われない仕組み（取り込み方式の完全な標準化等）が確立し、本検査を必要としなくなった時。`docs/references/pre-rewrite-hashes.json` は本検査自体を廃止した時に併せて廃止する。\n\n### check-ledger-completion-reproducibility.sh\n\n**必要性**: 公開台帳 `docs/tasks/指摘改善一覧.md` の「完了」141件のうち、検証側が再実行できるコマンドを状態行に持つものは20件だけで、121件はコマンドを持たない。状態行が作業内容だけを述べ、検収方法をどう確かめたかを再現できないと、検証側は未対応との違いを判定できず、同じ課題を再検証する。完了状態行に再実行できるコマンド、または機械で確かめられない理由があるかを繰り返し同じ基準で集計する検査が要る。既存141件を一度に止めないため、既定は件数報告だけで終了コード0とし、移行状況を把握した上で `--strict` のときだけ不合格を終了コード1へ反映する。\n\n**代替案を採用しなかった理由**:\n- Bashツール直叩き: 状態行の見出し境界、コマンド表記、機械で確かめられない理由の判定を実行のたびに組み直すと集計基準がぶれ、検証側が同じ結果を再現できない\n- `report-progress.sh` への追加: 同スクリプトは状態語彙と1見出し1状態行を検査する進捗集計が責務であり、検収証拠の移行状況と strict 判定を加えると、既存の定期報告まで121件の移行状態に結合する\n- 第1層集約の走査範囲を `docs/scripts/` へ広げる: 既存の全検査の収集結果を変える影響が大きい。`generation-engine/scripts/tests/` の薄いラッパーで本体の自己テストだけを委譲する方が影響範囲が小さい\n- 既定から strict にする: 現状121件を一度に不合格にして台帳の更新運用を止めるため採らない\n\n**保守責任者**: 人手（ユーザー）。台帳の見出し形式、状態行の形式、検収コマンドの書き方、機械で確かめられない理由のラベルを変更する場合は、`issue-ledger-format/rule.md`、本体の判定と自己テスト、薄いラッパーを同時に更新する。\n\n**廃棄条件**: 指摘改善一覧による追跡運用を廃止した時。または台帳の記録システムが検収項目ごとの判定・再実行可能なコマンド・機械で確かめられない理由を構造化データとして必須化し、同等以上の既定報告と strict 判定を提供するようになった時。\n\n### check-design-doc-references.sh\n\n**必要性**: `docs/design/` 配下の参照切れを見つける検査が1本も無く、2026-08-26 の実測で `docs/design/AI駆動開発セットアップ構想.md` の2箇所（`docs/reverse-docs-overview.html`・`.claude/CLAUDE.md`）が置き場の移動に追従できず実在しないパスを指したまま長期間残っていた。既存の `check-payload-references.sh` は納品対象（`.claude/skills`・`delivery-payload`・`generation-engine` 等）だけを走査対象にしており `docs/design/` を含まない。同種の参照切れは繰り返し起こりうるため、`docs/design/` 配下の全 `.md` を横断して機械的に検出する検査が要る。\n\n実装のうえで、逆引用符で囲まれた文字列を無差別に「パス付きの参照」として抽出すると誤検出が大量に生じることが実測で判明した（全体で543件の候補のうち354件が不在という結果になった）。誤検出の内訳は、(a) 納品先（対象アプリ）の出力配置を説明する記述（`docs/common/`・`docs/rules/business-domain/glossary/` 等。このリポジトリ自身のパスではない）、(b) `generation-engine/scripts/` 内の群同士が互いを指す省略記法（`extract/foo.sh` が `generation-engine/scripts/extract/foo.sh` を指す等）、(c) 外部リポジトリのパス（`DevsProtein/agents-sync` の `src/targets/link.ts` 等）、(d) 単一階層のディレクトリ名だけの提案的言及（`shared/`・`project-setup/` 等、実装されていない将来案）である。これらを機械的に除くため、抽出した文字列の最初の1階層がこのリポジトリのルート直下の実在物（`delivery-payload`・`generation-engine`・`docs`・`.claude` 等）と一致するものだけを対象にし、末尾の1個のスラッシュを除いた残りにスラッシュを含まないもの（単一階層の言及）を除外し、空白・シェルのメタ文字（`$ \u003c > * ( ) { } ' \" | ; &` `\\`）を含む文字列（コマンド断片・環境変数・グロブ・プレースホルダ）を除外する。この絞り込みにより候補は407件まで減った。\n\n残る72件を実際に1件ずつ分類したところ、次の4種であることが判明した。(1) 台帳・指示書の置き場が `docs/tasks/done/`・`docs/tasks/work-records/` へ移動していたのに追従していない、実在するパスへ移設すれば直る参照（8種の文字列・約27箇所）。これは実際に本検査を新設する過程で path のみを移設して直した。(2) 2026-08-21 の履歴書き換え（コミット `2ee874944bdfc0ac9e6c354f4e9ceac5f5464f27`）により実在確認の手段が失われた過去のファイルへの言及（`docs/ledgers/検証で見つかった改修課題.md` 等）。(3) 改称完了を記録する文の中で意図的に旧名のまま残した記述（`.claude/skills/orchestrating-reverse-docs-flow/`。書き換えると改称の記録自体が成立しなくなる）。(4) 検証時点の一時的な記述・英字リネーム前のサンプル配置への言及で、`check-portal-dir-ascii.sh` の設計判断が `docs/` 配下をリネーム対象外と既に明記している。(2)〜(4) の14件は `docs/references/design-doc-reference-exclusions.json` へ固定の一覧として記録し、本検査はこの一覧に載る文字列だけを判定対象から除外する。一覧は実測時点で固定し、以後は手で追記する（`pre-rewrite-hashes.json`・`document-style-exclusions.json` と同じ形）。新しく見つかった参照切れはこの一覧に無いため、そのまま不合格として検出される。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: `docs/design/` 配下の全 `.md`（本稿時点で43件）から候補を抽出し2つの基点で存在確認する処理を対話セッションのたびに手で組み立てると、抽出の正規表現も判定基準も実行のたびにぶれる\n- 抽出したすべての候補をそのまま実在確認の対象にする（絞り込みを設けない）: 実測のとおり誤検出が354件に達し、検査として機能しない\n- 誤検出のたびに個別の文字列をスクリプト内へハードコードして除外する: 除外理由を記録できず、後から見直す手がかりが残らない。既存の `pre-rewrite-hashes.json`・`document-style-exclusions.json` と同じ、理由付きの外部JSON一覧に統一した\n- 既存 `check-payload-references.sh` への機能追加: あちらは納品対象（`.claude/skills`・`delivery-payload`・`generation-engine`・`README.md` 等）の参照切れが関心であり、`docs/` 配下は走査対象から明示的に除かれている。対象ディレクトリが異なるため同居させると走査範囲の意味が混乱する\n- 既存 `check-doc-cross-reference.sh` への機能追加: あちらは `§N` 形式の節番号の相互参照が関心であり、逆引用符で囲まれたファイルパスの実在確認とは対象・判定式が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。ルート直下許可リスト（`ROOT_ALLOW`）を増減する場合は本スクリプトと本節を同時に更新する。除外一覧（`docs/references/design-doc-reference-exclusions.json`）へ新しい項目を追記する場合は、必ず理由（納品先の出力配置・履歴書き換えによる確認手段の喪失・改称記録の意図的な旧名残存・検証時点の一時的な記述、のいずれか）を添える。\n\n**廃棄条件**: `docs/design/` による設計文書の管理自体を廃止した時、または参照切れの検査を別の機構（`check-payload-references.sh` の走査範囲拡張等）が標準で提供するようになった時。\n\n### check-design-doc-line-refs.sh\n\n**必要性**: `docs/design/`には、このリポジトリ自身のスクリプトや文書を行番号で指す参照が77件残っていた。委任元の検出式で72件を確認し、広い検出式の実行で単一行参照をさらに5件確認した。参照先へ1行追加するだけで説明が別の実装を指し、ずれても検知できない。位置ではなく関数名・節名・該当箇所で説明する状態を維持する検査が必要である。\n\n**代替案を採用しなかった理由**:\n- レビュー時の目視だけにする: 77件が残るまで見逃されており、追加後の継続的な検知にならない\n- Markdownの特定表記だけを探す: 行番号参照は本文、表、括弧内、ヘッダコメント参照に分散しており、書式を限定すると取りこぼす\n- 数字の範囲をすべて禁止する: 実測秒数・件数・版番号まで誤検出するため、`行目`を伴う位置参照だけを対象にする\n\n**保守責任者**: 人手（ユーザー）。設計文書で行番号参照を表す語形を増やす場合は、本体の検出式と自己テストを同時に更新する。\n\n**廃棄条件**: 設計文書が行番号ではなく不変の意味識別子だけを参照する別の文書基盤へ移行し、同等以上の参照整合検査が提供された時。\n\n### check-retired-terms-in-samples.sh\n\n**必要性**: テンプレートから廃止語を除いた後も、再生成されなかった見本5件に同じ語が15箇所残った。利用者が参照する見本とテンプレートを同じ一覧で継続検査する必要がある。\n\n**代替案を採用しなかった理由**: テンプレートと見本を手作業のgrepで別々に調べる方法は、片方だけを測る抜けを防げない。既存の指示書向け検査は走査対象と除外理由が異なるため、責務を混在させない。\n\n**保守責任者**: 人手（ユーザー）。廃止語は `docs/references/retired-terms.json` で管理する。経緯説明を表す語や走査対象を変える場合は、本体と自己テストを同時に更新する。\n\n**廃棄条件**: 見本とテンプレートの生成経路が、廃止語一覧を入力にして残存を防ぐ同等以上の検査を常に実行するようになった時。\n\n### check-skill-cross-references.sh\n\n**必要性**: `.claude/skills` のMarkdownには別スキルを名前で呼ぶ記述がある。改名・統合・削除後も文字列だけが残ると、実行時まで参照切れに気付けない。全候補とスキル定義の実在を継続して照合する必要がある。\n\n**代替案を採用しなかった理由**: 手作業のgrepでは毎回の分類基準が残らない。既存のパス検査は参照資料のファイルを対象とし、名前だけのスキル呼び出しを扱わない。Makefileは無く、package.jsonの既存コマンドも本検査を扱わない。本検査だけの実行基盤は増やさない。一般語・旧名の記録・別リポジトリへ配る名前は、出現元と理由を記した外部一覧で除外する。スクリプトへ除外を直書きしない。\n\n**保守責任者**: 人手（ユーザー）。スキル名の接頭辞を増やす場合は抽出式と自己テストを更新する。除外を増やす場合は `docs/references/skill-cross-reference-exclusions.tsv` へ理由を記録する。\n\n**廃棄条件**: スキル呼び出しが自由記述の名前ではなく、登録時に実在検証される構造化参照へ完全移行し、同等以上の検査が常時実行されるようになった時。\n### check-reference-json-integrity.sh\n\n**必要性**: 7つの参照JSONは、成果物種別、出力配置、設計種別、文書名、規約分類を相互に指す。\n生成器は必要な組だけを個別に読むため、片側の改名で生じる参照切れを全体として検知できない。\n対応をJSONへ宣言し、変更のたびに同じ23対応を横断検査する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bashツール直叩き: 23対応の抽出式と集合比較を毎回組み直すと、検査対象が実行者ごとに変わる\n- `check-depends-on-kind.sh`への追加: あちらは画面依存の宣言が指定11成果物へ付くかを扱う。本検査は依存先kind自体の実在を含む定義間の参照切れを扱う\n- `check-excluded-deliverables.sh`への追加: あちらは対象外記録の2語彙を分離する契約と状態解決を扱い、定義キーの集合対応は扱わない\n- `check-confirmation-doc-handover.sh`への追加: あちらは要確認事項文書の引き渡しを扱い、参照JSON間のキー対応は扱わない\n- 既存Makefileまたはpackage.jsonへの追加: このリポジトリには検査を載せる既存の対象が無い\n\n**保守責任者**: 人手（ユーザー）。7定義の参照を増減する場合は、`reference-json-integrity.json`の対応と自己テストを同時に更新する。\n\n**廃棄条件**: 7定義が単一の定義へ統合されて相互参照が消えるか、生成基盤が同じ対応を常時検査するようになった時。\n\n### check-template-guidance-skill-steps.sh\n\n**必要性**: リバース検証テンプレート43件に記入規則がある。しかし、対応する生成Skillが指示を実行しなければ生成文書へ品質要件が届かない。テンプレートと生成手順の対応を継続して照合する必要がある。\n\n**代替案を採用しなかった理由**: 目視確認では、テンプレート追加時や担当Skill変更時の再確認が残らない。対応をスクリプトへ直書きすると、担当を確定した理由と判定不能をデータとして見直せない。対応は外部TSVへ分離する。\n\n**保守責任者**: 人手（ユーザー）。記入規則を持つテンプレートまたは担当Skillを変更する場合は、`docs/references/template-guidance-skill-mapping.tsv`も更新する。生成担当を確定できた場合は、判定不能の行を担当Skillへ割り当て直す。\n\n**廃棄条件**: テンプレートの記入規則が、生成エンジンから必ず実行される構造化命令へ移行した時。または同等以上の対応検査がテンプレートエンジンに組み込まれた時。\n\n### check-ledger-commands-runnable.sh\n\n**必要性**: 台帳の完了状態に検収コマンドが記録されていても、後続変更後に終了コード0になる保証はない。検証側が同じコマンドを一覧化し、必要な範囲だけ実行して現時点の再現性を継続確認できる検査が必要である。\n\n**代替案を採用しなかった理由**: 既存の台帳検査はコマンド記載の有無を扱い、実行結果を扱わない。全件を第1層で常時実行すると所要時間が大きいため、既定は一覧表示とし、明示した場合だけ実行する。Makefileとpackage.jsonには検査を載せる既存基盤がなく、判定と自己テストを分散させないため本体と薄い入口に分ける。\n\n**依存の参照を渡す理由**: 配布先には Node.js と Python の依存が置かれない。置くと版管理へ混入する。実際に前の周で混入が起きた。置かずに参照だけを渡すことで、配布先でも測れるようにする。\n\n実測（2026-08-28）で、配布先の 1-203・1-224 がブラウザの依存の不在で判定不能になっていた。`NODE_PATH` と `GLOSSARY_PYTHON` を渡すと両方とも通る。参照先が無い場合は何も渡さず、従来どおり判定不能のまま進む。\n\n同じ形は `check-payload-layer1.sh` が先に採っている。あちらは配布先の集約へ渡す。こちらは台帳の検収コマンドへ渡す。\n\n**保守責任者**: 人手（ユーザー）。台帳の状態行またはコマンド記録形式を変える場合は、抽出処理と自己テストを同時に更新する。依存の参照先を変える場合は `resolve_dep_env` と本節を同時に更新する。\n\n**廃棄条件**: 台帳が構造化データへ移行し、記録された検収コマンドの選択実行・時間制限・合否と判定不能の分離を同等以上に提供する検証基盤へ置き換わった時。\n\n**配布対象外の断り書きに対する参照先実在判定（repo_only）の追加判断**: 状態行に「配布対象外」と断ってあるコマンドを実行すると、配布先にしか無い資産（このリポジトリの自立検査そのもの等）を参照するものが不合格として数えられる。2026-08-28 の実測で、配布先の154件のうち2件（`同期定義-登録漏れ防止`・`自立検査-走査範囲不足`）がこの形に当たった。\n\n**必要性**: 断り書きだけで無条件に飛ばすと、配布元でも確かめられなくなる。配布元には配布対象外の資産が実在するため、配布元ではそのコマンドを実行して確かめられるべきである。そのため参照先パスの実在で分岐する形を採った。参照先が実在すれば（配布元で実行する場合）従来どおり実行し、実在しなければ（配布先で実行する場合）「対象外」として数え、不合格には数えない。\n\n**代替案を採用しなかった理由**: 断り書きだけで無条件に飛ばす案は、配布元でも確かめられなくなるため採らなかった。`check-ledger-commands-portable.sh` が既に持つ `repo_only` の口をそのまま使う案も検討した。あちらは参照先が `.claude/rules/` 配下の場合に限定している。2件目（`generation-engine/scripts/verification/check-self-contained.sh` を参照する `自立検査-走査範囲不足`）はこの条件に当たらない。対象を限定しない参照先実在判定を本スクリプト側に独立して持たせた。\n\n**保守責任者**: 人手（ユーザー）。参照先パスの抽出パターン（`[A-Za-z0-9_./-]+\\.(sh|md|json|mjs|cjs|py|html|css|yml)`）を変える場合は `repo_only_paths_exist` と本節を同時に更新する。\n\n**廃棄条件**: 台帳から「配布対象外」の断り書き運用自体を廃止した時、または配布先固有の除外判定を `check-ledger-commands-portable.sh` 側へ統合した時。\n\n### check-ledger-commands-portable.sh\n\n**必要性**: 台帳の完了行にある検収コマンドは配布元リポジトリのルートを起点に書かれている。公開先では配置が変わり、同期対象外のファイルを参照するコマンドはそのまま再現できない。外部の同期定義を読まず、このリポジトリだけで公開対象と検収コマンドの参照パスを継続して突合する必要がある。\n\n**代替案を採用しなかった理由**: 公開側の同期定義を読む方法は、このリポジトリ単体で自己テストできず、公開側の配置にも依存する。既存 `check-ledger-commands-runnable.sh` はコマンドの一覧化と選択実行を担い、公開対象への包含判定は扱わない。公開時の目視確認では147件の完了行を変更のたびに再確認できない。Makefileとpackage.jsonには検査を載せる既存基盤がない。\n\n**このリポジトリ専用の検収を認める口**: 状態行の中に「配布対象外」と断ってあり、かつ参照先が `.claude/rules/` 配下である場合、そのコマンドを検査の対象から外す。\n\n実測（2026-08-28）で1件が不合格になった。公開手順を定める規約そのものの節の有無を確かめる検収であり、配布先で再現する意味を持たない。同規約は配布対象外と定めているため、配布先には存在しない。\n\n断り書きを求めるのは、理由なく除外を増やさないためである。断り書きがあっても、`.claude/rules/` を参照しない別のコマンドは従来どおり検査する。この範囲の限定は実測で確かめた。\n\n**保守責任者**: 人手（ユーザー）。公開対象、公開除外、台帳の状態行またはコマンド記録形式を変える場合は、本体の許可・除外一覧と自己テストを同時に更新する。除外の口の断り書きを変える場合は `emit_commands` の `repo_only` の判定と本節を同時に更新する。\n\n**廃棄条件**: 台帳が公開先を起点とする構造化コマンドへ移行し、同期処理が各参照パスの包含を同等以上に常時検証するようになった時。\n\n## 規則\n\n| 規則 | 内容 | 根拠 | 検査 |\n|---|---|---|---|\n| 色トークン統一 | 刷新前の旧トークン値を使わず、刷新後の新トークン値とテーマ属性（`prefers-color-scheme`・`data-theme`）を両方備える | 明暗表示・配色の一貫性を保つため | 静的解析: test-portal-conventions.sh の「色トークン-旧値禁止」「色トークン-新値存在」「テーマ-定義」検査 |\n| 全画面フィットレイアウト | ページコンテナに `height: 100vh` と `overflow: hidden` を指定し、メインコンテンツ領域だけをスクロールさせる。テーブルの `thead` は `position: sticky` にする | 生成 HTML が共通シェルの全画面フィット体裁から外れないようにするため | 静的解析: test-portal-conventions.sh の「全画面-高さ固定」「全画面-overflow制御」「全画面-スクロール領域」「sticky-thead」「共通シェル-サイドバー」「共通シェル-方眼紙」検査 |\n| デザインの基本形 | `border-radius` は 0 のみとし、`box-shadow` にぼかし半径を持たせない | 刷新後のデザインが角丸・ぼかし影を使わない方針のため | 静的解析: test-portal-conventions.sh の「角丸-ゼロ」「影-オフセットのみ」検査 |\n| 一覧ページの列数・展開構造 | 一覧ページの `\u003cthead>` の `\u003cth>` は6個以下とし、展開グループ分離・details禁止・common-files禁止・unresolved条件分岐・分割軸マーカーの構造規約に従う | 一覧の可読性と一貫した展開構造を保つため | 静的解析: test-portal-conventions.sh の「一覧-列数上限」「一覧-展開グループ分離」「一覧-details禁止」「一覧-common-files禁止」「unresolved-条件付き」「一覧-分割軸マーカー」検査 |\n| ポータルトップの画面なし縮退 | `disabledWhenEmpty: true` の種別は対象0件でもカードを消さず、選べない状態で残す | 対象リポジトリに実ファイルが無い種別の存在を利用者に伝えるため | 静的解析: test-portal-conventions.sh の「縮退-無効カード表示」「縮退-リンク無効化」検査 |\n| 重要度コールアウト | 通常表へ埋没させてはいけない注意喚起は、共通シェルの `.pt-callout` と重要度修飾クラス（注意・警告・重要）で表示する | 見落とすと成果物の意味が変わる事項を通常の説明と区別するため | レビュー: portal-reviewer が本ファイルを Read して照合する |\n| 生成スクリプトの設計判断の維持 | 「設計判断」節に記録された各生成・検査スクリプトの必要性・代替案・保守責任者・廃棄条件を維持する | 各スクリプトが存在してよい理由と廃止できる条件を後から追跡できるようにするため | 判定不能: 個々のスクリプトが存在してよい理由は文脈判断を要し、静的解析では判定できない |\n\n## このプロジェクトの規則\n\n| 規則 | 内容 | 根拠 | 検査 |\n|---|---|---|---|\n| 観測なし | 本規約はこのリポジトリ自身が生成するポータル HTML の合格基準であり、対象リポジトリの観測から新たに起こす規則は無い | 本規約は生成器自身のデザインシステム規約であり、対象プロジェクトの観測結果ではないため | 観測なし |\n\n### check-shell-var-before-multibyte.sh\n\n**必要性**: bash は変数名を英数字とアンダースコアで区切る。ところが macOS の bash 3.2 は、変数展開の直後に続く全角文字を変数名の一部として飲み込む。実測（2026-08-28）で確かめた。全角の丸括弧で囲んだ中の裸の変数展開が、閉じ括弧まで名前に取り込まれた。`set -u` の下ではスクリプトが止まる。`set -u` が無い場合は値が欠け、閉じ括弧のバイトが壊れて出力された。この形は31ファイル・49箇所に潜んでいた。うち1件は `docs/scripts/check-payload-layer1.sh` の実行を実際に止めていた。残りは値の欠けた報告を出していた。日本語で書く報告文の中に変数を差し込む書き方はこのリポジトリ全体で常用されるため、直した後も新しく書くたびに再発する。書くたびに人が思い出す運用では防げないため、繰り返し実行できる検査として固定する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 31ファイルの走査を対話セッションのたびに手で組み立てると、判定基準が実行のたびにぶれる。実際にこの形は長期間気付かれずに残った\n- `grep -rnE` で走査する: BSD grep の `-E` は16進のエスケープを解さず、UTF-8 のロケールの下で「invalid character range」を返して終了コード2で止まる。実測（2026-08-28）で、`2>/dev/null` を付けていたためこのエラーが隠れ、走査そのものが行われないまま「該当なし」に見えた。perl は多バイトを正しく扱い、ロケールに左右されない\n- 既存 `check-mktemp-placement.sh` への機能追加: あちらは `mktemp` の置き場指定の有無を見る。変数展開の直後のバイトを見る本検査とは判定対象・判定式が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。走査対象の4つの置き場を増減する場合は本スクリプトの `judge` の既定一覧と本節を同時に更新する。\n\n**廃棄条件**: このリポジトリの検査スクリプトが bash を使わなくなった時、または bash が変数名の区切りとして全角文字を正しく扱うようになり、波括弧なしでも壊れなくなった時。\n\n### generation-engine/scripts/tests/check-shell-var-before-multibyte.test.sh\n\n**必要性**: 第1層の集約が走査するのは `generation-engine/scripts/` と `delivery-payload/templates/rules/checkers/` だけである。本体は `docs/scripts/` に置くため、この入口が無いと一度も実行されない。既存の同種の入口と同じ形にする。本体の `--self-test` を呼び、終了コードをそのまま返す。判定の中身は写して持たない。\n\n**代替案を採用しなかった理由**:\n- 集約の走査対象へ `docs/scripts/` を足す: 既に集約へ載っている250本近い検査の収集結果を変える危険を伴う\n- 本体を `generation-engine/scripts/` へ置く: あちらは納品先で動く道具の置き場であり、このリポジトリ自身の検査は `docs/scripts/` に既存の一群が揃っている\n- 判定の中身を入口へ写す: 本体と入口の二重の定義になり、片方だけが更新されて食い違う\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。本体のパスまたは自己テストの呼び出し方を変える場合はこの入口も同時に更新する。\n\n**廃棄条件**: 本体を廃止した時、または集約が `docs/scripts/` を標準で収集するようになった時。\n\n### generation-engine/scripts/tests/ の集約に載っていなかった検査の入口5本\n\n**必要性**: 第1層の集約は `generation-engine/scripts/` と `delivery-payload/templates/rules/checkers/` だけを走査する。`.claude/rules/` と `docs/scripts/` は対象外である。入口が無ければ載らない。\n\n実測（2026-08-28）で、`.claude/rules/` 配下に `--self-test` を持つ検査が4本あった。集約に載っているものは0本だった。対象は次の4本である。\n\n- `check-audience-split.sh`\n- `check-delegation-worktree.sh`\n- `check-new-ledger-file.sh`\n- `check-subagent-report-verification.sh`\n\n`docs/scripts/` 配下は39本のうち38本に入口があった。`report-progress.sh` の1本だけが載っていなかった。\n\n合わせて5本である。いずれも実行すると合格する。ただし集約に載らないため、壊れても気付けない。既存の同種の入口と同じ形にする。本体の `--self-test` を呼び、終了コードをそのまま返す。判定の中身は写して持たない。\n\n作る入口は次の5本である。\n\n- `check-audience-split.test.sh`\n- `check-delegation-worktree.test.sh`\n- `check-new-ledger-file.test.sh`\n- `check-subagent-report-verification.test.sh`\n- `report-progress.test.sh`\n\n5本は構造と判断が同一のため、1つの節にまとめる。\n\n**代替案を採用しなかった理由**:\n- 集約の走査対象へ `.claude/rules/` と `docs/scripts/` を足す: 既に集約へ載っている250本近い検査の収集結果を変える危険を伴う。`.claude/rules/` には自己テストを持たない hook 本体も多数あり、収集条件と実態がずれる\n- 本体を `generation-engine/scripts/` へ移す: `.claude/rules/` の4本はいずれも規約の機械強制そのものであり、規約の定義と同じ場所に置くのが正しい。移すと規約と機械強制が離れる。`docs/scripts/` の1本はこのリポジトリ自身の運用の道具であり、納品先で動く道具の置き場とは対象が異なる\n- 判定の中身を入口へ写す: 本体と入口の二重の定義になり、片方だけが更新されて食い違う\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`.claude/rules/` または `docs/scripts/` 配下へ `--self-test` を持つ検査を新設した場合は、対応する入口も同時に作る。本体のパスを変えた場合は入口の `TARGET` も同時に更新する。\n\n**廃棄条件**: 対応する本体が廃止された時、または集約が `.claude/rules/` と `docs/scripts/` を標準で収集するようになった時。\n\n### check-mktemp-failure-guard.sh と generation-engine/scripts/tests/check-mktemp-failure-guard.test.sh\n\n**必要性**: `mktemp` は実行環境の制約で失敗する。サンドボックスの下では「Operation not permitted」を返す。戻り値を見ないスクリプトは空文字のまま処理を続ける。実測（2026-08-28）で `build-portal.sh` が `/repo` や `/docs` という絶対パスへ書こうとし、62件の自己テストがまとめて不合格になった。対象の中身には何の問題も無かった。\n\n判定不能の規約は「実行できなかった」と「不合格だった」を区別することを定める。定義は `.claude/rules/always/verification/indeterminate-result/rule.md` にある。ただしその適合は機械で判定できないとして、機械強制を見送っている。本検査はその手前の一段だけを見る。失敗チェックが1つも無いことは機械で分かる。\n\n実測（2026-08-28）で、走査対象4つの置き場のうち `mktemp` を使うスクリプトは229本あった。そのうち122本が失敗チェックを1つも持たなかった。\n\n既定は報告のみで終了コード0を返す。一度に止めると直すまで集約が動かなくなるためである。`--strict` のときだけ1件でもあれば終了コード1を返す。この形は `check-ledger-completion-reproducibility.sh` の先例に倣う。\n\n入口は本体を集約へ載せるために置く。集約が走査するのは `generation-engine/scripts/` と `delivery-payload/templates/rules/checkers/` だけである。`docs/scripts/` に置いた本体は、この入口が無いと一度も実行されない。判定の中身は写して持たない。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 229本の走査を対話セッションのたびに手で組み立てると、失敗チェックとして何を認めるかが実行のたびにぶれる\n- 既定から `--strict` にする: 実測時点で122本が該当し、一度に止めると直すまで集約が動かなくなる\n- 既存 `check-mktemp-placement.sh` への機能追加: あちらは `mktemp` の置き場の指定の有無を見る。失敗チェックの有無を見る本検査とは判定対象が異なる\n- 判定不能の規約が定める「区別できているか」まで見る: 規約自身が機械では判定できないと記す。本検査はその手前の「チェックが1つも無い」だけを見る\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**既知の限界**: ファイルの中に失敗チェックが1つでもあれば合格とする。複数の `mktemp` 呼び出しのうち一部だけが無防備な場合は拾えない。実測（2026-08-28）で `build-portal.sh` がこれに当たった。8箇所のうちヘルパー1箇所だけがチェックを持ち、残る3箇所は戻り値を見ていなかった。この3箇所が今日の事故の直接の原因である。\n\n呼び出し回数とチェック回数を比べる形にすると、ヘルパー経由で複数箇所を守っている場合を誤って不合格にする。まず「1つも無い」を拾う最低線から始める。\n\n**既定を止める形へ切り替えた経緯**: 新設した時点では該当が122本あり、一度に止めると直すまで集約が動かなくなるため報告のみにしていた。同じ日のうちに123本すべてを直し、該当0本になったため既定を止める形へ切り替えた。以後に該当が生まれたら、それは新しく書かれた無防備な `mktemp` である。移行の途中で使う口として `--lenient` を残す。\n\n判定の途中で3種類の誤検出を踏み、そのたびに判定を足した。1つ目は文字列やファイル名の中の `mktemp` を拾う形で、呼び出し位置を見る `calls_mktemp` で外した。2つ目はヘルパー関数の中で呼び、呼び出し側で検査する形で、`guarded_via_helper` で認めた。3つ目は行末の継続で次の行へ `||` を置く形で、`guarded_by_continuation` で認めた。\n\n**保守責任者**: 人手（ユーザー）。失敗チェックとして認める形を増減する場合は本スクリプトの `GUARD_RE`・`guarded_by_continuation`・`guarded_via_helper` と本節を同時に更新する。\n\n**廃棄条件**: `mktemp` 自体をこのリポジトリの検査スクリプトが使わなくなった時。または実行環境が `mktemp` を拒まなくなった時。\n\n### check-ledger-command-placeholders.sh と generation-engine/scripts/tests/check-ledger-command-placeholders.test.sh\n\n**必要性**: 検証する側は台帳の検収コマンドをそのまま実行する。`\u003c生成物>` や `\u003c各項目の状態行>` のような雛形が残っていると、そのコマンドは実行できない。\n\n実測（2026-08-28）で、台帳の検収コマンド134件を実際に再実行したところ、雛形のまま残るものが4件あった。いずれも「完了」と記録された項目である。雛形は書いた本人には何を指すか分かるが、読む側には分からない。検証する側が再現できないコマンドは、記録として成立しない。\n\n台帳は今後も増える。書くたびに人が雛形の有無を確かめる運用では、同じ形が再び残る。\n\n入口は本体を集約へ載せるために置く。集約が走査するのは `generation-engine/scripts/` と `delivery-payload/templates/rules/checkers/` だけである。本体は `docs/scripts/` に置くため、この入口が無いと一度も実行されない。判定の中身は写して持たない。台帳は配布先へ配られないため、本体が無い場合は対象なしとして0を返す。\n\n**実装判断（走査に perl を使い、`-CSD` を付けない）**: BSD の grep はロケールによって多バイトの扱いが変わる。台帳は日本語であり、雛形の中身も日本語である。perl はロケールに左右されない。\n\nただし `perl -CSD` を付けてはならない。実測（2026-08-28）で、`-CSD` を付けると入力を二重に解釈し、`**状態**:` の行が1件も一致しなかった。走査そのものが動かないまま「該当なし」を返す形になる。これは判定不能より危ない形である（`.claude/rules/always/verification/indeterminate-result/rule.md` を参照）。自己テストへ「走査が実際に動いたか」を確かめるケースを置き、この事故を検知した。\n\n**対象外とするもの**: 引用符の内側の山括弧は探す対象であり雛形ではない。`\u003cth>要確認事項\u003c/th>` のように、grep のパターンそのものが山括弧を含む場合がある。引用符の内側を消してから判定する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 台帳へ状態行を書くたびに雛形の有無を手で確かめると、確認の省略・見落としを繰り返す\n- `check-ledger-commands-runnable.sh` への機能追加: あちらはコマンドを実際に実行して合否を見る。実行に時間がかかり、134件で15分を要した。雛形の検出は静的な走査で足り、実行を待つ必要がない\n- `check-ledger-commands-portable.sh` への機能追加: あちらは配布先で再現できるかを見る。雛形はこのリポジトリでも再現できない形であり、対象が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。雛形とみなす形を増減する場合は本スクリプトの `scan` の判定式と本節を同時に更新する。\n\n**廃棄条件**: 台帳による記録の運用自体を廃止した時、または検収コマンドを構造化データとして持ち、雛形を書けない形になった時。\n\n### check-api-only-sample.sh\n\n**必要性**: 台帳の検収コマンドは1文が100字を超えると文長の検査に掛かる。API のみの見本（`generation-engine/samples-api-only`）へ既存の検査（短縮参照・文体・顧客提示の適合・ポータル規約・相互参照）を当てるコマンドは、見本のパスと検査本体のパスを並べると100字を超える。処理をこのファイルへ移し、表からは短い検査名だけを呼ぶ（`check-boundary-value-scope.sh` と同じ理由）。\n\n**代替案を採用しなかった理由**:\n- 検収コマンドを表へ直接書く: 1文が100字を超え、台帳の文長の検査に掛かる\n- 各検査本体に見本の既定パスを持たせる: 検査本体は対象を引数で受ける汎用の契約を持ち、見本の都合で既定を変えると他の呼び出し元との契約が崩れる\n- Bash ツール直叩き: 検証する側が繰り返し実行する検収であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。検査名を増減する場合は本スクリプトの `case` と台帳の検収コマンドを同時に更新する。\n\n**廃棄条件**: API のみの見本を廃止した時、または台帳の文長の検査が逆引用符の中を数えなくなった時。\n\n### verify-api-only-pipeline.sh\n\n**必要性**: 検証する側は画面を持たず API だけを持つコードを対象にしている。台帳の検収は、この輪郭で納品物が成立することを確かめなければ意味を持たない（`docs/design/画面なしAPIのみ対象の設計.md` 6節）。`verify-no-screen-pipeline.sh` は全種別を持たない見本を対象にしており、API のみの輪郭を確かめない。生成連鎖へ `--profile api-only` を渡し出力先を毎回作り直す処理を検収コマンドへ直接書くと、1行が100字を超え台帳の文長の検査に掛かる。処理をこのファイルへ移し、表からは短い名前だけを呼ぶ。\n\n**代替案を採用しなかった理由**:\n- 検収コマンドを表へ直接書く: 1文が100字を超え、台帳の文長の検査に掛かる（`verify-no-screen-pipeline.sh` と同じ理由）\n- `verify-no-screen-pipeline.sh` へ引数で輪郭を渡す: あちらは全種別なしの見本を `--repo` で指す形であり、輪郭の指定と見本の指定という異なる2つの入口を1本に混ぜると、検収コマンドの意味が読みにくくなる\n- Bash ツール直叩き: 検証する側が繰り返し実行する検収であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。生成連鎖の `--profile` の引数契約を変える場合は本スクリプトと台帳の検収コマンドを同時に更新する。\n\n**廃棄条件**: API のみの輪郭による検収を廃止した時、または生成連鎖が輪郭を引数なしで判定できるようになった時。\n\n### verify-no-screen-pipeline.sh と check-fault-injection.sh\n\n**必要性**: 台帳の検収コマンド134件を実際に再実行したところ（2026-08-28実測）、2件が「1回しか通らない」形だった。生成連鎖を `--keep` で走らせるため、2回目は前回の残骸が邪魔をして落ちる。検証する側は同じコマンドを何度でも実行する。1回しか通らない検収は記録として成立しない。\n\n出力先を毎回作り直す処理を検収コマンドへ書くと、行が長くなり台帳の文長の検査に掛かる。処理をスクリプトへ移し、表からは短い名前だけを呼ぶ。\n\n`check-fault-injection.sh` も同じ理由で切り出した。故障を注入した自己テストは終了コード1で終わる。これは期待した動きである。終了コードだけを見ると不合格に見えるため、出力に注入した理由が現れるかを見る。この判定を1行で書くと100字を超える。\n\n**実装判断（パイプへ繋がず出力を一度受け取る）**: 自己テストの終了コード1を `pipefail` の下でパイプへ繋ぐと、その1がパイプ全体の終了コードになる。`grep` が一致しても不合格になる。実測（2026-08-28）でこれを踏んだ。出力を一時ファイルへ受け取ってから見る形にする。\n\n**代替案を採用しなかった理由**:\n- 検収コマンドを表へ直接書く: 1文が100字を超え、台帳の文長の検査に掛かる。実測で3件が掛かった\n- `--keep` を外す: 生成物を残して中身を確かめる検収であり、外すと確かめられなくなる\n- 既存 `check-layer1-declarations.sh` への機能追加: あちらは集約の宣言を見る。生成連鎖を1回走らせることとは対象が異なる\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。生成連鎖の引数または故障注入の環境変数を変える場合は、対応するスクリプトと台帳の検収コマンドを同時に更新する。\n\n**廃棄条件**: 対応する検収を台帳から外した時、または生成連鎖が残骸の有無に左右されなくなった時。\n\n### check-ledger-grep-exit-code.sh と generation-engine/scripts/tests/check-ledger-grep-exit-code.test.sh\n\n**必要性**: 台帳の検収には「該当が0件であること」を確かめるものがある。`grep` は0件のとき終了コード1を返す。その1をそのまま使うと、正しい状態を不合格として報告する。\n\n実測（2026-08-28）で、この形が6件見つかった。1-214・1-221・1-275・1-277 ほかである。いずれも中身は完了しており、検収コマンドの書き方だけが誤っていた。この誤りは「未対応が残っている」という誤った報告を生む。実際に、台帳の裏取りで不合格として何度も上がった。\n\n同じ形は今後も書かれる。書くたびに人が向きを確かめる運用では防げない。\n\n**判定の作り**: 台帳の完了行から `grep` で始まるコマンドを取り出し、実際に実行する。終了コード1で終わり、かつ反転（`!`）も後置の判定（`test $? -eq 1` 等）も持たないものを疑わしいとして報告する。\n\n実行を伴うのは、静的な走査では「0件が正しいのか、該当を期待するのか」を判定できないためである。実行して1が返り、かつ向きの手当てが無いものだけが疑わしい。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 台帳へ検収を書くたびに向きを手で確かめると、確認の省略・見落としを繰り返す。実際に6件が見落とされた\n- 静的な走査だけで判定する: `grep` が該当を期待するのか0件を期待するのかは、コマンドの字面からは判定できない。実行しないと分けられない\n- `check-ledger-commands-runnable.sh` への機能追加: あちらはコマンドの合否を見る。向きの取り違えという特定の原因を切り分ける判定とは関心が異なる。あちらは「不合格」としか言えず、原因が向きなのか中身なのかを区別しない\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**既知の限界**: `grep` 以外のコマンド（`jq -e` 等）で同じ向きの取り違えが起きても拾わない。実測時点では `grep` の形しか見つかっていないため、対象を絞った。他の形が見つかったら絞り込みを広げる。\n\n**保守責任者**: 人手（ユーザー）。向きの手当てとして認める形（`!`・`test $? -eq 1`）を増減する場合は本スクリプトの `awk` の絞り込みと本節を同時に更新する。\n\n**廃棄条件**: 台帳による記録の運用自体を廃止した時、または検収コマンドを構造化データとして持ち、期待する終了コードを宣言する形になった時。"</script>

<script>
(function () {
  var sourceElement = document.getElementById('doc-md');
  var contentElement = document.getElementById('doc-content');
  if (!sourceElement || !contentElement) return;
  var src = JSON.parse(sourceElement.textContent || '""');

  // frontmatter 除去
  src = src.replace(/^\s*---[\s\S]*?---\s*/, '');

  var lines = src.split('\n');
  var html = [];
  var inTable = false;
  var tableColCount = 0;
  var inList = false;
  var listType = '';
  var inBlockquote = false;
  var inFence = false;
  var fenceLines = [];
  var fenceLang = "";
  // 改善課題1-51: 見出し以外の本文が無く、かつ表の行が無い場合に「未記入」を示す
  var hasBodyContent = false;
  var hasTableRow = false;

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(s) {
    var value = s.replace(/[\u0000-\u001f\u007f]+/g, '').trim();
    var scheme = value.match(/^([a-z][a-z0-9+.-]*):/i);
    if (scheme && !/^(?:https?|mailto)$/i.test(scheme[1])) return '';
    return escAttr(value);
  }
  // Markdown 文書間の参照（拡張子 .md）を .html へ書き換える処理は生成側
  // （generation-engine/scripts/build-portal.sh の link_related_material_paths / existingFileHref）
  // が担う。生成物が実際に出力される参照だけを解決するには参照先の実在確認が要り、
  // ブラウザ上で動く本スクリプトはファイルの実在を確認できないため、ここでは行わない
  // （改善課題1-40）。テンプレート側は safeUrl による無害化のみを行う。
  // この処理が扱う記法: 見出し・段落・強調（太字）・強調（斜体）・インラインコード・
  // コードブロック（囲み）・リンク・画像・表・引用・番号付きリスト・箇条書き・水平線。
  // 扱わない記法: 取り消し線（~~text~~）。記号がそのまま本文へ残るのは意図した挙動であり、
  // 変換の漏れではない。Markdown 仕様の全記法への対応は範囲外とし、必要になった時点で
  // 実装を足したうえで本一覧を書き換える。screen-doc-template.html も同じ一覧に従う。
  function inlineFormat(s) {
    s = escHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(_, alt, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<img src="' + sanitizedUrl + '" alt="' + escAttr(alt) + '" style="max-width:100%">' : alt;
    });
    s = s.replace(/\[([^\]]+)\]\(([^()\s]+)\)/g, function(_, label, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<a href="' + sanitizedUrl + '">' + label + '</a>' : label;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  }

  // 表のセル分割: インラインコード（`...`）内の縦棒は列区切りとして扱わない
  function splitTableRow(line) {
    var masked = line.replace(/`[^`]*`/g, function (m) { return m.replace(/\|/g, '\u0001'); });
    masked = masked.replace(/\\\|/g, '\u0002');
    return masked.split('|')
      .filter(function (c, j, a) { return j > 0 && j < a.length - 1; })
      .map(function (c) { return c.replace(/\u0001/g, '|').replace(/\u0002/g, '|'); });
  }
  // 見出しの列数とデータ行の列数を照合し、食い違う行は最後の列へ寄せる（または不足分を空欄で補う）
  function normalizeRowCells(cells, colCount) {
    if (!colCount || cells.length === colCount) return cells;
    if (cells.length > colCount) {
      var head = cells.slice(0, colCount - 1);
      var tail = cells.slice(colCount - 1).join('|');
      return head.concat([tail]);
    }
    var padded = cells.slice();
    while (padded.length < colCount) padded.push('');
    return padded;
  }

  function closeList() {
    if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
  }
  function closeBlockquote() {
    if (inBlockquote) { html.push('</blockquote>'); inBlockquote = false; }
  }
  function closeTable() {
    if (inTable) { html.push('</tbody></table></div>'); inTable = false; tableColCount = 0; }
  }

        if (!/^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) continue;
        var rows = [], j = i + 2;
        while (j < lines.length && lines[j].charAt(0) === '|') { rows.push(splitTableRowRaw(lines[j])); j += 1; }
        found.push({ header: cells, rows: rows });
        i = j;
      }
      return found;
    }
    function csvCell(v) {
      var t = String(v == null ? '' : v).replace(/`/g, '');
      return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }
    function buildCaseCsv(table) {
      var header = table.header.concat(CSV_EXTRA_COLUMNS);
      var lines = [header.map(csvCell).join(',')];
      table.rows.forEach(function (r) {
        var cells = r.slice(0, table.header.length);
        while (cells.length < table.header.length) cells.push('');
        CSV_EXTRA_COLUMNS.forEach(function () { cells.push(''); });
        lines.push(cells.map(csvCell).join(','));
      });
      return '\uFEFF' + lines.join('\r\n') + '\r\n';
    }
    var rawMd = (function () { var el = document.getElementById('doc-md'); try { return el ? JSON.parse(el.textContent) : ''; } catch (e) { return ''; } })();
    var caseTables = rawMd ? findCaseTables(rawMd) : [];
    window.__docBuildCaseCsv = function (index) { var t = caseTables[index || 0]; return t ? buildCaseCsv(t) : null; };
    function csvFileName() {
      var title = (heroTitle.textContent || document.title || '文書').trim().replace(/[\\/:*?"<>|]/g, '_');
      return title + '_テストケース一覧.csv';
    }
    function downloadCsv(text) {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = csvFileName();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    var caseTableIndex = 0;
    Array.prototype.forEach.call(container.querySelectorAll('table'), function (table) {
      var tools = attachTableTools(table);
      var firstHead = table.querySelector('thead th');
      var sec = table.closest ? table.closest('.sec-block') : null;
      var secLabel = sec ? (sec.querySelector('.sec-label') || {}).textContent || '' : '';
      var isCaseTable = firstHead && (CSV_CASE_HEADS.indexOf(tableText(firstHead)) >= 0 || secLabel.indexOf(CSV_CASE_HEADING) >= 0);
      if (isCaseTable && caseTables.length > caseTableIndex) {
        var idx = caseTableIndex; caseTableIndex += 1;
        if (!tools) {
          tools = document.createElement('div'); tools.className = 'table-tools';
          var wrap = table.parentNode;
          var host = wrap.parentNode && wrap.parentNode.classList.contains('table-scroll-shell') ? wrap.parentNode : wrap;
          host.parentNode.insertBefore(tools, host);
        }
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'csv-export';
        btn.textContent = 'CSVを書き出す（記入欄つき）';
        btn.addEventListener('click', function () { downloadCsv(buildCaseCsv(caseTables[idx])); });
        tools.appendChild(btn);
      }
    });

    var firstLink = tocList.querySelector('.toc-link');
    if (firstLink) firstLink.classList.add('active');
  })();
})();
</script>

<script>
(function(){
  var links = document.querySelectorAll('.toc-link');
  var sections = document.querySelectorAll('.sec-block');
  var mainEl = document.getElementById('main-scroll');

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function fragmentToId(fragment) {
    var raw = fragment && fragment.charAt(0) === '#' ? fragment.substring(1) : (fragment || '');
    if (!raw) return '';
    try {
      return decodeURIComponent(raw);
    } catch (error) {
      return '';
    }
  }

  function scrollToFragment(fragment, behavior) {
    var targetId = fragmentToId(fragment);
    var target = targetId ? document.getElementById(targetId) : null;
    if (!target) return false;
    if (window.__docOpenFoldsFor) window.__docOpenFoldsFor(targetId);
    target.scrollIntoView({behavior: behavior, block:'start'});
    return true;
  }

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(l){l.classList.remove('active')});
        var a = Array.prototype.find.call(links, function (link) {
          return link.getAttribute('href') === '#' + e.target.id;
        });
        if(a) a.classList.add('active');
      }
    });
  },{root: mainEl, rootMargin:'-10% 0px -80% 0px'});
  sections.forEach(function(s){observer.observe(s)});

  links.forEach(function(l){
    l.addEventListener('click',function(e){
      e.preventDefault();
      var href = this.getAttribute('href');
      if(scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
        if (window.history && window.history.pushState) window.history.pushState(null, '', href);
        else window.location.hash = fragmentToId(href);
      }
    });
  });

  if (window.location.hash) {
    requestAnimationFrame(function(){
      scrollToFragment(window.location.hash, 'auto');
    });
  }

  if (typeof document.addEventListener === 'function') document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a.ref-link') : null;
    if (!a) return;
    e.preventDefault();
    var href = a.getAttribute('href');
    if (scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
      if (window.history && window.history.pushState) window.history.pushState(null, '', href);
      else window.location.hash = fragmentToId(href);
    }
  });

  window.addEventListener('popstate', function(){
    requestAnimationFrame(function(){
      if (!scrollToFragment(window.location.hash, 'auto') && mainEl) {
        mainEl.scrollTo({top: 0, behavior: 'auto'});
      }
    });
  });
})();
</script>
<script>
// 図の記法（mermaid）の囲みを図として描く（改善課題1-285）。描画の道具は外部から読み込み、
// 読み込めない・描けない場合は囲みの文字をそのまま表示して文書全体を壊さない。
(function () {
  function renderDiagrams() {
    var blocks = document.querySelectorAll('div.diagram-block[data-diagram="mermaid"]');
    if (!blocks.length) return;
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    script.onload = function () {
      try {
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
        Array.prototype.forEach.call(blocks, function (block, index) {
          var src = block.querySelector('pre.mermaid-src');
          if (!src) return;
          var code = src.textContent || '';
          window.mermaid.render('diagram-' + (index + 1), code).then(function (result) {
            var holder = document.createElement('div');
            holder.className = 'diagram-rendered';
            holder.innerHTML = result.svg;
            block.insertBefore(holder, src);
            src.setAttribute('hidden', 'hidden');
            block.setAttribute('data-diagram-state', 'rendered');
          }).catch(function () { block.setAttribute('data-diagram-state', 'text'); });
        });
      } catch (error) {
        Array.prototype.forEach.call(blocks, function (block) { block.setAttribute('data-diagram-state', 'text'); });
      }
    };
    script.onerror = function () {
      Array.prototype.forEach.call(blocks, function (block) { block.setAttribute('data-diagram-state', 'text'); });
    };
    document.head.appendChild(script);
  }
  if (typeof document.addEventListener === 'function') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderDiagrams);
    else renderDiagrams();
  }
})();
</script>
