<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポータル HTML 規約</title>
<style>
/* 設計ポータルのデザイントークン。
   本ファイルの全文が、ビルド時に各テンプレートのトークン注入マーカーへ差し込まれる。
   既定はダークテーマ。ライトは OS 設定または data-theme="light" で切り替える。
   色は 26 種の基本トークンだけをテーマ別に定義し、
   既存の別名トークンは var() 参照でテーマへ自動追従させる。 */

:root {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-synthesis: none;

  /* 基本色（ダーク） */
  --bg: #0F1217;
  --panel: #161C23;
  --panel2: #1C232E;
  --panel3: #141A23;
  --line: #2B3443;
  --line2: #3A4658;
  --text: #E7ECF4;
  --sub: #A8B3C3;
  --muted: #8A96A7;
  --faint: #798496;
  --accent: #4CC2FE;
  --accent-hi: #9ADCFF;
  --accent-soft: rgba(76,194,255,0.17);
  /* 濃色ヘッダのハイライト。背景色を差し替えず元の背景へ重ねるため、明暗どちらの配色でも文字との明度差を保つ */
  --head-hl: rgba(255,255,255,0.16);
  --stamp: #FF6E4F;
  --stamp-soft: rgba(255,110,78,0.16);
  --green: #4ADE81;
  --green-soft: rgba(74,222,129,0.16);
  --grid: rgba(255,255,255,0.036);
  --head: #202B3B;
  --headtext: #E7ECF4;
  --code: #0B0E13;
  --codetext: #C9E8FF;
  --navon: #EAF6FF;
  --chipontext: #0F1217;
  --rowopen: #1A212B;
  --neutral-soft: rgba(255,255,255,0.06);

  /* 別名。既存テンプレートの参照を壊さないために残す。値は基本色を参照するのでテーマに自動追従する */
  --panel-2: var(--panel2);
  --border: var(--line);
  --border-strong: var(--line2);
  --text-sub: var(--sub);
  --text-muted: var(--muted);
  --accent-2: var(--accent-hi);
  --accent-border: var(--accent);
  --gold: var(--stamp);
  --gold-soft: var(--stamp-soft);
  --gold-border: var(--stamp);
  --warn: var(--stamp);
  --danger: var(--stamp);
  --danger-soft: var(--stamp-soft);
  --success: var(--green);
  --success-soft: var(--green-soft);
  --highlight: var(--accent);
  --highlight-soft: var(--accent-soft);
  --highlight-border: var(--accent);
  --nav-tag: var(--faint);
  --nav-tag-soft: var(--neutral-soft);
  --self-tag: var(--green);
  --self-tag-soft: var(--green-soft);
  --code-bg: var(--code);
  --code-fg: var(--codetext);
  --cat-list: var(--accent);
  --cat-standards: var(--accent);
  --cat-design: var(--accent);
  --cat-project: var(--accent);

  /* 非色トークン。テーマで変えない */
  --font-body: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  --mono: "SFMono-Regular","Menlo","Cascadia Code","Consolas",monospace;
  --radius: 0;
  --radius-sm: 0;
  --shadow-sm: 3px 3px 0 var(--accent-soft);
  --shadow-md: 4px 4px 0 var(--accent-soft);
  --sidebar-w: 248px;
  --page-gutter: 40px;
  --grid-size: 24px;
}

/* OS がライト設定で、かつダークを明示指定していない場合 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F4F8;
    --panel: #FFFFFF;
    --panel2: #E9EEF4;
    --panel3: #F7F9FC;
    --line: #D8DFE8;
    --line2: #243040;
    --text: #1A222E;
    --sub: #4B5A70;
    --muted: #58657A;
    --faint: #627387;
    --accent: #0272AC;
    --accent-hi: #075985;
    --accent-soft: rgba(2,132,199,0.10);
    --stamp: #BF3C22;
    --stamp-soft: rgba(217,72,43,0.12);
    --green: #137538;
    --green-soft: rgba(21,128,61,0.16);
    --grid: rgba(16,34,64,0.05);
    --head: #243040;
    --headtext: #F1F4F8;
    --code: #101722;
    --codetext: #C9E8FF;
    --navon: #102A43;
    --chipontext: #FFFFFF;
    --rowopen: #F0F4F9;
    --neutral-soft: rgba(16,34,64,0.06);
  }
}

/* ユーザーがライトを明示指定した場合 */
[data-theme="light"] {
  --bg: #F1F4F8;
  --panel: #FFFFFF;
  --panel2: #E9EEF4;
  --panel3: #F7F9FC;
  --line: #D8DFE8;
  --line2: #243040;
  --text: #1A222E;
  --sub: #4B5A70;
  --muted: #58657A;
  --faint: #627387;
  --accent: #0272AC;
  --accent-hi: #075985;
  --accent-soft: rgba(2,132,199,0.10);
  --stamp: #BF3C22;
  --stamp-soft: rgba(217,72,43,0.12);
  --green: #137538;
  --green-soft: rgba(21,128,61,0.16);
  --grid: rgba(16,34,64,0.05);
  --head: #243040;
  --headtext: #F1F4F8;
  --code: #101722;
  --codetext: #C9E8FF;
  --navon: #102A43;
  --chipontext: #FFFFFF;
  --rowopen: #F0F4F9;
  --neutral-soft: rgba(16,34,64,0.06);
}

/* ユーザーがダークを明示指定した場合。OS がライトでも :root の既定値へ戻す */
[data-theme="dark"] {
  --bg: #0F1217;
  --panel: #161C23;
  --panel2: #1C232E;
  --panel3: #141A23;
  --line: #2B3443;
  --line2: #3A4658;
  --text: #E7ECF4;
  --sub: #A8B3C3;
  --muted: #8A96A7;
  --faint: #798496;
  --accent: #4CC2FE;
  --accent-hi: #9ADCFF;
  --accent-soft: rgba(76,194,255,0.17);
  --stamp: #FF6E4F;
  --stamp-soft: rgba(255,110,78,0.16);
  --green: #4ADE81;
  --green-soft: rgba(74,222,129,0.16);
  --grid: rgba(255,255,255,0.036);
  --head: #202B3B;
  --headtext: #E7ECF4;
  --code: #0B0E13;
  --codetext: #C9E8FF;
  --navon: #EAF6FF;
  --chipontext: #0F1217;
  --rowopen: #1A212B;
  --neutral-soft: rgba(255,255,255,0.06);
}
/* 設計ポータルの共通シェル。サイドバー・メインペイン・フッター・方眼紙背景・ページヘッダの
   共通クラスを定義する。色と寸法は tokens.css のトークンだけを参照し、実値を直書きしない。
   本ファイルの全文は、ビルド時に各テンプレートのシェル注入マーカーへ差し込まれる。 */

.pt {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.7;
}
.pt *, .pt *::before, .pt *::after { box-sizing: border-box; }
.pt a { color: var(--accent); text-decoration: none; }
.pt a:hover { color: var(--accent-hi); text-decoration: underline; }
.pt ::selection { background: var(--accent-soft); }
.pt :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.pt-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
}

.pt-row {
  position: relative;
  z-index: 1;
  display: flex;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

/* サイドバー */
.pt-sidebar {
  width: var(--sidebar-w);
  flex: none;
  border-right: 1.5px solid var(--line2);
  background: var(--panel3);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.pt-brand { padding: 20px 20px 16px; border-bottom: 1.5px solid var(--line2); }
.pt-brand-stamp { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--stamp); font-weight: 600; }
.pt-brand-name { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px; line-height: 1.35; }
.pt-brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 5px; }

/* サイト切替（モノレポ複数サイト時のみ JS が pt-brand-name を差し替える） */
.pt-brand-switch { position: relative; }
.pt-brand-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 4px;
  border: 0;
  background: transparent;
  padding: 0;
  appearance: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1.35;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.pt-brand-toggle:hover { color: var(--accent); }
.pt-brand-caret {
  flex: none;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--text-muted);
  transition: transform 0.12s;
}
.pt-brand-toggle[aria-expanded="true"] .pt-brand-caret { transform: rotate(180deg); }
.pt-brand-list {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin-top: 8px;
  border: 1.5px solid var(--border);
  background: var(--panel-2);
  z-index: 2;
}
.pt-brand-list-item {
  display: block;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-sub);
}
a.pt-brand-list-item:hover { background: var(--panel3); color: var(--text); text-decoration: none; }
.pt-brand-list-item.is-current { color: var(--text-muted); font-weight: 600; cursor: default; }

.pt-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.pt-nav-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-nav-item:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-nav-item.is-active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-nav-num { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.pt-nav-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* 現在地のナビ項目に限り、番号と件数の文字色をコントラスト基準（4.5:1）を満たす値へ個別に上げる（改善課題1-49）。
   --muted/--faint 本体は変更しない（他の使用箇所へ影響するため）。tokens.css と同じ4ブロック切り替えに揃える。 */
:root {
  --nav-current-num: #919DAE;
  --nav-current-count: #929DAF;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --nav-current-num: #5E6B7E;
    --nav-current-count: #5B6C80;
  }
}
[data-theme="light"] {
  --nav-current-num: #5E6B7E;
  --nav-current-count: #5B6C80;
}
[data-theme="dark"] {
  --nav-current-num: #919DAE;
  --nav-current-count: #929DAF;
}
.pt-nav-item.is-active .pt-nav-num { color: var(--nav-current-num); }
.pt-nav-item.is-active .pt-nav-count { color: var(--nav-current-count); }

/* 文書ビューア型ページの章目次ブロック（旧 .dp-toc を共通サイドバーへ統合） */
.pt-doc-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; border-top: 1.5px solid var(--line2); }
.pt-doc-nav__group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-doc-nav .nav-item,
.pt-doc-nav .back-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-doc-nav .nav-item:hover,
.pt-doc-nav .back-link:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-doc-nav .nav-item.active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-doc-nav__toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.pt-doc-nav__toc a {
  display: block;
  padding: 6px 10px 6px 20px;
  font-size: 11px;
  color: var(--sub);
  border-left: 3px solid transparent;
  transition: all 0.12s;
}
.pt-doc-nav__toc a:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-doc-nav__toc a.active { color: var(--navon); border-left-color: var(--accent); font-weight: 600; }

.pt-theme {
  margin: auto 12px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: calc(100% - 24px);
  border: 1px solid var(--line2);
  background: transparent;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-theme:hover { border-color: var(--accent); color: var(--accent); }
.pt-theme-next { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.pt-sidebar-meta { padding: 14px 20px; font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.9; }

/* サイドバー開閉ボタン（狭幅時のみ表示。広幅では常に非表示） */
.pt-sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 30;
  width: 40px;
  height: 40px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1.5px solid var(--line2);
  background: var(--panel3);
  padding: 0;
  cursor: pointer;
}
.pt-sidebar-toggle span { display: block; width: 20px; height: 2px; background: var(--text); }

/* サイドバー開放中に背後を覆うオーバーレイ */
.pt-sidebar-scrim {
  position: fixed;
  inset: 0;
  z-index: 15;
  background: rgba(0, 0, 0, 0.5);
}
.pt-sidebar-scrim[hidden] { display: none; }

@media (max-width: 900px) {
  :root { --page-gutter: 16px; }
  .pt-sidebar-toggle { display: flex; }
  .pt-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 20;
    width: var(--sidebar-w);
    max-width: 82vw;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }
  .pt-sidebar.is-open { transform: translateX(0); }
  .pt-main { padding-top: 64px; }
}

/* メインペイン */
.pt-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 0 var(--page-gutter) 72px;
}
.pt-main.is-fixed { overflow-y: hidden; display: flex; flex-direction: column; padding-bottom: 24px; }

/* ページヘッダ */
.pt-head { flex: none; padding: 32px 0 16px; border-bottom: 2px solid var(--line2); }
.pt-crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pt-crumb-current { color: var(--text); }
.pt-title-row { display: flex; align-items: baseline; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.pt-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
.pt-title-sub { font-size: 12px; color: var(--muted); }

/* 汎用パーツ */
.pt-panel { background: var(--panel); border: 1.5px solid var(--line2); }
.pt-input {
  border: 1.5px solid var(--line2);
  background: var(--panel);
  padding: 8px 13px;
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: all 0.12s;
}
.pt-input:focus { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent-soft); }
.pt-seg { display: flex; border: 1px solid var(--line2); }
.pt-seg button {
  border: 0;
  border-right: 1px solid var(--line);
  padding: 7px 16px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  background: var(--panel);
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-seg button:last-child { border-right: 0; }
.pt-seg button.is-active { background: var(--accent); color: var(--chipontext); }
.pt-chip { font-size: 11px; border: 1px solid var(--line); background: var(--panel3); padding: 2px 8px; font-family: var(--mono); }
.pt-badge { font-size: 10.5px; font-weight: 600; padding: 2px 9px; }
.pt-badge.is-done { color: var(--accent); background: var(--accent-soft); }
.pt-badge.is-stale { color: var(--stamp); background: var(--stamp-soft); }
.pt-badge.is-todo { color: var(--muted); background: var(--neutral-soft); }
.pt-count { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Google Fonts障害時も3段階アイコンを保つ、公式サブセットのローカルフォールバック */
@font-face {
  font-family: "Material Symbols Outlined Local";
  font-style: normal;
  font-weight: 400;
  font-display: block;

/* 重要度コールアウト。見出しを先頭要素に置き、色帯とMaterial Symbolsを併用する */
.pt-callout {
  --callout-color: var(--accent);
  --callout-soft: var(--accent-soft);
  position: relative;
  background: var(--callout-soft);
  color: var(--text);
  box-shadow: inset 5px 0 0 var(--callout-color);
}
.pt-callout__icon {
  display: none;
  margin-right: 0.55em;
  color: var(--callout-color);
  font-family: "Material Symbols Outlined", "Material Symbols Outlined Local";
  font-size: 1.45em;
  font-style: normal;
  font-weight: 400;
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  line-height: 1;
  vertical-align: -0.12em;
}
.pt-callout > :first-child > .pt-callout__icon { display: inline-block; }
.pt-callout--caution {
  --callout-color: var(--accent);
  --callout-soft: var(--accent-soft);
}
.pt-callout--warning {
  --callout-color: var(--stamp);
  --callout-soft: var(--stamp-soft);
}
.pt-callout--important {
  --callout-color: var(--green);
  --callout-soft: var(--green-soft);
}

/* 表 */
/* 横スクロール可能な表であることを示す端フェード（JS不要のCSSのみの手掛かり）。
   background-attachment の local/scroll の組合せで、覆いレイヤー(local)はスクロール量に
   応じて中身と一緒に動き、影レイヤー(scroll)は要素の表示領域に固定されたまま覆いの下に隠れる。
   これにより端まで到達すると自動的に影が消え、途中では両端に影が現れる。 */
.pt-tablewrap {
  flex: 0 1 auto; min-height: 0; overflow: auto; border: 1.5px solid var(--line2);
  background-color: var(--panel);
  background-image:
    linear-gradient(to right, var(--panel) 40%, transparent),
    linear-gradient(to left, var(--panel) 40%, transparent),
    linear-gradient(to right, color-mix(in srgb, var(--text) 22%, transparent), transparent),
    linear-gradient(to left, color-mix(in srgb, var(--text) 22%, transparent), transparent);
  background-repeat: no-repeat;
  background-size: 30px 100%, 30px 100%, 14px 100%, 14px 100%;
  background-position: left, right, left, right;
  background-attachment: local, local, scroll, scroll;
}
/* 固定列を持つ表専用の横スクロール手掛かり。
   固定列（position:sticky）は不透明な背景を持つため、影を表そのものの background として
   置くと固定列の下に隠れてしまう（背景は常に子要素より奥の層に描画されるため、子要素の
   z-index をどれだけ上げても背景の上に出てくることはない）。
   代わりに表を包む専用のラッパーを置き、その ::before/::after を固定列より高い z-index で
   重ねることで、固定列の陰にならない位置に手掛かりを出す。表示のON/OFFはスクロール量に応じて
   共通ホスト（partials/shell-sidebar.html）の JS が can-scroll-left / can-scroll-right を切り替える。 */
.pt-scroll-shell { position: relative; min-width: 0; }
.pt-scroll-shell::before,
.pt-scroll-shell::after {
  content: ""; position: absolute; z-index: 20; top: 0; bottom: 0; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.pt-scroll-shell::before {
  left: 0; background: linear-gradient(to right, color-mix(in srgb, var(--text) 22%, transparent), transparent);
}
.pt-scroll-shell::after {
  right: 0; background: linear-gradient(to left, color-mix(in srgb, var(--text) 22%, transparent), transparent);
}
.pt-scroll-shell.can-scroll-left::before,
.pt-scroll-shell.can-scroll-right::after { opacity: 1; }

.pt-tablewrap table { width: 100%; border-collapse: separate; border-spacing: 0; }
.pt-tablewrap thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--head);
  color: var(--headtext);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-align: left;
  padding: 9px 14px;
}
.pt-tablewrap tbody td { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; }
.pt-tablewrap tbody tr:hover td { background: var(--panel3); }
.pt-tablewrap tbody tr.is-open td { background: var(--rowopen); }
.pt-mono { font-family: var(--mono); font-size: 11.5px; color: var(--sub); }

/* フッター */
.pt-footer {
  position: relative;
  z-index: 1;
  flex: none;
  border-top: 1.5px solid var(--line2);
  background: var(--panel3);
  padding: 12px var(--page-gutter);
  display: flex;
  gap: 20px;
  align-items: baseline;
  flex-wrap: wrap;
}
.pt-footer-stamp { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; color: var(--stamp); font-weight: 600; }
.pt-footer-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.pt-footer-gen { margin-left: auto; font-size: 10.5px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .pt *, .pt *::before, .pt *::after { transition: none !important; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

:root { --section-gap: clamp(28px, 4vw, 44px); }

/* 文書 2 カラム（目次 + 本文。目次は共通サイドバーへ統合済み） */
.dp-layout { display: block; margin-top: 28px; }

.toc-link {
  display: block; padding: 6px 10px; margin-left: -1.5px;
  border-left: 3px solid transparent;
  color: var(--sub); font-size: 12.5px; font-weight: 450; line-height: 1.4;
  transition: color .12s, border-color .12s;
}
.toc-link:hover { color: var(--text); border-left-color: var(--accent); text-decoration: none; }
.toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.dp-panel {
  width: 100%; min-width: 0; max-width: min(2200px, 96vw);
  border: 1.5px solid var(--line2); background: var(--panel);
  padding: 32px 40px; counter-reset: sec-num;
}

/* section */
.sec-block { margin-bottom: var(--section-gap); scroll-margin-top: 24px; }
.sec-label {
  counter-increment: sec-num;
  display: flex; align-items: baseline; gap: 10px;
  font-size: 16.5px; font-weight: 700; color: var(--text);
  margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.sec-label::before {
  content: counter(sec-num, decimal-leading-zero);
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--stamp);
}

/* 改善課題1-244: 階層目次・折りたたみ・絞り込み・表からのページ内リンク */
.toc-sub { list-style: none; margin: 0; padding: 0 0 0 12px; }
.toc-link.toc-l3 { font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
.toc-link.toc-l4 { font-size: 11.5px; padding-top: 3px; padding-bottom: 3px; padding-left: 20px; color: var(--sub); }
.toc-li.is-filtered { display: none; }
#doc-content h3, #doc-content h4 { scroll-margin-top: 4px; }
.doc-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; padding: 10px 12px; border: 1.5px solid var(--line2); background: var(--panel2); }
.doc-tools label { font-size: 12.5px; color: var(--sub); }
.doc-tools input[type="search"] { flex: 1 1 220px; min-width: 160px; padding: 6px 8px; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; }
.doc-tools button { padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; cursor: pointer; }
.doc-tools button:hover { border-color: var(--accent); }
.doc-tools .doc-filter-count { font-family: var(--mono); font-size: 12px; color: var(--stamp); }
.fold-details { margin: 10px 0; border: 1px solid var(--line2); background: var(--panel); }
.fold-details > summary { list-style: none; cursor: pointer; padding: 8px 10px 8px 26px; position: relative; }
.fold-details > summary::-webkit-details-marker { display: none; }
.fold-details > summary::before { content: "\25b8"; position: absolute; left: 10px; top: 9px; color: var(--accent); transition: transform .12s; }
.fold-details[open] > summary::before { transform: rotate(90deg); }
.fold-details > summary > h3, .fold-details > summary > h4 { display: inline; margin: 0; }
.fold-details > .fold-body { padding: 0 12px 10px; }
.fold-details.is-filtered { display: none; }
.fold-count { font-family: var(--mono); font-size: 11px; color: var(--stamp); margin-left: 8px; }
#doc-content a.ref-link { color: var(--accent); border-bottom: 1px dotted var(--accent); }
@media print { .doc-tools { display: none; } }

/* 改善課題1-273・1-295: 行数の多い表の並べ替え・絞り込み、テストケース一覧の CSV 書き出し */
.table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 12.5px; color: var(--sub); }
.table-tools input[type="search"] { flex: 1 1 200px; min-width: 140px; padding: 4px 8px; font-size: 12.5px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; }
.table-tools button { padding: 4px 10px; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; cursor: pointer; }
.table-tools button:hover { border-color: var(--accent); }
.table-tools .table-filter-count { font-family: var(--mono); font-size: 11.5px; color: var(--stamp); }
#doc-content table.sortable-table th { cursor: pointer; user-select: none; }
#doc-content table.sortable-table th[aria-sort="ascending"]::after { content: " \25b4"; color: var(--accent); }
#doc-content table.sortable-table th[aria-sort="descending"]::after { content: " \25be"; color: var(--accent); }
#doc-content tr.is-filtered { display: none; }
@media print { .table-tools { display: none; } }

/* baseline prose（セクション固有クラスの対象外になる見出し・段落・引用・区切り線） */
#doc-content h3 { font-size: 1.05rem; margin: 20px 0 8px; color: var(--text); }
#doc-content h4 { font-size: 0.95rem; margin: 16px 0 6px; color: var(--sub); }
#doc-content p { margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol { padding-left: 22px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol li { margin: 4px 0; }
#doc-content ul { list-style: none; padding-left: 20px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ul li { position: relative; margin: 4px 0; }
#doc-content ul li::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
#doc-content code {
  background: var(--panel3); color: var(--text); padding: 1px 6px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 0.85em;
}
#doc-content blockquote {
  border-left: 3px solid var(--accent); margin: 12px 0; padding: 8px 16px;
  background: var(--panel3); color: var(--sub); font-size: 0.95rem;
}
#doc-content hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

/* rule items（トップレベル ul のチェックリスト装飾。箇条書きと同じ体裁） */
.rule-list { list-style: none; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; }
.rule-item { position: relative; font-size: 13.5px; line-height: 1.75; color: var(--sub); }
.rule-item::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
.rule-item code {
  background: var(--panel); color: var(--text); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: .85em;
}

/* tables */
.table-scroll-shell { position: relative; min-width: 0; margin-bottom: 14px; }
.table-scroll-shell::before,
.table-scroll-shell::after {
  content: ""; position: absolute; z-index: 2; top: 1.5px; bottom: 1.5px; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.table-scroll-shell::before {
  left: 1.5px; background: linear-gradient(to right, var(--panel), transparent);
}
.table-scroll-shell::after {
  right: 1.5px; background: linear-gradient(to left, var(--panel), transparent);
}
.table-scroll-shell.can-scroll-left::before,
.table-scroll-shell.can-scroll-right::after { opacity: .94; }
.table-wrap {
  width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
  border: 1.5px solid var(--line2); scrollbar-gutter: stable;
}
table.data-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
table.data-table thead { position: sticky; top: 0; z-index: 1; }
table.data-table th {
  text-align: left; font-size: 11.5px; font-weight: 700; color: var(--headtext);
  background: var(--head); padding: 8px 12px; border-bottom: 1px solid var(--line2); white-space: nowrap;
}
table.data-table td {
  min-width: 11rem; max-width: 34rem; padding: 9px 12px;
  border-bottom: 1px solid var(--line); vertical-align: top;
  overflow-wrap: normal; word-break: normal; hyphens: none;
}
table.data-table td:first-child { min-width: 7rem; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table code {
  background: var(--panel3); color: var(--accent); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
}

/* code blocks（手動で span を書いた場合にのみ配色が効く。MD パーサーは自動適用しない） */
.code-block { width: 100%; border: 1px solid var(--line2); overflow: hidden; background: var(--code); margin-bottom: 14px; }
.diagram-block { margin: 12px 0; }
.diagram-block pre.mermaid-src { font-family: var(--mono); font-size: 12px; white-space: pre; overflow: auto; }
.diagram-block .diagram-rendered svg { max-width: 100%; height: auto; }
.code-block-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 11px; font-weight: 600;
  color: var(--muted); border-bottom: 1px solid var(--line2);
  letter-spacing: .03em;
}
.code-block pre {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--codetext);
}
#doc-content .code-block code {
  display: block; padding: 0; border: 0; background: transparent;
  color: inherit; font: inherit; white-space: pre;
}
.code-block .kw { color: #CBA6F7; }
.code-block .fn { color: #89B4FA; }
.code-block .str { color: #A6E3A1; }
.code-block .num { color: #FAB387; }
.code-block .cm { color: #6C7086; font-style: italic; }
.code-block .op { color: #89DCEB; }
.code-block .type { color: #F9E2AF; }

@media (max-width: 820px) {
  .dp-layout { margin-top: 20px; }
  .dp-panel { max-width: none; padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .toc-link, .table-scroll-shell::before, .table-scroll-shell::after, .fold-details > summary::before { transition: none; }
}

<div class="pt">

(function () {
  /* .pt-scroll-shell（固定列を持つ表の横スクロール手掛かり）のON/OFF切替。

     固定列に隠れないよう表の外側に置いた ::before/::after の表示・非表示を、
     内側の実スクロール要素（.table-wrap または .pt-tablewrap）のスクロール量から判定する。

     data-scroll-cues="auto" を持つホスト配下の .table-wrap / .pt-tablewrap のうち、
     まだ .pt-scroll-shell に包まれていないものは、実行時に .pt-scroll-shell で動的に包む。

     同期スクリプト（ページャ組み立て・任意列追加）は DOMContentLoaded 発火前に完了して
     いるため、包む時点では最終的な DOM 構造になっている。 */
  function wrapAutoHosts() {
    var hosts = Array.prototype.slice.call(document.querySelectorAll('[data-scroll-cues="auto"]'));

      var wraps = Array.prototype.slice.call(host.querySelectorAll('.table-wrap, .pt-tablewrap'));
      wraps.forEach(function (wrap) {
        if (wrap.closest('.pt-scroll-shell')) return;
        var shell = document.createElement('div');
        shell.className = 'pt-scroll-shell';
        wrap.parentNode.insertBefore(shell, wrap);
        shell.appendChild(wrap);
      });
    });
  }
  function initScrollCues() {
    wrapAutoHosts();
    var shells = Array.prototype.slice.call(document.querySelectorAll('.pt-scroll-shell'));
    if (!shells.length) return;
    var updaters = [];
    shells.forEach(function (shell) {
      var wrap = shell.querySelector(':scope > .table-wrap, :scope > .pt-tablewrap');
      if (!wrap) return;

        var overflowing = wrap.scrollWidth > wrap.clientWidth + 1;
        var atStart = wrap.scrollLeft <= 1;
        var atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1;

<script type="application/json" id="doc-md">"\n# ポータル HTML 規約（PORTAL-PAGE-CONVENTIONS）\n\nリバース設計ポータルの生成 HTML に適用する合格基準。テンプレートから生成された全ページが統一されたデザインシステムと構造規約に準拠していることを検証する。portal-reviewer が本ファイルを Read して照合する。\n\n## 適用対象\n\n`delivery-payload/templates/` 配下のテンプレートから生成された HTML ファイル、および `generation-engine/samples/` 配下のサンプル HTML。ポータルトップも共通シェルを使うため、他のページと同じ観点で検査する。\n\n文書ビューア型も共通シェルを使うため、他のページと同じ観点で検査する。文書の本文は共通シェルのメインペイン内でスクロールする。\n\n`generation-engine/samples/規約提案/` と `delivery-payload/templates/rule-proposal/` 配下は適用対象から外す。規約提案 HTML（サンプルとその生成元テンプレート）はポータルのページではなく、リポジトリ外へ出力して現場のエンジニアが判定するための独立した成果物である。ポータル共通シェルを使わず、意匠は `delivery-payload/references/規約定義と派生生成の設計.md` が参照する別の定義に従う。同じ検査を当てると、意匠の違いをすべて不合格として数えることになる。\n\nスキルガイド HTML（`.claude/skills/*/references/guide.html`）も適用対象から外す。スキルの使い方を読む人へ向けた説明書であり、成果物のポータルとは読み手も用途も異なる。共通シェルを使わず独自の意匠を持つため、同じ検査を当てるとスキルを 1 本増やすたびに不合格が増え、件数を合否の判定に使えなくなる。ガイド HTML の体裁はスキルガイド HTML 統一規約が担当する。\n\n`delivery-payload/templates/partials/` 配下も適用対象から外す。ページへ埋め込む断片であり、単体では明暗の色定義も全画面レイアウトも持ちえない。完成したページに求める基準を断片へ当てることになる。\n\n規約の派生 HTML（`docs/rules/*/*/rule.html`）も適用対象から外す。規約の本文を読みやすく表示するための派生物であり、成果物のポータルとは読み手も用途も異なる。共通シェルを使わず独自の意匠を持つため、同じ検査を当てると規約を 1 件増やすたびに不合格が増え、件数を合否の判定に使えなくなる。\n\n次の4資料も適用対象から外す。\n\n- `docs/guides/reverse-docs-overview.html`\n- `docs/design/portal/ポータル設計基盤.html`\n- `docs/guides/納品物ガイド.html`\n- `docs/guides/成果物一覧.html`\n\nいずれもこのリポジトリ自身の説明資料であり、生成されるポータルのページではない。\n除外はディレクトリではなくファイル名で指定する。\n対象リポジトリでは `docs/` 配下にポータルのページが置かれることがある。\nディレクトリごと外すと検査すべきページまで落ちるためである。\n\n同じ理由で、次の4資料も適用対象から外す（2026-08-19に3件を追加し、2026-08-24に週次レポートを追加）。\n\n- `docs/guides/スキル一覧.html`\n- `docs/guides/スキルの変遷.html`\n- `docs/guides/週次レポート-*.html`\n- `docs/portal/index.html`\n\nはじめの2件は、このリポジトリのスキルを説明する資料である。生成されるポータルのページではない。週次レポートは、その週の成果を人へ伝える読み物であり、同じくポータルのページではない。名前に週を含むため、1週ごとに増える。個別に列挙せず、名前の形（`週次レポート-*.html`）で外す。`docs/portal/index.html` は、このリポジトリ自身の入口である。既存の生成器では作れないため、専用ページとして新設した。他のスクリプトから決定的に生成されない。詳細は、本ファイルの `check-self-portal-links.sh` の設計判断を参照する。\n\nこれらの資料は、規約本文に除外を書かないまま検査対象になっていた。そのため、実行のたびに不合格となっていた。実測（2026-08-19）では、19件の不合格がすべてはじめの3資料から出ていた。**残る1,253件は合格している。生成されるポータルのページに不備は無い。** 週次レポートも同じ経路で不合格を出した（実測 2026-08-24: 7件）。\n\n以上の除外を入れた結果、本規約の検査は不合格 0 件を合格の基準として使える。ただし `generation-engine/scripts/tests/test-portal-conventions.sh` の除外リスト（`-not -path` の一覧）はディレクトリ走査モードのみに効く実装であり、ファイル単体を指定して実行した場合はこの除外を経由しない。`docs/guides/納品物ガイド.html` を単体指定で検査すると FAIL するが、これは検査対象外という本節の判断のとおりであり、ページとしての不合格ではない。\n\n対象アプリのリポジトリで検証する場合、`test-portal-conventions.sh \u003cディレクトリ>` は配下の `*.html` を無差別に再帰走査するため、このツール群が生成した HTML と対象アプリが元から持つ無関係な HTML（このツール群と無関係な既存ドキュメント等）が混ざる（改善課題キー: ポータル規約検査-対象範囲）。生成物だけを対象にするには `test-portal-conventions.sh --file-list \u003cファイル一覧のパス>`（1 行 1 パスの改行区切りテキスト）を使う。一覧は `check-derived-drift.sh` が保守する `derived-fingerprints.json` のキーから組み立てることを想定する。既定のディレクトリ・単一ファイル指定の挙動は変更しない。\n\n## カラーシステム\n\n| 観点キー | 検査内容 |\n|---|---|\n| 色トークン-旧値禁止 | 刷新前のトークン値がファイル内に存在しないこと。ライト系は `#F6F8FA`・`#D1D9E0`・`#AFB8C1`・`#0969DA`・`#218BFF`・`#DDF4FF`・`#54AEFF`・`#BC4C00`・`#FFF1E5`・`#1A7F37`・`#DAFBE1`・`#CF222E`、ダーク系は `#15171C`・`#1C1F26`・`#21262D`・`#30363D`・`#484F58`・`#E8E5DC`・`#B6B3AB`・`#888784`・`#58A6FF`・`#79C0FF`・`#132D4B`・`#1F6FEB` |\n| 色トークン-新値存在 | `#0F1217`（ダークの背景）・`#4CC2FE`（ダークのアクセント）・`#FF6E4F`（差し色）が CSS 変数定義に存在すること |\n| テーマ-定義 | `prefers-color-scheme` のメディアクエリと、`data-theme=\"dark\"`・`data-theme=\"light\"` の両方の属性セレクタが存在すること |\n\n## 全画面フィットレイアウト\n\n| 観点キー | 検査内容 |\n|---|---|\n| 全画面-高さ固定 | ページコンテナに `height: 100vh` が指定されていること。`min-height: 100vh` は違反 |\n| 全画面-overflow制御 | ページコンテナに `overflow: hidden` が指定されていること |\n| 全画面-スクロール領域 | メインコンテンツ領域（`.table-area`・`.dp-main`・`.pt-main`・`.pt-tablewrap` のいずれか）に `overflow-y: auto` または `overflow: auto` が指定されていること |\n| sticky-thead | テーブルを持つページで `thead` に `position: sticky` が指定されていること |\n| 共通シェル-サイドバー | `class=\"pt-sidebar\"` が存在すること |\n| 共通シェル-方眼紙 | 方眼紙背景の `background-size` 指定が存在すること |\n\n## デザインの基本形\n\n| 観点キー | 検査内容 |\n|---|---|\n| 角丸-ゼロ | `border-radius` の値が `0` 以外にならないこと。刷新後のデザインは角丸を使わない |\n| 影-オフセットのみ | `box-shadow` にぼかし半径を持つ影が無いこと。3 つ目の長さが `0` 以外の指定を禁止する。`inset` 指定は対象外 |\n\n## 一覧ページ固有（id=\"unit-manifest\" または id=\"screen-manifest\" を持つページ）\n\n| 観点キー | 検査内容 |\n|---|---|\n| 一覧-列数上限 | `\u003cthead>` 内の `\u003cth>` が 6 個以下であること（シェブロン列含む。JS による任意列追加は対象外）。静的な `\u003cthead>` は画面名・ルート・区分の 3 列を持ち、画面区分・必要権限・関連API・設計書は値が 1 件でもある場合のみ JS が実行時に任意列として末尾へ追加する。画面 ID は列ではなく展開行の詳細に表示する |\n| 一覧-展開グループ分離 | JS 内に `detail-group-label` と `evidence` の両キーワードが存在すること |\n| 一覧-details禁止 | `\u003cdetails class=\"module-group\">` が存在しないこと。ただし、分割軸を宣言するページは除外する。分割軸の宣言は `data-split-axis=\"\u003c軸キー>\"` の有無で判定する |\n| 一覧-common-files禁止 | `class=\"common-files\"` が存在しないこと |\n| unresolved-条件付き | unresolved セクションが `empty` または `has-items` のクラスで条件分岐していること |\n| 一覧-分割軸マーカー | `\u003cdetails class=\"module-group\">` を使うページは、その群を包む要素に `data-split-axis=\"\u003c軸キー>\"` を持つこと。分割を宣言していないページで `details` を使うことを禁止する |\n\n## ポータルトップの画面なし縮退\n\n`portal-catalog.json` の blueprint が `disabledWhenEmpty: true` を持つ種別は、対象リポジトリに実ファイルが 0 件でもカードを消さず、選べない状態で残す。\n\n| 観点キー | 検査内容 |\n|---|---|\n| 縮退-無効カード表示 | `disabledWhenEmpty: true` の種別が 0 件のとき、カードが消えずに `data-disabled=\"true\"` を持って残ること |\n| 縮退-リンク無効化 | 無効カードがリンクとして機能しないこと（`href` を持たないか `aria-disabled=\"true\"` を持つ） |\n\n## 重要度コールアウト\n\n通常表へ埋没させてはいけない注意喚起は、共通シェルの `.pt-callout` と重要度修飾クラスを組み合わせて表示する。\n見出しをコールアウトの先頭要素に置き、色帯とアイコンの両方で重要度を区別する。\n\n| 重要度 | CSSクラス | Material Symbols名 | 適用対象 |\n|---|---|---|---|\n| 注意 | `.pt-callout.pt-callout--caution` | `info` | 補足確認が必要だが、作業を継続できる事項 |\n| 警告 | `.pt-callout.pt-callout--warning` | `warning` | 未解決リスク、要確認事項一覧、判断前に解消すべき事項 |\n| 重要 | `.pt-callout.pt-callout--important` | `priority_high` | 承認済み決定、変更禁止条件、見落とすと成果物の意味が変わる事項 |\n\n要確認事項一覧・未解決一覧は1件以上ある場合だけ「警告」を適用する。\n0件を示す空状態へ警告色を付けない。\nアイコンはGoogle Fonts CDNから読み込むMaterial Symbols Outlinedを、`material-symbols-outlined pt-callout__icon`の専用`span`で表示する。\n共通CSSには`info`・`warning`・`priority_high`だけの公式フォントサブセットを埋め込み、CDN遮断時も同じアイコン表示を保つ。\n本文の強調だけを目的にコールアウトを乱用せず、通常の説明は従来のパネル・表・注記を使う。\n\n## 更新日表示欄の時点定義\n\n共通シェルのフッターが表示する `{{GENERATED_DATE}}` は、更新日表示欄はビルド時点を示す。`build-portal.sh` は `--generated-at` の指定が無ければ `date +%Y-%m-%d` で実行時点を算出する。`--generated-at` を指定した場合は、その値をビルド時点の代わりとして採用する。\n\nこの欄は内容更新時点を示す設計ではない。文書の内容が別の理由で更新されても、この欄はビルドを実行した時点にしか連動せず、文書内の個別の事実（特定のコードを調査した時点等）とは仕組みが別であり連動しない。\n\n設計書の本文が個別の事実の時点を示す必要がある場合は、この汎用欄を根拠にしてはならない。記入規則は `document-writing.md`「汎用の更新日欄を個別の事実の時点主張へ転用しない」を参照する。\n\n## 設計判断\n\n### check-ledger-file-count.sh\n\n**必要性**: 課題・記録の定義を2ファイルに限定しても、主題ごとの台帳を新設すると同じ課題が分散する。`docs/` 配下のファイル名を継続走査し、許可外の台帳・一覧・記録・進捗・タスク名を検出する必要がある。\n\n**代替案を採用しなかった理由**: 目視レビューでは新設のたびに見落としうる。既存の指示書形式検査は文書内容を扱い、`docs/` 全体のファイル名を扱わない。Makefile と package.json は検査を載せる既存基盤がないため追加しない。\n\n**保守責任者**: 人手（ユーザー）。許可する定義、退避先、人向け資料の経路、または検出語を変える場合は本体・薄い入口・hook・規約を同時に更新する。\n\n**廃棄条件**: 課題・記録がファイル名に依存しない単一の構造化ストアへ移行し、新設時と継続検査の両方を同等以上に強制できるようになった時。\n\n### check-new-ledger-file.sh\n\n**必要性**: 継続検査だけでは、許可外ファイルが作られてから検査まで残る。PreToolUse(Write) で新設時に止め、定義2ファイルへ誘導する必要がある。\n\n**代替案を採用しなかった理由**: マーカーファイルはセッション間競合と掃除漏れを生むため使わない。永久に fail-closed にすると誤検出時に作業不能になるため、transcript の同一タグ3回を解除条件にする。permissions.deny は日本語の複数語と例外経路を表現できない。\n\n**保守責任者**: 人手（ユーザー）。Claude hook 入力の項目名、許可経路、検出語、解除回数を変える場合は hook の自己テストと settings 登録を同時に更新する。\n\n**廃棄条件**: Write の入力前検証を設定スキーマが直接提供し、同じ例外経路と連続停止時の解除を宣言だけで表現できるようになった時。\n\n### shell-injection.sh\n\n**必要性**: 共通シェル（サイドバー・フッター・方眼紙背景）を22本のテンプレートへ入れる。\n実体を1箇所で保守しながら、共通資産をインライン注入した単一HTMLとして出力する必要がある。\nMaterial Symbols OutlinedのGoogle Fonts CDNだけは、アイコン表示に必要な外部依存として許可する。\n同じ3アイコンの公式フォントサブセットを共通CSSへ埋め込み、オフライン表示を維持する。\n既存の`tokens.css`注入と同じマーカー置換を使い、サイドバーのナビ項目はカタログから組み立てる。\n組み立てとプレースホルダ解決を6本のビルドスクリプトへ複製すると、保守点が6倍になる。\n共通関数を1本のスクリプトに閉じ、各ビルドスクリプトが`source`して呼ぶ。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: ビルドスクリプトから呼ぶ共通関数であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `render-template.sh` への統合: あちらは汎用の文字列置換エンジンであり、カタログの構造やサイドバーの仕様を知るべきでない。関心が異なる\n\n**保守責任者**: 人手（ユーザー）。`partials/` のファイル構成やマーカー名を変える場合は、本スクリプトと `page-conventions/rule.md` を同時に更新する。\n\n**廃棄条件**: 共通シェルを廃止した時、またはテンプレートの部分結合をビルド基盤が標準で提供するようになった時。\n\n### unit-axes.sh\n\n**必要性**: 分類軸と任意列の宣言（`delivery-payload/references/unit-axes.json`）は、リポジトリ既定・プロジェクト全種別上書き・種別別上書きの 3 階層を持つ。これらをキー単位で deep merge して解決する必要がある。この解決規則を `build-unit-list.sh` だけに実装すると問題が生じる。manifest パスだけを引数に単独実行される `validate-manifest.sh` と、`--self-test` で直接叩かれる `build-feature-list.sh` がある。この両者が、同じ規則を再実装することになる。結果として、build と validate が別の宣言を見る二重基準が生まれる。`render-template.sh` / `shell-injection.sh` と同じ共通関数として実装する。複数ビルダーが source する形で 1 本に閉じるのが唯一の現実的な手段である。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: ビルドスクリプトと検証スクリプトの双方から呼ぶ共通関数であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `render-template.sh` への統合: あちらは汎用の文字列置換エンジンであり、宣言のスキーマやマージ規則を知るべきでない。関心が異なる\n- `portal-catalog.mjs` と同じ Node.js 実装: 消費者が全て bash スクリプトである。`jq` は既に全ビルダーと `validate-manifest.sh` の必須依存として導入済みのため、新たに Node.js 依存を足す理由がない\n\n**保守責任者**: 人手（ユーザー）。宣言のスキーマ（`valuePolicy` の値・`column.show` の値・`split` の構造）を変える場合は、本スクリプトの `unit_axes_validate` を更新する。あわせて `delivery-payload/references/unit-axes.json` と本 rule.md も同時に更新する。\n\n**廃棄条件**: 分類軸の宣言化を廃止した時、または列定義の宣言解決をビルド基盤が標準で提供するようになった時。\n\n### check-manifest-persistence.sh\n\n**必要性**: 一覧生成スキルごとにマニフェストの永続化先が非対称だった問題（改善課題 1-136）に対し、生成後の実在を機械判定するため。定義文書の記述だけでは実際に永続化されたかを確認できない。7 種別（画面・API・テーブル・バッチ・帳票・外部連携・機能）の一覧フォルダを横断して検査する必要があり、共通関数として 1 本に閉じるのが妥当である。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 7 種別分の存在確認を毎回手動実行するとトークンを浪費し、往復検証セッションのたびに同じ確認作業を繰り返すことになる\n- `validate-manifest.sh` への統合: あちらは manifest の中身（スキーマ・重複・summary 整合性）の検証を担っており、ファイルの配置場所（永続化されたかどうか）の検査は関心が異なる\n- 各一覧生成スキルへの個別実装: 7 種別で同じ「HTML が実在するならマニフェストも実在するはず」という検査ロジックが重複する\n\n**保守責任者**: 人手（ユーザー）。一覧種別を追加した場合は本スクリプトの `manifest_name_for_folder` 対応表に行を追加する。\n\n**廃棄条件**: 一覧フォルダとマニフェスト名の対応が宣言ファイル（`delivery-payload/references/unit-axes.json` 等）から解決できるようになった時。\n\n### check-derived-drift.sh\n\n**必要性**: 定義から生成した派生物（ポータル HTML 等）が手作業で編集されると、定義との対応が壊れたまま気付けない。生成時にハッシュを台帳（derived-fingerprints.json）へ記録し、以後の突合で MODIFIED と DELETED と ADDED を検知する。同じ突合をコミット時 hook と CI と手動実行の 3 経路から呼ぶため、判定を 1 本のスクリプトへ集約する。判定はハッシュだけで行い、更新時刻は使わない（git checkout や別ツールでも時刻は動くため）。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 3 経路から同じ判定を呼ぶ必要があり、都度組み立てると経路ごとに判定がずれる\n- 既存 test-portal-conventions.sh への同居: あちらは HTML の規約適合（色やレイアウト）の検査であり、定義と派生の一致という関心が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。検知対象を値のレベル（画面名や表示コミットの突合）へ広げる際も本スクリプトへ集約する。\n\n**廃棄条件**: 派生アダプターと保守の仕組み（AI駆動開発セットアップ構想の Phase C と Phase D）自体を廃止した時。\n\n### output-layout.sh\n\n**必要性**: 生成スクリプト 26 ファイルが出力先の日本語パスを直書きしており、物理配置の変更（`docs/` への移行）が全ファイル書き換えになる。パスの定義を `delivery-payload/references/output-layout.json` へ集約し、リポジトリ既定と対象側上書きの 2 階層をキー単位で合成して解決する共通関数が必要である。解決規則を各スクリプトへ個別実装すると、生成と検証が別の宣言を見る二重基準が生まれる（`unit-axes.sh` と同じ判断）。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 生成と検証の双方から呼ぶ共通関数であり、対話セッションのツール呼び出しでは代替できない\n- `unit-axes.sh` への同居: あちらは分類軸と列定義の宣言解決であり、出力配置という関心が異なる\n- `render-template.sh` への統合: あちらは汎用の文字列置換エンジンであり、配置の宣言を知るべきでない\n\n**保守責任者**: 人手（ユーザー）。配置キーを増減する場合は `output-layout.json` と本節と self-test を同時に更新する。\n\n`layout.\u003c種別>UnitRoot`（`screenUnitRoot`・`apiUnitRoot`・`tableUnitRoot`・`batchUnitRoot`・`reportUnitRoot`・`externalUnitRoot`・`featureUnitRoot` の7キー）は各種別の設計書単位文書だけの物理rootを表す。既定値は `screenUnitRoot=docs/design/screens`・`apiUnitRoot=docs/design/apis`・`tableUnitRoot=docs/design/tables`・`batchUnitRoot=docs/design/batches`・`reportUnitRoot=docs/design/reports`・`externalUnitRoot=docs/design/externals`・`featureUnitRoot=docs/design/features`。表示用の `kindLabels.\u003c種別>` は物理pathへ流用しない。値は非空の安全な相対パス（`/` 区切りの1つ以上のsegment）に限定し、JSON null・空文字・絶対パス・`.`・`..`・backslash・find globメタ文字（`* ? [ ]`）を解決時に拒否する。7キーは互いに、および `unitsRoot`・`commonRoot` ともNFC比較で衝突できない（`output-layout.sh` の `output_layout_validate` が一括検査する）。`screenUnitRoot` は一覧root、画面遷移、matrix、テンプレート原本、samples、リポジトリ外の `verification/` へ連動させない。\n\n**廃棄条件**: 出力配置の宣言化を廃止した時、または配置解決をビルド基盤が標準で提供するようになった時。\n\n### build-confirmation-survey-data.sh\n\n**必要性**: 推定名称（`nameConfidence==\"inferred\"`）・要手動確認（`kind==\"unresolved\"`）・権限未設定（`permissions==null`）・要確認事項（画面詳細設計書の要確認事項一覧）の4系統は、それぞれ別々のページ・別々の判定式で分散記録されており、人間が確認すべき事項を横断で発見する経路が無かった（改善課題1-169）。4系統の判定式を1箇所に集約し、`build-matrix-pages.sh` の決定的生成パイプラインへ載せる導出エンジンが必要で、self-testを含み再生成のたびに繰り返し呼ばれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: `build-matrix-pages.sh` から決定的に呼ばれる前段処理であり、対話セッションのツール呼び出しでは代替できない\n- 既存 `build-matrix-data.sh` への機能追加: あちらは画面・API・テーブルの交差関係（マトリクス）の導出が関心であり、4系統の「人間確認待ち」集約とは検査対象・判定式が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。4系統の判定式（`nameConfidence`・`kind`・`permissions`・要確認事項の入力形式）を変更する場合は本スクリプトの導出ロジックと self-test を同時に更新する。\n\n**廃棄条件**: 確認事項質問票ページ自体を廃止した時、または4系統の集約を別基盤が標準で提供するようになった時。\n\n### check-glossary-sync.sh\n\n**必要性**: このリポジトリ自身の開発構想文書は「`docs/guides/用語集.md` を説明HTML群の用語の単一情報源とする。ガイドのパネルとの同期はずれ検知の対象」と定義済みだが、同期を機械検知する手段が無かった（同構想の実装進捗記録は「情報源は新設済み、同期機構は未着手」と明記）。用語集を直してもガイドが古いまま残り、逆にガイドで用語を書き換えても用語集に反映されないまま気付けない状態だった。22本のガイドHTML（`.claude/skills/*/references/guide.html`）が用語パネルを持ち、`docs/guides/用語集.md` 1本と突き合わせる必要があるため、手動突合ではなく機械的な差分検知が要る。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: ガイド追加・用語追加のたびに同じ突合作業（22本のHTMLパースと用語集の対照）を繰り返すことになり、都度トークンを浪費する\n- 既存 `check-derived-drift.sh` への機能追加: あちらは生成済み派生物（ポータルHTML等）のハッシュ台帳突合が関心であり、用語集とガイド用語パネルという手書き文書同士の内容比較とは検査対象・判定式が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。ガイドHTMLの用語パネル形式（`\u003cdt>`/`\u003cdd>` 対・`\u003ctable>` 行以外の新形式）を新設する場合は本スクリプトの `parse_guide` 抽出ロジックを同時に更新する。\n\n**廃棄条件**: `docs/guides/用語集.md` とガイドの用語パネルが単一の生成元から自動生成される仕組みに統合され、手動記述の二重管理自体が解消された時。\n\n### check-derived-values.sh\n\n**必要性**: check-derived-drift.sh はファイル単位のハッシュ突合で「派生物が変わったか」を検知するが、「表示されている値が定義と一致するか」までは判定しない。AI駆動開発セットアップ構想 Phase D「保守-派生値ずれ検知」は、画面名（screen-manifest.json の値と一覧・詳細ページの表示値の一致）と表示コミット（画面詳細設計書 frontmatter の source_ref とポータル・画面ページの表示値の一致）という2種類の値レベルの一致を検査対象と定める。値は台帳を持たず、定義（manifest.json / frontmatter）から毎回決定的に導出して現在の表示値と突合する。generation-engine/scripts/tests/ の自己テスト群（test-e2e-portal.sh）から呼ばれる形で、生成物全体に対する回帰検知として機能する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: test-e2e-portal.sh・保守フロー双方から同じ判定を呼ぶ必要があり、都度手動実行すると経路ごとに判定がずれる\n- check-derived-drift.sh への機能追加: 同スクリプトの設計判断（本節直上）は将来の値レベル検知の集約先として自身を挙げているが、判定方式が異なる（ハッシュ突合による record/status の台帳前提 vs. 定義からの毎回再導出による値比較）ため、同居させると台帳ありきの体系と台帳なしの体系が1本のスクリプト内で混在し複雑度が増す。値レベル検知を独立スクリプトとする判断は本スクリプトを新設した作業指示による明示選択であり、集約するかどうかは改めて判断が必要な既知の未決事項として残す\n- test-portal-conventions.sh への同居: あちらは単一HTMLファイルの規約適合（色・レイアウト）を検査するリンタであり、複数種の定義ファイルとHTMLを横断する値突合とは検査対象が異なる\n- validate-manifest.sh への機能追加: あちらは manifest 単体のスキーマ・重複・summary整合性の検証が関心であり、HTML表示値との突合という別ファイル間の一致検査とは関心が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。画面名・表示コミット以外の値検知を追加する場合、または check-derived-drift.sh との統合を判断する場合は本スクリプトと本節を同時に更新する。\n\n**廃棄条件**: 派生アダプターと保守の仕組み（AI駆動開発セットアップ構想の Phase C と Phase D）自体を廃止した時、または check-derived-drift.sh へ統合され本スクリプトが不要になった時。\n\n### scaffold-design-unit.sh\n\n**必要性**: テンプレートの複製と配置と検証を機械で保証する層を持つのは画面だけだった。API・テーブル・バッチ・帳票・外部連携の 10 スキルは、スキル定義の手順（Read → Write）で配置しており、未置換のプレースホルダ・章の欠落・配置先の誤りを検出できない。`scaffold-screen.sh` は 3 サブフォルダ 8 ファイルの束・相対パス補正・共通文書の複製という画面固有の構造を持ち、種別引数で分岐させると複雑度が増して既存の画面経路を壊す。非画面の 5 種別は互いに同形（フラットな束・基本設計と詳細設計の 2 相・名前 1 トークンの置換）であり、1 本で覆える。10 スキルから同じ配置処理を呼ぶため、共通スクリプトへ閉じる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 10 スキルの Phase 3 から呼ばれる配置処理であり、対話セッションのツール呼び出しでは代替できない\n- `scaffold-screen.sh` の拡張: 画面の 3 サブフォルダ構造と非画面のフラット構造を 1 本で分岐させると、既存の画面経路に触れる。画面は実績があり壊せない\n- 各スキルへの個別実装: 10 スキルで同じ複製・置換・検証が重複する\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。種別を追加する場合は `delivery-payload/references/design-unit-layout.json` の `kinds` へ 1 件足し、テンプレートを配置する。加えて、種別から `output-layout.json` の物理配置キー（`\u003ckind>UnitRoot`）を導出する `scaffold-design-unit.sh` の `unit_root_key_for_kind()` に対応 case を 1 行追加する（新種別の物理rootキー名を宣言だけから機械的に導出できないため）。\n\n**廃棄条件**: 非画面種別の設計書生成を廃止した時、または配置と検証をビルド基盤が標準で提供するようになった時。\n\n**機能（feature）を対象に加えた変更**: 機能（feature）を対象に加えた。当初は5種別のみを対象とし、機能はスキルが手動で Read/Write していた。手動の書き出しは未置換のひな形や章の欠落を機械で検出できないため、他5種別と揃えた。機能の `detail` が空配列である理由は、機能設計書が集約設計書であり、構成要素の個別仕様は各構成要素の設計書を正とするためである。機能そのものの詳細設計という段階を持たない。\n\n### test-design-unit-scaffold.sh\n\n**必要性**: `scaffold-design-unit.sh` は 5 種別 × 2 相の展開と 4 種類の検査を持ち、種別の追加やテンプレートの変更で退行しうる。素通り条件（正常な展開）と拒否条件（symlink・重複実行・未置換・章の欠落）を 8 ケースで回帰検証する。手動で 8 ケースを毎回確認するとトークンを浪費する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 8 ケースを毎回手動実行すると、スクリプト修正のたびに同じ確認を繰り返す\n- `test-screen-unit-root-layout.sh` への同居: あちらは画面の配置検査であり、対象と判定式が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`scaffold-design-unit.sh` の検査条件を変えるたびに本テストのケースを追従させる。\n\n**廃棄条件**: `scaffold-design-unit.sh` が廃止された時。\n\n### check-doc-claim-freshness.sh\n\n**必要性**: 文書の記述が実装に追い越されても誰も気付けない事故が実際に起きた。2026-08-10 に、構想文書の 3 箇所が実装済みの機能を「未実装である」と現在形で断定したまま残っていることが判明した。文書の主張と実装の一致そのものは機械で判定できないが、「その主張がいつ時点のものか」は機械で検査できる。時点が書いてあれば読み手は鮮度を判断でき、古い記述を現状と取り違えない。対象は `docs/` 配下の Markdown 全件で、段落単位の走査と時点表明の有無という 2 段の判定を持ち、文書が増えるたびに繰り返し実行する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 段落分割と時点表明の照合を対話セッションのたびに手で組み立てると、実行のたびに判定基準がぶれる。実際に 2026-08-10 の確認では文書の記述を検査対象に含めておらず、3 箇所を見落とした\n- 既存 `check-glossary-sync.sh` への同居: あちらは用語集とガイドの用語パネルという 2 つの文書の内容一致が関心であり、単一文書内の記述の鮮度とは検査対象も判定式も異なる\n- 既存 `check-derived-drift.sh` への同居: あちらは生成物のハッシュ突合であり、手書き文書の文面を対象にしない\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。時点の表明として認める語を増減する場合は、本スクリプトの `DATED_RE` と本節を同時に更新する。\n\n**廃棄条件**: `docs/` 配下の Markdown が生成物へ置き換わり、手書きの記述が無くなった時。\n\n### build-manifests-from-docs.sh\n\n**必要性**: 配布物の生成器だけではポータルを再現できず、実行側の独自スクリプトに依存している問題（改善課題 1-26）への対応として、設計文書から入力データを組み立てる経路を新設した。API・テーブル・バッチ・帳票・外部連携・機能の 6 種別は、詳細設計書の frontmatter（`\u003ckind>_key` 等）から一覧マニフェスト（`\u003ckind>-manifest.json`）を機械的に組み立てられるが、この変換は種別ごとに frontmatter のキー名・走査基点・導けない項目の代替値が異なる。抽出元の形式を `delivery-payload/references/doc-extraction.json` の宣言に外出しし、特定の文書構成に依存しない形にするには、宣言の読み込み・frontmatter の抽出・`unit-list/validate-manifest.sh` による検証までを一貫して行うスクリプトが要る。frontmatter から導けない項目（`kind`・`confidence`・`detectionMethod`・`fileCount`・API 以外の `identifier`）は捏造せず宣言の代替値で埋める。`kind` を `unresolved` にするのは単なる意味の一致ではなく強制である。`validate-manifest.sh` の項目 4（sourceFile-実在）は `kind != \"unresolved\"` の行だけ `sourceFile` の実在確認を行うが、`source_ref` は原本コード側のパスであり文書だけの抽出器には参照できない。`kind` を他の値にすると項目 4 が必ず FAIL するため `unresolved` は必然の選択であり、5 種別（feature は項目 8.5 の kind-値域検査自体が対象外）の閉じた値域にも含まれる既存の語彙である。`confidence` の `low` は新語ではなく、`validate-manifest.sh` の `--fix` が `sourceFile` 不在行を `kind=unresolved・confidence=low` へ降格させる既存の慣例に合わせた。`strategy.approvedByUser` は項目 2（strategy-承認）が `unit_kind=message` 以外に対して機械的に `true` を要求するため、選択ではなく強制で `true` を書く（実際に人間が個々の行を承認したわけではない点は自己申告する）。既知の限界として、非 API 種別の `identifier` は宣言の定数 `未確認` を全行で使うため、項目 3（重複-identifier+sourceFile）は `未確認|\u003csource_ref>` の組で重複判定される。2 つの設計文書が同じ `source_ref` を持つ、または両方とも `source_ref` が空の場合は重複として FAIL する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 種別ごとに異なる frontmatter キー・走査基点・代替値を対話セッションのたびに手で組み立てると、実行のたびに判定基準がぶれ、6 種別分の変換ロジックを毎回再現するのは非現実的\n- `unit-axes.sh` への同居: あちらは分類軸・任意列という HTML 生成時の列定義解決が関心であり、設計文書から manifest 要素そのものを組み立てる本スクリプトとは関心が異なる\n- `output-layout.sh` への同居: あちらは出力配置パスの解決のみを担い、frontmatter の解析や manifest スキーマの組み立てを知るべきでない。本スクリプトは `output-layout.sh` を `source` して配置キーの解決だけを委譲する\n- `scaffold-design-unit.sh` への機能追加: あちらはテンプレートの複製・配置・検証（書き込み方向）が関心であり、既存文書からの読み取り・変換（読み込み方向）とは処理の向きが逆\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。種別を増減する場合は本スクリプトと `delivery-payload/references/doc-extraction.json` と本節と self-test を同時に更新する。\n\n**廃棄条件**: 設計文書からのマニフェスト抽出を廃止した時、または frontmatter からの入力データ組み立てをビルド基盤が標準で提供するようになった時。\n\n### document-paths.sh\n\n**必要性**: 画面とAPI・テーブル・バッチ・帳票・外部連携・機能の7種別は、マニフェストへ資料Pathを加える前に同じ「通常ファイルとして実在する」条件で判定する必要がある。判定を1本へ集約し、画面メタデータ抽出と設計文書からのマニフェスト生成が同じ条件を使うことで、欠落・改名済み資料へのリンクを作らない。\n\n**代替案を採用しなかった理由**:\n- Bashツール直叩き: 生成のたびに実在判定とJSONフィールド追加を手で組み立てると、7種別で判定条件がずれ、繰り返し利用できない\n- 各抽出スクリプトへの同じ処理の複製: 画面側だけ判定が更新され他種別が追従しない事故を再発させる\n- `build-manifests-from-docs.sh` への内包: 画面の `extract-screen-metadata.sh` から共用できず、全種別で同じ判定にする目的を満たさない\n- Makefile / package.json scripts追加: このリポジトリはどちらも持たず、生成コマンドの入口ではなくsourceされる共通関数なので代替にならない\n\n**保守責任者**: 人手（ユーザー）。資料Pathの実在条件または追加方法を変える場合は、本スクリプト、両呼び出し元、`doc-extraction.json`、本節と自己試験を同時に更新する。\n\n**廃棄条件**: 全7種別が単一の宣言駆動抽出器へ統合され、`document_paths_add_existing` の呼び出し元が無くなった時。\n\n### check-screen-api-linkage-contract.sh\n\n**必要性**: 「画面とAPIの対応づけ-担当不在」（改善課題）は、画面拡張マニフェスト35件すべてに`relatedApis`が無く、画面-API-テーブル対応表の画面軸が0件になった事故である。原因は`extract-screen-metadata.sh`が`--api-manifest`を受け取ればrelatedApisを解決できるにも関わらず、api-manifestがまだ存在しない実行順でも解決し直す担当がどのSKILL.mdにも記述されていなかったこと。担当の所在そのものは実装ではなく記述であり、記述の有無は機械で検査できる。`orchestrating-ai-development-setup`のStep 3-1が`rebuild-screen-derived-pages.sh --api-manifest`によるrelatedApis解決を明記しているか、`generating-screen-list-for-reverse-docs`のStep 2-4がapi-manifest既存時に`--api-manifest`を付与する旨を明記しているかを、該当Stepの見出し区間だけを抜き出してgrepする。SKILL.mdの改訂で担当の記述が再び失われた場合に検知するため、繰り返し実行する自己テストとして固定する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: SKILL.md改訂のたびに該当Step区間を目視確認する運用は、確認の省略・見落としを繰り返す。実際に本件は記述が無いまま2026-08-11まで気付かれなかった\n- 既存 `check-doc-claim-freshness.sh` への同居: あちらは文書の主張の鮮度（時点表明の有無）が関心であり、Step本文が特定コマンドの呼び出しを明記しているかという契約検査とは判定式が異なる\n- 既存 `check-manifest-persistence.sh` への同居: あちらはマニフェスト・HTMLの実在確認（生成物のファイルシステム上の存在）が関心であり、SKILL.md本文のテキスト契約検査とは対象が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。担当の記述箇所（Step番号・使用コマンド名）を変更する場合は、本スクリプトの `check_step_section` 呼び出し引数と本節を同時に更新する。\n\n**廃棄条件**: `relatedApis`の解決をorchestrator手順から自動生成できる仕組みに置き換え、SKILL.mdへの手書き記述自体が不要になった時。\n\n### check-wired-socket-drift.sh\n\n**必要性**: 「状態遷移図-配線済みの記述漏れの検査がない」（改善課題）は、`generating-entity-state-for-reverse-docs/SKILL.md` が状態遷移図のポータルカード受け口を「未配線」と書いたまま残り、実装（`portal-catalog.json` への登録）が先に進んで記述が実態に追い越されていた事故である。同種のずれは、他の生成スキルでも今後同じ順序（先に配線、記述の更新漏れ）で再発しうる。ポータルカタログ（`portal-catalog.json`）は種別ごとに `kind` と生成元 `generator` を機械可読な形で持つため、カタログに登録済み（＝受け口配線済み）の種別すべてについて、対応するスキルの SKILL.md が自身を「未配線」と記述していないかを横断的に検査できる。手動で全生成スキルの SKILL.md を毎回読み直すのは非現実的であり、繰り返し実行する自己テストとして固定する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: カタログの `blueprints[]` は現在59件あり、生成スキルの追加・改訂のたびに全件を手動で照合すると確認の省略・見落としを繰り返す。実際に本件はentity-state 1件が長期間気付かれないまま残った\n- 既存 `check-portal-catalog.sh` への同居: あちらはカタログ自体のスキーマ妥当性とHTML生成結果の突合（`portal-catalog.mjs` のvalidate/compare）が関心であり、カタログ登録済み種別とスキル定義文書（SKILL.md）の記述内容の突合とは検査対象が異なる\n- 既存 `check-doc-claim-freshness.sh` への同居: あちらは`docs/`配下の構想文書の時点表明の有無が関心であり、`.claude/skills/*/SKILL.md`の受け口配線状況の記述とは対象ディレクトリも判定式も異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。「未配線」以外の表現でも同種のずれが記述される場合（例: 別の言い回しでの申告漏れ）を見つけたら、本スクリプトの `DRIFT_ERE` と本節を同時に更新する。\n\n**廃棄条件**: ポータルカタログの登録とスキル定義文書の記述が単一の生成元から自動同期される仕組みに統合され、SKILL.mdへの手書きの受け口配線状況の記述自体が不要になった時。\n\n### check-design-doc-section-consistency.sh\n\n**必要性**: 改善課題1-74は、節構成の多数決により、規約に適合した少数の設計書が逸脱と報告される問題を扱う。同じ文書役割の多数派を正とすると、この事故が起きる。\n\n`delivery-payload/references/design-doc-required-sections.json` を、ドキュメント作成規約とテンプレートから具体化した定義とする。`output-layout.json` が宣言する7種別のユニットルート配下で、種別とbasenameに対応する必須節を照合する。必須節の欠落は `FAIL` とし、非0で終了する。定義した順序との相違は `WARN` とし、終了コードは0とする。定義にないbasenameも `WARN 必須節定義-なし` として、終了コード0で報告する。\n\n`build-portal.sh` は検査の非0を握りつぶさない。必須節の欠落を、生成連鎖の失敗へ伝播する。ユニットルートに限定するのは、同じbasenameの非設計文書を誤検査しないためである。たとえば、`docs/rules/\u003c親>/\u003c子>/rule.md` は対象に含めない。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 対話セッションのたびに全設計文書と種別ごとの必須節を手動照合するのは非現実的で、生成のたびに同じ確認作業を繰り返すことになる\n- 既存 `test-screen-doc-section-order.cjs` への機能追加: あちらは画面詳細設計書1種類に限定した、実ブラウザでのDOM見出し順序検査（描画後のDOM）が関心であり、複数種別・複数ファイル横断の静的な節構成比較とは検査対象・実行コスト（ブラウザ起動要否）が異なる\n- `validate-rule-definitions.sh` への機能追加: あちらはfront matter13鍵の値域を検査する\n- 同スクリプトへの統合を見送る理由: 設計文書の必須節検査とは対象ディレクトリが異なる。検査の判定式も異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。種別ユニットルートのキー名を増減する場合は、`KIND_ROOTS` も更新する。`delivery-payload/references/output-layout.json` も同時に更新する。`delivery-payload/references/design-doc-required-sections.json` も同時に更新する。設計書の必須節を変える場合は、ドキュメント作成規約とテンプレートを定義として必須節定義を同期する。\n\n**廃棄条件**: テンプレートエンジンだけで、設計文書の必須節と並びを決定的に生成できるようになった時。個別書き起こしによる欠落、順序相違、未定義文書が生じなくなった時。\n\n**1-268での拡張**: API詳細設計書だけにあったテンプレート適合検査（全見出し・全表列見出しの完全一致）を一般化した。対象は単体テスト設計書7種別（画面・API・テーブル・バッチ・帳票・外部連携・機能）である。対象は `conformance_triples_default`（kind・basename・比較先テンプレートの絶対パスの3つ組）が定義する。API詳細設計書の比較先テンプレートと判定条件は変えていない。あわせて `design-doc-required-sections.json` の各種別へ単体テスト設計書のエントリを追加した。ただし `requiredSections` の値は、指示書が示した `check-unit-test-design-doc-sections.sh` の12節をそのまま複製しなかった。12節のうち§9は「要確認事項一覧」である。§9「要確認事項一覧」は、改善課題1-223で廃止済みの見出しである。本ファイル自身の自己テスト（「課題1-223-要確認事項節の残存数」）は、テンプレート配下からの残存を0件で要求する。そのまま複製すると、自己が禁じる見出しを必須節として要求することになる。実際に7種別中6種別（API以外）のテンプレートは§8止まりである。これらは§9自体を持たない。APIの§9は「関連資料」である。既存6種別（画面・API・テーブル・バッチ・帳票・外部連携・機能の詳細設計書）のrequiredSectionsは、各テンプレートの実見出し（条件付き節を除く）そのものである。この慣行に倣い、単体テスト設計書のrequiredSectionsも各テンプレートの実見出し全件とした。内訳は、screen/table/batch/report/externalが§8まで11節、apiが§9関連資料を含む12節、featureが§8まで11節である。この結果、見本（`generation-engine/samples`）への適用は0 FAILのまま通る。全見出し完全一致検査（テンプレート適合検査）を別途課している。そのため、様式からの逸脱検知そのものは損なわれない。テンプレート適合検査は、欠落・余分・順序のみ相違を区別して報告する（`classifyListDiff`）。自己テストは `検収268-*` を追加した（様式どおりの合格・欠落・余分・順序相違・表列相違の5ケース）。\n\n### verification-env.sh\n\n**必要性**: 往復検証（原本コードから設計書を作り、設計書だけから再生成して原本と突合する）は、検証のたびに使い捨ての作業ツリーと出力先を発番・作成・削除する必要がある。版管理下や作業リポジトリ内に検証用の一時ファイルを作ると、`git status` の汚染や誤コミットを招く。識別子の発番・配下ディレクトリの作成・範囲外パスの削除拒否・HEAD コミットハッシュの記録という 4 つの処理を、往復検証を呼ぶ複数のスキル・スクリプトから同じ規約で繰り返し利用するため、共通関数として 1 本に閉じる。削除範囲の検査（`${TMPDIR:-/tmp}/reverse-verification/` 配下のみ許可）は誤削除防止のための必須の分岐であり、呼び出し側ごとに再実装させると検査漏れが起こりうる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 往復検証を実行するたびに識別子発番・ディレクトリ作成・削除範囲チェックを対話セッションで手動再現するのはトークンを浪費し、削除範囲チェックの省略による誤削除のリスクを毎回背負う\n- 既存 `output-layout.sh` への同居: あちらは生成物の出力配置パス（日本語パス）の宣言解決が関心であり、版管理下から独立した使い捨て作業領域のライフサイクル管理とは対象・関心が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。作業領域の配置規約（`${TMPDIR:-/tmp}/reverse-verification/` の階層構造）を変更する場合は本ファイルと self-test を同時に更新する。\n\n**廃棄条件**: 往復検証の使い捨て環境管理を廃止した時、または検証用の一時環境の用意・破棄をビルド基盤が標準で提供するようになった時。\n\n### run-layer-machine-checks.sh\n\n**必要性**: 第1層（機械検証）は `generation-engine/scripts/` 配下に自己テストを持つスクリプトが 70 本以上散らばっており、往復検証のたびに全件を手動で1本ずつ実行して合否を確認するのはトークンを浪費し、実行漏れを招く。加えて、自己テストがケースを1件も実行しないまま終了コード0を返し全件合格と誤認される事故（途中停止の疑い）は、個々のスクリプトの出力を目視で追わない限り気付けない。対象を `--self-test` の文字列を含む `.sh` として動的に列挙し、実行するたびに全件へ横断適用する集計エンジンが必要であり、往復検証フローから繰り返し呼ばれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 70 本以上を対話セッションのたびに手動で列挙・実行・集計すると、実行のたびに対象漏れや集計基準のぶれが生じる\n- 各スキルへの個別実装: 複数のスキル・フローから同じ「全自己テストの横断実行」を呼ぶため、個別実装すると集計基準（途中停止の疑いの判定式等）が実装ごとにずれる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。列挙規則（対象ディレクトリ・拡張子・`--self-test` 文字列判定）やケース数の読み取り規則（`実行 \u003cN> 件` / `[PASS]`・`[FAIL]` カウント）を変更する場合は本ファイルと self-test を同時に更新する。\n\n**廃棄条件**: 第1層の自己テスト横断実行を廃止した時、またはビルド基盤が自己テストの一括実行・集計を標準機能として提供するようになった時。\n\n**1本あたりの時間上限（`--timeout`）を追加した理由**: 上限を持たない集約実行は、1本が長引くと全体が止まる構造的な弱点を持っていた。実測で `build-portal.sh` の自己テストは240秒でも完走せず（54セクション中6セクションまでしか進まない）、`check-photo-findings-29.sh` は内部で11本の自己テストを直列に呼ぶため60秒でも出力が出ない。全88本を無制限に直列実行すると所要時間は下限でも16分規模に達する。これらは個別に直しても新たに追加される自己テストが同じ問題を再現しうるため、集約実行側に恒久的な上限を持たせる必要がある。この環境には `timeout` コマンドも `gtimeout` コマンドも存在しないことを実測で確認済みのため、`set -m` で対象スクリプトを専用プロセスグループとして起動し、0.2秒間隔のポーリングで生存確認したうえで上限超過時に負のPID（プロセスグループ）へSIGTERM/SIGKILLを送る方式とした。macOS 標準の bash 3.2 でも動作することを実機（`/bin/bash`）で確認済み。\n\n**`.cjs`・`.mjs` の検査を対象に加えた理由**: 収集は当初 `--self-test` を持つ `.sh` だけを対象としていた。この条件では `generation-engine/scripts/tests/` 配下の Node.js のテストが拾われず、参照元も 0 件のまま一度も実行されない状態が続いていた（2026-08-16 実測で 2 本）。これらは引数を取らず、実行そのものが検査になる形式のため、`--self-test` の有無では判定できない。収集条件へ `test-*.cjs` と `test-*.mjs` を名前で加え、実行時に拡張子で `node` と `bash` を切り替える。ケース数の読み取りは既存の形式（行頭の `PASS:`／`FAIL:` の合計）がそのまま使える。\n\n### run-layer-full-pipeline.sh\n\n**必要性**: 第3層（一気通貫）は、疑似入力の配置から設計文書のマニフェスト組み立て・種別別抽出・一覧生成・マトリクス生成・デザイン系ページ生成・規約定義の展開・ポータル生成までを横断する 10 段の生成連鎖であり、既存の決定的スクリプト群 20 本近くを正しい順序・正しい引数契約で呼ぶ必要がある。往復検証のたびにこの呼び出し順序と引数を対話セッションで手動再現するのは非現実的で、途中の 1 段が失敗しても後続を止めずに全段を実行し切り、最後に段ごとの合否を集計するという横断的な振る舞い（`rules/scaffold-rule-definitions.sh` は `--apply` を付け忘れると規約が 0 件のまま試行実行になる、という既知の事故パターンを含む）を、呼び出しのたびに同じ基準で再現する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 20 本近い既存スクリプトを正しい順序・正しい引数契約で対話セッションのたびに手動連鎖実行すると、実行のたびに順序や引数の抜け漏れ（特に `--apply` の付け忘れ）が生じる。実際にこの事故パターンは作業指示自体が明示的に警告する既知のリスクである\n- 既存 `verification-env.sh` への機能追加: あちらは使い捨て作業領域のライフサイクル管理（発番・作成・削除・版記録）のみが関心であり、生成連鎖の段構成・失敗時の継続方針・段ごとの集計とは対象・関心が異なる。本スクリプトは `verification-env.sh` を source して利用する側であり、機能を吸収させると単一責任が崩れる\n- 既存 `run-layer-machine-checks.sh` への機能追加: あちらは自己テストの横断実行・集計が関心であり、実際の生成物を作る本番の生成連鎖とは実行対象・失敗時の振る舞いが異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。呼び出す既存スクリプトの引数契約（`build-manifests-from-docs.sh`・`detect-screens.sh`・`extract/` 配下の各抽出・`build-unit-list.sh` 等）が変わった場合は、本ファイルと `run-layer-full-pipeline.sh` の各 stage_* 関数と self-test を同時に更新する。\n\n**廃棄条件**: 第3層（一気通貫）の生成連鎖を廃止した時、またはビルド基盤が生成連鎖の順序制御・失敗時継続・段ごとの集計を標準機能として提供するようになった時。\n\n### prepare-verification-input.sh\n\n**必要性**: `delivery-payload/templates/リバース検証/` 配下の雛形36件は `scaffold-screen.sh` / `scaffold-design-unit.sh` が複製元とする雛形であり、frontmatter に未置換のプレースホルダ（`APIKEY`・`SOURCEREF`・`\u003cYYYY-MM-DD>` 等）を持つ。これをそのまま `portal-input/build-manifests-from-docs.sh` へ与えると、プレースホルダの文字列が一覧の値として載ってしまう。往復検証を実行するたびに、雛形36件を出力先の正しい構造（`output-layout.json` の各 `\u003ckind>UnitRoot` 配下）へ複製し、識別子・日付等のプレースホルダを検証用の固定値で埋める必要があり、この複製・置換・配置先解決を対話セッションのたびに手動再現するのは非現実的である。雛形は他スキルの複製元であり書き込み厳禁のため、複製先を独立させ、雛形自身のハッシュ不変を self-test で検査する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 雛形36件それぞれの frontmatter 構造（種別ごとに異なるキー名・screen固有のscenariosマップ構造）を対話セッションのたびに手動で置換すると、置換漏れ・雛形への誤書き込みのリスクを毎回背負う\n- 既存 `verification-env.sh` への機能追加: あちらは使い捨て作業領域のライフサイクル管理（発番・作成・削除・版記録）のみが関心であり、雛形の複製・プレースホルダ置換という中身の変換処理とは対象・関心が異なる\n- 既存 `output-layout.sh` への同居: あちらは出力配置パスの宣言解決のみを担い、frontmatter の置換内容を知るべきでない。本スクリプトは `output-layout.sh` を `source` して配置キーの解決だけを委譲する\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。雛形にフィールドを追加・変更した場合は、本ファイルの `fill_*` 関数群と self-test の `ALLCAPS_TOKENS` / 山括弧トークン一覧を同時に更新する。\n\n**廃棄条件**: 疑似入力による往復検証の仕組み自体を廃止した時、または雛形のプレースホルダ解決をビルド基盤が標準で提供するようになった時。\n\n### check-coverage.sh\n\n**必要性**: `verification-loop/設計.md`「4つの判定基準」の「網羅」は、分母（画面一覧・種別別一覧・マトリクス・規約の階層・デザイン系ページ・ポータルトップ）に載る成果物が生成物へすべて存在することを求めるが、分母は `portal-catalog.json`・`output-layout.json`・`rule-taxonomy.json` の3ファイルに分散して定義されており、往復検証のたびに対話セッションで手動突合するのは非現実的で欠落の見落としを招く。特に規約の階層（親 parent.yml・子 rule.md・子 design-notes.md）は `rule-taxonomy.json` の親子キーが増減するたびに件数が変わるため、件数をハードコードせず実行時に動的導出する必要がある。第3層（一気通貫）の合否判定から繰り返し呼ばれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 3ファイルへ分散した分母定義を対話セッションのたびに手で突合すると、実行のたびに対象漏れや集計基準のぶれが生じる\n- 分母件数のハードコード: `verification-loop/設計.md` 記載の「規約の階層55件・総分母76件」は現行の `rule-taxonomy.json`（子27件）とは算術的に整合しない（親7+子27+子27=61件であり55件にならない）既知の乖離があり、固定値を書くと taxonomy 側の増減に追従できず検査が形骸化する\n- 既存 `run-layer-machine-checks.sh` への同居: あちらは第1層（自己テストの横断実行・集計）が関心であり、生成物ディレクトリと分母定義ファイルの突合という第3層の判定とは対象・関心が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。分母の追加・除外を変える場合は `verification-loop/設計.md`「網羅の分母」節と本ファイルと本スクリプトと self-test を同時に更新する。`verification-loop/設計.md` 側の55/76という数値と実際の動的導出値（本稿時点で61/82）の乖離は、本スクリプトの担当外（同ファイルは他の作業者が編集中のため本スクリプトからは Read 専用として扱う）であり、値の更新は文書の保守責任者が別途行う。\n\n**廃棄条件**: 網羅の判定基準を廃止した時、またはビルド基盤が分母突合を標準機能として提供するようになった時。\n\n### check-self-contained.sh\n\n**必要性**: `verification-loop/設計.md`「4つの判定基準」の「自立」は、第3層の生成連鎖がこのリポジトリのスキルと同梱スクリプトだけで動くこと（このマシン固有のホーム配下・絶対パスへ依存しないこと）を求める。この判定は参照パスの静的走査でしか機械化できず、対話セッションのたびに数十本のスクリプトを目視確認するのは非現実的で見落としを招く。走査範囲を生成連鎖が実際に呼ぶ48本（6ディレクトリ＋6ファイル）に限定する必要があり、範囲をリポジトリ全体に広げると同期登録・規約提案生成等の無関係な補助スクリプトが必然的に外部参照を持つため、検査が常に失敗する無意味なものになる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 48本・約3万行を対話セッションのたびに `grep` で手動走査すると、コメント行の除外や `${var#pattern}` 系の誤検出回避を毎回手作業で行うことになり、判定基準がぶれる\n- リポジトリ全体の無差別走査: 生成に関与しない補助スクリプト（`check-derived-drift.sh`・`check-glossary-sync.sh` 等）はこのリポジトリ自身の保守用に意図的にホーム配下を参照しており、無差別に走査すると常に違反が出て「自立の判定基準」自体が使い物にならなくなる\n- 既存 `check-derived-drift.sh` への同居: あちらは生成済み派生物のハッシュ台帳突合が関心であり、スクリプト本文の参照パス走査とは検査対象も判定式も異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。生成連鎖に新しいスクリプトを追加する場合は本ファイルの走査対象一覧（6ディレクトリ＋6ファイル）と `verification-loop/設計.md` と本スクリプトの `SCAN_DIRS`・`SCAN_FILES` を同時に更新する。\n\n**廃棄条件**: 自立の判定基準を廃止した時、またはビルド基盤が参照パスの静的走査を標準機能として提供するようになった時。\n\n### check-reproducible.sh\n\n**必要性**: 往復検証は「同じ入力から2回生成した成果物が一致するか（再現するか）」を判定する工程を持つ。この判定は、2つのディレクトリ配下の全ファイルについて相対パスとハッシュを突合し、片方にしか無いファイル・内容が違うファイル・一致するファイルの3種を区別する必要がある。手動で2つのディレクトリを目視突合するのは非現実的で、対象ファイル数（実測291件）の規模では見落としが必ず起こる。生成のたびに繰り返し実行する判定器のため、決定的なスクリプトとして1本に閉じる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: `diff -r` 等を対話セッションのたびに手動実行すると、除外パターンの適用漏れや `[SAME|DIFF|ONLY-FIRST|ONLY-SECOND]` という往復検証フロー固有の分類・集計を毎回再現する必要があり非効率\n- 既存 `verification-env.sh` への機能追加: あちらは使い捨て作業領域のライフサイクル管理（発番・作成・削除・版記録）のみが関心であり、2つの生成物ディレクトリの内容突合という判定処理とは対象・関心が異なる\n- 既存 `test-e2e-portal.sh` / `test-portal-conventions.sh` への機能追加: あちらは単一の生成物ディレクトリに対する規約適合・リンク整合の検査が関心であり、2回の生成結果を突き合わせる再現性判定とは検査対象（単一 vs. 2つの比較）が根本的に異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。ハッシュアルゴリズムや除外規則の既定値を変更する場合は本ファイルと self-test を同時に更新する。\n\n**廃棄条件**: 往復検証における再現性判定の仕組み自体を廃止した時、またはビルド基盤がディレクトリ間の内容突合を標準機能として提供するようになった時。\n\n### check-sound.sh\n\n**必要性**: 往復検証は「生成物が健全か（E2Eリンク・整合と規約に適合しているか）」を判定する工程を持つが、この判定は既存の `test-e2e-portal.sh` と `test-portal-conventions.sh` が既に担っており、新たな検査ロジックを重複実装すべきではない。往復検証フローから2本を毎回個別に呼び分けて終了コードを目視で突合するのはトークンを浪費し、片方の失敗を見落とすリスクがある。2本への委譲と終了コード・出力の集計だけを行う薄いラッパーとして1本に閉じ、往復検証フローから単一の呼び出しで健全性を判定できるようにする。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 2本のスクリプトを対話セッションのたびに手動で順次実行し、終了コードと出力末尾を目視で集計すると、実行のたびに集計基準がぶれ、片方の失敗を見落とすリスクを毎回背負う\n- 既存 `test-e2e-portal.sh` / `test-portal-conventions.sh` への検査ロジックの追加・統合: 両者は改善課題1-138の横断検収条件の対象外として既に独立した役割（E2Eリンク整合検査・規約リンタ）を持ち、それぞれ既存の self-test（`test-portal-conventions-regression.sh` 等）で保守されている。本スクリプトは検査ロジックを持たず2本への委譲のみを行うことで、既存2本の責務を一切侵さない\n- 既存 `run-layer-machine-checks.sh` への機能追加: あちらは `generation-engine/scripts/` 配下に散らばる70本以上の自己テストを横断実行する汎用エンジンであり、往復検証の「健全性判定」という特定2本への委譲とは対象範囲・呼び出し契約が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。委譲先の2本の呼び出し契約（位置引数の意味）が変わった場合は本ファイルと self-test を同時に更新する。\n\n**廃棄条件**: 往復検証における健全性判定の仕組み自体を廃止した時、または委譲先の2本が統合・廃止された時。\n\n### check-payload-references.sh\n\n**必要性**: 「検証の結果を信用できるようにする指示書」3.3〜3.5 は、配布物（`delivery-payload/`・`generation-engine/`）の中の説明・規約が、存在しないファイルへ参照していないかを機械で調べることを求める。実際に配布物の資料の参照を機械で調べたところ、切れている参照が複数見つかっており、手動で全 334 件の Markdown・HTML を毎回目視突合するのは非現実的で見落としを招く。Markdown リンク・HTML の href/src・バッククォート囲みのパスという3種の「参照の形」に候補を絞り、ファイル自身のディレクトリ起点とリポジトリルート起点の2段階で解決を試みることで、外部参照や環境固有パスを誤検出せずに壊れた参照だけを機械的に検出できる。往復検証や規約カード追加のたびに繰り返し使うため、繰り返し実行可能なスクリプトとして1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 334件のMarkdown・HTMLを対話セッションのたびに手動でgrep・目視突合すると、判定基準がぶれ、実際に見落としが起こる\n- 既存 `check-delivery-doc-links.sh` への機能追加: あちらは「納品対象が配られない docs/ を指していないか」（docs/ を含むリンクだけが対象）に特化した判定であり、docs/ を含まない一般の相対参照（例: generation-engine/scripts/ 配下のスクリプト参照）は対象外。関心が異なる\n- 既存 `check-skill-reference-paths.sh` への機能追加: あちらは `.claude/skills/*/SKILL.md` のみを走査対象とし、`delivery-payload/references/`・`generation-engine/` 配下の Markdown・HTML には対象が及ばない。対象ディレクトリを広げると SKILL.md 固有の参照記法（相対の `../../../` 深さ固定）の前提が崩れる\n- 既存 `check-self-portal-links.sh` への機能追加: あちらはこのリポジトリ自身のポータル（`docs/portal/index.html`）1ページのリンク切れが関心であり、配布物全体の走査とは対象範囲が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。候補パスの抽出パターン（Markdownリンク・href/src・バッククォート）や対象外パターン（外部参照・アンカーのみ・ホーム配下）を増減する場合は本スクリプトと self-test を同時に更新する。\n\n**廃棄条件**: 配布物の参照切れ検査自体を廃止した時、またはビルド基盤がリンク切れ検査を標準機能として提供するようになった時。\n\n### run-authoring-mode.sh\n\n**必要性**: 決定的なスクリプトでは作れない設計文書の Markdown（画面・API・テーブル・バッチ・帳票・外部連携の各設計書、および共通設計書）の執筆は、判断を要するため機械的な生成器では代替できない。これらは「verification-loop/設計.md」の網羅の分母から明示的に除外されている（「本文の執筆に判断を要する」）。この執筆工程を対話モデル（`claude -p`）へ委ねる別モードは、生成連鎖の3段目（マニフェストの組み立て）の直前という特定の位置に挟み込む必要があり、既定では絶対に到達させてはならない（対話モデルの実行は非決定的で、自己テストに組み込めず、往復検証の「再現」判定と衝突するため）。この「既定で無効・明示的な有効化でのみ到達」という安全装置と、位置の定義と、`claude -p` の呼び出し構成を1箇所に固定するには、繰り返し参照可能なスクリプトとして1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 対話セッションのたびに `claude -p` のフラグ構成（allowedTools・permission-mode・output-format・no-session-persistence・model）を手で組み立てると、既定無効の安全装置を毎回人手で守る必要が生じ、誤って対話モデルを既定実行してしまうリスクを負う\n- 既存 `generation-engine/scripts/verification/` 配下の各スクリプト（`check-coverage.sh` 等）への機能追加: あちらは4判定（網羅・自立・再現・健全）の機械検証を担い、対話モデルを呼ばない決定的な判定器として設計されている。対話モデルの呼び出しを混ぜると、既存スクリプトの「決定的である」という前提が崩れる\n- `running-reverse-screen-batch` の per-item prompt への統合: あちらは画面のリバース検証に特化した無人バッチループであり、設計文書の執筆モードという別の関心を持ち込むと既存のバッチ契約（前半・後半の盲検分離等）に無関係な分岐が増える\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。挟み込む位置（生成連鎖の段）や執筆対象種別を変更する場合は本ファイルとこのリポジトリ自身の検証設計文書（配布対象外）と本スクリプトを同時に更新する。\n\n**廃棄条件**: 対話モデルを挟む別モード（著述モード）自体を廃止した時、または決定的な生成器だけで設計文書の Markdown を再現できるようになった時。\n\n### build-rule-flow-map.sh\n\n**必要性**: 納品先で動くAIエージェントと人間のエンジニアが「いま基本設計をしている。どの規約を見ればよいか」「この規約はいつ効くのか」を引ける索引ページが無かった。`delivery-payload/references/rule-taxonomy.json`（親7・子27）はフェーズ対応（`phases`）と適用範囲（`scope`・`paths`）を既に構造化データとして持つが、これを読む場所がスキル定義（`delivery-payload/references/`）の中に閉じており、納品先ポータルからは参照できなかった。表を手で書くと規約を1件足すたびに実体とずれる（同種の事故が全体ガイドのスキル件数で実際に起きている）。フェーズから引く見方（7区分×該当規約）と規約から引く見方（親カテゴリ7件×27規約の表）という2種類の集計・整列をrule-taxonomy.jsonから都度導出し、tokens.css・共通シェル（サイドバー・フッター・方眼紙背景・全画面フィットレイアウト）の注入までを一貫して行うには、繰り返し実行可能なスクリプトとして1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: フェーズ区分ごとの絞り込み・親カテゴリごとの集計・HTMLエスケープ・共通シェル注入という複数段の変換を対話セッションのたびに手で組み立てると、再生成のたびに判定基準がぶれ、表の内容を誤って直書きする事故を誘発する（本ページの禁止事項そのもの）\n- `build-derived-rules.sh`（同ディレクトリ）への機能追加: あちらは `docs/rules/` の規約定義本文（Markdown front matter）から `.claude/rules/`・`.cursor/rules/`・`AGENTS.md`・hooks 登録という配布物一式を生成する規約の配布器であり、入力（docs/rules配下のrule.md群）も出力（配布先の設定ファイル群）も本スクリプトとは異なる。本スクリプトは `delivery-payload/references/rule-taxonomy.json`（規約の分類メタデータ）1本を入力に、納品先ポータルのHTML1枚だけを出力する読み取り専用の索引生成器であり、関心が異なる\n- `build-matrix-pages.sh` への page-type 追加: あちらはテンプレートファイル + JS描画（`\u003cscript>`内でJSONをパースしてDOM構築）という契約を持ち、page-type追加には対応するテンプレートHTMLの新設が要る。本スクリプトは完了条件（新規テンプレートファイルを作らない）の下で、HTML全体をスクリプト内でサーバサイド組み立てする方式を取るため、テンプレート前提のbuild-matrix-pages.shとは生成方式が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。フェーズ区分（`PHASE_ORDER`）を増減する場合は本スクリプトと `delivery-payload/references/rule-taxonomy.json` の `phases` 語彙と本節を同時に更新する。`validate_phase_vocabulary` が未知のphases値を検出してエラー停止するため、語彙の追従漏れは生成時に機械的に検知される。\n\n**廃棄条件**: 「規約とフローの対応」ページ自体を廃止した時、またはrule-taxonomy.jsonからの索引生成をビルド基盤が標準で提供するようになった時。\n\n**`--target-root` 追加（2026-08-18改修、対象プロジェクトの実態を反映させる指示書.md 3.4）**: 当初は `rule-taxonomy.json`（配布物の中の定義）だけを情報源とし、対象プロジェクト側の `docs/rules/` フォルダの実在を読まなかった。定義に27件あっても対象側の実体が26件なら、索引には実在しない1件を含む27件全件が載り、生成コマンドは終了コード0のまま不整合を報告しなかった。`--target-root \u003c対象リポジトリのルート>` を追加し、指定時は `\u003ctarget_root>/docs/rules/\u003c親key>/\u003c子key>/rule.md` の実在を情報源に含める。実在しない子カテゴリは索引へ載せない（決めていないこと3の選択: 実体が無い規約を明示して載せる案ではなく、載せない案を採った。理由は、載せて灰色表示にする方式は他ページの`disabledWhenEmpty`パターンと混同されやすく、「規約とフローの対応」は分類の定義ではなく対象プロジェクトの実際の適用状況を引く場であるため、載っている＝実在するという単純な対応を優先した）。件数（見出し・`{{RULE_COUNT}}`）はtaxonomyの定義件数ではなく実在件数を報告し、両者が食い違う場合は生成時に標準出力へ差を報告する（buildは失敗させないadvisory）。`--target-root` 省略時は従来どおり定義件数のまま全件出力する（後方互換）。\n\n実装上の注意（macOS bash 3.2 の `set -u` との相性）: 件数の算出を `build_rule_view`（コマンド置換 `$(...)` 経由で呼ばれる）の内部でグローバル変数へ書き込む形にすると、コマンド置換はサブシェルを作るため呼び出し元へ値が伝わらず、`set -u` 下では未定義変数エラーで生成コマンド自体が失敗する（自己テストで実際に踏んだ）。件数の算出は `count_actual_rules` という独立関数へ切り出し、`run_build` が個別に呼ぶことで解決した。\n\n**廃棄条件（追記分）**: `--target-root` は「規約とフローの対応」ページの対象側実態反映自体を廃止した時、または対象側の実在確認をビルド基盤が標準で提供するようになった時に併せて廃止する。\n\n### record-verification-result.sh\n\n**必要性**: 検証ループの各判定（網羅・自立・再現・健全・第1層・第3層）の結果は、実行するたびに画面へ出て消えるだけで、版（コミットハッシュ）に紐づく形で残らなかった。前回どの判定が不合格で、今回それが直ったのかを辿るには、実行1回分を版付きで台帳（このリポジトリ自身の実行記録。配布対象外）へ機械的に追記する必要がある。追記位置（`## 記録` 見出し直後・新しい記録が上）・版の形式検査（40文字の16進）・省略項目の「未実行」表記という複数の決まりごとを持ち、繰り返し実行するたびに同じ規則を再現する必要があるため、対話セッションでの都度組み立てでは規則がぶれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 追記位置の決定・版の形式検査・6項目の省略時デフォルト（未実行）という複数段の分岐を対話セッションのたびに手で組み立てると、実行のたびに追記位置や表記がぶれる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 各判定スクリプト（check-coverage.sh 等）への機能追加: あちらは個々の判定（分母と存在の突合等）そのものが関心であり、判定結果を台帳へ記録するという横断的な関心とは対象が異なる。判定を追加するたびに記録ロジックが重複する\n\n**保守責任者**: 人手（ユーザー）。台帳の節の形式（表の項目・見出しの形式）を変える場合は、本スクリプトとこのリポジトリ自身の実行記録（配布対象外）の「記録の形式」節と self-test を同時に更新する。\n\n**廃棄条件**: 検証ループ自体を廃止した時、または検証結果の記録をビルド基盤が標準で提供するようになった時。\n\n### compare-with-previous.sh\n\n**必要性**: 台帳へ記録が積み上がっても、最新2件を比べて「どの判定が直り、どの判定が壊れたか」を人手で読み比べるのはトークンを浪費し、判定ごとの合否基準（`欠落 \u003cN> 件` の N が0なら合格、等）を毎回思い出しながら手作業で突合すると見落としを生む。判定ごとに異なる集計行の書式（網羅は「欠落」、自立は「違反」、第3層は「失敗」のみで単位無し、第1層は「失敗」と「途中停止の疑い」の両方を見る等）から合否を機械的に導出し、「未実行」を合否判定から除外したうえで直った・壊れた・変わらないを分類する必要があるため、繰り返し実行可能なスクリプトとして1本に閉じる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 判定ごとに異なる集計行の書式を読み分け、前回・今回・変化を都度手作業で突合すると、実行のたびに判定基準がぶれ、実際に見落としを生みやすい\n- `record-verification-result.sh` への機能追加: あちらは台帳への追記（書き込み方向）が関心であり、本スクリプトは台帳の読み取りと突合（読み取り方向）が関心で、処理の向きが逆\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。判定ごとの合否基準（集計行のラベルと数値抽出規則）を変える場合は、本スクリプトと `record-verification-result.sh` と self-test を同時に更新する。macOS 標準 awk の多バイト文字列 `==` 比較の不具合（`LC_ALL=C` での回避）は、判定ラベルの追加時にも踏襲する。\n\n**廃棄条件**: 検証ループ自体を廃止した時、または前回比較をビルド基盤が標準で提供するようになった時。\n\n### record-deferral.sh\n\n**必要性**: このリポジトリ自身の退避記録（配布対象外）は「実行が要る」という理由だけでの退避を禁じるが、この禁止は手書きの記入時に守られるとは限らない。実際に登録済みの退避7件は登録後1件も実行されていない実績があり、記入の強制力を書式の縛りだけに頼ると同じ抜け道が残る。`--tried`・`--failed`・`--condition` を必須引数にし、1つでも欠けたら終了コード1で拒否することで、退避を記録する経路そのものを塞ぐ必要がある。追記位置（`## 記録` 見出し直後・新しい記録が上）・版の形式検査（40文字の16進）は `record-verification-result.sh` と同じ規則であり、繰り返し実行するたびに同じ規則を再現する必要があるため、対話セッションでの都度組み立てでは規則がぶれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 必須引数の判定・追記位置の決定・版の形式検査という複数段の分岐を対話セッションのたびに手で組み立てると、必須化の徹底自体が実行者の裁量に戻ってしまう\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `record-verification-result.sh` への機能追加: あちらは判定結果（合否の集計行）を台帳へ記録するスクリプトであり、追記先の台帳も項目の形も別物（実行記録 vs 退避記録）で、必須引数の性質（判定結果は省略可・退避の経緯は省略不可）も逆であるため、同居させると省略可否の分岐が複雑になる\n\n**保守責任者**: 人手（ユーザー）。台帳の節の形式を変える場合は、本スクリプトとこのリポジトリ自身の退避記録（配布対象外）の「記録の形式」節と self-test を同時に更新する。\n\n**廃棄条件**: 検証ループ自体を廃止した時、または退避の記録をビルド基盤が標準で提供するようになった時。\n\n### run-verification-loop.sh\n\n**必要性**: 検証ループの各段（版の取得・第1層・使い捨ての出力先の用意・疑似入力と第3層の2回実行・4判定・台帳への記録・前回との比較・出力先の破棄）は、既存の個別スクリプトに分かれており、1回の検証のたびに8個のコマンドを手で順に組み立てて実行していた。段の順序や各スクリプトへ渡す引数（1回目・2回目の出力先の対応、判定結果を記録スクリプトへ渡す集計行の対応等）を対話セッションのたびに再現すると、渡し間違いや段の飛ばし忘れが起こる。1本の入口へ8段を集約し、`--skip-layer1`・`--no-record` で個別に省略できる構成にすることで、繰り返し実行を安定させる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 8段のコマンドを毎回手で順に実行すると、出力先2つの対応関係や集計行の受け渡しを都度組み立てることになり、実行のたびに手順がぶれる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `run-layer-full-pipeline.sh` への機能追加: あちらは第3層1回分の生成連鎖が関心であり、本スクリプトは第3層を2回呼んだうえで4判定・記録・比較まで束ねる上位の入口で、関心の階層が異なる\n\n**保守責任者**: 人手（ユーザー）。呼び出す既存スクリプトの引数契約が変わった場合は、本スクリプトの各 stage_* 関数と self-test を同時に更新する。\n\n**廃棄条件**: 検証ループ自体を廃止した時、または段の集約実行をビルド基盤が標準で提供するようになった時。\n### build-deliverable-inventory.sh\n\n**必要性**: 「納品物の出力有無の理由が読み手に分からない」問題への対応として、納品物ごとに「出力あり／対象なし／未生成」の状態と理由を1枚で示す一覧が無かった。画面が0件のプロジェクトでは画面一覧も画面の設計書も出力されないが、読み手にはそれが「まだ生成していない」のか「対象が無いので出力されない」のかを区別する材料が無かった。定義は既存2定義元の結合で作る。`portal-catalog.json`は納品物・出力先・生成元の定義元である。もう一方は、本スクリプト専用に新設した `delivery-payload/references/deliverable-inventory.json`である。これは状態をどの証拠で判定するかだけを宣言する（カタログには無い情報である）。60件のkindがカタログと定義で1:1対応することを起動時に検査し、片方だけの追加・削除を検出する。状態判定は3分岐（出力あり＝実ファイル存在／対象なし＝マニフェスト存在かつ件数0／未生成＝マニフェスト不在または証拠概念そのものが無い）で行う。この結果を、HTML（project-portal共通シェル）とMarkdown（docs/配下、時点表明つき）の2形式へ同じ導出結果から生成する。往復検証や規約カード追加のたびに繰り返し使うため、繰り返し実行可能なスクリプトとして1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 60件の納品物についてHTML実在・マニフェスト実在・マニフェスト内件数の3段判定を対話セッションのたびに手で組み立てると、判定基準がぶれ、HTML/Markdown間で結果が食い違う事故を誘発する\n- `portal-catalog.json` 自体への状態・理由フィールド追加（新規定義ファイルを作らない案）: カタログは納品物・出力先・生成元の定義である。状態・理由・証拠源（マニフェストのキー名や件数ポインタ）はカタログの関心事ではない。検討したが、状態はビルド時点の観測値であり定義ではない。`disabledWhenEmpty` だけでは「対象なし」と「未生成」を区別できない（本スクリプトの調査で判明した事実。0件が対象なしか未実行かは、カタログの情報だけでは判定できない）。この区別には証拠源の宣言が要るため、新規定義ファイルが不可欠と判断した\n- `build-rule-flow-map.sh` への機能追加: あちらは `rule-taxonomy.json` 1本を入力に規約とフローの対応だけを扱う索引生成器であり、カタログ60件全種別の状態判定という関心・入力データが異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`portal-catalog.json` にblueprintを追加・削除する場合は `delivery-payload/references/deliverable-inventory.json` の `items` にも対応する1件を追従させる（追従漏れは起動時のカタログ被覆検査がエラーで検出する）。マニフェストを持つ種別（screen/api/table/batch/report/external/feature）を増減する場合は定義の `evidenceSource`・`manifestKey`・`countPointer` を同時に更新する。\n\n**廃棄条件**: 「納品物一覧」ページ自体を廃止した時、またはカタログと出力状態の突合をビルド基盤が標準で提供するようになった時。\n\n### check-read-before-overwrite.sh\n\n**必要性**: 規約の規則の違反が hooks で機械検知できるという判定のうち、既存の実例が無く類推にとどまっていた項目（「上書きの前に既存を読む」）を実証する試作。PreToolUse(Write) で書き込み先が既存ファイルの場合に、同一セッションの transcript 内に対象ファイルへの Read の tool_use が記録されているかを判定する。実際のセッション transcript（`~/.claude/projects/*/*.jsonl`）を `jq` で走査し、Read の tool_use が `{\"type\":\"assistant\",\"message\":{\"content\":[{\"type\":\"tool_use\",\"name\":\"Read\",\"input\":{\"file_path\":\"...\"}}]}}` の形で記録されていることを確認済みで、この形式に対して file_path の一致判定を機械的に行えることを self-test で実証した。判定は都度セッションごとに変わり、対話セッションのたびに手で transcript を読み比べるのは非現実的なため、hook として繰り返し実行できるスクリプトが要る。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で transcript を確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。transcript の tool_use 記録形式（`.message.content[].type==\"tool_use\"`）が変わった場合は本スクリプトの jq クエリを追従させる。\n\n**廃棄条件**: 「上書きの前に既存を読む」規約自体を廃止した時、または Claude Code 本体が上書き前 Read を標準機能として強制するようになった時。\n\n### check-completion-evidence.sh\n\n**必要性**: 規約の規則の違反が hooks で機械検知できるという判定のうち、既存の実例が無く類推にとどまっていた項目（「完了報告に実行結果を添える」）を実証する試作。Stop hook で最終応答本文に完了表現があるにもかかわらず実行結果の痕跡（コードフェンス・PASS/FAIL・拡張子付きパス・diff 行のいずれか）が無ければ block する。「実行結果が添えられている」という抽象的な要求を、grep で判定可能な4種の文字列痕跡へ落とし込めるかが焦点であり、term-explanation（`~/.claude/rules/always/review-checklist/term-explanation/`）の gloss 判定と同型の operationalize が可能であることを self-test で実証した。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: Stop イベントに自動バインドできず、応答のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。完了表現の語彙・証跡パターンを増減する場合は本スクリプトの `COMPLETION_RE` と `has_evidence` を同時に更新する。\n\n**廃棄条件**: 「完了報告に実行結果を添える」規約自体を廃止した時、または完了報告の証跡添付を別の機構が標準で保証するようになった時。\n\n### check-delegation-completion-criteria.sh\n\n**必要性**: 規約の規則の違反が hooks で機械検知できるという判定のうち、既存の実例が無く類推にとどまっていた項目（「完了条件を渡す」）を実証する試作。PreToolUse(Agent) で委任 prompt に完了条件の見出しまたは明示的な記述が無ければ block する。既存の `check-evidence-checklist.sh`（同じ timing で prompt 内の見出し「## 調査チェックリスト」の有無を検査する）と機構がほぼ同一であり、3試作のうち実例に最も近いことを確認した。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Agent 委任のたびに手動で prompt を確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。完了条件の見出し・語彙を変更する場合は本スクリプトの `judge` 内の grep パターンを同時に更新する。\n\n**廃棄条件**: 「完了条件を渡す」規約自体を廃止した時、または委任 prompt の完了条件明示を別の機構が標準で保証するようになった時。\n\n### delivery-payload/templates/rules/checkers/ の回帰テスト3本\n\n**必要性**: 整合検査（`validate-rule-definitions.sh` の「検査-テスト同伴」）は、front matter が `checker` を宣言する規約に対し、`\u003cchecker のベース名>.test.sh` が同じフォルダに実在することを要求する。納品する規約 3 件が linter を同梱するため、この要求を満たすテストが要る。`check-read-before-overwrite.test.sh`・`check-completion-evidence.test.sh`・`check-delegation-completion-criteria.test.sh` の 3 本は、対応する本体が持つ `--self-test` を実行して終了コードをそのまま返すラッパーである。3 本は構造も判断も同一のため 1 つの節にまとめる。判定の中身を写して持たないのは、本体の `--self-test` を唯一の正とし、両者がずれたときにどちらが正しいか分からなくなる事態を避けるためである。\n\n**代替案を採用しなかった理由**:\n- 本体の `--self-test` を廃してテスト側へ判定を移す: `--self-test` を持つスクリプトは `run-layer-machine-checks.sh` が集めて一括実行する。廃すとこの集約から外れ、第 1 層の機械検証で走らなくなる\n- 整合検査の「検査-テスト同伴」を緩めてテストを不要にする: この検査は linter に回帰テストを同伴させるための仕組みであり、納品先で linter が壊れたことを検知する唯一の手段になる。緩めると検知そのものが失われる\n- Bash ツール直叩き: 納品先で繰り返し実行するテストであり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本テスト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。本体の `--self-test` の呼び出し方（引数）を変える場合は 3 本のラッパーも同時に更新する。\n\n**廃棄条件**: 対応する linter が納品対象から外れた時、または整合検査の「検査-テスト同伴」が廃止された時。\n\n### check-review-viewpoints-list.sh\n\n**必要性**: レビュー方針書の 2 規則を機械検知する linter。「規約が求めるレビューを観点とする」は、規約の md の規則の表の各行に検査の手段が明示されているかを見る。手段の明示が無い規則は、レビューで何を見るかが読み手ごとに変わる。「機械で見つかるものは機械へ任せる」は、静的解析の設定が実在するかを見る。設定が無ければ、機械が見つけるものを人が見ることになる。どちらも書き込みのたびに人が目視で確かめるのは現実的でなく、判定を繰り返し同じ基準で再現するにはスクリプトへ固定する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、書き込みのたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。検査の手段として認める語や、静的解析の設定として探すファイルの名前を増減する場合は、本スクリプトと本節を同時に更新する。\n\n**廃棄条件**: レビュー方針書の当該 2 規則を廃止した時、または規約の規則の表の形式の検査を別の機構が標準で提供するようになった時。\n\n**既知の限界**: スクリプトの名前は「観点の一覧」を指すが、書き直した後の中身は観点の一覧を検査しない。この食い違いは、規約の名前を中身が読める形へ改める指示書で解消する。当初は「観点の一覧を先に持つ」という規則の検査として作られたが、現在の規約にその規則名は無く、代わりに「観点の一覧を別の文書として持たない」と定められている。規約を正として中身を書き直した経緯がある。\n\n### check-doc-heading-addendum.sh\n\n**必要性**: ドキュメント作成規約の規則「追記章と補足章を作らない」は、章立てを設計し直さずに内容を末尾へ足す行為を禁じる。この違反は Markdown の見出し行が「追記」「補足」「その他」で始まるかどうかという構文パターンとして機械的に検出でき、Write/Edit のたびに本文全体を人手で読み直すのはトークンを浪費する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write/Edit のたびに手動で見出しを確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。禁止する見出し語を増減する場合は本スクリプトの `HEADING_RE` を同時に更新する。\n\n**廃棄条件**: 「追記章と補足章を作らない」規約自体を廃止した時。\n\n### check-generated-html-manual-edit.sh\n\n**必要性**: ポータル保守規約の規則「HTML を直接編集しない」は、生成物である HTML を手作業で上書きする行為を禁じる。生成物の台帳（内容ハッシュの記録）は納品先ごとに置き場所が異なりうるため汎用の linter からは参照できないが、生成器が埋め込む既知のデータマーカー（`id=\"page-data\"` 等）はファイル内容だけで完結する「生成物である」目印として使える。この判定を Write/Edit のたびに人手で確認するのは非効率である。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write/Edit のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。生成物マーカーの種類を増減する場合は本スクリプトの `MARKER_RE` を同時に更新する。\n\n**廃棄条
