件**: 「HTML を直接編集しない」規約自体を廃止した時、または生成物と手書きファイルの区別を別の機構が標準で保証するようになった時。\n\n### check-secret-literal-in-code.sh\n\n**必要性**: セキュリティ要件の規則「秘密の値をコードへ書かない」は、一度版管理へ入ると履歴から消せない秘密の値の直書きを禁じる。AWS アクセスキーの形式・秘密鍵ヘッダ・鍵らしい識別子への直接代入は、いずれも文字列パターンとして機械的に検出でき、Write/Edit のたびに本文全体を人手で確認するのは非効率かつ見落としの余地がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write/Edit のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。検出パターンを増減する場合は本スクリプトの `AWS_KEY_RE`・`PRIVATE_KEY_RE`・`ASSIGN_RE` を同時に更新する。\n\n**廃棄条件**: 「秘密の値をコードへ書かない」規約自体を廃止した時、または秘密値の検出を別の機構（専用の secret scanner 等）が標準で保証するようになった時。\n\n### check-loop-query-call.sh\n\n**必要性**: 性能要件の規則「繰り返しの中で問い合わせを発行しない」は、件数に比例して問い合わせが増える、いわゆる N+1 問題を禁じる。繰り返し構文の開始行の近傍に問い合わせ呼び出しが現れるという構文パターンは機械的に検出でき、Write/Edit のたびに本文全体を人手で読み直すのは非効率である。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write/Edit のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。繰り返し構文・問い合わせ呼び出しのパターンを増減する場合は本スクリプトの `LOOP_RE`・`QUERY_RE`・近傍窓（`WINDOW`）を同時に更新する。\n\n**廃棄条件**: 「繰り返しの中で問い合わせを発行しない」規約自体を廃止した時、またはこの検出を静的解析基盤が標準で提供するようになった時。\n\n### check-outbound-call-missing-timeout.sh\n\n**必要性**: 可用性要件の規則「外部への依存に失敗時の扱いを持たせる」は、外部との通信へ待ち時間の上限を持たせることを求める。外部呼び出しの近傍に \"timeout\" の語があるかどうかという構文パターンは機械的に検出でき、Write/Edit のたびに本文全体を人手で読み直すのは非効率である。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write/Edit のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。外部呼び出しのパターンを増減する場合は本スクリプトの `CALL_RE` を同時に更新する。\n\n**廃棄条件**: 「外部への依存に失敗時の扱いを持たせる」規約自体を廃止した時、またはこの検出を静的解析基盤が標準で提供するようになった時。\n\n### delivery-payload/templates/rules/checkers/ の回帰テスト6本（今回追加分）\n\n**必要性**: 整合検査（`validate-rule-definitions.sh` の「検査-テスト同伴」）は、front matter が `checker` を宣言する規約に対し、`\u003cchecker のベース名>.test.sh` が同じフォルダに実在することを要求する。今回追加した6件の linter（`check-review-viewpoints-list.sh`・`check-doc-heading-addendum.sh`・`check-generated-html-manual-edit.sh`・`check-secret-literal-in-code.sh`・`check-loop-query-call.sh`・`check-outbound-call-missing-timeout.sh`）にも同じ要求が及ぶ。`check-review-viewpoints-list.test.sh`・`check-doc-heading-addendum.test.sh`・`check-generated-html-manual-edit.test.sh`・`check-secret-literal-in-code.test.sh`・`check-loop-query-call.test.sh`・`check-outbound-call-missing-timeout.test.sh` の6本は、既存3本と同じ構造（対応する本体の `--self-test` を実行して終了コードをそのまま返すラッパー）を持つため、判断も同一として1つの節にまとめる。\n\n**代替案を採用しなかった理由**:\n- 本体の `--self-test` を廃してテスト側へ判定を移す: `--self-test` を持つスクリプトは `run-layer-machine-checks.sh` が集めて一括実行する。廃すとこの集約から外れ、第 1 層の機械検証で走らなくなる\n- 整合検査の「検査-テスト同伴」を緩めてテストを不要にする: この検査は linter に回帰テストを同伴させるための仕組みであり、納品先で linter が壊れたことを検知する唯一の手段になる。緩めると検知そのものが失われる\n- Bash ツール直叩き: 納品先で繰り返し実行するテストであり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本テスト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。本体の `--self-test` の呼び出し方（引数）を変える場合は対応するラッパーも同時に更新する。\n\n**廃棄条件**: 対応する linter が納品対象から外れた時、または整合検査の「検査-テスト同伴」が廃止された時。\n\n### check-secret-value-logging.sh\n\n**必要性**: 監視要件の規則「秘密の値と個人の情報を記録しない」を機械検知する linter。検査列は「記録の出力に秘密の値らしい変数が渡されていないかを走査する」と定める。ログ出力の呼び出し語彙（`console.log`・`logger.info`等）と秘密の値らしい識別子（password/secret/token/apikey/credential等）は、どちらも記号的な文字列パターンとして特定でき、両者の同一行での共起を PreToolUse(Write) の `tool_input.content`（Write は常に全文を渡す）に対する grep の2段フィルタで機械的に検出できる。走査対象・一致条件がともに納品先の対象プロジェクト構成に依存しない（stdin JSON と正規表現の語彙だけで完結する）ため、配布時点で実装できると判断した。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。ログ呼び出し語彙・秘密語彙を増減する場合は本スクリプトの `LOG_RE`・`SECRET_RE` を同時に更新する。\n\n**廃棄条件**: 監視要件の当該規則自体を廃止した時、またはログ出力の安全性検査を別の機構が標準で保証するようになった時。\n\n### check-state-literal-comparison.sh\n\n**必要性**: 状態遷移の制約の規則「状態を文字列の直接の比較で扱わない」を機械検知する linter。検査列は「状態の判定に文字列の直接の比較が無いかを走査する」と定める。status/state を含む識別子と文字列リテラルが比較演算子（==/===/!=/!==）で直接結合している箇所は、記号的な特徴（識別子語彙・比較演算子・引用符）だけで PreToolUse(Write) の `tool_input.content` から機械的に検出できる。走査対象・一致条件がともに対象プロジェクト構成に依存しないため、配布時点で実装できると判断した。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。識別子語彙（status/state）や比較演算子を増減する場合は本スクリプトの `IDENT`・`CMP` を同時に更新する。\n\n**廃棄条件**: 状態遷移の制約の当該規則自体を廃止した時、または状態の文字列直接比較の検査を別の機構が標準で保証するようになった時。\n\n### check-currency-float-type.sh\n\n**必要性**: 計算規則の規則「金額を小数で扱わない」を機械検知する linter。検査列は「金額を扱う項目の型に、誤差の出る小数が使われていないかを走査する」と定める。float/double という型キーワードは言語横断で共通の予約語であり、金額らしい識別子語彙（amount/price/cost/fee/total等）との同一行での共起を PreToolUse(Write) の `tool_input.content` から grep の2段フィルタで機械的に検出できる。JavaScript/TypeScript のように float 型キーワードを持たない言語では機能しない既知の限界を持つが、対象を持つ言語（Java/C#/Go等）では走査対象・一致条件が対象プロジェクト構成に依存しないため、配布時点で実装できると判断した。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。金額語彙・対象拡張子を増減する場合は本スクリプトの `MONEY_RE`・`is_typed_ext` を同時に更新する。\n\n**廃棄条件**: 計算規則の当該規則自体を廃止した時、または金額の型検査を別の機構が標準で保証するようになった時。\n\n### check-glossary-missing-forbidden-terms.sh\n\n**必要性**: 用語定義の規則「使ってはいけない語を明示する」を機械検知する linter。検査列は「用語の一覧に使わない語の区分が存在するかを走査する」と定める。用語集ファイルの名前・配置は対象プロジェクトごとに異なる（rule-taxonomy.json の `uncheckableReason` が「走査の対象は対象プロジェクトの構成に依存する」と記す）ため、ファイルパスでの判定は成立しない。走査対象を「ファイルパス」ではなく「PreToolUse(Write) の `tool_input.content` が用語一覧の表という構造を持つかどうか」に置き換えることで、対象プロジェクトの構成に依存せず内容だけから機械的に検出できるようにした。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- ファイルパス（用語集の想定ファイル名）での判定: 対象プロジェクトごとに用語集の配置・命名が異なるため、パス依存の判定は納品先で機能しない\n\n**保守責任者**: 人手（ユーザー）。「使わない語」の区分語彙を増減する場合は本スクリプトの `FORBIDDEN_RE` を同時に更新する。\n\n**廃棄条件**: 用語定義の当該規則自体を廃止した時、または用語一覧の構造検査を別の機構が標準で保証するようになった時。\n\n### check-business-rule-table-missing-exception.sh\n\n**必要性**: 業務規則の規則「例外と境界を明示する」を機械検知する linter。検査列は「判定の表に例外の欄が存在するかを走査する」と定める。業務規則を記述するファイルの名前・配置は対象プロジェクトごとに異なる（rule-taxonomy.json の `uncheckableReason` が「走査の対象は対象プロジェクトの構成に依存する」と記す）ため、ファイルパスでの判定は成立しない。走査対象を「ファイルパス」ではなく「PreToolUse(Write) の `tool_input.content` が条件と結果の対応を示す判定表という構造を持つかどうか」に置き換えることで、対象プロジェクトの構成に依存せず内容だけから機械的に検出できるようにした。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- ファイルパス（業務規則の想定ファイル名）での判定: 対象プロジェクトごとに業務規則の配置・命名が異なるため、パス依存の判定は納品先で機能しない\n\n**保守責任者**: 人手（ユーザー）。判定表の見出し語彙（条件/結果/例外）を変更する場合は本スクリプトの `judge` 内の grep パターンを同時に更新する。\n\n**廃棄条件**: 業務規則の当該規則自体を廃止した時、または業務判定表の構造検査を別の機構が標準で保証するようになった時。\n\n### delivery-payload/templates/rules/checkers/ の回帰テスト5本（規約27件の機械検知試作・追加分）\n\n**必要性**: 整合検査（`validate-rule-definitions.sh` の「検査-テスト同伴」）は、front matter が `checker` を宣言する規約に対し、`\u003cchecker のベース名>.test.sh` が同じフォルダに実在することを要求する。今回追加した5件の linter（`check-secret-value-logging.sh`・`check-state-literal-comparison.sh`・`check-currency-float-type.sh`・`check-glossary-missing-forbidden-terms.sh`・`check-business-rule-table-missing-exception.sh`）にも同じ要求が及ぶ。対応する5本の `.test.sh` は、既存の複数節と同じ構造（本体の `--self-test` を実行して終了コードをそのまま返すラッパー）を持つため、判断も同一として1つの節にまとめる。\n\n**代替案を採用しなかった理由**:\n- 本体の `--self-test` を廃してテスト側へ判定を移す: `--self-test` を持つスクリプトは `run-layer-machine-checks.sh` が集めて一括実行する。廃すとこの集約から外れ、第 1 層の機械検証で走らなくなる\n- 整合検査の「検査-テスト同伴」を緩めてテストを不要にする: この検査は linter に回帰テストを同伴させるための仕組みであり、納品先で linter が壊れたことを検知する唯一の手段になる。緩めると検知そのものが失われる\n- Bash ツール直叩き: 納品先で繰り返し実行するテストであり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本テスト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。本体の `--self-test` の呼び出し方（引数）を変える場合は対応するラッパーも同時に更新する。\n\n**廃棄条件**: 対応する linter が納品対象から外れた時、または整合検査の「検査-テスト同伴」が廃止された時。\n\n### check-ai-config-derivative-manual-edit.sh\n\n**必要性**: AI設定資産管理規約の規則「派生は生成物として扱う」を機械検知する linter。同規則は「`.claude/`・`.cursor/`・`.codex/` の内容は `docs/` から生成する。直接編集しない」と定める。検査列は「派生物の内容ハッシュを台帳と突合し、一致しないファイルを検出する」とあるが、台帳の置き場所は納品先ごとに異なりうるため汎用の linter からは参照できない。一方、派生物の置き場所そのもの（`.claude/rules/`・`.cursor/rules/`・`.codex/`）は同規約の検査列が明記する固定パターンであり、Write/Edit/MultiEdit の書き込み先パスだけで機械的に判定できる。`.claude/`・`.cursor/`・`.codex/` は納品先にも存在する標準構造であり参照してよいが、`shared/`・`agent-home` のようなこのリポジトリ・マシン固有のパスには依存しない設計とした。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write/Edit/MultiEdit のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 内容ハッシュ台帳との突合（検査列の原文どおりの実装）: 台帳の置き場所・形式は納品先ごとに異なるため、汎用の linter に台帳への依存を持たせると納品先で機能しない\n- `check-generated-html-manual-edit.sh` と同じマーカー検出方式: 派生物（規約・hooks 設定等）は生成物マーカー（`id=\"page-data\"` 等）を埋め込む構造を持たないため、マーカー方式は成立しない。固定の置き場パターンによる判定が唯一実行可能な方式である\n\n**保守責任者**: 人手（ユーザー）。派生物の置き場パターン（`.claude/rules/`・`.cursor/rules/`・`.codex/`）を変更する場合は本スクリプトの `judge` 内の正規表現を同時に更新する。\n\n**廃棄条件**: AI設定資産管理規約の当該規則自体を廃止した時、または派生物の直接編集検知を別の機構（内容ハッシュ台帳の実装等）が標準で保証するようになった時。\n\n### check-ai-config-derivative-manual-edit.test.sh\n\n**必要性**: 整合検査（`validate-rule-definitions.sh` の「検査-テスト同伴」）は、front matter が `checker` を宣言する規約に対し、`\u003cchecker のベース名>.test.sh` が同じフォルダに実在することを要求する。`check-ai-config-derivative-manual-edit.sh` にも同じ要求が及ぶため、既存の複数節と同じ構造（本体の `--self-test` を実行して終了コードをそのまま返すラッパー）を持つ回帰テストを用意した。\n\n**代替案を採用しなかった理由**:\n- 本体の `--self-test` を廃してテスト側へ判定を移す: `--self-test` を持つスクリプトは `run-layer-machine-checks.sh` が集めて一括実行する。廃すとこの集約から外れ、第 1 層の機械検証で走らなくなる\n- 整合検査の「検査-テスト同伴」を緩めてテストを不要にする: この検査は linter に回帰テストを同伴させるための仕組みであり、納品先で linter が壊れたことを検知する唯一の手段になる。緩めると検知そのものが失われる\n- Bash ツール直叩き: 納品先で繰り返し実行するテストであり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。本体の `--self-test` の呼び出し方（引数）を変える場合は本ラッパーも同時に更新する。\n\n**廃棄条件**: `check-ai-config-derivative-manual-edit.sh` が納品対象から外れた時、または整合検査の「検査-テスト同伴」が廃止された時。\n\n### check-any-type-escape-hatch.sh\n\n**必要性**: コーディング規約の規則「型の検査を骨抜きにしない」を機械検知する linter。TypeScript/Pythonの型注釈は静的な文字列パターン（`: any`・`as any`・`\u003cany>`・`@ts-ignore`・`@ts-nocheck`・`: Any`・`# type: ignore`）として現れるため、PreToolUse(Write) の `tool_input.content` から grep で機械的に検出できる。対象拡張子（.ts/.tsx/.mts/.cts/.py）を先に絞ることで、文書ファイル中の「any」という英単語を誤検知しない設計とした。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 型注釈の完全な省略（型を書かないこと）まで検出対象に含める: 動的型付け言語との区別がつかず、正当な用法まで拒否してしまうため対象外とした\n\n**保守責任者**: 人手（ユーザー）。検出パターン（any/Any の記法・抑制コメントの綴り）を増減する場合は本スクリプトの各 grep パターンを同時に更新する。\n\n**廃棄条件**: 「型の検査を骨抜きにしない」規約自体を廃止した時、または型検査の骨抜き検出を型チェッカー自体（tsc の strict モード等）が標準で保証するようになった時。\n\n### check-direct-circular-import.sh\n\n**必要性**: コンポーネント設計規約の規則「循環する依存を作らない」を機械検知する linter。完全な import グラフを構築した多段の循環検出は静的解析ツール（madge 等）の領域であり、jq/grep だけの linter では非現実的なため、「今書き込もうとしているファイル」と「その直接の import 先」という2ファイル間の直接循環に対象を絞ることで、grep ベースの実装で機械検知できる範囲に収めた。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で import グラフを確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 多段の循環（A→B→C→A）まで検出する完全なグラフ探索の実装: jq/grep の範囲を超え、実質的に静的解析ツールの再実装になるため、2ファイル間の直接循環に対象を絞った\n\n**保守責任者**: 人手（ユーザー）。対象拡張子や import 解決の探索順（拡張子補完・index 解決）を変更する場合は本スクリプトの `resolve_target_file` を同時に更新する。\n\n**廃棄条件**: 「循環する依存を作らない」規約自体を廃止した時、または循環依存の検出を専用の静的解析ツールが標準で保証するようになった時。\n\n### check-direct-commit-to-integration-branch.sh\n\n**必要性**: 開発フロー規約の規則「実装は作業用の枝で行う」を機械検知する linter。統合先の枝への直接コミットは、コミット済みの履歴を事後に走査しても防止（block）にはならないため、PreToolUse(Bash) で「これからコミットしようとする時点の現在の枝」を先読みする方式を取った。これにより規則が求める予防の趣旨と一致する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、commit のたびに手動で現在の枝を確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- git 履歴の事後走査（post-commit / CI での検知）: コミットが成立してから検知するため、規則が求める「作業用の枝で行う」という予防の趣旨に合わない。実行前に block できる PreToolUse 方式を選んだ\n\n**保守責任者**: 人手（ユーザー）。統合先の枝名の慣行（main/master/develop/trunk）を増減する場合は本スクリプトの `judge` 内の `case` を同時に更新する。\n\n**廃棄条件**: 「実装は作業用の枝で行う」規約自体を廃止した時、または枝の保護をリポジトリホスティング側のブランチ保護機能が代替するようになった時。\n\n### check-generated-artifact-staged.sh\n\n**必要性**: Git運用規約の規則「生成物を版管理へ入れない」を機械検知する linter。依存の実体やビルド生成物の代表的な出力先（node_modules・dist・build・__pycache__ 等）はファイル名・パスの慣行として広く共有されており、`git add` の引数として明示されたパスをファイル名だけで機械的に判定できる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、`git add` のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `git add .` / `git add -A` のような一括追加まで対象に含める: 引数からファイル名を特定できず、生成物と手書きファイルの区別が付かないため fail-open（判定対象外）とした\n\n**保守責任者**: 人手（ユーザー）。生成物の代表的な出力先の名前を増減する場合は本スクリプトの `is_generated_artifact` を同時に更新する。\n\n**廃棄条件**: 「生成物を版管理へ入れない」規約自体を廃止した時、または生成物の除外を `.gitignore` 側の検査が標準で保証するようになった時。\n\n### check-release-changelog-entry.sh\n\n**必要性**: リリースとデリバリーの規約の規則「変更の履歴を版ごとに残す」を機械検知する linter。公開・版付けの操作（npm version/publish・yarn publish・pnpm publish・git tag）は限られた語彙で表現でき、その直前に変更履歴ファイル（CHANGELOG 等）の実在と版らしい項目の有無を機械的に走査できる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、公開操作のたびに手動で変更履歴を確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 記載された版番号がこれから公開する版と一致するかまでの検査: 公開しようとしている版番号を静的に取得する確実な手段が無く、変更履歴に版らしい項目が最低1件存在するかの検査にとどめた\n\n**保守責任者**: 人手（ユーザー）。公開・版付けコマンドの語彙や変更履歴ファイルの命名慣行を増減する場合は本スクリプトの `RELEASE_CMD_RE` と `judge` 内の `find`/`grep` パターンを同時に更新する。\n\n**廃棄条件**: 「変更の履歴を版ごとに残す」規約自体を廃止した時、または変更履歴の記録を CI・リリース自動化ツールが標準で保証するようになった時。\n\n### check-secret-filename-staged.sh\n\n**必要性**: 開発環境規約の規則「秘密の値を版管理へ入れない」を機械検知する linter。値の中身を読まずとも、秘密の値を含みうるファイル名（.env 系実ファイル・秘密鍵ファイル・credentials.json 系）は代表的な命名慣行として機械的に判定でき、`git add` の引数として明示されたファイル名だけで検知できる。雛形として配布する `.env.example` 等は規則が許容する例外として除外する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、`git add` のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- ファイルの中身（値そのもの）を読んで秘密らしい値を検出する方式: `git add` の対象は今から追加しようとするファイルであり、実行前の PreToolUse では中身の読み取りにコストがかかる。ファイル名だけで判定可能な代表的な慣行に絞ることで軽量な検知にとどめた\n\n**保守責任者**: 人手（ユーザー）。秘密ファイルの命名慣行を増減する場合は本スクリプトの `is_secret_filename` を同時に更新する。\n\n**廃棄条件**: 「秘密の値を版管理へ入れない」規約自体を廃止した時、または秘密ファイルの検出を専用の secret scanner が標準で保証するようになった時。\n\n### check-secret-in-command-args.sh\n\n**必要性**: ツールとコマンド実行の規約の規則「秘密の値をコマンドの引数に置かない」を機械検知する linter。コマンドの引数はシェルの履歴やプロセス一覧から読み取れるため、認証の鍵・合言葉らしき語（password/secret/token/api-key 等）へ環境変数参照でない値が直接続いているかを、コマンド文字列の静的な走査だけで機械的に判定できる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、コマンド実行のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- シェルの完全な構文解析を行った上での判定: 値が `$` で始まるかどうかだけで「環境変数から読んでいるか / 直接書かれているか」を区別でき、完全な構文解析までは不要と判断した\n\n**保守責任者**: 人手（ユーザー）。秘密らしき引数名の語彙を増減する場合は本スクリプトの `SECRET_FLAG_ALT` を同時に更新する。\n\n**廃棄条件**: 「秘密の値をコマンドの引数に置かない」規約自体を廃止した時、または引数の秘密値検出を専用の secret scanner が標準で保証するようになった時。\n\n### check-sequential-identifier-naming.sh\n\n**必要性**: 命名規約の規則「通し番号を識別子にしない」を機械検知する linter。連番だけで区別された識別子（item1/item2 等）は、末尾の数字を除いた基底名でグループ化し、同じ基底名に異なる数字サフィックスが2種以上現れるかを走査するだけで機械的に検出できる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で識別子を確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 変数名・関数名・ファイル名を種類ごとに区別して判定する方式: 対象の種類を判定するには構文解析が要り、grep ベースの実装では非現実的なため、書き込み内容全体から一様にトークンを抽出する方式にとどめた（utf8/utf16 のような技術用語の同居時に誤検知しうる既知の限界を持つ）\n\n**保守責任者**: 人手（ユーザー）。誤検知の許容範囲や識別子抽出の正規表現を変更する場合は本スクリプトの `judge` 内の `grep`/`sed` パターンを同時に更新する。\n\n**廃棄条件**: 「通し番号を識別子にしない」規約自体を廃止した時、または命名の意味論チェックを専用の静的解析ツールが標準で保証するようになった時。\n\n### check-temp-file-tracked.sh\n\n**必要性**: ディレクトリ構成規約の規則「一時ファイルをリポジトリ内へ置かない」を機械検知する linter。一時ファイルらしい名前（拡張子 .tmp/.bak/.swp 等・末尾チルダ・.DS_Store・Thumbs.db・scratch-/draft-/wip- 接頭辞）は代表的な慣行として機械的に判定でき、`.gitignore` により追跡対象外と判定される場所は規則の対象外として除外する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- ディレクトリ名（tmp/ や scratch/ 配下等）まで判定対象に含める: ファイル名だけを見る設計とし、正規の一時ディレクトリ配下への配置（本規約が推奨する退避先）まで誤って拒否しないようにした\n\n**保守責任者**: 人手（ユーザー）。一時ファイルの命名慣行を増減する場合は本スクリプトの `TEMP_NAME_RE` を同時に更新する。\n\n**廃棄条件**: 「一時ファイルをリポジトリ内へ置かない」規約自体を廃止した時、または一時ファイルの検出を `.gitignore` 側の検査が標準で保証するようになった時。\n\n### check-unit-test-design-doc-sections.sh\n\n**必要性**: テスト方針書の規則「記載項目を省かない」と、テスト設計書の§1・§2・§5・§6の役割を機械検知する linter。\n単体テスト設計書が持つべき必須見出しは、冒頭3節と§1から§9までの12個である。\nこれらは固定の語彙であるため、Markdownの見出し行から名前・順序・件数の不一致を機械検知できる。\n§1を全観点、§5・§6を異常・境界の観点の部分集合、§2を実行ケースの唯一の一覧と定める。\n表の見出しとキー集合から、§5・§6の観点が§1に含まれることを機械検知できる。\n§1の全観点に§2のケースがあることと、§2の参照先とケースキーが整合することも機械検知できる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: PreToolUse イベントに自動バインドできず、Write のたびに手動で見出しを確認する運用は現実的でない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- 見出し配下の説明文や期待結果の充実度まで判定する方式: 内容の妥当性は文脈判断を要するため対象外とし、機械判定できる表見出しとキー集合だけを検査する\n\n**保守責任者**: 人手（ユーザー）。\n必須見出しの語彙を増減する場合は、本スクリプトの `REQUIRED_SECTION_HEADINGS` を同時に更新する。\n§1・§2・§5・§6の列名または役割を変える場合は、`judge_test_section_roles` を同時に更新する。\n\n**廃棄条件**: 「記載項目を省かない」規約自体を廃止した時、またはテスト設計書の記載項目検査を別の機構が標準で保証するようになった時。\n\n### check-argjson-unbounded-value.sh\n\n**必要性**: 改善課題1-52の残件（テーブルのメタ情報抽出が900列規模のケースで失敗する）は、`extract-table-metadata.sh` が列名一覧を `jq --argjson` でコマンドライン引数として直接渡していたことが原因だった。コミット970a9cc（7/29）で一時ファイル + `--slurpfile` による対策が一度入ったが、コミットac9c6df（8/11）の大規模書き換えで同じ箇所が `--argjson m \"$main_cols_json\"` の直渡しへ回帰し、対策が消えたことに誰も気付かないまま次の検証で同じ指摘が再び出た。「現物を直す」だけでは対策が再び消えても検知できないため、generation-engine/scripts/ 配下の全 `.sh` を横断して `--argjson` の使用箇所を静的に洗い出し、既知の安全な用法（許可リスト）に無いものを毎回機械的に検出する仕組みが必要である。実行時の引数長上限はOSに依存し（macOSには無くLinuxにはある）実行時再現に頼れないため、コードの形自体を検査する静的チェックとして実装した。往復検証や規約カード追加のたびに繰り返し使うため、繰り返し実行可能なスクリプトとして1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: generation-engine/scripts/ 配下の.shファイル（本稿時点で100本超）へ都度手動で `grep --argjson` を実行し目視判定すると、判定基準がぶれ、実際に今回のように対策の消滅を見落とす\n- 変数名の規則（方式A）のみで判定する方式: 「可変長らしい」変数名（`*cols*`・`*rows*`・`*list*`等）を検出する方式は単純だが、今回の実際の回帰そのもの（`main_cols_json`という「らしい」名前が`mainColumns`というjq側の別名を経由し、最終的に`--argjson m`という抽象的な1文字名で渡される）のような、キーワードを含まない別名での再導入を確実には拾えない。取りこぼしが理論上常に残るため、ファイルパス・jq引数名・渡す値の3つ組を許可リスト化しdefault-denyで判定する方式B（新しい`--argjson`は必ず判断を要求される）を採用した\n- 既存 `check-outbound-call-missing-timeout.sh` 等、delivery-payload/templates/rules/checkers/ 配下の個別規約検査への機能追加: あちらは規約定義（docs/rules/配下）から生成される規約カード27件それぞれの検査であり、本検査はgeneration-engine/scripts/自身のコード品質（jqへの引数渡し方の安全性）が関心である。対象ディレクトリも生成元も異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。generation-engine/scripts/ 配下に新しい `--argjson` 使用を追加した場合、本スクリプトの実行が違反として検出する。安全な固定長の値だと判断した場合のみ、レビューのうえで `ALLOWLIST_TSV` へ該当行（ファイル相対パス・jq引数名・渡す値の3列）を追記する。逆に既存の許可リスト登録済みエントリを削除・書き換える場合も、対応する `--argjson` 呼び出し側のコード変更と同時に行う。\n\n**廃棄条件**: `jq --argjson` によるコマンドライン引数渡しパターン自体をこのリポジトリの生成スクリプト群から廃止した時（例えば全面的に `--slurpfile` かファイル渡しへ統一した時）、またはCIの実行環境が引数長上限を持たなくなり本検査の前提が消えた時。\n\n### regenerate-sequence-samples.sh\n\n**必要性**: シーケンス図のサンプル5件は `delivery-payload/templates/screen-sequence-template.html` から生成されるが、これを機械的に再生成する決定的なスクリプトが存在しなかった。納品先では `generating-sequence-diagram-for-reverse-docs` スキルが手順に従ってインラインで描画する設計であり、このリポジトリ自身のサンプルを再生成する経路が欠けていた。そのためテンプレートを変えてもサンプルへ反映できず、検査 `generation-engine/scripts/tests/sequence-diagram/test-sequence-diagram-lanes.mjs` が要求する「サンプルの埋め込みスクリプトとテンプレートの一致」を保てず、実測で5件すべてが旧テンプレートのまま取り残されていた。テンプレート・入力データ・値の引き継ぎ元（既存サンプル）を横断して読む必要があり、繰り返し再生成するたびに同じ手順を再現する必要があるため、スクリプトとして1本に閉じる。\n\n**代替案を採用しなかった理由**:\n- build-detail-page.sh への統合。テンプレートの置き場が detail-pages 配下に固定されており、シーケンス図のテンプレートは templates 直下にあるため例外が要る\n- Bash ツール直叩き。テンプレートを変えるたびに5件を手で描画し直すことになり、再現性がない\n- 既存 Makefile ターゲット拡張・package.json scripts 追加。このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`screen-sequence-template.html` のプレースホルダ構成や、画面のキー一覧（`generation-engine/samples/docs/design/screens/screen-*/`）を変更した場合は本スクリプトを追従させる。\n\n**廃棄条件**: シーケンス図のサンプルによる往復検証を廃止した時、またはシーケンス図の生成をビルド基盤が標準で提供するようになった時。\n\n### check-verification-wiring.sh\n\n**必要性**: 第1層の集約（`generation-engine/scripts/verification/run-layer-machine-checks.sh`）は対象を動的に集めるが、当初は `--self-test` を持つ `.sh` だけを集めていたため、Node.js で書かれた検査12本が一度も実行されない状態が2週間以上発見されずに続いた実績がある。この12本は今回配線したが、配線漏れそのものを検出する仕組みは無く、次に誰かが検査を追加して集約の条件から外れる形で書けば、また同じことが起きる。検査として実行できるファイル（`--self-test` を引数処理する `.sh`、または `generation-engine/scripts/tests/` 配下の `test-*.cjs`・`test-*.mjs`）が集約の `--list` 出力に漏れなく含まれているかを、検査を追加・変更するたびに繰り返し確認する必要があるため、スクリプトとして1本に閉じる。\n\n**代替案を採用しなかった理由**:\n- `run-layer-machine-checks.sh` 自身への統合。集約が自分の集め方の正しさを判定することになり、集め方を誤ったときに誤りごと通る\n- Bash ツール直叩き。配線漏れは検査の追加のたびに起こりうるため、繰り返し実行できる形が要る\n- 既存 Makefile ターゲット拡張・package.json scripts 追加。このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。「検査として実行できるファイル」の判定条件（`--self-test` の引数処理パターン・`test-*.cjs`/`test-*.mjs` の対象範囲）を変更する場合は、本スクリプトと `run-layer-machine-checks.sh` の `list_targets` を同時に更新する。\n\n**廃棄条件**: 第1層の集約対象の動的列挙を廃止した時、または配線漏れの検出をビルド基盤が標準で提供するようになった時。\n\n### check-dev-flow-completion.sh\n\n**必要性**: このリポジトリ自身が定める納品完了の条件（配布対象外）の5段のうち、第5段「開発フローが通る」だけが機械判定の手順を持たなかった。配った `/dev-flow` は対話で進行するフェーズ運転スキルであり、各フェーズの確定はユーザーの承認を必要とするため、フェーズの進行そのものは終了コードだけで機械判定できない。一方、Phase5 ゲートの提示物（実装概要・動作確認結果表・規約レビュー結果）を対象プロジェクトの作業記録として保存する形式を定めれば、その実在と中身は機械で検査できる。`delivery-payload/templates/delivered-skills/dev-flow/SKILL.md` の Phase5 ゲート直後に完了記録の追記手順を足し、本スクリプトが `\u003c対象プロジェクトのパス>/docs/scope-and-progress/開発フロー完了記録.md` の実在・必須項目（見出しの日時・要求・コミット・実装概要・動作確認結果・規約レビュー結果）の充足・動作確認結果に不合格が無いことを検査する。往復検証・第3層のように繰り返し実行される検査であり、`generation-engine/scripts/verification/run-layer-machine-checks.sh` の自己テスト集約からも対象として動的に拾われる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 対象プロジェクトへ `/dev-flow` を適用するたびに記録の形式・必須項目・動作確認結果の合否を手動で読み比べると、実行のたびに判定基準がぶれる\n- `/dev-flow` を無人で1往復させる最小のシナリオ実行器を作る案（納品完了の条件を定めるこのリポジトリ自身の文書が挙げるもう一方の選択肢）: Phase1〜Phase4 の承認は本質的にユーザーの判断を要し、無人化するとゲートの意味そのものが失われる。完了記録の保存・検査という選択肢のほうが、対話フローの性質を保ったまま機械判定を追加できる\n- 既存 `check-manifest-persistence.sh` への機能追加: あちらは一覧マニフェストという生成物の永続化検査が関心であり、対話フローの完了記録という異なる種類の記録の検査を混ぜると対象・判定式が食い違う\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。完了記録の形式（見出し・表の列名・許可する結果値）を変える場合は本スクリプトと `delivery-payload/templates/delivered-skills/dev-flow/SKILL.md` の「完了の記録」節と、納品完了の条件を定めるこのリポジトリ自身の文書（配布対象外）の第5段の節を同時に更新する。\n\n**廃棄条件**: 開発フロー完了記録の機械判定自体を廃止した時、または `/dev-flow` を無人で1往復させるシナリオ実行器に置き換えて Phase5 ゲートの確定そのものを機械判定できるようになった時。\n\n### check-skill-reference-paths.sh\n\n**必要性**: スキルの参照資料が、存在しない見本（`generation-engine/samples/規約提案/` 配下）を指したまま配られた実例がある。読み手は完成形を確かめられず、参照が古いのか未作成なのかも判別できない。スキル定義は 52 本あり、本文が書く参照先の実在を目視で確かめるのは現実的でない。走査と存在確認を繰り返し同じ基準で実行するには、判定をスクリプトへ固定する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 52 本から抽出した参照の存在確認を対話セッションのたびに手で組み立てると、抽出の正規表現も判定基準も実行のたびにぶれる\n- `check-guide-script-paths.sh` への同居: あちらは `references/guide.html` が書くパスの実在が関心であり、対象ファイルも参照の書き方（相対参照を含む）も異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。参照の書き方（相対参照の階層・リポジトリ相対の接頭辞・拡張子）を増減する場合は、本スクリプトの `REL_RE`・`ABS_RE` と本節を同時に更新する。\n\n**廃棄条件**: スキル定義の参照資料の節を廃止した時、または参照先の実在検査を別の仕組みが標準で提供するようになった時。\n\n### check-portal-rule-exclusions.sh\n\n**必要性**: 本規約の「適用対象」節は、検査から外す場所を列挙する。ところが列挙された場所のうち 1 件が実在せず、除外の記述だけが残っていた。除外は「そこに何かがある」ことを前提にしており、何も無い場所を除外しても効果は無い。読み手には「あるはずのものが無い」のか「除外が古い」のかも判別できない。除外の増減は今後も起こるため、記述と実体の食い違いを繰り返し同じ基準で見つける必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 節の抽出・逆引用符の取り出し・星印を含む書き方の展開という複数段の処理を対話セッションのたびに手で組み立てると、判定基準が実行のたびにぶれる\n- `test-portal-conventions.sh` への同居: あちらは生成された HTML 1 枚が規約に適合するかを見るリンタであり、規約の本文と実体の食い違いとは検査対象が異なる\n- `check-skill-reference-paths.sh` への同居: あちらはスキル定義の参照が関心であり、対象ファイルも抽出の規則も異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。除外の書き方（節の見出し・逆引用符・対象とする接頭辞）を変える場合は、本スクリプトの `extract_paths` と本節を同時に更新する。\n\n**廃棄条件**: 本規約の「適用対象」節による除外の運用を廃止した時。\n\n### check-delivery-doc-links.sh\n\n**必要性**: 配られる 7 件が配られない `docs/` を指しており、納品先で開くとリンク切れになる状態が実際にあった。読み手（納品先のエンジニアや AI エージェント）は、配られたスキル・テンプレート・規約の中から、このリポジトリ自身の説明・計画・台帳を置く `docs/` 配下を辿ろうとしてもファイルが存在せず、リンク切れに気付けない。リンクの形（`](パス)`・`href=\"パス\"`）で書かれた参照だけが実際にクリック・遷移の対象になるため、文中の説明文としてパスに触れているだけの箇所まで検査対象にすると過検出になる。走査と解決を繰り返し同じ基準で実行するには、判定をスクリプトへ固定する必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 7 件配下の対象ファイルからリンク候補を抽出し、ファイルごとに異なる相対位置から解決先を確かめる作業を対話セッションのたびに手で組み立てると、抽出の正規表現も解決の基準も実行のたびにぶれる\n- `check-skill-reference-paths.sh` への同居: あちらはスキル定義が書く参照先が実在するかどうかを見る（参照が指す場所に実体があるか）。本スクリプトは逆に、参照先が実在するかどうかではなく、配られない場所（このリポジトリのルート直下の `docs/`）を指していないかを見る。対象ファイルの範囲（納品対象 7 件全体か、スキル定義のみか）も、合否の向き（実在しないと不合格／実在すると不合格）も異なるため、同居させると 1 本の中で判定の向きが入り乱れる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。納品対象 7 件の一覧が増減した場合は本スクリプトの `TARGETS` と `.claude/rules/always/publish/complete/rule.md` の同期対象一覧を同時に更新する。リンクの書き方（Markdown・HTML 以外の形式）を増やす場合は本スクリプトの `MD_RE`・`HREF_RE` と本節を同時に更新する。\n\n**廃棄条件**: 納品対象からこのリポジトリ自身の `docs/` への言及を一律に禁止する運用を廃止した時、または配られない場所への参照検査を別の仕組みが標準で提供するようになった時。\n\n### check-delivery-glossary.sh\n\n**必要性**: `README.md` が、初めて読む人に馴染みの薄い言葉（リバース・派生・種別・単位・工程・ポータル・manifest）を、説明なしに使っていた実例があった。語の初出箇所と説明箇所が離れている、または説明そのものが無いため、読み手が意味を取れないまま読み進める事態を招く。`delivery-payload/references/配布文書の言葉.json` の宣言（対象語・説明を置く文書と見出し・参照する文書）を単一の定義とする。見出しの節の実在・全語の説明の実在・説明より前で語が使われていないこと・参照文書が説明の所在に言及していることの 4 点を、README.md 改訂のたびに繰り返し機械的に検査する必要がある。節の前後関係の判定（検査 3）は、見出しの探索・見出しレベルの比較・行範囲の切り出しという複数段の分岐を伴い、対話セッションのたびに手で組み立てると判定基準がぶれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: README.md 改訂のたびに、見出しの節の位置・全語の説明の有無・語の初出位置・参照文書の言及を手で確認すると、確認の抜け漏れが生じる。実際に 7 語のうち複数語で説明の欠落・位置のずれが見つかった\n- 既存 `check-delivery-doc-links.sh` への同居: あちらは配布対象がリンクの形で配られない `docs/` を指していないかを見る検査であり、対象（リンク先パス）も判定式（実在すると不合格）も異なる。文書内の語の説明有無という関心とは検査対象がまったく異なる\n- 既存 `check-glossary-sync.sh` への同居: あちらは `docs/guides/用語集.md` とスキルガイド HTML の用語パネルという、2 つの手書き文書間の内容の食い違いを見る検査であり、対象読者・対象文書・スキーマ（`terms`/`glossaryDocument` 等）が異なる。あちらの用語集は「AI駆動開発セットアップ構想」固有のドメイン用語を対象とし、本検査が扱う README.md の一般語彙とは対象が重ならない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。対象語・対象文書を増減する場合は `delivery-payload/references/配布文書の言葉.json` を更新する。見出しレベルの判定・節の前後関係の判定ロジックを変える場合は本スクリプトと self-test を同時に更新する。\n\n**廃棄条件**: README.md の言葉の説明を宣言ファイルで管理する運用を廃止した時、または文書内の用語説明の整合検査を別の仕組み（`check-glossary-sync.sh` 等）へ統合した時。\n\n### check-derived-drift-ledger.sh\n\n**必要性**: `check-derived-drift.sh` は生成物の内容を記録した台帳（`derived-fingerprints.json`）と現在の中身を突き合わせ、手作業の書き換えを見つける仕組みを持つが、台帳が存在せず記録（`record`）が一度も実行されていなかったため、見本74件に対してこの仕組みが一度も働かない状態が続いていた。台帳を作った後も、見本を作り直すたびに台帳とのずれが起こりうる。このずれを継続して検知するには、第1層の機械検証（`run-layer-machine-checks.sh`）が動的に集める対象へ、`check-derived-drift.sh status generation-engine/samples` の合否を変換して渡す入口が要る。\n\n**代替案を採用しなかった理由**:\n- `check-derived-drift.sh` 自身への `--self-test` 追加: あちらは台帳の作成（`record`）と突合の実行（`status`）そのものが関心であり、第1層の集約が拾うための入口とは関心が異なる。`--self-test` を足すと、台帳作成の単体検証と、実運用の `generation-engine/samples` に対する継続的な合否監視という 2 つの異なる目的が 1 本の分岐に同居する\n- Bash ツール直叩き: 往復検証や見本の再生成のたびに `check-derived-drift.sh status` を手動実行して終了コードを目視確認すると、確認漏れが生じる。実際に台帳未作成のまま長期間気付かれなかった実績がある\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。見本を作り直した者が同じコミットで `derived-fingerprints.json` を更新する（`.claude/rules/always/portal/template-sample-sync/rule.md` の規約 5）。台帳と見本がずれた場合は本スクリプトが第1層で不合格として知らせる。\n\n**廃棄条件**: 生成物のずれ検知台帳（`derived-fingerprints.json`）による監視自体を廃止した時、または台帳とのずれ検知を別の仕組みへ統合した時。\n\n### check-self-portal-links.sh\n\n**必要性**: このリポジトリ自身のポータル（`docs/portal/index.html`）は、既存の生成器（`build-portal.sh`）を試した結果、業務種別のカード化・discovery の仕組みに合わず専用のページとして新設した（詳細は `docs/design/ポータル試行の記録.md`）。専用のページは他のスクリプトから決定的に生成されないため、`href` の記述ミス・参照先ファイルの改名や削除によるリンク切れを機械で検知する仕組みが無いと、他の生成物と同じ基準で健全性を保てない。索引が 6 種・リンク先が 90 件超（12 群 × 2・規約 8 件・スキル 52 件・検証記録 2 件・台帳 8 件・既存資料 2 件）と多く、改訂のたびに全件を目視で辿るのは非現実的である。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: ページを直すたびに全 href を手動で辿って実在確認すると、確認漏れが生じる。件数が 90 件超あり、目視での網羅は非現実的\n- 既存 `check-delivery-doc-links.sh` への同居: あちらは納品対象（`.claude/skills`・`delivery-payload`・`generation-engine` 等）が配られない `docs/` を指していないかを見る検査であり、合否の向き（配られない場所を指すと不合格）も対象範囲もまったく逆である。本検査はこのリポジトリ自身の 1 ページのリンクが実在するかどうかだけを見る\n- 既存 `check-derived-drift.sh` への同居: あちらは生成物のハッシュ台帳突合が関心であり、`docs/portal/index.html` は決定的な生成物ではなく手書きの専用ページのため、ハッシュ突合の前提（生成のたびに記録し直す台帳）に馴染まない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。`docs/portal/index.html` へ索引を追加・削除した場合は本スクリプトの走査対象（既定は同ページのみ）に変更は不要だが、リンクを追加した後は本スクリプトを実行して切れが無いことを確認する。\n\n**廃棄条件**: このリポジトリ自身のポータルを廃止した時、またはリンク切れの検知をビルド基盤が標準で提供するようになった時。\n\n### validate-rule-judgment-coverage.sh\n\n**必要性**: 25 規約の規則の数と判定の数の対応を、規約が増減するたびに手で突き合わせるのは非現実的である。対応が取れていない状態は規約を読まない限り気づけない。第 1 層の機械検証から繰り返し呼ばれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 規約ごとに表の解析と検査の走査を対話のたびに組み立てると判定基準がぶれる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `validate-rule-definitions.sh` への統合: あちらは front matter の値域の検査が関心であり、規則の表と検査スクリプトの突合とは対象が異なる\n\n**保守責任者**: 人手（ユーザー）。数え方（動詞の種類・不可の扱い）を変える場合は本スクリプトと指示書と本節を同時に更新する。\n\n**廃棄条件**: 規則と判定の対応を取る運用自体を廃止した時、または対応の検査をビルド基盤が標準で提供するようになった時。\n\n### check-routine-procedure-doc.sh\n\n**必要性**: 定型運用の規約（3規則）は、規則の数と判定の数を対応させる指示書の対象でありながら検査スクリプトを持たず、`validate-rule-judgment-coverage.sh` の「検査なし」に計上されていた。3規則はいずれも検査列が「静的解析:」で始まり、対象プロジェクトの手順書というファイルの実在・中身の語彙走査だけで機械的に判定できる。手順書の探索（ファイル名に「手順書」を含む文書を cwd 配下から探す）は3規則で共通のため、探索を1箇所に集約し、`git commit` のたびに繰り返し実行する検査として1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: `git commit` のたびに手順書の実在・実行間隔の記述・失敗時の扱いの記述を手動で確認すると、実行のたびに判定基準がぶれる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。実行の間隔・起点、失敗時の扱いの語彙を増減する場合は本スクリプトの `INTERVAL_RE`・`FAILURE_STATE_RE`・`FAILURE_ACTION_RE` を同時に更新する。\n\n**廃棄条件**: 定型運用の規約自体を廃止した時、または手順書の実在・記述検査を別の機構が標準で保証するようになった時。\n\n### check-full-scan-then-filter.sh\n\n**必要性**: 拡張性要件（5規則）は、規則の数と判定の数を対応させる指示書の対象でありながら検査スクリプトを持たず、`validate-rule-judgment-coverage.sh` の「検査なし」に計上されていた。5規則のうち「件数に比例する処理を作らない」は、書き込み対象のコードに全件取得と絞り込みが近接して現れるという記号的な特徴で機械的に検出できる唯一の止める判定であり、残る4規則（増加の見込み・拡張の方向・処理の側の状態・上限に達したときの振る舞い）は通知・許可・対象外にとどめる。対象プロジェクトの要件定義書・基本設計書の実在と中身の走査は複数規則で共通のため、探索を1箇所に集約し、コードファイルの書き込みのたびに繰り返し実行する検査として1本に閉じる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: コードファイルの書き込みのたびに全件取得と絞り込みの近接、要件定義書・基本設計書の記述を手動で確認すると、実行のたびに判定基準がぶれ、止めるべき箇所を見落とす\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。全件取得・絞り込み・状態保持・流量制限の語彙を増減する場合は本スクリプトの `FULL_SCAN_RE`・`FILTER_RE`・`STATE_SESSION_RE`・`STATE_GLOBAL_RE`・`RATE_LIMIT_RE` を同時に更新する。\n\n**廃棄条件**: 拡張性要件自体を廃止した時、または件数に比例する処理の検出を専用の静的解析ツールが標準で保証するようになった時。\n\n### check-routine-procedure-doc.test.sh と check-full-scan-then-filter.test.sh\n\n**必要性**: 整合検査（`validate-rule-definitions.sh` の「検査-テスト同伴」）は、front matter が `checker` を宣言する規約に対し、`\u003cchecker のベース名>.test.sh` が同じフォルダに実在することを要求する。今回追加した2件の linter（`check-routine-procedure-doc.sh`・`check-full-scan-then-filter.sh`）にも同じ要求が及ぶ。対応する2本の `.test.sh` は、既存の複数節と同じ構造（本体の `--self-test` を実行して終了コードをそのまま返すラッパー）を持つため、判断も同一として1つの節にまとめる。\n\n**代替案を採用しなかった理由**:\n- 本体の `--self-test` を廃してテスト側へ判定を移す: `--self-test` を持つスクリプトは `run-layer-machine-checks.sh` が集めて一括実行する。廃すとこの集約から外れ、第 1 層の機械検証で走らなくなる\n- 整合検査の「検査-テスト同伴」を緩めてテストを不要にする: この検査は linter に回帰テストを同伴させるための仕組みであり、納品先で linter が壊れたことを検知する唯一の手段になる。緩めると検知そのものが失われる\n- Bash ツール直叩き: 納品先で繰り返し実行するテストであり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本テスト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。本体の `--self-test` の呼び出し方（引数）を変える場合は対応するラッパーも同時に更新する。\n\n**廃棄条件**: 対応する linter が納品対象から外れた時、または整合検査の「検査-テスト同伴」が廃止された時。\n\n### check-placement-independence.sh\n\n**必要性**: `docs/tasks/配布先で自己テストが通るようにする指示書.md` は、配布物（このリポジトリ）が公開リポジトリや対象プロジェクトの中へ一区画として埋め込まれると、`validate-manifest.sh` の相対sourceDir解決（.git祖先探索）が配布物の境界を越えて外側のリポジトリへ到達し、実物の見本マニフェストの解決に失敗する事故（実測: 独立配置は終了コード0、埋め込み配置は終了コード1）を記録する。この対策として `validate-manifest.sh` の探索へ配布物の境界目印（`generation-engine/DESIGN.md`）を停止条件として加えたが、この性質は今後の改修で無自覚に壊れうる（.git判定のみへ戻す・目印ファイルの改名等）。独立したリポジトリとしての配置と上位にリポジトリを持つ配置の両方を実際に用意し、見本マニフェストの検証結果が一致することを機械的に確かめ続ける必要があり、退行のたびに手動で2つの置き方を再現するのは非効率かつ見落としを招く。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 2つの置き方（独立配置・埋め込み配置）を対話セッションのたびに手動で用意して比較すると、実行のたびに手順がぶれ、確認自体を省略するリスクを負う\n- 既存 `generation-engine/scripts/unit-list/validate-manifest.sh` の `--self-test` への機能追加: あちらの自己テストは1回のフルスイート実行に約90秒を要し（実測）、2つの置き方で2回実行すると集約の既定タイムアウト（120秒）に接近する。本検査は実物の見本マニフェスト1件に絞った軽量な単発検証（実測3秒程度）を2回行うことで、既存の自己テストへ手を入れずに同じ性質を高速に確かめる\n- `generation-engine/scripts/verification/` 配下への追加: 当該ディレクトリは別担当が同時に作業中であり、本検査は `generation-engine/scripts/tests/` に置くだけで第1層の集約（`run-layer-machine-checks.sh`）が動的列挙により自動的に対象へ含めるため、集約スクリプト自体への変更は不要である\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。境界目印（`generation-engine/DESIGN.md`）を変更する場合は本スクリプトと `validate-manifest.sh` の該当コメントを同時に更新する。\n\n**廃棄条件**: `validate-manifest.sh` の相対sourceDir解決から.git祖先探索そのものを廃止した時、または配布物の置き場所に依存しない解決方式（例: 常にスクリプト自身の位置からの相対解決）へ全面的に切り替えた時。\n### check-design-unit-file-completeness.sh\n\n**必要性**: `docs/tasks/設計書の生成のばらつきをなくす指示書.md` 2.4 節が指摘するとおり、機能（feature）は基本設計フェーズに機能設計書.md・機能単体テスト設計書.md の2ファイルを配置の定義（`design-unit-layout.json`）が挙げているにもかかわらず、実測では機能9件すべてで前者しか生成されず後者は0件だった。原因は種別ごとの生成スキルが個別に実装されており、定義に挙げたファイルと実際の生成物の対応を横断的に突き合わせる仕組みが1件も無かったことである。同種の「片方しか生成されない」退行は種別追加のたびに再発しうるため、`design-unit-layout.json` が宣言する全種別・全phaseについて `scaffold-design-unit.sh` で実際に展開し、宣言ファイルの実在を独立に確認する仕組みが要る。screen は同JSONの宣言対象外（3サブフォルダ8ファイルの束を `scaffold-screen.sh` が独自に検証する構造のため）であり、「全種別」から screen が漏れないよう `scaffold-screen.sh` の展開 + `--verify` への委譲も同じスクリプトに含めた。`generation-engine/scripts/tests/` 配下に `--self-test` を持つ形で置くことで、`run-layer-machine-checks.sh` の動的収集（`--self-test` を実引数として処理する `.sh` を機械的に列挙する方式）に自動的に載る。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 種別追加・テンプレート変更のたびに6種別×2phase+screenの展開・実在確認を対話セッションで手動再現すると、実行のたびに確認漏れが生じる。実際に機能の単体テスト設計書0件は長期間気付かれずに残った\n- 既存 `check-manifest-persistence.sh` への機能追加: あちらは一覧マニフェスト（HTML一覧とmanifest.jsonの対応）の永続化検査が関心であり、設計単位1件ごとの配置フォルダに定義済みファイルが揃っているかという本検査の対象（`design-unit-layout.json` の phases 宣言と個々の設計書ファイル）とは検査対象が異なる\n- `scaffold-design-unit.sh` 自身の `--verify` への機能追加のみで済ませる: 既存の `--verify` は単一の kind/phase/識別子を指定された時にしか検査せず、「宣言されている全種別・全phaseを横断して検査する」という起動主体を持たない。本スクリプトは `--verify` を呼びつつ、宣言 JSON を独立に読み直す層として重ねることで、`--verify` 自体の実装不備からも独立に判定できるようにした\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`design-unit-layout.json` に kind を追加した場合、本スクリプトは kinds を動的に列挙するため追従は不要。screen の必須ファイル一覧（`scaffold-screen.sh` 内にハードコードされた8ファイル）を変更した場合は、本スクリプトの screen 委譲部分に変更は不要だが、self-test のケース3（実リポジトリ統合テスト）が新しい一覧を自動的に拾う。\n\n**廃棄条件**: 配置の定義（`design-unit-layout.json`）と生成物の突き合わせを廃止した時、または完備性検査をビルド基盤が標準で提供するようになった時。\n\n### check-internal-jargon.sh / check-internal-jargon.test.sh\n\n**必要性**: `docs/tasks/独自の言葉遣いをなくす指示書.md` が指摘するとおり、スキルの定義（`.claude/skills/*/SKILL.md`）とガイド（`.claude/skills/*/references/guide.html`）には、この場所でしか通じない言葉（束・検収・起こす・封印・封印済み・盲検・盲検分離・発火・昇格・降格・起票・スキャフォールディング・スキャフォールディングスクリプト・原本読解型・gold標準・back-edge 等）が残っている。これらは納品先の AI エージェント・エンジニアが読む文書であり、この場所を知らない読み手には意味が取れない。手動での洗い出しは書き手が変わるたびに再発するため、機械的な継続監視が要る。既存の `scaffold-rule-definitions.sh` の `scan_banned_terms`（scope=rule-definitions）は規約定義の生成物だけを対象にしており、スキルの定義とガイドは対象外だった。`delivery-payload/references/rule-banned-terms.json` の scope を `skills` に広げ、対応する語を走査する検査を新設する必要がある。`status=封印済み`・`採録v0確定` のような、実装が実際に返す値（enum値・バージョン付き状態値）としての使用は指示書5節の「コードの中の識別子」に相当するため、走査からの除外を機械側に持たせた。`generation-engine/scripts/tests/` ではなく `generation-engine/scripts/` 直下に置くのは、既存の `scan_banned_terms` と対になる語彙走査であり、対象範囲が異なるだけで役割が同等なため。`--self-test` を実引数として処理する形にすることで `run-layer-machine-checks.sh` の動的収集に自動的に載る。`check-internal-jargon.test.sh` は本体の `--self-test` を実行するだけのラッパーとし、判定の中身を二重に持たない（本体の `--self-test` を唯一の正とする）。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: スキル追加・改訂のたびに全 SKILL.md・guide.html を対話セッションで手動 grep すると、実行のたびに走査対象・除外条件がぶれる\n- 既存 `scan_banned_terms`（`scaffold-rule-definitions.sh` 内）への機能追加: あちらは規約定義の生成物（rule.md・rule.html）専用であり、対象ファイルも生成タイミング（`scaffold-rule-definitions.sh` 実行時）も異なる。スキル定義・ガイドはビルド生成物ではなく手書きの資産であり、同じ関数に混ぜると走査対象の判定が複雑になる\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。新しい語を辞書へ追加する場合は `delivery-payload/references/rule-banned-terms.json` の `scope` に `skills` を指定する。\n\n**廃棄条件**: 独自の言葉遣いをなくす取り組み自体を廃止した時。\n\n### check-pseudocode-code-mixing.sh\n\n**必要性**: `docs/tasks/設計書へ疑似コードと戻り値を足す指示書.md` の指摘（7 種別すべてで疑似コードの節が 0 件だった）へ対応し、API・テーブル・バッチ・帳票・外部連携・画面の 6 種別の詳細設計書テンプレートへ疑似コードの節を新設した。この節は「設計書にコードをそのまま貼ることを禁じ、分岐と繰り返しの入れ子だけを日本語で書く」という線引きを持つが、この禁止は今後テンプレートを改訂する人が繰り返し守る必要があり、目視だけに頼ると言語の構文（`{` `}` `=>` `===` `;`・`if (`・`for (`・`function `）が紛れ込んでも気付けない。第 1 層の機械検証（`run-layer-machine-checks.sh`）が動的に拾える形（`--self-test` を実引数として処理する `.sh`）で置くことで、テンプレート改訂のたびに繰り返し検査される。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: テンプレートを改訂するたびに疑似コードの節を目視で確認すると、確認の省略・見落としを繰り返す\n- 既存 `check-argjson-unbounded-value.sh` への機能追加: あちらは `generation-engine/scripts/` 配下のシェルスクリプト自身が持つ `jq --argjson` の安全性が関心であり、`delivery-payload/templates/` 配下の Markdown テンプレートの記述内容とは対象・判定式が異なる\n- 既存 `check-design-doc-section-consistency.sh` への機能追加: あちらは必須節の欠落、見出し順、未定義文書を判定する。節の中身にコードが混入していないかの検査とは判定式が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。検出パターン（言語の構文らしい記号・キーワード）を増減する場合は本スクリプトの `CODE_RE` を同時に更新する。\n\n**廃棄条件**: 疑似コードの節自体を廃止した時、またはコード混入の検出を別の静的解析ツールが標準で保証するようになった時。\n\n**1-239での拡張**: 記入規則は、言語の構文、変数名、API名を一括で禁止していた。しかし、対象プロジェクトへ適用した生成物には、関数名11種が残っていた。実装記法は8箇所だった。内訳は、メソッドチェーンの矢印 `->` が1箇所、アロー関数 `=>` が7箇所である。実装変数名も2箇所（`$_::U` 等）残っていた。\n\n関数名は、§8、§12、§18の実装契約が定める正当な事項である。APIは§12を、バッチ、帳票、外部連携、テーブルは§8を参照する。画面は§18を参照する。画面だけは、関数列を持たない構成である。一括禁止では、関数名と不正な実装記法を区別できなかった。\n\nこのため、6種別の記入規則コメントを節番号と列名に合わせて個別に改訂した。関数名を許容し、検出条件を絞った。`CODE_RE` には、メソッドチェーンの矢印 `->` を追加した。実装変数名を検出する `\\$[A-Za-z_]` も追加した。`::` 単独では正当な関数名と衝突するため、後者では `$` シジルを必須条件とした。対象となる関数名の例は `Page::Bid::pageMain` である。\n\n6種別のテンプレートを検査し、コード混入が0件であることを確認した。結果は `CLEAN: 7 件のテンプレートの疑似コードにコード混入はない` である。画面詳細設計書テンプレートの壊れた自書参照も修正した。「§18 実装契約の『ファイルと関数』」は実在しない節名だった。正しい節名は「18.1 ファイル分割と export 一覧」である。\n\n実装変数名検出における `mktemp` の判定不能規約は対象外とした。この検査では `mktemp` を使わないためである。別課題の `docs/tasks/mktemp失敗を判定不能として区別する指示書.md` が追跡する。\n\n### check-skill-frontmatter.sh\n\n**必要性**: `.claude/skills/` の52個のスキルは、`SKILL.md` の冒頭に設定（frontmatter）を持つ。この設定の形を検査するものは無かった。そのため、説明欄には英字、複数の文、このリポジトリを知らないと読めない語が混ざっていた。実測では、42 / 52が形式を満たしていなかった。混在例は `TRIGGER when:`、`SKIP:`、`setup/sync/teardown`、`baseline` である。\n\nスキルの説明は、納品先のエージェントと人が使用するスキルを選ぶ材料になる。読めない語が混ざると選べない。手で読み比べると、対話ごとに基準がぶれる。このため、4つの検査を機械で繰り返し判定する。検査対象は、日本語名の欄、説明が1文であること、動詞で終わること、説明に英字がないことである。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 52 個 × 4 検査を毎回手で組み立てると実行のたびに判定基準がぶれる。実際に、説明の英字を数える委任元のコマンドが `description:` という欄名自体を数えており、値が日本語だけでも 1 件と出る誤りを 3 名の担当が同時に指摘した\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n- `check-internal-jargon.sh` への同居: あちらはスキル本文に残る独自の言葉遣いを走査する。設定の形とは検査対象と判定式が異なる\n\n**保守責任者**: 人手（ユーザー）。設定の欄を増減する場合、または説明の決まり（1 文・動詞終わり・英字なし）を変える場合は、本スクリプトの 4 検査と自己テストを同時に更新する。\n\n**廃棄条件**: スキルの設定形式の検査を廃止した時、または設定の検査を配布基盤が標準で提供するようになった時。\n\n### check-skill-machine-inspection-consistency.mjs\n\n**必要性**: 設計書を生成するスキルでは、機械検査の情報が離れた箇所に書かれている。対象は、実行件数の宣言、検査定義の箇条書き、ループと停止条件、本文中の番号参照である。\n\n改善課題1-222の実測では、API基本設計スキルの検査実数と宣言件数が食い違った。半数の検査には番号がなく、業務語彙の検査は誤った番号を参照していた。他の生成スキルにも同型の問題があった。基本設計、詳細設計、機能、テーブルの各スキルに、番号なしと件数不一致が存在した。\n\n同じ不整合を繰り返さないため、機械検査Stepを持つ全生成スキルを横断検査する。宣言件数、定義数、1から始まる連番、件数参照、番号参照を突き合わせる。業務語彙の検査が意味上正しい参照先を持つことも確認する。機械検査Stepに規定形式の件数宣言がなければ、対象外にせず不合格とする。\n\n**代替案を採用しなかった理由**:\n- Bashツール直叩き: 対象スキルごとに機械検査節とループ・停止条件を手で突き合わせると、検査追加のたびに確認範囲と判定基準がぶれる\n- `check-skill-frontmatter.sh` への同居: あちらはfrontmatterの欄と説明文の形式が検査対象であり、本文中の機械検査節の構造とは関心が異なる\n- `check-phase-step-structure.mjs` への同居: あちらはPhaseとStepの構造・参照が検査対象であり、Step内部の検査項目数と番号は対象外である\n- Makefile・package.json scripts追加: このリポジトリはどちらも持たず、本検査専用の起動定義を増やす必要がない\n\n**保守責任者**: 人手（ユーザー）。機械検査の宣言文、検査定義の箇条書き形式、または対象スキルの命名規則を変更する場合は、抽出式と自己テストを同時に更新する。\n\n**廃棄条件**: 生成スキルが機械検査の件数・定義・参照を構造化データから生成するようになり、本文内で個別に同期する必要がなくなった時。\n\n### check-design-doc-required-items.sh\n\n**必要性**: 改善課題1-230は、詳細設計書に求める6項目の充足を検査する仕組みがない問題を扱う。対象は、クラス設計、メソッド設計、ロジック設計、戻り値と引数、エラー処理、データ定義である。\n\n既存の `check-design-doc-section-consistency.sh` は、節見出しの存在と順序だけを検査する。列の存在と値の記入は検査しない。そのため、章構成が一致しても内容が欠けた文書が合格しうる。内容を満たすために章構成を作り変えた文書（1-229）も検知できない。\n\nこの2つの穴を塞ぐため、6種別・6項目の対応を構造化データとして持つ。置き場の存在を第1段で、値の存在を第2段で判定する。第2段では全行が非空であることを確認する。判定基準は、テーブル定義書、API詳細設計書、画面詳細設計書の実物を突き合わせた結果に基づく。繰り返し実行できるスクリプトとして固定する。\n\n**代替案を採用しなかった理由**:\n- 既存の `design-doc-required-sections.json` への相乗り: あちらは節見出しの存在と順序を定義する。`requiredSections` は文字列配列である。本検査の「項目→節→表列→値の記入」という階層とは形が異なる。相乗りさせると、`check-design-doc-section-consistency.sh` の `jq` クエリが壊れる。同じファイルを触る1-229の作業とも衝突する\n- `check-design-doc-section-consistency.sh` への機能追加: あちらは `mktemp` の失敗を `[UNKNOWN]` と終了コード2で区別する規約に適合していない。素の代入で `mktemp -d` を使っているためである。同じ書き方を新規スクリプトへ引き継ぐと、欠陥を複製する。`check-portal-catalog.sh` は失敗を捕らえて `[UNKNOWN]` を返す。この形に倣う\n- Bashツール直叩き: 6種別×6項目の対応を毎回手作業で突き合わせると、実行のたびに判定基準がぶれ、値の記入漏れ（第2段）を見落とす\n- Makefile・package.json scripts追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`design-doc-required-items.json` の対応を変更する場合は、本スクリプトと自己テストを同時に更新する。対応は種別、項目、節、列である。画面の「メソッド設計」は現在 `applicable: false` である。1-190でテンプレートへ節を追加した場合は、定義を `applicable: true` へ切り替える。\n\n**廃棄条件**: 詳細設計書の6項目という規約自体を廃止した時、または項目の充足検査を別の機構が標準で保証するようになった時。\n\n### check-design-code-consistency.sh\n\n**必要性**: 改善課題1-231は、設計書と対象プロジェクトの実装が一致するかを検査する仕組みがない問題を扱う。実測では、APIの業務ルールが実装と食い違った。その結果、単体テスト設計書の9箇所も誤っていた。本文の「21サブルーチン」などの件数が、一覧の実数と3件食い違う例もあった。どちらも人手のレビューで偶然見つかるまで検知されなかった。\n\n改善課題1-246で、対象コードの行番号を入力にする経路は廃止した。定数値は、検証用TSVに記録したソース相対パスと定数名を安定キーとして照合する。行番号は保存しない。\n\n現在は定数値と2種類の文書内整合を機械的に判定する。対象は、設計値と実装定数、本文の件数と表の実数、および設計書間の境界値キーである。対応定義は構造化データとして持ち、対象と機械化の範囲を明確にする。\n\n**代替案を採用しなかった理由**:\n- 対象コードの行番号を持つ対応表を再設置する: コード変更のたびに納品物の追従を要求するため採らない。改善課題1-246で旧経路を廃止し、文書内の節番号または関数単位の契約へ一本化した\n- `check-detailed-design-conventions.cjs` への機能追加: あちらは文書構造の検査を担う。設計書間の内容整合を混ぜると、構造破損と内容不一致を区別できなくなる\n- Bashツール直叩き: 3種類の判定を対象プロジェクトごとに手作業で確認すると、実行のたびに判定基準がぶれ、食い違いが人手のレビュー任せになる\n- Makefile・package.json scripts追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`design-code-consistency.json`の機械化／人手の区分を変更する場合は本スクリプトと自己テストを同時に更新する。定数値のTSVは、ソース相対パス・定数名・設計値の3列を維持する。業務ルールの意味的な一致はリバース生成時の読解とレビューで確認する。\n\n**廃棄条件**: 設計書とコードの一致検査を廃止した時。または、設計書をコードから自動生成できるようになった時。記述の食い違いが構造的に起きなくなった時。\n\n### check-doc-cross-reference.sh\n\n**必要性**: 改善課題1-232は、文書間の整合と節番号の相互参照を検査する仕組みがない問題を扱う。実測では、1件のAPIで節番号の相互参照が4箇所切れていた。節を移送した後、旧番号を指す出典も27箇所残っていた。\n\n`§` を含む `.sh`、`.cjs`、`.mjs` 41件を全数調査した。参照先の実在を判定する検査は0件だった。約30件は節見出しの存在を判定する。約11件は抽出用の固定見出し、コメント、入力データである。\n\n節番号の相互参照を検査しないと、章構成を変えて他の検査を通す文書（1-229）を検知できない。改番後に取り残された参照も検知できない。\n\n**代替案を採用しなかった理由**:\n- 節の在庫を新しい定義ファイルへ持たせる: 設計書の§番号は、文書自身が `## §N` 見出しとして宣言する。別ファイルへ写すと定義が二重になる。1-230とは事情が異なる。節の在庫は各設計書の見出しから導出し、定義ファイルは持たない\n- `check-payload-references.sh` / `audit-consistency.sh` への機能追加: 両者は判定前に `#.*$` を切り捨てる。ファイルパスの実在を判定する。本検査は節番号が指す見出しの実在を判定する。対象が異なる\n- 改番追従に別の仕組みを設ける: 節を改番して参照を追従させなければ、その参照は「壊れた自書参照」として第1の判定がそのまま検出する。改番追従専用の仕組みは不要\n- 第3（同じ語の多義）・第4（断定と未確定の併存）の機械化: 自然文の意味を読む必要があり、機械検査の範囲を超える。`document-writing.md`「文書間の参照」節に人手の範囲として明記するだけに留める\n- Bashツール直叩き: 文書横断の相互参照を手作業で追うと、実行のたびに見落としが生じる。実際に27箇所の取り残しが人手のレビューでしか見つからなかった\n- Makefile・package.json scripts追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。参照記法（`\u003c文書名> §N` / 自書は `§N`）を変更する場合は本スクリプトと `document-writing.md`「文書間の参照」節を同時に更新する。小見出し（`### N.M`）が§を付ける表記へ変わった場合は `_extract_section_headings` の正規表現を同時に更新する。\n\n**廃棄条件**: 文書間の相互参照検査自体を廃止した時、または節番号を機械が自動採番・自動追従するようになり、参照切れが構造的に起こらなくなった時。\n\n### check-customer-facing-adequacy.sh / check-customer-facing-adequacy.test.sh\n\n**必要性**: 改善課題1-233は、顧客へ提示する文書の適合を検査する仕組みが配布物にない問題を扱う。この適合は、5段の判定にも含まれない。\n\n実測では、1件のAPIで8種類の問題が見つかった。記入規則の本文流出、第三者呼称、作る側の事情語、対応不能な確認先が含まれる。実装言語の用語、略語の未説明、指示語の非自己完結も含まれる。テンプレート本文にも記入規則がHTMLコメントの外に直接書かれていた。対象は7ファイル・8箇所だった。\n\n既存の `judge-task-done.sh`、第1層の集約、公開手順の検査は、この適合を検査対象に含めない。配布される規約27件、検査29種、`tests/` 配下54件も同様である。\n\n第1〜第4は、語の検出で機械的に `FAIL` を確定できる。対象は、指示文の残存、第三者呼称、作る側の事情語、確認先の妥当性である。第5と第6は、自然文の意味を読む必要がある。実装言語の用語と略語、指示語の自己完結は機械で合否を確定できない。\n\n両者を同じ検査に含めるため、3値の出力形式を使う。`REVIEW` は人手待ちで、合否に影響しない。`FAIL` は機械で確定した不合格である。\n\n**代替案を採用しなかった理由**:\n- `business-content-reviewer` を使う: これは顧客・社外提示資料の内容品質を判定する既存の専門家である。観点の定義は配布物の外にある。納品先の環境には存在しないため動かない。納品先へ移送する作業は1-233の範囲を超える\n- 走査対象を絞らない: 「納品先」「納品物」等の語は規約本文・テンプレート自身の記述として正当に使われており、対象を絞らずに走査すると規約が自分自身を不合格にする。走査対象を`\u003cproject_root>`配下の生成物（基本設計書・詳細設計書・生成HTML）だけに限定した\n- `rule-banned-terms.json`への相乗り: あちらは`scope`が`rule-definitions`／`skills`の2種のみで、顧客提示文書という第3の走査対象を想定していない。`category`・`machine`という別の属性（6分類・機械化の可否）を持つ`customer-facing-terms.json`を独立に新設した\n- 第5・第6を機械でFAIL扱いにする: 実装言語の用語（パッケージ・サブルーチン等）が文脈によっては正当な記述である場合と不当な流出である場合を機械では区別できない。機械はREVIEWとして検出するところまでに留め、人手の判定手段（誰が・いつ確認するか）自体は1-233の範囲外として明記する\n- `generation-engine/scripts/tests/` 側に判定の本体を実装する: 問題は配布物側の検査不在である。本体は配布物側の `checkers/` に置く必要がある。`tests/` 側は本体の `--self-test` を呼ぶ薄いラッパーとする。既存9件の先例と同じ形である\n- Bashツール直叩き・Makefile・package.json scripts追加: 6分類の語彙横断走査を対話セッションのたびに手作業で行うと判定基準がぶれる。このリポジトリはMakefile・package.jsonのどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`customer-facing-terms.json` の語彙、カテゴリ、機械化可否を変更する場合は、本体も更新する。対象の本体は `checkers/check-customer-facing-adequacy.sh` である。自己テストも同時に更新する。\n\n**廃棄条件**: 顧客提示文書としての適合検査自体を廃止した時、または`business-content-reviewer`相当の判定手段が配布物として同梱可能になり移送障壁が解消した時。\n\n**既知の限界**: `REVIEW`は該当箇所を出力するところまでを保証し、実際に人手が確認したかどうかまでは追跡しない。出力を無視して次工程へ進めば、第5・第6の判定は実行されないまま通過しうる。この残余のリスクは本検査の設計だけでは消えない。\n### check-shorthand-reference-declaration.sh\n\n**必要性**: 改善課題1-235は、他文書への参照が定型句のまま繰り返される問題を扱う。顧客提示の文書として冗長になる。ある対象プロジェクトでは、同じ定型句が基本設計書に14回、詳細設計書に7回現れた。合計21回である。1回は20文字を超え、表セルの幅を占めていた。\n\n`document-writing.md` の「他文書への参照の短縮」節は、初出で宣言して以後は短縮形を使う記法を定める。これを守らせるには、宣言を伴わない短縮形を機械的に検出する必要がある。`generation-engine/scripts/tests/*.sh` を横断検索しても、この構造を検査するものはなかった。既存語彙は、JSON定義ファイルの実在確認、型宣言、phase宣言などだけだった。\n\n**代替案を採用しなかった理由**:\n- Bashツール直叩き: 文書ごとに短縮ラベルと宣言文の対応を手作業で確認すると、実行のたびに見落としが生じる\n- Makefile・package.json scripts追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。短縮形の記法を変更する場合は、本スクリプトも更新する。対象の記法は `（\u003cラベル>: \u003c値>）` である。宣言文言は「この参照を」で始め、短縮ラベルを続ける。`document-writing.md` の「他文書への参照の短縮」節も同時に更新する。\n\n**廃棄条件**: 他文書への参照の短縮記法自体を廃止した時、または冗長な定型句の検出を別の機構が標準で保証するようになった時。\n\n**実装判断（ロケール）**: 本スクリプトは `LC_ALL=C` を設定しない。`LC_ALL=en_US.UTF-8` を明示する。これは、多バイト文字列の完全一致比較で `LC_ALL=C` を使う1-231とは逆の対応である。混同してはならない。\n\n実測では、`LC_ALL=C` を設定すると awk の `match()` が全角文字を含む正規表現を認識できなかった。短縮形参照が常に0件になった。正規表現の例は `（[^（）:：]+: [^（）]*）` である。原因は、`export LC_ALL=C` の有無だけが結果を左右することだった。\n\nコマンド前置きの `LC_ALL=C run_check ...` は、スクリプト先頭の `export` を上書きする。そこで awk の実行ごとに `LC_ALL=en_US.UTF-8` を明示する。呼び出し方に依存せず、UTF-8として解釈させる。完全一致比較とパターン抽出は性質が異なる。後者にはUTF-8ロケールが必要である。\n\n**1-238での拡張（matchType属性とロケールの使い分け）**: 1-238は、資料の冒頭に作る側の事情が書かれる問題を扱う。この検出を、1-233の第3検査へ追加した。既存語彙は「移送」「対象コード」のような名詞の完全一致だった。しかし、「〜から移した」のような文末表現は完全一致で検出できない。\n\n各 `term` エントリに `matchType` を追加した。値は `exact` と `pattern` である。`check_document` はこの値で分岐する。`exact` は `grep -F` と `LC_ALL=C` を使う。`pattern` は `grep -E` と `LC_ALL=en_US.UTF-8` を使う。両者は用途に応じて使い分ける。どちらか一方に統一してはならない。`pattern` 側は、呼び出しごとにロケールを明示する。回帰テストでも確認済みである。\n\n### check-document-style-register.sh\n\n**必要性**: 配布物は、生成する文書の文体を定めていなかった。`delivery-payload/references/` と `delivery-payload/templates/リバース検証/` を実測すると、敬体、常体、文体を指定する記述は0件だった。テンプレート本文の地の文が常体で書かれた例もあった。顧客提示の文書に常体を使うと、読み手との距離が遠くなる。\n\n`設計書様式.md` の§8は文体を区分する。顧客提示の文書は敬体とする。私たちの作業のための文書は常体でよい。区分を守る機械的な手段がないと、テンプレート改訂時に常体の文末が再混入しても気付けない。\n\n文末の出現で判定する。対象は、HTMLコメント、表の行、見出し行、コードフェンスを除いた地の文だけとする。手作業での確認は、対話ごとに判定基準がぶれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: テンプレート改訂・生成スキル改修のたびに地の文を目視で確認すると、判定基準がぶれ、実際に常体の混入を見落とす\n- 既存 `check-customer-facing-adequacy.sh` への機能追加: あちらは顧客提示適合の6分類を対象とする。指示文の残存、第三者呼称、作る側の事情語、確認先の妥当性が含まれる。文体は別の観点であり、混ぜると判定と混同する\n- 既存 `check-doc-heading-addendum.sh` 等の見出し検査への同居: あちらは見出し語の検出が関心であり、文単位の文末判定という走査方式が異なる\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。敬体・常体の判定語彙（です・ます・でしょう・ましょう・ください／である・だ）を増減する場合は本スクリプトの`jodoRe`・`keitaiRe`と`設計書様式.md`§8を同時に更新する。\n\n**廃棄条件**: 文体の区分自体を廃止した時、または文体の一致検査を別の機構（自然文の意味を読む機構等）が標準で保証するようになった時。\n\n**除外の仕組み（1-260）**: `check-document-style-register.sh` は当初、常体でよい文書を除外していなかった。様式の定義（設計書様式.md §8）は「私たちの作業のための文書は常体でよい」と認める。対象は3種である。検査できない理由を記録する`design-notes.md`・納品するスキルの定義`SKILL.md`・レビューを担う定義`rule-reviewer.md`である。実測では、対象プロジェクトへ適用すると165件が不合格になった。顧客提示文書を直した後も20件が残った。その全件がこの3種だった。除外の対象一覧は`delivery-payload/references/document-style-exclusions.json`の`excludedBasenames`へ機械可読な形で持たせる。`check-document-style-register.sh`はファイル名（basename）の完全一致でこの一覧だけを読む。一覧をスクリプト内へ直書きしない。走査条件を定義ファイル側に持たせる方針は、1-266・1-267の`design-code-consistency.json`と同じである。除外した件数は実行結果の末尾へ「除外 N 件」の形で常に出す。一覧に無いファイル名（例: `design-notes-old.md`）は除外されない。顧客提示文書と同様に、常体があれば従来どおり不合格になる。\n\n### check-document-style-register-exclusion-source.sh\n\n**必要性**: 除外一覧を定義ファイル側（`document-style-exclusions.json`）へ持たせる方針（1-260）には、再混入のおそれがある。`check-document-style-register.sh`本体を書き換えるたびに、除外対象のファイル名がスクリプト本文へ直書きで再び紛れ込みうる。実際に1-260の作業前は除外の仕組み自体が無かった。対象一覧をどこに持つかという設計判断が、今後の改修で崩れないことを繰り返し確認する必要がある。確認は3点で行う。第1に定義ファイルの実在である。第2に必須3件（`design-notes.md`・`SKILL.md`・`rule-reviewer.md`）の登録である。第3に検査スクリプト本体（`self_test`関数を除く本番コード）へのファイル名直書きの不在である。この3点を機械的に確認し、繰り返し実行できるスクリプトが要る。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 改修のたびに定義ファイルの中身とスクリプト本文を手動確認すると、確認の省略・見落としを繰り返す\n- `check-document-style-register.sh`自身の`--self-test`への機能追加: あちらは検査結果の合否（敬体・常体の判定と除外の適用結果）が関心である。定義ファイルの配置・スクリプト本体への直書きの有無という「除外の仕組みがどこに実装されているか」という構造検査とは対象が異なる。`--self-test`の対象を混ぜると、判定ロジックの回帰確認と構造検査が1本の中で混同する\n- 既存`check-design-doc-section-consistency.sh`等の定義ファイル突合検査への機能追加: あちらは設計文書の必須節見出しが定義と一致するかを見る。除外一覧のファイル名という別種の定義データを対象に含めると、走査対象・判定式が異なるため同居させにくい\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。除外対象の3件（`design-notes.md`・`SKILL.md`・`rule-reviewer.md`）を増減する場合、更新対象は3つである。本スクリプトの`REQUIRED_NAMES`・`document-style-exclusions.json`・`設計書様式.md`§8である。これらを同時に更新する。\n\n**廃棄条件**: 文書の文体の検査（`check-document-style-register.sh`）自体を廃止した時、または除外一覧の定義ファイルへの分離を別の機構が標準で保証するようになった時。\n\n### check-confirmation-target.sh\n\n**必要性**: `docs/tasks/要確認事項の記録先が存在しない問題を直す指示書.md`（改善課題1-223の積み残し）を扱う。`delivery-payload/templates/リバース検証/` 配下の25様式・63箇所が「本書の要確認事項一覧へ記録する」と指示する。ところが、その節（`## 要確認事項一覧`）を持つ様式は1件も無い。指示された記録先が存在しないため、担当は書く場所を見つけられない。この状態は毎回の手作業では洗い出せない。往復検証や様式の改訂のたびに確認できる形（`--self-test` 付きの独立したスクリプト）が要る。\n\n指示書は当初、記録先を「1-223・1-199が定める根拠を記録する資料」へ向け直す想定だった。ところが `根拠資料|根拠を記録する資料|設計単位根拠台帳|共通文書根拠台帳` という語は、既に禁じられている。禁じたのは改善課題1-246（対象コードの行番号に依存する根拠台帳2種の廃止）である。`check-design-doc-section-consistency.sh`（`generation-engine/scripts/tests/` 配下）に自己テストがある。その検査名は課題1-223-廃止済み資料名を含む参照の残存数で、この語の出現を0件で要求する。1-246のコミット（bd5d289）は、根拠台帳への参照をすべて「要確認事項一覧」へ戻していた。1-223がいったん外した記録先の呼称を、無自覚に復活させていた。指示書の想定どおり向け直すと、既存の自己テストを直ちに壊す。\n\nこの矛盾を踏まえ、記録先を別の呼称へ差し替える案は採らなかった。かわりに「本書内に実在しない節への指示」そのものを、対象配下から無くす形で直した。検査1は「要確認事項一覧」への指示が0件であることを見る。検査2は、指示書が定めた条件（「要確認事項」を含む行のうち「根拠を記録する資料」を含まない行が0件）をそのまま実装した。ただし対象配下から「要確認事項」という語自体が無くなった。この結果、検査2の分母は0件になり、絞り込み条件は到達しない分岐として残る。到達しないことは欠陥ではない。記録先を無くしたことの必然の帰結である。\n\n**代替案を採用しなかった理由**:\n- 指示書の原案どおり「根拠を記録する資料」へ向け直す: 改善課題1-246で廃止済みの資料名である。既存の自己テストが対象配下への再出現を0件で要求するため、直ちに壊す\n- 「要確認事項一覧」の名称のまま、置き場だけを別途定義する: 置き場の新設は本指示書の範囲を大きく超える。新設には `output-layout.json`・`design-unit-layout.json`・スキル手順の追加が要る。様式の節を増減しないという触らない範囲にも反する\n- Bash ツール直叩き: 63箇所・25様式を対話セッションのたびに手作業で洗い出すと、確認の省略・見落としを繰り返す。改善課題1-223自身の検収は「要確認事項一覧へ移す」という語だけを数え、「へ記録する」という同義の表現を見落としていた\n- 既存 `check-design-code-consistency.sh` / `check-doc-cross-reference.sh` への機能追加: 両者は関心が異なる。前者は設計書とコードの突合、後者は文書間の節番号の突合が関心である。様式内の指示文が指す記録先の実在確認とは検査対象が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。対象配下（`delivery-payload/templates/リバース検証/`）へ「確定できなかった事項をどこかへ記録する」という指示を新たに書く場合がある。その場合は、指し先が実在する節・実在するファイルであることを確認してから追加する。確認には本スクリプトまたは同種の検査を使う。検査2の絞り込み条件（「根拠を記録する資料」を含まない行の判定）は、指示書が定めた文言をそのまま保持している。削除・簡略化する場合は、本節と `docs/tasks/要確認事項の記録先が存在しない問題を直す指示書.md` を同時に更新する。\n\n**廃棄条件**: `delivery-payload/templates/リバース検証/` から「確定できなかった事項の記録先」という指示自体を無くした時。または、記録先となる資料（要確認事項一覧・根拠を記録する資料のいずれか）が置き場・様式ともに正式に定義され、様式内の指示文がその定義済みの記録先を指すよう改めた時。\n\n### check-retired-terms.sh\n\n**必要性**: 廃止した資料・節の名前が、複数の検査にそれぞれ直接書かれていた。新しく指示書を書く担当は、その語が既に廃止されていることを知る手段を持たなかった。実測（2026-08-24）: 「要確認事項の記録先を根拠を記録する資料へ向け直せ」という指示書を起票した。改善課題1-246（コミット bd5d2892426ef5341e259d20f13d887feebb0b1c）が既にその資料を廃止していたことが判明した。同じ4語（根拠資料・根拠を記録する資料・設計単位根拠台帳・共通文書根拠台帳）が2つの検査に直接書かれていた。対象は `generation-engine/scripts/tests/check-design-doc-section-consistency.sh` である。もう一方は `generation-engine/scripts/tests/test-api-design-decisions.sh` である。探し漏らせば片方だけが古い一覧で判定する状態だった。`docs/references/retired-terms.json`（定義）へ一覧を1本へ集め、この3ファイルが同じ一覧を読む形にすることで、廃止語が増えても書き直す箇所を1つに保つ。加えて、`docs/tasks/` の指示書の本文を一覧と突き合わせ、廃止語が残っていないかを繰り返し確認する必要があり、`--self-test` を持つ独立したスクリプトへ固定する。\n\n台帳（`指摘改善一覧.md`・`作業課題一覧.md`）は指示書ではなく、起きた出来事の記録である。過去に廃止語を使っていた事実そのものを記録として持つため、対象から外す。この区別は `.claude/rules/always/tasks/commit-issue-trace/rule.md`「台帳を対象外にする理由」が既に定めたものをそのまま再用する。同様に、コード柵（```）で囲んだ引用も対象から外す。柵の中は語の例示であり、今後の起票が生きた参照として使う記述ではない。この判定は `.claude/rules/always/tasks/instruction-format/rule.md` 付属の `check-instruction-format.sh` の `strip_fences` と同じロジックを再用する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 廃止語が増えるたびに複数の検査ファイルを対話セッションで手動 grep して書き直すと、探し漏らしが起こる。実際に今回、片方の検査だけが古い一覧で判定する状態が起きていた\n- 廃止語を各検査へ直接書き続ける（一覧へ集約しない）: 探し漏らしの再発を防げない。起票する担当はどちらの検査も読まないため、廃止を知る経路が無いままになる\n- `「...」` で囲んだ引用も対象から外す: 引用符は「過去の言及」と「今も生きた指示」を区別しない。`「その根拠を記録する資料に書け」と書いた` のような、引用符に包まれた生きた誤指示を見逃す。本検査が捕まえたい失敗そのものであるため採らなかった\n- 既存 `check-design-doc-section-consistency.sh` / `test-api-design-decisions.sh` への機能追加: 両者は生成物・テンプレートの残存確認が関心であり、`docs/tasks/` の指示書本文の走査とは対象が異なる。両者は本検査と同じ一覧（`docs/references/retired-terms.json`）を読む側に留める\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。資料・節を新たに廃止する場合は `docs/references/retired-terms.json` へ1件追記する（語・廃止した改善課題番号・コミットハッシュ・置き換え先）。台帳の除外対象（`LEDGER_BASENAMES`）を増減する場合は本スクリプトと `.claude/rules/always/tasks/commit-issue-trace/rule.md`「台帳を対象外にする理由」を同時に確認する。\n\n**廃棄条件**: `docs/tasks/` による指示書の受け渡し運用自体を廃止した時、または廃止語の一覧管理を別の仕組みが標準で提供するようになった時。\n\n### check-detail-page-backlink.sh\n\n**必要性**: 改善課題1-212は3種別の戻るリンクが壊れる問題を扱う。対象は`design-system`・`component-inventory`・`icon-catalog`である。`build-detail-page.sh`を`--portal-dir`なしで実行すると戻るリンクが`index.html`のまま壊れる。この3種別は`build-portal.sh`に対応する作り直しの手順を持たない。他の7種別と違って後から直る経路が無い。判定は複数段の手順である。一時領域を作り、見本HTMLからpage-dataを取り出し、`build-detail-page.sh`を`--portal-dir`なしで実行し、生成HTMLの戻るリンクを見る。1行の縦棒なしコマンドへ収められない（`.claude/rules/always/tasks/instruction-format/rule.md`の設計判断を参照）。この是正が実際に効いたかを繰り返し確認する必要があり、スクリプトへ固定する。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 3種別×複数段の手順を対話セッションのたびに手で組み立てると、実行のたびに判定基準がぶれる\n- 判定の式を指示書の表へ直接書く: 式に含まれる縦棒が片付けの判定器の列区切りと衝突し判定行を壊す\n- 既存`check-portal-dir-ascii.sh`への機能追加: あちらは既に生成済みのHTMLのディレクトリ名を見る検査である。`--portal-dir`未指定時の戻るリンクの値を見る本検査とは対象が異なる\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。対象の3種別を増減する場合は本スクリプトの`main`内の対象一覧を更新する。見本HTMLの配置を変える場合も同様である。\n\n**廃棄条件**: 改善課題1-212の是正自体を撤回した時。または`build-portal.sh`が3種別すべてを自身の手順で作り直すようになった時。\n\n### check-portal-label-collision.sh\n\n**必要性**: 改善課題1-213は名前の衝突検出の穴を扱う。`output-layout.json`の置き場の値（英字）と`portal-catalog.json`の表示見出し（label）は別の鍵に分かれている。既存の逆戻り検知（`check-portal-dir-ascii.sh`）は短い旧名4語だけを対象とし、label値を完全一致の契約として検査しない。「マトリクス・対応表」は検出せず、「基盤情報」は短名「基盤」への前方一致で副次的に検出するだけである。このため、label値を動的に完全一致で検査する仕組みがない。判定は複数段の手順である。`portal-catalog.json`からlabel一覧を読み、`project-portal`直下の実ディレクトリ名と突き合わせる。1行の縦棒なしコマンドへ収められない。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: label一覧の取得とディレクトリ名との突き合わせを対話セッションのたびに手で組み立てると、判定基準がぶれる\n- 既存`check-portal-dir-ascii.sh`への機能追加: あちらは`project-portal/`直後から4つの既知短名（図|対応表|基盤|画面）への前方一致を検査する。このため「基盤情報」は副次的に検出するが、「マトリクス・対応表」は検出しない。`categories[].label`を動的に読み、実ディレクトリ名と完全一致で突き合わせる本検査とは起点と判定が異なる\n- 既存`detect_stale_portal_placeholders`（build-portal.sh内）への機能追加: あちらは`output-layout.json`の値との突き合わせが関心である。label値との突き合わせという別の対象を持ち込むと責務が混在する\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。`portal-catalog.json`のカテゴリ構造（`categories[].label`）を変更する場合は`labels_from_catalog`を同時に更新する。\n\n**廃棄条件**: 改善課題1-213の是正自体を撤回した時。またはlabelと置き場の名前の衝突を別の機構が標準で検出するようになった時。\n\n#### 第1層集約用ラッパー（`generation-engine/scripts/tests/check-portal-label-collision.sh`）\n\n**必要性**: 本体は`docs/scripts/`配下にあり、第1層の集約対象外である。集約から本体の自己テストを実行する入口が必要である。\n\n**代替案を採用しなかった理由**:\n- 集約本体の変更: 汎用集約へ個別の検査名を持ち込むことになる\n- 判定の複製: 本体とラッパーの二重定義化になる\n- 本体の移動: `docs/`配下へ検査を置く責務を崩す\n\n**保守責任者**: 人手（ユーザー）。本体のパスまたは自己テストの契約を変更する時は、このラッパーを同時に更新する。\n\n**廃棄条件**: 本体を廃止した時。または集約が`docs/scripts/`を標準収集するようになった時。\n\n### check-confirmation-ledger-current-template.sh\n\n**必要性**: 改善課題1-215は承認条件検査の機能停止を扱う。`check-confirmation-ledger.mjs`は「## 要確認事項一覧」という見出しを設計書に求める。後発の改善課題1-223がその見出しを画面詳細設計書テンプレートから消した。この結果、現行テンプレートに対して常に異常終了する。`test-confirmation-ledger.mjs`の自己テストは、この見出しを持つ合成フィクスチャを使い続けている。現行テンプレートとの乖離を検知できずにPASSし続ける。改善課題1-215自身がこの乖離の実例である。再現手順は複数段になる。一時領域の作成・複製・台帳の合成・実行という手順であり、1行の縦棒なしコマンドへ収められない。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 現行テンプレートの複製と実行を対話セッションのたびに手で組み立てると、再現手順がぶれる\n- `test-confirmation-ledger.mjs`の合成フィクスチャを直接更新する: それ自体は本指示書のやることに含まれる。更新後に現行テンプレートへ機能するかを独立に確認する手段が別途要る。合成フィクスチャを直した本人が検証すると、乖離を再び見落としうる\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。画面詳細設計書テンプレートの節構成を変更する場合は、テンプレートパスと`status`書き換えの正規表現を同時に確認する。\n\n**廃棄条件**: 改善課題1-215の是正自体を撤回した時。または`check-confirmation-ledger.mjs`が設計書本文に依存しない形へ再設計された時。\n\n## 機械強制\n\n| timing | スクリプト | 挙動 |\n|---|---|---|\n| build-*.sh --self-test | generation-engine/scripts/tests/test-portal-conventions.sh | 生成後 HTML の規約検査。FAIL なら self-test も FAIL |\n| 手動実行 | generation-engine/scripts/check-doc-claim-freshness.sh | `docs/` 配下の Markdown を走査し、時点の表明がない未完了の断定があれば exit 1 |\n| run-layer-machine-checks.sh の集約（自動収集） | generation-engine/scripts/tests/check-design-unit-file-completeness.sh | 配置の定義（design-unit-layout.json）が挙げる全種別・全phase・screenについて、宣言ファイルが実際に生成されるかを横断的に確認し、1件でも欠落すれば exit 1 |\n| 手動実行・スキル変更時 | generation-engine/scripts/check-skill-machine-inspection-consistency.mjs | 機械検査Stepを持つ全生成スキルを検査する。宣言欠落もしくは不一致があれば exit 1 |\n\n## 違反検知時の手順\n\n1. FAIL した観点キーを確認する\n2. テンプレート（`delivery-payload/templates/` 配下）の該当箇所を修正する\n3. サンプルを再生成して再検証する\n\n### check-real-world-cases.sh\n\n**必要性**: 配る検査 29 本はそれぞれ `--self-test` を持つが、その入力はその検査を書いた本人が用意したものである。書いた本人が思いつかなかった書き方は入力に入らないため、素通りしても自己テストは合格を返す。実測（2026-08-24）で見つかった。`check-loop-query-call` は繰り返しと問い合わせを同じ行に書く形（`xs.map((x) => db.query(sql))`）だけを素通りしていた。自己テスト 12 件はすべて合格していた。`check-direct-commit-to-integration-branch` も入力に `.cwd` が無いと枝の判定ごと落ちて素通りし、自己テスト 11 件はすべて合格していた。検査とは別に用意した入力集を全検査へ横断で流し、止めてほしいものが止まるかを一覧にする仕組みが要る。入力集は今後も増えるため、繰り返し実行できるスクリプトへ固定する。\n\n**代替案を採用しなかった理由**:\n- 各検査の `--self-test` へ入力を足す: 入力を足すのは検査を書いた本人であり、思いつかない書き方は足されない。同じ盲点が同じ形で残る。検査とは別の場所に入力集を置き、別の担当が足せる形にすることが目的そのものである\n- Bash ツール直叩き: 検査 29 本へ入力を流す作業を対話のたびに手で組み立てると、流す入力も判定の基準も実行のたびにぶれる\n- 既存 `run-layer-machine-checks.sh` への機能追加: あちらは各検査の `--self-test` を集めて走らせる集約であり、検査とは別に用意した入力を流すという関心が異なる。本スクリプトは `generation-engine/scripts/tests/` へ置くことで、あちらの動的な収集に自動的に載る\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。検査の素通りを見つけたら、直すのと同じコミットで `delivery-payload/references/checker-real-world-cases.json` へ回帰の標本を足す。標本の形式（`checker`・`label`・`expect`・`input`）を変える場合は本スクリプトと自己テストを同時に更新する。\n\n**廃棄条件**: 配る検査を廃止した時、または実際の書き方での確認を別の仕組み（各検査への入力自動生成等）が標準で提供するようになった時。\n\n### check-evidence-column-removed.sh\n\n**必要性**: 納品先の判断で、設計書から根拠（対象コードのファイルと行）を外し、一から書いた設計書と同じ体裁にする整理が決まった（改善課題1-199・1-206・1-227）。42 の様式のうち 41 は外し終えたが、テーブル定義書の外部キーの表だけ「出典参照」という別の名前で残っていた（実測 2026-08-24）。名前を変えて残ると、根拠という語だけを探しても見つからない。様式は今後も増減し、そのたびに 42 件を目視で確かめるのは現実的でない。表の見出し行だけを見て、役割が同じ語（根拠・出典・出典参照・根拠パス・対象コード・抽出元・ソース参照）を持つ欄を機械的に拾う必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 様式を改訂するたびに 42 件へ手で grep を当てると、探す語も判定の基準も実行のたびにぶれる。実際にこの取り残しは、根拠という語だけを探していたため長く見つからなかった\n- 既存 `check-design-doc-section-consistency.sh` への機能追加: あちらは必須の節の名前と並びが定義と一致するかを見る。表の中の欄の名前を見る本検査とは判定式が異なる。同居させると、節の検査と欄の検査が 1 本の中で混ざる\n- 本文の記述まで対象に含める: 「原本コードを根拠にしない」のような記入規則の説明は、外す整理そのものを述べたものであり残ってよい。表の見出し行だけに絞ることで、この誤検出を避ける\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。根拠の欄とみなす語を増減する場合は本スクリプトの `EVIDENCE_HEADS` と本節を同時に更新する。\n\n**廃棄条件**: 設計書から根拠を外す整理自体を撤回した時、または様式を定義から自動生成するようになり、手で欄を足せなくなった時。\n\n### check-mktemp-placement.sh\n\n**必要性**: 検査スクリプトが一時ファイルを作るとき、置き場を指定せずに `mktemp` を呼ぶと、実行環境によっては既定の置き場へ書けない。この場合、検査が「判定できない」を返したまま一度も動かない。実測（2026-08-24）で確かめた。エラーは `mktemp: mkstemp failed on /var/folders/.../T/tmp.XXXX: Operation not permitted` だった。同じ環境で `${TMPDIR:-/tmp}` を明示すると成功する。この置き場の指定漏れは `docs/scripts`・`generation-engine/scripts` に見られる。同様に `delivery-payload/templates/rules/checkers`・`.claude/rules` にも見られる（是正前の実測で276箇所・178ファイル）。修正のたびに全件を目視で確認するのは非現実的で見落としを招く。修正が終わった後も、新しいスクリプトが同じ書き方（裸の `mktemp`）を再導入しうるため、繰り返し実行できる検査として1本に固定する必要がある。判定の式を指示書の表へ直接書けない（式に縦棒を含み、片付けの判定器が列の区切りと読み違えて判定行を壊す）ため、スクリプトへ切り出した。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 4つの置き場・178ファイルへの走査を対話セッションのたびに手動で `grep` する。コメント行・メッセージ文字列・識別子名（`mktemp_ok` 等）との区別が実行のたびにぶれる。実際に本検査の開発時にも自分自身の説明文（「作成に失敗しました(mktemp)」）を誤検出する事故が起きた。自身のファイル名（`check-mktemp-placement.sh` 自体に \"mktemp\" を含む）も同様に誤検出した\n- 既存 `check-argjson-unbounded-value.sh` への機能追加: あちらは `jq --argjson` への値渡しの安全性（許可リスト方式）が関心である。`mktemp` の置き場指定という別の実装パターンの検査とは対象・判定式が異なる\n- 既存 `check-broken-verdict-rows.sh`・`check-layer1-declarations.sh` への同居: いずれも指示書の判定表が壊れていないかを見る検査である。本検査はスクリプト本文の `mktemp` 呼び出しそのものを見るもので、対象が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。走査対象の4つの置き場を増減する場合は本スクリプトの `TARGET_DIRS` と本節と `docs/tasks/一時ファイルの置き場を指定せず検査が動かない問題を直す指示書.md` を同時に更新する。呼び出し位置の判定（`$(` ・バッククォート・`;`・`&&`・`||`・行頭）を増やす場合は `is_call_pos` の分岐を同時に更新する。\n\n**廃棄条件**: `mktemp` を使う検査スクリプトが1本もこの置き場指定漏れを起こさない仕組み（例: 共通ラッパー関数への全面移行）へ切り替わった時。または、`mktemp` 自体をこのリポジトリの検査スクリプトが使わなくなった時。\n\n### docs/scripts/check-payload-layer1.sh\n\n**必要性**: 配布元での合格は配布先での合格を意味しない。実測（2026-08-27）で、配布元は242本すべて成功する一方、配布先では6本落ちていた。原因は3つだった。公開対象から外したスクリプトを無条件に呼ぶもの1本、配布物の境界を越えて外側のリポジトリのルートを掴むもの2本、依存の不在3本である。検証する側は配布先を見るため、配布元だけで確かめて合格と報告すると指摘が解消しない。配布先で第1層を集約し失敗0本を確かめる入口を、公開のたびに繰り返し呼べる形で持つ必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 公開のたびに配布先のパスを手で組み立てて集約を呼ぶと、対象の指定や判定の読み取りが実行のたびにぶれる\n- `run-layer-machine-checks.sh` への機能追加: あちらは走査の起点を引数で受け取る汎用の集約であり、配布先という特定の置き場を知るべきでない。本スクリプトは配布先の実在を確かめてから集約を呼ぶ薄い入口である\n- 自己テストを持たせる: 偽の集約を用意して合否を確かめる形になり、本物の集約と食い違う恐れがある。3経路（配布先なし・失敗0本・失敗あり）を実測で確認する形を採った\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。受け口 `.claude/rules/always/publish/publish-values.txt` が定める配布先を変える場合は本スクリプトを更新する。あわせて `.claude/rules/always/publish/complete/rule.md` の手順6も同時に更新する。\n\n**廃棄条件**: 公開先リポジトリへの同期運用を廃止した時、または集約が配布先を自動で走査するようになった時。\n\n### generation-engine/scripts/glossary/classify-legacy-terms.py / classify-legacy-terms.sh\n\n**必要性**: 用語管理の契約は、確認できない移行データを再承認まで公開しないことを定める。公開の状態は3つ（候補・承認済み・確認できないもの）だが、既存の用語をこの3つへ分類する道具が無かった（2026-08-28実測。用語管理の7領域のうち移行だけが専用の道具を持たなかった）。分類の基準（承認の記録と出典の有無）を1箇所へ固定し、候補を自動で承認しないことと全行を分類できたことを繰り返し確かめる必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 用語ごとに承認の記録と出典の有無を手で確かめると、判定基準が実行のたびにぶれ、候補を誤って承認しかねない\n- `validate-semantic-glossary.py` への機能追加: あちらは様式と意味の検証（重複・参照切れ・循環・状態遷移）が関心であり、既存データを移行の状態へ分類するという別の目的を混ぜると責務が肥大化する\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。3状態の判定基準（承認の記録・出典の有無）を変える場合は本体の `classify_term` と入口の自己テストを同時に更新する。\n\n**廃棄条件**: 用語管理の移行の仕組みを廃止した時、または分類を検証器が標準で担うようになった時。\n\n### generation-engine/scripts/glossary/tests/test-glossary-lifecycle-e2e.sh\n\n**必要性**: 用語管理は候補の検証・変更の検証・用語集の検証・投影という段を持ち、段ごとの検査は既にあった。ところが段をまたいだ流れが通ることを確かめるものは無かった（2026-08-28実測）。段ごとに合格しても、段の間の受け渡しが壊れていれば通しでは動かない。5段を1本で通す検査を、集約から繰り返し呼べる形で持つ必要がある。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 5段の引数の組み合わせ（登録簿を渡すかどうか等）を対話セッションのたびに手で組み立てると、実行のたびに判定基準がぶれる。実際に最初の実装では登録簿の渡し方を誤り3段が落ちた\n- `test-validate-semantic-glossary.sh` への機能追加: あちらは検証器の単体の検査（91ケース）であり、投影を含む段の通しとは対象が異なる\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。段の構成（5段）や見本の組み合わせを変える場合は本スクリプトと `delivery-payload/references/semantic-glossary-contract-v0.1.md` の6節を同時に更新する。\n\n**廃棄条件**: 用語管理の段の構成を廃止した時、または通しの検査を別の機構が標準で提供するようになった時。\n\n### generation-engine/scripts/tests/ の集約入口10本\n\n**必要性**: 第1層の集約は、引数として `--self-test` を処理する `.sh` か、`tests/` 配下の `test-` で始まる Node.js の検査を集める。引数を取らず実行そのものが検査になる形の10本はどちらにも当たらず、一度も実行されないまま残っていた（2026-08-28実測）。うち1本は実際に不合格で、26件の期待のうち1件の目印が失われていた。他の9本は合格していたが、集約から外れているため退行を検知できない状態だった。本体を改名すると既存の設計判断や検収コマンドが持つ名前の参照が切れるため、改名せずに集約から呼ぶ入口が要る。10本は構造も判断も同一のため1つの節にまとめる。\n\n対象は `check-photo-findings-29`・`check-human-guide-counts`・`check-ledger-commands-portable`・`check-ledger-commands-runnable`・`check-ledger-file-count`・`check-payload-doc-counts`・`check-reference-json-integrity`・`check-retired-terms-in-samples`・`check-skill-cross-references`・`check-template-guidance-skill-steps` である。\n\n**代替案を採用しなかった理由**:\n- 本体を `test-*.sh` へ改名する: 部分文字列が失われ、既存の検収コマンドや設計判断の相互参照が壊れる\n- 集約の収集条件そのものを広げる: 既に集約へ載っている200本以上の収集結果を変える危険を伴う。個別の入口で橋渡しする方が影響範囲が小さい\n- 判定の中身を入口へ写す: 本体と入口の二重定義になり、片方だけが更新されて食い違う\n- Bash ツール直叩き: 繰り返し実行する検査であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張・package.json scripts 追加: このリポジトリはどちらも持たない\n\n**保守責任者**: 人手（ユーザー）。本体の呼び出し方（引数）を変える場合は対応する入口も同時に更新する。\n\n**廃棄条件**: 対応する本体が廃止された時、または集約の収集条件が拡張子・置き場を問わず自己テストを検出できるようになった時。\n\n## プロジェクト上書き\n\n- 上書き可否: プロジェクト固有規約（reverse-docs-skills 専用）\n- 理由: リバース設計ポータルの生成 HTML のみを対象とし、他プロジェクトへの展開対象を持たない\n\n## 関連\n\n- `delivery-payload/templates/tokens.css` — カラートークンの定義\n- `generation-engine/scripts/tests/test-portal-conventions.sh` — 本規約の自動検証スクリプト\n\n### check-reference-column-content.sh\n\n**必要性**: 課題1-234は、テンプレート表の「根拠」列を「参照先」へ改名する。列へ何を書くかの規則も定義する。挙動の記述や実装の位置が混入した場合は、機械検査で不合格にする。\n\n「参照先」列は、節番号や関数単位の契約など、文書内の参照だけを持つ。動詞で終わる挙動の記述が混入すると、設計書様式.mdの7節に反する。テンプレートと生成済み設計書のどちらにも適用できる検査として持つ。手作業では再現性を保てない。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: テンプレート・生成済み設計書を改訂するたびに手動で参照先列の内容を読み比べると、確認の省略・見落としを繰り返す\n- 既存 `check-design-doc-section-consistency.sh` への機能追加: あちらは必須節の見出しと並びを検査する。表の列の内容を検査する本スクリプトとは判定式が異なる\n- Makefile / package.json scripts 追加: このリポジトリはどちらも持たない\n\n**実装判断（awkからnodeへの切り替え）**: 表の列位置検出と日本語文字列の一致判定を、当初はbash/awkで実装した。macOS標準のawkは、多バイト文字列同士の `==` 比較で誤って真を返した。One True Awk系のバージョン20200816で実測した不具合である。gawkは本環境に導入されていない。\n\nself-testでこの不具合を検出し、判定の中核を `node -e` へ委譲した。この判断は、環境依存の不具合を再び踏まないためのものである。スクリプト本体のコメントにも記載している。`~/.claude/rules/always/design-record/implementation-decision/rule.md` が求める実装判断である。\n\n**保守責任者**: 人手（ユーザー）。挙動の記述を判定する語彙（動詞語尾のパターン）を増減する場合は本スクリプトの`behaviorRe`と本節を同時に更新する。\n\n**廃棄条件**: 「参照先」列の記入規則自体を廃止した時、または列内容の意味検査を別の機構（自然言語処理を伴う専用の検査等）が標準で提供するようになった時。\n\n### snapshot-skills.sh\n\n**必要性**: このリポジトリのスキルは52本あり、週ごとにどれが増え、どれが書き直されたかを追う手段が無かった。コミットの履歴は 2026-08-21 に作り直されており、`.claude/skills/` を変更したコミットは初期化の1件だけで、タグも0件である。過去にさかのぼって週ごとの状態を復元できないため、今後の週ごとの状態を記録し続ける仕組みが要る。記録する項目は4つ（日本語名・説明・段の数・道具の数）で、52本すべてについて毎週同じ手順で取る必要がある。対話セッションで毎週手作業で集めると、取る項目も集計の基準も実行のたびにぶれる。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 52本の4項目の抽出を毎週手で組み立てると、実行のたびに基準がぶれる。二重記録の判定も毎回人が覚えていることになる\n- 既存 `docs/scripts/report-progress.sh` への機能追加: あちらは `docs/tasks/指摘改善一覧.md` の状態を集計する。スキルの構造を記録する本処理とは、対象と出力先が異なる\n- `generation-engine/scripts/check-skill-frontmatter.sh` への機能追加: あちらは設定欄の書式を検査する。状態を台帳へ書き足す本処理とは、処理の向きが異なる\n- git のタグで版を刻む: タグは週の区切りを持たず、スキル1本ごとの4項目を保持できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。記録する項目を増減する場合は、本スクリプトを更新する。`compare-skill-snapshots.sh` も同時に更新する。`build-deliverable-list.sh` も同時に更新する。`docs/tasks/週次の成果を見える化する指示書.md` も同時に更新する。\n\n**廃棄条件**: 週ごとの成果報告を廃止した時、またはスキルの状態の記録を配布基盤が標準で提供するようになった時。\n\n### compare-skill-snapshots.sh\n\n**必要性**: 台帳に週ごとの状態が積み上がっても、最新2件を人が読み比べて何が増え何が書き直されたかを出すのは現実的でない。52本の4項目を毎週目視で突き合わせると見落としが生じる。リリースと数える3条件（新しく増えた・選び方が変わった・できることが変わった）を機械的に判定し、候補として挙げる必要がある。採否は人が決めるが、候補を挙げるところまでを毎週同じ基準で繰り返す。\n\n**代替案を採用しなかった理由**:\n- `snapshot-skills.sh` への機能追加: あちらは台帳への書き込みが関心であり、本スクリプトは台帳の読み取りと突き合わせが関心で、処理の向きが逆である。同じ判断で `record-verification-result.sh` と `compare-with-previous.sh` が分かれている先例がある\n- Bash ツール直叩き: 3条件の判定を毎週手で組み立てると、条件の適用がぶれる\n- `git diff` の行数で測る: 行数は成果の大きさと一致しない。誤字の修正で10行動くこともあれば、できることが変わる修正が1行で済むこともある\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。3条件を増減する場合は本スクリプトと `docs/tasks/週次の成果を見える化する指示書.md` の3.2節を同時に更新する。\n\n**廃棄条件**: 週ごとの成果報告を廃止した時。\n\n### build-deliverable-list.sh\n\n**必要性**: `docs/guides/成果物一覧.html` は生成器を持たない手書きのページだった。52行の表を人が並べており、スキルの中身が変わっても表示が追従しない。週ごとに更新する運用へ移すと、毎週52行を手で直すことになり、必ずずれる。表の中身をスキルの設定欄から毎回作り直し、あわせて台帳の最新2件から今週の変化の節を組み立てる必要がある。SKILL.md の `description` は内部向けの設定値であり変更禁止対象でもあるため、社外向けの記述制限に当たる言い回しは生成時に利用者向けの表現へ置き換える。配色は保ったまま、変更依頼番号と誤認される数字だけの16進色を同値の `rgb()` 表記で出力する。\n\n**代替案を採用しなかった理由**:\n- 手書きのまま今週の変化の節だけを足す: 表の52行が手書きのまま残り、スキルの中身とのずれが解消しない\n- 週ごとの報告を別ファイルとして新設する: 一覧と報告でスキル本数が二重に載り、数値が食い違う危険が残る\n- Bash ツール直叩き: 52本の設定欄を毎週手で読むと、内容と体裁がぶれる。HTMLの組み立ても手作業では同様である\n- `generation-engine/scripts/` へ置く: あちらは納品先で動く納品物を作る道具の置き場であり、このリポジトリ自身の説明資料を作る道具とは対象が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。表の列・統計欄・今週の変化に書く内容を変える場合は本スクリプトと `docs/tasks/週次の成果を見える化する指示書.md` の3.3節を同時に更新する。社外向けの記述制限（`.claude/rules/always/docs/audience-split/rule.md`）の禁止語が増えた場合も本スクリプトの出力を追従させる。\n\n**廃棄条件**: `docs/guides/成果物一覧.html` を廃止した時、または一覧の生成を配布基盤が標準で提供するようになった時。\n\n### generation-engine/scripts/tests/ のスキル週次記録ラッパー3本\n\n**必要性**: 第1層の機械検証は、`generation-engine/scripts/` と `delivery-payload/templates/rules/checkers/` だけを走査する。週ごとの記録の道具3本は `docs/scripts/` に置く。このままでは集約に載らず、壊れたことを検知できない。\n\n本体の `--self-test` を呼び、終了コードを返すだけのラッパーを走査対象へ置く。これにより集約に載る。判定の中身は写さない。本体の `--self-test` を唯一の定義とするためである。両者がずれると、どちらが正しいか分からなくなる。同じ形の先例は `delivery-payload/templates/rules/checkers/` の回帰テスト群にある。\n\n**代替案を採用しなかった理由**:\n- 道具3本を `generation-engine/scripts/` へ置く: あちらは納品先で動く道具の置き場である。このリポジトリ自身の運用の道具は `docs/scripts/` に既存3本が揃っている\n- 集約の走査対象へ `docs/scripts/` を足す: `docs/scripts/` の既存3本は `--self-test` を持たず、走査対象へ足すと集約の収集条件と実態がずれる\n- 本体の `--self-test` を廃してラッパー側へ判定を移す: 本体を単独で確かめる手段が失われる\n- Bash ツール直叩き: 繰り返し実行する検査であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本テスト専用の依存を増やすだけになる\n- package.json scripts 追加: このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。本体の `--self-test` の呼び出し方を変える場合は対応するラッパーも同時に更新する。\n\n**廃棄条件**: 対応する道具が廃止された時、または `docs/scripts/` が第1層の走査対象に含まれるようになった時。\n\n### check-inventory-approval-step.sh\n\n**必要性**: `docs/tasks/納品物の一覧を調査の直後に提示する段を設ける指示書.md`（改善課題1-252）は、統括スキル（orchestrating-ai-development-setup）の第2段（アーキテクチャ調査）の直後に、対象範囲と納品物の件数を提示して承認を得る段（Step 2-7）を新設することを求める。この段が実際にPhase 3より前に置かれているか、Step 3-2・Step 7-1が承認結果を正しく参照しているか、範囲変更時に再承認が行われるか、準備の段（Phase 1）と判定と確定の段（Phase 7）に確認・承認の記述が残っていないかは、SKILL.mdの改訂のたびに崩れうる。10項目の完了の判定はいずれも文面の構造検査で機械的に確認できるため、往復検証やSKILL.md改訂のたびに繰り返し実行できる決定的なスクリプトが要る。\n\n判定の式を指示書の表へ直接書くことはできない。式に含まれる縦棒を判定器が列の区切りと読み違え、判定行そのものを壊すためである（`check-broken-verdict-rows.sh` の設計判断を参照）。式をスクリプトへ移し、表からはファイル名だけを呼ぶ形にする。\n\n`docs/scripts/` は第1層の機械検証（`generation-engine/scripts/` と `delivery-payload/templates/rules/checkers/` だけを走査する）の対象外である。このままでは壊れたことを検知できないため、`generation-engine/scripts/tests/check-inventory-approval-step.test.sh`（本体の `--self-test` を呼ぶだけのラッパー）を同時に新設し、集約に載せる（「`generation-engine/scripts/tests/` のスキル週次記録ラッパー3本」節と同じ形）。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: SKILL.mdの改訂のたびに10項目を手作業で読み比べると、実行のたびに判定基準がぶれる\n- 判定の式を指示書の表へ直接書く: 式に含まれる縦棒が判定器の切り出しを壊す\n- 既存 `check-phase-step-structure.mjs` への機能追加を検討した。あちらはPhase/Step構造の連番・global_step の1〜41の一意順序・Back-edge表の定義一致を検査する構造検証である。承認の段の有無・承認結果の参照・確認記述の残存という文面の意味検査とは判定式が異なる。本検査が追加する新Step（Step 2-7）は`global_step`行を持たない番号なしの段とする設計を採る。`check-phase-step-structure.mjs`の1〜41検査に影響を与えない。\n- 既存 `check-doc-heading-addendum.sh` 等の見出し検査への同居: あちらは見出し語の検出が関心であり、Step本文の意味的な整合（承認結果を読むか・突き合わせを行うか）とは判定式が異なる\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本検査専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。Step 2-7の本文（選択肢の文言・承認の記録先・再承認の条件）を変更する場合は、本スクリプトの各 `check_*` 関数が参照する固定文字列（`grep -qF` の対象）を同時に更新する。\n\n**廃棄条件**: 統括スキルのフロー自体が廃止された時、またはStep 2-7（納品物の一覧を提示し対象範囲の承認を得る段）を廃止した時。\n\n### check-source-ref-refresh-step.sh\n\n**必要性**: 配る開発フローのPhase5には、実装変更後に詳細設計書の`source_ref`を更新する段が無かった。`check-derived-values.sh`は表示コミットの不一致を検知できるが、検知後の是正手順を持たない。更新段の見出し、完了記録の設計書欄、`output-layout.json`の7種別の全詳細設計書列挙、各設計単位の対象実装パスの一意解決とコミット差分による対象の機械選択、および検知器から更新段へ戻る記述は、SKILL.mdの改訂で個別に欠落しうる。4つの実行モードでこれらの構造を決定的に検査し、`--self-test`では段または欄を欠いた入力が不合格になることを確かめる。\n\n**代替案を採用しなかった理由**:\n- Bashツール直叩き: SKILL.mdの改訂ごとに見出し、欄、機械選択、検知後の動線を手作業で読み比べると、判定基準が実行者ごとにずれる\n- `check-derived-values.sh`への統合: あちらは生成済みHTMLと設計書frontmatterの値を突合する動的検査であり、配布するSKILL.md本文の手順構造を検査する本スクリプトとは対象と判定方式が異なる\n- `check-inventory-approval-step.sh`への統合: あちらは統括スキルの納品物一覧承認を検査する。対象のSKILL.mdも、保証する工程も異なる\n- Makefileまたはpackage.json scriptsの追加: このリポジトリはどちらも持たず、本検査専用の実行基盤を増やす理由がない\n\n**保守責任者**: 人手（ユーザー）。Phase5の更新段、完了記録欄、機械選択に使う宣言またはコマンド、`check-derived-values.sh`の検知名を変える場合は、本スクリプトの固定文字列と自己テストを同時に更新する。\n\n**廃棄条件**: 配る開発フローを廃止した時、または実装変更から設計書の`source_ref`更新と表示値再生成までを別の決定的な仕組みが自動実行し、SKILL.mdに更新段を保持する必要が無くなった時。\n\n### check-detail-design-frontmatter-keys.sh\n\n**必要性**: 詳細設計書のテンプレートと生成物だけを比較すると、両方が同じ誤った鍵集合を持つ場合に検出できない。`delivery-payload/references/detail-design-frontmatter-keys.json` を独立した期待値にし、定義文書・全5種別のテンプレート・実生成物の欠落鍵と余剰鍵を共通の判定で検出する。\n\n**代替案を採用しなかった理由**:\n- `scaffold-design-unit.sh --verify` だけを使う: 生成物の検査はできるが、定義文書とテンプレート自身の食い違い、`source_ref` の文章契約、検査器の欠落・余剰検出能力を1コマンドで回帰確認できない\n- テンプレートを期待値にする: テンプレートと生成物が同じ誤りを持つ場合に合格してしまう\n- 種別ごとに検査を分ける: 鍵集合の比較処理が重複し、種別追加時に検査漏れが生じる\n\n**保守責任者**: 人手（ユーザー）。詳細設計書の種別・文書名・鍵集合・`source_ref` 契約を変更する場合は、JSON定義元、定義文書、生成スキル、テンプレートと本検査を同時に更新する。\n\n**廃棄条件**: 詳細設計書の前付けが別のスキーマ検証基盤へ統合され、定義文書・テンプレート・生成物・生成スキルの全4者と欠落・余剰の自己テストを同等以上に検査できるようになった時。\n\n### build-implementation-contract-section.sh\n\n**必要性**: 改善課題1-259は、接続窓口の詳細設計書が持つ「実装契約」の節（関数1本ごとの引数と戻り値の契約）を、原本コードから機械的に組み立てる経路が配布物に無い問題を扱う。実測では、様式のそろった1件でこの節が623行・小見出し19件を持ち、文書全体の53%を占める。人手で書き起こすと49件で約43500行になる。ところが原本コード配下776本の関数走査では、引数の取り方が読める関数が703本（90%）、戻り値が読める関数が760本（97%）あり、コード自身から9割以上を機械的に導ける。この抽出（モジュールごとのサブルーチン一覧・関数ごとの引数表・戻り値の集約）は、Perl の2大慣用句（`my (...) = @_` の分解代入・`my $x = shift` の逐次shift）ごとに異なる走査規則、開き/閉じ括弧の深さ追跡によるサブルーチン本体の境界検出、命名規約（接頭辞と型の対応表）による型導出という複数段の分岐を持ち、対話セッションのたびに手作業で再現するのは非現実的である。読めない関数を推測で埋めない・抽出できた割合を報告するという安全側の判断も、都度の手作業では再現性が保てない。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 関数1本ごとの引数取得パターン判定・戻り値集約・型導出を対話セッションのたびに手で組み立てると、判定基準がぶれ、実際に49件・約43500行相当の書き起こしを人手で繰り返すことになる\n- 既存 `extract-api-metadata.sh` への機能追加: あちらは method/authRequired/callers/targetTables/ioSummary という API エンドポイント単位のメタデータ抽出が関心であり、モジュール（ファイル）単位で全サブルーチンを走査し関数ごとの引数・戻り値の契約を組み立てる本スクリプトとは走査の単位（エンドポイント単位 vs モジュール単位）・出力構造（フラットなフィールド追加 vs ネストした関数一覧）が異なる。同居させると既存の関数ブロック検査（デコレータ境界）の前提と、本スクリプトのサブルーチン境界検出（開き/閉じ括弧の深さ）が混在し複雑度が増す\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本スクリプト専用の依存を増やすだけになる\n- package.json scripts 追加: 同様に、このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。対象言語を Perl 以外へ拡張する場合、または引数取得パターンを追加する場合は、本スクリプトの awk 本体（`extract_module_records`）と本節を同時に更新する。`delivery-payload/references/doc-extraction.json` の `sectionAutomation.kinds.api` を変更する場合も同時に更新する。\n\n**廃棄条件**: 接続窓口の詳細設計書から「実装契約」の節自体を廃止した時、または原本コードから設計書全体を生成する仕組みへ統合され、本抽出処理が個別に存在する必要がなくなった時。\n\n### generation-engine/scripts/tests/ の第1層未配線ラッパー6本\n\n**必要性**: 対象は次の7件である。\n\n- `check-phase-step-structure.mjs`\n- `check-improvement-ledger.mjs`\n- `check-skill-machine-inspection-consistency.mjs`\n- `check-confirmation-ledger.mjs`\n- `check-improvement-ledger.test.mjs`\n- `check-detailed-design-conventions.cjs`\n- `test-sequence-kind-policy.mjs`\n\n第1層の集約（`run-layer-machine-checks.sh`）の収集条件は2つある。`--self-test)` を含む `.sh` である。または `generation-engine/scripts/` 配下の `test-*.cjs`・`test-*.mjs` である。対象7件はどちらにも当てはまらない。一度も集約から実行されないまま残っていた（作業課題一覧「検査が7件、第1層の集約に載らないまま実行されない」）。\n\n対象を改名する案は採らない。改名すると部分文字列が消える。この部分文字列（例: `check-improvement-ledger`）に、作業課題一覧の検収コマンドが依存している。\n\n`check-phase-step-structure.mjs` の回帰テスト本体は `check-phase-step-structure.test.sh` である。この1件だけは既に対象の基底名を含む `.sh` として実在した。内容へ `--self-test)` の分岐を足す最小差分で済んだ。新規ファイルではない。\n\n残る6件は、対象を改名せずに集約から呼ぶための薄い `exec` ラッパーを新設した。新設先は次のとおりである。\n\n- `check-skill-machine-inspection-consistency.test.sh`\n- `check-improvement-ledger-cli.test.sh`\n- `check-improvement-ledger-unit.test.sh`\n- `check-detailed-design-conventions.test.sh`\n- `test-sequence-kind-policy.test.sh`\n- `check-confirmation-ledger.test.sh`\n\n形は「`generation-engine/scripts/tests/` のスキル週次記録ラッパー3本」節と同じである。\n\n`check-improvement-ledger.mjs` は引数なしで実行すると既定の台帳を読む本番経路である。既定の台帳は `docs/tasks/work-records/改善反映台帳.md` である。`check-improvement-ledger-cli.test.sh` はそれをそのまま呼ぶ。\n\n`check-confirmation-ledger.mjs` は `--ledger` が必須である。fixture なしに自己完結できない。ロジックの検証は既存の `test-confirmation-ledger.mjs` が既に子プロセスとして呼び出している。`check-confirmation-ledger.test.sh` はその既存テストへ委譲する。二重実行になるが、対象の所要時間が短いため許容範囲内と判断した。\n\n**代替案を採用しなかった理由**:\n- 対象7件を `test-*.mjs`・`test-*.cjs` 等の名前へ改名する: 部分文字列が失われる。既存の検収コマンドや設計判断の相互参照が壊れる\n- 集約（`list_targets`）の収集条件そのものを広げる: 既存の収集ロジックに影響する変更である。既に集約へ載っている200件近い検査の収集結果を変える危険を伴う。対象個別のラッパーで橋渡しする方が影響範囲は小さい\n- `check-confirmation-ledger.mjs` 用に新たな fixture を書き起こす: 既存の `test-confirmation-ledger.mjs` が同じ検証を既に持つ。二重に持つと片方だけが更新され食い違う\n- Bash ツール直叩き: 繰り返し実行する検査であり、対話セッションのツール呼び出しでは代替できない\n- 既存 Makefile ターゲット拡張: このリポジトリに Makefile は存在せず、新規導入は本ラッパー専用の依存を増やすだけになる\n- package.json scripts 追加: このリポジトリはビルド設定を持たない\n\n**保守責任者**: 人手（ユーザー）。対象本体の呼び出し方を変える場合は対応するラッパーも同時に更新する。引数・既定の入力ファイルを変える場合も同様である。\n\n**廃棄条件**: 対応する対象が廃止された時。または集約の収集条件が拡張子・置き場を問わず自己テストを検出できるようになった時。\n\n### check-verdict-hash-ancestry.sh\n\n**必要性**: 判定表のコミット欄が指す先を失う事象が5回起きた（`docs/tasks/作業課題一覧.md`「判定表のコミット欄が枝の取り込みで参照先を失う」）。原因は取り込みの方式にある。作業枝を `git cherry-pick` で main へ取り込むと、コミットが作り直されてハッシュが変わる。担当が判定表へ書いたハッシュは、取り込み後には存在しない。`git merge --no-ff` で取り込めばハッシュは保たれる（2026-08-26実測: 9件すべてが祖先と判定された）。この確認を毎回手動で行う運用は続かないため、判定表・記録のコミット欄からハッシュを抽出し、mainのコミットとして存在し祖先であることを繰り返し機械で確かめる検査が要る。実際に `docs/tasks/` 全体へ当てたところ、183件が「コミットとして存在しない」（2026-08-21のコミット履歴再作成が原因）、1件が「存在するがmainの祖先でない」だった。手動での全件確認は非現実的であり、繰り返し実行できる検査として固定する必要がある。\n\n判定の式を指示書の表へ直接書くことはできない。式に含まれる縦棒を判定器が列の区切りと読み違え、判定行そのものを壊すためである（`check-broken-verdict-rows.sh` の設計判断を参照）。式をこのファイルへ移し、表からはファイル名だけを呼ぶ形にする。\n\n**2026-08-26の追加判断（判定不能との区別）**: 2026-08-21のコミット `2ee874944bdfc0ac9e6c354f4e9ceac5f5464f27`（履歴を単一の初回コミットへ作り直した）より前に書かれたハッシュ182件（重複除去後83件）は、確かめる手段そのものが失われており「実行できなかった」でも「不合格」でもない判定不能である（`.claude/rules/always/verification/indeterminate-result/rule.md` の考え方をハッシュ検証へ適用したもの）。この182件を毎回不合格として報告し続けると、新しく生じた本物の切れが埋もれる。実測した182件（重複除去後83件）を `docs/references/pre-rewrite-hashes.json` へ固定の一覧として記録し、本スクリプトはこの一覧に載るハッシュだけを判定不能として除外する。一覧は実測時点で固定し、以後は手で追記しない。自動でこの一覧へ加わる仕組みは意図的に持たせていない。持たせると、新しく切れたハッシュまで判定不能として見逃してしまう。\n\n**代替案を採用しなかった理由**:\n- Bash ツール直叩き: 取り込みのたびに判定表・記録のハッシュを手作業で `git merge-base --is-ancestor` へ通すと、実行のたびに確認の省略・見落としを繰り返す。実際にこの確認が無かったために同種の事故が5回起きた\n- 既存 `check-broken-verdict-rows.sh` への機能追加: あちらは判定表のセルが逆引用符とパイプで壊れていないかを見る。本検査はセルの中身（ハッシュ）がmainの祖先かを見るもので、判定対象・判定式が異なる
