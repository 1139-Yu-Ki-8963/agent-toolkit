<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計単位文書の製造 機能設計書</title>
<style>
/* 設計ポータルのデザイントークン。
   本ファイルの全文が、ビルド時に各テンプレートのトークン注入マーカーへ差し込まれる。
   既定はダークテーマ。ライトは OS 設定または data-theme="light" で切り替える。
   色は 26 種の基本トークンだけをテーマ別に定義し、
   既存の別名トークンは var() 参照でテーマへ自動追従させる。 */

:root {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-synthesis: none;

  /* 基本色（ダーク） */
  --bg: #0F1217;
  --panel: #161C23;
  --panel2: #1C232E;
  --panel3: #141A23;
  --line: #2B3443;
  --line2: #3A4658;
  --text: #E7ECF4;
  --sub: #A8B3C3;
  --muted: #8A96A7;
  --faint: #798496;
  --accent: #4CC2FE;
  --accent-hi: #9ADCFF;
  --accent-soft: rgba(76,194,255,0.17);
  /* 濃色ヘッダのハイライト。背景色を差し替えず元の背景へ重ねるため、明暗どちらの配色でも文字との明度差を保つ */
  --head-hl: rgba(255,255,255,0.16);
  --stamp: #FF6E4F;
  --stamp-soft: rgba(255,110,78,0.16);
  --green: #4ADE81;
  --green-soft: rgba(74,222,129,0.16);
  --grid: rgba(255,255,255,0.036);
  --head: #202B3B;
  --headtext: #E7ECF4;
  --code: #0B0E13;
  --codetext: #C9E8FF;
  --navon: #EAF6FF;
  --chipontext: #0F1217;
  --rowopen: #1A212B;
  --neutral-soft: rgba(255,255,255,0.06);

  /* 別名。既存テンプレートの参照を壊さないために残す。値は基本色を参照するのでテーマに自動追従する */
  --panel-2: var(--panel2);
  --border: var(--line);
  --border-strong: var(--line2);
  --text-sub: var(--sub);
  --text-muted: var(--muted);
  --accent-2: var(--accent-hi);
  --accent-border: var(--accent);
  --gold: var(--stamp);
  --gold-soft: var(--stamp-soft);
  --gold-border: var(--stamp);
  --warn: var(--stamp);
  --danger: var(--stamp);
  --danger-soft: var(--stamp-soft);
  --success: var(--green);
  --success-soft: var(--green-soft);
  --highlight: var(--accent);
  --highlight-soft: var(--accent-soft);
  --highlight-border: var(--accent);
  --nav-tag: var(--faint);
  --nav-tag-soft: var(--neutral-soft);
  --self-tag: var(--green);
  --self-tag-soft: var(--green-soft);
  --code-bg: var(--code);
  --code-fg: var(--codetext);
  --cat-list: var(--accent);
  --cat-standards: var(--accent);
  --cat-design: var(--accent);
  --cat-project: var(--accent);

  /* 非色トークン。テーマで変えない */
  --font-body: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  --mono: "SFMono-Regular","Menlo","Cascadia Code","Consolas",monospace;
  --radius: 0;
  --radius-sm: 0;
  --shadow-sm: 3px 3px 0 var(--accent-soft);
  --shadow-md: 4px 4px 0 var(--accent-soft);
  --sidebar-w: 248px;
  --page-gutter: 40px;
  --grid-size: 24px;
}

/* OS がライト設定で、かつダークを明示指定していない場合 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F4F8;
    --panel: #FFFFFF;
    --panel2: #E9EEF4;
    --panel3: #F7F9FC;
    --line: #D8DFE8;
    --line2: #243040;
    --text: #1A222E;
    --sub: #4B5A70;
    --muted: #58657A;
    --faint: #627387;
    --accent: #0272AC;
    --accent-hi: #075985;
    --accent-soft: rgba(2,132,199,0.10);
    --stamp: #BF3C22;
    --stamp-soft: rgba(217,72,43,0.12);
    --green: #137538;
    --green-soft: rgba(21,128,61,0.16);
    --grid: rgba(16,34,64,0.05);
    --head: #243040;
    --headtext: #F1F4F8;
    --code: #101722;
    --codetext: #C9E8FF;
    --navon: #102A43;
    --chipontext: #FFFFFF;
    --rowopen: #F0F4F9;
    --neutral-soft: rgba(16,34,64,0.06);
  }
}

/* ユーザーがライトを明示指定した場合 */
[data-theme="light"] {
  --bg: #F1F4F8;
  --panel: #FFFFFF;
  --panel2: #E9EEF4;
  --panel3: #F7F9FC;
  --line: #D8DFE8;
  --line2: #243040;
  --text: #1A222E;
  --sub: #4B5A70;
  --muted: #58657A;
  --faint: #627387;
  --accent: #0272AC;
  --accent-hi: #075985;
  --accent-soft: rgba(2,132,199,0.10);
  --stamp: #BF3C22;
  --stamp-soft: rgba(217,72,43,0.12);
  --green: #137538;
  --green-soft: rgba(21,128,61,0.16);
  --grid: rgba(16,34,64,0.05);
  --head: #243040;
  --headtext: #F1F4F8;
  --code: #101722;
  --codetext: #C9E8FF;
  --navon: #102A43;
  --chipontext: #FFFFFF;
  --rowopen: #F0F4F9;
  --neutral-soft: rgba(16,34,64,0.06);
}

/* ユーザーがダークを明示指定した場合。OS がライトでも :root の既定値へ戻す */
[data-theme="dark"] {
  --bg: #0F1217;
  --panel: #161C23;
  --panel2: #1C232E;
  --panel3: #141A23;
  --line: #2B3443;
  --line2: #3A4658;
  --text: #E7ECF4;
  --sub: #A8B3C3;
  --muted: #8A96A7;
  --faint: #798496;
  --accent: #4CC2FE;
  --accent-hi: #9ADCFF;
  --accent-soft: rgba(76,194,255,0.17);
  --stamp: #FF6E4F;
  --stamp-soft: rgba(255,110,78,0.16);
  --green: #4ADE81;
  --green-soft: rgba(74,222,129,0.16);
  --grid: rgba(255,255,255,0.036);
  --head: #202B3B;
  --headtext: #E7ECF4;
  --code: #0B0E13;
  --codetext: #C9E8FF;
  --navon: #EAF6FF;
  --chipontext: #0F1217;
  --rowopen: #1A212B;
  --neutral-soft: rgba(255,255,255,0.06);
}
/* 設計ポータルの共通シェル。サイドバー・メインペイン・フッター・方眼紙背景・ページヘッダの
   共通クラスを定義する。色と寸法は tokens.css のトークンだけを参照し、実値を直書きしない。
   本ファイルの全文は、ビルド時に各テンプレートのシェル注入マーカーへ差し込まれる。 */

.pt {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.7;
}
.pt *, .pt *::before, .pt *::after { box-sizing: border-box; }
.pt a { color: var(--accent); text-decoration: none; }
.pt a:hover { color: var(--accent-hi); text-decoration: underline; }
.pt ::selection { background: var(--accent-soft); }
.pt :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.pt-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
}

.pt-row {
  position: relative;
  z-index: 1;
  display: flex;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

/* サイドバー */
.pt-sidebar {
  width: var(--sidebar-w);
  flex: none;
  border-right: 1.5px solid var(--line2);
  background: var(--panel3);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.pt-brand { padding: 20px 20px 16px; border-bottom: 1.5px solid var(--line2); }
.pt-brand-stamp { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--stamp); font-weight: 600; }
.pt-brand-name { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px; line-height: 1.35; }
.pt-brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 5px; }

/* サイト切替（モノレポ複数サイト時のみ JS が pt-brand-name を差し替える） */
.pt-brand-switch { position: relative; }
.pt-brand-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 4px;
  border: 0;
  background: transparent;
  padding: 0;
  appearance: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1.35;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.pt-brand-toggle:hover { color: var(--accent); }
.pt-brand-caret {
  flex: none;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--text-muted);
  transition: transform 0.12s;
}
.pt-brand-toggle[aria-expanded="true"] .pt-brand-caret { transform: rotate(180deg); }
.pt-brand-list {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin-top: 8px;
  border: 1.5px solid var(--border);
  background: var(--panel-2);
  z-index: 2;
}
.pt-brand-list-item {
  display: block;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-sub);
}
a.pt-brand-list-item:hover { background: var(--panel3); color: var(--text); text-decoration: none; }
.pt-brand-list-item.is-current { color: var(--text-muted); font-weight: 600; cursor: default; }

.pt-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.pt-nav-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-nav-item:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-nav-item.is-active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-nav-num { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.pt-nav-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* 現在地のナビ項目に限り、番号と件数の文字色をコントラスト基準（4.5:1）を満たす値へ個別に上げる（改善課題1-49）。
   --muted/--faint 本体は変更しない（他の使用箇所へ影響するため）。tokens.css と同じ4ブロック切り替えに揃える。 */
:root {
  --nav-current-num: #919DAE;
  --nav-current-count: #929DAF;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --nav-current-num: #5E6B7E;
    --nav-current-count: #5B6C80;
  }
}
[data-theme="light"] {
  --nav-current-num: #5E6B7E;
  --nav-current-count: #5B6C80;
}
[data-theme="dark"] {
  --nav-current-num: #919DAE;
  --nav-current-count: #929DAF;
}
.pt-nav-item.is-active .pt-nav-num { color: var(--nav-current-num); }
.pt-nav-item.is-active .pt-nav-count { color: var(--nav-current-count); }

/* 文書ビューア型ページの章目次ブロック（旧 .dp-toc を共通サイドバーへ統合） */
.pt-doc-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; border-top: 1.5px solid var(--line2); }
.pt-doc-nav__group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-doc-nav .nav-item,
.pt-doc-nav .back-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-doc-nav .nav-item:hover,
.pt-doc-nav .back-link:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-doc-nav .nav-item.active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-doc-nav__toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.pt-doc-nav__toc a {
  display: block;
  padding: 6px 10px 6px 20px;
  font-size: 11px;
  color: var(--sub);
  border-left: 3px solid transparent;
  transition: all 0.12s;
}
.pt-doc-nav__toc a:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-doc-nav__toc a.active { color: var(--navon); border-left-color: var(--accent); font-weight: 600; }

.pt-theme {
  margin: auto 12px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: calc(100% - 24px);
  border: 1px solid var(--line2);
  background: transparent;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-theme:hover { border-color: var(--accent); color: var(--accent); }
.pt-theme-next { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.pt-sidebar-meta { padding: 14px 20px; font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.9; }

/* サイドバー開閉ボタン（狭幅時のみ表示。広幅では常に非表示） */
.pt-sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 30;
  width: 40px;
  height: 40px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1.5px solid var(--line2);
  background: var(--panel3);
  padding: 0;
  cursor: pointer;
}
.pt-sidebar-toggle span { display: block; width: 20px; height: 2px; background: var(--text); }

/* サイドバー開放中に背後を覆うオーバーレイ */
.pt-sidebar-scrim {
  position: fixed;
  inset: 0;
  z-index: 15;
  background: rgba(0, 0, 0, 0.5);
}
.pt-sidebar-scrim[hidden] { display: none; }

@media (max-width: 900px) {
  :root { --page-gutter: 16px; }
  .pt-sidebar-toggle { display: flex; }
  .pt-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 20;
    width: var(--sidebar-w);
    max-width: 82vw;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }
  .pt-sidebar.is-open { transform: translateX(0); }
  .pt-main { padding-top: 64px; }
}

/* メインペイン */
.pt-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 0 var(--page-gutter) 72px;
}
.pt-main.is-fixed { overflow-y: hidden; display: flex; flex-direction: column; padding-bottom: 24px; }

/* ページヘッダ */
.pt-head { flex: none; padding: 32px 0 16px; border-bottom: 2px solid var(--line2); }
.pt-crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pt-crumb-current { color: var(--text); }
.pt-title-row { display: flex; align-items: baseline; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.pt-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
.pt-title-sub { font-size: 12px; color: var(--muted); }

/* 汎用パーツ */
.pt-panel { background: var(--panel); border: 1.5px solid var(--line2); }
.pt-input {
  border: 1.5px solid var(--line2);
  background: var(--panel);
  padding: 8px 13px;
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: all 0.12s;
}
.pt-input:focus { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent-soft); }
.pt-seg { display: flex; border: 1px solid var(--line2); }
.pt-seg button {
  border: 0;
  border-right: 1px solid var(--line);
  padding: 7px 16px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  background: var(--panel);
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-seg button:last-child { border-right: 0; }
.pt-seg button.is-active { background: var(--accent); color: var(--chipontext); }
.pt-chip { font-size: 11px; border: 1px solid var(--line); background: var(--panel3); padding: 2px 8px; font-family: var(--mono); }
.pt-badge { font-size: 10.5px; font-weight: 600; padding: 2px 9px; }
.pt-badge.is-done { color: var(--accent); background: var(--accent-soft); }
.pt-badge.is-stale { color: var(--stamp); background: var(--stamp-soft); }
.pt-badge.is-todo { color: var(--muted); background: var(--neutral-soft); }
.pt-count { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Google Fonts障害時も3段階アイコンを保つ、公式サブセットのローカルフォールバック */
@font-face {
  font-family: "Material Symbols Outlined Local";
  font-style: normal;
  font-weight: 400;
  font-display: block;

/* 重要度コールアウト。見出しを先頭要素に置き、色帯とMaterial Symbolsを併用する */
.pt-callout {
  --callout-color: var(--accent);
  --callout-soft: var(--accent-soft);
  position: relative;
  background: var(--callout-soft);
  color: var(--text);
  box-shadow: inset 5px 0 0 var(--callout-color);
}
.pt-callout__icon {
  display: none;
  margin-right: 0.55em;
  color: var(--callout-color);
  font-family: "Material Symbols Outlined", "Material Symbols Outlined Local";
  font-size: 1.45em;
  font-style: normal;
  font-weight: 400;
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  line-height: 1;
  vertical-align: -0.12em;
}
.pt-callout > :first-child > .pt-callout__icon { display: inline-block; }
.pt-callout--caution {
  --callout-color: var(--accent);
  --callout-soft: var(--accent-soft);
}
.pt-callout--warning {
  --callout-color: var(--stamp);
  --callout-soft: var(--stamp-soft);
}
.pt-callout--important {
  --callout-color: var(--green);
  --callout-soft: var(--green-soft);
}

/* 表 */
/* 横スクロール可能な表であることを示す端フェード（JS不要のCSSのみの手掛かり）。
   background-attachment の local/scroll の組合せで、覆いレイヤー(local)はスクロール量に
   応じて中身と一緒に動き、影レイヤー(scroll)は要素の表示領域に固定されたまま覆いの下に隠れる。
   これにより端まで到達すると自動的に影が消え、途中では両端に影が現れる。 */
.pt-tablewrap {
  flex: 0 1 auto; min-height: 0; overflow: auto; border: 1.5px solid var(--line2);
  background-color: var(--panel);
  background-image:
    linear-gradient(to right, var(--panel) 40%, transparent),
    linear-gradient(to left, var(--panel) 40%, transparent),
    linear-gradient(to right, color-mix(in srgb, var(--text) 22%, transparent), transparent),
    linear-gradient(to left, color-mix(in srgb, var(--text) 22%, transparent), transparent);
  background-repeat: no-repeat;
  background-size: 30px 100%, 30px 100%, 14px 100%, 14px 100%;
  background-position: left, right, left, right;
  background-attachment: local, local, scroll, scroll;
}
/* 固定列を持つ表専用の横スクロール手掛かり。
   固定列（position:sticky）は不透明な背景を持つため、影を表そのものの background として
   置くと固定列の下に隠れてしまう（背景は常に子要素より奥の層に描画されるため、子要素の
   z-index をどれだけ上げても背景の上に出てくることはない）。
   代わりに表を包む専用のラッパーを置き、その ::before/::after を固定列より高い z-index で
   重ねることで、固定列の陰にならない位置に手掛かりを出す。表示のON/OFFはスクロール量に応じて
   共通ホスト（partials/shell-sidebar.html）の JS が can-scroll-left / can-scroll-right を切り替える。 */
.pt-scroll-shell { position: relative; min-width: 0; }
.pt-scroll-shell::before,
.pt-scroll-shell::after {
  content: ""; position: absolute; z-index: 20; top: 0; bottom: 0; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.pt-scroll-shell::before {
  left: 0; background: linear-gradient(to right, color-mix(in srgb, var(--text) 22%, transparent), transparent);
}
.pt-scroll-shell::after {
  right: 0; background: linear-gradient(to left, color-mix(in srgb, var(--text) 22%, transparent), transparent);
}
.pt-scroll-shell.can-scroll-left::before,
.pt-scroll-shell.can-scroll-right::after { opacity: 1; }

.pt-tablewrap table { width: 100%; border-collapse: separate; border-spacing: 0; }
.pt-tablewrap thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--head);
  color: var(--headtext);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-align: left;
  padding: 9px 14px;
}
.pt-tablewrap tbody td { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; }
.pt-tablewrap tbody tr:hover td { background: var(--panel3); }
.pt-tablewrap tbody tr.is-open td { background: var(--rowopen); }
.pt-mono { font-family: var(--mono); font-size: 11.5px; color: var(--sub); }

/* フッター */
.pt-footer {
  position: relative;
  z-index: 1;
  flex: none;
  border-top: 1.5px solid var(--line2);
  background: var(--panel3);
  padding: 12px var(--page-gutter);
  display: flex;
  gap: 20px;
  align-items: baseline;
  flex-wrap: wrap;
}
.pt-footer-stamp { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; color: var(--stamp); font-weight: 600; }
.pt-footer-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.pt-footer-gen { margin-left: auto; font-size: 10.5px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .pt *, .pt *::before, .pt *::after { transition: none !important; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

:root { --section-gap: clamp(28px, 4vw, 44px); }

/* 文書 2 カラム（目次 + 本文。目次は共通サイドバーへ統合済み） */
.dp-layout { display: block; margin-top: 28px; }

.toc-link {
  display: block; padding: 6px 10px; margin-left: -1.5px;
  border-left: 3px solid transparent;
  color: var(--sub); font-size: 12.5px; font-weight: 450; line-height: 1.4;
  transition: color .12s, border-color .12s;
}
.toc-link:hover { color: var(--text); border-left-color: var(--accent); text-decoration: none; }
.toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.dp-panel {
  width: 100%; min-width: 0; max-width: min(2200px, 96vw);
  border: 1.5px solid var(--line2); background: var(--panel);
  padding: 32px 40px; counter-reset: sec-num;
}

/* section */
.sec-block { margin-bottom: var(--section-gap); scroll-margin-top: 24px; }
.sec-label {
  counter-increment: sec-num;
  display: flex; align-items: baseline; gap: 10px;
  font-size: 16.5px; font-weight: 700; color: var(--text);
  margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.sec-label::before {
  content: counter(sec-num, decimal-leading-zero);
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--stamp);
}

/* 改善課題1-244: 階層目次・折りたたみ・絞り込み・表からのページ内リンク */
.toc-sub { list-style: none; margin: 0; padding: 0 0 0 12px; }
.toc-link.toc-l3 { font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
.toc-link.toc-l4 { font-size: 11.5px; padding-top: 3px; padding-bottom: 3px; padding-left: 20px; color: var(--sub); }
.toc-li.is-filtered { display: none; }
#doc-content h3, #doc-content h4 { scroll-margin-top: 4px; }
.doc-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; padding: 10px 12px; border: 1.5px solid var(--line2); background: var(--panel2); }
.doc-tools label { font-size: 12.5px; color: var(--sub); }
.doc-tools input[type="search"] { flex: 1 1 220px; min-width: 160px; padding: 6px 8px; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; }
.doc-tools button { padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; cursor: pointer; }
.doc-tools button:hover { border-color: var(--accent); }
.doc-tools .doc-filter-count { font-family: var(--mono); font-size: 12px; color: var(--stamp); }
.fold-details { margin: 10px 0; border: 1px solid var(--line2); background: var(--panel); }
.fold-details > summary { list-style: none; cursor: pointer; padding: 8px 10px 8px 26px; position: relative; }
.fold-details > summary::-webkit-details-marker { display: none; }
.fold-details > summary::before { content: "\25b8"; position: absolute; left: 10px; top: 9px; color: var(--accent); transition: transform .12s; }
.fold-details[open] > summary::before { transform: rotate(90deg); }
.fold-details > summary > h3, .fold-details > summary > h4 { display: inline; margin: 0; }
.fold-details > .fold-body { padding: 0 12px 10px; }
.fold-details.is-filtered { display: none; }
.fold-count { font-family: var(--mono); font-size: 11px; color: var(--stamp); margin-left: 8px; }
#doc-content a.ref-link { color: var(--accent); border-bottom: 1px dotted var(--accent); }
@media print { .doc-tools { display: none; } }

/* 改善課題1-273・1-295: 行数の多い表の並べ替え・絞り込み、テストケース一覧の CSV 書き出し */
.table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 12.5px; color: var(--sub); }
.table-tools input[type="search"] { flex: 1 1 200px; min-width: 140px; padding: 4px 8px; font-size: 12.5px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; }
.table-tools button { padding: 4px 10px; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; cursor: pointer; }
.table-tools button:hover { border-color: var(--accent); }
.table-tools .table-filter-count { font-family: var(--mono); font-size: 11.5px; color: var(--stamp); }
#doc-content table.sortable-table th { cursor: pointer; user-select: none; }
#doc-content table.sortable-table th[aria-sort="ascending"]::after { content: " \25b4"; color: var(--accent); }
#doc-content table.sortable-table th[aria-sort="descending"]::after { content: " \25be"; color: var(--accent); }
#doc-content tr.is-filtered { display: none; }
@media print { .table-tools { display: none; } }

/* baseline prose（セクション固有クラスの対象外になる見出し・段落・引用・区切り線） */
#doc-content h3 { font-size: 1.05rem; margin: 20px 0 8px; color: var(--text); }
#doc-content h4 { font-size: 0.95rem; margin: 16px 0 6px; color: var(--sub); }
#doc-content p { margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol { padding-left: 22px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol li { margin: 4px 0; }
#doc-content ul { list-style: none; padding-left: 20px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ul li { position: relative; margin: 4px 0; }
#doc-content ul li::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
#doc-content code {
  background: var(--panel3); color: var(--text); padding: 1px 6px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 0.85em;
}
#doc-content blockquote {
  border-left: 3px solid var(--accent); margin: 12px 0; padding: 8px 16px;
  background: var(--panel3); color: var(--sub); font-size: 0.95rem;
}
#doc-content hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

/* rule items（トップレベル ul のチェックリスト装飾。箇条書きと同じ体裁） */
.rule-list { list-style: none; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; }
.rule-item { position: relative; font-size: 13.5px; line-height: 1.75; color: var(--sub); }
.rule-item::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
.rule-item code {
  background: var(--panel); color: var(--text); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: .85em;
}

/* tables */
.table-scroll-shell { position: relative; min-width: 0; margin-bottom: 14px; }
.table-scroll-shell::before,
.table-scroll-shell::after {
  content: ""; position: absolute; z-index: 2; top: 1.5px; bottom: 1.5px; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.table-scroll-shell::before {
  left: 1.5px; background: linear-gradient(to right, var(--panel), transparent);
}
.table-scroll-shell::after {
  right: 1.5px; background: linear-gradient(to left, var(--panel), transparent);
}
.table-scroll-shell.can-scroll-left::before,
.table-scroll-shell.can-scroll-right::after { opacity: .94; }
.table-wrap {
  width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
  border: 1.5px solid var(--line2); scrollbar-gutter: stable;
}
table.data-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
table.data-table thead { position: sticky; top: 0; z-index: 1; }
table.data-table th {
  text-align: left; font-size: 11.5px; font-weight: 700; color: var(--headtext);
  background: var(--head); padding: 8px 12px; border-bottom: 1px solid var(--line2); white-space: nowrap;
}
table.data-table td {
  min-width: 11rem; max-width: 34rem; padding: 9px 12px;
  border-bottom: 1px solid var(--line); vertical-align: top;
  overflow-wrap: normal; word-break: normal; hyphens: none;
}
table.data-table td:first-child { min-width: 7rem; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table code {
  background: var(--panel3); color: var(--accent); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
}

/* code blocks（手動で span を書いた場合にのみ配色が効く。MD パーサーは自動適用しない） */
.code-block { width: 100%; border: 1px solid var(--line2); overflow: hidden; background: var(--code); margin-bottom: 14px; }
.diagram-block { margin: 12px 0; }
.diagram-block pre.mermaid-src { font-family: var(--mono); font-size: 12px; white-space: pre; overflow: auto; }
.diagram-block .diagram-rendered svg { max-width: 100%; height: auto; }
.code-block-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 11px; font-weight: 600;
  color: var(--muted); border-bottom: 1px solid var(--line2);
  letter-spacing: .03em;
}
.code-block pre {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--codetext);
}
#doc-content .code-block code {
  display: block; padding: 0; border: 0; background: transparent;
  color: inherit; font: inherit; white-space: pre;
}
.code-block .kw { color: #CBA6F7; }
.code-block .fn { color: #89B4FA; }
.code-block .str { color: #A6E3A1; }
.code-block .num { color: #FAB387; }
.code-block .cm { color: #6C7086; font-style: italic; }
.code-block .op { color: #89DCEB; }
.code-block .type { color: #F9E2AF; }

@media (max-width: 820px) {
  .dp-layout { margin-top: 20px; }
  .dp-panel { max-width: none; padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .toc-link, .table-scroll-shell::before, .table-scroll-shell::after, .fold-details > summary::before { transition: none; }
}

<div class="pt">

(function () {
  /* .pt-scroll-shell（固定列を持つ表の横スクロール手掛かり）のON/OFF切替。
     CSS の定義は partials/shell.css の .pt-scroll-shell を参照。
     固定列に隠れないよう表の外側に置いた ::before/::after の表示・非表示を、
     内側の実スクロール要素（.table-wrap または .pt-tablewrap）のスクロール量から判定する。

     data-scroll-cues="auto" を持つホスト配下の .table-wrap / .pt-tablewrap のうち、
     まだ .pt-scroll-shell に包まれていないものは、実行時に .pt-scroll-shell で動的に包む。
     生成スクリプトがテーブル本体を直接組み立てるページ（画面一覧の本体テーブル等）は
     テンプレート側で静的に .pt-scroll-shell を配置できないため、この受け口を使う。
     本処理は DOMContentLoaded 発火後に実行する（下の呼び出し部分を参照）。ページ本体側の
     同期スクリプト（ページャ組み立て・任意列追加）は DOMContentLoaded 発火前に完了して
     いるため、包む時点では最終的な DOM 構造になっている。 */
  function wrapAutoHosts() {
    var hosts = Array.prototype.slice.call(document.querySelectorAll('[data-scroll-cues="auto"]'));
    hosts.forEach(function (host) {
      var wraps = Array.prototype.slice.call(host.querySelectorAll('.table-wrap, .pt-tablewrap'));
      wraps.forEach(function (wrap) {
        if (wrap.closest('.pt-scroll-shell')) return;
        var shell = document.createElement('div');
        shell.className = 'pt-scroll-shell';
        wrap.parentNode.insertBefore(shell, wrap);
        shell.appendChild(wrap);
      });
    });
  }
  function initScrollCues() {
    wrapAutoHosts();
    var shells = Array.prototype.slice.call(document.querySelectorAll('.pt-scroll-shell'));
    if (!shells.length) return;
    var updaters = [];
    shells.forEach(function (shell) {
      var wrap = shell.querySelector(':scope > .table-wrap, :scope > .pt-tablewrap');
      if (!wrap) return;
      function update() {
        var overflowing = wrap.scrollWidth > wrap.clientWidth + 1;
        var atStart = wrap.scrollLeft <= 1;
        var atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1;
        shell.classList.toggle('can-scroll-left', overflowing && !atStart);
        shell.classList.toggle('can-scroll-right', overflowing && !atEnd);
      }
      wrap.addEventListener('scroll', update, {passive: true});
      /* 任意列の追加等でレイアウト後にscrollWidthが変わる場合の追従(画面一覧の

      if (window.ResizeObserver) {

      }
      updaters.push(update);
    });

    function updateAll() { updaters.forEach(function (fn) { fn(); }); }

    requestAnimationFrame(updateAll);
  }

  } else {
    initScrollCues();
  }
})();

<script type="application/json" id="doc-md">"\n# 設計単位文書の製造 機能設計書\n\n**この文書の位置づけ**（別の言語で作り直す場合は、まず「仕様」から読む）\n\n- 仕様:\n  - §1 機能概要\n  - §2 機能の範囲\n  - §3 業務フロー\n  - §4 業務ルール\n  - §5 データ\n  - §6 構成要素間の状態受け渡し\n  - §7 呼び出し仕様\n  - §8 エラーと業務メッセージ\n  - §9 非機能\n  - §10 共通仕様への準拠\n  - §11 関連資料\n- 現行実装: 該当なし\n- 仕様／現行実装（詳細は各節の太字1行を見る）: 該当なし\n\n| 節 | 内容 | 読み手へのお願い |\n|---|---|---|\n| §1 機能概要 | 本機能の位置づけと、構成要素13件をまとめた集約設計書としての基本情報 | 業務対象・確からしさの記載が実態と合っているかを確認してください。 |\n| §2 機能の範囲 | 構成要素13スキルの一覧と、本機能が扱わない範囲 | 一覧の識別子とパスが実在するかを確認してください。 |\n| §3 業務フロー | 設計単位ごとの著述の流れと、分岐・前後の機能との受け渡し | 実行順序の認識に相違が無いかを確認してください。 |\n| §4 業務ルール | 原本コードを読むか読まないかの判定、状態遷移、権限別の可否 | 各構成要素の判断ポイントに抜けが無いかを確認してください。 |\n| §5 データ | facts.yml・各種マニフェスト・出力文書の定義 | データの意味・型の記載に誤りが無いかを確認してください。 |\n| §6 構成要素間の状態受け渡し | 上流機能・構成要素間で受け渡すデータと共有領域 | 受け渡し経路に抜けが無いかを確認してください。 |\n| §7 呼び出し仕様 | 13スキルが共有する内部処理と、呼び出し元との対応 | 共通処理の記述が二重になっていないかを確認してください。 |\n| §8 エラーと業務メッセージ | 各スキルが返すエラー状態とヒント文言 | 利用者に見える結果の記載が実態と合っているかを確認してください。 |\n| §9 非機能 | 分割要否の上限値や差し戻し回数の上限 | 数値の出典が各スキルのSKILL.mdと一致するかを確認してください。 |\n| §10 共通仕様への準拠 | 13スキルが共有する部品・定義文書 | 準拠先のパスが実在するかを確認してください。 |\n| §11 関連資料 | 構成要素13件の個別設計書（スキル定義）と共通定義文書 | リンク切れが無いかを確認してください。 |\n\n本書は集約設計書です。構成要素（画面・API・実行ファイル等）の個別仕様は各構成要素の設計書を正とし、本書は値を再掲せずパスで参照します。本書が正を持つのは、構成要素をまたいで初めて意味を持つ事項（業務フロー・業務ルール・状態のライフサイクル）だけです。\n\nコードから確定できない事項は推測で埋めない。空欄のままとする。\n\n本機能は対象アプリケーションの業務機能ではありません。reverse-docs-skills自身が持つ「設計単位ごとの基本設計書・詳細設計書・テスト設計書を書き起こす」という能力を、集約設計書のテンプレート形式を借りて自己記述したものです。構成要素は画面・API・テーブルではなく、その執筆を担う13件のスキル定義（`.claude/skills/\u003cスキル名>/SKILL.md`）です。\n\n## §1 機能概要\n\n**この節の位置づけ: 仕様**\n\n### 1.1 基本情報\n\n| 項目 | 値 |\n|---|---|\n| 機能キー | unit-design-docs |\n| 機能ID | feat-unit-design-docs |\n| 大分類 | リバース |\n| 業務対象 | 対象リポジトリの各設計単位（画面・接続窓口・テーブル・バッチ・帳票・外部連携・機能）に対する基本設計書・詳細設計書・単体テスト設計書・結合テスト設計書の書き起こし |\n| 確からしさ | high |\n| 判定根拠 | 機能一覧マニフェスト（`docs/manifests/feature-manifest.json`）の`unitKey=unit-design-docs`行が持つ`unitNameGuess`（「設計単位文書の製造」）・`sourceFile`（`.claude/skills/generating-reverse-basic-design/SKILL.md`）・`category`（「リバース」）を出どころとし、構成要素13件のSKILL.mdを直接確認して整合を取った |\n| 境界の決定元 | build-target（配下13スキルの成果物出力先が、いずれも`output-layout.json`が定める`\u003ckind>UnitRoot`配下の`\u003cunitPhaseDirNames.basic\\|detail>`または`unitTestDesignDir`という共通の配置規約を持つことで束ねられている） |\n\n### 1.2 業務上の位置づけ\n\n主体はこのツール自身です。リバース設計フローの中で、事実抽出と確定（fact-extraction機能）が確定した事実の記録（facts.yml）を入力として受け取ります。加えて、一覧の製造（unit-lists機能）が生成した各設計単位のマニフェスト（`docs/manifests/`配下の各`\u003ckind>-manifest.json`）も入力として受け取ります。これらを入力に、各設計単位の基本設計書・詳細設計書・単体テスト設計書・結合テスト設計書を出力します。詳細設計相のうち接続窓口・バッチ・帳票・外部連携・テーブルの5スキルは、facts.ymlに加えて対象リポジトリの原本コードも情報源とします。\n\n入力→出力: 確定した事実の記録（facts.yml）・各設計単位のマニフェスト・プロジェクト共通文書 → 各設計単位の基本設計書・詳細設計書・単体テスト設計書・結合テスト設計書。\n\n本機能を構成する13スキルは、基本・詳細・テストの3相からなる生成スキル群です。6種別（画面・接続窓口・バッチ・帳票・外部連携・テーブル）は、基本設計相と詳細設計相の2つの執筆スキルを持ちます。機能（複数の構成要素を束ねる集約設計書）は、これらの出力を束ねる1つの執筆スキルが担います。ただし機能の集約設計書は詳細設計相を持たず、基本設計相とテスト設計相の2相だけを持ちます（§2.1参照）。テーブルは基本設計相の代わりに論理データモデル、詳細設計相の代わりにテーブル定義書という名前を使いますが、位置づけは基本・詳細と同じです。\n\n### 1.3 利用者と権限\n\n| 利用者区分 | この機能でできること | 参照先 |\n|---|---|---|\n| リバース設計フローの統括（orchestrating-ai-development-setup） | 対象の設計単位ごとに、種別に応じた本機能配下のスキルを起動し、基本設計書・詳細設計書・テスト設計書を生成させる | `.claude/skills/orchestrating-ai-development-setup/SKILL.md` |\n| 設計担当者（レビュー担当） | 生成された基本設計書・詳細設計書・単体/結合テスト設計書を読み、記載が実装と一致しているかを確認し、要確認事項一覧へ指摘を記録する | 各構成要素スキルが著述するテンプレート（`delivery-payload/templates/リバース検証/`配下） |\n| 下流の生成機能（common-docs・cross-views-and-design-assets・test-aggregation・portal・roundtrip-verification） | 本機能が出力した設計書のパス・章の内容を、自らの成果物（共通文書・横断ビュー・テスト集約・ポータル・往復検証）へ参照として取り込む | §3.3 前後の機能との関係 |\n\n## §2 機能の範囲\n\n**この節の位置づけ: 仕様**\n\n### 2.1 構成要素一覧\n\n| 構成要素キー | 種別 | 識別子 | 個別設計書 |\n|---|---|---|---|\n| generating-reverse-basic-design | スキル（画面・基本設計相） | generating-reverse-basic-design | `.claude/skills/generating-reverse-basic-design/SKILL.md` |\n| generating-reverse-detailed-design | スキル（画面・詳細設計相） | generating-reverse-detailed-design | `.claude/skills/generating-reverse-detailed-design/SKILL.md` |\n| generating-api-basic-design-for-reverse-docs | スキル（接続窓口・基本設計相） | generating-api-basic-design-for-reverse-docs | `.claude/skills/generating-api-basic-design-for-reverse-docs/SKILL.md` |\n| generating-api-detail-design-for-reverse-docs | スキル（接続窓口・詳細設計相） | generating-api-detail-design-for-reverse-docs | `.claude/skills/generating-api-detail-design-for-reverse-docs/SKILL.md` |\n| generating-batch-basic-design-for-reverse-docs | スキル（バッチ・基本設計相） | generating-batch-basic-design-for-reverse-docs | `.claude/skills/generating-batch-basic-design-for-reverse-docs/SKILL.md` |\n| generating-batch-detail-design-for-reverse-docs | スキル（バッチ・詳細設計相） | generating-batch-detail-design-for-reverse-docs | `.claude/skills/generating-batch-detail-design-for-reverse-docs/SKILL.md` |\n| generating-report-basic-design-for-reverse-docs | スキル（帳票・基本設計相） | generating-report-basic-design-for-reverse-docs | `.claude/skills/generating-report-basic-design-for-reverse-docs/SKILL.md` |\n| generating-report-detail-design-for-reverse-docs | スキル（帳票・詳細設計相） | generating-report-detail-design-for-reverse-docs | `.claude/skills/generating-report-detail-design-for-reverse-docs/SKILL.md` |\n| generating-external-basic-design-for-reverse-docs | スキル（外部連携・基本設計相） | generating-external-basic-design-for-reverse-docs | `.claude/skills/generating-external-basic-design-for-reverse-docs/SKILL.md` |\n| generating-external-detail-design-for-reverse-docs | スキル（外部連携・詳細設計相） | generating-external-detail-design-for-reverse-docs | `.claude/skills/generating-external-detail-design-for-reverse-docs/SKILL.md` |\n| generating-table-definition-for-reverse-docs | スキル（テーブル・詳細設計相相当） | generating-table-definition-for-reverse-docs | `.claude/skills/generating-table-definition-for-reverse-docs/SKILL.md` |\n| generating-table-logical-model-for-reverse-docs | スキル（テーブル・基本設計相相当） | generating-table-logical-model-for-reverse-docs | `.claude/skills/generating-table-logical-model-for-reverse-docs/SKILL.md` |\n| generating-feature-design-for-reverse-docs | スキル（機能・集約設計書。基本設計相とテスト設計相のみ） | generating-feature-design-for-reverse-docs | `.claude/skills/generating-feature-design-for-reverse-docs/SKILL.md` |\n\n種別欄は、当該スキルが対象とする設計単位種別（画面・接続窓口・バッチ・帳票・外部連携・テーブル・機能）と、担当する相（基本設計・詳細設計・集約）の組で表します。識別子は各スキルのfrontmatterが持つ`invocation`の値であり、スキル名と一致します。個別設計書は各スキルのSKILL.md自身であり、対象アプリケーションの個別仕様を持つ設計書ではありません（本機能はこのツール自身の能力を自己記述する集約設計書であるため）。\n\n### 2.2 参照テーブル一覧\n\n| テーブル | 作成 | 参照 | 更新 | 削除 | 参照先 |\n|---|---|---|---|---|---|\n\n該当なし。本機能はデータベースのテーブルを直接作成・参照・更新・削除しません。テーブルに関する設計書（テーブル定義書・論理データモデル）を成果物として生成する機能であり、成果物の対象がテーブルであって、本機能自身がテーブルを使う構成要素を持つわけではありません。\n\n### 2.3 範囲外\n\n- 各設計単位の一覧（画面一覧・API一覧等）の生成は本機能の範囲外です（→ unit-lists機能が担当）。\n- 対象コードからの事実抽出そのものは本機能の範囲外です（→ fact-extraction機能が担当）。事実抽出は既に確定・封印済みである前提で、本機能はその結果（facts.yml）を読むだけです。\n- 共通設計書・要件定義書の生成は本機能の範囲外です（→ common-docs機能が担当）。\n- 状態遷移図・ER図・デザイン系ページの生成は本機能の範囲外です（→ cross-views-and-design-assets機能が担当）。\n- プロジェクト全体のテスト仕様書への集約は本機能の範囲外です（→ test-aggregation機能が担当）。各構成要素スキルが著述するのは設計単位1件ごとの単体/結合テスト設計書までです。\n- 生成した設計書を一覧化するポータルHTMLの生成は本機能の範囲外です（→ portal機能が担当）。\n- 生成した設計書と原本コードの往復検証は本機能の範囲外です（→ roundtrip-verification機能が担当。機能の集約設計書自体は対応する原本ファイルを持たないため往復検証の対象外です）。\n\n## §3 業務フロー\n\n**この節の位置づけ: 仕様**\n\n### 3.1 正常系フロー\n\n| 順 | 実行主体 | 構成要素 | 処理 | 次の分岐条件 |\n|---|---|---|---|---|\n| 1 | リバース設計フロー統括 | （前提: unit-lists機能が生成した各種別マニフェストと、fact-extraction機能が封印したfacts.yml） | 対象の設計単位ごとに、種別に応じた基本設計著述スキルを起動する | 種別が画面ならgenerating-reverse-basic-design、接続窓口ならgenerating-api-basic-design-for-reverse-docs、バッチならgenerating-batch-basic-design-for-reverse-docs、帳票ならgenerating-report-basic-design-for-reverse-docs、外部連携ならgenerating-external-basic-design-for-reverse-docs、テーブルならgenerating-table-logical-model-for-reverse-docs、機能ならgenerating-feature-design-for-reverse-docsへ分岐する |\n| 2 | generating-reverse-basic-design | 画面の基本設計書 | facts.ymlとプロジェクト共通文書だけを情報源に、業務語彙のみで画面基本設計書.mdを著述する | 実装用語混入検査に不合格なら書き直し |\n| 3 | generating-reverse-detailed-design | 画面の詳細設計書・DESIGN.md・画面結合/単体テスト設計書・操作シナリオ仕様書 | facts.ymlから画面詳細設計書等4文書を著述する | 対象規模が1,500行超または4ファイル超、もしくは詳細設計書1,000行超の見込みならパス分割（detail-only/companion-docs）が必須 |\n| 4 | generating-api-basic-design-for-reverse-docs | 接続窓口の基本設計書・API結合テスト設計書 | 接続窓口を1本ごとに取り上げ、業務的な意味を抽出してから基本設計書と結合テスト設計書を執筆する | Phase5機械検査に不合格なら書き直し（上限3回） |\n| 5 | generating-api-detail-design-for-reverse-docs | 接続窓口の詳細設計書・API実装記録・API単体テスト設計書 | 原本コードを読解し、詳細設計書と実装記録と単体テスト設計書を執筆する | Phase5機械検査に不合格なら書き直し（上限3回） |\n| 6 | generating-batch-basic-design-for-reverse-docs | バッチの基本設計書・バッチ結合/単体テスト設計書 | バッチを1本ごとに取り上げ、業務的な意味を抽出してから基本設計書とテスト設計書を執筆する | Phase5機械検査に不合格なら書き直し（上限3回） |\n| 7 | generating-batch-detail-design-for-reverse-docs | バッチの詳細設計書・バッチ実装記録 | 元の処理の定義を読み解き、処理の手順・コミットの単位・排他制御を書き起こす | Phase4機械検査に不合格なら書き直し |\n| 8 | generating-report-basic-design-for-reverse-docs | 帳票の基本設計書・帳票結合/単体テスト設計書 | 出力物単位で業務的な意味を抽出し、基本設計書とテスト設計書を執筆する | Phase5機械検査に不合格なら書き直し（上限3回） |\n| 9 | generating-report-detail-design-for-reverse-docs | 帳票の詳細設計書・帳票実装記録 | 元のコードの編集処理から、項目編集・改ページ・集計処理を書き起こす | Phase4機械検査に不合格なら書き直し |\n| 10 | generating-external-basic-design-for-reverse-docs | 外部連携の基本設計書・外部連携結合/単体テスト設計書 | 連携単位で業務的な意味を抽出し、基本設計書とテスト設計書を執筆する | Phase5機械検査に不合格なら書き直し（上限3回） |\n| 11 | generating-external-detail-design-for-reverse-docs | 外部連携の詳細設計書・外部連携実装記録 | 元のコードの電文定義から、電文の項目・変換処理・待ち時間の上限を書き起こす | Phase4機械検査に不合格なら書き直し |\n| 12 | generating-table-logical-model-for-reverse-docs | 論理データモデル・テーブル結合/単体テスト設計書 | テーブル一覧と実装コードから、テーブルが持つ業務上の意味を業務の言葉だけで書く | Phase5機械検査に不合格なら書き直し（上限3回） |\n| 13 | generating-table-definition-for-reverse-docs | テーブル定義書・テーブル実装記録 | テーブル一覧の元データと実装のコードから、列・制約を書き起こす | Phase4機械検査に不合格なら書き直し |\n| 14 | generating-feature-design-for-reverse-docs | 機能設計書・機能結合テスト設計書・機能単体テスト設計書 | 機能一覧の元データと配下の構成要素（1〜13で生成済みの個別設計書）をもとに、複数の構成要素を束ねる集約設計書を書く | 構成要素の個別設計書が1枚も無くても`status=ERROR`にせず、要確認事項一覧を伴って`unresolved_count`を大きくして生成を続ける |\n\n### 3.2 分岐と例外フロー\n\n| キー | 分岐条件 | 到達先 | 参照先 |\n|---|---|---|---|\n| 画面種別限定 | `unit_kind=screen`以外を画面の基本/詳細設計著述スキルへ渡した | 著述せず`status=基本設計著述失敗`（基本設計相）を返す | generating-reverse-basic-design |\n| 大規模ユニット分割 | 対象コード合計1,500行超または4ファイル超、もしくは詳細設計書1,000行超の見込み | 画面詳細設計著述と周辺文書著述を別パス（別サブエージェント委任）へ分割する。`authoring_pass=detail-only`でPhase5まで通し`DETAIL_AUTHORED`を返す | generating-reverse-detailed-design |\n| 実装記録の分離 | 接続窓口・バッチ・帳票・外部連携・テーブルの詳細設計相で「今の作りの記録」（疑似コード・データ定義・実装契約）を書く必要がある | 詳細設計書とは別に`\u003c種別>実装記録.md`（改善課題1-288）を配置し、仕様と切り離して記入する | generating-api-detail-design-for-reverse-docs 他4スキル |\n| 構成要素欠落の許容 | 機能の集約設計書で、参照すべき構成要素の個別設計書が1枚も存在しない | `status=ERROR`にせず、構成要素一覧と要確認事項一覧だけを持つ設計書を生成し`unresolved_count`を大きくして返す | generating-feature-design-for-reverse-docs |\n| 出力先識別子の不確定 | 機能の`unitId`・`unitKey`の両方が空 | 当該機能を生成せず`status=ERROR`で中断する | generating-feature-design-for-reverse-docs Step3-1 |\n| 機械検査の差し戻し | Phase5（または該当スキルのPhase4）の機械検査が1件でも不合格 | 該当Phaseへ差し戻して書き直す。上限3回で収束しなければ`status=ERROR` | 各構成要素スキルのPhase5（機能は7検査、その他は4〜7検査） |\n\n### 3.3 前後の機能との関係\n\n| 関係 | 相手の機能キー | 受け渡す情報 | 参照先 |\n|---|---|---|---|\n| 上流（調査結果） | target-survey | 対象リポジトリの構造・実行環境・コード規模の調査結果（間接。fact-extractionの入力として使われる） | target-survey機能の個別設計書 |\n| 上流（事実の確定） | fact-extraction | 対象コードから抽出し封印した事実の記録（facts.yml、`facts_ref`配下） | fact-extraction機能の個別設計書 |\n| 上流（一覧の製造） | unit-lists | 各設計単位の一覧マニフェスト（`docs/manifests/`配下の`\u003ckind>-manifest.json`。識別子・sourceFile・確からしさ等を含む） | unit-lists機能の個別設計書 |\n| 下流（共通文書） | common-docs | 生成した個別設計書の存在とパス（プロジェクト共通の要確認事項の集約先として参照される） | common-docs機能の個別設計書 |\n| 下流（横断ビュー） | cross-views-and-design-assets | 詳細設計書に記載した状態遷移・テーブル参照・関数構成等の内容（ER図・状態遷移図・デザイン系ページの元データとして参照される） | cross-views-and-design-assets機能の個別設計書 |\n| 下流（テスト集約） | test-aggregation | 各構成要素の単体/結合テスト設計書が持つ観点・ケース（プロジェクト全体の結合テスト仕様書の元データとして集約される） | test-aggregation機能の個別設計書 |\n| 下流（ポータル） | portal | 生成した基本設計書・詳細設計書・テスト設計書一式のパスと配置（ポータルの一覧・カードとして表示される） | portal機能の個別設計書 |\n| 下流（往復検証） | roundtrip-verification | 生成した設計書（機能の集約設計書を除く）を、原本コードと突合する検証対象として提供する | roundtrip-verification機能の個別設計書 |\n\n## §4 業務ルール\n\n**この節の位置づけ: 仕様**\n\n### 4.1 業務判断ポイント\n\n| キー | 判断内容 | 判断材料 | 参照先 |\n|---|---|---|---|\n| 原本コード読解の可否 | 基本設計相の5スキル（画面・接続窓口・バッチ・帳票・外部連携）はfacts.ymlとプロジェクト共通文書だけを情報源とし、対象リポジトリの原本コードのReadを全面禁止する | 各SKILL.mdの「本スキル実行中に対象リポジトリの原本コードをReadすることは全面禁止」という明記 | generating-reverse-basic-design 他 |\n| 詳細設計相の情報源 | 詳細設計相の5スキル（画面・接続窓口・バッチ・帳票・外部連携）とテーブルの2スキルは、原本コードの読解を必須とする | 各SKILL.mdの原本読解フェーズという構成 | generating-reverse-detailed-design 他 |\n| 機能の集約設計書の情報源 | 機能の集約設計書は詳細設計相を持たず、原本コードを直接読まない。構成要素の個別設計書（1〜13で既に生成済みのもの）だけを情報源とする | generating-feature-design-for-reverse-docsの「実装契約の扱い（本スキルは書かない）」節 | generating-feature-design-for-reverse-docs |\n| 出力先識別子の確定方法 | `unitId`が空の場合は`unitKey`を出力先識別子として使う。両方が空の場合だけ当該対象を生成しない | 各SKILL.mdの「出力」節にある識別子の決め方の規約 | 各構成要素スキルの「出力」節 |\n| 大規模ユニットの分割要否 | 対象コード合計1,500行超または4ファイル超、もしくは詳細設計書1,000行超の見込みなら、詳細設計著述と周辺文書著述を別パス（別サブエージェント委任）に分割することを必須とする | generating-reverse-detailed-designの分割条件の明記 | generating-reverse-detailed-design |\n\n### 4.2 状態と遷移の制約\n\n| 状態 | 遷移先 | 遷移条件 | 参照先 |\n|---|---|---|---|\n| facts未封印 | facts封印済み | fact-extraction機能が封印済みを返し、facts_refが確定する | fact-extraction機能の個別設計書 |\n| 未著述 | 基本設計著述済み | 実装用語混入検査（画面）または機械検査（接続窓口・バッチ・帳票・外部連携・テーブル・機能）に合格する | generating-reverse-basic-design 他 |\n| 基本設計著述済み | 詳細設計著述済み（画面は詳細設計著述済み状態） | facts.ymlの全項目が設計書へ転記済みであることを機械突合し、未転記が0件になる（画面）。または当該フェーズの機械検査に合格する（接続窓口・バッチ・帳票・外部連携・テーブル） | generating-reverse-detailed-design 他 |\n| 著述途中（差し戻し） | 著述完了、または生成中断 | 該当フェーズの機械検査が上限3回未満で合格すれば著述完了、3回に達しても不合格なら生成を中断する | 各構成要素スキルの検査フェーズ |\n| 構成要素の個別設計書0枚 | 要確認事項付きの機能設計書生成済み | 機能の集約設計書著述時、参照すべき個別設計書が1枚も見つからない | generating-feature-design-for-reverse-docs |\n\n### 4.3 計算規則\n\n| キー | 算出対象 | 算式 | 参照先 |\n|---|---|---|---|\n| authored_count | 生成した設計書の枚数 | 基本設計書・詳細設計書・テスト設計書（単体・結合）等、当該スキルが実際に書き出したMarkdownファイルの総数を単純合計する | 各構成要素スキルの「返却」節 |\n| unresolved_count | 確定できなかった事項の件数 | 全対象単位の要確認事項一覧に記録された行数の合計 | 各構成要素スキルの「返却」節 |\n| テスト実行件数 | 単体/結合テスト設計書のテストケース数 | テストケース一覧のデータ行数だけで数える（テスト観点・異常系・境界値は観点の詳細であり、実行件数には数えない） | 各構成要素スキルのテスト設計書テンプレートの記述 |\n\n### 4.4 権限別の可否\n\n| 利用者区分 | 可能な操作 | 不可の操作 | 参照先 |\n|---|---|---|---|\n| 基本設計著述スキル（画面・接続窓口・バッチ・帳票・外部連携） | facts.yml・プロジェクト共通文書の読解、業務語彙のみでの執筆 | 対象リポジトリの原本コードのRead（原則禁止の契約違反） | generating-reverse-basic-design 他 |\n| 詳細設計著述スキル（画面・接続窓口・バッチ・帳票・外部連携・テーブル） | 原本コードの読解、実装記録     window.__docBuildCaseCsv = function (index) { var t = caseTables[index || 0]; return t ? buildCaseCsv(t) : null; };
    function csvFileName() {
      var title = (heroTitle.textContent || document.title || '文書').trim().replace(/[\\/:*?"<>|]/g, '_');
      return title + '_テストケース一覧.csv';
    }
    function downloadCsv(text) {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = csvFileName();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    var caseTableIndex = 0;
    Array.prototype.forEach.call(container.querySelectorAll('table'), function (table) {
      var tools = attachTableTools(table);
      var firstHead = table.querySelector('thead th');
      var sec = table.closest ? table.closest('.sec-block') : null;
      var secLabel = sec ? (sec.querySelector('.sec-label') || {}).textContent || '' : '';
      var isCaseTable = firstHead && (CSV_CASE_HEADS.indexOf(tableText(firstHead)) >= 0 || secLabel.indexOf(CSV_CASE_HEADING) >= 0);
      if (isCaseTable && caseTables.length > caseTableIndex) {
        var idx = caseTableIndex; caseTableIndex += 1;
        if (!tools) {
          tools = document.createElement('div'); tools.className = 'table-tools';
          var wrap = table.parentNode;
          var host = wrap.parentNode && wrap.parentNode.classList.contains('table-scroll-shell') ? wrap.parentNode : wrap;
          host.parentNode.insertBefore(tools, host);
        }
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'csv-export';
        btn.textContent = 'CSVを書き出す（記入欄つき）';
        btn.addEventListener('click', function () { downloadCsv(buildCaseCsv(caseTables[idx])); });
        tools.appendChild(btn);
      }
    });

    var firstLink = tocList.querySelector('.toc-link');
    if (firstLink) firstLink.classList.add('active');
  })();
})();
</script>

<script>
(function(){
  var links = document.querySelectorAll('.toc-link');
  var sections = document.querySelectorAll('.sec-block');
  var mainEl = document.getElementById('main-scroll');

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function fragmentToId(fragment) {
    var raw = fragment && fragment.charAt(0) === '#' ? fragment.substring(1) : (fragment || '');
    if (!raw) return '';
    try {
      return decodeURIComponent(raw);
    } catch (error) {
      return '';
    }
  }

  function scrollToFragment(fragment, behavior) {
    var targetId = fragmentToId(fragment);
    var target = targetId ? document.getElementById(targetId) : null;
    if (!target) return false;
    if (window.__docOpenFoldsFor) window.__docOpenFoldsFor(targetId);
    target.scrollIntoView({behavior: behavior, block:'start'});
    return true;
  }

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(l){l.classList.remove('active')});
        var a = Array.prototype.find.call(links, function (link) {
          return link.getAttribute('href') === '#' + e.target.id;
        });
        if(a) a.classList.add('active');
      }
    });
  },{root: mainEl, rootMargin:'-10% 0px -80% 0px'});
  sections.forEach(function(s){observer.observe(s)});

  links.forEach(function(l){
    l.addEventListener('click',function(e){
      e.preventDefault();
      var href = this.getAttribute('href');
      if(scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
        if (window.history && window.history.pushState) window.history.pushState(null, '', href);
        else window.location.hash = fragmentToId(href);
      }
    });
  });

  if (window.location.hash) {
    requestAnimationFrame(function(){
      scrollToFragment(window.location.hash, 'auto');
    });
  }

  if (typeof document.addEventListener === 'function') document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a.ref-link') : null;
    if (!a) return;
    e.preventDefault();
    var href = a.getAttribute('href');
    if (scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
      if (window.history && window.history.pushState) window.history.pushState(null, '', href);
      else window.location.hash = fragmentToId(href);
    }
  });

  window.addEventListener('popstate', function(){
    requestAnimationFrame(function(){
      if (!scrollToFragment(window.location.hash, 'auto') && mainEl) {
        mainEl.scrollTo({top: 0, behavior: 'auto'});
      }
    });
  });
})();
</script>
<script>
// 図の記法（mermaid）の囲みを図として描く（改善課題1-285）。描画の道具は外部から読み込み、
// 読み込めない・描けない場合は囲みの文字をそのまま表示して文書全体を壊さない。
(function () {
  function renderDiagrams() {
    var blocks = document.querySelectorAll('div.diagram-block[data-diagram="mermaid"]');
    if (!blocks.length) return;
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    script.onload = function () {
      try {
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
        Array.prototype.forEach.call(blocks, function (block, index) {
          var src = block.querySelector('pre.mermaid-src');
          if (!src) return;
          var code = src.textContent || '';
          window.mermaid.render('diagram-' + (index + 1), code).then(function (result) {
            var holder = document.createElement('div');
            holder.className = 'diagram-rendered';
            holder.innerHTML = result.svg;
            block.insertBefore(holder, src);
            src.setAttribute('hidden', 'hidden');
            block.setAttribute('data-diagram-state', 'rendered');
          }).catch(function () { block.setAttribute('data-diagram-state', 'text'); });
        });
      } catch (error) {
        Array.prototype.forEach.call(blocks, function (block) { block.setAttribute('data-diagram-state', 'text'); });
      }
    };
    script.onerror = function () {
      Array.prototype.forEach.call(blocks, function (block) { block.setAttribute('data-diagram-state', 'text'); });
    };
    document.head.appendChild(script);
  }
  if (typeof document.addEventListener === 'function') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderDiagrams);
    else renderDiagrams();
  }
})();
</script>
