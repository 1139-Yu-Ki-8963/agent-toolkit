<!--
  detail-pages T7 図解型テンプレート — 状態遷移図専用テンプレート
  生成: shared/scripts/detail-pages/build-detail-page.sh
  プレースホルダ置換は build-detail-page.sh の render_template() が行う。
  手作業によるプレースホルダ置換は禁止。生成は必ずスクリプト経由で行う。

  定義元はデータ設計.md の状態遷移表。埋め込みJSON(script#page-data)のnodes[](エンティティの状態)/
  edges[](状態遷移)から、ページ読込時にJavaScriptがDOMを構築する。図(表示)とJSONは常に単一情報源。
  nodes[].entity のユニーク値からエンティティ選択ドロップダウンを構築し、選択したエンティティに属する
  nodes/edgesだけを角丸矩形ノード+矢印線のSVGへ描画する(画面遷移図が分岐する前の共通SVG描画ロジックを
  流用。層状配置・矩形境界での接続点計算はshared/templates/detail-pages/detail-t4-diagram.htmlと同型)。
  初期表示は先頭エンティティ。エッジのsourceRefは図の下の補足表で参照する。

  保守注記: トークン・共通シェル(サイドバー・フッター・全画面レイアウトのCSS)は
  shared/templates/partials 配下の共通ファイルを注入マーカー経由で読み込む。
  テーマ切替はサイドバー側に一本化されており、本テンプレートに複製は無い。

  プレースホルダ(build-detail-page.shが注入。実際のマーカー記法は
  scripts/detail-pages/build-detail-page.sh 冒頭コメントを定義元とする。本コメントでは
  二重置換事故を避けるため意図的に波括弧・HTMLコメント記法を外して記載する):
    TITLE (ページ見出しマーカー)         : page-data.json の title
    DESCRIPTION (ページ概要マーカー)     : page-data.json の description
    GENERATED_AT (生成日時マーカー)      : page-data.json の generatedAt(共通フッターの更新日として使用)
    PAGE_DATA_JSON (page-data埋め込みマーカー) : page-data.json の内容全体(本ファイル物理末尾のscriptタグへ注入)
-->

/* 設計ポータルの共通シェル。サイドバー・メインペイン・フッター・方眼紙背景・ページヘッダの

.pt {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.7;
}
.pt *, .pt *::before, .pt *::after { box-sizing: border-box; }
.pt a { color: var(--accent); text-decoration: none; }
.pt a:hover { color: var(--accent-hi); text-decoration: underline; }
.pt ::selection { background: var(--accent-soft); }
.pt :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.pt-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
}

.pt-row {
  position: relative;
  z-index: 1;
  display: flex;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

/* サイドバー */
.pt-sidebar {
  width: var(--sidebar-w);
  flex: none;
  border-right: 1.5px solid var(--line2);
  background: var(--panel3);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.pt-brand { padding: 20px 20px 16px; border-bottom: 1.5px solid var(--line2); }
.pt-brand-stamp { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--stamp); font-weight: 600; }
.pt-brand-name { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px; line-height: 1.35; }
.pt-brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 5px; }

.pt-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.pt-nav-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-nav-item:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-nav-item.is-active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-nav-num { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.pt-nav-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }

.pt-theme {
  margin: auto 12px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: calc(100% - 24px);
  border: 1px solid var(--line2);
  background: transparent;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-theme:hover { border-color: var(--accent); color: var(--accent); }
.pt-theme-next { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.pt-sidebar-meta { padding: 14px 20px; font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.9; }

/* メインペイン */
.pt-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 0 var(--page-gutter) 72px;
}
.pt-main.is-fixed { overflow-y: hidden; display: flex; flex-direction: column; padding-bottom: 24px; }

/* ページヘッダ */
.pt-head { flex: none; padding: 32px 0 16px; border-bottom: 2px solid var(--line2); }
.pt-crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pt-crumb-current { color: var(--text); }
.pt-title-row { display: flex; align-items: baseline; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.pt-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
.pt-title-sub { font-size: 12px; color: var(--muted); }

.pt-panel { background: var(--panel); border: 1.5px solid var(--line2); }

  padding: 8px 13px;
  font-family: var(--font-body);
  font-size: 12.5px;

}

  border: 0;

  font-weight: 600;

      "trigger": "決済代行サービスからの Webhook 受信（拒否通知）",
      "sourceRef": "server/webhooks/paymentGateway.ts",
      "entity": "支払い"
    },
    {
      "from": "支払い.失敗",
      "to": "支払い.未処理",
      "trigger": "支払い再試行画面の再実行操作",
      "sourceRef": "src/pages/checkout/PaymentRetryPage.tsx",
      "entity": "支払い"
    },
    {
      "from": "商品公開.下書き",
      "to": "商品公開.公開",
      "trigger": "商品編集画面の公開操作",
      "sourceRef": "src/pages/admin/ProductEditPage.tsx",
      "entity": "商品公開"
    },
    {
      "from": "商品公開.公開",
      "to": "商品公開.公開停止",
      "trigger": "商品一覧画面の公開停止操作",
      "sourceRef": "src/pages/admin/ProductListPage.tsx",
      "entity": "商品公開"
    },
    {
      "from": "商品公開.公開停止",
      "to": "商品公開.公開",
      "trigger": "商品一覧画面の再公開操作",
      "sourceRef": "src/pages/admin/ProductListPage.tsx",
      "entity": "商品公開"
    }
  ],
  "projectName": "sample-project"
}
</script>

<script>
(function() {
  var data = JSON.parse(document.getElementById('page-data').textContent);

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k) {
      if (k === 'html') node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    if (children) {
      if (!Array.isArray(children)) children = [children];
      children.forEach(function(c) {
        if (typeof c === 'string') node.appendChild(document.createTextNode(c));
        else if (c) node.appendChild(c);
      });
    }
    return node;
  }

  var SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function(k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  // --- 凡例(legend[]) ---
  var legendMount = document.getElementById('legend-mount');
  var legend = data.legend || [];
  if (legend.length === 0) {
    legendMount.appendChild(el('div', { class: 'diagram-empty' }, '凡例なし'));
  } else {
    legend.forEach(function(l) {
      legendMount.appendChild(el('div', { class: 'legend-item' }, [
        el('span', { class: 'legend-symbol' }, l.symbol || ''),
        el('span', null, l.meaning || '')
      ]));
    });
  }

  // --- ノード/エッジの取り出し(nodes[].key / edges[].from,to。ERのkeyフィールドを踏襲) ---
  var allNodes = data.nodes || [];
  var allEdges = data.edges || [];
  var nodeByKey = {};
  allNodes.forEach(function(n) { nodeByKey[n.key] = n; });

  // --- エンティティ選択ドロップダウン(nodes[].entityのユニーク値。出現順) ---
  var entityOrder = [];
  var entitySeen = {};
  allNodes.forEach(function(n) {
    var e = n.entity || '';
    if (!entitySeen[e]) { entitySeen[e] = true; entityOrder.push(e); }
  });

  var entitySelect = document.getElementById('entity-select');
  entityOrder.forEach(function(e) {
    entitySelect.appendChild(el('option', { value: e }, e || '(エンティティ未設定)'));
  });

  function nodeLabel(key) {
    var n = nodeByKey[key];
    return (n && n.label) || key || '';
  }

  // 中心cx/cy・半幅hw/半高hhの矩形の境界上で、方向(dx,dy)にある点を返す
  function rectBorderPoint(cx, cy, hw, hh, dx, dy) {
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    var scaleX = dx !== 0 ? hw / Math.abs(dx) : Infinity;
    var scaleY = dy !== 0 ? hh / Math.abs(dy) : Infinity;
    var scale = Math.min(scaleX, scaleY);
    return { x: cx + dx * scale, y: cy + dy * scale };
  }

  // --- 選択エンティティの nodes/edges だけを描画する(画面遷移図の共通SVG描画ロジックを流用) ---
  function renderEntity(entity) {
    var nodesRaw = allNodes.filter(function(n) { return (n.entity || '') === entity; });
    var keys = nodesRaw.map(function(n) { return n.key; });
    var keySet = {};
    keys.forEach(function(k) { keySet[k] = true; });
    var edgesRaw = allEdges.filter(function(e) {
      return (e.entity || '') === entity || (keySet[e.from] && keySet[e.to]);
    });

    var svg = document.getElementById('diagram-svg');
    var diagramWrap = svg.parentNode;
    // 直前の描画を消してから再構築する(エンティティ切替のたびにSVGを作り直す)
    var freshSvg = svgEl('svg', { id: 'diagram-svg', xmlns: SVGNS });
    diagramWrap.replaceChild(freshSvg, svg);
    svg = freshSvg;

    var theadRow = el('tr', null, [
      el('th', null, '状態(元)'), el('th', null, '状態(先)'), el('th', null, '契機'), el('th', null, '記載箇所')
    ]);
    var theadMount = document.getElementById('detail-table-head');
    theadMount.innerHTML = '';
    theadMount.appendChild(theadRow);
    var tbody = document.getElementById('detail-table-body');
    tbody.innerHTML = '';

    if (keys.length === 0) {
      diagramWrap.appendChild(el('div', { class: 'diagram-empty' }, '図示できる状態がありません'));
      tbody.appendChild(el('tr', null, el('td', { colspan: '4' }, 'なし')));
      return;
    }

    // --- 箱サイズ(ラベル長から決定的に算出) ---
    var BOX_H = 44, MIN_W = 120, MAX_W = 220;
    var boxW = {};
    nodesRaw.forEach(function(n) {
      var label = n.label || n.key || '';
      boxW[n.key] = Math.max(MIN_W, Math.min(MAX_W, label.length * 9 + 28));
    });

    var COL_GAP = 260, ROW_GAP = 90, MARGIN = 40;
    var pos = {};

    // 層状配置: 入次数0のノードを起点(level=0)とし、辺をたどってlevelを更新する
    var indeg = {}; keys.forEach(function(k) { indeg[k] = 0; });
    var adj = {}; keys.forEach(function(k) { adj[k] = []; });
    edgesRaw.forEach(function(e) {
      if (adj[e.from] !== undefined && indeg[e.to] !== undefined) {
        adj[e.from].push(e.to);
        indeg[e.to]++;
      }
    });
    var level = {};
    var queue = keys.filter(function(k) { return indeg[k] === 0; });
    var visited = {};
    queue.forEach(function(k) { level[k] = 0; visited[k] = true; });
    var qi = 0;
    while (qi < queue.length) {
      var cur = queue[qi++];
      (adj[cur] || []).forEach(function(n) {
        var newLevel = level[cur] + 1;
        if (level[n] === undefined || newLevel > level[n]) level[n] = newLevel;
        if (!visited[n]) { visited[n] = true; queue.push(n); }
      });
    }
    // 入次数0起点から到達できない孤立ノード(孤立サイクル等)はlevel 0扱いとする
    keys.forEach(function(k) { if (level[k] === undefined) level[k] = 0; });

    var byLevel = {};
    keys.forEach(function(k) {
      var lv = level[k];
      byLevel[lv] = byLevel[lv] || [];
      byLevel[lv].push(k);
    });
    Object.keys(byLevel).forEach(function(lv) {
      byLevel[lv].forEach(function(k, idx) {
        pos[k] = {
          cx: MARGIN + Number(lv) * COL_GAP + boxW[k] / 2,
          cy: MARGIN + idx * ROW_GAP + BOX_H / 2
        };
      });
    });

    var maxX = 0, maxY = 0;
    keys.forEach(function(k) {
      var p = pos[k];
      maxX = Math.max(maxX, p.cx + boxW[k] / 2);
      maxY = Math.max(maxY, p.cy + BOX_H / 2);
    });
    var svgW = Math.max(600, maxX + MARGIN);
    var svgH = Math.max(220, maxY + MARGIN);
    svg.setAttribute('width', svgW);
    svg.setAttribute('height', svgH);
    svg.setAttribute('viewBox', '0 0 ' + svgW + ' ' + svgH);

    // --- 矢印マーカー ---
    var defs = svgEl('defs');
    var marker = svgEl('marker', {
      id: 'diagram-arrowhead', viewBox: '0 0 10 10', refX: '9', refY: '5',
      markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'
    });
    marker.appendChild(svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', class: 'diagram-arrow' }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    // --- エッジ描画(from/toの矩形境界を結ぶ線 + トリガーラベル) ---
    var edgeGroup = svgEl('g', { class: 'diagram-edges' });
    edgesRaw.forEach(function(e) {
      var a = pos[e.from], b = pos[e.to];
      if (!a || !b) { return; } // 未解決参照(ノード不在)は描画をスキップする
      var dx = b.cx - a.cx, dy = b.cy - a.cy;
      var start = rectBorderPoint(a.cx, a.cy, boxW[e.from] / 2, BOX_H / 2, dx, dy);
      var end = rectBorderPoint(b.cx, b.cy, boxW[e.to] / 2, BOX_H / 2, -dx, -dy);
      var line = svgEl('line', { x1: start.x, y1: start.y, x2: end.x, y2: end.y, class: 'diagram-edge' });
      line.setAttribute('marker-end', 'url(#diagram-arrowhead)');
      edgeGroup.appendChild(line);

      if (e.trigger) {
        var mx = (start.x + end.x) / 2, my = (start.y + end.y) / 2;
        var labelG = svgEl('g', { class: 'diagram-edge-label', transform: 'translate(' + mx + ',' + my + ')' });
        var textNode = svgEl('text', { 'text-anchor': 'middle', dy: '-4' });
        textNode.textContent = e.trigger;
        labelG.appendChild(textNode);
        edgeGroup.appendChild(labelG);
      }
    });
    svg.appendChild(edgeGroup);

    // --- 状態ノード描画(角丸矩形 + ラベル) ---
    var nodeGroup = svgEl('g', { class: 'diagram-nodes' });
    nodesRaw.forEach(function(n) {
      var k = n.key;
      var p = pos[k];
      var w = boxW[k];
      var g = svgEl('g', {
        class: 'diagram-node',
        transform: 'translate(' + (p.cx - w / 2) + ',' + (p.cy - BOX_H / 2) + ')'
      });
      g.appendChild(svgEl('rect', { width: w, height: BOX_H, rx: 8, ry: 8, class: 'diagram-node-rect' }));
      var text = svgEl('text', {
        x: w / 2, y: BOX_H / 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
        class: 'diagram-node-text'
      });
      text.textContent = n.label || k || '';
      g.appendChild(text);
      nodeGroup.appendChild(g);
    });
    svg.appendChild(nodeGroup);

    // --- 補足表(edges[]の詳細。sourceRefの参照はこの表で行う) ---
    if (edgesRaw.length === 0) {
      tbody.appendChild(el('tr', null, el('td', { colspan: '4' }, 'なし')));
    } else {
      edgesRaw.forEach(function(e) {
        tbody.appendChild(el('tr', null, [
          el('td', null, nodeLabel(e.from) + '（' + (e.from || '') + '）'),
          el('td', null, nodeLabel(e.to) + '（' + (e.to || '') + '）'),
          el('td', null, e.trigger || ''),
          el('td', null, el('code', null, e.sourceRef || ''))
        ]));
      });
    }
  }

  entitySelect.addEventListener('change', function() { renderEntity(entitySelect.value); });
  if (entityOrder.length > 0) {
    entitySelect.value = entityOrder[0];
    renderEntity(entityOrder[0]);
  } else {
    document.getElementById('diagram-svg').parentNode.appendChild(el('div', { class: 'diagram-empty' }, '図示できる状態がありません'));
  }

  // --- 未解決節(unresolved[]) ---
  var unresolvedMount = document.getElementById('unresolved-mount');
  var unresolved = data.unresolved || [];
  if (unresolved.length > 0) {
    unresolvedMount.appendChild(el('div', { class: 'sec-label' }, '未解決'));
    var box = el('div', { class: 'note-box' });
    unresolved.forEach(function(u) {
      box.appendChild(el('div', null, (u.label || '') + '（' + (u.reason || '') + '）'));
    });
    unresolvedMount.appendChild(box);
  }
})();
</script>
</body>
</html>
