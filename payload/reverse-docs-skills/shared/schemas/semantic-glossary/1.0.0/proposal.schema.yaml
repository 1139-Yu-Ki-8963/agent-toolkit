$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.reverse-docs.local/semantic-glossary/1.0.0/proposal.schema.yaml
title: Semantic Glossary Proposal
type: object
additionalProperties: false
required: [proposal_key, proposal_schema_version, target_glossary_key, base_content_version, target_content_version, merge_key, proposed_term, proposal]
properties:
  proposal_key: {$ref: 'glossary.schema.yaml#/$defs/semantic_key'}
  proposal_operation: {enum: [add, update]}
  proposal_schema_version: {const: 1.0.0}
  target_glossary_key: {$ref: 'glossary.schema.yaml#/$defs/semantic_key'}
  base_content_version: {$ref: 'glossary.schema.yaml#/$defs/semver'}
  target_content_version: {$ref: 'glossary.schema.yaml#/$defs/semver'}
  merge_key: {$ref: 'glossary.schema.yaml#/$defs/semantic_key'}
  proposed_term: {$ref: 'glossary.schema.yaml#/$defs/term'}
  proposal:
    type: object
    additionalProperties: false
    required: [extracted_facts, inferences, evidence, confidence, approval, detected_by]
    properties:
      extracted_facts:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [subject, predicate, object, evidence_ref]
          properties:
            subject: {type: string, minLength: 1}
            predicate: {type: string, minLength: 1}
            object: {type: string, minLength: 1}
            evidence_ref: {type: string, minLength: 1}
      inferences:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [field, statement, basis]
          properties:
            field: {type: string, minLength: 1}
            statement: {type: string, minLength: 1}
            basis: {type: string, minLength: 1}
      evidence:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/evidence'}
      confidence:
        type: object
        additionalProperties: false
        required: [score, level, rationale]
        properties:
          score: {type: number, minimum: 0, maximum: 1}
          level: {enum: [low, medium, high]}
          rationale: {type: string, minLength: 1}
      approval:
        type: object
        additionalProperties: false
        required: [status, reviewers, reviewed_at, decision_reason, events]
        properties:
          status: {enum: [detected, needs_review, changes_requested, approved, rejected, deferred, merged]}
          reviewers:
            type: array
            items: {$ref: '#/$defs/reviewer'}
          reviewed_at:
            oneOf: [{type: string, format: date-time}, {type: 'null'}]
          decision_reason:
            oneOf: [{type: string, minLength: 1}, {type: 'null'}]
          events:
            type: array
            minItems: 1
            items: {$ref: '#/$defs/approval_event'}
      detected_by: {$ref: '#/$defs/producer'}
  merged_revision:
    oneOf: [{type: string, minLength: 1}, {type: 'null'}]
allOf:
  - if:
      properties:
        proposal:
          properties:
            approval:
              properties:
                status: {enum: [approved, merged]}
              required: [status]
          required: [approval]
      required: [proposal]
    then:
      properties:
        proposal:
          properties:
            approval:
              properties:
                decision_reason: {type: string, pattern: '.*\S.*'}
$defs:
  evidence:
    type: object
    additionalProperties: false
    required: [ref, excerpt_hash, observed_at, source_revision]
    properties:
      ref: {type: string, minLength: 1}
      excerpt_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      observed_at: {type: string, format: date-time}
      source_revision: {type: string, minLength: 1}
  reviewer:
    type: object
    additionalProperties: false
    required: [actor, role, decision, decided_at]
    properties:
      actor: {type: string, pattern: '.*\S.*'}
      role: {enum: [business_approver, technical_approver]}
      decision: {enum: [approved, rejected, changes_requested, deferred]}
      decided_at: {type: string, format: date-time}
  approval_event:
    type: object
    additionalProperties: false
    required: [from, to, actor, actor_role, occurred_at, reason]
    properties:
      from:
        oneOf: [{enum: [detected, needs_review, changes_requested, approved, rejected, deferred, merged]}, {type: 'null'}]
      to: {enum: [detected, needs_review, changes_requested, approved, rejected, deferred, merged]}
      actor: {type: string, pattern: '.*\S.*'}
      actor_role: {enum: [analyzer, maintainer, steward, business_approver, technical_approver]}
      occurred_at: {type: string, format: date-time}
      reason: {type: string, minLength: 1}
  producer:
    type: object
    additionalProperties: false
    required: [skill, version]
    properties:
      skill: {type: string, minLength: 1}
      version: {$ref: 'glossary.schema.yaml#/$defs/semver'}
