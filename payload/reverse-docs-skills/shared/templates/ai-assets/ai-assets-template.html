<!DOCTYPE html>
<!--
  AI設定資産.HTML の静的シェル(テンプレート)

  答える質問: 「このプロジェクトで効く rules は何か」「使えるスキルは」
  「委任できるサブエージェントは」「どの hook が何を block するか」。
  プロジェクトに適用される AI 設定資産(rules / skills / サブエージェント / hooks)を
  4 セクションの一覧で示す。

  使い方:
    将来のビルドスクリプトがプレースホルダ・注入マーカーを機械的に置換して生成する。
    Claude(手作業)によるプレースホルダ置換は禁止。生成は必ずスクリプト経由で行う。

  プレースホルダ(二重置換事故を避けるため、マーカーの実記法は注入箇所のコメント・波括弧を正とする):
    GENERATED_AT (生成日時マーカー)  : ISO8601 生成日時
    DATA_SOURCE (データ源マーカー)   : 一覧の導出元(.claude/rules・.claude/settings.json・.claude/skills 等)
    ASSETS_JSON (設定資産JSON埋め込みマーカー) :
      <script type="application/json" id="matrix-manifest"> の中身として
      {
        "rules":     [{"ruleName","layer":"always|scoped|generated","declaredEnforcement":"block|advisory|なし","mechanicalEnforcement":false,"tags":["[TAG]"...],"summary"}...],
        "skills":    [{"skillName","category","trigger","summary"}...],
        "subagents": [{"name","classification":"計画系|実行系|調査系|判定系","verdict":"可|不可","mainTools"}...],
        "hooks":     [{"script","timing","matcher","tags":["[TAG]"...],"behavior":"block|advisory","summary"}...]
      }
      形式の JSON をそのまま埋め込む(二重管理・ドリフト禁止)。
      rulesのdangerバッジは mechanicalEnforcement=true の場合だけ描画する。
      宣言区分のadvisoryはgold、blockはaccentで描画し、宣言と機械強制を混同しない。

  保守注記: トークン・共通シェル(サイドバー・フッター・全画面レイアウトのCSS)は
  shared/templates/partials 配下の共通ファイルを注入マーカー経由で読み込む。
  テーマ切替はサイドバー側に一本化されており、本テンプレートに複製は無い。

  制約:
    - 外部リソース(CDN・フォント・画像)は一切使わない。単一ファイル自己完結
    - <script id="matrix-manifest"> の中身は確定結果の設定資産JSONと完全に一致させる
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI設定資産</title>
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

.toolbar-area { flex-shrink: 0; padding: 8px 0 0; }
.toolbar { display: flex; gap: 10px; margin: 0 0 10px; align-items: center; flex-wrap: wrap; }
.toolbar .pt-input { width: 260px; flex: none; }
.toolbar .note { font-size: 0.82rem; color: var(--muted); }
.toolbar .pt-count { margin-left: auto; }

.table-area { flex: 1; min-height: 0; overflow-y: auto; }

details.module-group { margin: 0 0 18px; background: var(--panel); border: 1.5px solid var(--line2); min-width: 0; }
details.module-group > summary {
  cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none;
}
details.module-group > summary::-webkit-details-marker { display: none; }
details.module-group > summary::before { content: "▸ "; }
details.module-group[open] > summary::before { content: "▾ "; }
details.module-group > summary .count { font-weight: 400; font-size: 0.82rem; color: var(--muted); margin-left: 8px; }

table.assets {
  table-layout: fixed; width: 100%; min-width: 760px; border-collapse: collapse; font-size: 0.88rem;
}
table.assets th, table.assets td {
  border-top: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top;
  overflow-wrap: break-word; word-break: break-word;
}
table.assets th { font-family: var(--mono); font-size: 10px; font-weight: 600; white-space: nowrap; }
table.assets td code {
  font-family: var(--mono); font-size: 0.85em;
  background: var(--panel3); padding: 1px 5px;
}
table.assets tbody tr:hover td { background: var(--panel3); }

.badge { display: inline-block; font-size: 0.76rem; font-weight: 700; padding: 1px 8px; white-space: nowrap; }
.badge.danger  { background: var(--stamp-soft); color: var(--stamp); }     /* block */
.badge.gold    { background: var(--stamp-soft); color: var(--stamp); }    /* advisory */
.badge.neutral { background: var(--panel3); color: var(--sub); }          /* なし・不可 等 */
.badge.accent  { background: var(--accent-soft); color: var(--accent); }  /* 階層・分類・可 等 */

.empty-note { padding: 10px 16px 16px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main is-fixed">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{BACK_LINK}}">TOP</a> ／ AI設定資産 ／ <span class="pt-crumb-current">AI設定資産</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title">AI設定資産</h1>
          <span class="pt-title-sub">更新 {{GENERATED_AT}}</span>
        </div>
      </div>

      <div class="toolbar-area">
        <div class="toolbar">
          <input type="search" id="assets-search" class="pt-input" placeholder="名前・タグ・概要で絞り込み（全セクション横断）">
          <span class="note">宣言区分と、実際に登録済みhookで機械強制される状態を分けて表示</span>
          <span class="pt-count" id="assets-count"></span>
        </div>
      </div>

      <div class="table-area">
        <details class="module-group" open id="section-rules">
          <summary>rules一覧<span class="count" data-count></span></summary>
          <div class="pt-tablewrap">
          <table class="assets" id="rules-table">
            <thead>
              <tr>
                <th>ルール名</th>
                <th>階層</th>
                <th>宣言区分</th>
                <th>機械強制</th>
                <th>注入タグ</th>
                <th>概要</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          </div>
          <p class="empty-note" hidden data-empty>該当なし</p>
        </details>

        <details class="module-group" open id="section-skills">
          <summary>skills一覧<span class="count" data-count></span></summary>
          <div class="pt-tablewrap">
          <table class="assets" id="skills-table">
            <thead>
              <tr>
                <th>スキル名</th>
                <th>種別</th>
                <th>トリガー</th>
                <th>概要</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          </div>
          <p class="empty-note" hidden data-empty>該当なし</p>
        </details>

        <details class="module-group" open id="section-subagents">
          <summary>サブエージェント一覧<span class="count" data-count></span></summary>
          <div class="pt-tablewrap">
          <table class="assets" id="subagents-table">
            <thead>
              <tr>
                <th>名前</th>
                <th>分類</th>
                <th>合否宣言</th>
                <th>主ツール</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          </div>
          <p class="empty-note" hidden data-empty>該当なし</p>
        </details>

        <details class="module-group" open id="section-hooks">
          <summary>hooks一覧<span class="count" data-count></span></summary>
          <div class="pt-tablewrap">
          <table class="assets" id="hooks-table">
            <thead>
              <tr>
                <th>スクリプト</th>
                <th>timing</th>
                <th>対象(matcher)</th>
                <th>注入タグ</th>
                <th>挙動</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          </div>
          <p class="empty-note" hidden data-empty>該当なし</p>
        </details>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="matrix-manifest">
<!--ASSETS_JSON-->
</script>

<script>
  (function () {
    var manifestEl = document.getElementById('matrix-manifest');
    var manifest = { rules: [], skills: [], subagents: [], hooks: [] };
    try { manifest = JSON.parse(manifestEl.textContent); } catch (e) { /* プレースホルダ未注入時は空描画 */ }
    var rules = manifest.rules || [];
    var skills = manifest.skills || [];
    var subagents = manifest.subagents || [];
    var hooks = manifest.hooks || [];

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    /* hook挙動用バッジ: block=danger / advisory=gold / それ以外=neutral */
    function enforcementBadge(value) {
      var v = String(value || 'なし');
      var cls = v === 'block' ? 'badge danger' : (v === 'advisory' ? 'badge gold' : 'badge neutral');
      return el('span', cls, v);
    }

    /* ruleの宣言区分は機械強制と独立。宣言blockだけではdangerにしない。 */
    function declaredBadge(value) {
      var v = String(value || 'なし');
      var cls = v === 'advisory' ? 'badge gold' : (v === 'block' ? 'badge accent' : 'badge neutral');
      return el('span', cls, v);
    }

    function mechanicalBadge(value) {
      return el('span', value === true ? 'badge danger' : 'badge neutral', value === true ? '有効' : 'なし');
    }

    function tagCell(tags) {
      var td = el('td');
      var list = tags || [];
      if (list.length === 0) { td.textContent = '—'; return td; }
      list.forEach(function (t, i) {
        if (i > 0) td.appendChild(document.createTextNode(' '));
        td.appendChild(el('code', null, t));
      });
      return td;
    }

    function buildRulesRow(r) {
      var tr = el('tr');
      tr.appendChild(el('td', null, r.ruleName || ''));
      var tdLayer = el('td');
      tdLayer.appendChild(el('span', 'badge accent', r.layer || ''));
      tr.appendChild(tdLayer);
      var tdDeclared = el('td');
      tdDeclared.appendChild(declaredBadge(r.declaredEnforcement));
      tr.appendChild(tdDeclared);
      var tdMechanical = el('td');
      tdMechanical.appendChild(mechanicalBadge(r.mechanicalEnforcement));
      tr.appendChild(tdMechanical);
      tr.appendChild(tagCell(r.tags));
      tr.appendChild(el('td', null, r.summary || ''));
      return tr;
    }

    function buildSkillsRow(s) {
      var tr = el('tr');
      var tdName = el('td');
      tdName.appendChild(el('code', null, s.skillName || ''));
      tr.appendChild(tdName);
      var tdCat = el('td');
      tdCat.appendChild(el('span', 'badge accent', s.category || ''));
      tr.appendChild(tdCat);
      tr.appendChild(el('td', null, s.trigger || ''));
      tr.appendChild(el('td', null, s.summary || ''));
      return tr;
    }

    function buildSubagentsRow(a) {
      var tr = el('tr');
      var tdName = el('td');
      tdName.appendChild(el('code', null, a.name || ''));
      tr.appendChild(tdName);
      var tdCls = el('td');
      tdCls.appendChild(el('span', 'badge accent', a.classification || ''));
      tr.appendChild(tdCls);
      var tdVerdict = el('td');
      tdVerdict.appendChild(el('span', a.verdict === '可' ? 'badge gold' : 'badge neutral', a.verdict || '不可'));
      tr.appendChild(tdVerdict);
      tr.appendChild(el('td', null, a.mainTools || ''));
      return tr;
    }

    function buildHooksRow(h) {
      var tr = el('tr');
      var tdScript = el('td');
      tdScript.appendChild(el('code', null, h.script || ''));
      tr.appendChild(tdScript);
      tr.appendChild(el('td', null, h.timing || ''));
      tr.appendChild(el('td', null, h.matcher || '—'));
      tr.appendChild(tagCell(h.tags));
      var tdBehavior = el('td');
      tdBehavior.appendChild(enforcementBadge(h.behavior));
      if (h.summary) {
        tdBehavior.appendChild(document.createTextNode(' '));
        tdBehavior.appendChild(el('span', null, h.summary));
      }
      tr.appendChild(tdBehavior);
      return tr;
    }

    var sections = [
      { detailsId: 'section-rules', tableId: 'rules-table', data: rules, build: buildRulesRow },
      { detailsId: 'section-skills', tableId: 'skills-table', data: skills, build: buildSkillsRow },
      { detailsId: 'section-subagents', tableId: 'subagents-table', data: subagents, build: buildSubagentsRow },
      { detailsId: 'section-hooks', tableId: 'hooks-table', data: hooks, build: buildHooksRow }
    ];

    sections.forEach(function (sec) {
      var tbody = document.getElementById(sec.tableId).querySelector('tbody');
      sec.data.forEach(function (item) { tbody.appendChild(sec.build(item)); });
    });

    /* 規模表示(トップバー右端) */
    var countEl = document.getElementById('assets-count');
    if (countEl) {
      countEl.textContent = 'rules ' + rules.length + '件 / skills ' + skills.length + '件 / サブエージェント ' + subagents.length + '件 / hooks ' + hooks.length + '件';
    }

    /* 全セクション横断のテキスト検索 */
    var search = document.getElementById('assets-search');
    function applyFilter() {
      var q = search ? search.value.trim().toLowerCase() : '';
      sections.forEach(function (sec) {
        var details = document.getElementById(sec.detailsId);
        var tbody = document.getElementById(sec.tableId).querySelector('tbody');
        var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
        var visibleCount = 0;
        rows.forEach(function (tr) {
          var hit = !q || tr.textContent.toLowerCase().indexOf(q) !== -1;
          tr.style.display = hit ? '' : 'none';
          if (hit) visibleCount++;
        });
        var countCell = details.querySelector('[data-count]');
        if (countCell) countCell.textContent = '（' + visibleCount + ' / ' + rows.length + '件）';
        var emptyEl = details.querySelector('[data-empty]');
        if (emptyEl) emptyEl.hidden = visibleCount !== 0;
      });
    }
    if (search) search.addEventListener('input', applyFilter);

    /* URLSearchParams の q を検索窓に反映する受け口(?q=キーワード) */
    try {
      var qParam = new URLSearchParams(location.search).get('q');
      if (qParam && search) { search.value = qParam; }
    } catch (e) { /* ignore */ }

    applyFilter();
  })();
</script>

</body>
</html>
