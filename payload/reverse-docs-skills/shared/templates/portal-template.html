<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT_NAME}} — 設計ポータル</title>
<!--
  ポータルテンプレート — 設計スキル群
  生成: shared/scripts/build-portal.sh
  プレースホルダ置換は build-portal.sh の render_template() が行う。
  手作業によるプレースホルダ置換は禁止。生成は必ずスクリプト経由で行う。

  プレースホルダ一覧:
    {{PROJECT_NAME}}     — プロジェクト名（basename target_repo_path）
    {{GENERATED_DATE}}   — 更新日（date +%Y-%m-%d）
    {{COMMIT_SHORT}}     — 対象リポジトリの短縮コミット SHA（git 管理外は空文字。区切り文字 " · " 込み）
    {{METRICS_JSON}}     — 解析概要 JSON オブジェクト（scale/tests/freshness/previous の構造化データ）
    {{CATEGORIES_JSON}}  — カテゴリ・ツール JSON 配列
    {{SCREEN_MANIFEST_JSON}} — 画面派生元manifest（未指定時は空object）
-->
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

/* ヒーロー */
.pm-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  padding: 32px 0 20px;
  border-bottom: 2px solid var(--line2);
  margin-bottom: 28px;
}
.pm-hero-stamp {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--stamp);
  font-weight: 700;
}
.pm-hero h1 { font-size: 34px; font-weight: 700; margin: 8px 0 0; }
.pm-hero p { font-size: 13.5px; color: var(--sub); margin: 8px 0 0; }
.pm-hero-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--sub);
  border: 1.5px solid var(--line2);
  background: var(--panel);
  padding: 10px 16px;
  min-width: 200px;
}
.pm-hero-meta div { padding: 2px 0; }
.pm-hero-commit:empty { display: none; }

/* 解析概要 */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 16px; margin-bottom: 32px; }
.metric-card { background: var(--panel); border: 1.5px solid var(--line2); padding: 18px 20px; }
.metric-label {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.metric-value { font-family: var(--mono); font-size: 38px; font-weight: 600; line-height: 1.1; color: var(--text); }
.metric-value .unit { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.metric-sub { font-size: 11.5px; color: var(--sub); margin-top: 8px; }
.inv-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.inv-chip {
  display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--panel3); padding: 5px 10px;
  transition: border-color .12s, background .12s;
}
.inv-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.inv-chip-label { font-size: 11.5px; color: var(--sub); }
.inv-chip-count { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); }

/* 横断検索 */
.pm-search { max-width: 420px; margin: 0 0 32px; }
.pm-search .pt-input { width: 100%; }

/* カテゴリ台帳 */
.pm-cat { margin-top: 34px; }
.pm-cat:first-child { margin-top: 0; }
.pm-cat-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 12px;
  padding: 0 0 10px;
  margin: 0 0 14px;
  border-bottom: 1.5px solid var(--line2);
}
.pm-cat-num { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--stamp); }
.pm-cat-title { font-size: 18px; font-weight: 700; margin: 0; }
.pm-cat-sub { font-size: 11.5px; color: var(--muted); }
.pm-cat-tag { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

/* ツールカードのグリッド（共有罫線） */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 0;
  border-left: 1.5px solid var(--line2);
  border-top: 1.5px solid var(--line2);
  background: var(--panel);
}
.tool-group-label {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--sub);
  padding: 7px 18px;
  border-right: 1.5px solid var(--line2);
  border-bottom: 1.5px solid var(--line2);
}
.tool-group-label::before { content: ""; width: 8px; height: 1.5px; background: var(--accent); display: inline-block; }
.card {
  display: block;
  padding: 14px 18px;
  color: var(--text);
  border-right: 1.5px solid var(--line2);
  border-bottom: 1.5px solid var(--line2);
  transition: background .12s;
}
.card:hover { background: var(--panel3); box-shadow: inset 0 -3px 0 var(--accent); text-decoration: none; }
.card.is-empty { color: var(--muted); cursor: default; }
.card.is-empty:hover { background: transparent; box-shadow: none; }
.card.is-disabled { color: var(--faint); cursor: default; border-right-style: dashed; border-bottom-style: dashed; }
.card.is-disabled:hover { background: transparent; box-shadow: none; }
.card.is-disabled .card-title { color: var(--faint); }
.card.is-disabled .card-count { color: var(--faint); }
.card-num { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.card-title { font-size: 14px; font-weight: 700; margin-top: 2px; }
.card-desc { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 4px; }
.card-count { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 8px; }

.cards .is-extra { display: none; }
.pm-cat.is-expanded .cards .is-extra { display: block; }
.pm-cats.is-searching .cards .is-extra { display: block; }
.pm-cats.is-searching .pm-cat-more { display: none; }

.pm-cat-more {
  grid-column: 1 / -1;
  border: 0;
  border-right: 1.5px solid var(--line2);
  border-bottom: 1.5px solid var(--line2);
  background: transparent;
  padding: 10px 18px;
  width: 100%;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--accent);
  cursor: pointer;
  text-align: center;
}
.pm-cat-more:hover { background: var(--panel3); }

.hidden { display: none !important; }

@media (max-width: 760px) {
  .pm-hero { padding: 24px 0 16px; }
  .pm-hero h1 { font-size: 26px; }
  .metric-grid { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr; }
  .pm-search { max-width: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main">
      <div class="pm-hero">
        <div>
          <div class="pm-hero-stamp">REVERSE-DOCS REGISTER</div>
          <h1>{{PROJECT_NAME}}</h1>
          <p>設計情報と技術資産を一元管理するポータル。</p>
          <p class="pm-hero-disclaimer">本ポータルの各設計書は現行実装をそのまま記録したものであり、業務要件・非機能要件・設計意図・運用実態は対象外です。未確定の事項は各文書の要確認事項一覧を参照してください。</p>
        </div>
        <div class="pm-hero-meta">
          <div>更新日 {{GENERATED_DATE}}</div>
          <div class="pm-hero-commit">{{COMMIT_SHORT}}</div>
        </div>
      </div>

      <div class="metric-grid" id="metrics-mount"></div>

      <div class="pm-search">
        <input type="text" class="pt-input" id="pm-search-input" placeholder="資料を横断検索…（/ でフォーカス）">
      </div>

      <div class="pm-cats" id="pm-cats">{{CATEGORY_SECTIONS_HTML}}</div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="portal-metrics">{{METRICS_JSON}}</script>
<script type="application/json" id="portal-categories">{{CATEGORIES_JSON}}</script>
<script type="application/json" id="screen-manifest-source">{{SCREEN_MANIFEST_JSON}}</script>

    var paths = {

  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k) {
      if (k === 'html') node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    if (children) {
      if (!Array.isArray(children)) children = [children];
      children.forEach(function(c) {
        if (typeof c === 'string') node.appendChild(document.createTextNode(c));
        else if (c) node.appendChild(c);
      });
    }
    return node;
  }

  function fmtNum(n) {
    return Number(n).toLocaleString('en-US');
  }

  var metricsMount = document.getElementById('metrics-mount');
  (function renderDigestCards() {
    var scale = metrics.scale;
    var tests = metrics.tests;

    var scaleCard = el('div', { class: 'metric-card' });
    scaleCard.appendChild(el('div', { class: 'metric-label', html: matIcon('code', 14) + '<span>SCALE ／ 規模</span>' }));
    scaleCard.appendChild(el('div', { class: 'metric-value', html: fmtNum(scale.total) + '<span class="unit">行</span>' }));
    scaleCard.appendChild(el('div', { class: 'metric-sub' }, 'FE ' + fmtNum(scale.fe) + ' · BE ' + fmtNum(scale.be) + ' · ファイル数 ' + fmtNum(scale.files)));
    metricsMount.appendChild(scaleCard);

    var testsCard = el('div', { class: 'metric-card' });
    testsCard.appendChild(el('div', { class: 'metric-label', html: matIcon('science', 14) + '<span>TESTS ／ テスト</span>' }));
    if (tests) {
      testsCard.appendChild(el('div', { class: 'metric-value', html: fmtNum(tests.count) + '<span class="unit">件</span>' }));
      testsCard.appendChild(el('div', { class: 'metric-sub' }, 'FE ' + fmtNum(tests.fe) + ' · BE ' + fmtNum(tests.be) + ' · 密度 ' + tests.density));
    } else {
      testsCard.appendChild(el('div', { class: 'metric-value' }, '—'));
      testsCard.appendChild(el('div', { class: 'metric-sub' }, '未計測 · counting-code-lines で計測'));
    }
    metricsMount.appendChild(testsCard);

    var invCard = el('div', { class: 'metric-card' });
    invCard.appendChild(el('div', { class: 'metric-label', html: matIcon('category', 14) + '<span>INVENTORY ／ 種別内訳</span>' }));
    var invChips = el('div', { class: 'inv-chips' });
    (scale.kinds || []).forEach(function(k) {
      invChips.appendChild(el('span', { class: 'inv-chip' }, [
        el('span', { class: 'inv-chip-label' }, k.label),
        el('span', { class: 'inv-chip-count' }, fmtNum(k.count))
      ]));
    });
    invCard.appendChild(invChips);
    metricsMount.appendChild(invCard);
  })();

  var CARD_CAP = 6;

  function padNum(n) {
    var s = String(n);
    return s.length < 2 ? '0' + s : s;
  }

  var catsMount = document.getElementById('pm-cats');

  categories.forEach(function(cat, catIdx) {
    var section = document.getElementById('cat-' + cat.id)
      || el('section', { class: 'pm-cat', id: 'cat-' + cat.id });

    var head = el('div', { class: 'pm-cat-head' });
    head.appendChild(el('span', { class: 'pm-cat-num' }, padNum(catIdx + 1)));
    head.appendChild(el('h2', { class: 'pm-cat-title' }, cat.title));
    head.appendChild(el('span', { class: 'pm-cat-sub' }, cat.sub));
    if (cat.group) head.appendChild(el('span', { class: 'pm-cat-tag' }, cat.group));
    section.appendChild(head);

    var grid = el('div', { class: 'cards' });
    var currentGroup = '';
    if (cat.tools.length === 0) {
      var empty = cat.empty || {
        title: '生成済み資料はありません',
        desc: 'このカテゴリの資料はまだ生成されていません。',
        count: '0 件'
      };
      var emptyCard = el('div', { class: 'card is-empty', role: 'status' });
      emptyCard.appendChild(el('div', { class: 'card-num' }, '00'));
      emptyCard.appendChild(el('div', { class: 'card-title' }, empty.title));
      emptyCard.appendChild(el('div', { class: 'card-desc' }, empty.desc));
      emptyCard.appendChild(el('div', { class: 'card-count' }, empty.count));
      grid.appendChild(emptyCard);
    }
    cat.tools.forEach(function(tool, toolIdx) {
      var isExtra = toolIdx >= CARD_CAP;
      if (tool.group && tool.group !== currentGroup) {
        currentGroup = tool.group;
        var label = el('div', { class: 'tool-group-label' }, currentGroup);
        if (isExtra) label.classList.add('is-extra');
        grid.appendChild(label);
      }
      var card = tool.disabled
        ? el('div', { class: 'card is-tool is-disabled', role: 'status', 'aria-disabled': 'true', 'data-disabled': 'true' })
        : el('a', { class: 'card is-tool', href: tool.href });
      card.appendChild(el('div', { class: 'card-num' }, padNum(toolIdx + 1)));
      card.appendChild(el('div', { class: 'card-title' }, tool.title));
      card.appendChild(el('div', { class: 'card-desc' }, tool.desc));
      card.appendChild(el('div', { class: 'card-count' }, tool.count));
      if (isExtra) card.classList.add('is-extra');
      grid.appendChild(card);
    });

    if (cat.tools.length > CARD_CAP) {
      var hiddenCount = cat.tools.length - CARD_CAP;
      var more = el('button', { type: 'button', class: 'pm-cat-more' }, '+ ' + hiddenCount + ' 件を表示');
      more.addEventListener('click', function() {
        var expanded = section.classList.toggle('is-expanded');
        more.textContent = expanded ? '折りたたむ' : ('+ ' + hiddenCount + ' 件を表示');
      });
      grid.appendChild(more);
    }

    section.appendChild(grid);
    catsMount.appendChild(section);
  });

  var searchInput = document.getElementById('pm-search-input');
  searchInput.addEventListener('input', function() {
    var q = searchInput.value.trim().toLowerCase();
    catsMount.classList.toggle('is-searching', !!q);
    Array.from(catsMount.querySelectorAll('.card')).forEach(function(card) {
      card.classList.toggle('hidden', !!q && card.textContent.toLowerCase().indexOf(q) === -1);
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
    if (e.key === 'Escape' && document.activeElement !== searchInput) { return; }
    if (e.key === 'Escape') { searchInput.value = ''; searchInput.blur(); searchInput.dispatchEvent(new Event('input')); }
  });
})();
</script>
</body>
</html>
