<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>要件定義・ビジネス概要</title>
  <style>
    :root { color-scheme: light dark; --panel-2: #F6F8FA; --accent: #0969DA; --success: #1A7F37; --text: #1F2328; --border: #D0D7DE; font-family: system-ui, sans-serif; }
    [data-theme="dark"] { --panel-2: #161B22; --accent: #58A6FF; --success: #3FB950; --text: #F0F6FC; --border: #30363D; }
    @media (prefers-color-scheme: dark) { :root { --panel-2: #161B22; --accent: #58A6FF; --success: #3FB950; --text: #F0F6FC; --border: #30363D; } }
    body { margin: 0; background: var(--panel-2); color: var(--text); }
    .template-page { box-sizing: border-box; height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 1rem 1.25rem; background: Canvas; border-bottom: 1px solid var(--border); }
    h1, h2 { margin: 0; line-height: 1.35; } h1 { color: var(--accent); } h2 { font-size: 1.05rem; }
    main { overflow-y: auto; padding: 1.25rem; } section { max-width: 60rem; padding: 1rem; margin: 0 auto 1rem; background: Canvas; border: 1px solid var(--border); border-radius: .5rem; }
    @media (max-width: 40rem) { header, main { padding: 1rem; } }
  </style>
</head>
<body>
  <div class="template-page">
    <header><h1>要件定義・ビジネス概要</h1></header>
    <main>
      <section><h2>背景</h2></section>
      <section><h2>目的</h2></section>
      <section><h2>対象範囲</h2></section>
      <section><h2>関係者</h2></section>
      <section><h2>未確定事項</h2></section>
    </main>
  </div>
</body>
</html>
