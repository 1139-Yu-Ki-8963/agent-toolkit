<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レビュー観点表</title>
  <style>
    :root { color-scheme: light dark; --panel-2: #F6F8FA; --accent: #0969DA; --success: #1A7F37; --text: #1F2328; --border: #D0D7DE; font-family: system-ui, sans-serif; }
    [data-theme="dark"] { --panel-2: #161B22; --accent: #58A6FF; --success: #3FB950; --text: #F0F6FC; --border: #30363D; }
    @media (prefers-color-scheme: dark) { :root { --panel-2: #161B22; --accent: #58A6FF; --success: #3FB950; --text: #F0F6FC; --border: #30363D; } }
    body { margin: 0; background: var(--panel-2); color: var(--text); }
    .template-page { box-sizing: border-box; height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 1rem 1.25rem; background: Canvas; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; line-height: 1.35; color: var(--accent); }
    main { overflow-y: auto; padding: 1.25rem; } .table-wrap { max-width: 70rem; margin: auto; overflow-x: auto; background: Canvas; border: 1px solid var(--border); border-radius: .5rem; }
    table { width: 100%; border-collapse: collapse; } caption { padding: .75rem; text-align: left; font-weight: 700; } th { position: sticky; top: 0; background: var(--panel-2); } th, td { padding: .75rem; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
    @media (max-width: 40rem) { header, main { padding: 1rem; } }
  </style>
</head>
<body>
  <div class="template-page">
    <header><h1>レビュー観点表</h1></header>
    <main><div class="table-wrap"><table><caption>レビュー観点</caption><thead><tr><th scope="col">観点</th><th scope="col">確認内容</th><th scope="col">根拠</th><th scope="col">結果</th></tr></thead><tbody></tbody></table></div></main>
  </div>
</body>
</html>
