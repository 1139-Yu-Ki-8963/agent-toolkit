<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOC_TITLE}}</title>
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

:root { --section-gap: clamp(28px, 4vw, 44px); }

/* 文書 2 カラム（目次 + 本文） */
.dp-layout { display: grid; grid-template-columns: 200px 1fr; gap: 36px; margin-top: 28px; align-items: start; }
.dp-toc { position: sticky; top: 24px; border-left: 1.5px solid var(--line2); padding-left: 16px; }

/* 画面ドキュメント間ナビ（基本設計・詳細設計・シーケンス図・テストケース） */
.sidebar-parent {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 10px; padding: 0 2px;
  color: var(--text); font-size: 13px; font-weight: 700; line-height: 1.4;
}
.sidebar-doc-nav {
  display: flex; flex-direction: column; gap: 2px;
  margin: 0 0 20px; padding: 0 0 14px;
  border-bottom: 1px solid var(--line);
}
.sidebar-doc-nav .back-link,
.sidebar-doc-nav .nav-item {
  display: block; min-width: 0; padding: 6px 10px;
  border: 0; border-left: 3px solid transparent;
  background: transparent; color: var(--sub);
  font-size: 12.5px; line-height: 1.4; text-decoration: none;
}
.sidebar-doc-nav .back-link { order: 10; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
.sidebar-doc-nav .nav-item:hover,
.sidebar-doc-nav .back-link:hover { color: var(--accent); border-left-color: var(--accent); text-decoration: none; }
.sidebar-doc-nav .nav-item.active { color: var(--accent); border-left-color: var(--accent); font-weight: 700; }

.toc-label {
  font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 8px; padding: 0 2px;
}
.toc-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1px; }
.toc-link {
  display: block; padding: 6px 10px; margin-left: -1.5px;
  border-left: 3px solid transparent;
  color: var(--sub); font-size: 12.5px; font-weight: 450; line-height: 1.4;
  transition: color .12s, border-color .12s;
}
.toc-link:hover { color: var(--text); border-left-color: var(--accent); text-decoration: none; }
.toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.dp-panel { border: 1.5px solid var(--line2); background: var(--panel); max-width: 760px; padding: 32px 40px; counter-reset: sec-num; }

/* section */
.sec-block { margin-bottom: var(--section-gap); scroll-margin-top: 24px; }
.sec-label {
  counter-increment: sec-num;
  display: flex; align-items: baseline; gap: 10px;
  font-size: 16.5px; font-weight: 700; color: var(--text);
  margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.sec-label::before {
  content: counter(sec-num, decimal-leading-zero);
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--stamp);
}

/* baseline prose（セクション固有クラスの対象外になる見出し・段落・引用・区切り線） */
#doc-content h3 { font-size: 1.05rem; margin: 20px 0 8px; color: var(--text); }
#doc-content h4 { font-size: 0.95rem; margin: 16px 0 6px; color: var(--sub); }
#doc-content p { margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol { padding-left: 22px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol li { margin: 4px 0; }
#doc-content ul { list-style: none; padding-left: 20px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ul li { position: relative; margin: 4px 0; }
#doc-content ul li::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
#doc-content img { max-width: 100%; }
#doc-content code {
  background: var(--panel3); color: var(--text); padding: 1px 6px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 0.85em;
}
#doc-content blockquote {
  border-left: 3px solid var(--accent); margin: 12px 0; padding: 8px 16px;
  background: var(--panel3); color: var(--sub); font-size: 0.95rem;
}
#doc-content hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

/* rule items（トップレベル ul のチェックリスト装飾。箇条書きと同じ体裁） */
.rule-list { list-style: none; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; }
.rule-item { position: relative; font-size: 13.5px; line-height: 1.75; color: var(--sub); }
.rule-item::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
.rule-item code {
  background: var(--panel); color: var(--text); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: .85em;
}

/* tables */
.table-wrap {
  width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
  border: 1.5px solid var(--line2); margin-bottom: 14px; scrollbar-gutter: stable;
}
table.data-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
table.data-table thead { position: sticky; top: 0; z-index: 1; }
table.data-table th {
  text-align: left; font-size: 11.5px; font-weight: 700; color: var(--headtext);
  background: var(--head); padding: 8px 12px; border-bottom: 1px solid var(--line2); white-space: nowrap;
}
table.data-table td {
  min-width: 11rem; max-width: 34rem; padding: 9px 12px;
  border-bottom: 1px solid var(--line); vertical-align: top;
  overflow-wrap: normal; word-break: normal; hyphens: none;
}
table.data-table td:first-child { min-width: 7rem; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table code {
  background: var(--panel3); color: var(--accent); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
}

/* code blocks */
.code-block { width: 100%; border: 1px solid var(--line2); overflow: hidden; background: var(--code); margin-bottom: 14px; }
.code-block-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 11px; font-weight: 600;
  color: var(--muted); border-bottom: 1px solid var(--line2);
  letter-spacing: .03em;
}
.code-block pre {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--codetext);
}
.code-block .kw { color: #CBA6F7; }
.code-block .fn { color: #89B4FA; }
.code-block .str { color: #A6E3A1; }
.code-block .num { color: #FAB387; }
.code-block .cm { color: #6C7086; font-style: italic; }
.code-block .op { color: #89DCEB; }
.code-block .type { color: #F9E2AF; }

@media (max-width: 820px) {
  .dp-layout { grid-template-columns: 1fr; margin-top: 20px; }
  .dp-toc { position: static; border-left: 0; padding-left: 0; margin-bottom: 20px; }
  .dp-panel { max-width: none; padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .toc-link { transition: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main" id="main-scroll">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{PORTAL_INDEX_HREF}}">TOP</a> ／ 一覧・設計図 ／ <span class="pt-crumb-current">{{DOC_TITLE}}</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title" id="dp-hero-title">{{DOC_TITLE}}</h1>
        </div>
      </div>
      <div class="dp-layout">
        <aside class="dp-toc" id="sidebar">
          <div class="sidebar-parent">
            <span id="screen-nav-title">画面 / 設計書</span>
          </div>
          <nav class="sidebar-doc-nav" aria-label="画面設計書">{{DOC_NAV}}</nav>
          <div class="toc-label">この設計書内</div>
          <ul class="toc-list" id="toc-list"></ul>
        </aside>
        <div class="dp-panel">
          <div id="doc-content"></div>
        </div>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="doc-md">{{DOC_MARKDOWN_JSON}}</script>

<script>
(function () {
  var src = JSON.parse(document.getElementById('doc-md').textContent || '""');

  // frontmatter 除去
  src = src.replace(/^\s*---[\s\S]*?---\s*/, '');

  var lines = src.split('\n');
  var html = [];
  var inTable = false;
  var inList = false;
  var listType = '';
  var inBlockquote = false;

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(s) {
    var value = s.replace(/[\u0000-\u001f\u007f]+/g, '').trim();
    var scheme = value.match(/^([a-z][a-z0-9+.-]*):/i);
    if (scheme && !/^(?:https?|mailto)$/i.test(scheme[1])) return '';
    return escAttr(value);
  }
  function inlineFormat(s) {
    s = escHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(_, alt, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<img src="' + sanitizedUrl + '" alt="' + escAttr(alt) + '" style="max-width:100%">' : alt;
    });
    s = s.replace(/\[([^\]]+)\]\(([^()\s]+)\)/g, function(_, label, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<a href="' + sanitizedUrl + '">' + label + '</a>' : label;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  }

  function closeList() {
    if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
  }
  function closeBlockquote() {
    if (inBlockquote) { html.push('</blockquote>'); inBlockquote = false; }
  }
  function closeTable() {
    if (inTable) { html.push('</tbody></table></div>'); inTable = false; }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // 空行
    if (!trimmed) { closeList(); closeBlockquote(); continue; }

    // 見出し
    var hm = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { closeList(); closeBlockquote(); closeTable(); var lv = hm[1].length; html.push('<h' + lv + '>' + inlineFormat(hm[2]) + '</h' + lv + '>'); continue; }

    // 水平線
    if (/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)) { closeList(); closeBlockquote(); closeTable(); html.push('<hr>'); continue; }

    // テーブル
    if (trimmed.indexOf('|') !== -1 && trimmed.charAt(0) === '|') {
      closeList(); closeBlockquote();
      var cells = trimmed.split('|').filter(function(c,j,a){ return j > 0 && j < a.length - 1; });
      if (/^[\s|:-]+$/.test(trimmed)) continue; // separator 行
      if (!inTable) {
        html.push('<div class="table-wrap"><table><thead><tr>');
        cells.forEach(function(c) { html.push('<th>' + inlineFormat(c.trim()) + '</th>'); });
        html.push('</tr></thead><tbody>');
        inTable = true;
      } else {
        html.push('<tr>');
        cells.forEach(function(c) { html.push('<td>' + inlineFormat(c.trim()) + '</td>'); });
        html.push('</tr>');
      }
      continue;
    } else { closeTable(); }

    // 引用
    if (trimmed.charAt(0) === '>') {
      closeList(); closeTable();
      if (!inBlockquote) { html.push('<blockquote>'); inBlockquote = true; }
      html.push('<p>' + inlineFormat(trimmed.substring(1).trim()) + '</p>');
      continue;
    } else { closeBlockquote(); }

    // 番号付きリスト
    var olm = trimmed.match(/^(\d+)\.\s+(.*)$/);
    if (olm) {
      closeTable(); closeBlockquote();
      if (!inList || listType !== 'ol') { closeList(); html.push('<ol>'); inList = true; listType = 'ol'; }
      html.push('<li>' + inlineFormat(olm[2]) + '</li>');
      continue;
    }

    // 箇条書き
    if (trimmed.charAt(0) === '-' && trimmed.charAt(1) === ' ') {
      closeTable(); closeBlockquote();
      if (!inList || listType !== 'ul') { closeList(); html.push('<ul>'); inList = true; listType = 'ul'; }
      html.push('<li>' + inlineFormat(trimmed.substring(2)) + '</li>');
      continue;
    }

    // 通常段落
    closeList(); closeTable(); closeBlockquote();
    html.push('<p>' + inlineFormat(trimmed) + '</p>');
  }
  closeList(); closeTable(); closeBlockquote();

  document.getElementById('doc-content').innerHTML = html.join('\n');

  // --- 拡張: h1 をヒーローへ、h2 をセクションブロック化 + 目次生成、テーブル/リストの装飾付与 ---
  (function enhance() {
    var container = document.getElementById('doc-content');
    var heroTitle = document.getElementById('dp-hero-title');
    var tocList = document.getElementById('toc-list');

    // 最初の h1 はヒーローへ移し、本文からは除去する
    var h1 = container.querySelector('h1');
    if (h1) {
      heroTitle.textContent = h1.textContent;
      var navTitle = document.getElementById('screen-nav-title');
      if (navTitle) navTitle.textContent = '画面 / ' + h1.textContent.replace(/\s*画面(基本|詳細)設計書\s*$/, '');
      h1.parentNode.removeChild(h1);
    }

    // テーブルに data-table クラスを付与（sticky thead は CSS 側で対応済み）
    Array.prototype.forEach.call(container.querySelectorAll('table'), function (t) {
      t.classList.add('data-table');
    });

    function sectionSlug(text) {
      var normalized = text.trim();
      if (normalized.normalize) normalized = normalized.normalize('NFKC');
      normalized = normalized.toLowerCase()
        .replace(/[^a-z0-9぀-ヿ㐀-鿿._~-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      return normalized || 'section';
    }

    // h2 ごとにセクションブロック化 + 目次エントリを生成
    var h2s = Array.prototype.slice.call(container.querySelectorAll('h2'));
    h2s.forEach(function (h2, idx) {
      var text = h2.textContent;
      var baseId = 'sec-' + sectionSlug(text);
      var id = baseId;
      var duplicate = 2;
      while (document.getElementById(id)) {
        id = baseId + '-' + duplicate;
        duplicate += 1;
      }

      var section = document.createElement('section');
      section.className = 'sec-block';
      section.id = id;

      var label = document.createElement('div');
      label.className = 'sec-label';
      label.textContent = text;
      section.appendChild(label);

      h2.parentNode.insertBefore(section, h2);
      var node = h2.nextSibling;
      h2.parentNode.removeChild(h2);
      while (node && !(node.nodeType === 1 && node.tagName === 'H2')) {
        var next = node.nextSibling;
        section.appendChild(node);
        node = next;
      }

      // セクション直下（トップレベル）の ul のみをチェックリスト装飾する。入れ子リストは変換しない
      Array.prototype.forEach.call(section.children, function (child) {
        if (child.tagName === 'UL') {
          child.classList.add('rule-list');
          Array.prototype.forEach.call(child.children, function (li) {
            if (li.tagName !== 'LI') return;
            li.classList.add('rule-item');
            var content = document.createElement('div');
            while (li.firstChild) content.appendChild(li.firstChild);
            li.appendChild(content);
          });
        }
      });

      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + id;
      var label2 = document.createElement('span');
      label2.textContent = text;
      a.appendChild(label2);
      li.appendChild(a);
      tocList.appendChild(li);
    });

    var firstLink = tocList.querySelector('.toc-link');
    if (firstLink) firstLink.classList.add('active');
  })();
})();
</script>

<script>
(function(){
  var links = document.querySelectorAll('.toc-link');
  var sections = document.querySelectorAll('.sec-block');
  var mainEl = document.getElementById('main-scroll');

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function fragmentToId(fragment) {
    var raw = fragment && fragment.charAt(0) === '#' ? fragment.substring(1) : (fragment || '');
    if (!raw) return '';
    try {
      return decodeURIComponent(raw);
    } catch (error) {
      return '';
    }
  }

  function scrollToFragment(fragment, behavior) {
    var targetId = fragmentToId(fragment);
    var target = targetId ? document.getElementById(targetId) : null;
    if (!target) return false;
    target.scrollIntoView({behavior: behavior, block:'start'});
    return true;
  }

  var linkBySectionId = {};
  links.forEach(function(l){
    var href = l.getAttribute('href');
    if (href && href.charAt(0) === '#') linkBySectionId[href.substring(1)] = l;
  });

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(l){l.classList.remove('active')});
        var a = linkBySectionId[e.target.id];
        if(a) a.classList.add('active');
      }
    });
  },{root: mainEl, rootMargin:'-10% 0px -80% 0px'});
  sections.forEach(function(s){observer.observe(s)});

  links.forEach(function(l){
    l.addEventListener('click',function(e){
      e.preventDefault();
      var href = this.getAttribute('href');
      if(scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
        if (window.history && window.history.pushState) window.history.pushState(null, '', href);
        else window.location.hash = fragmentToId(href);
      }
    });
  });

  if (window.location.hash) {
    requestAnimationFrame(function(){
      scrollToFragment(window.location.hash, 'auto');
    });
  }

  window.addEventListener('popstate', function(){
    requestAnimationFrame(function(){
      if (!scrollToFragment(window.location.hash, 'auto') && mainEl) {
        mainEl.scrollTo({top: 0, behavior: 'auto'});
      }
    });
  });
})();
</script>
</body>
</html>
