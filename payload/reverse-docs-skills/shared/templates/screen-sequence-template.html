<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SCREEN_LABEL}} のシーケンス図</title>
<style>
  /* TOKENS_CSS */

  :root {
    --content-max: 1320px;
    --page-gutter: clamp(20px, 4vw, 72px);
    --sidebar-width: 280px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    line-height: 1.7; color: var(--text); background: var(--bg);
  }
  .dp-page {
    display: grid; grid-template-rows: auto 1fr;
    height: 100vh; height: 100dvh; overflow: hidden;
  }
  .topbar {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 12px;
    padding: 10px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 0.95rem; }
  .brand:hover { color: var(--accent); }
  .brand-sub { font-size: 11px; font-weight: 400; color: var(--text-muted, #6c757d); }
  #theme-toggle {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-sub); cursor: pointer; padding: 4px 12px; font-family: inherit; font-size: 0.82rem;
  }
  #theme-toggle:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .header-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .dp-body { display: flex; min-height: 0; overflow: hidden; }
  .dp-sidebar {
    width: var(--sidebar-width); flex: 0 0 var(--sidebar-width);
    overflow-y: auto; padding: 18px 14px 24px;
    background: var(--panel); border-right: 1px solid var(--border);
    scrollbar-gutter: stable;
  }
  .sidebar-parent {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 10px; padding: 8px 10px;
    border-radius: var(--radius-sm); background: var(--panel-2);
    color: var(--text); font-size: 13px; font-weight: 700; line-height: 1.4;
  }
  .sidebar-parent svg { color: var(--accent); flex: 0 0 auto; }
  .sidebar-doc-nav {
    display: flex; flex-direction: column; gap: 2px;
    margin: 0 0 20px; padding: 0 0 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-doc-nav .back-link,
  .sidebar-doc-nav .nav-item {
    display: block; min-width: 0; padding: 7px 10px;
    border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-sub);
    font-size: 12.5px; line-height: 1.4; text-decoration: none;
  }
  .sidebar-doc-nav .back-link { order: 10; margin-top: 6px; color: var(--text-muted); font-size: 11.5px; }
  .sidebar-doc-nav .nav-item:hover,
  .sidebar-doc-nav .back-link:hover { background: var(--panel-2); color: var(--accent); }
  .sidebar-doc-nav .nav-item.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .toc-label {
    padding: 0 10px; margin: 0 0 8px;
    color: var(--text-muted); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .operation-list { display: flex; flex-direction: column; gap: 2px; }
  .operation-link {
    width: 100%; padding: 7px 10px; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-sub); cursor: pointer;
    font: inherit; font-size: 13px; line-height: 1.45; text-align: left;
  }
  .operation-link:hover { background: var(--panel-2); color: var(--text); }
  .operation-link.active {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .doc-main {
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto;
    padding: 32px var(--page-gutter) 96px;
  }
  .doc-inner {
    width: min(100%, var(--content-max)); margin-inline: auto;
  }
  .doc-main h1 { font-size: 1.6rem; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border-strong); color: var(--text); }
  .doc-main p.lead { margin: 0 0 20px; color: var(--text-sub); font-size: 0.95rem; }
  .diagram-wrap {
    overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--panel); margin-bottom: 20px; scrollbar-gutter: stable;
  }
  #sequence-svg { display: block; }
  .lane-label { font-size: 12px; font-weight: 700; fill: var(--text); }
  .lane-line { stroke: var(--border-strong); stroke-width: 1.5; }
  .step-arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }
  .step-arrow.return { stroke: var(--text-muted); stroke-dasharray: 5 4; }
  .step-label { font-size: 11.5px; fill: var(--text-sub); }
  .step-label.return { fill: var(--text-muted); }
  .empty-message { padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.95rem; }
  .steps-table-wrap {
    width: 100%; overflow-x: auto; border: 1px solid var(--border);
    border-radius: var(--radius-sm); scrollbar-gutter: stable;
  }
  table.steps-table {
    border-collapse: collapse; width: max-content; min-width: 100%;
    margin: 0; font-size: 0.88rem;
  }
  table.steps-table th { background: var(--panel-2); font-weight: 700; text-align: left; }
  table.steps-table th, table.steps-table td {
    min-width: 10rem; max-width: 34rem; padding: 8px 12px;
    border: 0; border-bottom: 1px solid var(--border);
    overflow-wrap: normal; word-break: normal; vertical-align: top;
  }
  table.steps-table th { white-space: nowrap; }
  table.steps-table th:first-child,
  table.steps-table td:first-child { min-width: 4.5rem; width: 4.5rem; }
  table.steps-table td.ref {
    min-width: 18rem; font-family: var(--mono); font-size: 0.82em;
    color: var(--text); background: var(--panel-2); white-space: nowrap;
  }
  .toc-toggle {
    display: none; position: fixed; bottom: 16px; right: 16px; z-index: 60;
    width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 50%;
    background: var(--panel); box-shadow: var(--shadow-md); color: var(--text);
    cursor: pointer; align-items: center; justify-content: center;
  }
  .footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
    display: flex; gap: 20px; justify-content: center;
  }
  @media (max-width: 820px) {
    .topbar { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
    .dp-sidebar { display: none; }
    .dp-sidebar.open {
      display: block; position: fixed; inset: 0 auto 0 0;
      width: min(88vw, 320px); padding: 60px 16px 16px;
      z-index: 55; box-shadow: var(--shadow-md);
    }
    .toc-toggle { display: flex; }
    .doc-main { padding: 14px 14px 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<div class="dp-page">
  <header class="topbar">
    <a class="brand" href="{{PORTAL_INDEX_HREF}}">
      <span class="brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle" role="img" aria-label="設計書"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zM13 9V3.5L18.5 9H13z"/></svg></span>
      <span class="brand-title">{{PROJECT_NAME}}</span>
      <span class="brand-sub">設計ポータル</span>
    </a>
    <div class="header-meta">
      <span class="pm-updated">更新: {{GENERATED_DATE}}{{COMMIT_SHORT}}</span>
    </div>
    <div class="top-actions">
      <button id="theme-toggle" title="テーマ切替">ライト</button>
    </div>
  </header>

  <div class="dp-body">
    <aside class="dp-sidebar" id="sidebar">
      <div class="sidebar-parent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="画面"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm1 2h10v2H7V8zm0 4h6v2H7v-2z"/></svg>
        <span>画面 / {{SCREEN_LABEL}}</span>
      </div>
      <nav class="sidebar-doc-nav" aria-label="画面設計書">{{DOC_NAV}}</nav>
      <div class="toc-label" id="operation-label">操作</div>
      <div class="operation-list" id="operation-list"></div>
    </aside>

    <main class="doc-main">
      <div class="doc-inner">
        <h1>{{SCREEN_LABEL}} のシーケンス図</h1>
        <p class="lead">左の操作メニューを選ぶと、画面 → API → テーブルの呼び出し順序を表示する。</p>

        <div class="diagram-wrap">
          <svg id="sequence-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{SCREEN_LABEL}}の操作シーケンス"></svg>
        </div>

        <div class="steps-table-wrap" id="steps-table-wrap">
          <table class="steps-table" id="steps-table">
            <thead>
              <tr><th>順序</th><th>区間</th><th>内容</th><th>根拠</th></tr>
            </thead>
            <tbody id="steps-table-body"></tbody>
          </table>
        </div>

        <div class="empty-message" id="empty-message" style="display:none">操作データなし</div>
      </div>
    </main>
  </div>
</div>

<button class="toc-toggle" id="tocToggle" aria-label="メニューを開閉" aria-controls="sidebar" aria-expanded="false">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="メニュー"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
</button>

<script type="application/json" id="page-data">
{{PAGE_DATA_JSON}}
</script>

<script>
(function () {
  var LANES = ['screen', 'api', 'table'];
  var LANE_LABELS = { screen: '画面', api: 'API', table: 'テーブル' };
  var LANE_PITCH = 240;
  var LANE_MARGIN = 90;
  var ROW_HEIGHT = 56;
  var TOP_PADDING = 46;
  var BOTTOM_PADDING = 24;

  var raw = document.getElementById('page-data').textContent;
  var data = {};
  try { data = JSON.parse(raw); } catch (e) { data = { operations: [] }; }
  var operations = data.operations || [];

  var operationList = document.getElementById('operation-list');
  var operationLabel = document.getElementById('operation-label');
  var svg = document.getElementById('sequence-svg');
  var tbody = document.getElementById('steps-table-body');
  var emptyMsg = document.getElementById('empty-message');
  var diagramWrap = document.querySelector('.diagram-wrap');
  var tableWrap = document.getElementById('steps-table-wrap');

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function laneX(laneKey) {
    var idx = LANES.indexOf(laneKey);
    if (idx === -1) idx = 0;
    return LANE_MARGIN + idx * LANE_PITCH;
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) { el.setAttribute(k, attrs[k]); }
    return el;
  }

  function renderOperation(op, activeIndex) {
    svg.innerHTML = '';
    tbody.innerHTML = '';

    var steps = (op && op.steps) || [];
    var height = TOP_PADDING + steps.length * ROW_HEIGHT + BOTTOM_PADDING;
    var width = LANE_MARGIN * 2 + (LANES.length - 1) * LANE_PITCH;

    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);

    var defs = svgEl('defs', {});
    var marker = svgEl('marker', {
      id: 'seq-arrowhead', viewBox: '0 0 10 10', refX: 9, refY: 5,
      markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'
    });
    var arrowPath = svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--accent)' });
    marker.appendChild(arrowPath);
    defs.appendChild(marker);
    svg.appendChild(defs);

    // レーン縦線 + ラベル
    LANES.forEach(function (laneKey) {
      var x = laneX(laneKey);
      var line = svgEl('line', {
        x1: x, y1: TOP_PADDING - 20, x2: x, y2: height - BOTTOM_PADDING + 6,
        class: 'lane-line'
      });
      svg.appendChild(line);
      var label = svgEl('text', { x: x, y: TOP_PADDING - 28, class: 'lane-label', 'text-anchor': 'middle' });
      label.textContent = LANE_LABELS[laneKey] || laneKey;
      svg.appendChild(label);
    });

    // ステップ矢印
    steps.forEach(function (step, i) {
      var y = TOP_PADDING + i * ROW_HEIGHT + ROW_HEIGHT / 2;
      var x1 = laneX(step.from);
      var x2 = laneX(step.to);
      var isReturn = step.kind === 'return';

      if (x1 === x2) {
        // 自己ループ（同一レーン内の呼び出し）
        var loopPath = svgEl('path', {
          d: 'M ' + x1 + ' ' + (y - 10) + ' q 36 0 0 20',
          class: 'step-arrow' + (isReturn ? ' return' : ''),
          'marker-end': 'url(#seq-arrowhead)'
        });
        svg.appendChild(loopPath);
      } else {
        var line = svgEl('line', {
          x1: x1, y1: y, x2: x2, y2: y,
          class: 'step-arrow' + (isReturn ? ' return' : ''),
          'marker-end': 'url(#seq-arrowhead)'
        });
        svg.appendChild(line);
      }

      var midX = (x1 + x2) / 2;
      var text = svgEl('text', {
        x: midX, y: y - 8, class: 'step-label' + (isReturn ? ' return' : ''),
        'text-anchor': 'middle'
      });
      text.textContent = (step.seq != null ? step.seq + '. ' : '') + (step.label || '');
      svg.appendChild(text);
    });

    // steps 一覧表
    steps.forEach(function (step) {
      var tr = document.createElement('tr');
      var fromLabel = LANE_LABELS[step.from] || step.from;
      var toLabel = LANE_LABELS[step.to] || step.to;
      var refCell = step.sourceRef ? escHtml(step.sourceRef) : '';
      tr.innerHTML =
        '<td>' + escHtml(step.seq) + '</td>' +
        '<td>' + escHtml(fromLabel) + ' → ' + escHtml(toLabel) + (step.kind === 'return' ? '（応答）' : '') + '</td>' +
        '<td>' + escHtml(step.label) + '</td>' +
        '<td class="ref">' + refCell + '</td>';
      tbody.appendChild(tr);
    });
    Array.prototype.forEach.call(operationList.querySelectorAll('.operation-link'), function (button, index) {
      var active = index === activeIndex;
      button.classList.toggle('active', active);
      button.setAttribute('aria-current', active ? 'true' : 'false');
    });
  }

  if (!operations.length) {
    if (diagramWrap) diagramWrap.style.display = 'none';
    if (tableWrap) tableWrap.style.display = 'none';
    if (operationLabel) operationLabel.style.display = 'none';
    emptyMsg.style.display = 'block';
  } else {
    operations.forEach(function (op, i) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'operation-link';
      button.textContent = op.label || op.key || ('操作' + (i + 1));
      button.addEventListener('click', function () {
        renderOperation(operations[i], i);
        var sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.remove('open');
        var toggle = document.getElementById('tocToggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      });
      operationList.appendChild(button);
    });
    renderOperation(operations[0], 0);
  }
})();
</script>

<script>
(function () {
  var tocToggle = document.getElementById('tocToggle');
  if (tocToggle) {
    tocToggle.addEventListener('click', function () {
      var sidebar = document.getElementById('sidebar');
      if (!sidebar) return;
      var isOpen = sidebar.classList.toggle('open');
      tocToggle.setAttribute('aria-expanded', String(isOpen));
    });
  }

  var themeBtn = document.getElementById('theme-toggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var r = document.documentElement;
      var next = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      r.setAttribute('data-theme', next);
      themeBtn.textContent = next === 'dark' ? 'ダーク' : 'ライト';
      try { localStorage.setItem('rd-portal-theme', next); } catch (e) {}
    });
  }
  try {
    var saved = localStorage.getItem('rd-portal-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      var tb = document.getElementById('theme-toggle');
      if (tb) tb.textContent = saved === 'dark' ? 'ダーク' : 'ライト';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
