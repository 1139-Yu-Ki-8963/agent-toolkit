<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SCREEN_LABEL}} のシーケンス図</title>
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

/* 画面ナビ + 操作一覧（2 カラム） */
.dp-layout { display: grid; grid-template-columns: 200px 1fr; gap: 36px; margin-top: 28px; align-items: start; }
.dp-toc { position: sticky; top: 24px; border-left: 1.5px solid var(--line2); padding-left: 16px; }

.sidebar-parent { margin: 0 0 10px; padding: 0 2px; color: var(--text); font-size: 13px; font-weight: 700; line-height: 1.4; }
.sidebar-doc-nav {
  display: flex; flex-direction: column; gap: 2px;
  margin: 0 0 20px; padding: 0 0 14px;
  border-bottom: 1px solid var(--line);
}
.sidebar-doc-nav .back-link,
.sidebar-doc-nav .nav-item {
  display: block; min-width: 0; padding: 6px 10px;
  border: 0; border-left: 3px solid transparent;
  background: transparent; color: var(--sub);
  font-size: 12.5px; line-height: 1.4; text-decoration: none;
}
.sidebar-doc-nav .back-link { order: 10; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
.sidebar-doc-nav .nav-item:hover,
.sidebar-doc-nav .back-link:hover { color: var(--accent); border-left-color: var(--accent); }
.sidebar-doc-nav .nav-item.active { color: var(--accent); border-left-color: var(--accent); font-weight: 700; }

.toc-label {
  font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 8px; padding: 0 2px;
}
.operation-list { display: flex; flex-direction: column; gap: 2px; }
.operation-link {
  width: 100%; padding: 7px 10px; border: 0; border-left: 3px solid transparent;
  background: transparent; color: var(--sub); cursor: pointer;
  font: inherit; font-size: 13px; line-height: 1.45; text-align: left;
}
.operation-link:hover { color: var(--text); border-left-color: var(--accent); }
.operation-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 700; }

/* 図解本体 */
.dp-seq-main { min-width: 0; }
.dp-seq-main p.lead { margin: 0 0 20px; color: var(--sub); font-size: 13.5px; }
.diagram-wrap {
  overflow-x: auto; border: 1.5px solid var(--line2);
  background: var(--panel); margin-bottom: 20px; scrollbar-gutter: stable;
}
#sequence-svg { display: block; }
.lane-label { font-size: 12px; font-weight: 700; fill: var(--text); }
.lane-node { fill: var(--panel3); stroke: var(--line2); stroke-width: 1.5; }
.lane-node-shadow { fill: var(--accent-soft); }
.lane-line { stroke: var(--line2); stroke-width: 1.5; }
.step-arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.step-arrow.return { stroke: var(--muted); stroke-dasharray: 5 4; }
.step-label { font-size: 11.5px; fill: var(--sub); }
.step-label.return { fill: var(--muted); }
.empty-message { padding: 24px; text-align: center; color: var(--muted); font-size: 0.95rem; }
.steps-table-wrap {
  width: 100%; overflow-x: auto; border: 1.5px solid var(--line2); scrollbar-gutter: stable;
}
table.steps-table {
  border-collapse: collapse; width: max-content; min-width: 100%;
  margin: 0; font-size: 0.88rem; background: var(--panel);
}
table.steps-table th { background: var(--head); color: var(--headtext); font-weight: 700; text-align: left; }
table.steps-table th, table.steps-table td {
  min-width: 10rem; max-width: 34rem; padding: 8px 12px;
  border: 0; border-bottom: 1px solid var(--line);
  overflow-wrap: normal; word-break: normal; vertical-align: top;
}
table.steps-table th { white-space: nowrap; }
table.steps-table th:first-child,
table.steps-table td:first-child { min-width: 4.5rem; width: 4.5rem; }
table.steps-table td.ref {
  min-width: 18rem; font-family: var(--mono); font-size: 0.82em;
  color: var(--accent); background: var(--panel3); white-space: nowrap;
}

@media (max-width: 820px) {
  .dp-layout { grid-template-columns: 1fr; margin-top: 20px; }
  .dp-toc { position: static; border-left: 0; padding-left: 0; margin-bottom: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .operation-link, .sidebar-doc-nav .nav-item, .sidebar-doc-nav .back-link { transition: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main" id="main-scroll">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{PORTAL_INDEX_HREF}}">TOP</a> ／ 一覧・設計図 ／ <span class="pt-crumb-current">{{SCREEN_LABEL}} のシーケンス図</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title">{{SCREEN_LABEL}} のシーケンス図</h1>
        </div>
      </div>

      <div class="dp-layout">
        <aside class="dp-toc" id="sidebar">
          <div class="sidebar-parent">
            <span>画面 / {{SCREEN_LABEL}}</span>
          </div>
          <nav class="sidebar-doc-nav" aria-label="画面設計書">{{DOC_NAV}}</nav>
          <div class="toc-label" id="operation-label">操作</div>
          <div class="operation-list" id="operation-list"></div>
        </aside>

        <div class="dp-seq-main">
          <p class="lead">左の操作メニューを選ぶと、画面 → API → テーブルの呼び出し順序を表示する。</p>

          <div class="diagram-wrap">
            <svg id="sequence-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{SCREEN_LABEL}}の操作シーケンス"></svg>
          </div>

          <div class="steps-table-wrap" id="steps-table-wrap">
            <table class="steps-table" id="steps-table">
              <thead>
                <tr><th>順序</th><th>区間</th><th>内容</th><th>根拠</th></tr>
              </thead>
              <tbody id="steps-table-body"></tbody>
            </table>
          </div>

          <div class="empty-message" id="empty-message" style="display:none">操作データなし</div>
        </div>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="page-data">
{{PAGE_DATA_JSON}}
</script>

<script>
(function () {
  var LANES = ['screen', 'api', 'table'];
  var LANE_LABELS = { screen: '画面', api: 'API', table: 'テーブル' };
  var LANE_PITCH = 240;
  var LANE_MARGIN = 90;
  var ROW_HEIGHT = 56;
  var TOP_PADDING = 46;
  var BOTTOM_PADDING = 24;
  var NODE_W = 100;
  var NODE_H = 28;
  var NODE_Y = 4;

  var raw = document.getElementById('page-data').textContent;
  var data = {};
  try { data = JSON.parse(raw); } catch (e) { data = { operations: [] }; }
  var operations = data.operations || [];

  var operationList = document.getElementById('operation-list');
  var operationLabel = document.getElementById('operation-label');
  var svg = document.getElementById('sequence-svg');
  var tbody = document.getElementById('steps-table-body');
  var emptyMsg = document.getElementById('empty-message');
  var diagramWrap = document.querySelector('.diagram-wrap');
  var tableWrap = document.getElementById('steps-table-wrap');

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function laneX(laneKey) {
    var idx = LANES.indexOf(laneKey);
    if (idx === -1) idx = 0;
    return LANE_MARGIN + idx * LANE_PITCH;
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) { el.setAttribute(k, attrs[k]); }
    return el;
  }

  function renderOperation(op, activeIndex) {
    svg.innerHTML = '';
    tbody.innerHTML = '';

    var steps = (op && op.steps) || [];
    var height = TOP_PADDING + steps.length * ROW_HEIGHT + BOTTOM_PADDING;
    var width = LANE_MARGIN * 2 + (LANES.length - 1) * LANE_PITCH;

    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);

    var defs = svgEl('defs', {});
    var marker = svgEl('marker', {
      id: 'seq-arrowhead', viewBox: '0 0 10 10', refX: 9, refY: 5,
      markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'
    });
    var arrowPath = svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--accent)' });
    marker.appendChild(arrowPath);
    defs.appendChild(marker);
    svg.appendChild(defs);

    // レーン見出し（ノード）+ 縦線
    LANES.forEach(function (laneKey) {
      var x = laneX(laneKey);
      var boxX = x - NODE_W / 2;

      var shadow = svgEl('rect', { x: boxX + 3, y: NODE_Y + 3, width: NODE_W, height: NODE_H, class: 'lane-node-shadow' });
      svg.appendChild(shadow);
      var node = svgEl('rect', { x: boxX, y: NODE_Y, width: NODE_W, height: NODE_H, class: 'lane-node' });
      svg.appendChild(node);

      var label = svgEl('text', { x: x, y: NODE_Y + NODE_H / 2 + 4, class: 'lane-label', 'text-anchor': 'middle' });
      label.textContent = LANE_LABELS[laneKey] || laneKey;
      svg.appendChild(label);

      var line = svgEl('line', {
        x1: x, y1: NODE_Y + NODE_H + 6, x2: x, y2: height - BOTTOM_PADDING + 6,
        class: 'lane-line'
      });
      svg.appendChild(line);
    });

    // ステップ矢印
    steps.forEach(function (step, i) {
      var y = TOP_PADDING + i * ROW_HEIGHT + ROW_HEIGHT / 2;
      var x1 = laneX(step.from);
      var x2 = laneX(step.to);
      var isReturn = step.kind === 'return';

      if (x1 === x2) {
        // 自己ループ（同一レーン内の呼び出し）
        var loopPath = svgEl('path', {
          d: 'M ' + x1 + ' ' + (y - 10) + ' q 36 0 0 20',
          class: 'step-arrow' + (isReturn ? ' return' : ''),
          'marker-end': 'url(#seq-arrowhead)'
        });
        svg.appendChild(loopPath);
      } else {
        var line = svgEl('line', {
          x1: x1, y1: y, x2: x2, y2: y,
          class: 'step-arrow' + (isReturn ? ' return' : ''),
          'marker-end': 'url(#seq-arrowhead)'
        });
        svg.appendChild(line);
      }

      var midX = (x1 + x2) / 2;
      var text = svgEl('text', {
        x: midX, y: y - 8, class: 'step-label' + (isReturn ? ' return' : ''),
        'text-anchor': 'middle'
      });
      text.textContent = (step.seq != null ? step.seq + '. ' : '') + (step.label || '');
      svg.appendChild(text);
    });

    // steps 一覧表
    steps.forEach(function (step) {
      var tr = document.createElement('tr');
      var fromLabel = LANE_LABELS[step.from] || step.from;
      var toLabel = LANE_LABELS[step.to] || step.to;
      var refCell = step.sourceRef ? escHtml(step.sourceRef) : '';
      tr.innerHTML =
        '<td>' + escHtml(step.seq) + '</td>' +
        '<td>' + escHtml(fromLabel) + ' → ' + escHtml(toLabel) + (step.kind === 'return' ? '（応答）' : '') + '</td>' +
        '<td>' + escHtml(step.label) + '</td>' +
        '<td class="ref">' + refCell + '</td>';
      tbody.appendChild(tr);
    });
    Array.prototype.forEach.call(operationList.querySelectorAll('.operation-link'), function (button, index) {
      var active = index === activeIndex;
      button.classList.toggle('active', active);
      button.setAttribute('aria-current', active ? 'true' : 'false');
    });
  }

  if (!operations.length) {
    if (diagramWrap) diagramWrap.style.display = 'none';
    if (tableWrap) tableWrap.style.display = 'none';
    if (operationLabel) operationLabel.style.display = 'none';
    emptyMsg.style.display = 'block';
  } else {
    operations.forEach(function (op, i) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'operation-link';
      button.textContent = op.label || op.key || ('操作' + (i + 1));
      button.addEventListener('click', function () {
        renderOperation(operations[i], i);
      });
      operationList.appendChild(button);
    });
    renderOperation(operations[0], 0);
  }
})();
</script>
</body>
</html>
