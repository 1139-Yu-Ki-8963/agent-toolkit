            "excerpt": "export function sortItemsByKey<T extends SortableItem>(\n  items: T[],\n  key: string,\n  direction: SortDirection,\n): T[] {\n  const sorted = [...items].sort((a, b) => {\n    const left = a[key];\n    const right = b[key];\n    if (left === right) {\n      return 0;\n    }\n    return left > right ? 1 : -1;\n  });\n  return direction === SortDirection.Desc ? sorted.reverse() : sorted;\n}",
