<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — 設計ポータル</title>
<!-- T2 semantic glossary. build-detail-page.shだけがプレースホルダを置換する。 -->
<style>
/* TOKENS_CSS */
/* SHELL_CSS */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
.dp-controls { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:24px 0 12px; }
.dp-controls .pt-input { flex:1; min-width:260px; }
.filter-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-bottom:12px; }
.filter-set { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
.filter-label,.sec-label { color:var(--muted); font:600 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
.chip { border:1px solid var(--line2); background:var(--panel); color:var(--sub); padding:5px 12px; font:inherit; font-size:12px; cursor:pointer; }
.chip:hover,.chip:focus-visible { border-color:var(--accent); color:var(--accent); }
.chip.active { border-color:var(--accent); background:var(--accent); color:var(--chipontext); font-weight:700; }
.registry-note { margin:0 0 12px; border-left:4px solid var(--accent); background:var(--panel3); color:var(--sub); padding:9px 12px; font-size:12px; }
.dp-tablewrap { flex:1; min-height:0; overflow-x:auto; border:1px solid var(--line2); }
#dict-table { min-width:2380px; table-layout:fixed; }
#dict-table th { white-space:nowrap; }
#dict-table td { vertical-align:top; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#dict-table th:nth-child(1),#dict-table td:nth-child(1) { width:130px; }
#dict-table th:nth-child(2),#dict-table td:nth-child(2) { width:150px; }
#dict-table th:nth-child(3),#dict-table td:nth-child(3) { width:150px; }
#dict-table th:nth-child(4),#dict-table td:nth-child(4) { width:470px; }
#dict-table th:nth-child(5),#dict-table td:nth-child(5) { width:130px; }
#dict-table th:nth-child(6),#dict-table td:nth-child(6) { width:100px; }
#dict-table th:nth-child(7),#dict-table td:nth-child(7) { width:150px; }
#dict-table th:nth-child(8),#dict-table td:nth-child(8) { width:120px; }
#dict-table th:nth-child(9),#dict-table td:nth-child(9) { width:150px; }
#dict-table th:nth-child(10),#dict-table td:nth-child(10) { width:150px; }
#dict-table th:nth-child(11),#dict-table td:nth-child(11) { width:150px; }
#dict-table th:nth-child(12),#dict-table td:nth-child(12) { width:200px; }
#dict-table th:nth-child(13),#dict-table td:nth-child(13) { width:110px; }
#dict-table th:nth-child(14),#dict-table td:nth-child(14) { width:220px; }
#dict-table td:nth-child(4),#dict-table td:nth-child(12),#dict-table td:nth-child(14) { overflow:hidden; text-overflow:ellipsis; white-space:normal; overflow-wrap:anywhere; display:-webkit-box; line-clamp:4; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
#dict-table tbody tr[data-interactive="true"] { cursor:pointer; }
#dict-table tbody tr[data-interactive="true"]:hover td,#dict-table tbody tr[aria-selected="true"] td { background:var(--panel3); }
#dict-table tbody tr:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
#dict-table code { color:var(--accent); font:11.5px var(--mono); }
.term-label { font-weight:700; }
.meaning-key { display:block; border-left:4px solid var(--accent); padding:2px 0 2px 8px; color:var(--accent); font:600 11.5px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.meaning-key.unmigrated { border-left-color:var(--muted); color:var(--muted); }
.meaning-key.deprecated { border-left-color:var(--warning,var(--accent)); }
.kind { font-weight:650; }
.category { margin-top:3px; color:var(--muted); font-size:11px; }
.state { display:inline-block; border:1px solid var(--line2); padding:2px 7px; white-space:nowrap; font-size:11px; }
.state.active { border-color:var(--success,var(--accent)); }
.state.deprecated { border-color:var(--warning,var(--accent)); }
.state.retired,.state.unmigrated { color:var(--muted); }
.successor { display:block; margin-top:4px; color:var(--muted); font:10.5px var(--mono); }
.note-box { margin:14px 0 0; border:1px solid var(--line2); background:var(--panel3); color:var(--sub); padding:10px 14px; font-size:12.5px; }
#unresolved-mount,.related-entities { flex:none; }
.drawer-scrim { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.46); }
.drawer-scrim.is-open { display:block; }
.drawer { position:fixed; z-index:101; top:0; right:0; bottom:0; width:min(460px,44vw); overflow:auto; transform:translateX(105%); transition:transform .18s ease; border-left:1px solid var(--line2); background:var(--panel); box-shadow:-7px 0 0 var(--accent-soft); }
.drawer.is-open { transform:translateX(0); }
.drawer-head { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; gap:16px; padding:22px; border-bottom:1px solid var(--line2); background:var(--panel); }
.drawer-head h2 { margin:3px 0 0; font-size:19px; }
.drawer-close { flex:none; width:34px; height:34px; border:1px solid var(--line2); background:var(--panel3); color:var(--text); cursor:pointer; }
.drawer-body { padding:18px 22px 34px; }
.drawer-definition { margin:0 0 14px; color:var(--sub); }
.detail-group { padding:13px 0; border-top:1px solid var(--line2); }
.detail-group h3 { margin:0 0 8px; color:var(--muted); font:600 11px var(--mono); letter-spacing:.08em; }
.detail-group ul { margin:0; padding-left:18px; }
.detail-group li { margin:4px 0; overflow-wrap:anywhere; }
[hidden] { display:none !important; }
@media (max-width:760px) {
  .dp-controls .pt-input { min-width:0; width:100%; flex-basis:100%; }
  .filter-set { flex-wrap:nowrap; max-width:100%; overflow-x:auto; padding-bottom:3px; }
  .chip { flex:none; white-space:nowrap; }
  .drawer { width:100vw; max-width:none; }
}
@media (prefers-reduced-motion:reduce) { .drawer { transition:none; } }
</style>
</head>
<body>
<div class="pt" id="dictionary-background">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main is-fixed">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{BACK_LINK}}">TOP</a> ／ {{ACTIVE_CATEGORY_LABEL}} ／ <span class="pt-crumb-current">{{TITLE}}</span></div>
        <div class="pt-title-row"><h1 class="pt-title">{{TITLE}}</h1><span class="pt-title-sub">{{DESCRIPTION}}</span></div>
      </div>
      <div class="dp-controls">
        <input type="search" id="term-search" class="pt-input" aria-label="用語辞書を検索" placeholder="内容要約キー・日本語名・英語名・定義・各実装名で絞り込み">
        <span class="pt-count" id="term-count" aria-live="polite"></span>
      </div>
      <div class="filter-bar">
        <div class="filter-set"><span class="filter-label">分類</span><span id="category-chips"></span></div>
        <div class="filter-set"><span class="filter-label">状態</span><span id="status-chips"></span></div>
      </div>
      <p class="registry-note">内容要約キーは業務概念を一意に示します。コード名・型名・DB名・API名・UI表示名を分離して管理し、解析候補は承認されるまで表示しません。</p>
      <div class="sec-label">承認済み用語</div>
      <div class="pt-tablewrap dp-tablewrap">
        <table id="dict-table">
          <thead><tr><th>内容要約キー</th><th>日本語名</th><th>英語名</th><th>定義</th><th>適用範囲</th><th>分類</th><th>コード名</th><th>型名</th><th>DB名</th><th>API名</th><th>UI表示名</th><th>許容値</th><th>状態</th><th>備考</th></tr></thead>
          <tbody id="dict-table-body"></tbody>
        </table>
      </div>
      <div id="diagnostics-mount"></div>
      <!--RELATED_ENTITIES--><div id="unresolved-mount"></div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>
<div class="drawer-scrim" id="drawer-scrim" aria-hidden="true"></div>
<aside class="drawer" id="term-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" tabindex="-1" hidden>
  <div class="drawer-head"><div><div class="filter-label">承認済み用語の詳細</div><h2 id="drawer-title"></h2><div id="drawer-key" class="meaning-key"></div></div><button type="button" class="drawer-close" id="drawer-close" aria-label="詳細を閉じる"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></div>
  <div class="drawer-body"><p class="drawer-definition" id="drawer-definition"></p><div id="drawer-groups"></div></div>
</aside>
<script type="application/json" id="page-data">
{{PAGE_DATA_JSON}}
</script>
<script>
(function() {
  'use strict';
  var data = JSON.parse(document.getElementById('page-data').textContent);
  var projectionLegacy = data.projectionVersion === '0.1';
  var stateLabels = {active:'現行',deprecated:'非推奨',retired:'履歴',unmigrated:'未移行'};
  var categoryLabels = {entity:'エンティティ',attribute:'属性',value:'値',process:'プロセス',event:'イベント',role:'役割',rule:'ルール',metric:'指標'};
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(key) { node.setAttribute(key, String(attrs[key])); });
    (Array.isArray(children) ? children : [children]).forEach(function(child) {
      if (child === null || child === undefined) return;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }
  function values(value) { return Array.isArray(value) ? value : []; }
  function normalize(term) {
    if (Object.prototype.hasOwnProperty.call(term, 'term_ja')) return term;
    if (Object.prototype.hasOwnProperty.call(term, 'term')) {
      return {key:'',term_ja:term.term||'',term_en:'',definition:term.definition||'',scope:'',category:term.category||'',code_name:values(term.codeRefs)[0]||'',type_name:'',db_name:'',api_name:'',ui_label:term.term||'',allowed_values:[],status:'unmigrated',notes:term.sourceRef||'',representations:values(term.codeRefs).map(function(ref){return {channel:'code',value:String(ref),location:''};}),sourceRefs:term.sourceRef?[term.sourceRef]:[],aliases:[],forbiddenTerms:[],relations:[],examples:[],counterExamples:[],constraints:[],securityClassification:'未設定'};
    }
    if (projectionLegacy) {
      return {key:term.key||'',term_ja:term.label||'',term_en:'',definition:term.definition||'',scope:typeof term.scope==='string'?term.scope:'',category:term.category||term.kind||'',code_name:values(term.representations)[0]&&values(term.representations)[0].value||'',type_name:'',db_name:'',api_name:'',ui_label:term.label||'',allowed_values:[],status:term.status||'unmigrated',notes:'',representations:values(term.representations),sourceRefs:values(term.sourceRefs),aliases:values(term.aliases),forbiddenTerms:values(term.forbiddenTerms),relations:values(term.relations),examples:values(term.examples),counterExamples:values(term.counterExamples),constraints:values(term.constraints),securityClassification:term.securityClassification||'未設定'};
    }
    return term;
  }
  var terms = values(data.terms).map(normalize);
  var activeCategory = 'all', activeStatus = 'normal', lastTrigger = null;
  function addList(cell, list, limit) {
    values(list).slice(0, limit || list.length).forEach(function(item, index) { if (index) cell.appendChild(document.createTextNode(' · ')); cell.appendChild(el('code', null, String(item))); });
  }
  function renderButtons(mount, choices, active, onSelect) {
    clear(mount);
    choices.forEach(function(choice) {
      var button = el('button',{type:'button',class:'chip' + (choice.key === active ? ' active' : ''),'aria-pressed':choice.key === active},choice.label);
      button.addEventListener('click',function(){onSelect(choice.key);}); mount.appendChild(button);
    });
  }
  function categoryChoices() {
    var fromData = values(data.categories).map(function(category){return {key:category.key,label:category.label || categoryLabels[category.key] || category.key};});
    return [{key:'all',label:'すべて'}].concat(fromData);
  }
  function renderFilters() {
    renderButtons(document.getElementById('category-chips'),categoryChoices(),activeCategory,function(key){activeCategory=key === activeCategory && key !== 'all' ? 'all' : key;renderFilters();renderRows();});
    renderButtons(document.getElementById('status-chips'),[{key:'normal',label:'通常'},{key:'active',label:'現行'},{key:'deprecated',label:'非推奨'},{key:'unmigrated',label:'未移行'},{key:'retired',label:'履歴'}],activeStatus,function(key){activeStatus=key === activeStatus && key !== 'normal' ? 'normal' : key;renderFilters();renderRows();});
  }
  function visibleTerms() {
    var query = document.getElementById('term-search').value.trim().toLowerCase();
    return terms.filter(function(term) {
      var stateOk = activeStatus === 'normal' ? term.status !== 'retired' : term.status === activeStatus;
      var categoryOk = activeCategory === 'all' || term.category === activeCategory;
      var haystack = [term.key,term.term_ja,term.term_en,term.definition,term.scope,term.category,term.code_name,term.type_name,term.db_name,term.api_name,term.ui_label,values(term.allowed_values).join(' '),term.status,term.notes].concat(values(term.representations).map(function(rep){return rep.value;})).join(' ').toLowerCase();
      return stateOk && categoryOk && (!query || haystack.indexOf(query) !== -1);
    });
  }
  function formatForbidden(entry) { return typeof entry === 'string' ? entry : (entry.term || '') + (entry.reason ? ' — ' + entry.reason : ''); }
  function formatRepresentation(rep) { return [rep.channel,rep.value,rep.location].filter(Boolean).join(': '); }
  function formatRelation(relation) { return typeof relation === 'string' ? relation : [relation.type,relation.targetKey || relation.target_key].filter(Boolean).join(': '); }
  function openDrawer(term, trigger) {
    lastTrigger = trigger;
    document.getElementById('drawer-title').textContent = term.term_ja;
    document.getElementById('drawer-definition').textContent = term.definition;
    var key = document.getElementById('drawer-key'); key.textContent = term.key || '未移行'; key.className = 'meaning-key ' + (!term.key ? 'unmigrated' : term.status === 'deprecated' ? 'deprecated' : '');
    var groups = document.getElementById('drawer-groups'); clear(groups);
    var examples = values(term.examples).map(function(item){return '例: ' + item;}).concat(values(term.counterExamples).map(function(item){return '反例: ' + item;}));
    var details = [
      {key:'aliases',label:'別名',items:values(term.aliases)},
      {key:'forbidden',label:'禁止語',items:values(term.forbiddenTerms).map(formatForbidden)},
      {key:'representations',label:'全representations',items:values(term.representations).map(formatRepresentation)},
      {key:'relations',label:'relations',items:values(term.relations).map(formatRelation)},
      {key:'examples',label:'例 / 反例',items:examples},
      {key:'constraints',label:'constraints',items:values(term.constraints)},
      {key:'security',label:'security',items:[term.securityClassification || term.security || '未設定']},
      {key:'evidence',label:'全根拠',items:values(term.sourceRefs).concat(term.notes ? [term.notes] : [])}
    ];
    details.forEach(function(detail){var list=el('ul');(detail.items.length?detail.items:['なし']).forEach(function(item){list.appendChild(el('li',null,String(item)));});groups.appendChild(el('section',{class:'detail-group','data-group':detail.key},[el('h3',null,detail.label),list]));});
    var drawer=document.getElementById('term-drawer'),background=document.getElementById('dictionary-background'); drawer.hidden=false; drawer.classList.add('is-open'); drawer.setAttribute('aria-hidden','false'); document.getElementById('drawer-scrim').classList.add('is-open'); background.inert=true; background.setAttribute('aria-hidden','true'); document.getElementById('drawer-close').focus();
  }
  function closeDrawer() { var drawer=document.getElementById('term-drawer'); if(drawer.hidden)return; drawer.classList.remove('is-open');drawer.hidden=true;drawer.setAttribute('aria-hidden','true');document.getElementById('drawer-scrim').classList.remove('is-open');var background=document.getElementById('dictionary-background');background.inert=false;background.removeAttribute('aria-hidden');if(lastTrigger){lastTrigger.setAttribute('aria-expanded','false');lastTrigger.setAttribute('aria-selected','false');lastTrigger.focus();} }
  function trapDrawerFocus(event) { if(event.key!=='Tab')return;var nodes=Array.prototype.slice.call(document.getElementById('term-drawer').querySelectorAll('button:not([disabled]),[href],[tabindex]:not([tabindex="-1"])'));if(!nodes.length)return;var first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();} }
  function renderRows() {
    var body=document.getElementById('dict-table-body'),list=visibleTerms();clear(body);
    if(!list.length){body.appendChild(el('tr',null,el('td',{colspan:'15'},'なし')));}
    list.forEach(function(term){
      var keyValue=term.key||'未移行',allowed=el('td');addList(allowed,values(term.allowed_values));
      var status=el('td');status.appendChild(el('span',{class:'state '+term.status},stateLabels[term.status]||term.status));if(term.replacementKey)status.appendChild(el('span',{class:'successor'},'後継: '+term.replacementKey));
      var row=el('tr',{tabindex:'0',role:'button','aria-controls':'term-drawer','aria-expanded':'false','aria-selected':'false','data-interactive':'true'},[el('td',null,el('span',{class:'meaning-key '+(!term.key?'unmigrated':term.status==='deprecated'?'deprecated':'')},keyValue)),el('td',{class:'term-label'},term.term_ja||'—'),el('td',null,term.term_en||'—'),el('td',null,term.definition||'—'),el('td',null,term.scope||'—'),el('td',null,categoryLabels[term.category]||term.category||'—'),el('td',null,el('code',null,term.code_name||'—')),el('td',null,el('code',null,term.type_name||'—')),el('td',null,el('code',null,term.db_name||'—')),el('td',null,el('code',null,term.api_name||'—')),el('td',null,term.ui_label||'—'),allowed,status,el('td',null,term.notes||'—')]);
      function activate(){Array.prototype.forEach.call(body.querySelectorAll('tr'),function(item){item.setAttribute('aria-selected',String(item===row));item.setAttribute('aria-expanded',String(item===row));});openDrawer(term,row);}
      row.addEventListener('click',activate);row.addEventListener('keydown',function(event){if(event.key === 'Enter' || event.key === ' '){event.preventDefault();activate();}});body.appendChild(row);
    });
    document.getElementById('term-count').textContent=list.length+' / '+terms.length+' 件';
  }
  function diagnostic(mount,entry,label){if(!entry)return;mount.appendChild(el(entry.warning?'div':'p',{class:entry.warning?'pt-callout pt-callout--warning':'note-box'},label+' '+(entry.count||0)+' / '+(entry.total||0)+' 件'));}
  var diagnostics=data.diagnostics||{},diagMount=document.getElementById('diagnostics-mount');diagnostic(diagMount,diagnostics.missingSource,'欠落した採録源');diagnostic(diagMount,diagnostics.unimplementedLayer,'未実施の層');
  if(values(data.unresolved).length){var unresolvedMount=document.getElementById('unresolved-mount'),box=el('div',{class:'note-box'});values(data.unresolved).forEach(function(item){box.appendChild(el('div',null,(item.label||'')+'（'+(item.reason||'')+'）'));});unresolvedMount.appendChild(el('div',{class:'sec-label'},'未解決'));unresolvedMount.appendChild(box);}
  document.getElementById('term-search').addEventListener('input',renderRows);document.getElementById('drawer-close').addEventListener('click',closeDrawer);document.getElementById('drawer-scrim').addEventListener('click',closeDrawer);document.getElementById('term-drawer').addEventListener('keydown',trapDrawerFocus);document.addEventListener('keydown',function(event){if(event.key === 'Escape')closeDrawer();});
  renderFilters();renderRows();
}());
</script>
</body>
</html>
