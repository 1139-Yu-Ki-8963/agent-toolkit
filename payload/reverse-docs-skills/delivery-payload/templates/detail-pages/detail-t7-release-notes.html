<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — 設計ポータル</title>
<!--
  detail-pages T7 リリースノート型テンプレート — 設計スキル群
  生成: generation-engine/scripts/detail-pages/build-detail-page.sh
  プレースホルダ置換は build-detail-page.sh の render_template() が行う。
  手作業によるプレースホルダ置換は禁止。生成は必ずスクリプト経由で行う。

  保守注記: トークン・共通シェル(サイドバー・フッター・全画面レイアウトのCSS)は
  delivery-payload/templates/partials 配下の共通ファイルを注入マーカー経由で読み込む。
  テーマ切替はサイドバー側に一本化されており、本テンプレートに複製は無い。
  本ページは縦に読む履歴型のため、他のdetail-pagesと異なり全画面固定(is-fixed)は使わず、
  メインペイン自体がスクロールする。

  プレースホルダ(build-detail-page.shが注入。実際のマーカー記法は
  scripts/detail-pages/build-detail-page.sh 冒頭コメントを正本とする。本コメントでは
  二重置換事故を避けるため意図的に波括弧を外して記載する):
    TITLE (ページ見出しマーカー)          : page-data.json の title
    DESCRIPTION (ページ概要マーカー)      : page-data.json の description
    BACK_LINK (ポータルTOPへの戻りリンク) : ポータルからの相対パス
    PAGE_DATA_JSON (page-data埋め込みマーカー) : page-data.json の内容全体(本ファイル物理末尾のscriptタグへ注入)
    PROJECT_NAME・GENERATED_AT・COMMIT_SHORT は本ファイル本体では使わず、共通シェル
    (サイドバー・フッター)側でのみ消費される。

  pageKind: release-notes
  page-data.json 想定構造(定義スキーマの正本は
  generation-engine/scripts/detail-pages/page-data-schema.md の T7: release-notes 節):
    releases: [{ id, date, title, pr, prUrl, flow, summary[], changes[], verifySteps[] }]
  releases[] をタイムライン形式(左: バージョン・日付／右: PR単位のアコーディオンカード)で
  一覧表示する。各カードの中身は「変更概要」「変更内容」「確認手順」の3折りたたみで構成し、
  確認手順のチェック状態は localStorage に永続化する。全チェック完了のカードは完了表示に切り替わる。
-->
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }

.sec-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--muted);
  margin: 24px 0 14px;
}

.rn-wrap { padding: 6px 0 60px; }

/* ============ タイムライン行（左: バージョン・日付／右: カード） ============ */
.release-list { display: flex; flex-direction: column; gap: 14px; max-width: 1040px; }
.rn-row { display: grid; grid-template-columns: 92px 1fr; gap: 16px; }
.rn-rail { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 16px; text-align: right; }
.rn-version { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text); }
.rn-date { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.rn-latest { font-size: 9.5px; font-weight: 800; letter-spacing: 0.05em; background: var(--accent); color: var(--chipontext); padding: 2px 8px; }

.rn-card-col { position: relative; border-left: 1.5px solid var(--line2); padding-left: 24px; }
.rn-card-col::before { content: ""; position: absolute; left: -5.75px; top: 20px; width: 10px; height: 10px; background: var(--accent); }

/* ============ PR 行（<details> アコーディオン） ============ */
.rn-pr {
  background: var(--panel); border: 1px solid var(--line2);
  overflow: hidden;
}
.rn-pr[data-flow="feature"]     { border-left: 4px solid var(--stamp); }
.rn-pr[data-flow="maintenance"] { border-left: 4px solid var(--green); }
.rn-pr[data-flow="docs"]        { border-left: 4px solid var(--accent); }
.rn-pr.is-done { background: var(--panel2); }

.rn-pr-sum {
  list-style: none; cursor: pointer;
  padding: 12px 14px;
  background: var(--panel3);
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.rn-pr-sum::-webkit-details-marker { display: none; }
.rn-pr-caret {
  flex: none;
  width: 0; height: 0;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  border-left: 6px solid var(--muted);
  transition: transform .15s;
}
.rn-pr[open] .rn-pr-caret { transform: rotate(90deg); }

.rn-tick { flex: none; color: var(--green); font-weight: 800; font-size: 14px; }

.rn-flow-pill {
  flex: none; padding: 2px 9px;
  font-size: 10.5px; font-weight: 800; white-space: nowrap; color: var(--chipontext);
}
.rn-flow-pill--feature     { background: var(--stamp); }
.rn-flow-pill--maintenance { background: var(--green); }
.rn-flow-pill--docs        { background: var(--accent); }
.rn-pr.is-done .rn-flow-pill { opacity: 0.75; }

.rn-pr-num {
  flex: none; font-family: var(--mono); font-size: 12px; font-weight: 700;
  color: var(--accent); background: var(--panel);
  padding: 2px 8px; border: 1px solid var(--accent);
  text-decoration: none;
}
.rn-pr-num:hover { background: var(--accent-soft); }
.rn-pr.is-done .rn-pr-num { opacity: 0.75; }

.rn-pr-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.4; overflow-wrap: break-word; }
.rn-pr.is-done .rn-pr-title { font-weight: 500; color: var(--sub); }

.rn-pr-body { padding: 4px 14px 14px; border-top: 1px dashed var(--line2); margin: 0 4px; }

/* ============ 中身フォルド（変更概要 / 変更内容 / 確認手順）============ */
.rn-fold { margin: 8px 0 0; background: var(--panel); border: 1px solid var(--line2); overflow: hidden; }
.rn-fold-sum {
  list-style: none; cursor: pointer; padding: 10px 12px;
  font-size: 12.5px; font-weight: 800; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.rn-fold-sum::-webkit-details-marker { display: none; }
.rn-fold-sum::before {
  content: ""; flex: none;
  width: 0; height: 0;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  border-left: 6px solid currentColor;
  transition: transform .15s;
}
.rn-fold[open] .rn-fold-sum::before { transform: rotate(90deg); }
.rn-fold-label { flex: 1; }

.rn-fold[data-kind="summary"] { border-color: var(--accent); }
.rn-fold[data-kind="summary"] .rn-fold-sum { background: var(--accent-soft); color: var(--accent); border-bottom: 1px solid var(--accent); }
.rn-fold[data-kind="summary"] .rn-fold-sum::before { color: var(--accent); }

.rn-fold[data-kind="changes"] { border-color: var(--line2); }
.rn-fold[data-kind="changes"] .rn-fold-sum { background: var(--panel2); color: var(--text); border-bottom: 1px solid var(--line2); }
.rn-fold[data-kind="changes"] .rn-fold-sum::before { color: var(--muted); }

.rn-fold[data-kind="verify"] { border-color: var(--stamp); border-width: 1.5px; }
.rn-fold[data-kind="verify"] .rn-fold-sum { background: var(--stamp-soft); color: var(--stamp); border-bottom: 1px solid var(--stamp); }
.rn-fold[data-kind="verify"] .rn-fold-sum::before { color: var(--stamp); }
.rn-pr.is-done .rn-fold[data-kind="verify"] { border-color: var(--green); border-width: 1px; }
.rn-pr.is-done .rn-fold[data-kind="verify"] .rn-fold-sum { background: var(--green-soft); color: var(--green); border-bottom-color: var(--green); }
.rn-pr.is-done .rn-fold[data-kind="verify"] .rn-fold-sum::before { color: var(--green); }

.rn-fold-body { padding: 10px 12px 12px; }

/* ============ 変更概要: ラベル付き箇条書き ============ */
.rn-dl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.rn-dl > li { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; border-bottom: 1px dashed var(--line2); }
.rn-dl > li:last-child { border-bottom: none; }
.rn-dl-label { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; }
.rn-dl-text { font-size: 13px; line-height: 1.6; color: var(--text); overflow-wrap: break-word; }

/* ============ 変更内容: 種別バッジ付き ============ */
.rn-changes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.rn-changes li { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; line-height: 1.55; padding: 4px 0; color: var(--sub); overflow-wrap: break-word; }
.badge { padding: 1px 6px; font-size: 10px; font-weight: 800; white-space: nowrap; flex: none; margin-top: 2px; }
.badge-feat { background: var(--green-soft); color: var(--green); }
.badge-fix  { background: var(--stamp-soft);  color: var(--stamp); }
.badge-docs { background: var(--accent-soft);  color: var(--accent); }
.badge-test { background: var(--stamp-soft);    color: var(--stamp); }
.badge-refactor, .badge-chore { background: var(--panel2); color: var(--muted); border: 1px solid var(--line2); }

/* ============ 確認手順: チェックボックス付き ============ */
.rn-step { padding-bottom: 8px; }
.rn-step + .rn-step { border-top: 1px dashed var(--line2); padding-top: 8px; }
.rn-step-h { padding: 2px 4px 6px; font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.45; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rn-env { font-size: 10px; font-weight: 800; padding: 1px 6px; flex: none; }
.rn-env--staging { background: var(--accent-soft); color: var(--accent); }
.rn-env--production { background: var(--stamp-soft); color: var(--stamp); }
.rn-env--local { background: var(--panel2); color: var(--muted); border: 1px solid var(--line2); }

.rn-checkrow {
  display: flex; align-items: flex-start; gap: 12px; padding: 8px 6px; cursor: pointer;
  transition: background .12s; margin: 1px 0;
}
.rn-checkrow:hover, .rn-checkrow:focus-within { background: var(--accent-soft); }
.rn-checkrow input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--accent); cursor: pointer; }
.rn-checkrow-text { flex: 1; font-size: 13px; line-height: 1.55; color: var(--text); overflow-wrap: break-word; }
.rn-checkrow.is-done { opacity: 0.6; }
.rn-checkrow.is-done .rn-checkrow-text { color: var(--muted); text-decoration: line-through; }

.empty-note {
  font-size: 12.5px; color: var(--muted); background: var(--panel2);
  border: 1px solid var(--line2); padding: 14px 16px;
}

.note-box {
  font-size: 12.5px; color: var(--sub); background: var(--panel3);
  border: 1px solid var(--line2); padding: 10px 14px; margin: 14px 0 0;
}

.hidden { display: none !important; }

@media (max-width: 760px) {
  .rn-row { grid-template-columns: 64px 1fr; gap: 10px; }
  .rn-pr-title { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .rn-fold-sum::before { transition: none; }
  .rn-pr-caret { transition: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{BACK_LINK}}">TOP</a> ／ {{ACTIVE_CATEGORY_LABEL}} ／ <span class="pt-crumb-current">{{TITLE}}</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title">{{TITLE}}</h1>
          <span class="pt-title-sub">{{DESCRIPTION}}</span>
        </div>
      </div>

      <div class="rn-wrap">
        <div class="sec-label">リリース一覧</div>
        <div class="release-list" id="release-mount"></div>

        <!--RELATED_ENTITIES--><div id="unresolved-mount"></div>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="page-data">
{{PAGE_DATA_JSON}}
</script>

<script>
(function() {
  var data = JSON.parse(document.getElementById('page-data').textContent);
  var STORE_KEY_PREFIX = 'rn-';

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k) {
      if (k === 'html') node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    if (children) {
      if (!Array.isArray(children)) children = [children];
      children.forEach(function(c) {
        if (typeof c === 'string') node.appendChild(document.createTextNode(c));
        else if (c) node.appendChild(c);
      });
    }
    return node;
  }

  function loadChecked(key) {
    try { return localStorage.getItem(key) === '1'; } catch (e) { return false; }
  }
  function saveChecked(key, value) {
    try { localStorage.setItem(key, value ? '1' : '0'); } catch (e) {}
  }

  var FLOW_LABEL = { feature: '機能追加', maintenance: '保守', docs: 'ドキュメント' };
  var TYPE_LABEL = { feat: 'feat', fix: 'fix', docs: 'docs', test: 'test', refactor: 'refactor', chore: 'chore' };

  function makeFold(kind, label, openByDefault, bodyBuilder) {
    var det = el('details', { class: 'rn-fold', 'data-kind': kind });
    if (openByDefault) det.setAttribute('open', '');
    var sum = el('summary', { class: 'rn-fold-sum' }, el('span', { class: 'rn-fold-label' }, label));
    det.appendChild(sum);
    var body = el('div', { class: 'rn-fold-body' });
    bodyBuilder(body);
    det.appendChild(body);
    return det;
  }

  function buildSummaryBody(body, summary) {
    var ul = el('ul', { class: 'rn-dl' });
    (summary || []).forEach(function(item) {
      var li = el('li', null, [
        el('span', { class: 'rn-dl-label' }, (item.label || '') + '：'),
        el('span', { class: 'rn-dl-text' }, item.text || '')
      ]);
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  function buildChangesBody(body, changes) {
    var ul = el('ul', { class: 'rn-changes' });
    (changes || []).forEach(function(c) {
      var badgeClass = ['feat', 'fix', 'docs', 'test', 'refactor', 'chore'].indexOf(c.type) !== -1 ? c.type : 'chore';
      var li = el('li', null, [
        el('span', { class: 'badge badge-' + badgeClass }, TYPE_LABEL[c.type] || c.type || ''),
        el('span', null, c.text || '')
      ]);
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  // 確認手順チェック状態から完了カウントを集計する
  function countChecks(release) {
    var total = 0, done = 0;
    (release.verifySteps || []).forEach(function(step, si) {
      (step.checks || []).forEach(function(_c, ci) {
        total++;
        var key = STORE_KEY_PREFIX + release.id + '-' + si + '-' + ci;
        if (loadChecked(key)) done++;
      });
    });
    return { total: total, done: done };
  }

  function buildVerifyBody(body, release, onChange) {
    (release.verifySteps || []).forEach(function(step, si) {
      var stepWrap = el('div', { class: 'rn-step' });
      var sh = el('div', { class: 'rn-step-h' }, [el('span', null, 'Step ' + (si + 1) + ': ' + (step.title || ''))]);
      if (step.env) {
        sh.appendChild(el('span', { class: 'rn-env rn-env--' + step.env }, step.env));
      }
      stepWrap.appendChild(sh);
      (step.checks || []).forEach(function(text, ci) {
        var key = STORE_KEY_PREFIX + release.id + '-' + si + '-' + ci;
        var isDone = loadChecked(key);
        var label = el('label', { class: 'rn-checkrow' + (isDone ? ' is-done' : '') });
        var box = el('input', { type: 'checkbox' });
        if (isDone) box.checked = true;
        box.addEventListener('change', function() {
          saveChecked(key, box.checked);
          onChange();
        });
        label.appendChild(box);
        label.appendChild(el('span', { class: 'rn-checkrow-text' }, text));
        stepWrap.appendChild(label);
      });
      body.appendChild(stepWrap);
    });
  }

  function renderRelease(release) {
    var counts = countChecks(release);
    var isDone = counts.total > 0 && counts.done === counts.total;

    var det = el('details', { class: 'rn-pr' + (isDone ? ' is-done' : ''), 'data-flow': release.flow || 'feature' });

    var sum = el('summary', { class: 'rn-pr-sum' });
    sum.appendChild(el('span', { class: 'rn-pr-caret' }));
    if (isDone) sum.appendChild(el('span', { class: 'rn-tick' }, '✓'));
    sum.appendChild(el('span', { class: 'rn-flow-pill rn-flow-pill--' + (release.flow || 'feature') }, FLOW_LABEL[release.flow] || release.flow || ''));
    if (release.prUrl) {
      var a = el('a', { class: 'rn-pr-num', href: release.prUrl, target: '_blank', rel: 'noopener' }, '#' + release.pr);
      a.addEventListener('click', function(ev) { ev.stopPropagation(); });
      sum.appendChild(a);
    } else if (release.pr != null) {
      sum.appendChild(el('span', { class: 'rn-pr-num' }, '#' + release.pr));
    }
    sum.appendChild(el('span', { class: 'rn-pr-title' }, release.title || ''));
    det.appendChild(sum);

    var body = el('div', { class: 'rn-pr-body' });
    if ((release.summary || []).length) {
      body.appendChild(makeFold('summary', '変更概要', true, function(b) { buildSummaryBody(b, release.summary); }));
    }
    if ((release.changes || []).length) {
      body.appendChild(makeFold('changes', '変更内容', false, function(b) { buildChangesBody(b, release.changes); }));
    }
    if ((release.verifySteps || []).length) {
      body.appendChild(makeFold('verify', '確認手順（' + counts.done + '/' + counts.total + '）', false, function(b) {
        buildVerifyBody(b, release, render);
      }));
    }
    det.appendChild(body);
    return det;
  }

  var releaseMount = document.getElementById('release-mount');
  var releases = data.releases || [];

  function render() {
    // 開いている <details> の id を保持し、再描画後も展開状態を維持する
    var openIds = [];
    releaseMount.querySelectorAll('.rn-pr[open]').forEach(function(d) { openIds.push(d.dataset.id); });

    releaseMount.innerHTML = '';
    if (releases.length === 0) {
      releaseMount.appendChild(el('div', { class: 'empty-note' }, 'なし'));
      return;
    }
    releases.forEach(function(release, idx) {
      var det = renderRelease(release);
      det.dataset.id = release.id;
      if (openIds.indexOf(release.id) !== -1) det.setAttribute('open', '');

      var row = el('div', { class: 'rn-row' });
      var rail = el('div', { class: 'rn-rail' });
      if (release.pr != null) rail.appendChild(el('div', { class: 'rn-version' }, '#' + release.pr));
      rail.appendChild(el('div', { class: 'rn-date' }, release.date || ''));
      if (idx === 0) rail.appendChild(el('span', { class: 'rn-latest' }, 'LATEST'));
      row.appendChild(rail);

      var col = el('div', { class: 'rn-card-col' });
      col.appendChild(det);
      row.appendChild(col);

      releaseMount.appendChild(row);
    });
  }

  render();

  // --- 未解決節(unresolved[]) ---
  var unresolvedMount = document.getElementById('unresolved-mount');
  var unresolved = data.unresolved || [];
  if (unresolved.length > 0) {
    unresolvedMount.appendChild(el('div', { class: 'sec-label' }, '未解決'));
    var box = el('div', { class: 'note-box' });
    unresolved.forEach(function(u) {
      var line = (u.label || '') + '（' + (u.reason || '') + '）';
      box.appendChild(el('div', null, line));
    });
    unresolvedMount.appendChild(box);
  }
})();
</script>
</body>
</html>
