<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SCREEN_LABEL}} のシーケンス図</title>
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

/* 操作一覧（画面ナビ・章目次は共通サイドバーへ統合済み） */
.dp-layout { display: block; margin-top: 28px; }

.operation-list { display: flex; flex-direction: column; gap: 2px; }
.operation-link {
  width: 100%; padding: 7px 10px; border: 0; border-left: 3px solid transparent;
  background: transparent; color: var(--sub); cursor: pointer;
  font: inherit; font-size: 13px; line-height: 1.45; text-align: left;
}
.operation-link:hover { color: var(--text); border-left-color: var(--accent); }
.operation-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 700; }

/* 図解本体 */
.dp-seq-main { width: 100%; min-width: 0; max-width: min(2200px, 96vw); }
.dp-seq-main p.lead { margin: 0 0 20px; color: var(--sub); font-size: 13.5px; }
.diagram-wrap {
  overflow-x: auto; border: 1.5px solid var(--line2);
  background: var(--panel); margin-bottom: 20px; scrollbar-gutter: stable;
}
#sequence-svg { display: block; }
.lane-label { font-size: 12px; font-weight: 700; fill: var(--text); }
.lane-node { fill: var(--panel3); stroke: var(--line2); stroke-width: 1.5; }
.lane-node-shadow { fill: var(--accent-soft); }
.lane-line { stroke: var(--line2); stroke-width: 1.5; }
.step-arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.step-arrow.return { stroke: var(--muted); stroke-dasharray: 5 4; }
.step-label { font-size: 11.5px; fill: var(--sub); }
.step-label.return { fill: var(--muted); }
.empty-message { padding: 24px; text-align: center; color: var(--muted); font-size: 0.95rem; }
.table-scroll-shell { position: relative; min-width: 0; }
.table-scroll-shell::before,
.table-scroll-shell::after {
  content: ""; position: absolute; z-index: 2; top: 1.5px; bottom: 1.5px; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.table-scroll-shell::before {
  left: 1.5px; background: linear-gradient(to right, var(--panel), transparent);
}
.table-scroll-shell::after {
  right: 1.5px; background: linear-gradient(to left, var(--panel), transparent);
}
.table-scroll-shell.can-scroll-left::before,
.table-scroll-shell.can-scroll-right::after { opacity: .94; }
.steps-table-wrap {
  width: 100%; overflow-x: auto; border: 1.5px solid var(--line2); scrollbar-gutter: stable;
}
table.steps-table {
  border-collapse: collapse; width: max-content; min-width: 100%;
  margin: 0; font-size: 0.88rem; background: var(--panel);
}
table.steps-table th { background: var(--head); color: var(--headtext); font-weight: 700; text-align: left; }
table.steps-table th, table.steps-table td {
  min-width: 10rem; max-width: 34rem; padding: 8px 12px;
  border: 0; border-bottom: 1px solid var(--line);
  overflow-wrap: normal; word-break: normal; vertical-align: top;
}
table.steps-table th { white-space: nowrap; }
table.steps-table th:first-child,
table.steps-table td:first-child { min-width: 4.5rem; width: 4.5rem; }
table.steps-table td.ref {
  min-width: 18rem; font-family: var(--mono); font-size: 0.82em;
  color: var(--accent); background: var(--panel3); white-space: nowrap;
}

@media (max-width: 820px) {
  .dp-layout { margin-top: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .operation-link, .table-scroll-shell::before, .table-scroll-shell::after { transition: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main" id="main-scroll">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{PORTAL_INDEX_HREF}}">TOP</a> ／ {{ACTIVE_CATEGORY_LABEL}} ／ <span class="pt-crumb-current">{{SCREEN_LABEL}} のシーケンス図</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title">{{SCREEN_LABEL}} のシーケンス図</h1>
        </div>
      </div>

      <div class="dp-layout">
        <div class="dp-seq-main">
          <p class="lead">左の操作メニューを選ぶと、利用者 → 画面 → API／内部処理 → テーブルの呼び出し順序を表示する。</p>

          <div class="diagram-wrap">
            <svg id="sequence-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{SCREEN_LABEL}}の操作シーケンス"></svg>
          </div>

          <div class="table-scroll-shell" id="steps-scroll-shell">
            <div class="steps-table-wrap" id="steps-table-wrap">
              <table class="steps-table" id="steps-table">
                <thead>
                  <tr><th>順序</th><th>区間</th><th>内容</th><th>根拠</th></tr>
                </thead>
                <tbody id="steps-table-body"></tbody>
              </table>
            </div>
          </div>

          <div class="empty-message" id="empty-message" style="display:none">操作データなし</div>
        </div>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="page-data">
{{PAGE_DATA_JSON}}
</script>

<script>
(function () {
  var DEFAULT_LANES = [
    { key: 'user', label: '利用者' },
    { key: 'screen', label: '画面' },
    { key: 'api', label: 'API' },
    { key: 'table', label: 'テーブル' }
  ];
  var LANE_PITCH = 240;
  var LANE_MARGIN = 90;
  var ROW_HEIGHT = 56;
  var TOP_PADDING = 46;
  var BOTTOM_PADDING = 24;
  var NODE_W = 100;
  var NODE_H = 28;
  var NODE_Y = 4;
  var LABEL_FONT_SIZE = 11.5;
  var LABEL_PAD = 6;

  var raw = document.getElementById('page-data').textContent;
  var data = {};
  try { data = JSON.parse(raw); } catch (e) { data = { operations: [] }; }
  var operations = data.operations || [];

  // レーンは operation.lanes > page-data.lanes > 既定値の順で採用する
  var pageLaneDefs = (data.lanes && data.lanes.length) ? data.lanes : DEFAULT_LANES;
  var LANES = [];
  var LANE_LABELS = {};

  var operationList = document.getElementById('operation-list');
  var operationLabel = document.getElementById('operation-label');
  var svg = document.getElementById('sequence-svg');
  var tbody = document.getElementById('steps-table-body');
  var emptyMsg = document.getElementById('empty-message');
  var diagramWrap = document.querySelector('.diagram-wrap');
  var tableWrap = document.getElementById('steps-table-wrap');
  var scrollShell = document.getElementById('steps-scroll-shell');

  // 横スクロールが必要な表だけ端フェードとキーボード操作の手掛かりを付ける
  function updateScrollCue() {
    if (!scrollShell || !tableWrap) return;
    var overflowing = tableWrap.scrollWidth > tableWrap.clientWidth + 1;
    var atStart = tableWrap.scrollLeft <= 1;
    var atEnd = tableWrap.scrollLeft + tableWrap.offsetWidth >= tableWrap.scrollWidth - 1;
    scrollShell.classList.toggle('can-scroll-left', overflowing && !atStart);
    scrollShell.classList.toggle('can-scroll-right', overflowing && !atEnd);
    if (overflowing) {
      tableWrap.tabIndex = 0;
      tableWrap.setAttribute('role', 'region');
      tableWrap.setAttribute('aria-label', '横にスクロールできます');
    } else {
      tableWrap.removeAttribute('tabindex');
      tableWrap.removeAttribute('role');
      tableWrap.removeAttribute('aria-label');
    }
  }
  if (tableWrap) tableWrap.addEventListener('scroll', updateScrollCue, {passive: true});
  window.addEventListener('resize', updateScrollCue);

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function laneX(laneKey) {
    var idx = LANES.indexOf(laneKey);
    if (idx === -1) idx = 0;
    return LANE_MARGIN + idx * LANE_PITCH;
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) { el.setAttribute(k, attrs[k]); }
    return el;
  }

  // 矢印ラベルの描画幅見積り（フォントメトリクスへ直接アクセスできない静的テンプレートのための概算）。
  // 全角文字は概ね 1em、半角文字は概ね 0.58em の字送りとして扱う。
  function isFullWidthChar(ch) {
    var code = ch.charCodeAt(0);
    return code >= 0x1100 && (
      code <= 0x115F ||
      code === 0x2329 || code === 0x232A ||
      (code >= 0x2E80 && code <= 0xA4CF && code !== 0x303F) ||
      (code >= 0xAC00 && code <= 0xD7A3) ||
      (code >= 0xF900 && code <= 0xFAFF) ||
      (code >= 0xFF00 && code <= 0xFF60) ||
      (code >= 0xFFE0 && code <= 0xFFE6)
    );
  }
  function charWidth(ch) {
    return LABEL_FONT_SIZE * (isFullWidthChar(ch) ? 1.0 : 0.58);
  }
  function estimateTextWidth(text) {
    var w = 0;
    for (var i = 0; i < text.length; i++) w += charWidth(text.charAt(i));
    return w;
  }
  // maxWidth 以下に収まるよう末尾を省略記号で切り詰める。既に収まっていればそのまま返す。
  function fitLabelText(text, maxWidth) {
    if (estimateTextWidth(text) <= maxWidth) return text;
    var ellipsis = '…';
    var ellipsisW = estimateTextWidth(ellipsis);
    var result = '';
    var w = 0;
    for (var i = 0; i < text.length; i++) {
      var cw = charWidth(text.charAt(i));
      if (w + cw + ellipsisW > maxWidth) break;
      result += text.charAt(i);
      w += cw;
    }
    return result + ellipsis;
  }

  function renderOperation(op, activeIndex) {
    svg.innerHTML = '';
    tbody.innerHTML = '';

    var laneDefs = (op && op.lanes && op.lanes.length) ? op.lanes : pageLaneDefs;
    LANES = laneDefs.map(function (l) { return l.key; });
    LANE_LABELS = {};
    laneDefs.forEach(function (l) { LANE_LABELS[l.key] = l.label || l.key; });

    var steps = (op && op.steps) || [];
    var height = TOP_PADDING + steps.length * ROW_HEIGHT + BOTTOM_PADDING;
    var width = LANE_MARGIN * 2 + (LANES.length - 1) * LANE_PITCH;
    // ラベルの外接矩形が図の左端（0）・右端（width）をはみ出さないよう、描画可能幅を上限にして切り詰める
    var maxLabelWidth = Math.max(20, width - LABEL_PAD * 2);

    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);

    var defs = svgEl('defs', {});
    var marker = svgEl('marker', {
      id: 'seq-arrowhead', viewBox: '0 0 10 10', refX: 9, refY: 5,
      markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'
    });
    var arrowPath = svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--accent)' });
    marker.appendChild(arrowPath);
    defs.appendChild(marker);
    svg.appendChild(defs);

    // レーン見出し（ノード）+ 縦線
    LANES.forEach(function (laneKey) {
      var x = laneX(laneKey);
      var boxX = x - NODE_W / 2;

      var shadow = svgEl('rect', { x: boxX + 3, y: NODE_Y + 3, width: NODE_W, height: NODE_H, class: 'lane-node-shadow' });
      svg.appendChild(shadow);
      var node = svgEl('rect', { x: boxX, y: NODE_Y, width: NODE_W, height: NODE_H, class: 'lane-node' });
      svg.appendChild(node);

      var label = svgEl('text', { x: x, y: NODE_Y + NODE_H / 2 + 4, class: 'lane-label', 'text-anchor': 'middle' });
      label.textContent = LANE_LABELS[laneKey] || laneKey;
      svg.appendChild(label);

      var line = svgEl('line', {
        x1: x, y1: NODE_Y + NODE_H + 6, x2: x, y2: height - BOTTOM_PADDING + 6,
        class: 'lane-line'
      });
      svg.appendChild(line);
    });

    // ステップ矢印
    steps.forEach(function (step, i) {
      var y = TOP_PADDING + i * ROW_HEIGHT + ROW_HEIGHT / 2;
      var x1 = laneX(step.from);
      var x2 = laneX(step.to);
      var isReturn = step.kind === 'return';

      if (x1 === x2) {
        // 自己ループ（同一レーン内の呼び出し）
        var loopPath = svgEl('path', {
          d: 'M ' + x1 + ' ' + (y - 10) + ' q 36 0 0 20',
          class: 'step-arrow' + (isReturn ? ' return' : ''),
          'marker-end': 'url(#seq-arrowhead)'
        });
        svg.appendChild(loopPath);
      } else {
        var line = svgEl('line', {
          x1: x1, y1: y, x2: x2, y2: y,
          class: 'step-arrow' + (isReturn ? ' return' : ''),
          'marker-end': 'url(#seq-arrowhead)'
        });
        svg.appendChild(line);
      }

      var rawLabel = (step.seq != null ? step.seq + '. ' : '') + (step.label || '');
      var fittedLabel = fitLabelText(rawLabel, maxLabelWidth);
      var labelW = estimateTextWidth(fittedLabel);
      var midX = (x1 + x2) / 2;
      // 中央揃えのまま、外接矩形が [0, width] からはみ出ないように中心座標を左右へクランプする
      var textX = Math.max(LABEL_PAD + labelW / 2, Math.min(midX, width - LABEL_PAD - labelW / 2));
      var text = svgEl('text', {
        x: textX, y: y - 8, class: 'step-label' + (isReturn ? ' return' : ''),
        'text-anchor': 'middle'
      });
      text.textContent = fittedLabel;
      svg.appendChild(text);
    });

    // steps 一覧表
    steps.forEach(function (step) {
      var tr = document.createElement('tr');
      var fromLabel = LANE_LABELS[step.from] || step.from;
      var toLabel = LANE_LABELS[step.to] || step.to;
      var refCell = step.sourceRef ? escHtml(step.sourceRef) : '';
      tr.innerHTML =
        '<td>' + escHtml(step.seq) + '</td>' +
        '<td>' + escHtml(fromLabel) + ' → ' + escHtml(toLabel) + (step.kind === 'return' ? '（応答）' : '') + '</td>' +
        '<td>' + escHtml(step.label) + '</td>' +
        '<td class="ref">' + refCell + '</td>';
      tbody.appendChild(tr);
    });
    Array.prototype.forEach.call(operationList.querySelectorAll('.operation-link'), function (button, index) {
      var active = index === activeIndex;
      button.classList.toggle('active', active);
      button.setAttribute('aria-current', active ? 'true' : 'false');
    });
    requestAnimationFrame(updateScrollCue);
  }

  if (!operations.length) {
    if (diagramWrap) diagramWrap.style.display = 'none';
    if (scrollShell) scrollShell.style.display = 'none';
    if (tableWrap) tableWrap.style.display = 'none';
    if (operationLabel) operationLabel.style.display = 'none';
    emptyMsg.style.display = 'block';
  } else {
    operations.forEach(function (op, i) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'operation-link';
      button.textContent = op.label || op.key || ('操作' + (i + 1));
      button.addEventListener('click', function () {
        renderOperation(operations[i], i);
      });
      operationList.appendChild(button);
    });
    renderOperation(operations[0], 0);
  }
})();
</script>
</body>
</html>
