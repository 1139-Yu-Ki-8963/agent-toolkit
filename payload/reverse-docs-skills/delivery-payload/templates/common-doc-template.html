<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOC_TITLE}}</title>
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

:root { --section-gap: clamp(28px, 4vw, 44px); }

/* 文書 2 カラム（目次 + 本文。目次は共通サイドバーへ統合済み） */
.dp-layout { display: block; margin-top: 28px; }

.toc-link {
  display: block; padding: 6px 10px; margin-left: -1.5px;
  border-left: 3px solid transparent;
  color: var(--sub); font-size: 12.5px; font-weight: 450; line-height: 1.4;
  transition: color .12s, border-color .12s;
}
.toc-link:hover { color: var(--text); border-left-color: var(--accent); text-decoration: none; }
.toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.dp-panel {
  width: 100%; min-width: 0; max-width: min(2200px, 96vw);
  border: 1.5px solid var(--line2); background: var(--panel);
  padding: 32px 40px; counter-reset: sec-num;
}

/* section */
.sec-block { margin-bottom: var(--section-gap); scroll-margin-top: 24px; }
.sec-label {
  counter-increment: sec-num;
  display: flex; align-items: baseline; gap: 10px;
  font-size: 16.5px; font-weight: 700; color: var(--text);
  margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.sec-label::before {
  content: counter(sec-num, decimal-leading-zero);
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--stamp);
}

/* 改善課題1-244: 階層目次・折りたたみ・絞り込み・表からのページ内リンク */
.toc-sub { list-style: none; margin: 0; padding: 0 0 0 12px; }
.toc-link.toc-l3 { font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
.toc-link.toc-l4 { font-size: 11.5px; padding-top: 3px; padding-bottom: 3px; padding-left: 20px; color: var(--sub); }
.toc-li.is-filtered { display: none; }
#doc-content h3, #doc-content h4 { scroll-margin-top: 4px; }
.doc-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; padding: 10px 12px; border: 1.5px solid var(--line2); background: var(--panel2); }
.doc-tools label { font-size: 12.5px; color: var(--sub); }
.doc-tools input[type="search"] { flex: 1 1 220px; min-width: 160px; padding: 6px 8px; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; }
.doc-tools button { padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; cursor: pointer; }
.doc-tools button:hover { border-color: var(--accent); }
.doc-tools .doc-filter-count { font-family: var(--mono); font-size: 12px; color: var(--stamp); }
.fold-details { margin: 10px 0; border: 1px solid var(--line2); background: var(--panel); }
.fold-details > summary { list-style: none; cursor: pointer; padding: 8px 10px 8px 26px; position: relative; }
.fold-details > summary::-webkit-details-marker { display: none; }
.fold-details > summary::before { content: "\25b8"; position: absolute; left: 10px; top: 9px; color: var(--accent); transition: transform .12s; }
.fold-details[open] > summary::before { transform: rotate(90deg); }
.fold-details > summary > h3, .fold-details > summary > h4 { display: inline; margin: 0; }
.fold-details > .fold-body { padding: 0 12px 10px; }
.fold-details.is-filtered { display: none; }
.fold-count { font-family: var(--mono); font-size: 11px; color: var(--stamp); margin-left: 8px; }
#doc-content a.ref-link { color: var(--accent); border-bottom: 1px dotted var(--accent); }
@media print { .doc-tools { display: none; } }

/* 改善課題1-273・1-295: 行数の多い表の並べ替え・絞り込み、テストケース一覧の CSV 書き出し */
.table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 12.5px; color: var(--sub); }
.table-tools input[type="search"] { flex: 1 1 200px; min-width: 140px; padding: 4px 8px; font-size: 12.5px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; }
.table-tools button { padding: 4px 10px; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line2); border-radius: 0; cursor: pointer; }
.table-tools button:hover { border-color: var(--accent); }
.table-tools .table-filter-count { font-family: var(--mono); font-size: 11.5px; color: var(--stamp); }
#doc-content table.sortable-table th { cursor: pointer; user-select: none; }
#doc-content table.sortable-table th[aria-sort="ascending"]::after { content: " \25b4"; color: var(--accent); }
#doc-content table.sortable-table th[aria-sort="descending"]::after { content: " \25be"; color: var(--accent); }
#doc-content tr.is-filtered { display: none; }
@media print { .table-tools { display: none; } }

/* baseline prose（セクション固有クラスの対象外になる見出し・段落・引用・区切り線） */
#doc-content h3 { font-size: 1.05rem; margin: 20px 0 8px; color: var(--text); }
#doc-content h4 { font-size: 0.95rem; margin: 16px 0 6px; color: var(--sub); }
#doc-content p { margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol { padding-left: 22px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol li { margin: 4px 0; }
#doc-content ul { list-style: none; padding-left: 20px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ul li { position: relative; margin: 4px 0; }
#doc-content ul li::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
#doc-content code {
  background: var(--panel3); color: var(--text); padding: 1px 6px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 0.85em;
}
#doc-content blockquote {
  border-left: 3px solid var(--accent); margin: 12px 0; padding: 8px 16px;
  background: var(--panel3); color: var(--sub); font-size: 0.95rem;
}
#doc-content hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

/* rule items（トップレベル ul のチェックリスト装飾。箇条書きと同じ体裁） */
.rule-list { list-style: none; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; }
.rule-item { position: relative; font-size: 13.5px; line-height: 1.75; color: var(--sub); }
.rule-item::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
.rule-item code {
  background: var(--panel); color: var(--text); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: .85em;
}

/* tables */
.table-scroll-shell { position: relative; min-width: 0; margin-bottom: 14px; }
.table-scroll-shell::before,
.table-scroll-shell::after {
  content: ""; position: absolute; z-index: 2; top: 1.5px; bottom: 1.5px; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.table-scroll-shell::before {
  left: 1.5px; background: linear-gradient(to right, var(--panel), transparent);
}
.table-scroll-shell::after {
  right: 1.5px; background: linear-gradient(to left, var(--panel), transparent);
}
.table-scroll-shell.can-scroll-left::before,
.table-scroll-shell.can-scroll-right::after { opacity: .94; }
.table-wrap {
  width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
  border: 1.5px solid var(--line2); scrollbar-gutter: stable;
}
table.data-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
table.data-table thead { position: sticky; top: 0; z-index: 1; }
table.data-table th {
  text-align: left; font-size: 11.5px; font-weight: 700; color: var(--headtext);
  background: var(--head); padding: 8px 12px; border-bottom: 1px solid var(--line2); white-space: nowrap;
}
table.data-table td {
  min-width: 11rem; max-width: 34rem; padding: 9px 12px;
  border-bottom: 1px solid var(--line); vertical-align: top;
  overflow-wrap: normal; word-break: normal; hyphens: none;
}
table.data-table td:first-child { min-width: 7rem; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table code {
  background: var(--panel3); color: var(--accent); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
}

/* code blocks（手動で span を書いた場合にのみ配色が効く。MD パーサーは自動適用しない） */
.code-block { width: 100%; border: 1px solid var(--line2); overflow: hidden; background: var(--code); margin-bottom: 14px; }
.code-block-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 11px; font-weight: 600;
  color: var(--muted); border-bottom: 1px solid var(--line2);
  letter-spacing: .03em;
}
.code-block pre {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--codetext);
}
#doc-content .code-block code {
  display: block; padding: 0; border: 0; background: transparent;
  color: inherit; font: inherit; white-space: pre;
}
.code-block .kw { color: #CBA6F7; }
.code-block .fn { color: #89B4FA; }
.code-block .str { color: #A6E3A1; }
.code-block .num { color: #FAB387; }
.code-block .cm { color: #6C7086; font-style: italic; }
.code-block .op { color: #89DCEB; }
.code-block .type { color: #F9E2AF; }

@media (max-width: 820px) {
  .dp-layout { margin-top: 20px; }
  .dp-panel { max-width: none; padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .toc-link, .table-scroll-shell::before, .table-scroll-shell::after, .fold-details > summary::before { transition: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main" id="main-scroll">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{PORTAL_INDEX_HREF}}">TOP</a> ／ {{ACTIVE_CATEGORY_LABEL}} ／ <span class="pt-crumb-current">{{DOC_TITLE}}</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title" id="dp-hero-title">{{DOC_TITLE}}</h1>
        </div>
      </div>
      <div class="dp-layout">
        <div class="dp-panel">
          <div id="doc-empty-callout" class="pt-callout pt-callout--caution" role="status" hidden>
            <p><span class="material-symbols-outlined pt-callout__icon" aria-hidden="true">info</span><span>この資料は本文が未記入です。情報が欠けているのか、調査の結果として空なのかは、この表示だけでは判別できません。</span></p>
          </div>
          <div id="doc-content"></div>
        </div>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="doc-md">{{DOC_MARKDOWN_JSON}}</script>

<script>
(function () {
  var sourceElement = document.getElementById('doc-md');
  var contentElement = document.getElementById('doc-content');
  if (!sourceElement || !contentElement) return;
  var src = JSON.parse(sourceElement.textContent || '""');

  // frontmatter 除去
  src = src.replace(/^\s*---[\s\S]*?---\s*/, '');

  var lines = src.split('\n');
  var html = [];
  var inTable = false;
  var tableColCount = 0;
  var inList = false;
  var listType = '';
  var inBlockquote = false;
  var inFence = false;
  var fenceLines = [];
  // 改善課題1-51: 見出し以外の本文が無く、かつ表の行が無い場合に「未記入」を示す
  var hasBodyContent = false;
  var hasTableRow = false;

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(s) {
    var value = s.replace(/[\u0000-\u001f\u007f]+/g, '').trim();
    var scheme = value.match(/^([a-z][a-z0-9+.-]*):/i);
    if (scheme && !/^(?:https?|mailto)$/i.test(scheme[1])) return '';
    return escAttr(value);
  }
  // Markdown 文書間の参照（拡張子 .md）を .html へ書き換える処理は生成側
  // （generation-engine/scripts/build-portal.sh の link_related_material_paths / existingFileHref）
  // が担う。生成物が実際に出力される参照だけを解決するには参照先の実在確認が要り、
  // ブラウザ上で動く本スクリプトはファイルの実在を確認できないため、ここでは行わない
  // （改善課題1-40）。テンプレート側は safeUrl による無害化のみを行う。
  // この処理が扱う記法: 見出し・段落・強調（太字）・強調（斜体）・インラインコード・
  // コードブロック（囲み）・リンク・画像・表・引用・番号付きリスト・箇条書き・水平線。
  // 扱わない記法: 取り消し線（~~text~~）。記号がそのまま本文へ残るのは意図した挙動であり、
  // 変換の漏れではない。Markdown 仕様の全記法への対応は範囲外とし、必要になった時点で
  // 実装を足したうえで本一覧を書き換える。screen-doc-template.html も同じ一覧に従う。
  function inlineFormat(s) {
    s = escHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(_, alt, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<img src="' + sanitizedUrl + '" alt="' + escAttr(alt) + '" style="max-width:100%">' : alt;
    });
    s = s.replace(/\[([^\]]+)\]\(([^()\s]+)\)/g, function(_, label, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<a href="' + sanitizedUrl + '">' + label + '</a>' : label;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  }

  // 表のセル分割: インラインコード（`...`）内の縦棒は列区切りとして扱わない
  function splitTableRow(line) {
    var masked = line.replace(/`[^`]*`/g, function (m) { return m.replace(/\|/g, '\u0001'); });
    masked = masked.replace(/\\\|/g, '\u0002');
    return masked.split('|')
      .filter(function (c, j, a) { return j > 0 && j < a.length - 1; })
      .map(function (c) { return c.replace(/\u0001/g, '|').replace(/\u0002/g, '|'); });
  }
  // 見出しの列数とデータ行の列数を照合し、食い違う行は最後の列へ寄せる（または不足分を空欄で補う）
  function normalizeRowCells(cells, colCount) {
    if (!colCount || cells.length === colCount) return cells;
    if (cells.length > colCount) {
      var head = cells.slice(0, colCount - 1);
      var tail = cells.slice(colCount - 1).join('|');
      return head.concat([tail]);
    }
    var padded = cells.slice();
    while (padded.length < colCount) padded.push('');
    return padded;
  }

  function closeList() {
    if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
  }
  function closeBlockquote() {
    if (inBlockquote) { html.push('</blockquote>'); inBlockquote = false; }
  }
  function closeTable() {
    if (inTable) { html.push('</tbody></table></div>'); inTable = false; tableColCount = 0; }
  }
  function closeFence() {
    html.push('<div class="code-block"><pre><code>' + escHtml(fenceLines.join('\n')) + '</code></pre></div>');
    hasBodyContent = true;
    inFence = false;
    fenceLines = [];
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // フェンス内はMarkdownとして解釈せず、終了行まで文字列のまま保持する
    if (inFence) {
      if (/^```\s*$/.test(trimmed)) closeFence();
      else fenceLines.push(line);
      continue;
    }
    if (/^```(?:\s*[^`\s]+)?\s*$/.test(trimmed)) {
      closeList(); closeBlockquote(); closeTable();
      inFence = true;
      fenceLines = [];
      continue;
    }

    // 空行
    // 改善課題1-300: 空行も表を閉じる。閉じないと、空行だけを挟んで続く次の表の見出し行が前の表の行として吸収される
    if (!trimmed) { closeList(); closeBlockquote(); closeTable(); continue; }

    // 見出し
    var hm = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { closeList(); closeBlockquote(); closeTable(); var lv = hm[1].length; html.push('<h' + lv + '>' + inlineFormat(hm[2]) + '</h' + lv + '>'); continue; }

    // 水平線
    if (/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)) { closeList(); closeBlockquote(); closeTable(); html.push('<hr>'); continue; }

    // テーブル
    if (trimmed.indexOf('|') !== -1 && trimmed.charAt(0) === '|') {
      closeList(); closeBlockquote();
      if (/^[\s|:-]+$/.test(trimmed)) continue; // separator 行
      var cells = splitTableRow(trimmed);
      if (!inTable) {
        tableColCount = cells.length;
        html.push('<div class="table-wrap"><table><thead><tr>');
        cells.forEach(function(c) { html.push('<th>' + inlineFormat(c.trim()) + '</th>'); });
        html.push('</tr></thead><tbody>');
        inTable = true;
      } else {
        cells = normalizeRowCells(cells, tableColCount);
        html.push('<tr>');
        cells.forEach(function(c) { html.push('<td>' + inlineFormat(c.trim()) + '</td>'); });
        html.push('</tr>');
        hasTableRow = true;
      }
      continue;
    } else { closeTable(); }

    // 引用
    if (trimmed.charAt(0) === '>') {
      closeList(); closeTable();
      if (!inBlockquote) { html.push('<blockquote>'); inBlockquote = true; }
      html.push('<p>' + inlineFormat(trimmed.substring(1).trim()) + '</p>');
      // 改善課題1-51（4回目）: build-portal.sh が挿入する「本書の位置づけ」注記は
      // 本文が空の資料にも自動挿入されるため、この注記だけは本文ありの判定に数えない。
      // 注記の挿入元（build-portal.sh）に印（data属性等）を持たせられなかったため、
      // 文言一致による判定にとどめている（挿入元の文言が変わると判定が壊れる弱点あり）。
      if (trimmed.indexOf('**本書の位置づけ**') === -1) { hasBodyContent = true; }
      continue;
    } else { closeBlockquote(); }

    // 番号付きリスト
    var olm = trimmed.match(/^(\d+)\.\s+(.*)$/);
    if (olm) {
      closeTable(); closeBlockquote();
      if (!inList || listType !== 'ol') { closeList(); html.push('<ol>'); inList = true; listType = 'ol'; }
      html.push('<li>' + inlineFormat(olm[2]) + '</li>');
      hasBodyContent = true;
      continue;
    }

    // 箇条書き
    if (trimmed.charAt(0) === '-' && trimmed.charAt(1) === ' ') {
      closeTable(); closeBlockquote();
      if (!inList || listType !== 'ul') { closeList(); html.push('<ul>'); inList = true; listType = 'ul'; }
      html.push('<li>' + inlineFormat(trimmed.substring(2)) + '</li>');
      hasBodyContent = true;
      continue;
    }

    // 通常段落
    closeList(); closeTable(); closeBlockquote();
    html.push('<p>' + inlineFormat(trimmed) + '</p>');
    hasBodyContent = true;
  }
  if (inFence) closeFence();
  closeList(); closeTable(); closeBlockquote();

  contentElement.innerHTML = html.join('\n');
  // 改善課題1-51: 見出し以外の本文が無く、かつ表の行が無い場合に未記入の注記を表示する
  if (!hasBodyContent && !hasTableRow) {
    var emptyCallout = document.getElementById('doc-empty-callout');
    if (emptyCallout) emptyCallout.hidden = false;
  }

  // --- 拡張: h1 をヒーローへ、h2 をセクションブロック化 + 目次生成、テーブル/リストの装飾付与 ---
  (function enhance() {
    var container = document.getElementById('doc-content');
    var heroTitle = document.getElementById('dp-hero-title');
    var tocList = document.getElementById('toc-list');
    if (!container || !heroTitle || !tocList) return;

    // 最初の h1 はヒーローへ移し、本文からは除去する
    var h1 = container.querySelector('h1');
    if (h1) {
      heroTitle.textContent = h1.textContent;
      h1.parentNode.removeChild(h1);
    }

    // テーブルに data-table クラスを付与（sticky thead は CSS 側で対応済み）
    Array.prototype.forEach.call(container.querySelectorAll('table'), function (t) {
      t.classList.add('data-table');
    });

    // 横スクロールが必要な表だけ端フェードとキーボード操作の手掛かりを付ける
    var tableWraps = Array.prototype.slice.call(container.querySelectorAll('.table-wrap'));
    var updateScrollCues = [];
    tableWraps.forEach(function (wrap) {
      var shell = document.createElement('div');
      shell.className = 'table-scroll-shell';
      wrap.parentNode.insertBefore(shell, wrap);
      shell.appendChild(wrap);

      function updateScrollCue() {
        var overflowing = wrap.scrollWidth > wrap.clientWidth + 1;
        var atStart = wrap.scrollLeft <= 1;
        var atEnd = wrap.scrollLeft + wrap.offsetWidth >= wrap.scrollWidth - 1;
        shell.classList.toggle('can-scroll-left', overflowing && !atStart);
        shell.classList.toggle('can-scroll-right', overflowing && !atEnd);
        if (overflowing) {
          wrap.tabIndex = 0;
          wrap.setAttribute('role', 'region');
          wrap.setAttribute('aria-label', '横にスクロールできます');
        } else {
          wrap.removeAttribute('tabindex');
          wrap.removeAttribute('role');
          wrap.removeAttribute('aria-label');
        }
      }

      wrap.addEventListener('scroll', updateScrollCue, {passive: true});
      updateScrollCues.push(updateScrollCue);
    });

    function updateAllScrollCues() {
      updateScrollCues.forEach(function (updateScrollCue) { updateScrollCue(); });
    }
    window.addEventListener('resize', updateAllScrollCues);
    requestAnimationFrame(updateAllScrollCues);

    function sectionSlug(text) {
      var normalized = text.trim();
      if (normalized.normalize) normalized = normalized.normalize('NFKC');
      normalized = normalized.toLowerCase()
        .replace(/[^a-z0-9぀-ヿ㐀-鿿._~-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      return normalized || 'section';
    }

    // h2 ごとにセクションブロック化 + 目次エントリを生成
    var sectionEntries = [];
    var h2s = Array.prototype.slice.call(container.querySelectorAll('h2'));
    h2s.forEach(function (h2, idx) {
      var text = h2.textContent;
      var baseId = 'sec-' + sectionSlug(text);
      var id = baseId;
      var duplicate = 2;
      while (document.getElementById(id)) {
        id = baseId + '-' + duplicate;
        duplicate += 1;
      }

      var section = document.createElement('section');
      section.className = 'sec-block';
      section.id = id;

      var label = document.createElement('div');
      label.className = 'sec-label';
      label.textContent = text;
      section.appendChild(label);

      h2.parentNode.insertBefore(section, h2);
      var node = h2.nextSibling;
      h2.parentNode.removeChild(h2);
      while (node && !(node.nodeType === 1 && node.tagName === 'H2')) {
        var next = node.nextSibling;
        section.appendChild(node);
        node = next;
      }

      // セクション直下（トップレベル）の ul のみをチェックリスト装飾する。入れ子リストは変換しない
      Array.prototype.forEach.call(section.children, function (child) {
        if (child.tagName === 'UL') {
          child.classList.add('rule-list');
          Array.prototype.forEach.call(child.children, function (li) {
            if (li.tagName !== 'LI') return;
            li.classList.add('rule-item');
            var content = document.createElement('div');
            while (li.firstChild) content.appendChild(li.firstChild);
            li.appendChild(content);
          });
        }
      });

      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + id;
      var label2 = document.createElement('span');
      label2.textContent = text;
      a.appendChild(label2);
      li.appendChild(a);
      li.className = 'toc-li toc-li-l2';
      tocList.appendChild(li);
      sectionEntries.push({section: section, li: li, id: id, text: text});
    });

    // --- 改善課題1-244: h3/h4 へ id を振り、階層目次・折りたたみ・絞り込み・参照先リンクを付ける ---
    if (sectionEntries.length) (function enhanceDeep() {
      var headingIndex = [];   // {id, text, level, el}
      var usedIds = {};
      function uniqueId(base) {
        var id = base, n = 2;
        while (usedIds[id] || document.getElementById(id)) { id = base + '-' + n; n += 1; }
        usedIds[id] = true;
        return id;
      }

      // (1)(2) 見出しへ id を振り、目次を h2 → h3 → h4 の階層で作る
      sectionEntries.forEach(function (entry) {
        var subList = null;
        var currentL3Li = null;
        var heads = Array.prototype.slice.call(entry.section.querySelectorAll('h3, h4'));
        heads.forEach(function (h) {
          var level = h.tagName === 'H3' ? 3 : 4;
          var text = h.textContent.trim();
          if (!h.id) h.id = uniqueId('h-' + sectionSlug(text));
          headingIndex.push({id: h.id, text: text, level: level, el: h});
          if (!subList) { subList = document.createElement('ul'); subList.className = 'toc-sub'; entry.li.appendChild(subList); }
          var li = document.createElement('li');
          li.className = 'toc-li toc-li-l' + level;
          var a = document.createElement('a');
          a.className = 'toc-link toc-l' + level;
          a.href = '#' + h.id;
          var span = document.createElement('span');
          span.textContent = text;
          a.appendChild(span);
          li.appendChild(a);
          if (level === 3) { subList.appendChild(li); currentL3Li = li; }
          else {
            var parent = currentL3Li || subList;
            if (currentL3Li) {
              var l4list = currentL3Li.querySelector('ul.toc-sub');
              if (!l4list) { l4list = document.createElement('ul'); l4list.className = 'toc-sub'; currentL3Li.appendChild(l4list); }
              parent = l4list;
            }
            parent.appendChild(li);
          }
        });
      });

      // (3) 同階層の見出しが FOLD_THRESHOLD 件以上ある区間は、各見出しとその内容を閉じた details で包む
      var FOLD_THRESHOLD = 5;
      function foldSiblings(parentEl, tag) {
        var kids = Array.prototype.slice.call(parentEl.children);
        var heads = kids.filter(function (k) { return k.tagName === tag; });
        if (heads.length < FOLD_THRESHOLD) return 0;
        var higher = tag === 'H4' ? {H2: 1, H3: 1, H4: 1} : {H2: 1, H3: 1};
        heads.forEach(function (h) {
          var details = document.createElement('details');
          details.className = 'fold-details';
          var summary = document.createElement('summary');
          var body = document.createElement('div');
          body.className = 'fold-body';
          h.parentNode.insertBefore(details, h);
          summary.appendChild(h);
          details.appendChild(summary);
          details.appendChild(body);
          var node = details.nextSibling;
          while (node && !(node.nodeType === 1 && higher[node.tagName])) {
            var next = node.nextSibling;
            body.appendChild(node);
            node = next;
          }
        });
        return heads.length;
      }
      var foldCount = 0;
      sectionEntries.forEach(function (entry) {
        foldCount += foldSiblings(entry.section, 'H3');
        // h3 の内側（details の本文 or セクション直下）の h4 群
        Array.prototype.slice.call(entry.section.querySelectorAll('.fold-body')).forEach(function (body) {
          foldCount += foldSiblings(body, 'H4');
        });
        foldCount += foldSiblings(entry.section, 'H4');
      });
      // 折りたたみの数を節見出しへ添える
      sectionEntries.forEach(function (entry) {
        var n = entry.section.querySelectorAll(':scope > .fold-details').length;
        if (n) { var c = document.createElement('span'); c.className = 'fold-count'; c.textContent = n + '件'; entry.section.querySelector('.sec-label').appendChild(c); }
      });

      function openAncestors(el) {
        var d = el;
        while (d && d !== container) {
          if (d.tagName === 'DETAILS') d.open = true;
          d = d.parentNode;
        }
      }
      function setAllFolds(open) {
        Array.prototype.forEach.call(container.querySelectorAll('details.fold-details'), function (d) { d.open = open; });
      }
      window.addEventListener('beforeprint', function () { setAllFolds(true); });
      // ページ内リンクで閉じた折りたたみの中を指したとき、先祖の details を開いてから移動する
      window.__docOpenFoldsFor = function (id) { var t = document.getElementById(id); if (t) openAncestors(t); };

      // (4) 見出しの文字を対象にした絞り込み
      var tools = document.createElement('div');
      tools.className = 'doc-tools';
      tools.setAttribute('role', 'search');
      var label = document.createElement('label');
      label.setAttribute('for', 'doc-filter');
      label.textContent = '見出しで絞り込む';
      var input = document.createElement('input');
      input.type = 'search'; input.id = 'doc-filter'; input.placeholder = '関数名・節の名前の一部';
      var count = document.createElement('span'); count.className = 'doc-filter-count'; count.setAttribute('aria-live', 'polite');
      var openAll = document.createElement('button'); openAll.type = 'button'; openAll.textContent = 'すべて開く';
      var closeAll = document.createElement('button'); closeAll.type = 'button'; closeAll.textContent = 'すべて閉じる';
      openAll.addEventListener('click', function () { setAllFolds(true); });
      closeAll.addEventListener('click', function () { setAllFolds(false); });
      tools.appendChild(label); tools.appendChild(input); tools.appendChild(count);
      if (foldCount) { tools.appendChild(openAll); tools.appendChild(closeAll); }
      container.insertBefore(tools, container.firstChild);

      function applyFilter() {
        var q = input.value.trim().toLowerCase();
        var matched = 0;
        var tocLis = Array.prototype.slice.call(tocList.querySelectorAll('.toc-li'));
        var folds = Array.prototype.slice.call(container.querySelectorAll('details.fold-details'));
        if (!q) {
          tocLis.forEach(function (li) { li.classList.remove('is-filtered'); });
          folds.forEach(function (d) { d.classList.remove('is-filtered'); });
          count.textContent = '';
          return;
        }
        var hitIds = {};
        headingIndex.forEach(function (h) { if (h.text.toLowerCase().indexOf(q) >= 0) { hitIds[h.id] = true; matched += 1; } });
        sectionEntries.forEach(function (e) { if (e.text.toLowerCase().indexOf(q) >= 0) { hitIds[e.id] = true; matched += 1; } });
        tocLis.forEach(function (li) {
          var a = li.querySelector(':scope > .toc-link');
          var id = a ? a.getAttribute('href').substring(1) : '';
          var selfHit = !!hitIds[id];
          var childHit = Array.prototype.some.call(li.getElementsByClassName('toc-link'), function (l) { return l !== a && hitIds[l.getAttribute('href').substring(1)]; });
          li.classList.toggle('is-filtered', !(selfHit || childHit));
        });
        folds.forEach(function (d) {
          var hit = Array.prototype.some.call(d.querySelectorAll('h3, h4'), function (h) { return hitIds[h.id]; });
          d.classList.toggle('is-filtered', !hit);
          if (hit) d.open = true;
        });
        count.textContent = matched + '件が一致';
      }
      input.addEventListener('input', applyFilter);
      input.addEventListener('search', applyFilter);

      // (5) 「参照先」列の値をページ内リンクへ変換する
      var byText = {};
      var byNumber = {};
      headingIndex.forEach(function (h) {
        byText[h.text] = h.id;
        var m = h.text.match(/^(?:§\s*)?(\d+(?:\.\d+)*)\s/);
        if (m) byNumber[m[1]] = h.id;
      });
      sectionEntries.forEach(function (e) {
        byText[e.text] = e.id;
        var m = e.text.match(/^§\s*(\d+)/);
        if (m) byNumber[m[1]] = e.id;
      });
      function linkFor(token) {
        var t = token.trim();
        if (!t) return null;
        if (byText[t]) return byText[t];
        var n = t.match(/^§?\s*(\d+(?:\.\d+)*)(?:\s|$)/);
        if (n && byNumber[n[1]]) return byNumber[n[1]];
        var stripped = t.replace(/^§?\s*\d+(?:\.\d+)*\s+/, '');
        if (stripped !== t && byText[stripped]) return byText[stripped];
        return null;
      }
      Array.prototype.forEach.call(container.querySelectorAll('table'), function (table) {
        var ths = table.querySelectorAll('thead th');
        var cols = [];
        Array.prototype.forEach.call(ths, function (th, i) { if (th.textContent.trim() === '参照先') cols.push(i); });
        if (!cols.length) return;
        Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function (tr) {
          cols.forEach(function (ci) {
            var td = tr.children[ci];
            if (!td || td.querySelector('a')) return;
            var raw = td.textContent;
            var parts = raw.split(/(・|、|,|\s*\/\s*)/);
            var changed = false;
            var frag = document.createDocumentFragment();
            parts.forEach(function (part) {
              var id = linkFor(part);
              if (id) {
                var a = document.createElement('a');
                a.className = 'ref-link';
                a.href = '#' + id;
                a.textContent = part.trim();
                frag.appendChild(a);
                changed = true;
              } else {
                frag.appendChild(document.createTextNode(part));
              }
            });
            if (changed) { td.textContent = ''; td.appendChild(frag); }
          });
        });
      });
    })();

    // --- 改善課題1-273: 行数の多い表に、列見出しクリックでの並べ替えと行の絞り込みを付ける ---
    // 見出し単位の折りたたみ・絞り込み（1-244）とは独立した仕組み。閾値以下の表は変えない。
    var TABLE_TOOLS_THRESHOLD = 20;
    function tableText(cell) { return (cell.textContent || '').trim(); }
    function compareCells(a, b) {
      var na = parseFloat(a.replace(/,/g, '')), nb = parseFloat(b.replace(/,/g, ''));
      if (!isNaN(na) && !isNaN(nb) && /^-?[\d.,]+$/.test(a) && /^-?[\d.,]+$/.test(b)) return na - nb;
      return a.localeCompare(b, 'ja');
    }
    function attachTableTools(table) {
      var tbody = table.querySelector('tbody');
      if (!tbody) return null;
      var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      if (rows.length <= TABLE_TOOLS_THRESHOLD) return null;
      var originalOrder = rows.slice();
      var wrap = table.parentNode;
      var host = wrap.parentNode && wrap.parentNode.classList.contains('table-scroll-shell') ? wrap.parentNode : wrap;
      var tools = document.createElement('div');
      tools.className = 'table-tools';
      var input = document.createElement('input');
      input.type = 'search'; input.placeholder = '行を絞り込む'; input.setAttribute('aria-label', '表の行を文字列で絞り込む');
      var count = document.createElement('span'); count.className = 'table-filter-count';
      count.textContent = rows.length + '行';
      tools.appendChild(input); tools.appendChild(count);
      host.parentNode.insertBefore(tools, host);
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase(); var shown = 0;
        rows.forEach(function (tr) {
          var hit = !q || (tr.textContent || '').toLowerCase().indexOf(q) >= 0;
          tr.classList.toggle('is-filtered', !hit); if (hit) shown += 1;
        });
        count.textContent = q ? shown + '行が一致（全' + rows.length + '行）' : rows.length + '行';
      });
      table.classList.add('sortable-table');
      var ths = Array.prototype.slice.call(table.querySelectorAll('thead th'));
      ths.forEach(function (th, ci) {
        th.setAttribute('aria-sort', 'none');
        th.addEventListener('click', function () {
          var current = th.getAttribute('aria-sort');
          var next = current === 'ascending' ? 'descending' : (current === 'descending' ? 'none' : 'ascending');
          ths.forEach(function (o) { o.setAttribute('aria-sort', 'none'); });
          th.setAttribute('aria-sort', next);
          var ordered;
          if (next === 'none') ordered = originalOrder.slice();
          else {
            ordered = rows.slice().sort(function (a, b) {
              var r = compareCells(tableText(a.children[ci] || {}), tableText(b.children[ci] || {}));
              return next === 'ascending' ? r : -r;
            });
          }
          ordered.forEach(function (tr) { tbody.appendChild(tr); });
        });
      });
      return tools;
    }
    // --- 改善課題1-295: テストケース一覧を CSV として書き出す ---
    // 表示用に整形済みの DOM ではなく、埋め込みの原本（Markdown 文字列）から直接パースする。
    // 並べ替え・絞り込みの状態を反映せず、常に元の順序で全件を書き出す。
    var CSV_EXTRA_COLUMNS = ['実施日', '実施者', '結果', '実際の結果', '起票番号', '実施時の備考'];
    var CSV_CASE_HEADS = ['ケース名', '対象（関数名）'];
    var CSV_CASE_HEADING = 'テストケース一覧';
    function splitTableRowRaw(line) {
      var t = line.trim();
      if (t.charAt(0) === '|') t = t.slice(1);
      if (t.charAt(t.length - 1) === '|') t = t.slice(0, -1);
      return t.split('|').map(function (c) { return c.trim(); });
    }
    function findCaseTables(md) {
      var lines = md.split('\n'); var found = []; var heading = '';
      for (var i = 0; i < lines.length; i += 1) {
        if (/^#{1,6}\s/.test(lines[i])) { heading = lines[i]; continue; }
        if (lines[i].charAt(0) !== '|') continue;
        var cells = splitTableRowRaw(lines[i]);
        if (CSV_CASE_HEADS.indexOf(cells[0]) < 0 && heading.indexOf(CSV_CASE_HEADING) < 0) { continue; }
        if (!/^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) continue;
        var rows = [], j = i + 2;
        while (j < lines.length && lines[j].charAt(0) === '|') { rows.push(splitTableRowRaw(lines[j])); j += 1; }
        found.push({ header: cells, rows: rows });
        i = j;
      }
      return found;
    }
    function csvCell(v) {
      var t = String(v == null ? '' : v).replace(/`/g, '');
      return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }
    function buildCaseCsv(table) {
      var header = table.header.concat(CSV_EXTRA_COLUMNS);
      var lines = [header.map(csvCell).join(',')];
      table.rows.forEach(function (r) {
        var cells = r.slice(0, table.header.length);
        while (cells.length < table.header.length) cells.push('');
        CSV_EXTRA_COLUMNS.forEach(function () { cells.push(''); });
        lines.push(cells.map(csvCell).join(','));
      });
      return '\uFEFF' + lines.join('\r\n') + '\r\n';
    }
    var rawMd = (function () { var el = document.getElementById('doc-md'); try { return el ? JSON.parse(el.textContent) : ''; } catch (e) { return ''; } })();
    var caseTables = rawMd ? findCaseTables(rawMd) : [];
    window.__docBuildCaseCsv = function (index) { var t = caseTables[index || 0]; return t ? buildCaseCsv(t) : null; };
    function csvFileName() {
      var title = (heroTitle.textContent || document.title || '文書').trim().replace(/[\\/:*?"<>|]/g, '_');
      return title + '_テストケース一覧.csv';
    }
    function downloadCsv(text) {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = csvFileName();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    var caseTableIndex = 0;
    Array.prototype.forEach.call(container.querySelectorAll('table'), function (table) {
      var tools = attachTableTools(table);
      var firstHead = table.querySelector('thead th');
      var sec = table.closest ? table.closest('.sec-block') : null;
      var secLabel = sec ? (sec.querySelector('.sec-label') || {}).textContent || '' : '';
      var isCaseTable = firstHead && (CSV_CASE_HEADS.indexOf(tableText(firstHead)) >= 0 || secLabel.indexOf(CSV_CASE_HEADING) >= 0);
      if (isCaseTable && caseTables.length > caseTableIndex) {
        var idx = caseTableIndex; caseTableIndex += 1;
        if (!tools) {
          tools = document.createElement('div'); tools.className = 'table-tools';
          var wrap = table.parentNode;
          var host = wrap.parentNode && wrap.parentNode.classList.contains('table-scroll-shell') ? wrap.parentNode : wrap;
          host.parentNode.insertBefore(tools, host);
        }
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'csv-export';
        btn.textContent = 'CSVを書き出す（記入欄つき）';
        btn.addEventListener('click', function () { downloadCsv(buildCaseCsv(caseTables[idx])); });
        tools.appendChild(btn);
      }
    });

    var firstLink = tocList.querySelector('.toc-link');
    if (firstLink) firstLink.classList.add('active');
  })();
})();
</script>

<script>
(function(){
  var links = document.querySelectorAll('.toc-link');
  var sections = document.querySelectorAll('.sec-block');
  var mainEl = document.getElementById('main-scroll');

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function fragmentToId(fragment) {
    var raw = fragment && fragment.charAt(0) === '#' ? fragment.substring(1) : (fragment || '');
    if (!raw) return '';
    try {
      return decodeURIComponent(raw);
    } catch (error) {
      return '';
    }
  }

  function scrollToFragment(fragment, behavior) {
    var targetId = fragmentToId(fragment);
    var target = targetId ? document.getElementById(targetId) : null;
    if (!target) return false;
    if (window.__docOpenFoldsFor) window.__docOpenFoldsFor(targetId);
    target.scrollIntoView({behavior: behavior, block:'start'});
    return true;
  }

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(l){l.classList.remove('active')});
        var a = Array.prototype.find.call(links, function (link) {
          return link.getAttribute('href') === '#' + e.target.id;
        });
        if(a) a.classList.add('active');
      }
    });
  },{root: mainEl, rootMargin:'-10% 0px -80% 0px'});
  sections.forEach(function(s){observer.observe(s)});

  links.forEach(function(l){
    l.addEventListener('click',function(e){
      e.preventDefault();
      var href = this.getAttribute('href');
      if(scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
        if (window.history && window.history.pushState) window.history.pushState(null, '', href);
        else window.location.hash = fragmentToId(href);
      }
    });
  });

  if (window.location.hash) {
    requestAnimationFrame(function(){
      scrollToFragment(window.location.hash, 'auto');
    });
  }

  if (typeof document.addEventListener === 'function') document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a.ref-link') : null;
    if (!a) return;
    e.preventDefault();
    var href = a.getAttribute('href');
    if (scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
      if (window.history && window.history.pushState) window.history.pushState(null, '', href);
      else window.location.hash = fragmentToId(href);
    }
  });

  window.addEventListener('popstate', function(){
    requestAnimationFrame(function(){
      if (!scrollToFragment(window.location.hash, 'auto') && mainEl) {
        mainEl.scrollTo({top: 0, behavior: 'auto'});
      }
    });
  });
})();
</script>
