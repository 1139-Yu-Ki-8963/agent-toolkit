<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOC_TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;icon_names=info,priority_high,warning&amp;display=block" />
<style>
/* TOKENS_CSS */
/* SHELL_CSS */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
a { text-decoration: none; }
a:hover { text-decoration: underline; }

:root { --section-gap: clamp(28px, 4vw, 44px); }

/* 文書 2 カラム（目次 + 本文。目次は共通サイドバーへ統合済み） */
.dp-layout { display: block; margin-top: 28px; }

.toc-link {
  display: block; padding: 6px 10px; margin-left: -1.5px;
  border-left: 3px solid transparent;
  color: var(--sub); font-size: 12.5px; font-weight: 450; line-height: 1.4;
  transition: color .12s, border-color .12s;
}
.toc-link:hover { color: var(--text); border-left-color: var(--accent); text-decoration: none; }
.toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.dp-panel {
  width: 100%; min-width: 0; max-width: min(2200px, 96vw);
  border: 1.5px solid var(--line2); background: var(--panel);
  padding: 32px 40px; counter-reset: sec-num;
}

/* section */
.sec-block { margin-bottom: var(--section-gap); scroll-margin-top: 24px; }
.sec-label {
  counter-increment: sec-num;
  display: flex; align-items: baseline; gap: 10px;
  font-size: 16.5px; font-weight: 700; color: var(--text);
  margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.sec-label::before {
  content: counter(sec-num, decimal-leading-zero);
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--stamp);
}

/* baseline prose（セクション固有クラスの対象外になる見出し・段落・引用・区切り線） */
#doc-content h3 { font-size: 1.05rem; margin: 20px 0 8px; color: var(--text); }
#doc-content h4 { font-size: 0.95rem; margin: 16px 0 6px; color: var(--sub); }
#doc-content p { margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol { padding-left: 22px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ol li { margin: 4px 0; }
#doc-content ul { list-style: none; padding-left: 20px; margin: 8px 0; font-size: 13.5px; color: var(--sub); line-height: 1.75; }
#doc-content ul li { position: relative; margin: 4px 0; }
#doc-content ul li::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
#doc-content img { max-width: 100%; }
#doc-content code {
  background: var(--panel3); color: var(--text); padding: 1px 6px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 0.85em;
}
#doc-content blockquote {
  border-left: 3px solid var(--accent); margin: 12px 0; padding: 8px 16px;
  background: var(--panel3); color: var(--sub); font-size: 0.95rem;
}
#doc-content hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

/* 参照用付録（生コード全文・API全量列挙等の折りたたみ。ネイティブdetails/summaryのみ使用） */
.appendix-details {
  border: 1.5px solid var(--line2); background: var(--panel3);
  margin: 12px 0; padding: 0 14px 2px;
}
.appendix-details > summary {
  cursor: pointer; list-style: none; padding: 10px 0;
  font-size: 13px; font-weight: 700; color: var(--sub);
}
.appendix-details > summary::-webkit-details-marker { display: none; }
.appendix-details > summary::before {
  content: "\25b8"; display: inline-block; margin-right: 6px; color: var(--accent);
  transition: transform .12s;
}
.appendix-details[open] > summary::before { transform: rotate(90deg); }

/* rule items（トップレベル ul のチェックリスト装飾。箇条書きと同じ体裁） */
.rule-list { list-style: none; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; }
.rule-item { position: relative; font-size: 13.5px; line-height: 1.75; color: var(--sub); }
.rule-item::before { content: "\25b8"; position: absolute; left: -18px; color: var(--accent); }
.rule-item code {
  background: var(--panel); color: var(--text); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: .85em;
}

/* tables */
.table-scroll-shell { position: relative; min-width: 0; margin-bottom: 14px; }
.table-scroll-shell::before,
.table-scroll-shell::after {
  content: ""; position: absolute; z-index: 2; top: 1.5px; bottom: 1.5px; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.table-scroll-shell::before {
  left: 1.5px; background: linear-gradient(to right, var(--panel), transparent);
}
.table-scroll-shell::after {
  right: 1.5px; background: linear-gradient(to left, var(--panel), transparent);
}
.table-scroll-shell.can-scroll-left::before,
.table-scroll-shell.can-scroll-right::after { opacity: .94; }
.table-wrap {
  width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
  border: 1.5px solid var(--line2); scrollbar-gutter: stable;
}
table.data-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
table.data-table thead { position: sticky; top: 0; z-index: 1; }
table.data-table th {
  text-align: left; font-size: 11.5px; font-weight: 700; color: var(--headtext);
  background: var(--head); padding: 8px 12px; border-bottom: 1px solid var(--line2); white-space: nowrap;
}
table.data-table td {
  min-width: 11rem; max-width: 34rem; padding: 9px 12px;
  border-bottom: 1px solid var(--line); vertical-align: top;
  overflow-wrap: normal; word-break: normal; hyphens: none;
}
table.data-table td:first-child { min-width: 7rem; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table code {
  background: var(--panel3); color: var(--accent); padding: 1px 5px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
}

/* code blocks */
.code-block { width: 100%; border: 1px solid var(--line2); overflow: hidden; background: var(--code); margin-bottom: 14px; }
.code-block-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 11px; font-weight: 600;
  color: var(--muted); border-bottom: 1px solid var(--line2);
  letter-spacing: .03em;
}
.code-block pre {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--codetext);
}
#doc-content .code-block code {
  display: block; padding: 0; border: 0; background: transparent;
  color: inherit; font: inherit; white-space: pre;
}
.code-block .kw { color: #CBA6F7; }
.code-block .fn { color: #89B4FA; }
.code-block .str { color: #A6E3A1; }
.code-block .num { color: #FAB387; }
.code-block .cm { color: #6C7086; font-style: italic; }
.code-block .op { color: #89DCEB; }
.code-block .type { color: #F9E2AF; }

@media (max-width: 820px) {
  .dp-layout { margin-top: 20px; }
  .dp-panel { max-width: none; padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .toc-link, .table-scroll-shell::before, .table-scroll-shell::after { transition: none; }
}
</style>
</head>
<body>
<div class="pt">
  <div class="pt-grid"></div>
  <div class="pt-row">
    <!--SHELL_SIDEBAR-->
    <main class="pt-main" id="main-scroll">
      <div class="pt-head">
        <div class="pt-crumb"><a href="{{PORTAL_INDEX_HREF}}">TOP</a> ／ {{ACTIVE_CATEGORY_LABEL}} ／ <span class="pt-crumb-current">{{DOC_TITLE}}</span></div>
        <div class="pt-title-row">
          <h1 class="pt-title" id="dp-hero-title">{{DOC_TITLE}}</h1>
        </div>
      </div>
      <div class="dp-layout">
        <div class="dp-panel">
          <div id="doc-empty-callout" class="pt-callout pt-callout--caution" role="status" hidden>
            <p><span class="material-symbols-outlined pt-callout__icon" aria-hidden="true">info</span><span>この資料は本文が未記入です。情報が欠けているのか、調査の結果として空なのかは、この表示だけでは判別できません。</span></p>
          </div>
          <div id="doc-content"></div>
        </div>
      </div>
    </main>
  </div>
  <!--SHELL_FOOTER-->
</div>

<script type="application/json" id="doc-md">{{DOC_MARKDOWN_JSON}}</script>

<script>
(function () {
  var sourceElement = document.getElementById('doc-md');
  var contentElement = document.getElementById('doc-content');
  if (!sourceElement || !contentElement) return;
  var src = JSON.parse(sourceElement.textContent || '""');

  // frontmatter 除去
  src = src.replace(/^\s*---[\s\S]*?---\s*/, '');

  var lines = src.split('\n');
  var html = [];
  var inTable = false;
  var tableColCount = 0;
  var inList = false;
  var listType = '';
  var inBlockquote = false;
  var inFence = false;
  var fenceLines = [];
  // 改善課題1-51: 見出し以外の本文が無く、かつ表の行が無い場合に「未記入」を示す
  var hasBodyContent = false;
  var hasTableRow = false;

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(s) {
    var value = s.replace(/[\u0000-\u001f\u007f]+/g, '').trim();
    var scheme = value.match(/^([a-z][a-z0-9+.-]*):/i);
    if (scheme && !/^(?:https?|mailto)$/i.test(scheme[1])) return '';
    return escAttr(value);
  }
  // Markdown 文書間の参照（拡張子 .md）を .html へ書き換える処理は生成側
  // （generation-engine/scripts/build-portal.sh の link_related_material_paths / existingFileHref）
  // が担う。生成物が実際に出力される参照だけを解決するには参照先の実在確認が要り、
  // ブラウザ上で動く本スクリプトはファイルの実在を確認できないため、ここでは行わない
  // （改善課題1-40）。テンプレート側は safeUrl による無害化のみを行う。
  // この処理が扱う記法: 見出し・段落・強調（太字）・強調（斜体）・インラインコード・
  // コードブロック（囲み）・リンク・画像・表・引用・番号付きリスト・箇条書き・水平線。
  // 扱わない記法: 取り消し線（~~text~~）。記号がそのまま本文へ残るのは意図した挙動であり、
  // 変換の漏れではない。Markdown 仕様の全記法への対応は範囲外とし、必要になった時点で
  // 実装を足したうえで本一覧を書き換える。common-doc-template.html も同じ一覧に従う。
  function inlineFormat(s) {
    s = escHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(_, alt, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<img src="' + sanitizedUrl + '" alt="' + escAttr(alt) + '" style="max-width:100%">' : alt;
    });
    s = s.replace(/\[([^\]]+)\]\(([^()\s]+)\)/g, function(_, label, url) {
      var sanitizedUrl = safeUrl(url);
      return sanitizedUrl ? '<a href="' + sanitizedUrl + '">' + label + '</a>' : label;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  }

  // 表のセル分割: インラインコード（`...`）内の縦棒は列区切りとして扱わない
  function splitTableRow(line) {
    var masked = line.replace(/`[^`]*`/g, function (m) { return m.replace(/\|/g, '\u0001'); });
    masked = masked.replace(/\\\|/g, '\u0002');
    return masked.split('|')
      .filter(function (c, j, a) { return j > 0 && j < a.length - 1; })
      .map(function (c) { return c.replace(/\u0001/g, '|').replace(/\u0002/g, '|'); });
  }
  // 見出しの列数とデータ行の列数を照合し、食い違う行は最後の列へ寄せる（または不足分を空欄で補う）
  function normalizeRowCells(cells, colCount) {
    if (!colCount || cells.length === colCount) return cells;
    if (cells.length > colCount) {
      var head = cells.slice(0, colCount - 1);
      var tail = cells.slice(colCount - 1).join('|');
      return head.concat([tail]);
    }
    var padded = cells.slice();
    while (padded.length < colCount) padded.push('');
    return padded;
  }

  function closeList() {
    if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
  }
  function closeBlockquote() {
    if (inBlockquote) { html.push('</blockquote>'); inBlockquote = false; }
  }
  function closeTable() {
    if (inTable) { html.push('</tbody></table></div>'); inTable = false; tableColCount = 0; }
  }
  function closeFence() {
    html.push('<div class="code-block"><pre><code>' + escHtml(fenceLines.join('\n')) + '</code></pre></div>');
    hasBodyContent = true;
    inFence = false;
    fenceLines = [];
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // フェンス内はMarkdownとして解釈せず、終了行まで文字列のまま保持する
    if (inFence) {
      if (/^```\s*$/.test(trimmed)) closeFence();
      else fenceLines.push(line);
      continue;
    }
    if (/^```(?:\s*[^`\s]+)?\s*$/.test(trimmed)) {
      closeList(); closeBlockquote(); closeTable();
      inFence = true;
      fenceLines = [];
      continue;
    }

    // 空行
    if (!trimmed) { closeList(); closeBlockquote(); continue; }

    // 見出し
    var hm = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { closeList(); closeBlockquote(); closeTable(); var lv = hm[1].length; html.push('<h' + lv + '>' + inlineFormat(hm[2]) + '</h' + lv + '>'); continue; }

    // 水平線
    if (/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)) { closeList(); closeBlockquote(); closeTable(); html.push('<hr>'); continue; }

    // テーブル
    if (trimmed.indexOf('|') !== -1 && trimmed.charAt(0) === '|') {
      closeList(); closeBlockquote();
      if (/^[\s|:-]+$/.test(trimmed)) continue; // separator 行
      var cells = splitTableRow(trimmed);
      if (!inTable) {
        tableColCount = cells.length;
        html.push('<div class="table-wrap"><table><thead><tr>');
        cells.forEach(function(c) { html.push('<th>' + inlineFormat(c.trim()) + '</th>'); });
        html.push('</tr></thead><tbody>');
        inTable = true;
      } else {
        cells = normalizeRowCells(cells, tableColCount);
        html.push('<tr>');
        cells.forEach(function(c) { html.push('<td>' + inlineFormat(c.trim()) + '</td>'); });
        html.push('</tr>');
        hasTableRow = true;
      }
      continue;
    } else { closeTable(); }

    // 引用
    if (trimmed.charAt(0) === '>') {
      closeList(); closeTable();
      if (!inBlockquote) { html.push('<blockquote>'); inBlockquote = true; }
      html.push('<p>' + inlineFormat(trimmed.substring(1).trim()) + '</p>');
      // 改善課題1-51（4回目）: build-portal.sh が挿入する「本書の位置づけ」注記は
      // 本文が空の資料にも自動挿入されるため、この注記だけは本文ありの判定に数えない。
      // 注記の挿入元（build-portal.sh）に印（data属性等）を持たせられなかったため、
      // 文言一致による判定にとどめている（挿入元の文言が変わると判定が壊れる弱点あり）。
      if (trimmed.indexOf('**本書の位置づけ**') === -1) { hasBodyContent = true; }
      continue;
    } else { closeBlockquote(); }

    // 番号付きリスト
    var olm = trimmed.match(/^(\d+)\.\s+(.*)$/);
    if (olm) {
      closeTable(); closeBlockquote();
      if (!inList || listType !== 'ol') { closeList(); html.push('<ol>'); inList = true; listType = 'ol'; }
      html.push('<li>' + inlineFormat(olm[2]) + '</li>');
      hasBodyContent = true;
      continue;
    }

    // 箇条書き
    if (trimmed.charAt(0) === '-' && trimmed.charAt(1) === ' ') {
      closeTable(); closeBlockquote();
      if (!inList || listType !== 'ul') { closeList(); html.push('<ul>'); inList = true; listType = 'ul'; }
      html.push('<li>' + inlineFormat(trimmed.substring(2)) + '</li>');
      hasBodyContent = true;
      continue;
    }

    // 通常段落
    closeList(); closeTable(); closeBlockquote();
    html.push('<p>' + inlineFormat(trimmed) + '</p>');
    hasBodyContent = true;
  }
  if (inFence) closeFence();
  closeList(); closeTable(); closeBlockquote();

  contentElement.innerHTML = html.join('\n');
  // 改善課題1-51: 見出し以外の本文が無く、かつ表の行が無い場合に未記入の注記を表示する
  if (!hasBodyContent && !hasTableRow) {
    var emptyCallout = document.getElementById('doc-empty-callout');
    if (emptyCallout) emptyCallout.hidden = false;
  }

  // --- 拡張: h1 をヒーローへ、h2 をセクションブロック化 + 目次生成、テーブル/リストの装飾付与 ---
  (function enhance() {
    var container = document.getElementById('doc-content');
    var heroTitle = document.getElementById('dp-hero-title');
    var tocList = document.getElementById('toc-list');
    if (!container || !heroTitle || !tocList) return;

    // 最初の h1 はヒーローへ移し、本文からは除去する
    var h1 = container.querySelector('h1');
    if (h1) {
      heroTitle.textContent = h1.textContent;
      var navTitle = document.getElementById('screen-nav-title');
      if (navTitle) navTitle.textContent = '画面 / ' + h1.textContent.replace(/\s*画面(基本|詳細)設計書\s*$/, '');
      h1.parentNode.removeChild(h1);
    }

    // テーブルに data-table クラスを付与（sticky thead は CSS 側で対応済み）
    Array.prototype.forEach.call(container.querySelectorAll('table'), function (t) {
      t.classList.add('data-table');
    });

    // 横スクロールが必要な表だけ端フェードとキーボード操作の手掛かりを付ける
    var tableWraps = Array.prototype.slice.call(container.querySelectorAll('.table-wrap'));
    var updateScrollCues = [];
    tableWraps.forEach(function (wrap) {
      var shell = document.createElement('div');
      shell.className = 'table-scroll-shell';
      wrap.parentNode.insertBefore(shell, wrap);
      shell.appendChild(wrap);

      function updateScrollCue() {
        var overflowing = wrap.scrollWidth > wrap.clientWidth + 1;
        var atStart = wrap.scrollLeft <= 1;
        var atEnd = wrap.scrollLeft + wrap.offsetWidth >= wrap.scrollWidth - 1;
        shell.classList.toggle('can-scroll-left', overflowing && !atStart);
        shell.classList.toggle('can-scroll-right', overflowing && !atEnd);
        if (overflowing) {
          wrap.tabIndex = 0;
          wrap.setAttribute('role', 'region');
          wrap.setAttribute('aria-label', '横にスクロールできます');
        } else {
          wrap.removeAttribute('tabindex');
          wrap.removeAttribute('role');
          wrap.removeAttribute('aria-label');
        }
      }

      wrap.addEventListener('scroll', updateScrollCue, {passive: true});
      updateScrollCues.push(updateScrollCue);
    });

    function updateAllScrollCues() {
      updateScrollCues.forEach(function (updateScrollCue) { updateScrollCue(); });
    }
    window.addEventListener('resize', updateAllScrollCues);
    requestAnimationFrame(updateAllScrollCues);

    function sectionSlug(text) {
      var normalized = text.trim();
      if (normalized.normalize) normalized = normalized.normalize('NFKC');
      normalized = normalized.toLowerCase()
        .replace(/[^a-z0-9぀-ヿ㐀-鿿._~-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      return normalized || 'section';
    }

    // h2 ごとにセクションブロック化 + 目次エントリを生成
    var h2s = Array.prototype.slice.call(container.querySelectorAll('h2'));
    h2s.forEach(function (h2, idx) {
      var text = h2.textContent;
      var baseId = 'sec-' + sectionSlug(text);
      var id = baseId;
      var duplicate = 2;
      while (document.getElementById(id)) {
        id = baseId + '-' + duplicate;
        duplicate += 1;
      }

      var section = document.createElement('section');
      section.className = 'sec-block';
      section.id = id;

      var label = document.createElement('div');
      label.className = 'sec-label';
      label.textContent = text;
      section.appendChild(label);

      h2.parentNode.insertBefore(section, h2);
      var node = h2.nextSibling;
      h2.parentNode.removeChild(h2);
      while (node && !(node.nodeType === 1 && node.tagName === 'H2')) {
        var next = node.nextSibling;
        section.appendChild(node);
        node = next;
      }

      // §16 要確認事項一覧: 行数を自動判定し、1行以上なら重要度コールアウト（警告）を付与する。
      // 0件は通常表示のまま（目視判断に依存させない機械判定）。
      if (/要確認事項一覧/.test(text)) {
        var unresolvedRowCount = section.querySelectorAll('table.data-table tbody tr').length;
        if (unresolvedRowCount >= 1) {
          section.classList.add('pt-callout', 'pt-callout--warning');
          var unresolvedIcon = document.createElement('span');
          unresolvedIcon.className = 'material-symbols-outlined pt-callout__icon';
          unresolvedIcon.setAttribute('aria-hidden', 'true');
          unresolvedIcon.textContent = 'warning';
          label.insertBefore(unresolvedIcon, label.firstChild);
        }
      }

      // セクション直下（トップレベル）の ul のみをチェックリスト装飾する。入れ子リストは変換しない
      Array.prototype.forEach.call(section.children, function (child) {
        if (child.tagName === 'UL') {
          child.classList.add('rule-list');
          Array.prototype.forEach.call(child.children, function (li) {
            if (li.tagName !== 'LI') return;
            li.classList.add('rule-item');
            var content = document.createElement('div');
            while (li.firstChild) content.appendChild(li.firstChild);
            li.appendChild(content);
          });
        }
      });

      // 参照用付録（生コード全文・API全量列挙等）の折りたたみ化。
      // 見出しテキストが「付録:」で始まる h3/h4 を <details><summary> へ変換し、
      // 次の同階層以上の見出しまでの内容をまとめて折りたたむ（JSトグルなし・ネイティブdetails利用）。
      (function wrapAppendixHeadings() {
        function headingLevel(el) { return Number(el.tagName.charAt(1)); }
        var heading = label.nextElementSibling;
        while (heading) {
          var nextHeading = heading.nextElementSibling;
          var isHeading = /^H[1-6]$/.test(heading.tagName);
          if (isHeading && /^付録[:：]/.test((heading.textContent || '').trim())) {
            var level = headingLevel(heading);
            var details = document.createElement('details');
            details.className = 'appendix-details';
            var summary = document.createElement('summary');
            summary.textContent = heading.textContent;
            details.appendChild(summary);
            section.insertBefore(details, heading);
            section.removeChild(heading);
            var node = nextHeading;
            while (node && !(node.nodeType === 1 && /^H[1-6]$/.test(node.tagName) && headingLevel(node) <= level)) {
              var following = node.nextElementSibling;
              details.appendChild(node);
              node = following;
            }
            heading = node;
            continue;
          }
          heading = nextHeading;
        }
      })();

      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'toc-link';
      a.href = '#' + id;
      var label2 = document.createElement('span');
      label2.textContent = text;
      a.appendChild(label2);
      li.appendChild(a);
      tocList.appendChild(li);
    });

    var firstLink = tocList.querySelector('.toc-link');
    if (firstLink) firstLink.classList.add('active');
  })();
})();
</script>

<script>
(function(){
  var links = document.querySelectorAll('.toc-link');
  var sections = document.querySelectorAll('.sec-block');
  var mainEl = document.getElementById('main-scroll');

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function fragmentToId(fragment) {
    var raw = fragment && fragment.charAt(0) === '#' ? fragment.substring(1) : (fragment || '');
    if (!raw) return '';
    try {
      return decodeURIComponent(raw);
    } catch (error) {
      return '';
    }
  }

  function scrollToFragment(fragment, behavior) {
    var targetId = fragmentToId(fragment);
    var target = targetId ? document.getElementById(targetId) : null;
    if (!target) return false;
    target.scrollIntoView({behavior: behavior, block:'start'});
    return true;
  }

  var linkBySectionId = {};
  links.forEach(function(l){
    var href = l.getAttribute('href');
    if (href && href.charAt(0) === '#') linkBySectionId[href.substring(1)] = l;
  });

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(l){l.classList.remove('active')});
        var a = linkBySectionId[e.target.id];
        if(a) a.classList.add('active');
      }
    });
  },{root: mainEl, rootMargin:'-10% 0px -80% 0px'});
  sections.forEach(function(s){observer.observe(s)});

  links.forEach(function(l){
    l.addEventListener('click',function(e){
      e.preventDefault();
      var href = this.getAttribute('href');
      if(scrollToFragment(href, prefersReducedMotion() ? 'auto' : 'smooth')) {
        if (window.history && window.history.pushState) window.history.pushState(null, '', href);
        else window.location.hash = fragmentToId(href);
      }
    });
  });

  if (window.location.hash) {
    requestAnimationFrame(function(){
      scrollToFragment(window.location.hash, 'auto');
    });
  }

  window.addEventListener('popstate', function(){
    requestAnimationFrame(function(){
      if (!scrollToFragment(window.location.hash, 'auto') && mainEl) {
        mainEl.scrollTo({top: 0, behavior: 'auto'});
      }
    });
  });
})();
</script>
