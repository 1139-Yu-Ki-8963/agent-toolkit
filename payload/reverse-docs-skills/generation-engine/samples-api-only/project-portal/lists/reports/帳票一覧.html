<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳票一覧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;icon_names=info,priority_high,warning&amp;display=block" />
<style>
  /* 設計ポータルのデザイントークン。
   本ファイルの全文が、ビルド時に各テンプレートのトークン注入マーカーへ差し込まれる。
   既定はダークテーマ。ライトは OS 設定または data-theme="light" で切り替える。
   色は 26 種の基本トークンだけをテーマ別に定義し、
   既存の別名トークンは var() 参照でテーマへ自動追従させる。 */

:root {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-synthesis: none;

  /* 基本色（ダーク） */
  --bg: #0F1217;
  --panel: #161C23;
  --panel2: #1C232E;
  --panel3: #141A23;
  --line: #2B3443;
  --line2: #3A4658;
  --text: #E7ECF4;
  --sub: #A8B3C3;
  --muted: #8A96A7;
  --faint: #798496;
  --accent: #4CC2FE;
  --accent-hi: #9ADCFF;
  --accent-soft: rgba(76,194,255,0.17);
  /* 濃色ヘッダのハイライト。背景色を差し替えず元の背景へ重ねるため、明暗どちらの配色でも文字との明度差を保つ */
  --head-hl: rgba(255,255,255,0.16);
  --stamp: #FF6E4F;
  --stamp-soft: rgba(255,110,78,0.16);
  --green: #4ADE81;
  --green-soft: rgba(74,222,129,0.16);
  --grid: rgba(255,255,255,0.036);
  --head: #202B3B;
  --headtext: #E7ECF4;
  --code: #0B0E13;
  --codetext: #C9E8FF;
  --navon: #EAF6FF;
  --chipontext: #0F1217;
  --rowopen: #1A212B;
  --neutral-soft: rgba(255,255,255,0.06);

  /* 別名。既存テンプレートの参照を壊さないために残す。値は基本色を参照するのでテーマに自動追従する */
  --panel-2: var(--panel2);
  --border: var(--line);
  --border-strong: var(--line2);
  --text-sub: var(--sub);
  --text-muted: var(--muted);
  --accent-2: var(--accent-hi);
  --accent-border: var(--accent);
  --gold: var(--stamp);
  --gold-soft: var(--stamp-soft);
  --gold-border: var(--stamp);
  --warn: var(--stamp);
  --danger: var(--stamp);
  --danger-soft: var(--stamp-soft);
  --success: var(--green);
  --success-soft: var(--green-soft);
  --highlight: var(--accent);
  --highlight-soft: var(--accent-soft);
  --highlight-border: var(--accent);
  --nav-tag: var(--faint);
  --nav-tag-soft: var(--neutral-soft);
  --self-tag: var(--green);
  --self-tag-soft: var(--green-soft);
  --code-bg: var(--code);
  --code-fg: var(--codetext);
  --cat-list: var(--accent);
  --cat-standards: var(--accent);
  --cat-design: var(--accent);
  --cat-project: var(--accent);

  /* 非色トークン。テーマで変えない */
  --font-body: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  --mono: "SFMono-Regular","Menlo","Cascadia Code","Consolas",monospace;
  --radius: 0;
  --radius-sm: 0;
  --shadow-sm: 3px 3px 0 var(--accent-soft);
  --shadow-md: 4px 4px 0 var(--accent-soft);
  --sidebar-w: 248px;
  --page-gutter: 40px;
  --grid-size: 24px;
}

/* OS がライト設定で、かつダークを明示指定していない場合 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F4F8;
    --panel: #FFFFFF;
    --panel2: #E9EEF4;
    --panel3: #F7F9FC;
    --line: #D8DFE8;
    --line2: #243040;
    --text: #1A222E;
    --sub: #4B5A70;
    --muted: #58657A;
    --faint: #627387;
    --accent: #0272AC;
    --accent-hi: #075985;
    --accent-soft: rgba(2,132,199,0.10);
    --stamp: #BF3C22;
    --stamp-soft: rgba(217,72,43,0.12);
    --green: #137538;
    --green-soft: rgba(21,128,61,0.16);
    --grid: rgba(16,34,64,0.05);
    --head: #243040;
    --headtext: #F1F4F8;
    --code: #101722;
    --codetext: #C9E8FF;
    --navon: #102A43;
    --chipontext: #FFFFFF;
    --rowopen: #F0F4F9;
    --neutral-soft: rgba(16,34,64,0.06);
  }
}

/* ユーザーがライトを明示指定した場合 */
[data-theme="light"] {
  --bg: #F1F4F8;
  --panel: #FFFFFF;
  --panel2: #E9EEF4;
  --panel3: #F7F9FC;
  --line: #D8DFE8;
  --line2: #243040;
  --text: #1A222E;
  --sub: #4B5A70;
  --muted: #58657A;
  --faint: #627387;
  --accent: #0272AC;
  --accent-hi: #075985;
  --accent-soft: rgba(2,132,199,0.10);
  --stamp: #BF3C22;
  --stamp-soft: rgba(217,72,43,0.12);
  --green: #137538;
  --green-soft: rgba(21,128,61,0.16);
  --grid: rgba(16,34,64,0.05);
  --head: #243040;
  --headtext: #F1F4F8;
  --code: #101722;
  --codetext: #C9E8FF;
  --navon: #102A43;
  --chipontext: #FFFFFF;
  --rowopen: #F0F4F9;
  --neutral-soft: rgba(16,34,64,0.06);
}

/* ユーザーがダークを明示指定した場合。OS がライトでも :root の既定値へ戻す */
[data-theme="dark"] {
  --bg: #0F1217;
  --panel: #161C23;
  --panel2: #1C232E;
  --panel3: #141A23;
  --line: #2B3443;
  --line2: #3A4658;
  --text: #E7ECF4;
  --sub: #A8B3C3;
  --muted: #8A96A7;
  --faint: #798496;
  --accent: #4CC2FE;
  --accent-hi: #9ADCFF;
  --accent-soft: rgba(76,194,255,0.17);
  --stamp: #FF6E4F;
  --stamp-soft: rgba(255,110,78,0.16);
  --green: #4ADE81;
  --green-soft: rgba(74,222,129,0.16);
  --grid: rgba(255,255,255,0.036);
  --head: #202B3B;
  --headtext: #E7ECF4;
  --code: #0B0E13;
  --codetext: #C9E8FF;
  --navon: #EAF6FF;
  --chipontext: #0F1217;
  --rowopen: #1A212B;
  --neutral-soft: rgba(255,255,255,0.06);
}
  /* 設計ポータルの共通シェル。サイドバー・メインペイン・フッター・方眼紙背景・ページヘッダの
   共通クラスを定義する。色と寸法は tokens.css のトークンだけを参照し、実値を直書きしない。
   本ファイルの全文は、ビルド時に各テンプレートのシェル注入マーカーへ差し込まれる。 */

.pt {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.7;
}
.pt *, .pt *::before, .pt *::after { box-sizing: border-box; }
.pt a { color: var(--accent); text-decoration: none; }
.pt a:hover { color: var(--accent-hi); text-decoration: underline; }
.pt ::selection { background: var(--accent-soft); }
.pt :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.pt-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
}

.pt-row {
  position: relative;
  z-index: 1;
  display: flex;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

/* サイドバー */
.pt-sidebar {
  width: var(--sidebar-w);
  flex: none;
  border-right: 1.5px solid var(--line2);
  background: var(--panel3);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.pt-brand { padding: 20px 20px 16px; border-bottom: 1.5px solid var(--line2); }
.pt-brand-stamp { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--stamp); font-weight: 600; }
.pt-brand-name { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px; line-height: 1.35; }
.pt-brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 5px; }

/* サイト切替（モノレポ複数サイト時のみ JS が pt-brand-name を差し替える） */
.pt-brand-switch { position: relative; }
.pt-brand-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 4px;
  border: 0;
  background: transparent;
  padding: 0;
  appearance: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1.35;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.pt-brand-toggle:hover { color: var(--accent); }
.pt-brand-caret {
  flex: none;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--text-muted);
  transition: transform 0.12s;
}
.pt-brand-toggle[aria-expanded="true"] .pt-brand-caret { transform: rotate(180deg); }
.pt-brand-list {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin-top: 8px;
  border: 1.5px solid var(--border);
  background: var(--panel-2);
  z-index: 2;
}
.pt-brand-list-item {
  display: block;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-sub);
}
a.pt-brand-list-item:hover { background: var(--panel3); color: var(--text); text-decoration: none; }
.pt-brand-list-item.is-current { color: var(--text-muted); font-weight: 600; cursor: default; }

.pt-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.pt-nav-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-nav-item:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-nav-item.is-active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-nav-num { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.pt-nav-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* 現在地のナビ項目に限り、番号と件数の文字色をコントラスト基準（4.5:1）を満たす値へ個別に上げる（改善課題1-49）。
   --muted/--faint 本体は変更しない（他の使用箇所へ影響するため）。tokens.css と同じ4ブロック切り替えに揃える。 */
:root {
  --nav-current-num: #919DAE;
  --nav-current-count: #929DAF;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --nav-current-num: #5E6B7E;
    --nav-current-count: #5B6C80;
  }
}
[data-theme="light"] {
  --nav-current-num: #5E6B7E;
  --nav-current-count: #5B6C80;
}
[data-theme="dark"] {
  --nav-current-num: #919DAE;
  --nav-current-count: #929DAF;
}
.pt-nav-item.is-active .pt-nav-num { color: var(--nav-current-num); }
.pt-nav-item.is-active .pt-nav-count { color: var(--nav-current-count); }

/* 文書ビューア型ページの章目次ブロック（旧 .dp-toc を共通サイドバーへ統合） */
.pt-doc-nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; border-top: 1.5px solid var(--line2); }
.pt-doc-nav__group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 5px; }
.pt-doc-nav .nav-item,
.pt-doc-nav .back-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  color: var(--sub);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.pt-doc-nav .nav-item:hover,
.pt-doc-nav .back-link:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-doc-nav .nav-item.active { color: var(--navon); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
.pt-doc-nav__toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.pt-doc-nav__toc a {
  display: block;
  padding: 6px 10px 6px 20px;
  font-size: 11px;
  color: var(--sub);
  border-left: 3px solid transparent;
  transition: all 0.12s;
}
.pt-doc-nav__toc a:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
.pt-doc-nav__toc a.active { color: var(--navon); border-left-color: var(--accent); font-weight: 600; }

.pt-theme {
  margin: auto 12px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: calc(100% - 24px);
  border: 1px solid var(--line2);
  background: transparent;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-theme:hover { border-color: var(--accent); color: var(--accent); }
.pt-theme-next { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.pt-sidebar-meta { padding: 14px 20px; font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.9; }

/* サイドバー開閉ボタン（狭幅時のみ表示。広幅では常に非表示） */
.pt-sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 30;
  width: 40px;
  height: 40px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1.5px solid var(--line2);
  background: var(--panel3);
  padding: 0;
  cursor: pointer;
}
.pt-sidebar-toggle span { display: block; width: 20px; height: 2px; background: var(--text); }

/* サイドバー開放中に背後を覆うオーバーレイ */
.pt-sidebar-scrim {
  position: fixed;
  inset: 0;
  z-index: 15;
  background: rgba(0, 0, 0, 0.5);
}
.pt-sidebar-scrim[hidden] { display: none; }

@media (max-width: 900px) {
  :root { --page-gutter: 16px; }
  .pt-sidebar-toggle { display: flex; }
  .pt-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 20;
    width: var(--sidebar-w);
    max-width: 82vw;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }
  .pt-sidebar.is-open { transform: translateX(0); }
  .pt-main { padding-top: 64px; }
}

/* メインペイン */
.pt-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 0 var(--page-gutter) 72px;
}
.pt-main.is-fixed { overflow-y: hidden; display: flex; flex-direction: column; padding-bottom: 24px; }

/* ページヘッダ */
.pt-head { flex: none; padding: 32px 0 16px; border-bottom: 2px solid var(--line2); }
.pt-crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pt-crumb-current { color: var(--text); }
.pt-title-row { display: flex; align-items: baseline; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.pt-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
.pt-title-sub { font-size: 12px; color: var(--muted); }

/* 汎用パーツ */
.pt-panel { background: var(--panel); border: 1.5px solid var(--line2); }
.pt-input {
  border: 1.5px solid var(--line2);
  background: var(--panel);
  padding: 8px 13px;
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: all 0.12s;
}
.pt-input:focus { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent-soft); }
.pt-seg { display: flex; border: 1px solid var(--line2); }
.pt-seg button {
  border: 0;
  border-right: 1px solid var(--line);
  padding: 7px 16px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  background: var(--panel);
  color: var(--sub);
  cursor: pointer;
  transition: all 0.12s;
}
.pt-seg button:last-child { border-right: 0; }
.pt-seg button.is-active { background: var(--accent); color: var(--chipontext); }
.pt-chip { font-size: 11px; border: 1px solid var(--line); background: var(--panel3); padding: 2px 8px; font-family: var(--mono); }
.pt-badge { font-size: 10.5px; font-weight: 600; padding: 2px 9px; }
.pt-badge.is-done { color: var(--accent); background: var(--accent-soft); }
.pt-badge.is-stale { color: var(--stamp); background: var(--stamp-soft); }
.pt-badge.is-todo { color: var(--muted); background: var(--neutral-soft); }
.pt-count { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Google Fonts障害時も3段階アイコンを保つ、公式サブセットのローカルフォールバック */
@font-face {
  font-family: "Material Symbols Outlined Local";
  font-style: normal;
  font-weight: 400;
  font-display: block;

/* 重要度コールアウト。見出しを先頭要素に置き、色帯とMaterial Symbolsを併用する */
.pt-callout {
  --callout-color: var(--accent);
  --callout-soft: var(--accent-soft);
  position: relative;
  background: var(--callout-soft);
  color: var(--text);
  box-shadow: inset 5px 0 0 var(--callout-color);
}
.pt-callout__icon {
  display: none;
  margin-right: 0.55em;
  color: var(--callout-color);
  font-family: "Material Symbols Outlined", "Material Symbols Outlined Local";
  font-size: 1.45em;
  font-style: normal;
  font-weight: 400;
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  line-height: 1;
  vertical-align: -0.12em;
}
.pt-callout > :first-child > .pt-callout__icon { display: inline-block; }
.pt-callout--caution {
  --callout-color: var(--accent);
  --callout-soft: var(--accent-soft);
}
.pt-callout--warning {
  --callout-color: var(--stamp);
  --callout-soft: var(--stamp-soft);
}
.pt-callout--important {
  --callout-color: var(--green);
  --callout-soft: var(--green-soft);
}

/* 表 */
/* 横スクロール可能な表であることを示す端フェード（JS不要のCSSのみの手掛かり）。
   background-attachment の local/scroll の組合せで、覆いレイヤー(local)はスクロール量に
   応じて中身と一緒に動き、影レイヤー(scroll)は要素の表示領域に固定されたまま覆いの下に隠れる。
   これにより端まで到達すると自動的に影が消え、途中では両端に影が現れる。 */
.pt-tablewrap {
  flex: 0 1 auto; min-height: 0; overflow: auto; border: 1.5px solid var(--line2);
  background-color: var(--panel);
  background-image:
    linear-gradient(to right, var(--panel) 40%, transparent),
    linear-gradient(to left, var(--panel) 40%, transparent),
    linear-gradient(to right, color-mix(in srgb, var(--text) 22%, transparent), transparent),
    linear-gradient(to left, color-mix(in srgb, var(--text) 22%, transparent), transparent);
  background-repeat: no-repeat;
  background-size: 30px 100%, 30px 100%, 14px 100%, 14px 100%;
  background-position: left, right, left, right;
  background-attachment: local, local, scroll, scroll;
}
/* 固定列を持つ表専用の横スクロール手掛かり。
   固定列（position:sticky）は不透明な背景を持つため、影を表そのものの background として
   置くと固定列の下に隠れてしまう（背景は常に子要素より奥の層に描画されるため、子要素の
   z-index をどれだけ上げても背景の上に出てくることはない）。
   代わりに表を包む専用のラッパーを置き、その ::before/::after を固定列より高い z-index で
   重ねることで、固定列の陰にならない位置に手掛かりを出す。表示のON/OFFはスクロール量に応じて
   共通ホスト（partials/shell-sidebar.html）の JS が can-scroll-left / can-scroll-right を切り替える。 */
.pt-scroll-shell { position: relative; min-width: 0; }
.pt-scroll-shell::before,
.pt-scroll-shell::after {
  content: ""; position: absolute; z-index: 20; top: 0; bottom: 0; width: 30px;
  opacity: 0; pointer-events: none; transition: opacity .12s;
}
.pt-scroll-shell::before {
  left: 0; background: linear-gradient(to right, color-mix(in srgb, var(--text) 22%, transparent), transparent);
}
.pt-scroll-shell::after {
  right: 0; background: linear-gradient(to left, color-mix(in srgb, var(--text) 22%, transparent), transparent);
}
.pt-scroll-shell.can-scroll-left::before,
.pt-scroll-shell.can-scroll-right::after { opacity: 1; }

.pt-tablewrap table { width: 100%; border-collapse: separate; border-spacing: 0; }
.pt-tablewrap thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--head);
  color: var(--headtext);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-align: left;
  padding: 9px 14px;
}
.pt-tablewrap tbody td { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; }
.pt-tablewrap tbody tr:hover td { background: var(--panel3); }
.pt-tablewrap tbody tr.is-open td { background: var(--rowopen); }
.pt-mono { font-family: var(--mono); font-size: 11.5px; color: var(--sub); }

/* フッター */
.pt-footer {
  position: relative;
  z-index: 1;
  flex: none;
  border-top: 1.5px solid var(--line2);
  background: var(--panel3);
  padding: 12px var(--page-gutter);
  display: flex;
  gap: 20px;
  align-items: baseline;
  flex-wrap: wrap;
}
.pt-footer-stamp { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; color: var(--stamp); font-weight: 600; }
.pt-footer-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.pt-footer-gen { margin-left: auto; font-size: 10.5px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .pt *, .pt *::before, .pt *::after { transition: none !important; }
}

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .summary-tiles { display: flex; gap: 14px; margin: 16px 0 0; flex-wrap: wrap; }
  .tile {
    flex: 1; background: var(--panel); border: 1.5px solid var(--line2);
    padding: 10px 18px; font-size: 0.85rem; color: var(--text-sub);
  }
  .tile strong { display: block; font-size: 1.3rem; color: var(--text); }

  .toolbar-area { flex-shrink: 0; padding: 8px 0; }
  .toolbar { display: flex; gap: 10px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
  .toolbar input[type="search"] { flex: 1; min-width: 220px; }
  .toolbar .note { font-size: 0.82rem; color: var(--text-muted); }

  .table-area { flex: 1; min-height: 0; overflow-y: auto; }
  /* 横スクロールの実要素。手掛かり（端の影）は固定列の陰にならない
     .pt-scroll-shell（delivery-payload/templates/partials/shell.css）側に持たせる。 */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.units thead { position: sticky; top: 0; z-index: 3; }

  section.module-group { margin: 18px 0; background: var(--panel); border: 1.5px solid var(--line2); padding: 16px 20px; min-width: 0; }
  section.module-group h2 { font-size: 1.05rem; margin: 0 0 12px; }

  table.units, table.screens {
    table-layout: fixed; width: 100%; min-width: 900px; border-collapse: collapse; font-size: 0.88rem;
  }
  table.units th, table.screens th {
    border-top: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top;
    white-space: normal; overflow: visible; font-size: 0.8em;
  }
  table.units td, table.screens td {
    border-top: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.units th {
    background: var(--panel-2); font-weight: 700; cursor: pointer; user-select: none;
  }
  table.units th:hover, table.screens th:hover { background: var(--accent-soft); cursor: pointer; }
  table.units td code {
    font-family: var(--mono);
    font-size: 0.85em; background: var(--panel-2); padding: 1px 5px;
  }

  /* 列幅の明示指定（data-key属性でシェブロン列挿入に影響されない） */
  table.units th[data-key="unitNameGuess"] { width: 25%; }
  table.units th[data-key="identifier"] { width: 45%; }
  table.units th[data-key="kind"] { width: 10%; }

  /* 固定列（シェブロン列・名前列・識別子列）: 横スクロール時も左端に固定する */
  table.units thead th:nth-child(1), table.units tbody td:nth-child(1) {
    position: sticky; left: 0; z-index: 2; background: var(--panel);
  }
  table.units thead th:nth-child(2), table.units tbody td:nth-child(2) {
    position: sticky; left: 32px; z-index: 2; background: var(--panel);
  }
  table.units thead th:nth-child(3), table.units tbody td:nth-child(3) {
    position: sticky; left: calc(32px + 25%); z-index: 2; background: var(--panel);
  }
  table.units thead th:nth-child(1),
  table.units thead th:nth-child(2),
  table.units thead th:nth-child(3) {
    background: var(--panel-2); z-index: 4;
  }

  /* ゼブラストライプ */
  table.units tbody tr:nth-child(even),
  table.screens tbody tr:nth-child(even) {
    background: color-mix(in srgb, var(--panel-2) 40%, transparent);
  }
  /* 行ホバー */
  table.units tbody tr:hover,
  table.screens tbody tr:hover {
    background: var(--accent-soft);
  }

  td code { overflow-wrap: break-word; word-break: break-all; }
  .badge { display: inline-block; font-size: 0.76rem; font-weight: 700; padding: 1px 8px; }
  .badge.high   { background: var(--success-soft); color: var(--success); }
  .badge.medium { background: var(--gold-soft); color: var(--gold); }
  .badge.low    { background: var(--accent-soft); color: var(--accent); }
  .badge.kind-generic    { background: var(--accent-soft); color: var(--accent); }
  .badge.kind-unresolved { background: var(--panel-2); color: var(--text-sub); }
  /* 未確認のバッジ。値なし（空セル）と区別が付くよう、控えめな色で示す */
  .badge.is-unconfirmed { color: var(--muted); border-color: var(--line2); }

  section.unresolved { margin-top: 24px; padding: 12px 16px; min-width: 0; }
  section.unresolved.empty { background: var(--panel-2); border: 1px solid var(--border); color: var(--text-muted); }
  section.unresolved.empty h2 { color: var(--text-muted); font-size: 0.95rem; margin: 0; }
  section.unresolved.has-items { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger); }
  section.unresolved.has-items h2 { color: var(--danger); font-size: 0.95rem; margin: 0 0 8px; }

  .pagination { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 16px 0; font-size: 0.85rem; }
  .pagination button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text-sub); cursor: pointer; padding: 4px 10px; font-family: inherit; font-size: 0.82rem; }
  .pagination button:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .page-info { color: var(--text-muted); }

  /* 一覧UI追加機能（コピーボタン・フィルタチップ・行クリック展開・CSVエクスポート） */
  .copy-btn { background: none; border: none; cursor: pointer; padding: 1px 3px; color: var(--text-muted); opacity: .35; vertical-align: middle; }
  tr:hover .copy-btn, .copy-btn:focus { opacity: 1; }
  .copy-btn:hover { color: var(--accent); }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .chip { font-size: .78rem; padding: 2px 10px; border: 1px solid var(--line2); background: var(--panel); color: var(--text-sub); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--chipontext); border-color: var(--accent); font-weight: 700; }
  .chip-label { font-size: .72rem; color: var(--text-muted); align-self: center; margin-left: 8px; }
  .chip-label:first-child { margin-left: 0; }
  tr.row-detail > td { background: var(--panel-2); font-size: .82rem; white-space: normal; border-left: 3px solid var(--accent); }
  .row-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0; }
  .row-detail dt { color: var(--text-muted); }
  .row-detail dd { margin: 0; word-break: break-all; }
  .csv-btn {
    white-space: nowrap; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-sub); cursor: pointer; padding: 5px 12px; font-size: 0.82rem; font-family: inherit;
  }
  .csv-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  td.unit-doc-links-cell { white-space: normal; overflow: visible; text-overflow: clip; }
  .unit-doc-links { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .unit-doc-slot {
    min-width: 0; min-height: 24px; display: flex; align-items: center; justify-content: center; gap: 2px;
    padding: 2px 3px; border: 1px solid var(--border); background: var(--panel-2); font-size: .72rem;
  }
  .unit-doc-link { color: var(--accent); text-decoration: none; font-size: .72rem; white-space: nowrap; }
  .unit-doc-link-secondary { padding-left: 2px; border-left: 1px solid var(--border); }
  .unit-doc-link:hover { text-decoration: underline; }
  .unit-doc-missing { color: var(--text-muted); }
  table.units tbody tr, table.screens tbody tr { cursor: pointer; }
  .expand-cell { transition: color 0.15s; }
  tr:hover .expand-cell { color: var(--accent); }
  tr[data-expanded="true"] .chevron svg { transform: rotate(90deg); }

  .detail-inner { padding: 12px 16px 14px 20px; }
  .detail-group { margin-bottom: 12px; }
  .detail-group:last-child { margin-bottom: 0; }
  .detail-group-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .detail-group-label.evidence { color: var(--gold); border-bottom-color: var(--gold-soft); }
  .detail-grid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
  .detail-grid dt { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }
  .detail-grid dd { margin: 0; font-size: 0.84rem; word-break: break-all; }

  .prov-badge { display: inline-block; font-size: 0.7em; padding: 1px 4px; margin-left: 4px; border: 1px solid; }
  .prov-badge.prov-measured { color: var(--accent); border-color: var(--accent); }
  .prov-badge.prov-inferred { color: var(--stamp); border-color: var(--stamp); }
  .prov-badge.prov-confirmed { color: var(--green); border-color: var(--green); }
</style>

     data-scroll-cues="auto" を持つホスト配下の .table-wrap / .pt-tablewrap のうち、

     いるため、包む時点では最終的な DOM 構造になっている。 */

    var hosts = Array.prototype.slice.call(document.querySelectorAll('[data-scroll-cues="auto"]'));
    hosts.forEach(function (host) {
      var wraps = Array.prototype.slice.call(host.querySelectorAll('.table-wrap, .pt-tablewrap'));
      wraps.forEach(function (wrap) {
        if (wrap.closest('.pt-scroll-shell')) return;
        var shell = document.createElement('div');
        shell.className = 'pt-scroll-shell';
        wrap.parentNode.insertBefore(shell, wrap);

    if (!shells.length) return;
    var updaters = [];
    shells.forEach(function (shell) {
      var wrap = shell.querySelector(':scope > .table-wrap, :scope > .pt-tablewrap');
      if (!wrap) return;

        var atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1;

    };

    if (optManifest.unitKind === 'table') {
      var crudTh = document.createElement('th');
      crudTh.setAttribute('data-key', 'crudRef');
      crudTh.style.width = '80px';
      crudTh.textContent = 'CRUD図';
      headRow.appendChild(crudTh);
      bodyRows.forEach(function (tr) {
        var td = document.createElement('td');
        var u = findUnit(tr);
        var ident = (u && u.identifier !== undefined && u.identifier !== null) ? String(u.identifier) : '';
        if (ident && ident !== '—') {
          var a = document.createElement('a');
          a.className = 'crud-link';
          a.href = '../../マトリクス・対応表/CRUD図/CRUD図.html?q=' + encodeURIComponent(ident);
          a.textContent = '参照';
          td.appendChild(a);
        }
        tr.appendChild(td);
      });
      extraCols += 1;
    }
    optTable.style.minWidth = (900 + extraCols * 140) + 'px';
  })();
</script>

<script>
  /* 1-170: unitKind=batch のみ、nameConfidence由来の確認済/推定バッジを名称セルに追加する。
     任意列(axes/column-spec)の有無に関わらず動作させるため、上のIIFEとは独立させる。 */
  (function () {
    var nameManifestEl = document.getElementById('unit-manifest');
    if (!nameManifestEl) return;
    var nameManifest;
    try { nameManifest = JSON.parse(nameManifestEl.textContent); } catch (e) { return; }
    if (!nameManifest || nameManifest.unitKind !== 'batch') return;

    var nameTable = document.getElementById('unit-table');
    if (!nameTable) return;
    var nameRows = Array.prototype.slice.call(nameTable.querySelectorAll('tbody tr'));

    var nameById = {};
    var nameByKey = {};
    (nameManifest.units || []).forEach(function (u) {
      if (u.unitId !== undefined && u.unitId !== null) nameById[String(u.unitId)] = u;
      if (u.unitKey !== undefined && u.unitKey !== null) nameByKey[String(u.unitKey)] = u;
    });

    nameRows.forEach(function (tr) {
      var idAttr = tr.getAttribute('data-unit-id') || '';
      var keyAttr = tr.getAttribute('data-unit-key') || '';
      var u = (idAttr && nameById[idAttr]) || (keyAttr && nameByKey[keyAttr]) || null;
      if (!u || !u.nameConfidence) return;
      var nameCell = tr.children[0];
      if (!nameCell) return;
      var badge = document.createElement('span');
      if (u.nameConfidence === 'confirmed') {
        badge.className = 'prov-badge prov-confirmed';
        badge.textContent = '確認済';
      } else if (u.nameConfidence === 'inferred') {
        badge.className = 'prov-badge prov-inferred';
        badge.textContent = '推定';
      } else {
        return;
      }
      nameCell.appendChild(badge);
    });
  })();
</script>

<script>
  (function () {
    var manifestEl = document.getElementById('unit-manifest');
    var manifest = {};
    try { manifest = JSON.parse(manifestEl.textContent); } catch (e) { /* ignore */ }

    var search = document.getElementById('unit-search');
    var table = document.getElementById('unit-table');
    if (!table) return;
    var tbody = table.querySelector('tbody');
    var allRows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));

    /* 1-65, 1-250: 読者向け成果物を行末尾の専用「関連資料」列に表示する。行クリックはこれまで通り
       ページ内展開のみを担い、a要素へのクリックは後段の行クリック展開ハンドラが
       ev.target.closest('.copy-btn,a,button') で除外する。 */
    (function () {
      /* 1-83: 「基本」「詳細」の資料リンクラベル(doc.label)は種別ごとに文書名が異なるため、
         build-unit-list.sh が design-unit-layout.json の phases.basic/detail から解決した
         値をビルド時に埋め込む(プレースホルダの定義はテンプレート冒頭コメントを見る)。
         group.label('基本'・'詳細'等)はグループ分類の短い見出しでありリンクの可視テキストに
         使うため、種別非依存のまま変更しない。 */
      var DOC_GROUPS = [
        {label: '基本', docs: [
          {label: '帳票基本設計書', pathField: 'designDocPath', kind: 'basic'}
        ]},
        {label: '詳細', docs: [
          {label: '帳票詳細設計書', pathField: 'detailDocPath', kind: 'detail'},
          {label: 'シーケンス図', shortLabel: '図', pathField: 'sequencePath', kind: 'sequence'}
        ]},
        {label: '結合', docs: [
          {label: '結合テスト仕様書', pathField: 'integrationTestCasePath', kind: 'integration-case'},
          {label: '結合テスト観点表', shortLabel: '観点', pathField: 'integrationTestViewpointPath', kind: 'integration-viewpoint'}
        ]},
        {label: '単体', docs: [
          {label: 'テストケース', pathField: 'testCasePath', kind: 'test'},
          {label: '単体テスト観点表', shortLabel: '観点', pathField: 'unitTestViewpointPath', kind: 'unit-viewpoint'}
        ]},
        {label: '確認', docs: [
          {label: '操作シナリオ仕様書', pathField: 'scenarioPath', kind: 'scenario'}
        ]}
      ];

      function isSafeRelativeUrl(v) {
        return typeof v === 'string' &&
          v.length > 0 &&
          v === v.trim() &&
          !/[\x00-\x1f\x7f]/.test(v) &&
          !/^[A-Za-z][A-Za-z0-9+.-]*:/.test(v) &&
          !/^[\/\\]/.test(v) &&
          v.indexOf('\\') === -1;
      }

      var units = (manifest && manifest.units) || [];
      function safeDocs(unit, group) {
        if (!unit) return [];
        return group.docs.filter(function (doc) { return isSafeRelativeUrl(unit[doc.pathField]); });
      }

      var completeCount = units.filter(function (unit) {
        return DOC_GROUPS.every(function (group) { return safeDocs(unit, group).length > 0; });
      }).length;
      if (completeCount > 0) {
        var summary = document.querySelector('.summary-tiles');
        if (summary) {
          var tile = document.createElement('div');
          tile.className = 'tile';
          tile.setAttribute('data-summary', 'complete-docs');
          var strong = document.createElement('strong');
          strong.textContent = String(completeCount);
          tile.appendChild(strong);
          tile.appendChild(document.createTextNode('資料完備数'));
          summary.insertBefore(tile, summary.firstChild);
        }
      }

      var headRow = table.querySelector('thead tr');
      if (!headRow) return;
      var th = document.createElement('th');
      th.textContent = '関連資料';
      th.style.width = '170px';
      headRow.appendChild(th);

      var viewById = {}, viewByKey = {};
      units.forEach(function (u) {
        if (u.unitId !== undefined && u.unitId !== null) viewById[String(u.unitId)] = u;
        if (u.unitKey !== undefined && u.unitKey !== null) viewByKey[String(u.unitKey)] = u;
      });
      allRows.forEach(function (tr) {
        var idAttr = tr.getAttribute('data-unit-id') || '';
        var keyAttr = tr.getAttribute('data-unit-key') || '';
        var unit = (idAttr && viewById[idAttr]) || (keyAttr && viewByKey[keyAttr]) || null;
        var td = document.createElement('td');
        td.className = 'unit-doc-links-cell';
        var links = document.createElement('div');
        links.className = 'unit-doc-links';
        DOC_GROUPS.forEach(function (group) {
          var slot = document.createElement('div');
          slot.className = 'unit-doc-slot';
          var docs = safeDocs(unit, group);
          if (docs.length === 0) {
            slot.classList.add('unit-doc-missing');
            slot.textContent = '—';
          } else {
            docs.forEach(function (doc, index) {
            var path = unit[doc.pathField];
            var link = document.createElement('a');
            link.href = path;
            link.className = 'unit-doc-link';
            if (index > 0) link.classList.add('unit-doc-link-secondary');
            link.setAttribute('data-kind', doc.kind);
            link.setAttribute('aria-label', doc.label);
            link.title = doc.label;
            link.textContent = index === 0 ? group.label : doc.shortLabel;
            slot.appendChild(link);
          });
          }
          links.appendChild(slot);
        });
        td.appendChild(links);
        tr.appendChild(td);
      });
    })();

    var PAGE_SIZE = 50;
    var currentPage = 0;
    var sortCol = -1;
    var sortAsc = true;

    var pagEl = document.getElementById('pagination');
    var pageInfo = document.getElementById('page-info');
    var btnFirst = document.getElementById('page-first');
    var btnPrev = document.getElementById('page-prev');
    var btnNext = document.getElementById('page-next');
    var btnLast = document.getElementById('page-last');

    function renderPage() {
      var q = search ? search.value.trim().toLowerCase() : '';
      closeAllDetails();
      var visible = allRows.filter(function (tr) {
        return rowMatches(tr, q);
      });

      if (sortCol >= 0) {
        visible.sort(function (a, b) {
          var av = a.children[sortCol].textContent.trim();
          var bv = b.children[sortCol].textContent.trim();
          var an = parseFloat(av), bn = parseFloat(bv);
          var cmp = (!isNaN(an) && !isNaN(bn)) ? (an - bn) : av.localeCompare(bv, 'ja');
          return sortAsc ? cmp : -cmp;
        });
      }

      var totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      if (currentPage < 0) currentPage = 0;
      var start = currentPage * PAGE_SIZE;
      var end = start + PAGE_SIZE;

      allRows.forEach(function (tr) { tr.style.display = 'none'; });
      visible.forEach(function (tr, i) {
        tr.style.display = (i >= start && i < end) ? '' : 'none';
        tbody.appendChild(tr);
      });

      if (pagEl) pagEl.style.display = visible.length <= PAGE_SIZE ? 'none' : '';
      if (pageInfo) pageInfo.textContent = (currentPage + 1) + ' / ' + totalPages + '（' + visible.length + '件）';
      if (btnFirst) btnFirst.disabled = currentPage === 0;
      if (btnPrev) btnPrev.disabled = currentPage === 0;
      if (btnNext) btnNext.disabled = currentPage >= totalPages - 1;
      if (btnLast) btnLast.disabled = currentPage >= totalPages - 1;
    }

    if (search) {
      search.addEventListener('input', function () {
        currentPage = 0;
        renderPage();
      });
    }

    table.querySelectorAll('th[data-key]').forEach(function (th) {
      th.addEventListener('click', function () {
        var colIndex = Array.prototype.indexOf.call(th.parentNode.children, th);
        if (sortCol === colIndex) { sortAsc = !sortAsc; } else { sortCol = colIndex; sortAsc = true; }
        table.querySelectorAll('th[data-key]').forEach(function (t) { t.removeAttribute('data-asc'); });
        th.setAttribute('data-asc', sortAsc);
        currentPage = 0;
        renderPage();
      });
    });

    if (btnFirst) btnFirst.addEventListener('click', function () { currentPage = 0; renderPage(); });
    if (btnPrev) btnPrev.addEventListener('click', function () { currentPage--; renderPage(); });
    if (btnNext) btnNext.addEventListener('click', function () { currentPage++; renderPage(); });
    if (btnLast) btnLast.addEventListener('click', function () {
      var q = search ? search.value.trim().toLowerCase() : '';
      var cnt = allRows.filter(function (tr) { return rowMatches(tr, q); }).length;
      currentPage = Math.max(0, Math.ceil(cnt / PAGE_SIZE) - 1);
      renderPage();
    });

    /* ===== 展開インジケータ（シェブロン列） ===== */
    (function () {
      var headRow = table.querySelector('thead tr');
      if (headRow) {
        var chTh = document.createElement('th');
        chTh.style.width = '32px';
        chTh.style.padding = '8px 4px';
        headRow.insertBefore(chTh, headRow.firstChild);
      }
      var CHEVRON_SVG = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;transition:transform .15s"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>';
      allRows.forEach(function (tr) {
        var chTd = document.createElement('td');
        chTd.style.width = '32px';
        chTd.style.textAlign = 'center';
        chTd.style.color = 'var(--text-muted)';
        chTd.style.padding = '8px 4px';
        chTd.className = 'expand-cell';
        chTd.innerHTML = '<span class="chevron">' + CHEVRON_SVG + '</span>';
        tr.insertBefore(chTd, tr.firstChild);
      });

    })();

    /* ===== 一覧UI追加機能: フィルタチップ / コピーボタン / 行クリック展開 / CSVエクスポート ===== */
    var headerCells = Array.prototype.slice.call(table.querySelectorAll('thead th'));
    var COL_COUNT = headerCells.length;
    /* チップ対象列は列見出し名で指定する（任意列スクリプトが追加した列も対象にできる） */
    var CHIP_COLUMNS = ['区分'];
    var EXTRA_CHIP_COLUMNS = { api: ['メソッド', '認証'], batch: [], report: ['出力形式', '出力契機'], external: ['方向', 'プロトコル'], message: ['種別'], test_viewpoint: ['テスト種別', '画面'] };
    (EXTRA_CHIP_COLUMNS[manifest.unitKind] || []).forEach(function (name) {
      if (CHIP_COLUMNS.indexOf(name) === -1) CHIP_COLUMNS.push(name);
    });
    var CHIP_COLS = [];
    CHIP_COLUMNS.forEach(function (name) {
      headerCells.forEach(function (th, i) {
        if (th.textContent.trim() === name && CHIP_COLS.indexOf(i) === -1) CHIP_COLS.push(i);
      });
    });
    var chipFilters = {};

    function rowMatches(tr, q) {
      if (q && tr.textContent.toLowerCase().indexOf(q) === -1) return false;
      for (var i = 0; i < CHIP_COLS.length; i++) {
        var col = CHIP_COLS[i];
        var sel = chipFilters[col];
        if (sel && sel.size > 0) {
          var cell = tr.children[col];
          if (!cell || !sel.has(cell.textContent.trim())) return false;
        }
      }
      return true;
    }

    function closeAllDetails() {
      Array.prototype.slice.call(tbody.querySelectorAll('tr.row-detail')).forEach(function (tr) {
        tr.parentNode.removeChild(tr);
      });
      allRows.forEach(function (tr) { tr.removeAttribute('data-expanded'); });
    }

    /* --- フィルタチップ --- */
    var chipBar = document.createElement('div');
    chipBar.className = 'filter-chips';
    var toolbarEl = document.querySelector('.toolbar');
    if (toolbarEl) toolbarEl.parentNode.insertBefore(chipBar, toolbarEl.nextSibling);

    var chipClearBtn = document.createElement('button');
    chipClearBtn.type = 'button';
    chipClearBtn.className = 'chip chip-clear';
    chipClearBtn.textContent = 'クリア';
    chipClearBtn.style.marginLeft = 'auto';
    chipClearBtn.style.display = 'none';
    chipClearBtn.addEventListener('click', function () {
      CHIP_COLS.forEach(function (c) { chipFilters[c].clear(); });
      Array.prototype.slice.call(chipBar.querySelectorAll('.chip[aria-pressed]')).forEach(function (b) {
        b.setAttribute('aria-pressed', 'false');
      });
      updateChipClearBtn();
      currentPage = 0;
      renderPage();
    });

    function updateChipClearBtn() {
      var any = CHIP_COLS.some(function (c) { return chipFilters[c].size > 0; });
      chipClearBtn.style.display = any ? '' : 'none';
    }

    CHIP_COLS.forEach(function (col) {
      chipFilters[col] = new Set();
      var values = [];
      allRows.forEach(function (tr) {
        var cell = tr.children[col];
        var v = cell ? cell.textContent.trim() : '';
        if (v && v !== '—' && values.indexOf(v) === -1) values.push(v);
      });
      if (values.length) {
        var groupLabel = document.createElement('span');
        groupLabel.className = 'chip-label';
        groupLabel.textContent = headerCells[col].textContent.trim();
        chipBar.appendChild(groupLabel);
      }
      values.forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.setAttribute('aria-pressed', 'false');
        b.textContent = v;
        b.addEventListener('click', function () {
          var pressed = b.getAttribute('aria-pressed') === 'true';
          if (pressed) { chipFilters[col].delete(v); } else { chipFilters[col].add(v); }
          b.setAttribute('aria-pressed', String(!pressed));
          updateChipClearBtn();
          currentPage = 0;
          renderPage();
        });
        chipBar.appendChild(b);
      });
    });
    chipBar.appendChild(chipClearBtn);

    /* --- コピーボタン --- */
    var COPY_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
    var CHECK_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    function copyText(text, done) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
      } else {
        fallbackCopy(text);
        done();
      }
    }

    function copyableText(text) {
      return text !== '' && text !== '—';
    }

    function makeCopyBtn(getText) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.setAttribute('aria-label', 'コピー');
      btn.innerHTML = COPY_ICON;
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        copyText(getText(), function () {
          btn.innerHTML = CHECK_ICON;
          setTimeout(function () { btn.innerHTML = COPY_ICON; }, 1200);
        });
      });
      return btn;
    }

    /* 全セルコピー: 値のあるセルすべてに付ける（任意列スクリプトが追加した列も対象） */
    allRows.forEach(function (tr) {
      Array.prototype.slice.call(tr.children).forEach(function (td) {
        var text = td.textContent.trim();
        if (!copyableText(text)) return;
        td.appendChild(makeCopyBtn(function () { return text; }));
      });
    });

    /* --- 行クリック展開: マニフェストJSONを直接参照し「仕様」「エビデンス」2グループに分離表示 --- */
    var DETAIL_SPEC_FIELDS = {
      api:      [['ioSummary', 'I/O概要'], ['authRequired', '認証'], ['callers', '呼び出し元画面']],
      table:    [['columnCount', 'カラム数'], ['mainColumns', '主要カラム'], ['foreignKeys', 'FK参照先']],
      batch:    [['schedule', 'スケジュール'], ['targetTables', '対象テーブル'], ['downstreamJobs', '後続ジョブ'], ['execMethod', '実行方法']],
      report:   [['format', '出力形式'], ['trigger', '出力契機']],
      external: [['direction', '方向'], ['protocol', 'プロトコル'], ['authMethod', '認証方式']],
      message:  [['messageText', '文言'], ['messageType', '種別'], ['sourceFile', '取り出し元'], ['usedScreen', '使用画面']]
    };
    var EVIDENCE_FIELDS = [
      ['confidence', 'confidence'],
      ['detectionMethod', '検出方式'],
      ['fileCount', '構成ファイル数'],
      ['sourceFile', '主ファイル'],
      ['unitId', (manifest.unitKind || '') + 'ID'],
      ['unitKey', (manifest.unitKind || '') + 'キー']
    ];

    var detailById = {};
    var detailByKey = {};
    (manifest.units || []).forEach(function (u) {
      if (u.unitId !== undefined && u.unitId !== null) detailById[String(u.unitId)] = u;
      if (u.unitKey !== undefined && u.unitKey !== null) detailByKey[String(u.unitKey)] = u;
    });

    function findDetailUnit(tr) {
      var idAttr = tr.getAttribute('data-unit-id') || '';
      if (idAttr && detailById[idAttr]) return detailById[idAttr];
      var keyAttr = tr.getAttribute('data-unit-key') || '';
      if (keyAttr && detailByKey[keyAttr]) return detailByKey[keyAttr];
      return null;
    }

    function detailHasValue(v) {
      if (v === undefined || v === null || v === '') return false;
      if (Array.isArray(v)) return v.length > 0;
      return true;
    }

    function renderConfidenceValue(dd, v) {
      if (!detailHasValue(v)) { dd.textContent = '—'; return; }
      var badge = document.createElement('span');
      var cls = String(v).toLowerCase();
      badge.className = 'badge ' + (cls === 'high' || cls === 'medium' || cls === 'low' ? cls : 'medium');
      badge.textContent = String(v);
      dd.appendChild(badge);
    }

    function renderDetailValue(dd, fieldName, v) {
      if (!detailHasValue(v)) { dd.textContent = '—'; return; }
      if (Array.isArray(v)) {
        v.forEach(function (item) {
          var tag = document.createElement('span');
          tag.className = 'opt-tag' + (fieldName === 'sourceFile' ? ' source-file' : '');
          tag.textContent = String(item);
          dd.appendChild(tag);
        });
        return;
      }
      if (typeof v === 'boolean') {
        var flag = document.createElement('span');
        if (v) { flag.className = 'badge medium'; flag.textContent = '要'; }
        else { flag.textContent = '不要'; flag.style.color = 'var(--text-muted)'; }
        dd.appendChild(flag);
        return;
      }
      if (fieldName === 'sourceFile') {
        var code = document.createElement('code');
        code.textContent = String(v);
        dd.appendChild(code);
        return;
      }
      dd.textContent = String(v);
    }

    function buildDetailGroup(labelText, isEvidence, fieldPairs, unit) {
      var group = document.createElement('div');
      group.className = 'detail-group';
      var label = document.createElement('div');
      label.className = 'detail-group-label' + (isEvidence ? ' evidence' : '');
      label.textContent = labelText;
      group.appendChild(label);
      var dl = document.createElement('dl');
      dl.className = 'detail-grid';
      fieldPairs.forEach(function (pair) {
        var fieldName = pair[0], fieldLabel = pair[1];
        var dt = document.createElement('dt');
        dt.textContent = fieldLabel;
        var dd = document.createElement('dd');
        var val = unit ? unit[fieldName] : undefined;
        if (fieldName === 'confidence') { renderConfidenceValue(dd, val); }
        else { renderDetailValue(dd, fieldName, val); }
        if (dd.textContent !== '—' && copyableText(dd.textContent)) {
          dd.appendChild(makeCopyBtn((function (v) { return function () { return v; }; })(dd.textContent)));
        }
        dl.appendChild(dt);
        dl.appendChild(dd);
      });
      group.appendChild(dl);
      return group;
    }

    allRows.forEach(function (tr) {
      tr.addEventListener('click', function (ev) {
        if (ev.target.closest('.copy-btn,a,button')) return;
        var next = tr.nextElementSibling;
        if (next && next.classList.contains('row-detail')) {
          next.parentNode.removeChild(next);
          tr.removeAttribute('data-expanded');
          return;
        }
        var unit = findDetailUnit(tr);
        var detail = document.createElement('tr');
        detail.className = 'row-detail';
        var td = document.createElement('td');
        td.colSpan = COL_COUNT;
        var inner = document.createElement('div');
        inner.className = 'detail-inner';

        var specFields = DETAIL_SPEC_FIELDS[manifest.unitKind];
        if (specFields && specFields.length) {
          inner.appendChild(buildDetailGroup('仕様', false, specFields, unit));
        }

        inner.appendChild(buildDetailGroup('エビデンス（検出メタデータ）', true, EVIDENCE_FIELDS, unit));

        td.appendChild(inner);
        detail.appendChild(td);
        tr.parentNode.insertBefore(detail, tr.nextSibling);
        tr.setAttribute('data-expanded', 'true');
      });
    });

    /* --- CSVエクスポート --- */
    var csvBtn = document.getElementById('csv-export');
    if (csvBtn) {
      csvBtn.addEventListener('click', function () {
        var q = search ? search.value.trim().toLowerCase() : '';
        var rows = allRows.filter(function (tr) { return rowMatches(tr, q); });
        function csvEscape(v) {
          return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        }
        var lines = [headerCells.map(function (th) { return csvEscape(th.textContent.trim()); }).join(',')];
        rows.forEach(function (tr) {
          lines.push(Array.prototype.slice.call(tr.children).map(function (td) {
            return csvEscape(td.textContent.trim());
          }).join(','));
        });
        var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = document.title + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      });
    }

    /* URLクエリ q での絞り込み（相互参照リンクの受け口）: <ページ>.html?q=<語> で絞り込み済み状態にする */
    try {
      var initialQ = new URLSearchParams(location.search).get('q');
      if (initialQ && search) search.value = initialQ;
    } catch (e) {}

    renderPage();
  })();
</script>
