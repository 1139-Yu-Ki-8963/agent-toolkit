<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>generating-release-notes-for-reverse-docs</title></head><body><h1>リリースノート生成</h1><section id="s1"><h2>概要</h2><p>git logの実在履歴からリリースノートを生成する。</p></section><section id="s2"><h2>出力</h2><p>リリースノート.html。</p></section><section id="s3"><h2>入力</h2><p>target_repo_pathのgit履歴。</p></section><section id="s4"><h2>整理</h2><p>日付単位でグルーピングする。</p></section><section id="s5"><h2>分類</h2><p>コミットメッセージの固定パターンで種別を分類する。</p></section><section id="s6"><h2>制約</h2><p>判定不能なものはその他とし、意味を推定しない。</p></section><section id="s7"><h2>検証</h2><p>生成ページの整合を確認する。</p></section><section id="s8"><h2>予想を裏切る挙動</h2><p>履歴にない版・日付・変更内容を作らない。</p></section><section id="s9"><h2>参照</h2><p>SKILL.md。</p></section><section id="s10"><h2>完了</h2><p>生成物と検証結果を返す。</p></section></body></html>
