<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>generating-test-viewpoint-list-for-reverse-docs</title></head><body><h1>テスト観点表一覧生成</h1><section id="s1"><h2>概要</h2><p>画面ごとのテスト観点表を横断集約する。</p></section><section id="s2"><h2>出力</h2><p>一覧/テスト観点表/テスト観点表.html。</p></section><section id="s3"><h2>入力</h2><p>画面ごとの単体・結合テスト観点表.md。</p></section><section id="s4"><h2>集約</h2><p>画面、テスト種別、カテゴリ、観点文言をmanifestへ集約する。</p></section><section id="s5"><h2>制約</h2><p>観点の妥当性や網羅性を評価しない。</p></section><section id="s6"><h2>前提</h2><p>対象となる観点表が1件以上必要。</p></section><section id="s7"><h2>検証</h2><p>抽出・整合・HTML生成を決定的に確認する。</p></section><section id="s8"><h2>予想を裏切る挙動</h2><p>不足する観点を推測で追加しない。</p></section><section id="s9"><h2>参照</h2><p>SKILL.md。</p></section><section id="s10"><h2>完了</h2><p>一覧と検証結果を返す。</p></section></body></html>
