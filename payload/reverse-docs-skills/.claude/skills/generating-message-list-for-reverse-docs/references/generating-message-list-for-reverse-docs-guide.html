<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>generating-message-list-for-reverse-docs</title></head><body><h1>メッセージ一覧生成</h1><section id="s1"><h2>概要</h2><p>メッセージ定義書の固定列を一覧へ変換する。</p></section><section id="s2"><h2>出力</h2><p>一覧/メッセージ一覧/メッセージ一覧.html。</p></section><section id="s3"><h2>入力</h2><p>プロジェクト共通/メッセージ定義書.md。</p></section><section id="s4"><h2>列</h2><p>キー、文言(実測)、種別、抽出元、使用画面。</p></section><section id="s5"><h2>変換</h2><p>固定パターンでmanifest JSONへ変換する。</p></section><section id="s6"><h2>制約</h2><p>文言や粒度を評価・補完しない。</p></section><section id="s7"><h2>検証</h2><p>manifest整合を決定的に検証する。</p></section><section id="s8"><h2>予想を裏切る挙動</h2><p>定義書にないメッセージは追加しない。</p></section><section id="s9"><h2>参照</h2><p>SKILL.md。</p></section><section id="s10"><h2>完了</h2><p>一覧と検証結果を返す。</p></section></body></html>
