<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テストケース一覧リバース</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.7; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    .doc-main { max-width: 52rem; margin: auto; padding: 2rem 1.25rem 3rem; }
    header { border-bottom: 2px solid currentColor; margin-bottom: 1.5rem; }
    section { margin-block: 1.5rem; } h1, h2 { line-height: 1.3; } dt { font-weight: 700; }
    @media (max-width: 40rem) { .doc-main { padding: 1.25rem 1rem 2rem; } }
  </style>
</head>
<body>
  <main class="doc-main">
    <header><h1>テストケース一覧リバース</h1></header>
    <section id="s2"><h2>出力</h2><dl><dt>テストケース一覧</dt><dd>画面別既存仕様を追跡可能に集約した一覧。</dd></dl></section>
    <section id="s3"><h2>入力</h2><p>画面別Markdownテスト仕様書。</p></section>
    <section id="s4"><h2>停止</h2><p>仕様なしは見出しのみ。</p></section>
    <section id="s5"><h2>検証</h2><p>元ファイルを確認。</p></section>
    <section id="s6"><h2>差し戻し</h2><p>画面一覧へ戻す。</p></section>
    <section id="s7"><h2>報告</h2><p>集約件数。</p></section>
    <section id="s8"><h2>注意</h2><p>ケースを創作しない。</p></section>
    <section id="s9"><h2>挙動</h2><p>コードだけでは仕様にしない。</p></section>
    <section id="s10"><h2>参照</h2><p>SKILL.md</p></section>
  </main>
</body>
</html>
