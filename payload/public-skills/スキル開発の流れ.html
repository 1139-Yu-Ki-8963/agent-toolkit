<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>スキル開発の流れ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* layout: 3 panes — phases rail | skills of phase | skill detail; stacks on phones */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2421; --muted:#5c6a64; --line:#d6dcd8;
  --accent:#2f6f5e; --accent-soft:#e1efe9; --new:#a4561b; --new-soft:#f7e9dc;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --ink:#e4ebe7; --muted:#9aa9a2; --line:#2e3833;
  --accent:#7cc4ad; --accent-soft:#21362f; --new:#e5a06a; --new-soft:#3a2a1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --ink:#e4ebe7; --muted:#9aa9a2; --line:#2e3833;
  --accent:#7cc4ad; --accent-soft:#21362f; --new:#e5a06a; --new-soft:#3a2a1d; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance}
header p{color:var(--muted);margin:.3em 0 0;max-width:62ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.have{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.new{background:var(--new-soft);color:var(--new);border-color:transparent}
.grid{display:grid;grid-template-columns:260px 1fr 1.35fr;gap:18px;margin-top:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.pane{min-width:0}
.pane h2{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
ol.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:relative}
ol.phases button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr;gap:8px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer;align-items:center}
ol.phases button:hover{background:var(--surface)}
ol.phases button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ol.phases button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pname{font-weight:700}
.pmeta{grid-column:2;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.io{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 14px}
.io dt{color:var(--muted)}
.io dd{margin:0;min-width:0}
.skills{display:flex;flex-direction:column;gap:8px}
.skill{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.skill:hover{border-color:var(--accent)}
.skill:focus-visible{outline:2px solid var(--accent)}
.skill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.skill .jp{font-weight:700}
.skill .id{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.skill .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.detail h3{font-family:var(--display);font-size:20px;margin:0}
.detail .id{font-family:var(--mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.detail section{margin-top:16px}
.detail h4{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:700}
pre.cmd{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;margin:6px 0;white-space:pre}
.btn{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent)}
a{color:var(--accent)}
details{border-top:1px solid var(--line);padding:6px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;list-style-position:outside}
summary .num{margin-right:6px}
ul.steps{list-style:none;margin:6px 0 4px;padding:0 0 0 4px;display:flex;flex-direction:column;gap:2px;font-size:14px}
ul.steps li{display:grid;grid-template-columns:44px 1fr;gap:6px}
ul.steps .num{padding-top:2px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap">
  <header>
    <h1>スキル開発の流れ</h1>
    <p>フェーズを選ぶと、そのフェーズで使うスキルが出ます。スキルを選ぶと、入手の仕方と、スキルの中の phase と step が出ます。</p>
    <div class="legend"><span class="chip have">あるスキル</span><span class="chip new">新規スキル(まだない)</span><span>流れ全体は <button type="button" class="btn" id="orch">スキル開発の統括(新規スキル)</button> が受け持ちます。</span></div>
  </header>
  <div class="grid">
    <nav class="pane" aria-label="フェーズ"><h2>フェーズ</h2><ol class="phases" id="phases"></ol></nav>
    <div class="pane"><h2>このフェーズで使うスキル</h2><div class="card" id="phaseCard"></div></div>
    <div class="pane"><h2>スキルの中身</h2><div class="card detail" id="detail"></div></div>
  </div>
</div>

  }
  const s = SKILLS[curSkill];
  const cmd = `git clone ${REPO}.git\ncp -R agent-toolkit/payload/public-skills/.claude/rules/skill-writing <プロジェクト>/.claude/rules/\ncp -R agent-toolkit/payload/public-skills/.claude/skills/${curSkill} <プロジェクト>/.claude/skills/`;
  el.innerHTML = `<h3>${esc(s.title)}</h3><div class="id">${curSkill}</div>
    <section><h4>目的</h4><p>${esc(s.purpose)}</p>${NOTES[curSkill]?`<p class="note">${NOTES[curSkill]}</p>`:""}</section>
    <section><h4>入手</h4>
      <p class="note">プロジェクトの <code>.claude/</code> に、規約とスキルを置きます。規約はプロジェクトの中のファイルにしか効かないため、<code>~/.claude/</code> には置きません。</p>
      <pre class="cmd" id="cmd">${esc(cmd)}</pre>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="copy">コマンドをコピー</button>
      <a href="${REPO}/tree/main/payload/public-skills/.claude/skills/${curSkill}" target="_blank" rel="noopener">GitHub で開く</a></div>
    </section>
    <section><h4>スキルの中の流れ</h4>
      ${s.phases.map((p,i)=>`<details ${i===1?"open":""}><summary><span class="num">phase ${p.n}</span>${esc(p.name)}<span class="tag">${p.steps.length} step</span></summary>
        <ul class="steps">${p.steps.map(([n,name])=>`<li><span class="num">${n}</span><span>${esc(name.replace(/ \[(.+)\]$/,""))}${/\[(.+)\]$/.test(name)?`<span class="tag">${name.match(/\[(.+)\]$/)[1]}</span>`:""}</span></li>`).join("")}</ul></details>`).join("")}
    </section>`;
  $("#copy").addEventListener("click", async e=>{
    try{ await navigator.clipboard.writeText(cmd); e.target.textContent="コピーしました"; }
    catch{ const r=document.createRange(); r.selectNodeContents($("#cmd")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); e.target.textContent="選択しました。コピーしてください"; }
  });
}
function render(){ renderPhases(); renderPhase(); renderDetail(); }
$("#phases").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; curPhase=+b.dataset.i; curSkill=PHASES[curPhase].skills.find(id=>!id.startsWith("new-"))||PHASES[curPhase].skills[0]; render(); });
$("#phaseCard").addEventListener("click", e=>{ const b=e.target.closest(".skill"); if(!b) return; curSkill=b.dataset.id; renderPhase(); renderDetail(); });
$("#orch").addEventListener("click", ()=>{ curSkill="new-orchestrate"; renderPhase(); renderDetail(); $("#detail").scrollIntoView({block:"nearest"}); });
curPhase=4; curSkill="drafting-skill-with-template";
render();
</script>

</body>
</html>
